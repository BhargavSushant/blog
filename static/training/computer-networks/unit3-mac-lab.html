/* ===== Unit III Lesson 2: Binary Exponential Back-off (BEB) ===== */
function bebRun(seed){
  const rn=prng(seed),A=[],B=[],steps=[];let t=0,a=0,win=null;
  const both=(s)=>{A.push(s);B.push({...s})};
  for(;;){
    a++;const t0=t;
    both({a:t,b:t+1,cls:'bad',txt:'send'});both({a:t+1,b:t+2,cls:'jam',txt:'jam'});t+=2;
    steps.push({upto:t,cap:`<b>Collision number ${a}.</b> A and B both started to send at time ${t0}. The two signals overlap on the cable. Each station detects the collision, stops sending the frame and sends a short <b>jam signal</b> so that all stations know about the collision. Each station now has a collision counter n = ${a}.`});
    const m=Math.min(a,10),R=1<<m,ka=Math.floor(rn()*R),kb=Math.floor(rn()*R);
    if(ka>0)A.push({a:t,b:t+ka,cls:'bo',txt:'K='+ka});if(kb>0)B.push({a:t,b:t+kb,cls:'bo',txt:'K='+kb});
    steps.push({upto:t+Math.max(ka,kb),cap:`<b>Each station chooses K at random from 0 to ${R-1}</b> (that is 0 to 2<sup>${m}</sup> - 1). A chooses <b>K = ${ka}</b> and B chooses <b>K = ${kb}</b>. Each station waits K slot times before it tries again. There are ${R} possible values, so the chance that both pick the same value is 1/${R}.`});
    if(a>=16){steps.push({upto:t+Math.max(ka,kb)+1,cap:`<b>16 attempts have failed.</b> The MAC sublayer gives up and reports an error to the upper layer.`});break}
    if(ka===kb){t+=ka;steps.push({upto:t,cap:`<b>Both chose K = ${ka}.</b> Their waiting times end at the same time, so both send again at time ${t} and collide again. The counter will be ${a+1}, so the range of K doubles.`});continue}
    const lo=Math.min(ka,kb),hi=Math.max(ka,kb),f=ka<kb?A:B,o=ka<kb?B:A,fn=ka<kb?'A':'B',on=ka<kb?'B':'A';
    f.push({a:t+lo,b:t+lo+3,cls:'ok',txt:'frame'});
    const tb=t+hi,endF=t+lo+3;let st=tb;
    if(tb<endF){o.push({a:tb,b:endF,cls:'wait',txt:'defer'});st=endF}
    o.push({a:st,b:st+3,cls:'ok',txt:'frame'});win=st+3;
    steps.push({upto:t+lo+3,cap:`<b>${fn} has the smaller K (${lo}), so ${fn} sends first.</b> The frame of ${fn} is sent without a collision. ${on} waits until K = ${hi} and then listens to the cable.`});
    steps.push({upto:win,cap:tb<endF?`<b>${on} finds the cable busy</b> when its waiting time ends, so ${on} <b>defers</b> until the frame of ${fn} ends and then sends its own frame. Both frames are delivered after ${a} collision${a>1?'s':''}.`:`<b>The waiting time of ${on} ends after the frame of ${fn}.</b> The cable is free, so ${on} sends its frame. Both frames are delivered after ${a} collision${a>1?'s':''}.`});
    break}
  const T=Math.max(16,Math.ceil((win||t+3)+1));
  return {A,B,steps,T,collisions:a}}
function bebMC(N,trials,seed){
  const rn=prng(seed);let tot=0,gave=0,hist=Array(8).fill(0);
  for(let k=0;k<trials;k++){let a=0,ok=false;
    while(a<16){a++;const R=1<<Math.min(a,10);let mn=1e9,c=0;for(let i=0;i<N;i++){const v=Math.floor(rn()*R);if(v<mn){mn=v;c=1}else if(v===mn)c++}if(c===1){ok=true;break}}
    if(!ok)gave++;tot+=a;hist[Math.min(a,8)-1]++}
  return {mean:tot/trials,gave,hist}}
lesson({nav:"2. Binary Exponential Back-off (BEB)",title:"Binary Exponential Back-off algorithm",syl:"Binary Exponential Back-off (BEB) Algorithm",
html:()=>`
${GUIDE({"syl":"Binary Exponential Back-off (BEB) Algorithm","why":"When two stations collide, both must send the frame again. If both wait the same time, they collide again. The BEB algorithm chooses a random waiting time and doubles the range after every collision. Ethernet (CSMA/CD) uses it, so this lesson comes before the protocols of Lessons 3 and 4.","map":[["2.1","Why a random waiting time","What happens if both stations wait a fixed time?","Read the problem and the requirement."],["2.2","The BEB rules","How is the waiting time chosen?","Learn the formula, the slot time and the limits (10 and 16)."],["2.3","BEB step by step","How does a collision between two stations end?","Run the animation and change the random seed."],["2.4","Many stations","What happens when N stations collide together?","Run a simulation for N stations and read the average number of collisions."],["2.5","Advantages and drawback","Why is BEB used, and what is its weakness?","Read the capture effect."]],"osi":"Layer 2, MAC sublayer (used by Ethernet CSMA/CD).","pre":"Lesson 1: the collision and the shared channel.","time":"about 1 hour","next":"Lesson 3, ALOHA and Slotted ALOHA."})}
${LEARN(["explain why a collision needs a random waiting time","apply the BEB rule: K chosen from 0 to 2^n - 1, with n limited to 10 and 16 attempts","calculate the longest waiting time after the n-th collision","explain how the range of the waiting time adjusts to the number of stations"])}
${SEC("2.1","Why a random waiting time")}
<p>After a collision, each station must send its frame again. Suppose every station waits the same fixed time. Then the stations that collided send again at the same instant and collide again, and this repeats. The waiting time must therefore be <b>different for different stations</b>. A random choice gives this without any coordination between the stations.</p>
<p>There is a second requirement. If only two stations collide, a short random range (for example 0 or 1 slot) is enough. If 30 stations collide, a short range gives many repeated collisions. The range must grow when collisions continue. A station does not know how many other stations are involved, but the number of collisions it has had is a good estimate of the load.</p>
${SEC("2.2","The BEB rules")}
${DEF("Binary Exponential Back-off (BEB)","is an algorithm in which a station that has had n collisions for one frame waits a random number of slot times K, chosen from 0 to 2<sup>n</sup> - 1, before it tries again. The range doubles after every collision.")}
<ol><li>A station sends a frame. If there is no collision, the frame is delivered.</li>
<li>After the n-th collision for this frame, the station chooses <b>K</b> at random (all values equally likely) from the set <b>{0, 1, ..., 2<sup>n</sup> - 1}</b>.</li>
<li>The station waits <b>K &times; slot time</b> and then tries again (it first checks that the cable is free).</li>
<li>The exponent is limited. After 10 collisions the range stays at 0 to 1023 (this is called <b>truncated</b> BEB).</li>
<li>After <b>16</b> failed attempts the station stops and reports an error.</li></ol>
<p>The <b>slot time</b> in classic Ethernet is <b>512 bit times</b>. This is the time for the sender to be sure that no collision will happen: it is at least the round-trip delay of the longest cable plus the jam time. At 10 Mbps, one bit time is 0.1 &micro;s, so the slot time is 51.2 &micro;s.</p>
<table class="dt gt cmpt"><thead><tr><th>Collision n</th><th>Range of K</th><th>Number of values</th><th>Chance that two stations choose the same K</th><th>Longest wait at 10 Mbps</th></tr></thead><tbody>
${[1,2,3,4,5,6,10].map(n=>{const R=1<<n;return `<tr><td>${n}</td><td>0 to ${R-1}</td><td>${R}</td><td>1/${R} = ${(100/R).toFixed(2)}%</td><td>${(51.2*(R-1)).toFixed(1)} &micro;s</td></tr>`}).join('')}</tbody></table>
${NOTE("The chance of a repeated collision between two stations is 1/2<sup>n</sup>. It is 50% after the first collision and only 0.1% after the tenth. Two stations almost always succeed within a few attempts.")}
${SEC("2.3","BEB step by step")}
<p>Stations A and B send a frame at the same time. Time is shown in slot times. Press <b>Next step</b> to see each collision and each random choice. Press <b>New random run</b> to start again with another random seed.</p>
<div class="vis"><div class="row"><button class="btn pri" type="button" id="bnew">New random run</button><span class="small muted" id="bseed"></span></div><svg id="bsvg" role="img" aria-label="Timeline of two stations with collisions and back-off"></svg><div id="bst"></div>
<div class="legend small"><span class="pill" style="background:var(--bad-soft)">send (collision)</span> <span class="pill" style="background:var(--bad);color:var(--on)">jam</span> <span class="pill" style="background:var(--sec-soft)">K = back-off wait</span> <span class="pill" style="background:var(--warn-soft)">defer (cable busy)</span> <span class="pill" style="background:var(--good-soft)">frame delivered</span></div></div>
${DOIT(["Press <b>New random run</b> several times. Most runs end after one or two collisions.","Find a run in which both stations choose the same K. Read what the next range of K is.","In a run with K = 0 for one station and K = 1 for the other, find why the second station defers."])}
${SEC("2.4","Many stations")}
<p>When N stations collide, the chance of success in one round is the chance that exactly one of them has the smallest K. With a small range this chance is low. The range doubles after each collision, so the chance improves. The simulation below uses a simple model: N stations start together, and in every round all of them choose K from 0 to 2<sup>n</sup> - 1 (n = round number, limited to 10). A round succeeds when exactly one station has the smallest K. The program runs 2000 trials.</p>
<div class="vis"><div class="row"><span>Stations N <input type="range" min="2" max="40" value="5" id="bn" aria-label="Number of stations"> <b id="bnv">5</b></span></div><div id="bmc"></div></div>
${DOIT(["With N = 2 the mean number of collisions before success is about 1.6.","Increase N to 10 and then to 40. The mean rises slowly (about 3.3 for N = 10 and about 5.3 for N = 40) because the range doubles each time.","Even for N = 40 no trial reaches 16 attempts in this model. In a real network the stations do not all start together, so the figures are only a guide."])}
${SEC("2.5","Advantages and the drawback")}
<ul><li><b>Adaptive.</b> The range of the waiting time grows with the load. Light load gives a short delay. Heavy load spreads the stations over a long range.</li>
<li><b>Distributed.</b> No station needs to know the number of other stations.</li>
<li><b>Drawback: the capture effect.</b> A station that has just sent a frame successfully starts its next frame with n = 0. A station that has been colliding has a large range. The first station is likely to win again, so one station can capture the channel for a time, and the other stations may wait for a long time. BEB is not fair in the short term.</li></ul>
${quiz("m2q1","After the 3rd collision a station chooses K from:",["0 to 3","0 to 7","1 to 8","0 to 15"],1,"After the n-th collision K is chosen from 0 to 2^n - 1. For n = 3 this is 0 to 7.")}
${quiz("m2q2","In truncated BEB, what happens after 10 collisions?",["The station gives up","The range stays at 0 to 1023","The range keeps doubling","The slot time doubles"],1,"The exponent is limited to 10, so the range stops growing at 0 to 1023. The station gives up only after 16 attempts.")}
${quiz("m2q3","Two stations collide for the first time. What is the chance that they collide again?",["0","1/4","1/2","1"],2,"After the first collision each station chooses 0 or 1. They choose the same value with probability 1/2.")}
${EXAM(["State the BEB algorithm. What are the limits 10 and 16?","Find the longest waiting time (in microseconds) after the 4th collision on 10 Mbps Ethernet with a slot time of 512 bit times. (Answer: 15 x 51.2 = 768 &micro;s.)","Two stations collide. Find the probability that they collide at the second attempt and at the third attempt. (Answer: 1/2 and then 1/4 for a repeated collision.)","Why must the waiting time be random and not fixed?","Explain the capture effect."])}
${SUM(["After the n-th collision the station chooses K from 0 to 2^n - 1 and waits K slot times.","The exponent is limited to 10. The station gives up after 16 attempts. The slot time is 512 bit times (51.2 &micro;s at 10 Mbps).","The random choice separates the stations. The doubling range adapts to the number of colliding stations.","BEB is not fair in the short term because of the capture effect."])}
`,

/* ===== Unit III Lesson 3: ALOHA and Slotted ALOHA ===== */
function alohaSim(slotted,G,seed,Tend){
  const rn=prng(seed),n=Math.max(1,Math.round(G*Tend)),fr=[];
  for(let i=0;i<n;i++){let t=rn()*(Tend-1);if(slotted)t=Math.floor(t);fr.push({a:t,b:t+1,ok:true})}
  fr.sort((x,y)=>x.a-y.a);
  for(let i=0;i<fr.length;i++)for(let j=i+1;j<fr.length&&fr[j].a<fr[i].b;j++){fr[i].ok=false;fr[j].ok=false}
  const ends=[];fr.forEach(f=>{let k=ends.findIndex(e=>e<=f.a);if(k<0){k=ends.length;ends.push(0)}ends[k]=f.b;f.lane=k});
  const good=fr.filter(f=>f.ok).length;
  return {fr,n,good,bad:n-good,S:good/Tend,lanes:ends.length}}
const SPURE=G=>G*Math.exp(-2*G),SSLOT=G=>G*Math.exp(-G);
lesson({nav:"3. ALOHA and Slotted ALOHA",title:"Random access for data services: ALOHA and Slotted ALOHA",syl:"Distributed Random Access Schemes/Contention Schemes: for Data Services (ALOHA and Slotted ALOHA)",
html:()=>`
${GUIDE({"syl":"Distributed Random Access Schemes/Contention Schemes: for Data Services (ALOHA and Slotted ALOHA)","why":"ALOHA is the first random access protocol. A station sends whenever it has data and handles collisions by sending again after a random time. It is simple, but it uses the channel poorly. Slotted ALOHA doubles the best throughput. The ideas of vulnerable time and throughput S = G e^(-kG) from this lesson are needed in the performance lesson (Lesson 7).","map":[["3.1","Pure ALOHA","What are the rules?","Read the rules and the retransmission procedure."],["3.2","Pure ALOHA in time","What happens to frames that overlap?","Step through a timeline with a collision."],["3.3","Vulnerable time and throughput","How long is a frame at risk, and what is the throughput?","Follow the derivation S = G e^(-2G)."],["3.4","Slotted ALOHA","How do time slots help?","Read the derivation S = G e^(-G)."],["3.5","Simulation","How do the two protocols behave when the load rises?","Run a random simulation and compare it with the formula."],["3.6","Comparison and examples","How do I solve exam problems?","Work the numerical examples."]],"osi":"Layer 2, MAC sublayer. ALOHA was designed for radio data networks (satellite and ground radio).","pre":"Lessons 1 and 2: shared channel, collision, random waiting time.","time":"about 1 hour 30 minutes","next":"Lesson 4, CSMA, CSMA/CD and CSMA/CA."})}
${LEARN(["state the rules of pure ALOHA and Slotted ALOHA","explain vulnerable time and show why it is 2T for pure ALOHA and T for Slotted ALOHA","derive and use S = G e^(-2G) and S = G e^(-G)","state the maximum throughput of each protocol and the load at which it occurs"])}
${SEC("3.1","Pure ALOHA")}
<p><b>ALOHA</b> was developed at the University of Hawaii in the early 1970s (Norman Abramson) to connect computers on different islands by radio. All stations send on the same radio channel. The protocol is called <b>pure ALOHA</b> to separate it from Slotted ALOHA.</p>
${DEF("Pure ALOHA","is a random access protocol in which a station sends a frame whenever it has one. It then waits for an acknowledgement. If no acknowledgement arrives within the time-out, it assumes a collision, waits a random time and sends the frame again.")}
<ol><li>A station that has a frame sends it at once. It does not listen to the channel first (there is no carrier sense).</li>
<li>After it sends, the station waits for an acknowledgement. The time-out is the maximum round-trip time, 2 &times; T<sub>p</sub> (propagation delay), plus a small margin.</li>
<li>If the acknowledgement arrives, the frame is delivered.</li>
<li>If there is no acknowledgement, the station waits a <b>random back-off time</b> and sends the frame again. A random time is needed because a fixed time makes the stations that collided collide again (Lesson 2).</li>
<li>After a maximum number of attempts K<sub>max</sub> the station gives up and tries later.</li></ol>
<p>Two frames collide if they overlap in time, even by one bit. Both frames are then damaged and both must be sent again.</p>
${SEC("3.2","Pure ALOHA in time")}
<p>Three stations A, B and C use the channel. Each frame takes one frame time T (shown as 2 units here). Step through the timeline.</p>
<div class="vis"><svg id="a1" role="img" aria-label="Pure ALOHA timeline"></svg><div id="a1s"></div></div>
${SEC("3.3","Vulnerable time and throughput")}
${DEF("Vulnerable time","is the time interval in which a frame can be damaged by another frame. A frame sent at time t is at risk during the vulnerable time.")}
<p>Let the frame time be T. Take a test frame sent at time t, so it occupies the interval t to t + T.</p>
<ul><li>A frame that another station starts in the interval (t - T) to t is still being sent at time t, so its end overlaps the start of the test frame.</li>
<li>A frame that another station starts in the interval t to (t + T) overlaps the test frame.</li></ul>
<p>The test frame survives only if no other frame starts in the interval from t - T to t + T. The vulnerable time of pure ALOHA is therefore <b>2T</b>. The picture shows four other frames. Two of them collide with the test frame and two do not.</p>
<div class="vis"><svg id="a2" role="img" aria-label="Vulnerable time of pure ALOHA is two frame times"></svg></div>
<p class="small muted">The shaded interval, from t - T to t + T, is the set of start times that cause a collision with the test frame. A frame that starts outside it does not overlap the test frame.</p>
${DEF("Offered load G","is the average number of frames that all stations try to send in one frame time T. It includes new frames and frames that are sent again.")}
${DEF("Throughput S","is the average number of frames that are sent successfully in one frame time T. S is at most 1.")}
<p>Assume that G follows a Poisson distribution. The probability that k frames start in an interval where the mean is &lambda; is P(k) = (&lambda;<sup>k</sup> e<sup>-&lambda;</sup>) / k!. For pure ALOHA the interval is 2T, so the mean number of frames in it is 2G. A frame is successful when no other frame starts in the interval, so k = 0:</p>
<div class="callout i"><b>P(no other frame in 2T) = e<sup>-2G</sup></b><br>The throughput is the load times the chance of success:<br><b>S = G &times; e<sup>-2G</sup></b></div>
<p>To find the largest S, set the derivative to zero: dS/dG = e<sup>-2G</sup> (1 - 2G) = 0, so <b>G = 0.5</b>. Then S = 0.5 e<sup>-1</sup> = <b>0.184</b> (1/(2e)). The best case is that <b>18.4%</b> of the channel carries good frames. If the load rises above 0.5, more collisions occur and the throughput falls.</p>
${SEC("3.4","Slotted ALOHA")}
<p>Slotted ALOHA (Roberts, 1972) halves the vulnerable time. Time is divided into <b>slots</b> of one frame time T. A station may start a frame only at the <b>start of a slot</b>. All stations must agree on the slot boundaries, which needs a clock signal. Two frames either use the same slot completely (a collision) or different slots (no overlap). A partial overlap is not possible.</p>
<div class="vis"><svg id="a3" role="img" aria-label="Slotted ALOHA slots"></svg></div>
<p>A frame is at risk only from frames that start at the same slot boundary. The <b>vulnerable time is T</b>. The mean number of frames in this interval is G, so the chance that there is no other frame is e<sup>-G</sup>:</p>
<div class="callout i"><b>S = G &times; e<sup>-G</sup></b></div>
<p>The derivative is e<sup>-G</sup> (1 - G) = 0 at <b>G = 1</b>. Then S = e<sup>-1</sup> = <b>0.368</b>. At G = 1 the slots are used like this: 36.8% have exactly one frame (success), 36.8% are empty, and 26.4% have two or more frames (collision). Slotted ALOHA has twice the maximum throughput of pure ALOHA.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>Pure ALOHA</th><th>Slotted ALOHA</th></tr></thead><tbody>
<tr><td>When a station may send</td><td>Any time</td><td>Only at the start of a slot</td></tr><tr><td>Synchronisation</td><td>Not needed</td><td>Needed (common clock)</td></tr>
<tr><td>Vulnerable time</td><td>2T</td><td>T</td></tr><tr><td>Throughput</td><td>S = G e<sup>-2G</sup></td><td>S = G e<sup>-G</sup></td></tr>
<tr><td>Maximum throughput</td><td>0.184 (18.4%) at G = 0.5</td><td>0.368 (36.8%) at G = 1</td></tr></tbody></table>
${SEC("3.5","Simulation of the two protocols")}
<p>The program places frames at random start times (a Poisson-like load) in a window of 40 frame times. A frame that overlaps another frame is shown in red. The measured throughput is compared with the formula. The measured value changes from run to run because the load is random. The formula is the average.</p>
<div class="vis"><div class="row">${seg("asg",[["p","Pure ALOHA"],["s","Slotted ALOHA"]])}<span>Offered load G <input type="range" id="ag" min="0.1" max="3" step="0.1" value="0.5" aria-label="Offered load G"> <b id="agv">0.5</b></span><button class="btn pri" type="button" id="aplay">Play</button><button class="btn" type="button" id="anew">New random run</button></div>
<svg id="a4" role="img" aria-label="Simulation of frames on the channel"></svg><div id="aout" class="callout i small"></div><div id="ach"></div></div>
${DOIT(["Select pure ALOHA, G = 0.5 and press <b>New random run</b> several times. The measured S is near 0.18.","Raise G to 3. Almost every frame is red. The throughput falls although the stations try to send more.","Select Slotted ALOHA and G = 1. Frames start only at slot boundaries, so a collision always involves complete overlap. Compare the measured S with 0.37."])}
${SEC("3.6","Comparison and numerical examples")}
<p><b>Disadvantages of ALOHA.</b> The channel is used well only at low load. A station does not listen before it sends, so it can destroy a frame that is already in progress. Pure ALOHA wastes a frame in a partial overlap. Slotted ALOHA needs synchronisation, and a station that has a frame must wait for the next slot. Lesson 4 adds carrier sense to improve this.</p>
<table class="dt gt cmpt"><thead><tr><th>Example</th><th>Working</th><th>Answer</th></tr></thead><tbody>
<tr><td>Frames are 200 bits. The channel is 200 kbps. T = ?</td><td>T = 200 bits / 200000 bps</td><td><b>1 ms</b></td></tr>
<tr><td>Pure ALOHA. The system sends 1000 frames/s. Find S and the good frames per second.</td><td>G = 1000 &times; 0.001 = 1. S = 1 &times; e<sup>-2</sup> = 0.135. Good frames = 0.135 / 0.001 s</td><td><b>135 frames/s</b></td></tr>
<tr><td>Pure ALOHA with 500 frames/s.</td><td>G = 0.5. S = 0.5 e<sup>-1</sup> = 0.184</td><td><b>184 frames/s</b></td></tr>
<tr><td>Slotted ALOHA with 1000 frames/s.</td><td>G = 1. S = e<sup>-1</sup> = 0.368</td><td><b>368 frames/s</b></td></tr>
<tr><td>Pure ALOHA with 250 frames/s.</td><td>G = 0.25. S = 0.25 e<sup>-0.5</sup> = 0.152</td><td><b>152 frames/s</b></td></tr></tbody></table>
${quiz("m3q1","What is the vulnerable time of pure ALOHA?",["T","2T","T/2","3T"],1,"A frame is damaged by any frame that starts in the interval from t - T to t + T, which is 2T.")}
${quiz("m3q2","At which offered load does Slotted ALOHA give the maximum throughput?",["G = 0.5","G = 1","G = 2","G = 0.368"],1,"S = G e^(-G) has its maximum e^(-1) = 0.368 at G = 1.")}
${quiz("m3q3","Why does Slotted ALOHA have a higher throughput than pure ALOHA?",["It listens before sending","Frames can start only at slot boundaries, so the vulnerable time is T and not 2T","It uses a higher bit rate","It uses acknowledgements"],1,"Frames overlap completely or not at all, so only frames that start in the same slot can collide.")}
${EXAM(["Define vulnerable time. Show that it is 2T for pure ALOHA and T for Slotted ALOHA.","Derive S = G e^(-2G) and find the maximum throughput.","A pure ALOHA network sends 200-bit frames on a 200 kbps channel. Find the throughput when the system produces (a) 1000 frames/s, (b) 500 frames/s. (Answer: 135 and 184 frames/s.)","Repeat question 3 for Slotted ALOHA. (Answer: 368 frames/s and 303 frames/s.)","Why must a station in ALOHA wait a random time after a collision?"])}
${SUM(["Pure ALOHA: send at any time, wait for an ACK, send again after a random time if there is none. Vulnerable time 2T, S = G e^(-2G), maximum 18.4% at G = 0.5.","Slotted ALOHA: send only at slot starts. Vulnerable time T, S = G e^(-G), maximum 36.8% at G = 1.","G is the offered load (frames per frame time, including repeats). S is the throughput.","Neither protocol listens to the channel. Lesson 4 adds carrier sense."])}
`,

const CSMA_STEPS=[
 [0,`<b>Station A has a frame and listens to the cable.</b> The cable is idle, so A starts to send. Time t = 0. The signal moves along the cable. It needs 12 time units (the propagation delay T<sub>p</sub>) to travel from A to B.`,{A:'sends'}],
 [6,`<b>The signal of A is half way.</b> At t = 6 the front of the signal is at the middle of the cable. Station B has not received any signal yet.`,{A:'sends'}],
 [8,`<b>Station B now gets a frame and listens to the cable.</b> At t = 8 the signal of A has not reached B. B hears nothing, so B <b>decides that the cable is idle</b> and starts to send. Carrier sense gives the wrong answer because of the propagation delay.`,{A:'sends',B:'sends'}],
 [10,`<b>The two signals meet.</b> At t = 10 the signal of A and the signal of B meet near the right end of the cable. Where they overlap, the signal is garbled. This is a <b>collision</b>.`,{A:'sends',B:'sends'}],
 [14,`<b>Both stations continue to send.</b> Plain CSMA has no collision detection, so A and B send their complete frames. Both frames are damaged. The receivers cannot read them.`,{A:'sends',B:'sends'}],
 [24,`<b>The result.</b> A and B each wait for an acknowledgement. None arrives, so after the time-out each station sends the frame again after a random wait. The collision happened although both stations listened first. The time that a frame is at risk is about the propagation delay T<sub>p</sub>: any station that starts within T<sub>p</sub> after A cannot hear A yet.`,{A:'time-out',B:'time-out'}]];
lesson({nav:"4. CSMA, CSMA/CD and CSMA/CA",title:"Random access for LANs: CSMA, CSMA/CD and CSMA/CA",syl:"Distributed Random Access Schemes/Contention Schemes: for Local-Area Networks (CSMA, CSMA/CD, CSMA/CA)",
html:()=>`
${GUIDE({"syl":"Distributed Random Access Schemes/Contention Schemes: for Local-Area Networks (CSMA, CSMA/CD, CSMA/CA)","why":"ALOHA sends without looking at the channel. In a LAN the stations are close together and can listen before they send. This lesson adds carrier sense (CSMA), then collision detection for wired LANs (CSMA/CD, Ethernet) and collision avoidance for wireless LANs (CSMA/CA, Wi-Fi). It uses the BEB algorithm of Lesson 2.","map":[["4.1","Carrier sense","What does a station check before it sends?","Read the CSMA rule."],["4.2","CSMA and the propagation delay","Why do collisions still happen?","Watch two signals meet on a cable."],["4.3","Persistence methods","What does a station do when the cable is busy?","Compare 1-persistent, non-persistent and p-persistent."],["4.4","CSMA/CD","How does a station detect a collision and recover?","Watch collision detection and calculate the minimum frame size."],["4.5","CSMA/CA","How are collisions avoided on a wireless LAN?","Step through DIFS, back-off and the hidden terminal problem."],["4.6","Comparison","When is each method used?","Compare the three methods."]],"osi":"Layer 2, MAC sublayer. CSMA/CD is used by classic Ethernet (IEEE 802.3) and CSMA/CA by Wi-Fi (IEEE 802.11).","pre":"Lesson 2 (BEB) and Lesson 3 (collision, vulnerable time, throughput).","time":"about 2 hours","next":"Lesson 5, collision-free protocols."})}
${LEARN(["state the CSMA rule and explain why collisions still happen","compare 1-persistent, non-persistent and p-persistent CSMA","explain CSMA/CD and calculate the minimum frame size from T<sub>p</sub> and the bit rate","explain CSMA/CA, the contention window, NAV and RTS/CTS, and the hidden terminal problem"])}
${SEC("4.1","Carrier sense")}
${DEF("Carrier Sense Multiple Access (CSMA)","is a random access method in which a station <b>listens to the channel before it sends</b> (this is called carrier sense). It sends only if the channel is idle. The principle is: sense before transmit.")}
<p>CSMA is better than ALOHA because a station does not interrupt a frame that is already in progress. A station that finds the channel busy does not send. It can use a station-to-station delay that is small compared with the frame time. This is true in a LAN, where the distance is short. It is not true in a satellite link, where the delay is long, so ALOHA is used there.</p>
${SEC("4.2","CSMA and the propagation delay")}
<p>Collisions still happen in CSMA. The reason is the <b>propagation delay</b>, the time that a signal needs to travel between two stations. A station that starts to send cannot be heard by a far station until the signal arrives. In the animation Station A and Station B are at the two ends of a cable.</p>
<div class="vis"><svg id="w1" role="img" aria-label="Two signals meeting on a cable"></svg><div id="w1s"></div></div>
${SEC("4.3","Persistence methods")}
${DEF("Persistence method","is the rule that tells a station what to do when it senses the channel and finds it busy (and what to do when it finds it idle).")}
<table class="dt gt cmpt"><thead><tr><th>Method</th><th>When the channel is busy</th><th>When the channel is idle</th><th>Result</th></tr></thead><tbody>
<tr><td><b>1-persistent</b></td><td>Keeps listening and sends <b>as soon as</b> the channel becomes idle.</td><td>Sends at once (with probability 1).</td><td>Low delay, but if two or more stations wait, they all send when the channel becomes idle, so they <b>always collide</b>. Used by Ethernet.</td></tr>
<tr><td><b>Non-persistent</b></td><td>Does <b>not</b> keep listening. Waits a random time and then listens again.</td><td>Sends at once.</td><td>Fewer collisions, but the channel can stay idle while stations wait, so the delay is higher.</td></tr>
<tr><td><b>p-persistent</b> (slotted channel)</td><td>Keeps listening until the channel is idle.</td><td>In an idle slot, sends with probability <b>p</b>. With probability q = 1 - p it waits for the next slot and repeats. If the channel becomes busy in the meantime, it behaves as if there was a collision (waits and starts again).</td><td>A balance between the two. A small p reduces collisions but increases the delay.</td></tr></tbody></table>
<p>The animation shows one busy period. Station X is sending. Stations A and B get frames at t = 2 and t = 3. Select a method.</p>
<div class="vis"><div class="row">${seg("psg",[["1","1-persistent"],["n","Non-persistent"],["p","p-persistent (p = 0.5)"]])}</div><svg id="ps" role="img" aria-label="Persistence methods timeline"></svg><div id="pst"></div>
<div class="legend small"><span class="pill" style="background:var(--warn-soft)">sensing a busy channel</span> <span class="pill" style="background:var(--sec-soft)">random wait</span> <span class="pill" style="background:var(--good-soft)">frame delivered</span> <span class="pill" style="background:var(--bad-soft)">collision</span> <span class="pill" style="background:var(--surface2)">idle wait</span></div></div>
${SEC("4.4","CSMA/CD: collision detection")}
${DEF("CSMA/CD (CSMA with Collision Detection)","is CSMA in which a station keeps listening <b>while it sends</b>. If it detects a collision, it stops the frame at once, sends a short <b>jam signal</b> and waits a random time (BEB, Lesson 2) before it tries again.")}
<ol><li>The station has a frame. It listens to the cable. If the cable is busy, it waits until it is idle (1-persistent).</li>
<li>The cable is idle, so the station <b>starts to send</b> and keeps <b>listening while sending</b>.</li>
<li>If no collision is detected until the whole frame is sent, the frame is delivered.</li>
<li>If a collision is detected, the station <b>stops</b> the frame and sends a <b>jam signal</b> (32 bits in Ethernet) so that every station sees the collision.</li>
<li>The station increases the collision counter n. If n = 16, it gives up. Otherwise it waits a time chosen by <b>BEB</b> (K &times; slot time) and goes to step 1.</li></ol>
<p>The animation shows the same cable as in 4.2. Station A starts at t = 0. Station B starts at t = 11, just before the signal of A reaches it. Select the length of the frame of A.</p>
<div class="vis"><div class="row">${seg("cdg",[["l","Long frame (30 time units)"],["s","Short frame (10 time units)"]])}</div><svg id="w2" role="img" aria-label="Collision detection on a cable"></svg><div id="w2s"></div></div>
<p>The animation shows the rule for the <b>minimum frame size</b>. A station must still be sending when the collision signal comes back. In the worst case the other station starts just before the signal arrives. The collision signal then needs one more propagation delay to come back. The sender must therefore send for at least the <b>round-trip time 2T<sub>p</sub></b>:</p>
<div class="callout i"><b>Transmission time T<sub>t</sub> &ge; 2 T<sub>p</sub></b>, so the <b>minimum frame size = 2 &times; T<sub>p</sub> &times; bit rate</b>.</div>
<div class="vis"><div class="row"><span>Bit rate <select id="cb" aria-label="Bit rate"><option value="10">10 Mbps</option><option value="100">100 Mbps</option><option value="1000">1 Gbps</option></select></span><span>Cable length <input type="range" id="cd" min="100" max="5000" step="100" value="2500" aria-label="Cable length"> <b id="cdv">2500</b> m</span><span class="small muted">Signal speed 2 &times; 10<sup>8</sup> m/s</span></div><div id="cres"></div></div>
<p>Classic Ethernet (10 Mbps) uses a minimum frame of <b>64 bytes = 512 bits</b>. This is 51.2 &micro;s at 10 Mbps. The value is larger than 2T<sub>p</sub> of the 2500 m maximum cable because it includes the delay of repeaters and a safety margin. A frame shorter than 64 bytes is padded.</p>
${SEC("4.5","CSMA/CA: collision avoidance")}
<p>Wi-Fi (IEEE 802.11) cannot use collision detection, for two reasons.</p>
<ul><li>A wireless station cannot <b>send and listen at the same time</b>. Its own signal is much stronger than any other signal at its receiver.</li>
<li>Because of the <b>hidden terminal problem</b> the collision happens at the receiver and the sender cannot hear it (see below).</li></ul>
${DEF("CSMA/CA (CSMA with Collision Avoidance)","is CSMA in which a station tries to avoid the collision. It waits for the channel to be idle for an interframe space, then waits a random back-off time before sending. The receiver sends an acknowledgement. If no acknowledgement arrives, the station assumes a collision.")}
<p>The method used by Wi-Fi is the <b>Distributed Coordination Function (DCF)</b>. The rules are these.</p>
<ol><li>The station senses the channel. If it is idle for a <b>DIFS</b> (DCF interframe space), the station can send.</li>
<li>If the channel is busy, the station waits until it is idle, waits a DIFS, and then chooses a <b>back-off counter</b> at random from 0 to the <b>contention window CW</b>. The counter is counted down in slots, but only while the channel is idle. If the channel becomes busy, the counter is <b>frozen</b> and continues after the next DIFS.</li>
<li>When the counter reaches 0, the station sends the frame.</li>
<li>The receiver waits a <b>SIFS</b> (short interframe space) and sends an <b>ACK</b>. SIFS is shorter than DIFS, so the ACK gets the channel before any new frame.</li>
<li>If no ACK arrives, the station doubles the contention window (like BEB) and tries again.</li></ol>
<table class="dt gt cmpt"><thead><tr><th>Interframe space</th><th>Value in 802.11b</th><th>Use</th></tr></thead><tbody><tr><td><b>SIFS</b></td><td>10 &micro;s</td><td>ACK, CTS (the highest priority)</td></tr><tr><td><b>DIFS</b></td><td>SIFS + 2 &times; slot = 50 &micro;s (slot = 20 &micro;s)</td><td>Normal data frames</td></tr></tbody></table>
<p>The animation shows the timeline. Time is in slots (SIFS = 1 slot, DIFS = 2 slots). Stations B and C get a frame while A is sending.</p>
<div class="vis"><svg id="ca" role="img" aria-label="CSMA/CA timeline with back-off freezing"></svg><div id="cas"></div></div>
<h3 class="h4">The hidden terminal problem, NAV and RTS/CTS</h3>
<p>In the picture, A and C are both in range of B (the access point), but A and C are out of range of each other. They are <b>hidden terminals</b>. C cannot hear A, so C finds the channel idle while A is sending to B. If C sends, the two frames collide at B.</p>
<p>The <b>RTS/CTS</b> exchange reduces this. The sender sends a short <b>RTS</b> (Request To Send) frame. The receiver answers with a <b>CTS</b> (Clear To Send) frame. Every station that hears the CTS sets its <b>NAV</b> (Network Allocation Vector), a timer that tells it how long the channel is reserved, and does not send during that time. The long data frame is then sent without a collision. A collision between two short RTS frames costs little time.</p>
<div class="vis"><svg id="hd" role="img" aria-label="Hidden terminal problem"></svg><div id="hds"></div></div>
${SEC("4.6","Comparison")}
<table class="dt gt cmpt"><thead><tr><th></th><th>ALOHA</th><th>CSMA</th><th>CSMA/CD</th><th>CSMA/CA</th></tr></thead><tbody>
<tr><td>Listens before sending</td><td>No</td><td>Yes</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Listens while sending</td><td>No</td><td>No</td><td>Yes</td><td>No</td></tr>
<tr><td>Action on collision</td><td>Waits for time-out, sends again</td><td>Same</td><td>Stops at once, jam, BEB</td><td>Avoids with back-off; no ACK means collision</td></tr>
<tr><td>Medium</td><td>Radio, satellite</td><td>Bus LAN</td><td>Wired Ethernet (shared)</td><td>Wireless LAN (802.11)</td></tr></tbody></table>
${quiz("m4q1","Why can a collision still happen in CSMA?",["A station does not listen","The signal of a station needs time to reach the other stations, so a far station may find the channel idle","The cable is too short","The frame is too long"],1,"The propagation delay creates a time during which a station has started but cannot be heard.")}
${quiz("m4q2","A 1-persistent station and a non-persistent station both find the channel busy. What is the difference?",["There is none","1-persistent keeps listening and sends when idle; non-persistent waits a random time before listening again","1-persistent waits a random time; non-persistent sends at once","Non-persistent never sends"],1,"1-persistent sends as soon as the channel becomes idle. Non-persistent waits a random time and then senses again.")}
${quiz("m4q3","Why is a minimum frame size needed in CSMA/CD?",["To save memory","So that the sender is still sending when the collision signal returns, which needs at least 2Tp","To fill the preamble","To reduce the jam signal"],1,"The collision signal returns after at most 2Tp. If the frame is shorter, the sender cannot detect the collision.")}
${quiz("m4q4","In CSMA/CA, what happens to the back-off counter of a station when the channel becomes busy?",["It is reset to a new random value","It is frozen and continues after the channel is idle again for a DIFS","It is set to 0","It is doubled"],1,"The counter is counted down only in idle slots. It keeps its value while the channel is busy.")}
${EXAM(["Explain why collisions occur in CSMA although the stations sense the channel.","Compare 1-persistent, non-persistent and p-persistent CSMA.","Explain CSMA/CD with a flowchart. What is the jam signal for?","A CSMA/CD network of 10 Mbps has a cable of 2 km. The signal speed is 2 &times; 10<sup>8</sup> m/s. Find the minimum frame size. (Answer: T<sub>p</sub> = 2000 / 2 &times; 10<sup>8</sup> = 10 &micro;s. 2T<sub>p</sub> = 20 &micro;s. Minimum frame = 20 &micro;s &times; 10 Mbps = 200 bits.)","Why is CSMA/CD not used on a wireless LAN? Describe the hidden terminal problem and how RTS/CTS helps.","State the function of SIFS, DIFS and the NAV."])}
${SUM(["CSMA: sense the channel, send only if idle. Collisions remain because of the propagation delay.","Persistence: 1-persistent sends as soon as the channel is idle; non-persistent waits a random time; p-persistent sends in an idle slot with probability p.","CSMA/CD: listen while sending, stop and jam on collision, wait with BEB. The frame must last at least 2T<sub>p</sub>, so minimum frame = 2 T<sub>p</sub> &times; bit rate.","CSMA/CA: DIFS, random back-off that freezes while the channel is busy, ACK after SIFS, optional RTS/CTS with NAV. It is used because a wireless station cannot detect collisions."])}
`,

  const st1=story(r,"#w1s",{draw:i=>wavePic(s1,CSMA_STEPS[i][0],sg1,{tag:CSMA_STEPS[i][2]})});st1.set(CSMA_STEPS.map(x=>({cap:x[1]})));
  /* 4.3 persistence */
  const S=(a,b,cls,txt)=>({a,b,cls,txt}),X=[S(0,8,'ok','X sends')];

     steps:[[8,`<b>X sends from t = 0 to t = 8.</b> A gets a frame at t = 2. It senses a busy channel and does <b>not keep listening</b>. It waits a random time (4 units).`],[12,`<b>A listens again at t = 6.</b> The channel is still busy, so A waits again (5 units). B, which got its frame at t = 3, waits 9 units. The channel becomes idle at t = 8 but nobody uses it until t = 11. This idle time is the cost of this method.`],[19,`<b>A senses at t = 11, finds the channel idle and sends.</b> B listens at t = 12. A is sending, so B waits again and sends at t = 16. There is <b>no collision</b>. The price is the idle time (t = 8 to 11) and a longer delay.`]]},

/* ===== Unit III Lesson 5: collision-free protocols ===== */
function bmSim(N,ready,d){
  const ln=Array.from({length:N},(_,j)=>({label:'Station '+j,segs:[]})),steps=[{upto:0,cap:`<b>Setup.</b> There are ${N} stations, numbered 0 to ${N-1}. The channel time is divided into <b>contention periods</b> and <b>transmission periods</b>. A contention period has ${N} slots of one bit each, one slot for each station. Stations ${[...ready].join(', ')||'(none)'} have a frame to send.`}];
  let map='';
  for(let j=0;j<N;j++){const r=ready.has(j);ln[j].segs.push({a:j,b:j+1,cls:r?'pri':'idle',txt:r?'1':'0'});map+=r?'1':'0';
    steps.push({upto:j+1,cap:`<b>Contention slot ${j}.</b> Only station ${j} may send a bit in this slot. ${r?`Station ${j} <b>has a frame</b>, so it sends a <b>1</b>.`:`Station ${j} has no frame, so it stays silent (<b>0</b>).`} Every station hears the bit. Bit map so far: <b>${map}</b> (${N-j-1} slots to come).`})}
  steps.push({upto:N,cap:`<b>The contention period is over.</b> Every station has the same bit map: <b>${map}</b>. A 1 in position j means that station j will send. No station can send before its turn, so there will be <b>no collision</b>. The overhead of the contention period is ${N} bit times.`});
  let t=N;[...ready].sort((a,b)=>a-b).forEach(j=>{ln[j].segs.push({a:t,b:t+d,cls:'ok',txt:'frame'});t+=d;
    steps.push({upto:t,cap:`<b>Station ${j} sends its frame</b> (${d} time units). The stations send in the order of their numbers, so the order is known to all.`})});
  steps.push({upto:t,cap:`<b>All reserved frames are sent.</b> A new contention period starts. A station that gets a frame after its slot has passed must wait for the next contention period. A station with a low number waits longer on average (about 1.5N bit times) than a station with a high number (about 0.5N). The mean over all stations is N bit times at low load.`});
  return {lanes:ln,steps,T:Math.max(N+d*ready.size+1,N+2)}}
function brapSim(N,ready,d){
  const ln=Array.from({length:N},(_,j)=>({label:'Station '+j,segs:[]})),steps=[{upto:0,cap:`<b>Setup.</b> There are ${N} stations in a fixed order, 0 to ${N-1}. After every transmission and after every silent mini-slot, all stations know which station had the turn last. The next turn goes to the next station in the order. Stations ${[...ready].join(', ')||'(none)'} have a frame. The turn starts at station 0.`}];
  let t=0,p=N-1,left=new Set(ready),g=0;
  while(left.size&&g++<200){const s=(p+1)%N;
    if(left.has(s)){ln[s].segs.push({a:t,b:t+d,cls:'ok',txt:'frame'});t+=d;left.delete(s);steps.push({upto:t,cap:`<b>Station ${s} has the turn and a frame.</b> It sends the frame (${d} time units). All stations hear it, so they know that the next turn is for station ${(s+1)%N}.`})}
    else{ln[s].segs.push({a:t,b:t+1,cls:'idle',txt:'-'});t+=1;steps.push({upto:t,cap:`<b>Station ${s} has the turn but no frame.</b> It stays silent. After one silent mini-slot (1 time unit) all stations know that the turn passes to station ${(s+1)%N}.`})}
    p=s}
  steps.push({upto:t,cap:`<b>All frames are sent.</b> There was <b>no collision</b>, and no separate reservation period. The cost is one mini-slot for every station that has the turn but nothing to send.`});
  return {lanes:ln,steps,T:t+1}}
function bcSim(addrs,L){
  const steps=[{k:0,cap:`<b>Setup.</b> Each station has a binary address of ${L} bits. Stations with a frame to send are listed on the left. When the channel is free, all of them start a <b>contest</b>. They send their address on the channel one bit at a time, from the <b>most significant bit</b> (the left-most bit) to the least significant bit.`}];
  let alive=addrs.map((_,i)=>i);const hist=[];
  for(let k=0;k<L;k++){const or=alive.some(i=>addrs[i][k]==='1')?1:0,drop=alive.filter(i=>addrs[i][k]==='0'&&or===1),al0=[...alive];
    alive=alive.filter(i=>!drop.includes(i));hist.push({alive0:al0,or,drop});
    steps.push({k:k+1,cap:`<b>Bit ${k+1}.</b> The stations still in the contest send bit ${k+1} of their addresses at the same time. The channel gives the Boolean <b>OR</b> of the bits: <b>${or}</b>. ${or===1?`A station that sent 0 but hears 1 knows that a station with a higher address is in the contest, so it <b>drops out</b>${drop.length?` (${drop.map(i=>addrs[i]).join(', ')})`:''}.`:'Every station in the contest sent 0, so nobody drops out.'} ${alive.length===1?`Only ${addrs[alive[0]]} is left.`:alive.length+' stations remain.'}`})}
  steps.push({k:L,win:alive[0],cap:alive.length?`<b>The winner is ${addrs[alive[0]]}.</b> It is the station with the <b>highest address</b>. It sends its frame. The others try again at the next contest. No collision occurred, and no time was lost except the ${L} bit times of the contest.`:'No station has a frame.'});
  return {steps,hist}}
function mlSim(){
  const S=(a,b,cls,txt)=>({a,b,cls,txt});
  const cfg={T:22,tick:1,L:120,tlabel:'time (1 slot = 1 unit, frame = 3 units)',lanes:[
   {label:'Level 1 (groups)',segs:[S(0,1,'pri','1'),S(1,2,'idle','0'),S(2,3,'idle','0'),S(3,4,'pri','1')]},
   {label:'Level 2, group 0',segs:[S(4,5,'idle','0'),S(5,6,'idle','0'),S(6,7,'pri','1'),S(7,8,'pri','1')]},
   {label:'Level 2, group 3',segs:[S(8,9,'idle','0'),S(9,10,'pri','1'),S(10,11,'idle','0'),S(11,12,'idle','0')]},
   {label:'Frames',segs:[S(12,15,'ok','st. 2'),S(15,18,'ok','st. 3'),S(18,21,'ok','st. 13')]}]};
  const st=[[0,`<b>Setup.</b> There are 16 stations (0 to 15). They are divided into <b>4 groups of 4</b>: group 0 = stations 0 to 3, group 1 = 4 to 7, group 2 = 8 to 11 and group 3 = 12 to 15. Stations 2, 3 and 13 have a frame.`],
   [4,`<b>Level 1: one slot for each group (4 slots).</b> A group sets its bit to 1 if <b>any</b> of its stations has a frame. Group 0 (stations 2 and 3) sends 1. Groups 1 and 2 are silent. Group 3 (station 13) sends 1. The result is 1001.`],
   [8,`<b>Level 2 for group 0 (4 slots).</b> Only the groups with a 1 go on. The 4 stations of group 0 now use one slot each. Station 2 and station 3 send 1. Result 0011.`],
   [12,`<b>Level 2 for group 3 (4 slots).</b> The stations 12, 13, 14 and 15 use one slot each. Station 13 sends 1. Result 0100. Groups 1 and 2 had a 0 at level 1, so their stations were skipped completely (they did not use 4 + 4 slots).`],
   [21,`<b>Transmission.</b> The frames are sent in the order of the reservations: station 2, station 3 and station 13. The reservation used 4 + 4 + 4 = <b>12 slots</b>. The basic bit map would have used <b>16 slots</b> for the same stations.`]];
  return {cfg,st}}
lesson({nav:"5. Collision-free protocols",title:"Collision-free protocols: bit map, BRAP, binary countdown, MLMA",syl:"Collision Free Protocols: Basic Bit Map, BRAP, Binary Count Walk (Binary Countdown), MLMA",
html:()=>`
${GUIDE({"syl":"Collision Free Protocols: Basic Bit Map, BRAP, Binary Countdown, MLMA","why":"Contention protocols lose capacity to collisions when the load is high. Collision-free protocols agree on the order of transmission first, so no frame collides. This lesson describes four of them and the cost of each. Lesson 6 describes a protocol that uses contention at low load and a collision-free turn at high load.","map":[["5.1","Why collision-free","What is wrong with contention at high load?","Read the idea of reservation."],["5.2","Basic bit map","How does a reservation period work?","Choose the ready stations and step through a contention period."],["5.3","BRAP","How can stations take turns without a reservation period?","Step through a turn-taking example."],["5.4","Binary countdown","How can the highest address win without a collision?","Step through the bit-by-bit contest."],["5.5","MLMA","How can the reservation overhead be reduced?","Step through a two-level reservation and use the overhead calculator."],["5.6","Comparison","Which protocol is better at low and at high load?","Read the table."]],"osi":"Layer 2, MAC sublayer.","pre":"Lessons 3 and 4: collisions in ALOHA and CSMA.","time":"about 2 hours","next":"Lesson 6, limited contention: the adaptive tree walk."})}
${LEARN(["explain why collision-free protocols have no collisions","trace the basic bit-map protocol and calculate its overhead","trace the binary countdown protocol and find the winner","describe BRAP and MLMA and explain what each one saves","compare the protocols at low load and at high load"])}
${NOTE("<b>About the names BRAP and MLMA.</b> Textbooks do not describe these two protocols in the same way. This lesson uses the descriptions given in 5.3 and 5.5, which follow the original ideas (reservation by broadcast recognition, and multi-level reservation). If your recommended textbook or your class notes define them differently, learn the definition of your textbook for the examination. The other two protocols (bit map and binary countdown) are described in the same way by Tanenbaum and by other books.")}
${SEC("5.1","Why collision-free protocols")}
<p>In a contention protocol (ALOHA, CSMA) a frame can be lost in a collision, and the loss rises with the load. A <b>collision-free protocol</b> makes sure that only one station sends at a time. The stations first agree who sends and in which order. This is called <b>reservation</b>. The cost is the time spent on the agreement, which is called the <b>overhead</b>. At high load the overhead is small compared with the collisions that it avoids.</p>
<p>In this lesson N is the number of stations and d is the time of one data frame, measured in the same unit as the reservation slot (one bit time).</p>
${SEC("5.2","Basic bit-map protocol")}
${DEF("Basic bit-map protocol","is a reservation protocol. A contention period of N slots has one slot for each station. A station that has a frame sends a 1 in its own slot. After the N slots every station knows which stations will send, and they send in the order of their numbers.")}
<p>Choose the stations that have a frame. Then step through the contention period and the transmissions.</p>
<div class="vis"><div class="row"><b>Stations with a frame:</b> ${[0,1,2,3,4,5,6,7].map(j=>`<label class="pill"><input type="checkbox" data-bm="${j}" ${[1,3,6].includes(j)?'checked':''}>${j}</label>`).join('')}</div><svg id="bm" role="img" aria-label="Bit-map protocol timeline"></svg><div id="bms"></div></div>
<p><b>Efficiency.</b> At <b>low load</b> only one station has a frame in a cycle, so the channel carries one frame of d bit times for each N + d bit times: efficiency = <b>d / (N + d)</b>. At <b>high load</b> all N stations have a frame. The overhead is N bit times for N frames, which is one bit time for each frame: efficiency = <b>d / (d + 1)</b>. This is close to 100% for a large d.</p>
<div class="vis"><div class="row"><span>Stations N <input type="range" id="bn" min="4" max="64" value="16" aria-label="N"> <b id="bnv">16</b></span><span>Frame d <input type="range" id="bd" min="8" max="200" value="64" aria-label="d"> <b id="bdv">64</b> bit times</span></div><div id="bres"></div></div>
${SEC("5.3","BRAP")}
<p><b>BRAP</b> belongs to the family of <b>broadcast recognition</b> protocols (BRAM and BRAP). These are collision-free protocols that need no separate reservation period. The description used here:</p>
<ul><li>The stations are in a fixed order 0, 1, ..., N-1. Every station hears every transmission, so after each transmission all stations <b>recognise</b> which station sent last.</li>
<li>The next turn goes to the next station in the order. If that station has a frame, it sends it. If not, it stays silent for one short <b>mini-slot</b>. All stations hear the silence and know that the turn passes on.</li>
<li>The turn goes around the stations in a cycle.</li></ul>
<p>There is no collision because only the station that has the turn may send. Compared with the bit map, there is <b>no reservation period</b>. The overhead is one mini-slot for each station that has the turn but nothing to send. Choose the ready stations (the order is 0 to 5).</p>
<div class="vis"><div class="row"><b>Stations with a frame:</b> ${[0,1,2,3,4,5].map(j=>`<label class="pill"><input type="checkbox" data-br="${j}" ${[1,4].includes(j)?'checked':''}>${j}</label>`).join('')}</div><svg id="br" role="img" aria-label="BRAP turn-taking timeline"></svg><div id="brs"></div></div>
${SEC("5.4","Binary countdown")}
<p>In the bit map, the overhead is one bit for each station. <b>Binary countdown</b> uses the address of the station in place of a reservation slot, and the overhead is only log<sub>2</sub> N bits.</p>
${DEF("Binary countdown","is a collision-free protocol in which every station has a binary address of the same length. A station that wants to send broadcasts its address, one bit at a time, from the most significant bit. The channel gives the OR of the bits sent at the same instant. A station that sends 0 and hears 1 drops out. The station with the highest address wins.")}
<p>The protocol needs a channel where a 1 overrides a 0 (the OR of the signals). Choose the stations that have a frame (the addresses are 4 bits long).</p>
<div class="vis"><div class="row"><b>Stations with a frame:</b> ${['0001','0010','0100','0111','1001','1010','1100','1111'].map(a=>`<label class="pill"><input type="checkbox" data-bc="${a}" ${['0010','0100','1001','1010'].includes(a)?'checked':''}>${a}</label>`).join('')}</div><div id="bcv"></div><div id="bcs"></div></div>
<p><b>Efficiency.</b> If the address is not part of the frame, the contest costs log<sub>2</sub> N bit times for each frame, so the efficiency is <b>d / (d + log<sub>2</sub> N)</b>. If the address is the first field of the frame (the source address already is), the contest costs nothing extra and the efficiency is 100%.</p>
<p><b>Drawback and the fix.</b> A station with a high address always wins, so a station with a low address can wait for a long time (it is unfair). A variation (Mok and Ward) changes the priorities after each transmission: the station that has just sent gets the lowest priority, and the other stations move up by one. Every station then gets its turn.</p>
${SEC("5.5","MLMA: multi-level multi-access")}
<p>The bit map needs N bit times for each reservation period, even when only a few stations have a frame. <b>MLMA</b> (multi-level multi-access) reduces this by dividing the stations into groups and making the reservation in <b>levels</b>. The description used here has two levels.</p>
<ol><li><b>Level 1.</b> There is one slot for each group. A group sends a 1 if at least one of its stations has a frame.</li>
<li><b>Level 2.</b> Only for the groups that sent a 1: each station of the group has one slot. A station with a frame sends a 1.</li>
<li>Then the stations send their frames in order.</li></ol>
<p>For N stations in G groups of M stations (N = G &times; M), the overhead is <b>G + (number of active groups) &times; M</b> slots. The basic bit map always uses N slots. With a few active stations the saving is large. The best choice of group size is about &radic;N. The principle can use more than two levels.</p>
<div class="vis"><svg id="ml" role="img" aria-label="Two-level reservation"></svg><div id="mls"></div></div>
<div class="vis"><div class="row"><span>Stations N <select id="mn" aria-label="N"><option>16</option><option selected>64</option><option>256</option></select></span><span>Stations with a frame <input type="range" id="mk" min="1" max="16" value="3" aria-label="k"> <b id="mkv">3</b></span><button class="btn sm" type="button" id="mre">Choose other stations</button></div><div id="mres"></div></div>
${SEC("5.6","Comparison")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Basic bit map</th><th>BRAP (as described here)</th><th>Binary countdown</th><th>MLMA (two levels)</th></tr></thead><tbody>
<tr><td>Overhead per cycle</td><td>N bit times</td><td>1 mini-slot for each idle station</td><td>log<sub>2</sub> N bits for each frame</td><td>G + (active groups) &times; M</td></tr>
<tr><td>Efficiency at high load</td><td>d / (d + 1)</td><td>about d / (d + 1)</td><td>d / (d + log<sub>2</sub> N)</td><td>close to d / (d + 1)</td></tr>
<tr><td>Efficiency at low load</td><td>d / (N + d)</td><td>low (many silent mini-slots)</td><td>d / (d + log<sub>2</sub> N)</td><td>better than the bit map</td></tr>
<tr><td>Fairness</td><td>Fair in turns, low numbers wait longer</td><td>Fair (cyclic)</td><td>Unfair (high address wins), fixed by changing priorities</td><td>Same as bit map</td></tr>
<tr><td>Needs</td><td>Common clock for slots</td><td>All stations hear all stations</td><td>Wired-OR channel</td><td>Common clock</td></tr></tbody></table>
<p>All four protocols have a delay at low load: a station that has a frame must wait for its turn, while in a contention protocol (ALOHA, CSMA) it can send at once. This is why LANs use contention protocols at low load, and why Lesson 6 combines the two.</p>
${quiz("m5q1","In the basic bit-map protocol with N stations, how many slots are in a contention period?",["1","log2 N","N","2N"],2,"There is one slot for each station.")}
${quiz("m5q2","In binary countdown, stations 0100, 0110 and 1001 have a frame. Which station wins?",["0100","0110","1001","All collide"],2,"The highest address wins. At bit 1 the OR is 1, so 0100 and 0110 drop out.")}
${quiz("m5q3","What does MLMA save compared with the basic bit map?",["The data frame time","Reservation slots, because groups with no frame are skipped","The acknowledgements","The preamble"],1,"A group with no frame uses one slot at level 1 and none at level 2.")}
${EXAM(["Explain the basic bit-map protocol. Find its efficiency at low load and at high load. (N = 16 stations and d = 64: low load 64/80 = 80%, high load 64/65 = 98.5%.)","Stations 1001, 1100, 0110 and 0011 use binary countdown. Show the bits and find the winner. (Answer: 1100.)","Why is the binary countdown protocol unfair? How can the unfairness be reduced?","N = 64 stations form 8 groups of 8. Stations 3, 5 and 60 have a frame. Find the reservation overhead of the bit map and of a two-level MLMA. (Answer: 64 slots, and 8 + 2 &times; 8 = 24 slots.)","Compare the collision-free protocols with the contention protocols at low load and at high load."])}
${SUM(["Collision-free protocols agree on the order first, so no frame collides. The agreement costs overhead.","Bit map: N reservation slots, then the frames in the order of the station numbers. Efficiency d/(N+d) at low load and d/(d+1) at high load.","BRAP (as described here): stations take turns in a fixed cycle. A silent mini-slot passes the turn.","Binary countdown: addresses are sent bit by bit, the OR of the bits is heard, and the highest address wins. Overhead log2 N bits.","MLMA: reservation in levels. Groups with no frame are skipped, so the overhead is G + (active groups) x M."])}
`,
