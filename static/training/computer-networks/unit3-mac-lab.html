<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CN Lab - Unit 3</title>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#EFEBE1; --fg:#12110E; --muted:#44403A; --line:#B9B2A2; --line2:#D9D3C4;
  --pri:#1F3FB5; --pri-soft:#DDE5FA; --sec:#9A4208; --sec-soft:#FBE3CC;
  --good:#0F6A31; --good-soft:#D5F0DD; --warn:#744500; --warn-soft:#F9E8B8; --bad:#A31D12; --bad-soft:#FADAD5;
  --code:#EFEBE1; --on:#FFFFFF; --grid:#CFC9BA; --shadow:0 1px 2px rgba(18,17,14,.08),0 6px 18px rgba(18,17,14,.06);
  --c1:#1F3FB5; --c2:#9A4208; --c3:#0F6A31; --c4:#7A2A9C; --c5:#8A6D00; --c6:#B0235C;
  --disp:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --zoom:1;
}
:root[data-theme="dark"]{
  --bg:#0C0C0A; --surface:#181714; --surface2:#242320; --fg:#F7F4EA; --muted:#CFCABD; --line:#5B574B; --line2:#35332C;
  --pri:#9DB1FF; --pri-soft:#1B2350; --sec:#FFAE6B; --sec-soft:#40240E;
  --good:#6FE09A; --good-soft:#0F3320; --warn:#F5C964; --warn-soft:#3B2E0A; --bad:#FF9A8C; --bad-soft:#451A15;
  --code:#1F1E1A; --on:#0C0C0A; --grid:#46433A; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  --c1:#9DB1FF; --c2:#FFAE6B; --c3:#6FE09A; --c4:#D9A0FF; --c5:#F0D060; --c6:#FF8FB8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);zoom:var(--zoom)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;min-height:calc(100vh / var(--zoom))}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.brand{font-family:var(--disp);font-size:20px;line-height:1.15;margin:0 4px 4px}
.brand small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:4px}
.nav ol{list-style:none;margin:16px 0 0;padding:0}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.nav li button:hover{background:var(--surface2)}
.nav li button[aria-current="true"]{background:var(--pri-soft);font-weight:600}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.nav li.done .n{background:var(--good);color:var(--on);border-color:var(--good)}
.nav .t{font-size:13.5px;line-height:1.3}
.nav .hero .n{border-color:var(--sec);color:var(--sec)}
.tools{margin:18px 4px 0;display:grid;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;text-align:left}
.tools button:hover{border-color:var(--fg)}
.tools .hint{font-size:12px;color:var(--muted)}
main{padding:26px 30px 70px;min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px}
h2{font-family:var(--disp);font-size:20px;margin:0 0 8px}
h3{font-size:13.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.syl{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card.try{border-left:5px solid var(--pri)}
.card.sec{border-left:5px solid var(--sec)}
.lead{font-size:16.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.tag.p{background:var(--pri-soft);color:var(--pri)} .tag.s{background:var(--sec-soft);color:var(--sec)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)} .btn.sec{background:var(--sec);color:var(--on);border-color:var(--sec)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.dt td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:340px}
.tw.sm{max-height:none}
.new{animation:pop .6s ease both}
@keyframes pop{from{background:var(--sec-soft);transform:translateY(-4px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;overflow:auto;white-space:pre-wrap;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface2);border:1px solid var(--line2)}
.callout.k{background:var(--sec-soft);border-color:transparent} .callout.i{background:var(--pri-soft);border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on)}
.seg.s button[aria-pressed="true"]{background:var(--sec)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px}
input[type=range]{accent-color:var(--pri);vertical-align:middle}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
.live{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.live .tw{max-height:none}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arrow{font-size:28px;color:var(--sec);text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--surface)}
td.ix{background:var(--bad-soft)} td.iy{background:var(--warn-soft)} td.iz{background:var(--pri-soft)} td.chg{background:var(--good-soft)}
.cardsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.nextrow{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
svg.chart{width:100%;height:auto;display:block;max-height:420px}
svg.chart text{fill:var(--fg);font:12px var(--body)}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .gr{stroke:var(--grid);stroke-width:1}
svg.chart .lbl{fill:var(--muted)}
.sheet{border-collapse:collapse;font-size:13.5px;font-family:var(--mono);width:100%}
.sheet th{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:600;color:var(--muted)}
.sheet td{border:1px solid var(--line);padding:0;min-width:80px}
.sheet td input{width:100%;border:0;background:transparent;padding:4px 7px;font:inherit;border-radius:0}
.sheet td.sel{outline:2px solid var(--pri);outline-offset:-2px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.live{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav ol{display:flex;overflow:auto;gap:4px}.nav li{flex:none}.nav .t{display:none}main{padding:18px 16px 60px}.grid2,.grid3,.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}

textarea,input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;font:inherit;color:var(--fg)}
textarea.py{width:100%;font-family:var(--mono);font-size:13.5px;min-height:62px;resize:vertical;background:var(--code)}
input.wide{width:100%;font-family:var(--mono)}
.cell{border:1px solid var(--line);border-radius:10px;margin:10px 0;overflow:hidden;background:var(--surface)}
.cell .hd{display:flex;gap:10px;align-items:center;background:var(--surface2);padding:5px 10px;font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.cell .bd{padding:8px 10px}
.out{font-family:var(--mono);font-size:13px;white-space:pre-wrap;padding:6px 10px;border-top:1px dashed var(--line2);color:var(--fg)}
.out.err{color:var(--bad);background:var(--bad-soft)}
.out.ok{background:var(--good-soft)}
.kv{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.kv span{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:2px 8px}
.mk{background:var(--warn-soft);color:var(--fg);outline:2px solid var(--warn);border-radius:3px;padding:0 2px}
.boxes{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.bx{min-width:38px;border:1px solid var(--line);border-radius:6px;text-align:center;background:var(--surface);padding:2px 6px;font-family:var(--mono)}
.bx small{display:block;font-size:11px;color:var(--muted)}
.bx.hi{background:var(--pri);color:var(--on);border-color:var(--pri)}
.bx.hi small{color:var(--on)}
.bx.ok{background:var(--good-soft);border-color:var(--good)}
.bx.no{background:var(--bad-soft);border-color:var(--bad)}
.bx.cur{background:var(--warn-soft);border-color:var(--warn)}
.cmark{font-family:var(--mono);font-size:13px;line-height:1.65;background:var(--code);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;white-space:pre}
.cmark .ln{display:block;padding:0 4px;border-radius:3px}
.cmark .ln.on{background:var(--warn-soft);outline:1px solid var(--warn)}
.t{font-family:var(--mono)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.grid4{grid-template-columns:1fr 1fr}}
.world{display:flex;gap:10px;margin:8px 0;flex-wrap:wrap}
.sq{width:130px;height:90px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;text-align:center;background:var(--surface);position:relative}
.sq.dirty{background:var(--warn-soft);border-color:var(--warn)}
.sq.here{outline:4px solid var(--pri)}
.sq small{position:absolute;top:2px;left:6px;color:var(--muted)}
.fnode{fill:var(--surface);stroke:var(--fg);stroke-width:2}
.fnode.front{fill:var(--warn-soft);stroke:var(--warn)}
.fnode.exp{fill:var(--good-soft);stroke:var(--good)}
.fnode.cur{fill:var(--pri);stroke:var(--pri)}
.fnode.path{fill:var(--sec-soft);stroke:var(--sec);stroke-width:3.5}
.edge{stroke:var(--muted);stroke-width:2;fill:none}
.edge.path{stroke:var(--sec);stroke-width:4}
svg.g text{fill:var(--fg);font:600 14px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.g text.cur{fill:var(--on)}
table.tt{border-collapse:collapse;font-family:var(--mono);font-size:13.5px}
table.tt th,table.tt td{border:1px solid var(--line);padding:4px 10px;text-align:center}
table.tt th{background:var(--surface2)}
table.tt td.T{background:var(--good-soft)} table.tt td.F{background:var(--bad-soft)}
.stack{display:flex;flex-direction:column-reverse;align-items:center;min-width:70px;border-bottom:4px solid var(--fg);padding:0 8px}
.blk{width:56px;height:38px;border:2px solid var(--fg);border-radius:6px;display:grid;place-items:center;font-weight:700;margin-top:2px;background:var(--pri-soft)}
.blk.held{background:var(--sec-soft);border-color:var(--sec)}
.tag.big{font-size:13px;padding:3px 10px}
.opt2{display:inline-block;margin:3px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;font-weight:600}
.opt2:hover{border-color:var(--fg)}
.opt2.ok{background:var(--good-soft);border-color:var(--good)}
.opt2.no{background:var(--bad-soft);border-color:var(--bad)}
.opt2[aria-pressed=true]{background:var(--pri);color:var(--on);border-color:var(--pri)}
.dotg i{display:block;aspect-ratio:1;border-radius:2px;border:1px solid var(--line2)}
.pill input{margin-right:4px}

/* ===== CN additions ===== */
.arqwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:8px 0}
@media (max-width:900px){.arqwrap{grid-template-columns:1fr}}
.seqbox{border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:520px;overflow:auto}
.seqbox svg{display:block;width:100%;height:auto;min-width:600px}
svg .axis{stroke:var(--muted);stroke-width:2}
svg .tk{font:11px var(--mono);fill:var(--muted)}
svg text.sl{font:600 11.5px var(--mono);fill:var(--fg)}
svg text.sl.hd{font:700 14px var(--body);letter-spacing:.06em}
svg text.pk,svg text.ev{paint-order:stroke;stroke:var(--surface);stroke-width:3.5px;stroke-linejoin:round}
svg text.ev.ok{fill:var(--good)} svg text.ev.bad{fill:var(--bad)} svg text.ev.warn{fill:var(--warn)}
svg .pkt{stroke-width:2.6;stroke-linecap:round}
svg .pkt.pd,svg .pdot.pd{stroke:var(--c1);fill:var(--c1)} svg .pkt.pr,svg .pdot.pr{stroke:var(--c2);fill:var(--c2)}
svg .pkt.pa,svg .pdot.pa{stroke:var(--c3);fill:var(--c3)} svg .pkt.pl,svg .pdot.pl{stroke:var(--bad);fill:var(--bad)}
svg .pdot{stroke:none}
svg .xm{font:700 18px var(--body);fill:var(--bad)}
svg .cursor{stroke:var(--fg);stroke-width:1;stroke-dasharray:4 4;opacity:.55}
.h4{margin:10px 0 5px;font-size:13.5px}
.wstrip{display:flex;gap:4px;flex-wrap:wrap}
.wb{width:36px;height:36px;border:2px solid var(--line);border-radius:7px;display:grid;place-items:center;font:700 13px var(--mono);background:var(--surface)}
.wb.ack{background:var(--good-soft);border-color:var(--good)} .wb.sent{background:var(--warn-soft);border-color:var(--warn)}
.wb.buf{background:var(--sec-soft);border-color:var(--sec)} .wb.exp{outline:3px solid var(--pri);outline-offset:1px}
.wb.inwin{box-shadow:0 6px 0 -1px var(--pri)}
.legend{margin:8px 0}.legend .lg{display:inline-block;width:22px;height:4px;border-radius:2px;margin:0 4px 3px 10px;vertical-align:middle}
.lg.pd{background:var(--c1)}.lg.pr{background:var(--c2)}.lg.pa{background:var(--c3)}.lg.pl{background:var(--bad)}
.logb{font:12.5px var(--mono);max-height:170px;overflow:auto;border:1px solid var(--line2);border-radius:8px;padding:6px 8px;background:var(--code)}
.logb .bad{color:var(--bad)}.logb .ok{color:var(--good)}.logb .warn{color:var(--warn)}
tr.bestrow td{background:var(--good-soft)}
.diag{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px}
.diag svg{display:block;width:100%;height:auto}
svg .nd{fill:var(--surface);stroke:var(--fg);stroke-width:2}
svg .nd.on{fill:var(--pri);stroke:var(--pri)} svg .nd.bad{fill:var(--bad-soft);stroke:var(--bad)} svg .nd.ok{fill:var(--good-soft);stroke:var(--good)}
svg text.nt{font:600 13px var(--body);fill:var(--fg);text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg text.nt.on{fill:var(--on)}
svg text.sm{font:12px var(--body);fill:var(--muted);text-anchor:middle}
svg .ed{stroke:var(--muted);stroke-width:2;fill:none}
svg .fr{fill:var(--sec-soft);stroke:var(--sec);stroke-width:2}
.bitrow{display:flex;flex-wrap:wrap;gap:2px;font-family:var(--mono);font-size:15px;margin:4px 0}
.bitrow span{min-width:20px;text-align:center;border:1px solid var(--line2);border-radius:4px;padding:1px 2px;background:var(--surface)}
.bitrow span.ins{background:var(--warn-soft);border-color:var(--warn);font-weight:700}
.bitrow span.flag{background:var(--pri);color:var(--on);border-color:var(--pri)}
.bitrow span.cnt{background:var(--sec-soft);border-color:var(--sec)}
.bitrow span.bad{background:var(--bad-soft);border-color:var(--bad)}
.bitrow span.good{background:var(--good-soft);border-color:var(--good)}
.bitrow span.run{background:var(--pri-soft);border-color:var(--pri)}
.pgrid{display:inline-grid;gap:3px}
.pgrid button{width:36px;height:36px;border:2px solid var(--line);border-radius:6px;background:var(--surface);font:700 14px var(--mono);cursor:pointer;color:var(--fg)}
.pgrid button.par{background:var(--sec-soft);border-color:var(--sec)}
.pgrid button.err{background:var(--bad-soft);border-color:var(--bad)}
.pgrid button.hit{outline:3px solid var(--bad)}
.pgrid .lab{display:grid;place-items:center;font:600 12px var(--body);color:var(--muted)}
.qbuf{display:flex;gap:4px;margin:6px 0}.qbuf i{width:34px;height:34px;border:2px solid var(--line);border-radius:6px;background:var(--surface)}
.qbuf i.f{background:var(--pri);border-color:var(--pri)}
.meter{height:14px;background:var(--surface2);border:1px solid var(--line);border-radius:7px;overflow:hidden}.meter i{display:block;height:100%;background:var(--pri)}
svg .ed.path{stroke:var(--sec);stroke-width:4.5}
svg .nd.on{fill:var(--pri-soft);stroke:var(--pri);stroke-width:4}
svg .nd.en{fill:var(--sec);stroke:var(--sec)}

/* ===== book blocks ===== */
main h2.sec{font-family:var(--disp);font-size:1.5em;margin:38px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--line2)}
main h2.sec span{display:inline-block;min-width:2.6em;color:var(--pri);font-family:var(--mono);font-size:.72em;margin-right:6px}
main h3.sub{font-size:1.1em;margin:22px 0 6px}
main p{max-width:68ch}
.learn{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:12px 18px;margin:14px 0}
.learn ul,.sum ul,.doit ol,.exam ol{margin:6px 0 0;padding-left:22px}.learn li,.sum li,.doit li,.exam li{margin:3px 0}
.def,.idea,.note,.warnb{border-radius:0 10px 10px 0;padding:10px 16px;margin:14px 0;border-left:6px solid var(--pri);background:var(--pri-soft)}
.idea{border-left-color:var(--sec);background:var(--sec-soft)}
.note{border-left-color:var(--muted);background:var(--surface2)}
.warnb{border-left-color:var(--bad);background:var(--bad-soft)}
.tg{display:block;font:700 11.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sum{border:2px solid var(--good);background:var(--good-soft);border-radius:10px;padding:10px 18px;margin:18px 0}
.doit{border:2px dashed var(--pri);border-radius:10px;padding:10px 18px;margin:12px 0;background:var(--surface)}
.exam{border:1px solid var(--line);border-radius:10px;padding:10px 18px;margin:18px 0;background:var(--surface2)}

.bit1{background:var(--pri);color:var(--on)} .macbox span{display:inline-block;font:600 15px var(--mono);padding:4px 7px;border:1px solid var(--line);margin:1px;border-radius:4px;background:var(--surface)}

<body>
<div class="app">
  <nav class="nav" aria-label="Lessons">
    <h2 class="brand">CN Lab<small>Unit 3, MAC Sublayer<br>B.Tech (Hons) CSE, Computer Networks, CS20B501</small></h2>
    <ol id="navlist"></ol>
    <div class="tools"><button id="themeBtn" type="button">Theme</button><button id="zoomBtn" type="button">Text size</button><span class="hint">Projector tip: if text is hard to see, switch theme (or press Alt+D) and raise the text size.</span></div>
  </nav>
  <main id="stage" tabindex="-1"></main>
  <aside class="live" aria-label="Live data"><h3>Quick reference: Unit III</h3><div id="livebox"></div></aside>
</div>
<script>
"use strict";
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v==="number"?(Number.isInteger(v)?v.toLocaleString("en-US"):v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})):v;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,l=Math.floor(p);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(p-l)};
const mode=a=>{const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx).join(", ")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const groupBy=(rows,f)=>{const g={};rows.forEach(r=>{const k=f(r);(g[k]=g[k]||[]).push(r)});return g};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return a/Math.sqrt(b*c)};
const linfit=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2});const m=a/b;return {m,b:my-m*mx,r:corr(x,y)}};
function table(rows,cols,opts={}){
  const head=cols.map(c=>`<th>${esc(c[1])}</th>`).join("");
  const body=rows.map((r,i)=>`<tr${opts.newFrom!=null&&i>=opts.newFrom?' class="new"':''}>`+cols.map(c=>{
    const v=r[c[0]],cls=(typeof v==="number"?"num":"")+((opts.cellClass&&opts.cellClass(r,c[0],i))||"");
    return `<td class="${cls.trim()}">${v===""||v==null?'<span class="muted">(blank)</span>':esc(typeof v==="number"?fmt(v,c[2]!=null?c[2]:(Number.isInteger(v)?0:2)):v)}</td>`}).join("")+"</tr>").join("");
  return `<div class="tw${opts.small?' sm':''}"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const QUIZ={};
function quiz(id,q,opts,ans,why){QUIZ[id]={ans,why};
  return `<div class="card"><h3>Quick check</h3><p style="margin:0 0 6px"><b>${q}</b></p>`+opts.map((o,i)=>`<button class="opt" type="button" data-q="${id}" data-i="${i}">${o}</button>`).join("")+`<div class="small muted" id="why-${id}" style="margin-top:6px"></div></div>`;}
function regQuiz(id,ans,why){QUIZ[id]={ans,why}}
function seg(id,items,cls=""){return `<div class="seg ${cls}" id="${id}" role="group">`+items.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${i===0}">${x[1]}</button>`).join("")+`</div>`}
function bindSeg(root,id,fn){const g=$("#"+id,root);$$("button",g).forEach(b=>b.onclick=()=>{$$("button",g).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return ()=>$$("[aria-pressed=true]",g)[0].dataset.v}
const IN=n=>n.toLocaleString("en-US",{maximumFractionDigits:0});

/* ===== SVG charts (colours come from CSS variables, so both themes work) ===== */
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const nice=(max)=>{const e=Math.pow(10,Math.floor(Math.log10(max||1))),f=max/e;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*e};
function ticks(lo,hi,n=5){const out=[],st=(hi-lo)/n;for(let i=0;i<=n;i++)out.push(lo+st*i);return out}
const short=v=>Math.abs(v)>=100000?(v/100000).toFixed(1).replace(/\.0$/,"")+"L":Math.abs(v)>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":(Math.round(v*100)/100)+"";
function chartBar(items,o={}){ // items:[{label,value,color}]
  const W=o.w||640,H=o.h||320,m={l:56,r:14,t:o.title?34:16,b:o.rotate?70:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...items.map(i=>i.value))*1.08),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih,bw=iw/items.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"bar chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*.15,w=bw*.7,y=sy(Math.max(it.value,mn));
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(mn)-y)}" fill="${it.color||o.color||"var(--c1)"}" rx="2"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    if(o.values!==false&&items.length<=14)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="font-size:11px">${short(it.value)}</text>`;
    const lx=x+w/2,ly=H-m.b+16;s+=o.rotate?`<text x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-35 ${lx} ${ly})">${esc(it.label)}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(it.label)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return s+"</svg>";}
function chartLine(series,labels,o={}){ // series:[{name,vals,color,dash}]
  const W=o.w||640,H=o.h||320,m={l:56,r:o.legendRight?110:16,t:o.title?34:16,b:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null)),mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...all)*1.08);
  const sx=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"line chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  const step=Math.ceil(labels.length/(o.maxLabels||12));labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="lbl" x="${sx(i)}" y="${H-m.b+16}" text-anchor="middle">${esc(l)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  series.forEach((se,k)=>{const c=se.color||PAL[k%6];let d="";se.vals.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+sx(i).toFixed(1)+" "+sy(v).toFixed(1)});
    if(o.area&&k===0)s+=`<path d="${d}L${sx(se.vals.length-1)} ${sy(mn)}L${sx(0)} ${sy(mn)}Z" fill="${c}" opacity=".18"/>`;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${se.w||2.5}" ${se.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
    if(o.dots!==false&&!se.dash)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${c}"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`});
    if(o.legendRight)s+=`<text x="${W-m.r+8}" y="${m.t+14+k*16}" style="fill:${c};font-weight:600">${esc(se.name)}</text>`;
    else if(series.length>1)s+=`<text x="${m.l+8+k*150}" y="${H-6}" style="fill:${c};font-weight:600">&#9632; ${esc(se.name)}</text>`});
  (o.marks||[]).forEach(mk=>{s+=`<text x="${sx(mk.i)}" y="${sy(mk.v)-10}" text-anchor="middle" style="font-weight:700;fill:${mk.color||"var(--sec)"}">${esc(mk.text)}</text>`});
  return s+"</svg>";}
function chartScatter(pts,o={}){ // pts:[{x,y,r,color,label}]
  const W=o.w||640,H=o.h||340,m={l:60,r:16,t:o.title?34:16,b:46},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=o.x0!=null?o.x0:Math.min(...xs),x1=o.x1!=null?o.x1:Math.max(...xs),y0=o.y0!=null?o.y0:0,y1=o.y1||nice(Math.max(...ys)*1.05);
  const sx=v=>m.l+(v-x0)/(x1-x0||1)*iw,sy=v=>m.t+ih-(v-y0)/(y1-y0)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"scatter chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(y0,y1).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  ticks(x0,x1).forEach(t=>s+=`<text class="lbl" x="${sx(t)}" y="${H-m.b+16}" text-anchor="middle">${short(t)}</text>`);
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(y0)}" y2="${sy(y0)}"/><line class="ax" x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${sy(y0)}"/>`;
  if(o.xlabel)s+=`<text class="lbl" x="${m.l+iw/2}" y="${H-6}" text-anchor="middle">${esc(o.xlabel)}</text>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  if(o.fit){const f=o.fit;s+=`<line x1="${sx(x0)}" y1="${sy(f.m*x0+f.b)}" x2="${sx(x1)}" y2="${sy(f.m*x1+f.b)}" stroke="var(--sec)" stroke-width="2.5" stroke-dasharray="7 4"/>`}
  pts.forEach(p=>{s+=`<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="${p.r||4}" fill="${p.color||"var(--c1)"}" fill-opacity="${o.alpha||.65}" stroke="${p.color||"var(--c1)"}"><title>${esc(p.label||"")} (${fmt(p.x)}, ${fmt(p.y)})</title></circle>`;
    if(o.labels&&p.label)s+=`<text x="${sx(p.x)+(p.r||4)+3}" y="${sy(p.y)+4}" style="font-size:11px">${esc(p.label)}</text>`});
  return s+"</svg>";}
function chartPie(items,o={}){const W=o.w||420,H=o.h||300,cx=120,cy=H/2,R=100,tot=sum(items.map(i=>i.value));let a=-Math.PI/2,s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="pie chart">`;
  items.forEach((it,k)=>{const ang=it.value/tot*2*Math.PI,x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a+ang),y2=cy+R*Math.sin(a+ang);
    s+=`<path d="M${cx} ${cy}L${x1} ${y1}A${R} ${R} 0 ${ang>Math.PI?1:0} 1 ${x2} ${y2}Z" fill="${it.color||PAL[k%6]}" stroke="var(--surface)" stroke-width="2"><title>${esc(it.label)}: ${(100*it.value/tot).toFixed(1)}%</title></path>`;a+=ang;
    s+=`<text x="250" y="${40+k*22}" style="fill:${it.color||PAL[k%6]};font-weight:700">&#9632; <tspan style="fill:var(--fg);font-weight:400">${esc(it.label)} ${(100*it.value/tot).toFixed(1)}%</tspan></text>`});
  return s+"</svg>";}
function histBins(vals,n,lo,hi){const w=(hi-lo)/n,b=Array(n).fill(0);vals.forEach(v=>{let i=Math.floor((v-lo)/w);if(i>=n)i=n-1;if(i<0)i=0;b[i]++});return b.map((c,i)=>({label:short(lo+i*w),value:c,lo:lo+i*w,hi:lo+(i+1)*w}))}

/* ===== lesson framework ===== */
const L=[];
function lesson(o){L.push(o)}
let cur=0, done=new Set();
const UKEY="dalab_"+(document.title||"x");
try{JSON.parse(localStorage.getItem(UKEY)||"[]").forEach(x=>done.add(x))}catch(e){}
function go(i){
  cur=Math.max(0,Math.min(L.length-1,i));
  const l=L[cur],st=$("#stage");
  st.innerHTML=`<div class="crumb">${L[0].guide?(cur?`Lesson ${cur} of ${L.length-1}`:"Unit guide: read this first"):`Lesson ${cur+1} of ${L.length}`}</div><h1>${l.title}</h1><div class="syl">Syllabus: ${l.syl}</div>`+l.html()+

/* ---------- narrated story player ----------
   cfg.draw(i, animate, step) paints the picture for step i. Each step has {cap: html}. */
function story(root,sel,cfg){
  const box=typeof sel==='string'?$(sel,root):sel;let steps=[],i=0,timer=null,alive=true;
  box.classList.add('story');
  box.innerHTML=`<div class="cap" data-a="cap" aria-live="polite"></div><div class="storybar"><button type="button" class="btn sm" data-a="b">&#9664; Back</button><button type="button" class="btn sm pri" data-a="n">Next step &#9654;</button><button type="button" class="btn sm" data-a="p">Auto-play</button><button type="button" class="btn sm" data-a="r">Restart</button><span class="dots" data-a="d" aria-hidden="true"></span></div>`;
  const q=a=>$(`[data-a=${a}]`,box);
  function show(animate){const s=steps[i]||{cap:''};
    q('cap').innerHTML=`<div class="stepno">Step ${i+1} of ${steps.length}</div>${s.cap}`;
    q('d').innerHTML=steps.map((_,k)=>`<i class="${k<i?'dn':k===i?'cu':''}"></i>`).join('');
    q('b').disabled=i===0;q('n').disabled=i>=steps.length-1;
    cfg.draw(i,animate,s)}
  function stop(){if(timer){clearTimeout(timer);timer=null}q('p').textContent='Auto-play'}
  function tick(){if(!box.isConnected){stop();return}if(i>=steps.length-1){stop();return}i++;show(true);timer=setTimeout(tick,steps[i].ms||cfg.ms||3600)}
  q('b').onclick=()=>{stop();if(i>0){i--;show(false)}};
  q('n').onclick=()=>{stop();if(i<steps.length-1){i++;show(true)}};
  q('r').onclick=()=>{stop();i=0;show(false)};
  q('p').onclick=()=>{if(timer){stop();return}if(i>=steps.length-1){i=0;show(false)}q('p').textContent='Pause';timer=setTimeout(tick,steps[i].ms||cfg.ms||3600)};
  return {set(s,keep){stop();steps=s;if(!keep||i>=s.length)i=0;show(false)},goto(k){stop();i=Math.max(0,Math.min(steps.length-1,k));show(false)},idx:()=>i};
}

/* ---------- animated ARQ sequence diagram with live commentary ---------- */
const PNAME={sw:'Stop-and-Wait',gbn:'Go-Back-N',sr:'Selective Repeat'};
function arqLab(root,o){
  const id=o.id,N=o.N||8;
  const st={proto:o.proto||'gbn',W:o.W||4,P:o.P||3,loseD:new Set(o.loseD||[]),loseA:new Set(o.loseA||[]),t:0,play:false,speed:1,res:null,guided:o.guided!==false,paused:false};
  const fixed=!!o.proto&&o.fixed;
  const sc=o.scenarios||[];
  root.innerHTML=`
  ${sc.length?`<div class="scn"><b class="small">Scenarios:</b> ${sc.map((s,k)=>`<button type="button" class="btn sm" data-sc="${k}">${s.label}</button>`).join('')}</div><div class="callout i small" data-o="scd" style="margin-top:6px">Select a scenario. It sets the protocol and the losses. Then press Play.</div>`:''}
  <div class="row">${fixed?`<b>${PNAME[st.proto]}</b>`:`Protocol: ${seg(id+'pr',[["sw","Stop-and-Wait"],["gbn","Go-Back-N"],["sr","Selective Repeat"]].sort((a,b)=>(a[0]===st.proto?-1:0)-(b[0]===st.proto?-1:0)))}`}
    <span data-w>Window <input type="range" min="1" max="6" value="${st.W}" data-in="W" aria-label="Window size"> <b data-o="W">${st.W}</b></span>
    ${o.pslider?`<span>Link delay <input type="range" min="1" max="12" value="${st.P}" data-in="P" aria-label="Link delay"> <b data-o="P">${st.P}</b> ticks</span>`:''}</div>
  ${o.loss===false?'':`<div class="row small"><span>Lose frame:</span> ${Array.from({length:N},(_,k)=>`<label class="pill"><input type="checkbox" data-ld="${k}" ${st.loseD.has(k)?'checked':''}>F${k}</label>`).join('')}</div>
  <div class="row small"><span>Lose ACK:</span> ${Array.from({length:N},(_,k)=>`<label class="pill"><input type="checkbox" data-la="${k}" ${st.loseA.has(k)?'checked':''}>A${k}</label>`).join('')}</div>`}
  <div class="row"><button type="button" class="btn pri" data-b="play">Play</button><button type="button" class="btn sec" data-b="next">Next event &#9654;</button><button type="button" class="btn" data-b="reset">Restart</button>
    <span>Speed ${seg(id+'sp',[["1","1x"],["2","2x"],["0.5","0.5x"]],"s")}</span>
    <label class="pill"><input type="checkbox" data-b="guided" ${st.guided?'checked':''}>Pause at important moments</label><span class="small muted" data-o="clock"></span></div>
  <div class="cap narr" data-o="cap" aria-live="polite"></div>
  <div class="seqbox" data-o="seqbox"><svg data-o="svg" role="img" aria-label="Sequence diagram of frames between sender and receiver"></svg></div>
  <div class="legend small"><span class="lg pd"></span>frame <span class="lg pr"></span>sent again <span class="lg pa"></span>ACK <span class="lg pl"></span>lost &nbsp; Time runs downward. Each slanted line is a frame or an ACK on the link. It takes time to reach the other side.</div>
  <div class="arqwrap"><div><h4 class="h4">Sender's window</h4><div class="wstrip" data-o="sw"></div><h4 class="h4">Receiver</h4><div class="wstrip" data-o="rw"></div></div>
  <div><h4 class="h4">Event log</h4><div class="logb" data-o="log"></div></div></div>
  <div data-o="stats" class="callout i small"></div>${o.compare===false?'':'<div data-o="cmp"></div>'}`;
  const q=s=>$(`[data-o=${s}]`,root);
  const S=14,TOP=54,SX=230,RX=570,VW=780;
  let els=[],evEls=[],cur;
  const yT=t=>TOP+t*S;
  function build(){
    const r=st.res=simARQ(st.proto,{N,P:st.P,W:st.W,loseD:st.loseD,loseA:st.loseA});
    const H=TOP+(r.fin+3)*S,svg=q('svg');svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${VW} ${H}`);
    E('text',{x:SX,y:20,class:'sl hd','text-anchor':'middle'},svg).textContent='SENDER';
    E('text',{x:RX,y:20,class:'sl hd','text-anchor':'middle'},svg).textContent='RECEIVER';
    E('line',{x1:SX,y1:TOP-14,x2:SX,y2:H-4,class:'axis'},svg);E('line',{x1:RX,y1:TOP-14,x2:RX,y2:H-4,class:'axis'},svg);
    for(let t=0;t<=r.fin+2;t+=2){E('text',{x:36,y:yT(t)+4,class:'tk','text-anchor':'end'},svg).textContent='t='+t;E('line',{x1:40,x2:48,y1:yT(t),y2:yT(t),class:'axis'},svg)}
    els=r.pk.map(p=>{
      const g=E('g',{style:'display:none'},svg),cls=p.lost?'pl':p.kind==='ack'?'pa':p.re?'pr':'pd';
      const x1=p.kind==='data'?SX:RX,x2=p.kind==='data'?RX:SX;
      const ln=E('line',{class:'pkt '+cls,x1,y1:yT(p.ts),x2:x1,y2:yT(p.ts)},g);
      const dot=E('circle',{r:4.5,class:'pdot '+cls,cx:x1,cy:yT(p.ts)},g);
      const fr=p.lost?0.55:1,lx=x1+(x2-x1)*0.25,ly=yT(p.ts)+(yT(p.ta)-yT(p.ts))*0.25;
      const tx=E('text',{x:lx,y:ly-4,class:'sl pk','text-anchor':'middle'},g);tx.textContent=(p.kind==='ack'?'ACK':'F')+p.seq+(p.kind==='data'&&p.re?' (re)':'')+(p.lost?' lost':'');
      const xx=E('text',{x:x1+(x2-x1)*fr,y:yT(p.ts)+(yT(p.ta)-yT(p.ts))*fr+5,class:'xm','text-anchor':'middle',style:'display:none'},g);xx.textContent='✖';
      return {p,g,ln,dot,xx,x1,x2}});
    evEls=r.ev.map(e=>{const R=e.side==='R';const t=E('text',{x:R?RX+14:SX-14,y:yT(e.t)+4,class:'sl ev '+e.cls,'text-anchor':R?'start':'end',style:'display:none'},svg);t.textContent=e.txt;return {e,t}});
    cur=E('line',{x1:44,x2:VW-6,class:'cursor'},svg);
    const util=(r.sent/r.fin*100);
    q('stats').innerHTML=`Finished at tick <b>${r.fin}</b>. Frames sent: <b>${r.sent}</b> for ${N} frames delivered (<b>${r.retx}</b> retransmissions). Lost: ${r.lostD} frame(s), ${r.lostA} ACK(s). The sender transmitted for ${r.sent} of ${r.fin} ticks. Link utilisation is about <b>${util.toFixed(0)}%</b>.`;
    q('stats').style.visibility='hidden';
    drawCmp();
  }
  const SIDE={S:'Sender',R:'Receiver',N:'The link'};
  function draw(){
    const r=st.res,t=st.t;
    els.forEach(x=>{const p=x.p;if(t<p.ts){x.g.style.display='none';return}x.g.style.display='';
      const dur=p.ta-p.ts,mx=p.lost?0.55:1,f=Math.min(mx,(t-p.ts)/dur);
      const ex=x.x1+(x.x2-x.x1)*f,ey=yT(p.ts)+(yT(p.ta)-yT(p.ts))*f;
      x.ln.setAttribute('x2',ex);x.ln.setAttribute('y2',ey);x.dot.setAttribute('cx',ex);x.dot.setAttribute('cy',ey);
      const end=(t-p.ts)/dur>=mx;x.dot.style.display=end&&!p.lost?'none':'';x.xx.style.display=end&&p.lost?'':'none'});
    evEls.forEach(x=>x.t.style.display=t>=x.e.t?'':'none');
    cur.setAttribute('y1',yT(t));cur.setAttribute('y2',yT(t));
    const tk=Math.min(Math.floor(t+1e-9),r.snaps.length-1),sn=r.snaps[Math.max(0,tk)];
    q('clock').textContent=`tick ${Math.floor(t+1e-9)}`;
    let h='';for(let k=0;k<N;k++){const a=st.proto==='sr'?sn.acked.includes(k):k<sn.base;
      const c=a?'ack':(k<sn.hi?'sent':'');const inw=k>=sn.base&&k<sn.base+sn.W;
      h+=`<div class="wb ${c} ${inw?'inwin':''}" title="${a?'acknowledged':k<sn.hi?'sent, waiting for ACK':inw?'in window, not sent yet':'outside window'}">${k}</div>`}
    q('sw').innerHTML=h+`<div class="small muted" style="width:100%">green = acknowledged, amber = sent and waiting for an ACK, blue bar = the window (the frames that the sender may have unacknowledged)</div>`;
    let g='';for(let k=0;k<N;k++){const dl=k<sn.rexp,bf=sn.buf.includes(k);
      g+=`<div class="wb ${dl?'ack':bf?'buf':''} ${k===sn.rexp?'exp':''}">${k}</div>`}
    q('rw').innerHTML=g+`<div class="small muted" style="width:100%">green = delivered in order, orange = stored in the buffer, ring = the frame that the receiver expects next</div>`;
    const past=r.say.filter(e=>e.t<=t+1e-9);
    q('log').innerHTML=r.ev.filter(e=>e.t<=t+1e-9).map(e=>`<div class="${e.cls}">t=${e.t} ${e.side==='R'?'receiver':'sender'}: ${esc(e.txt)}</div>`).join('');q('log').scrollTop=1e6;
    // narrator
    const last=past.slice(-3);
    q('cap').innerHTML=last.length?last.map((e,k)=>`<div class="nl ${k===last.length-1?'new':'old'}"><span class="who ${e.side}">${SIDE[e.side]}</span> <span class="tm">t=${+e.t.toFixed(1)}</span> ${e.txt}</div>`).join(''):`<div class="nl new">Press <b>Play</b> to watch, or <b>Next event</b> to move one moment at a time. A commentary of what each side is thinking appears here.</div>`;
    const sb=q('seqbox'),want=yT(t)-sb.clientHeight*0.6;if(st.play||t===0||st.nudge)sb.scrollTop=Math.max(0,want);st.nudge=false;
    q('stats').style.visibility=t>=r.fin?'visible':'hidden';
    const pb=$('[data-b=play]',root),end=r.fin+r.P+1;pb.textContent=st.play?'Pause':(t>=end?'Replay':(st.paused?'Continue':'Play'));
  }
  let last=0;const endT=()=>st.res.fin+st.res.P+1;
  function loop(ts){if(!st.play)return;const dt=Math.min(0.1,(ts-last)/1000);last=ts;
    let nt=Math.min(endT(),st.t+dt*3.2*st.speed);
    if(st.guided){const imp=st.res.say.find(e=>e.imp&&e.t>st.t+1e-9&&e.t<=nt);if(imp){nt=imp.t;st.play=false;st.paused=true}}
    st.t=nt;draw();
    if(st.t>=endT()){st.play=false;draw();return}if(st.play)raf(loop)}
  function play(){if(st.t>=endT()){st.t=0}st.paused=false;st.play=!st.play;if(st.play){last=performance.now();raf(loop)}else draw()}
  function restart(){st.play=false;st.paused=false;st.t=0;build();draw();q('seqbox').scrollTop=0}
  function drawCmp(){const c=q('cmp');if(!c)return;
    const rows=['sw','gbn','sr'].map(p=>({p,r:simARQ(p,{N,P:st.P,W:st.W,loseD:st.loseD,loseA:st.loseA})}));
    const best=Math.min(...rows.map(x=>x.r.fin));
    c.innerHTML=`<h4 class="h4">Same losses, all three protocols (window ${st.W}, link delay ${st.P})</h4><table class="dt"><thead><tr><th>Protocol</th><th>Frames sent</th><th>Sent again</th><th>Finish tick</th></tr></thead><tbody>${rows.map(x=>`<tr class="${x.r.fin===best?'bestrow':''}"><td><b>${PNAME[x.p]}</b>${x.p==='sw'?' (window forced to 1)':''}</td><td class="num">${x.r.sent}</td><td class="num">${x.r.retx}</td><td class="num">${x.r.fin}</td></tr>`).join('')}</tbody></table><div class="small muted">The green row finished first.</div>`}
  function syncUI(){
    if(!fixed){const g=$('#'+id+'pr',root);if(g)$$('button',g).forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===st.proto))}
    const w=$('[data-in=W]',root);if(w){w.value=st.W;$('[data-o=W]',root).textContent=st.W}
    $('[data-w]',root).hidden=(st.proto==='sw');const pw=$('[data-in=P]',root);if(pw){pw.value=st.P;$('[data-o=P]',root).textContent=st.P}
    $$('[data-ld]',root).forEach(c=>c.checked=st.loseD.has(+c.dataset.ld));$$('[data-la]',root).forEach(c=>c.checked=st.loseA.has(+c.dataset.la))}
  /* events */
  if(!fixed)bindSeg(root,id+'pr',v=>{st.proto=v;syncUI();restart()});
  syncUI();
  bindSeg(root,id+'sp',v=>{st.speed=+v});
  $$('[data-in]',root).forEach(i=>i.oninput=()=>{st[i.dataset.in]=+i.value;$(`[data-o=${i.dataset.in}]`,root).textContent=i.value;restart()});
  $$('[data-ld]',root).forEach(c=>c.onchange=()=>{c.checked?st.loseD.add(+c.dataset.ld):st.loseD.delete(+c.dataset.ld);restart()});
  $$('[data-la]',root).forEach(c=>c.onchange=()=>{c.checked?st.loseA.add(+c.dataset.la):st.loseA.delete(+c.dataset.la);restart()});
  $('[data-b=play]',root).onclick=play;
  $('[data-b=next]',root).onclick=()=>{st.play=false;st.paused=false;const nx=st.res.say.find(e=>e.t>st.t+1e-9);st.t=nx?nx.t:endT();st.nudge=true;draw()};
  $('[data-b=reset]',root).onclick=restart;
  $('[data-b=guided]',root).onchange=e=>{st.guided=e.target.checked};
  $$('[data-sc]',root).forEach(b=>b.onclick=()=>{const s=sc[+b.dataset.sc];if(s.proto)st.proto=s.proto;if(s.W)st.W=s.W;if(s.P)st.P=s.P;st.loseD=new Set(s.loseD||[]);st.loseA=new Set(s.loseA||[]);
    $$('[data-sc]',root).forEach(x=>x.classList.remove('pri'));b.classList.add('pri');q('scd').innerHTML=s.desc;syncUI();restart()});
  build();draw();
  return {st,restart};
}

/* ===== OSI helpers ===== */
const OSIL=[[7,"Application"],[6,"Presentation"],[5,"Session"],[4,"Transport"],[3,"Network"],[2,"Data link"],[1,"Physical"]];
const osiStack=(hi,note)=>`<div class="osiwrap one"><div class="osicol">${OSIL.map(([n,t])=>`<div class="osil${n===hi?' on':''}"><b>${n}</b> ${t}</div>`).join('')}</div>${note?`<div class="osinote">${note}</div>`:''}</div>`;
function osiStory(){
  const U={7:'Data',6:'Data',5:'Data',4:'Segment',3:'Packet',2:'Frame',1:'Bits'};
  const pdu=(low,hasT)=>{const a=[];if(hasT)a.push({t:'T2',cl:'t'});a.push({t:'Data',cl:'d'});for(let n=7;n>=low;n--)a.push({t:'H'+n,cl:'h'});a.reverse();return a};
  const vis=(side,layer,low,hasT,name)=>{
    const col=s=>`<div class="osicol"><div class="osih">${s==='S'?'Sender':'Receiver'}</div>${OSIL.map(([n,t])=>`<div class="osil${side===s&&n===layer?' on':''}"><b>${n}</b> ${t}</div>`).join('')}</div>`;
    return `<div class="osiwrap">${col('S')}${col('R')}</div><div class="small muted" style="margin-top:8px">Data unit at this layer: <b>${name}</b></div><div class="osipdu">${pdu(low,hasT).map(x=>`<span class="${x.cl}">${x.t}</span>`).join('')}</div>`};
  const S=[];
  S.push({cap:`<b>Overview.</b> The sender's data moves down the seven layers. Each layer adds control information, called a <b>header</b> (H7 to H2), and the data link layer also adds a <b>trailer</b> (T2). This is called <b>encapsulation</b>. At the receiver the data moves up, and each layer removes its own header. This is called <b>decapsulation</b>. Press <b>Next step</b>.`,vis:vis('S',0,8,false,'Data')});
  S.push({cap:`<b>Layer 7, application.</b> The user's program gives its data to the application layer. The layer adds header H7. The header carries information for the application layer at the receiver (the peer layer).`,vis:vis('S',7,7,false,'Data')});
  S.push({cap:`<b>Layer 6, presentation.</b> This layer translates the data into a common format. It also does encryption and compression when they are needed. It adds header H6.`,vis:vis('S',6,6,false,'Data')});
  S.push({cap:`<b>Layer 5, session.</b> This layer opens, manages and closes the dialog between the two ends. It adds header H5.`,vis:vis('S',5,5,false,'Data')});
  S.push({cap:`<b>Layer 4, transport.</b> This layer provides process-to-process delivery. Its header H4 holds port numbers and, for TCP, sequence numbers. The data unit is now called a <b>segment</b>.`,vis:vis('S',4,4,false,'Segment')});
  S.push({cap:`<b>Layer 3, network.</b> This layer provides source-to-destination delivery across networks. Its header H3 holds the logical (IP) source and destination addresses. The data unit is now called a <b>packet</b>.`,vis:vis('S',3,3,false,'Packet')});
  S.push({cap:`<b>Layer 2, data link.</b> This layer provides node-to-node delivery over one link. It adds header H2 (the physical or MAC addresses) and trailer T2 (error-checking bits). The data unit is now called a <b>frame</b>. This is the layer studied in this unit.`,vis:vis('S',2,2,true,'Frame')});
  S.push({cap:`<b>Layer 1, physical.</b> This layer changes the bits of the frame into signals (voltage, light or radio waves) and sends them over the medium. It adds no header.`,vis:vis('S',1,2,true,'Bits (signals)')});

  S.push({cap:`<b>Receiver, layer 2.</b> The data link layer finds the frame boundaries and uses T2 to check for errors. A damaged frame is discarded. It also checks that H2 holds its own address. It then removes H2 and T2 and passes the packet up.`,vis:vis('R',2,2,true,'Frame')});
  S.push({cap:`<b>Receiver, layer 3.</b> The network layer reads H3, checks the destination IP address, removes H3 and passes the segment up.`,vis:vis('R',3,3,false,'Packet')});
  S.push({cap:`<b>Receiver, layer 4.</b> The transport layer reads H4, checks the segment, puts the data in order and delivers it to the correct process. It removes H4.`,vis:vis('R',4,4,false,'Segment')});
  S.push({cap:`<b>Receiver, layer 5.</b> The session layer reads H5, manages the dialog and removes H5.`,vis:vis('R',5,5,false,'Data')});
  S.push({cap:`<b>Receiver, layer 6.</b> The presentation layer reads H6. It decrypts and decompresses the data and translates it to the format of the receiver. It removes H6.`,vis:vis('R',6,6,false,'Data')});
  S.push({cap:`<b>Receiver, layer 7.</b> The application layer reads H7, removes it and gives the original data to the receiving program. Each layer used only the header written by its peer layer on the other side.`,vis:vis('R',7,7,false,'Data')});
  return S}

lesson({guide:true,nav:"Unit guide: start here",title:"Unit III guide: what we are going to learn",syl:"MAC Sub layer: MAC Addressing, Binary Exponential Back-off (BEB) Algorithm, Distributed Random Access Schemes/Contention Schemes: for Data Services (ALOHA and Slotted ALOHA), for Local-Area Networks (CSMA, CSMA/CD, CSMA/CA), Collision Free Protocols: Basic Bit Map, BRAP, Binary Count Walk, MLMA Limited Contention Protocols: Adaptive Tree Walk, Performance Measuring Metrics. IEEE Standards 802 series & their variant (10 hours)",
html:()=>`
<div class="synbox"><b>Syllabus of this unit (10 lecture hours):</b><br>"MAC Sub layer: MAC Addressing, Binary Exponential Back-off (BEB) Algorithm, Distributed Random Access Schemes/Contention Schemes: for Data Services (ALOHA and Slotted ALOHA), for Local-Area Networks (CSMA, CSMA/CD, CSMA/CA), Collision Free Protocols: Basic Bit Map, BRAP, Binary Count Walk, MLMA Limited Contention Protocols: Adaptive Tree Walk, Performance Measuring Metrics. IEEE Standards 802 series &amp; their variant."<br>The eleven lessons follow this syllabus in the same order. In the syllabus "Binary Count Walk" is the binary countdown protocol (Lesson 8). Lesson 7 (channelization: FDMA, TDMA, CDMA) is not named in the syllabus line. It is part of your course notes (Topic 26), so it is placed after the contention schemes. Lesson 8 also covers reservation, polling and token passing from the notes.</div>
${SEC("G.1","Scope of the unit")}
<p>In many networks several stations share one channel. A radio channel and a classic Ethernet cable are examples. If two stations send at the same time, their signals overlap and both frames are lost. The <b>medium access control (MAC) sublayer</b> is the part of the data link layer that decides which station may send and when. This unit describes the problem, the rules (protocols) that solve it, the numbers that compare the rules, and the standards that use them.</p>
${SEC("G.2","Position of the unit in the OSI model")}
<p>The MAC sublayer is the lower half of layer 2. The LLC sublayer is above it, and the physical layer (layer 1) is below it. Unit II described the upper part of the data link layer for one link between two nodes. This unit describes how a shared link is used.</p>
<div class="vis">${osiStack(2,"This unit covers the MAC sublayer of layer 2 and, in Lessons 7 and 11, the physical layer (channelization and the IEEE 802 standards).")}</div>
${SEC("G.3","Map of the unit")}
<p>Each lesson starts with its own guide. The table below is the guide to the whole unit.</p>
<table class="dt gt cmpt"><thead><tr><th>Lesson</th><th>Syllabus words</th><th>Question</th><th>After the lesson you can</th><th>Time</th></tr></thead><tbody>
<tr><td><b>1</b></td><td>MAC Sub layer, MAC addressing</td><td>Why does a shared channel need rules, and how is a station identified?</td><td>Explain channel allocation and read a MAC address</td><td>1 h 15 min</td></tr>
<tr><td><b>2</b></td><td>Binary Exponential Back-off (BEB)</td><td>How long does a station wait after a collision?</td><td>Apply the BEB rule; explain the capture effect</td><td>1 h 15 min</td></tr>
<tr><td><b>3</b></td><td>ALOHA and Slotted ALOHA</td><td>What happens if stations send without listening?</td><td>Derive S = G e^(-2G) and S = G e^(-G)</td><td>1 h 30 min</td></tr>
<tr><td><b>4</b></td><td>CSMA</td><td>How does listening before sending help?</td><td>Explain vulnerable time and the persistence methods</td><td>1 h 15 min</td></tr>
<tr><td><b>5</b></td><td>CSMA/CD</td><td>How are collisions detected on a wired LAN?</td><td>Follow the phases; calculate the minimum frame and the efficiency</td><td>1 h 45 min</td></tr>
<tr><td><b>6</b></td><td>CSMA/CA</td><td>How are collisions avoided on a wireless LAN?</td><td>Explain hidden node, IFS, back-off freezing and RTS/CTS</td><td>1 h 45 min</td></tr>
<tr><td><b>7</b></td><td>Channelization (course notes)</td><td>Can the channel be divided in advance?</td><td>Divide by frequency, time and code</td><td>1 h 45 min</td></tr>
<tr><td><b>8</b></td><td>Collision free protocols: Basic Bit Map, BRAP, Binary Count Walk, MLMA</td><td>How can collisions be avoided completely?</td><td>Trace reservation, polling, token passing and the four protocols; compare their overhead</td><td>2 h 30 min</td></tr>
<tr><td><b>9</b></td><td>Limited contention: Adaptive Tree Walk</td><td>Can one protocol be good at low and at high load?</td><td>Trace the tree walk and count its slots</td><td>1 h</td></tr>
<tr><td><b>10</b></td><td>Performance measuring metrics</td><td>How are the protocols compared?</td><td>Calculate throughput, delay, jitter and efficiency</td><td>2 h</td></tr>
<tr><td><b>11</b></td><td>IEEE Standards 802 series and their variants</td><td>Which standard uses which protocol?</td><td>Encode bits with Manchester codes; build an Ethernet frame; describe Wi-Fi and the other 802 standards</td><td>2 h</td></tr></tbody></table>
<p>The total time is about 18 hours, including the practice questions. The syllabus allows 10 lecture hours. The practical work of the lessons can be done outside the class. Lessons 5, 6 and 8 need the most time.</p>
${SEC("G.3a","Your course notes and the lessons")}
<p>The lessons use your notes of Topics 21 to 29 as the content. The table shows where each topic is.</p>
<table class="dt gt cmpt"><thead><tr><th>Course notes</th><th>Subject</th><th>Lesson</th></tr></thead><tbody>
<tr><td>Topic 21</td><td>Binary Exponential Back-off</td><td>2</td></tr><tr><td>Topic 22</td><td>Pure ALOHA and Slotted ALOHA</td><td>3</td></tr><tr><td>Topic 23</td><td>CSMA: 1-persistent, non-persistent, p-persistent</td><td>4</td></tr><tr><td>Topic 24</td><td>CSMA with Collision Detection</td><td>5</td></tr><tr><td>Topic 25</td><td>CSMA with Collision Avoidance</td><td>6</td></tr><tr><td>Topic 26</td><td>Channelization protocols</td><td>7</td></tr><tr><td>Topic 27</td><td>Collision-free protocols</td><td>8</td></tr><tr><td>Topic 28</td><td>Performance metrics</td><td>10</td></tr><tr><td>Topic 29</td><td>IEEE 802.3, 802.11 and other 802 standards</td><td>11</td></tr></tbody></table>
<p>MAC addressing (Lesson 1) and the adaptive tree walk (Lesson 9) are in the syllabus but not in these topics, so they are kept from the first version of the lab. The bit map, BRAP, binary countdown and MLMA protocols of Lesson 8 are also in the syllabus only. If the notes for them exist, compare the definitions with Lesson 8.</p>
${NOTE("<b>Two points of notation.</b> (1) The notes use T<sub>p</sub> for the frame time in the ALOHA topic and for the propagation delay in the CSMA topics. The lessons use <b>T</b> for the frame time and <b>T<sub>p</sub></b> for the propagation delay. (2) The notes give the CSMA/CD efficiency as 1 / (1 + 5a). Lesson 5 shows that it comes from 1 / (1 + 2ea) = 1 / (1 + 5.44a) and gives both.")}
${SEC("G.3b","Which medium to imagine for each topic")}
<p>The MAC sublayer does not study one medium. It studies how several stations share a medium. The medium changes from topic to topic, but the question stays the same: <b>who may transmit now, and how are collisions avoided or recovered from?</b> Use this table to picture the right medium while you read each lesson.</p>
<table class="dt gt cmpt"><thead><tr><th>Topic</th><th>Medium to imagine</th><th>Point to remember</th></tr></thead><tbody>
<tr><td>Pure and slotted ALOHA</td><td>Shared radio channel</td><td>Stations do not listen before sending. The first ALOHA network used radio.</td></tr>
<tr><td>CSMA</td><td>Any shared medium</td><td>Sense the carrier before transmitting. Works on a cable or on radio.</td></tr>
<tr><td>CSMA/CD</td><td>Shared coaxial cable (10BASE5, 10BASE2)</td><td>Collisions are electrical: V<sub>total</sub> = V<sub>A</sub> + V<sub>B</sub>. The NIC detects the abnormal signal.</td></tr>
<tr><td>CSMA/CA</td><td>Wi-Fi, radio through air</td><td>A station cannot reliably send and listen at the same time, so collisions are avoided, not detected.</td></tr>
<tr><td>FDMA</td><td>Radio, satellite, cellular</td><td>Different frequency bands, for example 900, 910 and 920 MHz. No collision.</td></tr>
<tr><td>TDMA</td><td>Time slots on a shared channel</td><td>Same frequency, different times.</td></tr>
<tr><td>CDMA</td><td>Spread-spectrum radio</td><td>Same frequency, same time, different codes.</td></tr>
<tr><td>MAC address</td><td>Any LAN technology</td><td>Identifies the network interface. The medium does not matter.</td></tr>
<tr><td>IEEE 802.3 Ethernet</td><td>Wired LAN</td><td>Cable and fiber.</td></tr>
<tr><td>IEEE 802.11 Wi-Fi</td><td>Wireless LAN</td><td>Radio.</td></tr></tbody></table>
<p>Layer picture: the MAC sublayer sits above the physical media (Ethernet cable, coaxial cable, fiber, Wi-Fi radio, satellite). It decides how users share the medium. The physical layer decides how the signal is carried.</p>
${SEC("G.4","Relation between the lessons")}
<div class="chain"><div><b>1. MAC address</b>The station is identified. The shared channel needs rules.</div><div><b>2. BEB</b>The waiting time after a collision is random.</div><div><b>3. ALOHA</b>Send at any time. Vulnerable time 2T or T.</div><div><b>4. CSMA</b>Listen first. Vulnerable time Tp.</div><div><b>5. CSMA/CD</b>Listen while sending. Jam. Minimum frame.</div><div><b>6. CSMA/CA</b>Avoid the collision: IFS, back-off, ACK, RTS/CTS.</div><div><b>7. Channelization</b>Divide the channel first: frequency, time or code.</div><div><b>8. Collision-free</b>Agree on the order first.</div><div><b>9. Limited contention</b>Contend at low load, search in groups at high load.</div><div><b>10. Metrics</b>Compare with numbers.</div><div><b>11. Standards</b>Ethernet, Wi-Fi and others.</div></div>
${SEC("G.5","Terms used in this unit")}
<table class="dt cmpt"><thead><tr><th>Term</th><th>Meaning</th><th>Lesson</th></tr></thead><tbody>
<tr><td><b>Shared medium</b></td><td>One channel used by many stations</td><td>1</td></tr>
<tr><td><b>Collision</b></td><td>Two or more frames overlap in time on the channel, so none can be read</td><td>1 to 6</td></tr>
<tr><td><b>Contention</b></td><td>Stations compete for the channel and collisions can happen</td><td>3, 4</td></tr>
<tr><td><b>Slot time</b></td><td>A fixed unit of time. In BEB it is 512 bit times. In Slotted ALOHA it is one frame time.</td><td>2, 3</td></tr>
<tr><td><b>Frame time T</b></td><td>The time to send one frame (frame length / bit rate)</td><td>3, 4, 7</td></tr>
<tr><td><b>Propagation delay T<sub>p</sub></b></td><td>The time that a signal needs to travel from one end of the channel to the other</td><td>4, 7</td></tr>
<tr><td><b>Offered load G</b></td><td>Transmission attempts per frame time</td><td>3, 7</td></tr>
<tr><td><b>Throughput S</b></td><td>Successful frames per frame time</td><td>3, 7</td></tr>
<tr><td><b>Carrier sense</b></td><td>A station listens to the channel before it sends</td><td>4</td></tr>
<tr><td><b>Jam signal</b></td><td>A short signal that tells all stations about a collision</td><td>4</td></tr>
<tr><td><b>Reservation, polling, token</b></td><td>Three ways of taking turns: announce first, be asked in turn, or hold the token</td><td>8</td></tr>
<tr><td><b>Chip sequence</b></td><td>The code of a station in CDMA</td><td>7</td></tr>
<tr><td><b>Guard band, guard time</b></td><td>A gap between channels (FDMA) or slots (TDMA)</td><td>7</td></tr>
<tr><td><b>SIFS, DIFS, NAV</b></td><td>Interframe spaces of Wi-Fi, and the timer that holds a channel reservation</td><td>6</td></tr>
<tr><td><b>Jitter</b></td><td>The variation of the delay of successive packets</td><td>10</td></tr>
<tr><td><b>LLC and MAC</b></td><td>The two sublayers of the data link layer</td><td>1, 8</td></tr></tbody></table>
${SEC("G.6","How to use the animations")}
<ul>
<li><b>Step players</b> (a caption box with Back, Next step, Auto-play and Restart): press <b>Next step</b> and read the caption. The caption states what happens at that step.</li>

<li><b>Choice boxes</b> (stations with a frame, the value of G, and so on): change a value and the animation or the table starts again with the new value.</li>

<li><b>Dark mode</b> and <b>Text size</b> are in the left panel. They help when a projector is used.</li></ul>
${SEC("G.7","Relation to the practical list")}
<p><b>Experiment 11</b> of the course is the study and simulation of MAC protocols (ALOHA, CSMA, CSMA/CD and CSMA/CA) with a standard network simulator. Lessons 3 to 6 give the behaviour that the simulation must show: the throughput curves, the collisions and the back-off. Experiment 3 (LAN installation and configuration) uses the Ethernet standards of Lesson 11.</p>
${SEC("G.8","Check before you start")}
<p>These two questions show what you already know.</p>
${quiz("m0q1","Two stations send a frame at the same time on a shared cable. What happens?",["Both frames arrive correctly","The signals overlap and both frames are damaged","The cable chooses one station","The receiver asks one station to stop"],1,"This event is a collision. Both frames must be sent again.")}
${quiz("m0q2","Which layer and sublayer decide who sends on a shared channel?",["Network layer","Transport layer","MAC sublayer of the data link layer","Application layer"],2,"The MAC sublayer controls access to the shared medium.")}
${SUM(["The unit has eleven lessons in the syllabus order: MAC addressing, BEB, ALOHA, CSMA, CSMA/CD, CSMA/CA, channelization, collision-free protocols, limited contention, performance metrics, IEEE 802 standards.","The MAC sublayer is the lower part of layer 2. Its job is to share one channel among many stations.","Each lesson starts with a guide that gives the syllabus topic, the position in the OSI model, the sections, the prerequisites and the time."])}
