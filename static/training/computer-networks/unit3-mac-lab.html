/* ===== Unit III Lesson 6: limited contention, adaptive tree walk ===== */
const ATW_N=8;
function atwRun(ready,shortcut){
  const slots=[];
  const who=n=>{let lo=n,hi=n;while(lo<ATW_N){lo*=2;hi=hi*2+1}const w=[];for(let k=lo-ATW_N;k<=hi-ATW_N;k++)if(ready.has(k))w.push(k);return w};
  const walk=(n,skip)=>{let out;
    if(skip)out='bad';else{const w=who(n);out=w.length===0?'idle':w.length===1?'ok':'bad';slots.push({node:n,who:w,out,skipNext:false})}
    if(out==='bad'&&n<ATW_N){const lo=walk(2*n,false);if(shortcut&&lo==='idle'){slots[slots.length-1].skipNext=true;walk(2*n+1,true)}else walk(2*n+1,false)}
    return out};
  walk(1,false);return slots}
function treePic(svg,slots,k,ready){
  svg.innerHTML='';svg.setAttribute('viewBox','0 0 760 314');
  const pos=n=>{let l=0,m=n;while(m>1){m>>=1;l++}const w=ATW_N>>l,idx=n-(1<<l),x=40+(idx*w+w/2)*92-46;return [x+20,40+l*70]};
  const status={};slots.slice(0,k+1).forEach((s,i)=>{status[s.node]={out:s.out,cur:i===k}});
  for(let n=2;n<2*ATW_N;n++){const a=pos(n),b=pos(n>>1);E('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'ed','stroke-width':2},svg)}
  for(let n=1;n<2*ATW_N;n++){const [x,y]=pos(n),st=status[n],cl=st?(st.out==='ok'?'ok':st.out==='bad'?'bad':'idle'):'';
    E('circle',{cx:x,cy:y,r:n>=ATW_N?17:19,class:'tnode '+cl+(st&&st.cur?' cur':'')},svg);
    E('text',{x,y:y+4,'text-anchor':'middle',class:'sl'},svg).textContent=n>=ATW_N?'S'+(n-ATW_N):n;
    if(n>=ATW_N&&ready.has(n-ATW_N)){E('rect',{x:x-20,y:y+24,width:40,height:15,rx:3,fill:'var(--sec)'},svg);E('text',{x,y:y+35,'text-anchor':'middle',class:'sgt',fill:'var(--on)',style:'fill:var(--on)'},svg).textContent='frame'}}
  E('text',{x:380,y:306,'text-anchor':'middle',class:'tk'},svg).textContent='green: one station sends (success)   red: collision   grey: idle slot   thick blue ring: the node of the current slot'}
lesson({nav:"6. Limited contention: adaptive tree walk",title:"Limited contention protocols: the adaptive tree walk",syl:"Limited Contention Protocols: Adaptive Tree Walk",
html:()=>`
${GUIDE({"syl":"Limited Contention Protocols: Adaptive Tree Walk","why":"Contention protocols have a low delay when the load is low but waste time in collisions when the load is high. Collision-free protocols are the opposite. A limited contention protocol uses contention at low load and a controlled, collision-free search at high load. The adaptive tree walk is the standard example.","map":[["6.1","The idea of limited contention","Why does contention fail at high load?","Calculate the chance of success in a slot."],["6.2","Adaptive tree walk","How is a group of colliding stations separated?","Choose the stations and watch a depth-first search of the tree."],["6.3","Where to start the search","How is the cost of the search reduced?","Read the rule for the starting level."],["6.4","The three classes","How do the classes compare?","Read the comparison."]],"osi":"Layer 2, MAC sublayer.","pre":"Lessons 3, 4 and 5.","time":"about 1 hour","next":"Lesson 7, performance measuring metrics."})}
${LEARN(["explain why a contention protocol works well at low load and badly at high load","calculate the chance that exactly one of k stations sends in a slot","trace the adaptive tree walk for a given set of ready stations and count the slots","state the starting level that reduces the search time"])}
${SEC("6.1","The idea of limited contention")}
<p>Suppose k stations contend for a slot. Each one sends with probability p. The slot is successful when exactly one station sends. The chance is</p>
<div class="callout i"><b>P(success) = k &times; p &times; (1 - p)<sup>k - 1</sup></b></div>
<p>This is largest when <b>p = 1/k</b>. Then P(success) = (1 - 1/k)<sup>k-1</sup>. The table shows that, even with the best p, the chance of success falls as k rises, and it never falls below 1/e = 0.368.</p>
<table class="dt gt cmpt"><thead><tr><th>Stations k</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>8</th><th>16</th><th>very large</th></tr></thead><tbody><tr><td>P(success) at p = 1/k</td>${[1,2,3,4,5,8,16].map(k=>`<td>${Math.pow(1-1/k,k-1).toFixed(3)}</td>`).join('')}<td>0.368</td></tr></tbody></table>
<p>If more stations contend for each slot, the chance of success of each slot is lower. <b>Limited contention</b> reduces the number of stations that contend in a slot. At low load all stations can contend in the same slot (the delay is small). At high load the stations are divided into groups, and only one group contends in a slot, so k is small and the chance of success is high. If the groups are made so small that each has one station, the protocol is collision-free.</p>
<div class="vis"><div class="row"><span>Your probability p <input type="range" id="pp" min="0.05" max="1" step="0.05" value="0.3" aria-label="p"> <b id="ppv">0.3</b></span></div><div id="pch"></div><div class="small muted">The red curve shows the best possible chance (p = 1/k for every k). The blue curve shows a fixed p. A fixed p is good for one value of k only.</div></div>
${SEC("6.2","Adaptive tree walk")}
<p>The <b>adaptive tree walk</b> protocol (Capetanakis, 1979) divides the stations by arranging them as the leaves of a <b>binary tree</b>. The picture shows 8 stations S0 to S7. Each internal node stands for the group of stations below it. Node 1 (the root) is all 8 stations, node 2 is S0 to S3, node 3 is S4 to S7, node 4 is S0 and S1, and so on.</p>
${DEF("Adaptive tree walk","is a limited contention protocol. In slot 0 all stations with a frame may send. If there is a collision, the next slot is given only to the stations below the left child of the node. The search goes depth first: after a collision at a node, search its left subtree and then its right subtree. After a success or an idle slot, go on to the next node.")}
<ol><li>Slot 0 belongs to <b>node 1</b>. Every station with a frame sends.</li>
<li>If exactly one station sends, the frame is delivered and the search goes on to the next node (an idle or a successful slot ends the search below that node).</li>
<li>If two or more stations send, there is a <b>collision</b>. In the next slot only the stations in the <b>left child</b> may send. Then the same rule is applied there, going down the tree until a node has one station or none. After that the <b>right child</b> is searched.</li>
<li>When all the nodes are searched, the stations that had a frame have all sent.</li></ol>
<p>Choose the stations with a frame. The stations that are in the same group are found by the search, and the stations that are not ready are skipped quickly. Step through the slots.</p>
<div class="vis"><div class="row"><b>Stations with a frame:</b> ${[0,1,2,3,4,5,6,7].map(j=>`<label class="pill"><input type="checkbox" data-at="${j}" ${[2,3,5].includes(j)?'checked':''}>S${j}</label>`).join('')}<label class="pill"><input type="checkbox" id="atsc">Use the shortcut (see below)</label></div><svg id="tr" role="img" aria-label="Binary tree of stations and the search"></svg><div id="atl" class="small"></div><div id="trs"></div></div>
<p><b>The shortcut.</b> If a collision happens at a node and the left child gives an <b>idle</b> slot, the right child must have two or more ready stations (the collision at the parent proves that at least two stations are below it). The slot of the right child itself would be a collision, so it can be skipped and the search can go directly to the children of the right child. Tick the box to see this.</p>
${DOIT(["With S2, S3 and S5 ready: the root collides, node 2 collides, node 4 is idle, node 5 collides, S2 and S3 succeed, then node 3 has one station (S5) and succeeds. This is 7 slots for 3 frames.","Select only one station. The root slot is a success (one slot).","Select all 8 stations. Count the slots: every node of the tree is visited (15 slots) and 8 frames are sent. At full load the search costs about two slots for each frame.","Select S4 and S5 and tick the shortcut. Node 2 is idle, so node 3 must collide and its own slot is skipped. The search needs 6 slots. Without the shortcut it needs 7."])}
${SEC("6.3","Where to start the search")}
<p>If the load is low, a search that starts at the root is right: the first slot is often a success or idle. If the load is high, many stations are ready, and the root and the upper levels are nearly always collisions. The search wastes slots at the top of the tree.</p>
<p>The protocol is <b>adaptive</b> because it can start at a lower level of the tree. Suppose q stations are ready on average. At level i of the tree there are 2<sup>i</sup> nodes, and each node has about q / 2<sup>i</sup> ready stations. The best level is the one where this number is about 1, which is <b>i = log<sub>2</sub> q</b>. The stations below the nodes of that level are given one slot each, in order. Each node then has about one ready station, so each slot is likely to be a success. When the load rises, the search starts lower in the tree. When it falls, the search starts higher.</p>
${SEC("6.4","The three classes of MAC protocols")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Contention (ALOHA, CSMA)</th><th>Collision-free (bit map, binary countdown)</th><th>Limited contention (adaptive tree walk)</th></tr></thead><tbody>
<tr><td>Low load</td><td>Low delay (a station sends at once)</td><td>Higher delay (a station waits for its turn or reservation)</td><td>Low delay (as contention)</td></tr>
<tr><td>High load</td><td>Many collisions, low throughput</td><td>High efficiency</td><td>High efficiency (as collision-free)</td></tr>
<tr><td>Collisions</td><td>Yes</td><td>No</td><td>Yes at the start, controlled by the search</td></tr></tbody></table>
${quiz("m6q1","Which value of p gives the highest chance that exactly one of k contending stations sends?",["p = 1/2","p = 1/k","p = 1","p = k"],1,"k p (1-p)^(k-1) has its maximum at p = 1/k.")}
${quiz("m6q2","In the adaptive tree walk, a collision occurs at node 2. Which stations may send in the next slot?",["All stations","Only the stations below the left child of node 2","Only the stations below the right child of node 2","No station"],1,"The search goes to the left child (node 4) first.")}
${quiz("m6q3","Stations S0 and S1 are the only stations with a frame (8 stations, no shortcut). How many slots are used?",["3","4","5","7"],3,"The root, node 2 and node 4 collide (3 slots). S0 and S1 succeed (2 slots). Node 5 is idle (1 slot) and node 3 is idle (1 slot). The total is 7 slots.")}
${EXAM(["Derive P(success) for k stations that send with probability p. For which p is it maximum, and what is the value for k = 2 and k = 3?","Describe the adaptive tree walk protocol. Draw the tree for 8 stations and show the slots when stations S2, S3 and S5 have a frame. (Answer: 7 slots, see 6.2.)","Why is it better to start the search at level log2 q and not at the root?","Why is a limited contention protocol better than a pure contention or a pure collision-free protocol?"])}
${SUM(["With k stations contending and each sending with probability p, P(success) = k p (1-p)^(k-1), and it is largest at p = 1/k.","Limited contention: contention at low load, groups at high load.","Adaptive tree walk: stations are the leaves of a binary tree. After a collision at a node, search the left child and then the right child (depth first).","The search should start at level log2 q, where each node has about one ready station."])}
`,
mount(r){
  const ch=()=>{const p=+$("#pp",r).value;$("#ppv",r).textContent=p;$("#pch",r).innerHTML=lineChart({W:640,H:290,legR:300,xmax:16,ymax:1,xl:'Number of contending stations k',yl:'P(success)',label:'Chance of success against k',xt:8,series:[{f:x=>x<1?NaN:Math.pow(1-1/x,x-1),name:'best p = 1/k',c:'var(--bad)'},{f:x=>x*p*Math.pow(1-p,x-1),name:'fixed p = '+p,c:'var(--c1)'}]})};
  $("#pp",r).oninput=ch;ch();
  const svg=$("#tr",r);let st=null;
  const run=()=>{const ready=new Set($$("[data-at]",r).filter(c=>c.checked).map(c=>+c.dataset.at)),sc=$("#atsc",r).checked,sl=atwRun(ready,sc);
    const nm=n=>n>=ATW_N?'S'+(n-ATW_N):'node '+n;
    const caps=sl.map((s,i)=>{const w=s.who.length?s.who.map(x=>'S'+x).join(', '):'none';
      return `<b>Slot ${i}: ${nm(s.node)}.</b> The stations below this node that have a frame: <b>${w}</b>. `+(s.out==='bad'?`Two or more stations send, so there is a <b>collision</b>. The next slot goes to the left child (node ${2*s.node}).`:s.out==='ok'?`Exactly one station sends, so the frame is <b>delivered</b>. The search goes on to the next node.`:`Nobody sends, so the slot is <b>idle</b>. The search goes on to the next node.`)+(s.skipNext?` <b>Shortcut:</b> the left child was idle, so the right sibling (node ${s.node+1}) must have two or more ready stations. Its own slot is skipped and the search goes straight to its left child.`:'')});
    if(!sl.length)return;
    const tot=sl.length;
    const stps=sl.map((s,i)=>({cap:caps[i]+(i===tot-1?` <b>The search is complete: ${tot} slots for ${ready.size} frame${ready.size===1?'':'s'}.</b>`:'')}));
    st=story(r,"#trs",{draw:i=>{treePic(svg,sl,i,ready);$("#atl",r).innerHTML='<b>Slots so far:</b> '+sl.slice(0,i+1).map((s,k)=>`<span class="pill" style="background:var(--${s.out==='ok'?'good':s.out==='bad'?'bad':'surface2'}-soft)">${k}: ${s.node>=ATW_N?'S'+(s.node-ATW_N):'n'+s.node}</span>`).join(' ')}});st.set(stps)};
  $$("[data-at]",r).forEach(c=>c.onchange=run);$("#atsc",r).onchange=run;run();
}});

/* ===== Unit III Lesson 7: performance measuring metrics ===== */
const SNP=(G,a)=>G*Math.exp(-a*G)/(G*(1+2*a)+Math.exp(-a*G));
const maxOf=f=>{let b=0,g=0;for(let x=0.005;x<=60;x+=0.005){const y=f(x);if(y>b){b=y;g=x}}return {S:b,G:g}};
lesson({nav:"7. Performance measuring metrics",title:"Performance measuring metrics of MAC protocols",syl:"Performance Measuring Metrics",
html:()=>`
${GUIDE({"syl":"Performance Measuring Metrics","why":"To choose a MAC protocol, you need numbers: how much useful data it carries, how long a frame waits, and how fairly it treats the stations. This lesson defines these metrics and collects the formulas of Lessons 3 to 6 in one place, with a calculator to compare the protocols.","map":[["7.1","The metrics","What is measured?","Learn the definitions of offered load, throughput, utilisation, delay, fairness and stability."],["7.2","Formulas of the protocols","What are the formulas?","Read the table of formulas."],["7.3","Throughput against load","How does throughput change with the load?","Compare ALOHA and CSMA curves and change the value of a."],["7.4","Efficiency of CSMA/CD","How does the frame size change efficiency?","Use the calculator for Ethernet frames."],["7.5","Compare the protocols","Which protocol is best for given values?","Enter a network and read the efficiency of all protocols."],["7.6","Examination examples","How are the formulas used?","Work the numerical examples."]],"osi":"Layer 2, MAC sublayer.","pre":"Lessons 3 to 6.","time":"about 1 hour 30 minutes","next":"Lesson 8, IEEE 802 standards."})}
${LEARN(["define offered load, throughput, channel utilisation, delay, fairness and stability","state the throughput formulas of ALOHA, Slotted ALOHA, CSMA, CSMA/CD, bit map and binary countdown","calculate the normalised propagation delay a and the efficiency of CSMA/CD","choose a protocol from the values of load, a and frame size"])}
${SEC("7.1","The metrics")}
<table class="dt gt cmpt"><thead><tr><th>Metric</th><th>Definition</th><th>Unit</th></tr></thead><tbody>
<tr><td><b>Offered load G</b></td><td>The average number of frame transmissions that all stations attempt in one frame time (new frames and repeated frames).</td><td>frames per frame time</td></tr>
<tr><td><b>Throughput S</b></td><td>The average number of frames delivered successfully in one frame time. S &le; 1.</td><td>frames per frame time (or bits/s)</td></tr>
<tr><td><b>Channel utilisation (efficiency)</b></td><td>The fraction of the channel time that carries useful data. For a normalised throughput this is S itself.</td><td>percent</td></tr>
<tr><td><b>Capacity (maximum throughput)</b></td><td>The largest S that the protocol can reach for any G.</td><td>percent</td></tr>
<tr><td><b>Delay</b></td><td>The time from the arrival of a frame at the station to the end of its successful transmission (the waiting time to get the channel plus the transmission time).</td><td>seconds</td></tr>
<tr><td><b>Fairness</b></td><td>Whether every station gets the same share of the channel (for example, no station waits for ever).</td><td>qualitative</td></tr>
<tr><td><b>Stability</b></td><td>Whether the throughput stays near its best value when the load rises. In an unstable protocol (ALOHA) a high load drives throughput towards zero.</td><td>qualitative</td></tr>
<tr><td><b>Normalised propagation delay a</b></td><td>a = T<sub>p</sub> / T<sub>t</sub>, the propagation time divided by the transmission time of a frame. Small a (short cable, long frame) is good for CSMA.</td><td>no unit</td></tr>
<tr><td><b>Overhead</b></td><td>Channel time used for control instead of data (reservation slots, jam, contention slots).</td><td>percent</td></tr></tbody></table>
<p>The frame time is T<sub>t</sub> = frame length / bit rate. T<sub>p</sub> = distance / signal speed. The bit rate times the delay, a &times; (frame length), is the number of bits on the cable at one time.</p>
${SEC("7.2","Formulas of the protocols")}
<table class="dt gt cmpt"><thead><tr><th>Protocol</th><th>Throughput or efficiency</th><th>Maximum</th><th>Remarks</th></tr></thead><tbody>
<tr><td>Pure ALOHA</td><td>S = G e<sup>-2G</sup></td><td>0.184 at G = 0.5</td><td>Vulnerable time 2T</td></tr>
<tr><td>Slotted ALOHA</td><td>S = G e<sup>-G</sup></td><td>0.368 at G = 1</td><td>Vulnerable time T</td></tr>
<tr><td>Non-persistent CSMA</td><td>S = G e<sup>-aG</sup> / ( G (1 + 2a) + e<sup>-aG</sup> )</td><td>close to 1 for small a</td><td>Depends on a</td></tr>
<tr><td>1-persistent CSMA</td><td>Depends on G and a. For a small a the maximum is about 0.5 and it falls as G rises.</td><td>about 0.5 for a = 0.01</td><td>Waiting stations always collide</td></tr>
<tr><td>CSMA/CD</td><td>Efficiency = 1 / (1 + 2 e a) = 1 / (1 + 5.44 a)</td><td>approaches 1 as a approaches 0</td><td>Contention slots of 2T<sub>p</sub>, on average e of them for each frame</td></tr>
<tr><td>Bit map</td><td>d / (N + d) at low load; d / (d + 1) at high load</td><td>d / (d + 1)</td><td>d = frame time in bit times</td></tr>
<tr><td>Binary countdown</td><td>d / (d + log<sub>2</sub> N)</td><td>100% if the address is part of the frame</td><td>Unfair to low addresses</td></tr></tbody></table>
${NOTE("The constant in the CSMA/CD formula depends on how the book derives it. Tanenbaum gets 1 / (1 + 2e a) = 1 / (1 + 5.44 a). Some books use 6.44 or 5 as the constant. Use the formula of your textbook in the examination, and state the formula before you use it.")}
${SEC("7.3","Throughput against load")}
<p>The chart shows S against G for pure ALOHA, Slotted ALOHA and non-persistent CSMA. Select the value of a (T<sub>p</sub> / T<sub>t</sub>) for CSMA.</p>
<div class="vis"><div class="row"><span>a = <select id="sa" aria-label="a"><option>0.001</option><option selected>0.01</option><option>0.05</option><option>0.1</option><option>0.5</option><option>1</option></select></span></div><div id="sch"></div><div id="smx"></div></div>
${DOIT(["Select a = 0.001. The CSMA curve rises above 0.9 (its maximum is 0.94). The cable is very short compared with a frame, so almost no collisions happen.","Select a = 1. A frame lasts only as long as the signal needs to cross the cable, so carrier sense is of no use. The maximum falls to 0.14, which is lower than pure ALOHA.","Note that pure ALOHA and Slotted ALOHA fall to zero at a high load. A protocol that does this is <b>unstable</b>."])}
${SEC("7.4","Efficiency of CSMA/CD")}
<p>Efficiency = 1 / (1 + 5.44 a), where a = T<sub>p</sub> / T<sub>t</sub>. A short frame or a long cable makes a large and the efficiency low. The calculator uses the Ethernet minimum and maximum frame sizes.</p>
<div class="vis"><div class="row"><span>Bit rate <select id="eb" aria-label="Bit rate"><option value="10">10 Mbps</option><option value="100">100 Mbps</option><option value="1000">1 Gbps</option></select></span><span>Frame <input type="range" id="ef" min="64" max="1518" step="2" value="1000" aria-label="Frame size"> <b id="efv">1000</b> bytes</span><span>Cable <input type="range" id="ed" min="100" max="2500" step="100" value="2500" aria-label="Cable length"> <b id="edv">2500</b> m</span></div><div id="eres"></div><div id="ech"></div></div>
${SEC("7.5","Compare the protocols for one network")}
<p>Enter a network. The calculator uses the formulas of 7.2 for the maximum efficiency of each protocol. For the bit map and binary countdown, d is the frame length in bit times.</p>
<div class="vis"><div class="row"><span>Frame <input type="range" id="pf" min="64" max="12000" step="64" value="1000" aria-label="Frame bits"> <b id="pfv">1000</b> bits</span><span>a <select id="pa" aria-label="a"><option>0.01</option><option selected>0.1</option><option>0.5</option></select></span><span>Stations N <select id="pn" aria-label="N"><option>8</option><option selected>32</option><option>128</option></select></span></div><div id="pres"></div></div>
${SEC("7.6","Examination examples")}
<table class="dt gt cmpt"><thead><tr><th>Question</th><th>Working</th><th>Answer</th></tr></thead><tbody>
<tr><td>CSMA/CD on 10 Mbps. Frame 1000 bits. Cable 2000 m. Speed 2 &times; 10<sup>8</sup> m/s. Find the efficiency with 1 / (1 + 5.44a).</td><td>T<sub>t</sub> = 1000 / 10<sup>7</sup> = 100 &micro;s. T<sub>p</sub> = 2000 / (2 &times; 10<sup>8</sup>) = 10 &micro;s. a = 0.1. Efficiency = 1 / (1 + 0.544)</td><td><b>64.8%</b></td></tr>
<tr><td>Bit map, N = 16, d = 64 bit times. Efficiency at low load and at high load.</td><td>64 / (16 + 64) and 64 / (64 + 1)</td><td><b>80% and 98.5%</b></td></tr>
<tr><td>Binary countdown, N = 256 stations, frame 1000 bits (address not part of the frame).</td><td>d / (d + log<sub>2</sub> N) = 1000 / (1000 + 8)</td><td><b>99.2%</b></td></tr>
<tr><td>Slotted ALOHA, 1 Mbps channel, 1000-bit frames. Maximum good frames per second.</td><td>T = 1 ms. S = 0.368 at G = 1. Frames per second = 0.368 / 0.001</td><td><b>368 frames/s</b></td></tr></tbody></table>
${quiz("m7q1","Which statement about a = Tp / Tt is correct?",["A small a is good for CSMA","A large a is good for CSMA","a has no effect on CSMA","a is the offered load"],0,"A small a means that the signal crosses the cable much faster than a frame is sent, so carrier sense is accurate.")}
${quiz("m7q2","What is the difference between offered load G and throughput S?",["They are always equal","G includes the frames that collide and are sent again, S counts only the delivered frames","S is larger than G","G is measured in bits"],1,"G counts all transmission attempts. S counts the successful ones. S is at most G.")}
${quiz("m7q3","Which protocol has an efficiency of d / (d + log2 N)?",["Bit map","Binary countdown","Pure ALOHA","CSMA/CD"],1,"The contest of binary countdown costs log2 N bit times for each frame.")}
${EXAM(["Define offered load, throughput, delay and fairness.","State the throughput formulas of pure ALOHA and Slotted ALOHA. Find the maximum value of each.","A CSMA/CD LAN has a = 0.2. Find the efficiency. (Answer: 1 / (1 + 5.44 &times; 0.2) = 0.479.)","Compare a bit-map protocol and CSMA/CD at low load and at high load.","Why is CSMA more efficient than ALOHA when a is small and not when a is large?"])}
${SUM(["G is the offered load. S is the throughput. a = Tp / Tt.","Pure ALOHA 18.4% at G = 0.5. Slotted ALOHA 36.8% at G = 1. CSMA depends on a, and is close to 100% for small a.","CSMA/CD efficiency is 1 / (1 + 5.44 a) in the derivation used here.","Bit map d / (d + 1) at high load. Binary countdown d / (d + log2 N)."])}
`,
mount(r){
  const sc=()=>{const a=+$("#sa",r).value;
    $("#sch",r).innerHTML=lineChart({W:660,H:320,legR:320,xmax:12,ymax:1,xt:6,xl:'Offered load G',yl:'Throughput S',label:'Throughput against load',series:[{f:SPURE,name:'Pure ALOHA',c:'var(--c1)'},{f:SSLOT,name:'Slotted ALOHA',c:'var(--c2)'},{f:G=>SNP(G,a),name:'Non-persistent CSMA, a = '+a,c:'var(--c3)'}]});
    const m1=maxOf(SPURE),m2=maxOf(SSLOT),m3=maxOf(G=>SNP(G,a));
    $("#smx",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Protocol</th><th>Maximum S</th><th>at G</th></tr></thead><tbody><tr><td>Pure ALOHA</td><td><b>${m1.S.toFixed(3)}</b></td><td>${m1.G.toFixed(2)}</td></tr><tr><td>Slotted ALOHA</td><td><b>${m2.S.toFixed(3)}</b></td><td>${m2.G.toFixed(2)}</td></tr><tr><td>Non-persistent CSMA (a = ${a})</td><td><b>${m3.S.toFixed(3)}</b></td><td>${m3.G.toFixed(2)}</td></tr></tbody></table>`};
  $("#sa",r).onchange=sc;sc();
  const ec=()=>{const bw=+$("#eb",r).value*1e6,F=+$("#ef",r).value*8,d=+$("#ed",r).value;$("#efv",r).textContent=F/8;$("#edv",r).textContent=d;
    const tt=F/bw,tp=d/2e8,a=tp/tt,ef=1/(1+5.44*a);
    $("#eres",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>T<sub>t</sub> = frame / bit rate</td><td>${F} / ${(bw/1e6)} Mbps = <b>${(tt*1e6).toFixed(2)} &micro;s</b></td></tr><tr><td>T<sub>p</sub> = distance / speed</td><td>${d} / (2 &times; 10<sup>8</sup>) = <b>${(tp*1e6).toFixed(2)} &micro;s</b></td></tr><tr><td>a = T<sub>p</sub> / T<sub>t</sub></td><td><b>${a.toFixed(3)}</b></td></tr><tr><td>Efficiency = 1 / (1 + 5.44a)</td><td><b>${(ef*100).toFixed(1)}%</b> (useful data rate about ${(ef*bw/1e6).toFixed(1)} Mbps)</td></tr></tbody></table><div class="meter" style="margin:8px 0"><i style="width:${ef*100}%"></i></div>`;
    $("#ech",r).innerHTML=lineChart({W:640,H:260,legR:230,xmax:1,ymax:1,xt:5,xl:'a = Tp / Tt',yl:'Efficiency',label:'CSMA/CD efficiency against a',series:[{f:x=>1/(1+5.44*x),name:'1 / (1 + 5.44a)',c:'var(--c1)'}],pts:[{x:Math.min(a,1),y:ef,txt:'this network',c:'var(--bad)'}]})};
  ["eb","ef","ed"].forEach(k=>$("#"+k,r).oninput=ec);$("#eb",r).onchange=ec;ec();
  const pc=()=>{const F=+$("#pf",r).value,a=+$("#pa",r).value,N=+$("#pn",r).value;$("#pfv",r).textContent=F;
    const rows=[['Pure ALOHA',0.184,'at G = 0.5'],['Slotted ALOHA',0.368,'at G = 1'],['Non-persistent CSMA',maxOf(G=>SNP(G,a)).S,'a = '+a],['CSMA/CD',1/(1+5.44*a),'1 / (1 + 5.44a)'],['Bit map (high load)',F/(F+1),'d / (d + 1)'],['Bit map (low load)',F/(N+F),'d / (N + d)'],['Binary countdown',F/(F+Math.log2(N)),'d / (d + log2 N)']];
    $("#pres",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Protocol</th><th>Maximum efficiency</th><th>Formula</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td><b>${(x[1]*100).toFixed(1)}%</b></td><td>${x[2]}</td><td style="width:35%"><div class="meter"><i style="width:${x[1]*100}%"></i></div></td></tr>`).join('')}</tbody></table><div class="small muted">Efficiency is only one metric. Collision-free protocols have a higher delay at low load, and ALOHA and 1-persistent CSMA lose throughput at a high load.</div>`};
  ["pf","pa","pn"].forEach(k=>$("#"+k,r).oninput=pc);$("#pa",r).onchange=pc;$("#pn",r).onchange=pc;pc();
}});

/* ===== Unit III Lesson 8: IEEE 802 standards and variants ===== */
const EFIELDS=[
 {n:'Preamble',b:7,d:'7 bytes of alternating 1 and 0 (10101010). The receiver uses them to synchronise its clock with the sender. The preamble is added by the physical layer and is not counted in the frame size.'},
 {n:'SFD',b:1,d:'Start Frame Delimiter, 1 byte (10101011). The last two bits (11) show that the frame starts after this byte.'},
 {n:'Destination',b:6,d:'The MAC address of the receiver (Lesson 1). The NIC compares it with its own address to accept or drop the frame.'},
 {n:'Source',b:6,d:'The MAC address of the sender.'},
 {n:'Type/Len',b:2,d:'In IEEE 802.3 this field is the length of the data (up to 1500). In Ethernet II (used by IP) it is the type of the upper layer protocol (for example 0x0800 is IPv4). A value above 1500 means type.'},
 {n:'Data',b:'46 to 1500',d:'The data from the upper layer. The minimum is 46 bytes. If there is less data, <b>padding</b> is added. The minimum makes the frame 64 bytes, which is needed by CSMA/CD (Lesson 4). The maximum is 1500 bytes, which is the MTU.'},
 {n:'FCS',b:4,d:'Frame Check Sequence, a 32-bit CRC (Unit II, Lesson 3). The receiver calculates the CRC and drops the frame if it does not match.'}];
lesson({nav:"8. IEEE 802 standards and variants",title:"IEEE 802 series of standards and their variants",syl:"IEEE Standards 802 series & their variant",
html:()=>`
${GUIDE({"syl":"IEEE Standards 802 series & their variant","why":"The MAC protocols of this unit are not only theory. They are used in the IEEE 802 standards: Ethernet uses CSMA/CD, Wi-Fi uses CSMA/CA, and the older token networks use controlled access. This lesson lists the standards, their frames and their variants, and links each one to the protocol that it uses.","map":[["8.1","The IEEE 802 project","What are the 802 standards?","Read the table of standards."],["8.2","The 802 layering","How do LLC, MAC and the physical layer add their parts to a frame?","Step through the encapsulation."],["8.3","Ethernet (802.3)","What does an Ethernet frame contain and which variants exist?","Click each field and change the data size."],["8.4","Wi-Fi (802.11)","How does a wireless LAN differ and what are its variants?","Read the architecture, the frame and the table of variants."],["8.5","Other standards","What do 802.1, 802.15 and 802.16 cover?","Read the list."],["8.6","MAC protocol of each standard","Which protocol of this unit does each standard use?","Read the map."]],"osi":"Layers 1 and 2. The IEEE 802 standards define the physical layer and the data link layer (LLC and MAC).","pre":"Lessons 1 to 7.","time":"about 1 hour","next":"Unit I, IV and V of the Computer Networks course."})}
${LEARN(["list the main IEEE 802 standards and say what each one covers","describe the Ethernet frame fields and the minimum and maximum frame size","name the Ethernet and Wi-Fi variants and their main values","state the MAC protocol that each standard uses"])}
${SEC("8.1","The IEEE 802 project")}
<p><b>IEEE 802</b> is the group of standards for local area networks (LAN) and metropolitan area networks (MAN) made by the IEEE (Institute of Electrical and Electronics Engineers). The standards define the <b>physical layer</b> and the <b>data link layer</b>. The data link layer is divided into the LLC and the MAC sublayers (Lesson 1). Each standard has a number. A letter after the number (for example 802.11b) is a variant or an amendment.</p>
<table class="dt gt cmpt"><thead><tr><th>Standard</th><th>Subject</th><th>Remark</th></tr></thead><tbody>
<tr><td><b>802.1</b></td><td>Overview, architecture, bridging and management. Includes 802.1D (spanning tree), 802.1Q (VLAN) and 802.1X (port-based access control).</td><td>Used with all LAN types</td></tr>
<tr><td><b>802.2</b></td><td>Logical Link Control (LLC)</td><td>The upper sublayer for all LANs</td></tr>
<tr><td><b>802.3</b></td><td>Ethernet, CSMA/CD</td><td>Most common wired LAN</td></tr>
<tr><td><b>802.4</b></td><td>Token bus</td><td>Withdrawn</td></tr>
<tr><td><b>802.5</b></td><td>Token ring</td><td>Replaced by Ethernet; no longer used in new networks</td></tr>
<tr><td><b>802.11</b></td><td>Wireless LAN (Wi-Fi), CSMA/CA</td><td>Most common wireless LAN</td></tr>
<tr><td><b>802.15</b></td><td>Wireless personal area network. 802.15.1 is Bluetooth. 802.15.4 is the low-rate standard that ZigBee uses.</td><td>Short range</td></tr>
<tr><td><b>802.16</b></td><td>Broadband wireless access (WiMAX), a wireless MAN</td><td>Long range</td></tr></tbody></table>
${SEC("8.2","The 802 layering: LLC, MAC and physical layer")}
<p>The network layer hands a packet to the data link layer. The LLC, the MAC and the physical layer each add their own part. Step through the process.</p>
<div class="vis"><div id="sk"></div><div id="sks"></div></div>
${NOTE("In practice most IP traffic on Ethernet uses the <b>Type</b> field of Ethernet II and does not carry an LLC header. The LLC header (IEEE 802.2) is used with the Length field of 802.3 and in Wi-Fi.")}
${SEC("8.3","Ethernet (IEEE 802.3)")}
<p>An Ethernet frame has seven fields. Click a field to read its description.</p>
<div class="vis"><div class="efr" id="ef">${EFIELDS.map((f,i)=>`<button type="button" data-f="${i}" aria-pressed="${i===2}" style="flex:${typeof f.b==='number'?Math.max(f.b,5):14} 1 0">${f.n}<br><span class="small">${f.b} B</span></button>`).join('')}</div><div id="efd" class="callout i"></div></div>
<p>The frame without the preamble and the SFD has a size between <b>64 and 1518 bytes</b>: 6 + 6 + 2 + (46 to 1500) + 4. The minimum comes from the collision-detection rule (Lesson 4). Move the slider to change the data size.</p>
<div class="vis"><div class="row"><span>Data from the upper layer <input type="range" id="ep" min="1" max="1500" value="100" aria-label="Data size"> <b id="epv">100</b> bytes</span></div><div id="epr"></div></div>
<h3 class="h4">Ethernet variants</h3>
<table class="dt gt cmpt"><thead><tr><th>Name</th><th>Speed</th><th>Medium</th><th>Largest segment</th><th>Topology</th></tr></thead><tbody>
<tr><td>10BASE5 (thick Ethernet)</td><td>10 Mbps</td><td>Thick coaxial cable</td><td>500 m</td><td>Bus</td></tr>
<tr><td>10BASE2 (thin Ethernet)</td><td>10 Mbps</td><td>Thin coaxial cable</td><td>185 m</td><td>Bus</td></tr>
<tr><td>10BASE-T</td><td>10 Mbps</td><td>Twisted pair (UTP)</td><td>100 m</td><td>Star (hub)</td></tr>
<tr><td>100BASE-TX (Fast Ethernet)</td><td>100 Mbps</td><td>Twisted pair, Category 5</td><td>100 m</td><td>Star (hub or switch)</td></tr>
<tr><td>1000BASE-T (Gigabit Ethernet)</td><td>1 Gbps</td><td>Twisted pair, Category 5e</td><td>100 m</td><td>Star (switch)</td></tr>
<tr><td>10 Gigabit Ethernet and faster</td><td>10 Gbps and more</td><td>Optical fibre or twisted pair</td><td>depends on the type</td><td>Star (switch), full duplex</td></tr></tbody></table>
<p>The name shows the speed (10, 100, 1000), the signalling (BASE means baseband) and the medium (5 and 2 are the segment lengths in hundreds of metres, T is twisted pair, X is a coding method). Early Ethernet shared one cable and used CSMA/CD. Modern Ethernet connects each station to a <b>switch</b> by its own link. The link is full duplex, so there is no collision and CSMA/CD is not used, but the frame format is the same.</p>
${SEC("8.4","Wireless LAN (IEEE 802.11, Wi-Fi)")}
<p><b>Architecture.</b> The stations that are in the radio range of one <b>access point (AP)</b> form a <b>Basic Service Set (BSS)</b>. Several BSSs that are connected by a distribution system (usually Ethernet) form an <b>Extended Service Set (ESS)</b>. A station moves from one AP to another within an ESS (roaming).</p>
<p><b>MAC.</b> 802.11 has the <b>DCF</b> (Distributed Coordination Function), which is CSMA/CA with an ACK for each frame and optional RTS/CTS (Lesson 4). It also has an optional <b>PCF</b> (Point Coordination Function), in which the AP polls the stations in turn (a collision-free method).</p>
<p><b>Frame.</b> An 802.11 data frame has: Frame Control (2 bytes), Duration/ID (2), Address 1 (6), Address 2 (6), Address 3 (6), Sequence Control (2), Address 4 (6, only between access points), Frame body (0 to 2312) and FCS (4). Three or four addresses are needed because the frame has a receiver, a transmitter and the original source or final destination that are different when it passes an AP.</p>
<table class="dt gt cmpt"><thead><tr><th>Variant</th><th>Year</th><th>Band</th><th>Highest rate (theoretical)</th><th>Remark</th></tr></thead><tbody>
<tr><td>802.11b</td><td>1999</td><td>2.4 GHz</td><td>11 Mbps</td><td>First popular Wi-Fi</td></tr>
<tr><td>802.11a</td><td>1999</td><td>5 GHz</td><td>54 Mbps</td><td>OFDM</td></tr>
<tr><td>802.11g</td><td>2003</td><td>2.4 GHz</td><td>54 Mbps</td><td>Works with 802.11b</td></tr>
<tr><td>802.11n (Wi-Fi 4)</td><td>2009</td><td>2.4 and 5 GHz</td><td>600 Mbps</td><td>MIMO (several antennas)</td></tr>
<tr><td>802.11ac (Wi-Fi 5)</td><td>2013</td><td>5 GHz</td><td>about 6.9 Gbps</td><td>Wider channels, more streams</td></tr>
<tr><td>802.11ax (Wi-Fi 6)</td><td>2019</td><td>2.4 and 5 GHz (6 GHz in Wi-Fi 6E)</td><td>about 9.6 Gbps</td><td>OFDMA, better use in crowded places</td></tr></tbody></table>
${SEC("8.5","Other standards")}
<ul><li><b>802.1Q (VLAN).</b> A 4-byte tag is added to the Ethernet frame to show the virtual LAN of the frame.</li>
<li><b>802.1D (spanning tree).</b> Switches use it to remove loops from a bridged LAN.</li>
<li><b>802.15.1 (Bluetooth).</b> A <b>piconet</b> has one master and up to seven active slaves. The master controls access by time slots, so no collision happens.</li>
<li><b>802.15.4.</b> Low data rate (250 kbps) and low power, for sensors. ZigBee is built on it.</li>
<li><b>802.16 (WiMAX).</b> Wireless access over several kilometres. The base station controls the channel (collision-free scheduling).</li>
<li><b>802.5 (token ring) and 802.4 (token bus).</b> A small frame called the <b>token</b> goes around the stations. Only the station that holds the token may send. This is controlled access with no collisions. These networks are no longer used in new installations.</li></ul>
${SEC("8.6","The MAC protocol of each standard")}
<table class="dt gt cmpt"><thead><tr><th>Standard</th><th>MAC protocol</th><th>Class</th><th>Lesson</th></tr></thead><tbody>
<tr><td>802.3 shared Ethernet</td><td>1-persistent CSMA/CD with BEB</td><td>Random access</td><td>2, 4</td></tr>
<tr><td>802.3 switched, full duplex</td><td>No contention (a link for each station)</td><td>None needed</td><td>1</td></tr>
<tr><td>802.11 (DCF)</td><td>CSMA/CA, optional RTS/CTS</td><td>Random access</td><td>4</td></tr>
<tr><td>802.11 (PCF)</td><td>Polling by the AP</td><td>Controlled access</td><td>5</td></tr>
<tr><td>802.4, 802.5</td><td>Token passing</td><td>Collision-free</td><td>5</td></tr>
<tr><td>802.15.1 Bluetooth</td><td>Master polls the slaves in time slots</td><td>Collision-free</td><td>5</td></tr>
<tr><td>Satellite and radio data links, RFID readers</td><td>ALOHA and Slotted ALOHA, or a variant</td><td>Random access</td><td>3</td></tr></tbody></table>
${quiz("m8q1","Which standard defines Ethernet?",["IEEE 802.2","IEEE 802.3","IEEE 802.5","IEEE 802.11"],1,"802.3 is Ethernet (CSMA/CD). 802.11 is Wi-Fi.")}
${quiz("m8q2","What is the minimum size of an Ethernet frame (destination address to FCS)?",["46 bytes","64 bytes","512 bytes","1518 bytes"],1,"The data field has at least 46 bytes, so the frame has at least 14 + 46 + 4 = 64 bytes.")}
${quiz("m8q3","Which MAC protocol does the basic Wi-Fi mode (DCF) use?",["CSMA/CD","Token passing","CSMA/CA","Slotted ALOHA"],2,"A wireless station cannot detect a collision while it sends, so 802.11 uses collision avoidance.")}
${EXAM(["List the IEEE 802 standards 802.1, 802.2, 802.3, 802.11, 802.15 and 802.16 with one line on each.","Draw the Ethernet frame and give the size of each field. Why is the minimum data size 46 bytes?","A station sends 20 bytes of data on Ethernet. How many bytes of padding are added? What is the frame size? (Answer: 26 bytes of padding and a 64-byte frame.)","Compare 802.11b, 802.11g and 802.11n by band and highest rate.","State the MAC protocol used by 802.3, 802.11 and 802.15.1, and say whether it is contention or collision-free."])}
${SUM(["IEEE 802 standards define the physical layer and the LLC and MAC sublayers.","802.3 is Ethernet (CSMA/CD with BEB; switched full-duplex Ethernet has no collisions). Its frame is 64 to 1518 bytes.","802.11 is Wi-Fi. Its MAC is CSMA/CA (DCF) with an ACK, and RTS/CTS can be used. Variants differ in band and rate.","802.15.1 (Bluetooth), 802.5 (token ring) and 802.16 use controlled, collision-free access."])}
`,
mount(r){
  /* 802 layering story */
  const sk=$("#sk",r);
  const P=(t,c)=>`<span style="display:inline-block;padding:8px 10px;border:2px solid var(--${c});background:var(--${c}-soft,var(--surface2));border-radius:6px;margin:2px;font:600 13px var(--mono)">${t}</span>`;
  const STP=[
   {lay:'Network layer',pdu:[['Packet (data)','good']],cap:`<b>The network layer gives a packet to the data link layer.</b> The packet is the data for the LLC sublayer.`},
   {lay:'LLC sublayer',pdu:[['LLC header (DSAP, SSAP, Control)','pri'],['Packet','good']],cap:`<b>The LLC sublayer adds its header.</b> DSAP and SSAP show which upper layer protocol sends and receives the data. The result is the LLC PDU.`},
   {lay:'MAC sublayer',pdu:[['MAC header: dest, src, length','sec'],['LLC header','pri'],['Packet','good'],['FCS','sec']],cap:`<b>The MAC sublayer adds the MAC header and the trailer.</b> The header has the destination and source MAC addresses and the length (or type). The trailer is the FCS. The result is the MAC frame. If the data is shorter than 46 bytes, padding is added. CSMA/CD or CSMA/CA decides when the frame is sent.`},
   {lay:'Physical layer',pdu:[['Preamble + SFD','warn'],['MAC header','sec'],['LLC header','pri'],['Packet','good'],['FCS','sec']],cap:`<b>The physical layer adds the preamble and the start frame delimiter</b> and sends the bits on the medium, using the line coding of the standard.`},
   {lay:'At the receiver',pdu:[['Packet','good']],cap:`<b>The receiver does the steps in reverse.</b> The NIC removes the preamble, checks the destination address and the FCS, removes the MAC header and trailer, then the LLC removes its header and passes the packet to the network layer.`}];
  const stk=story(r,"#sks",{draw:i=>{const s=STP[i];sk.innerHTML=`<div class="small muted">Layer that works now:</div><div style="font:700 17px var(--body);margin:2px 0 8px">${s.lay}</div><div>${s.pdu.map(x=>P(x[0],x[1])).join('')}</div>`}});
  stk.set(STP.map(s=>({cap:s.cap})));
  /* ethernet fields */
  const fd=i=>{const f=EFIELDS[i];$$("[data-f]",r).forEach(b=>b.setAttribute('aria-pressed',+b.dataset.f===i));$("#efd",r).innerHTML=`<b>${f.n}</b> (${f.b} byte${f.b===1?'':'s'}). ${f.d}`};
  $$("[data-f]",r).forEach(b=>b.onclick=()=>fd(+b.dataset.f));fd(2);
  const ep=()=>{const p=+$("#ep",r).value;$("#epv",r).textContent=p;const pad=Math.max(0,46-p),fr=14+Math.max(p,46)+4,wire=fr+8+12;
    $("#epr",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>Padding added</td><td><b>${pad} bytes</b>${pad?' (data is shorter than 46 bytes)':''}</td></tr><tr><td>Frame size = 6 + 6 + 2 + data + padding + 4</td><td><b>${fr} bytes</b> (limits: 64 to 1518)</td></tr>
    <tr><td>Including preamble and SFD (8 bytes) and the 12-byte gap between frames</td><td>${wire} bytes on the cable</td></tr><tr><td>Useful data / bytes on the cable</td><td><b>${(100*p/wire).toFixed(1)}%</b> of the bit rate carries your data</td></tr></tbody></table><div class="meter" style="margin:8px 0"><i style="width:${100*p/wire}%"></i></div>`};
  $("#ep",r).oninput=ep;ep();
}});

function renderLive(){$("#livebox").innerHTML=`<p class="small muted" style="margin:0 0 8px">Quick reference, Unit III.</p><h4 style="margin:12px 0 6px">MAC address</h4><div class="code">48 bits: OUI (24) + device (24)\nI/G bit = 1: group address\nU/L bit = 1: local address\nFF:FF:FF:FF:FF:FF = broadcast</div><h4 style="margin:12px 0 6px">BEB</h4><div class="code">after n-th collision:\nK in 0 .. 2^n - 1\nwait K x slot (512 bit times)\nn limited to 10, give up at 16</div><h4 style="margin:12px 0 6px">ALOHA</h4><div class="code">Pure:    S = G e^(-2G)\n         max 0.184 at G = 0.5\n         vulnerable time 2T\nSlotted: S = G e^(-G)\n         max 0.368 at G = 1\n         vulnerable time T</div><h4 style="margin:12px 0 6px">CSMA</h4><div class="code">a = Tp / Tt\nCSMA/CD min frame = 2 Tp x rate\nCSMA/CD eff = 1/(1 + 5.44a)\nCSMA/CA: DIFS, back-off, SIFS+ACK,\nNAV, RTS/CTS</div><h4 style="margin:12px 0 6px">Collision-free</h4><div class="code">Bit map: d/(N+d) low,\n         d/(d+1) high\nBinary countdown: d/(d+log2 N)\nMLMA: G + active groups x M\nTree walk: depth first, left first</div><h4 style="margin:12px 0 6px">Ethernet frame</h4><div class="code">Preamble 7 | SFD 1 | Dest 6 | Src 6\nType/Len 2 | Data 46-1500 | FCS 4\nFrame 64 to 1518 bytes</div>`}

renderLive();go(0);

</script>
