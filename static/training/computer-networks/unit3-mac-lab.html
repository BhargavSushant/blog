/* ===== Unit III (rebuilt) Lesson 9: limited contention, adaptive tree walk ===== */
const ATW_N=8;
function atwRun(ready,shortcut){
  const slots=[];
  const who=n=>{let lo=n,hi=n;while(lo<ATW_N){lo*=2;hi=hi*2+1}const w=[];for(let k=lo-ATW_N;k<=hi-ATW_N;k++)if(ready.has(k))w.push(k);return w};
  const walk=(n,skip)=>{let out;
    if(skip)out='bad';else{const w=who(n);out=w.length===0?'idle':w.length===1?'ok':'bad';slots.push({node:n,who:w,out,skipNext:false})}
    if(out==='bad'&&n<ATW_N){const lo=walk(2*n,false);if(shortcut&&lo==='idle'){slots[slots.length-1].skipNext=true;walk(2*n+1,true)}else walk(2*n+1,false)}
    return out};
  walk(1,false);return slots}
function treePic(svg,slots,k,ready){
  svg.innerHTML='';svg.setAttribute('viewBox','0 0 760 314');
  const pos=n=>{let l=0,m=n;while(m>1){m>>=1;l++}const w=ATW_N>>l,idx=n-(1<<l),x=40+(idx*w+w/2)*92-46;return [x+20,40+l*70]};
  const status={};slots.slice(0,k+1).forEach((s,i)=>{status[s.node]={out:s.out,cur:i===k}});
  for(let n=2;n<2*ATW_N;n++){const a=pos(n),b=pos(n>>1);E('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'ed','stroke-width':2},svg)}
  for(let n=1;n<2*ATW_N;n++){const [x,y]=pos(n),st=status[n],cl=st?(st.out==='ok'?'ok':st.out==='bad'?'bad':'idle'):'';
    E('circle',{cx:x,cy:y,r:n>=ATW_N?17:19,class:'tnode '+cl+(st&&st.cur?' cur':'')},svg);
    E('text',{x,y:y+4,'text-anchor':'middle',class:'sl'},svg).textContent=n>=ATW_N?'S'+(n-ATW_N):n;
    if(n>=ATW_N&&ready.has(n-ATW_N)){E('rect',{x:x-20,y:y+24,width:40,height:15,rx:3,fill:'var(--sec)'},svg);E('text',{x,y:y+35,'text-anchor':'middle',class:'sgt',fill:'var(--on)',style:'fill:var(--on)'},svg).textContent='frame'}}
  E('text',{x:380,y:306,'text-anchor':'middle',class:'tk'},svg).textContent='green: one station sends (success)   red: collision   grey: idle slot   thick blue ring: the node of the current slot'}
lesson({nav:"9. Limited contention: adaptive tree walk",title:"Limited contention protocols: the adaptive tree walk",syl:"Limited Contention Protocols: Adaptive Tree Walk",
html:()=>`
${GUIDE({"syl":"Limited Contention Protocols: Adaptive Tree Walk","why":"Contention protocols have a low delay when the load is low but waste time in collisions when the load is high. Collision-free protocols are the opposite. A limited contention protocol uses contention at low load and a controlled, collision-free search at high load. The adaptive tree walk is the standard example.","map":[["9.1","The idea of limited contention","Why does contention fail at high load?","Calculate the chance of success in a slot."],["9.2","Adaptive tree walk","How is a group of colliding stations separated?","Choose the stations and watch a depth-first search of the tree."],["9.3","Where to start the search","How is the cost of the search reduced?","Read the rule for the starting level."],["9.4","The three classes","How do the classes compare?","Read the comparison."]],"osi":"Layer 2, MAC sublayer.","pre":"Lessons 3 to 8.","time":"about 1 hour","next":"Lesson 10, performance measuring metrics."})}
${LEARN(["explain why a contention protocol works well at low load and badly at high load","calculate the chance that exactly one of k stations sends in a slot","trace the adaptive tree walk for a given set of ready stations and count the slots","state the starting level that reduces the search time"])}
${SEC("9.1","The idea of limited contention")}
<p>Suppose k stations contend for a slot. Each one sends with probability p. The slot is successful when exactly one station sends. The chance is</p>
<div class="callout i"><b>P(success) = k &times; p &times; (1 - p)<sup>k - 1</sup></b></div>
<p>This is largest when <b>p = 1/k</b>. Then P(success) = (1 - 1/k)<sup>k-1</sup>. The table shows that, even with the best p, the chance of success falls as k rises, and it never falls below 1/e = 0.368.</p>
<table class="dt gt cmpt"><thead><tr><th>Stations k</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>8</th><th>16</th><th>very large</th></tr></thead><tbody><tr><td>P(success) at p = 1/k</td>${[1,2,3,4,5,8,16].map(k=>`<td>${Math.pow(1-1/k,k-1).toFixed(3)}</td>`).join('')}<td>0.368</td></tr></tbody></table>
<p>If more stations contend for each slot, the chance of success of each slot is lower. <b>Limited contention</b> reduces the number of stations that contend in a slot. At low load all stations can contend in the same slot (the delay is small). At high load the stations are divided into groups, and only one group contends in a slot, so k is small and the chance of success is high. If the groups are made so small that each has one station, the protocol is collision-free.</p>
<div class="vis"><div class="row"><span>Your probability p <input type="range" id="pp" min="0.05" max="1" step="0.05" value="0.3" aria-label="p"> <b id="ppv">0.3</b></span></div><div id="pch"></div><div class="small muted">The red curve shows the best possible chance (p = 1/k for every k). The blue curve shows a fixed p. A fixed p is good for one value of k only.</div></div>
${SEC("9.2","Adaptive tree walk")}
<p>The <b>adaptive tree walk</b> protocol (Capetanakis, 1979) divides the stations by arranging them as the leaves of a <b>binary tree</b>. The picture shows 8 stations S0 to S7. Each internal node stands for the group of stations below it. Node 1 (the root) is all 8 stations, node 2 is S0 to S3, node 3 is S4 to S7, node 4 is S0 and S1, and so on.</p>
${DEF("Adaptive tree walk","is a limited contention protocol. In slot 0 all stations with a frame may send. If there is a collision, the next slot is given only to the stations below the left child of the node. The search goes depth first: after a collision at a node, search its left subtree and then its right subtree. After a success or an idle slot, go on to the next node.")}
<ol><li>Slot 0 belongs to <b>node 1</b>. Every station with a frame sends.</li>
<li>If exactly one station sends, the frame is delivered and the search goes on to the next node (an idle or a successful slot ends the search below that node).</li>
<li>If two or more stations send, there is a <b>collision</b>. In the next slot only the stations in the <b>left child</b> may send. Then the same rule is applied there, going down the tree until a node has one station or none. After that the <b>right child</b> is searched.</li>
<li>When all the nodes are searched, the stations that had a frame have all sent.</li></ol>
<p>Choose the stations with a frame. The stations that are in the same group are found by the search, and the stations that are not ready are skipped quickly. Step through the slots.</p>
<div class="vis"><div class="row"><b>Stations with a frame:</b> ${[0,1,2,3,4,5,6,7].map(j=>`<label class="pill"><input type="checkbox" data-at="${j}" ${[2,3,5].includes(j)?'checked':''}>S${j}</label>`).join('')}<label class="pill"><input type="checkbox" id="atsc">Use the shortcut (see below)</label></div><svg id="tr" role="img" aria-label="Binary tree of stations and the search"></svg><div id="atl" class="small"></div><div id="trs"></div></div>
<p><b>The shortcut.</b> If a collision happens at a node and the left child gives an <b>idle</b> slot, the right child must have two or more ready stations (the collision at the parent proves that at least two stations are below it). The slot of the right child itself would be a collision, so it can be skipped and the search can go directly to the children of the right child. Tick the box to see this.</p>
${DOIT(["With S2, S3 and S5 ready: the root collides, node 2 collides, node 4 is idle, node 5 collides, S2 and S3 succeed, then node 3 has one station (S5) and succeeds. This is 7 slots for 3 frames.","Select only one station. The root slot is a success (one slot).","Select all 8 stations. Count the slots: every node of the tree is visited (15 slots) and 8 frames are sent. At full load the search costs about two slots for each frame.","Select S4 and S5 and tick the shortcut. Node 2 is idle, so node 3 must collide and its own slot is skipped. The search needs 6 slots. Without the shortcut it needs 7."])}
${SEC("9.3","Where to start the search")}
<p>If the load is low, a search that starts at the root is right: the first slot is often a success or idle. If the load is high, many stations are ready, and the root and the upper levels are nearly always collisions. The search wastes slots at the top of the tree.</p>
<p>The protocol is <b>adaptive</b> because it can start at a lower level of the tree. Suppose q stations are ready on average. At level i of the tree there are 2<sup>i</sup> nodes, and each node has about q / 2<sup>i</sup> ready stations. The best level is the one where this number is about 1, which is <b>i = log<sub>2</sub> q</b>. The stations below the nodes of that level are given one slot each, in order. Each node then has about one ready station, so each slot is likely to be a success. When the load rises, the search starts lower in the tree. When it falls, the search starts higher.</p>
${SEC("9.4","The three classes of MAC protocols")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Contention (ALOHA, CSMA)</th><th>Collision-free (bit map, binary countdown)</th><th>Limited contention (adaptive tree walk)</th></tr></thead><tbody>
<tr><td>Low load</td><td>Low delay (a station sends at once)</td><td>Higher delay (a station waits for its turn or reservation)</td><td>Low delay (as contention)</td></tr>
<tr><td>High load</td><td>Many collisions, low throughput</td><td>High efficiency</td><td>High efficiency (as collision-free)</td></tr>
<tr><td>Collisions</td><td>Yes</td><td>No</td><td>Yes at the start, controlled by the search</td></tr></tbody></table>
${quiz("m6q1","Which value of p gives the highest chance that exactly one of k contending stations sends?",["p = 1/2","p = 1/k","p = 1","p = k"],1,"k p (1-p)^(k-1) has its maximum at p = 1/k.")}
${quiz("m6q2","In the adaptive tree walk, a collision occurs at node 2. Which stations may send in the next slot?",["All stations","Only the stations below the left child of node 2","Only the stations below the right child of node 2","No station"],1,"The search goes to the left child (node 4) first.")}
${quiz("m6q3","Stations S0 and S1 are the only stations with a frame (8 stations, no shortcut). How many slots are used?",["3","4","5","7"],3,"The root, node 2 and node 4 collide (3 slots). S0 and S1 succeed (2 slots). Node 5 is idle (1 slot) and node 3 is idle (1 slot). The total is 7 slots.")}
${EXAM(["Derive P(success) for k stations that send with probability p. For which p is it maximum, and what is the value for k = 2 and k = 3?","Describe the adaptive tree walk protocol. Draw the tree for 8 stations and show the slots when stations S2, S3 and S5 have a frame. (Answer: 7 slots, see 9.2.)","Why is it better to start the search at level log2 q and not at the root?","Why is a limited contention protocol better than a pure contention or a pure collision-free protocol?"])}
${SUM(["With k stations contending and each sending with probability p, P(success) = k p (1-p)^(k-1), and it is largest at p = 1/k.","Limited contention: contention at low load, groups at high load.","Adaptive tree walk: stations are the leaves of a binary tree. After a collision at a node, search the left child and then the right child (depth first).","The search should start at level log2 q, where each node has about one ready station."])}
`,
mount(r){
  const ch=()=>{const p=+$("#pp",r).value;$("#ppv",r).textContent=p;$("#pch",r).innerHTML=lineChart({W:640,H:290,legR:300,xmax:16,ymax:1,xl:'Number of contending stations k',yl:'P(success)',label:'Chance of success against k',xt:8,series:[{f:x=>x<1?NaN:Math.pow(1-1/x,x-1),name:'best p = 1/k',c:'var(--bad)'},{f:x=>x*p*Math.pow(1-p,x-1),name:'fixed p = '+p,c:'var(--c1)'}]})};
  $("#pp",r).oninput=ch;ch();
  const svg=$("#tr",r);let st=null;
  const run=()=>{const ready=new Set($$("[data-at]",r).filter(c=>c.checked).map(c=>+c.dataset.at)),sc=$("#atsc",r).checked,sl=atwRun(ready,sc);
    const nm=n=>n>=ATW_N?'S'+(n-ATW_N):'node '+n;
    const caps=sl.map((s,i)=>{const w=s.who.length?s.who.map(x=>'S'+x).join(', '):'none';
      return `<b>Slot ${i}: ${nm(s.node)}.</b> The stations below this node that have a frame: <b>${w}</b>. `+(s.out==='bad'?`Two or more stations send, so there is a <b>collision</b>. The next slot goes to the left child (node ${2*s.node}).`:s.out==='ok'?`Exactly one station sends, so the frame is <b>delivered</b>. The search goes on to the next node.`:`Nobody sends, so the slot is <b>idle</b>. The search goes on to the next node.`)+(s.skipNext?` <b>Shortcut:</b> the left child was idle, so the right sibling (node ${s.node+1}) must have two or more ready stations. Its own slot is skipped and the search goes straight to its left child.`:'')});
    if(!sl.length)return;
    const tot=sl.length;
    const stps=sl.map((s,i)=>({cap:caps[i]+(i===tot-1?` <b>The search is complete: ${tot} slots for ${ready.size} frame${ready.size===1?'':'s'}.</b>`:'')}));
    st=story(r,"#trs",{draw:i=>{treePic(svg,sl,i,ready);$("#atl",r).innerHTML='<b>Slots so far:</b> '+sl.slice(0,i+1).map((s,k)=>`<span class="pill" style="background:var(--${s.out==='ok'?'good':s.out==='bad'?'bad':'surface2'}-soft)">${k}: ${s.node>=ATW_N?'S'+(s.node-ATW_N):'n'+s.node}</span>`).join(' ')}});st.set(stps)};
  $$("[data-at]",r).forEach(c=>c.onchange=run);$("#atsc",r).onchange=run;run();
}});

/* ===== Unit III (rebuilt) Lesson 10: performance measuring metrics ===== */
const SNP=(G,a)=>G*Math.exp(-a*G)/(G*(1+2*a)+Math.exp(-a*G));
const maxOf=f=>{let b=0,g=0;for(let x=0.005;x<=60;x+=0.005){const y=f(x);if(y>b){b=y;g=x}}return {S:b,G:g}};
lesson({nav:"10. Performance measuring metrics",title:"Performance measuring metrics of MAC protocols",syl:"Performance Measuring Metrics",
html:()=>`
${GUIDE({"syl":"Performance Measuring Metrics","why":"To choose a MAC protocol, you need numbers: how much useful data it carries, how long a frame waits, and how fairly it treats the stations. This lesson defines these metrics and collects the formulas of Lessons 3 to 9 in one place, with a calculator to compare the protocols.","map":[["10.1","The metrics","What is measured?","Learn the definitions of offered load, throughput, bandwidth, utilisation, delay, packet loss, jitter, reliability, fairness and stability."],["10.2","Delay, throughput and jitter in numbers","How are they calculated?","Use the delay, throughput and jitter calculators and read the relations between the metrics."],["10.3","Formulas of the protocols","What are the formulas?","Read the table of formulas."],["10.4","Throughput against load","How does throughput change with the load?","Compare ALOHA and CSMA curves and change the value of a."],["10.5","Efficiency of CSMA/CD","How does the frame size change efficiency?","Use the calculator for Ethernet frames."],["10.6","Compare the protocols","Which protocol is best for given values?","Enter a network and read the efficiency of all protocols."],["10.7","Examination examples","How are the formulas used?","Work the numerical examples."]],"osi":"Layer 2, MAC sublayer.","pre":"Lessons 3 to 9.","time":"about 2 hours","next":"Lesson 11, IEEE 802 standards."})}
${LEARN(["define offered load, throughput, bandwidth, channel utilisation, delay, packet loss, jitter, reliability, fairness and stability","calculate the total delay, the throughput and the jitter from given values","state the throughput formulas of ALOHA, Slotted ALOHA, CSMA, CSMA/CD, bit map and binary countdown","calculate the normalised propagation delay a and the efficiency of CSMA/CD","choose a protocol from the values of load, a and frame size"])}
${SEC("10.1","The metrics")}
<table class="dt gt cmpt"><thead><tr><th>Metric</th><th>Definition</th><th>Unit</th></tr></thead><tbody>
<tr><td><b>Offered load G</b></td><td>The average number of frame transmissions that all stations attempt in one frame time (new frames and repeated frames).</td><td>frames per frame time</td></tr>
<tr><td><b>Throughput S</b></td><td>The average number of frames delivered successfully in one frame time. S &le; 1.</td><td>frames per frame time (or bits/s)</td></tr>
<tr><td><b>Channel utilisation (efficiency)</b></td><td>The fraction of the channel time that carries useful data. For a normalised throughput this is S itself.</td><td>percent</td></tr>
<tr><td><b>Capacity (maximum throughput)</b></td><td>The largest S that the protocol can reach for any G.</td><td>percent</td></tr>
<tr><td><b>Delay</b></td><td>The time from the arrival of a frame at the station to the end of its successful transmission (the waiting time to get the channel plus the transmission time).</td><td>seconds</td></tr>
<tr><td><b>Fairness</b></td><td>Whether every station gets the same share of the channel (for example, no station waits for ever).</td><td>qualitative</td></tr>
<tr><td><b>Stability</b></td><td>Whether the throughput stays near its best value when the load rises. In an unstable protocol (ALOHA) a high load drives throughput towards zero.</td><td>qualitative</td></tr>
<tr><td><b>Normalised propagation delay a</b></td><td>a = T<sub>p</sub> / T<sub>t</sub>, the propagation time divided by the transmission time of a frame. Small a (short cable, long frame) is good for CSMA.</td><td>no unit</td></tr>
<tr><td><b>Bandwidth</b></td><td>The maximum capacity of the channel: the most data that it can carry in one second. It is the theoretical limit. Throughput is what is really achieved.</td><td>bits/s</td></tr>
<tr><td><b>Packet loss</b></td><td>The percentage of the packets that are sent but never received, because of collisions, congestion, interference or errors. Lost packets must be sent again, which adds delay and lowers throughput.</td><td>percent</td></tr>
<tr><td><b>Jitter</b></td><td>The variation of the delay of successive packets. Packets that arrive at uneven intervals spoil voice and video.</td><td>seconds</td></tr>
<tr><td><b>Reliability</b></td><td>The ability of the network to deliver data complete, correct and consistently, with few retransmissions.</td><td>qualitative</td></tr>
<tr><td><b>Overhead</b></td><td>Channel time used for control instead of data (reservation slots, jam, contention slots).</td><td>percent</td></tr></tbody></table>
<p>The frame time is T<sub>t</sub> = frame length / bit rate. T<sub>p</sub> = distance / signal speed. The bit rate times the delay, a &times; (frame length), is the number of bits on the cable at one time.</p>
${SEC("10.2","Delay, throughput and jitter in numbers")}
<h3 class="h4">The four parts of delay</h3>
<table class="dt gt cmpt"><thead><tr><th>Part</th><th>Meaning</th><th>Depends on</th></tr></thead><tbody>
<tr><td><b>Transmission delay</b></td><td>Time to put all bits of the frame on the medium</td><td>Frame length and bit rate</td></tr>
<tr><td><b>Propagation delay</b></td><td>Time for the signal to travel from the sender to the receiver</td><td>Distance and signal speed</td></tr>
<tr><td><b>Queuing delay</b></td><td>Time that a frame waits in a queue before it is sent</td><td>Congestion</td></tr>
<tr><td><b>Processing delay</b></td><td>Time that a device needs to read the header and decide</td><td>The device</td></tr></tbody></table>
<div class="callout i"><b>Total delay = transmission + propagation + queuing + processing</b></div>
<div class="vis"><div class="row"><span>Frame <input type="number" id="dl_f" value="12000" min="64" style="width:90px" aria-label="Frame bits"> bits</span><span>Rate <input type="number" id="dl_r" value="100" min="1" style="width:70px" aria-label="Rate"> Mbps</span><span>Distance <input type="number" id="dl_d" value="2000" min="0" style="width:80px" aria-label="Distance"> m</span><span>Speed <select id="dl_s" aria-label="Signal speed"><option value="2e8">2 &times; 10<sup>8</sup> m/s</option><option value="3e8">3 &times; 10<sup>8</sup> m/s</option></select></span><span>Queuing <input type="number" id="dl_q" value="50" min="0" style="width:70px" aria-label="Queuing"> &micro;s</span><span>Processing <input type="number" id="dl_p" value="10" min="0" style="width:70px" aria-label="Processing"> &micro;s</span></div><div id="dl_o"></div></div>
${DOIT(["Keep the defaults. The transmission delay is 120 &micro;s and the propagation delay is 10 &micro;s. The total is 190 &micro;s.","Increase the bandwidth to 1000 Mbps. The transmission delay falls to 12 &micro;s, but the propagation delay stays at 10 &micro;s. A higher bandwidth does not reduce the propagation delay.","Raise the queuing delay to 5000 &micro;s. The delay is large although the bandwidth is high. Delay and bandwidth are different metrics."])}
<h3 class="h4">Throughput and bandwidth</h3>
<p>Throughput is the rate of useful data that is really delivered. It is lower than the bandwidth because of collisions, retransmissions, headers and acknowledgements.</p>
<div class="vis"><div class="row"><span>Bandwidth <input type="number" id="th_b" value="100" min="1" style="width:80px" aria-label="Bandwidth"> Mbps</span><span>Frames lost or collided <input type="range" id="th_l" min="0" max="90" value="30" aria-label="Loss"> <b id="th_lv">30</b>%</span><span>Header and control share <input type="range" id="th_h" min="0" max="50" value="10" aria-label="Overhead"> <b id="th_hv">10</b>%</span></div><div id="th_o"></div></div>
<h3 class="h4">Jitter</h3>
<p>Enter the delays of successive packets, in milliseconds, separated by commas. The jitter is measured here as the mean of the differences between successive delays.</p>
<div class="vis"><div class="row"><label>Delays (ms) <input id="jt_i" value="20, 22, 19, 40, 21, 20" size="34" aria-label="Delays" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></label></div><div id="jt_o"></div></div>
<h3 class="h4">Relations between the metrics</h3>
<ul><li>A high delay lowers the throughput, because the sender waits longer for acknowledgements.</li>
<li>A high packet loss lowers the efficiency, because the lost frames are sent again.</li>
<li>A high utilisation can raise the delay, because the queues grow.</li>
<li>A high bandwidth does not mean a high throughput. The throughput depends on the efficiency of the protocol.</li></ul>
<h3 class="h4">Protocols compared by the metrics</h3>
<table class="dt gt cmpt"><thead><tr><th>Protocol</th><th>Throughput</th><th>Delay</th><th>Efficiency</th><th>Collisions</th></tr></thead><tbody>
<tr><td>Pure ALOHA</td><td>Low</td><td>High</td><td>Low</td><td>High</td></tr>
<tr><td>Slotted ALOHA</td><td>Medium</td><td>Medium</td><td>Medium</td><td>Moderate</td></tr>
<tr><td>CSMA</td><td>High</td><td>Medium</td><td>High</td><td>Low</td></tr>
<tr><td>CSMA/CD</td><td>Higher</td><td>Low</td><td>High</td><td>Very low</td></tr>
<tr><td>CSMA/CA</td><td>Medium</td><td>Higher</td><td>Medium</td><td>Very low</td></tr>
<tr><td>Collision-free</td><td>Very high</td><td>Predictable</td><td>Very high</td><td>None</td></tr></tbody></table>
<p class="small muted">The table is a general ranking from the course notes. The numbers in the next sections give the exact values for given conditions.</p>
${SEC("10.3","Formulas of the protocols")}
<table class="dt gt cmpt"><thead><tr><th>Protocol</th><th>Throughput or efficiency</th><th>Maximum</th><th>Remarks</th></tr></thead><tbody>
<tr><td>Pure ALOHA</td><td>S = G e<sup>-2G</sup></td><td>0.184 at G = 0.5</td><td>Vulnerable time 2T</td></tr>
<tr><td>Slotted ALOHA</td><td>S = G e<sup>-G</sup></td><td>0.368 at G = 1</td><td>Vulnerable time T</td></tr>
<tr><td>Non-persistent CSMA</td><td>S = G e<sup>-aG</sup> / ( G (1 + 2a) + e<sup>-aG</sup> )</td><td>close to 1 for small a</td><td>Depends on a</td></tr>
<tr><td>1-persistent CSMA</td><td>Depends on G and a. For a small a the maximum is about 0.5 and it falls as G rises.</td><td>about 0.5 for a = 0.01</td><td>Waiting stations always collide</td></tr>
<tr><td>CSMA/CD</td><td>Efficiency = 1 / (1 + 2 e a) = 1 / (1 + 5.44 a). The course notes use 1 / (1 + 5a).</td><td>approaches 1 as a approaches 0</td><td>Contention slots of 2T<sub>p</sub>, on average e of them for each frame</td></tr>
<tr><td>Bit map</td><td>d / (N + d) at low load; d / (d + 1) at high load</td><td>d / (d + 1)</td><td>d = frame time in bit times</td></tr>
<tr><td>Binary countdown</td><td>d / (d + log<sub>2</sub> N)</td><td>100% if the address is part of the frame</td><td>Unfair to low addresses</td></tr></tbody></table>
${NOTE("The constant in the CSMA/CD formula depends on how the book derives it. Tanenbaum gets 1 / (1 + 2e a) = 1 / (1 + 5.44 a). Some books use 6.44 or 5 as the constant. Use the formula of your textbook in the examination, and state the formula before you use it.")}
${SEC("10.4","Throughput against load")}
<p>The chart shows S against G for pure ALOHA, Slotted ALOHA and non-persistent CSMA. Select the value of a (T<sub>p</sub> / T<sub>t</sub>) for CSMA.</p>
<div class="vis"><div class="row"><span>a = <select id="sa" aria-label="a"><option>0.001</option><option selected>0.01</option><option>0.05</option><option>0.1</option><option>0.5</option><option>1</option></select></span></div><div id="sch"></div><div id="smx"></div></div>
${DOIT(["Select a = 0.001. The CSMA curve rises above 0.9 (its maximum is 0.94). The cable is very short compared with a frame, so almost no collisions happen.","Select a = 1. A frame lasts only as long as the signal needs to cross the cable, so carrier sense is of no use. The maximum falls to 0.14, which is lower than pure ALOHA.","Note that pure ALOHA and Slotted ALOHA fall to zero at a high load. A protocol that does this is <b>unstable</b>."])}
${SEC("10.5","Efficiency of CSMA/CD")}
<p>Efficiency = 1 / (1 + 5.44 a), where a = T<sub>p</sub> / T<sub>t</sub>. A short frame or a long cable makes a large and the efficiency low. The calculator uses the Ethernet minimum and maximum frame sizes.</p>
<div class="vis"><div class="row"><span>Bit rate <select id="eb" aria-label="Bit rate"><option value="10">10 Mbps</option><option value="100">100 Mbps</option><option value="1000">1 Gbps</option></select></span><span>Frame <input type="range" id="ef" min="64" max="1518" step="2" value="1000" aria-label="Frame size"> <b id="efv">1000</b> bytes</span><span>Cable <input type="range" id="ed" min="100" max="2500" step="100" value="2500" aria-label="Cable length"> <b id="edv">2500</b> m</span></div><div id="eres"></div><div id="ech"></div></div>
${SEC("10.6","Compare the protocols for one network")}
<p>Enter a network. The calculator uses the formulas of 7.2 for the maximum efficiency of each protocol. For the bit map and binary countdown, d is the frame length in bit times.</p>
<div class="vis"><div class="row"><span>Frame <input type="range" id="pf" min="64" max="12000" step="64" value="1000" aria-label="Frame bits"> <b id="pfv">1000</b> bits</span><span>a <select id="pa" aria-label="a"><option>0.01</option><option selected>0.1</option><option>0.5</option></select></span><span>Stations N <select id="pn" aria-label="N"><option>8</option><option selected>32</option><option>128</option></select></span></div><div id="pres"></div></div>
${SEC("10.7","Examination examples")}
<table class="dt gt cmpt"><thead><tr><th>Question</th><th>Working</th><th>Answer</th></tr></thead><tbody>
<tr><td>CSMA/CD on 10 Mbps. Frame 1000 bits. Cable 2000 m. Speed 2 &times; 10<sup>8</sup> m/s. Find the efficiency with 1 / (1 + 5.44a).</td><td>T<sub>t</sub> = 1000 / 10<sup>7</sup> = 100 &micro;s. T<sub>p</sub> = 2000 / (2 &times; 10<sup>8</sup>) = 10 &micro;s. a = 0.1. Efficiency = 1 / (1 + 0.544)</td><td><b>64.8%</b></td></tr>
<tr><td>Bit map, N = 16, d = 64 bit times. Efficiency at low load and at high load.</td><td>64 / (16 + 64) and 64 / (64 + 1)</td><td><b>80% and 98.5%</b></td></tr>
<tr><td>Binary countdown, N = 256 stations, frame 1000 bits (address not part of the frame).</td><td>d / (d + log<sub>2</sub> N) = 1000 / (1000 + 8)</td><td><b>99.2%</b></td></tr>
<tr><td>Slotted ALOHA, 1 Mbps channel, 1000-bit frames. Maximum good frames per second.</td><td>T = 1 ms. S = 0.368 at G = 1. Frames per second = 0.368 / 0.001</td><td><b>368 frames/s</b></td></tr></tbody></table>
${quiz("m7q1","Which statement about a = Tp / Tt is correct?",["A small a is good for CSMA","A large a is good for CSMA","a has no effect on CSMA","a is the offered load"],0,"A small a means that the signal crosses the cable much faster than a frame is sent, so carrier sense is accurate.")}
${quiz("m7q2","What is the difference between offered load G and throughput S?",["They are always equal","G includes the frames that collide and are sent again, S counts only the delivered frames","S is larger than G","G is measured in bits"],1,"G counts all transmission attempts. S counts the successful ones. S is at most G.")}
${quiz("m7q3","Which protocol has an efficiency of d / (d + log2 N)?",["Bit map","Binary countdown","Pure ALOHA","CSMA/CD"],1,"The contest of binary countdown costs log2 N bit times for each frame.")}
${EXAM(["Define offered load, throughput, delay and fairness.","State the throughput formulas of pure ALOHA and Slotted ALOHA. Find the maximum value of each.","A CSMA/CD LAN has a = 0.2. Find the efficiency. (Answer: 1 / (1 + 5.44 &times; 0.2) = 0.479.)","Compare a bit-map protocol and CSMA/CD at low load and at high load.","Why is CSMA more efficient than ALOHA when a is small and not when a is large?"])}
${SUM(["G is the offered load. S is the throughput. a = Tp / Tt.","Pure ALOHA 18.4% at G = 0.5. Slotted ALOHA 36.8% at G = 1. CSMA depends on a, and is close to 100% for small a.","CSMA/CD efficiency is 1 / (1 + 5.44 a) in the derivation used here.","Bit map d / (d + 1) at high load. Binary countdown d / (d + log2 N)."])}
`,
mount(r){
  const sc=()=>{const a=+$("#sa",r).value;
    $("#sch",r).innerHTML=lineChart({W:660,H:320,legR:320,xmax:12,ymax:1,xt:6,xl:'Offered load G',yl:'Throughput S',label:'Throughput against load',series:[{f:SPURE,name:'Pure ALOHA',c:'var(--c1)'},{f:SSLOT,name:'Slotted ALOHA',c:'var(--c2)'},{f:G=>SNP(G,a),name:'Non-persistent CSMA, a = '+a,c:'var(--c3)'}]});

    $("#dl_o",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>Transmission = frame / rate</td><td>${F} / ${R/1e6} Mbps = <b>${tt.toFixed(2)} &micro;s</b></td></tr><tr><td>Propagation = distance / speed</td><td>${D} / ${V.toExponential(0).replace('e+','e')} = <b>${tp.toFixed(2)} &micro;s</b></td></tr><tr><td>Queuing + processing</td><td><b>${Q} + ${P} &micro;s</b></td></tr><tr><td>Total delay</td><td><b>${tot.toFixed(2)} &micro;s</b></td></tr></tbody></table>`};

    $("#th_o",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>Bandwidth</td><td><b>${B} Mbps</b></td></tr><tr><td>After losses: ${B} &times; (1 - ${l/100})</td><td>${(B*(1-l/100)).toFixed(1)} Mbps</td></tr><tr><td>After headers and control: &times; (1 - ${h/100})</td><td>Throughput = <b>${t.toFixed(1)} Mbps</b> (${(100*t/B).toFixed(1)}% of the bandwidth)</td></tr></tbody></table><div class="meter" style="margin:8px 0"><i style="width:${100*t/Math.max(B,1)}%"></i></div>`};
  ["th_b","th_l","th_h"].forEach(k=>$("#"+k,r).oninput=th);th();
  const jt=()=>{const d=$("#jt_i",r).value.split(/[ ,;]+/).map(Number).filter(x=>isFinite(x)&&x>=0&&x!==null);const o=$("#jt_o",r);

    const diffs=d.slice(1).map((x,i)=>Math.abs(x-d[i])),mean=d.reduce((a,b)=>a+b,0)/d.length,j=diffs.reduce((a,b)=>a+b,0)/diffs.length;

    $("#ech",r).innerHTML=lineChart({W:640,H:260,legR:230,xmax:1,ymax:1,xt:5,xl:'a = Tp / Tt',yl:'Efficiency',label:'CSMA/CD efficiency against a',series:[{f:x=>1/(1+5.44*x),name:'1 / (1 + 5.44a)',c:'var(--c1)'}],pts:[{x:Math.min(a,1),y:ef,txt:'this network',c:'var(--bad)'}]})};
  ["eb","ef","ed"].forEach(k=>$("#"+k,r).oninput=ec);$("#eb",r).onchange=ec;ec();
  const pc=()=>{const F=+$("#pf",r).value,a=+$("#pa",r).value,N=+$("#pn",r).value;$("#pfv",r).textContent=F;
    const rows=[['Pure ALOHA',0.184,'at G = 0.5'],['Slotted ALOHA',0.368,'at G = 1'],['Non-persistent CSMA',maxOf(G=>SNP(G,a)).S,'a = '+a],['CSMA/CD',1/(1+5.44*a),'1 / (1 + 5.44a)'],['Bit map (high load)',F/(F+1),'d / (d + 1)'],['Bit map (low load)',F/(N+F),'d / (N + d)'],['Binary countdown',F/(F+Math.log2(N)),'d / (d + log2 N)']];
    $("#pres",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Protocol</th><th>Maximum efficiency</th><th>Formula</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x[0]}</td><td><b>${(x[1]*100).toFixed(1)}%</b></td><td>${x[2]}</td><td style="width:35%"><div class="meter"><i style="width:${x[1]*100}%"></i></div></td></tr>`).join('')}</tbody></table><div class="small muted">Efficiency is only one metric. Collision-free protocols have a higher delay at low load, and ALOHA and 1-persistent CSMA lose throughput at a high load.</div>`};

lesson({nav:"11. IEEE 802 standards and variants",title:"IEEE 802 series of standards and their variants",syl:"IEEE Standards 802 series & their variant",
html:()=>`
${GUIDE({"syl":"IEEE Standards 802 series & their variant","why":"The MAC protocols of this unit are not only theory. They are used in the IEEE 802 standards: Ethernet uses CSMA/CD, Wi-Fi uses CSMA/CA, and the older token networks use controlled access. This lesson lists the standards, their frames and their variants, and links each one to the protocol that it uses.","map":[["11.1","The IEEE 802 project","What are the 802 standards?","Read the table of standards."],["11.2","The 802 layering","How do LLC, MAC and the physical layer add their parts to a frame?","Step through the encapsulation."],["11.3","Ethernet (802.3)","What does an Ethernet frame contain and which variants exist?","Click each field, build a frame with its CRC, see how bits become voltage (Manchester encoding) and read the table of variants."],["11.4","Wi-Fi (802.11)","How does a wireless LAN differ and what are its variants?","Step through BSS, ESS and ad hoc, click the frame fields and fill the four addresses."],["11.5","Other standards","What do 802.1, 802.15 and 802.16 cover?","Read the list."],["11.6","MAC protocol of each standard","Which protocol of this unit does each standard use?","Read the map."]],"osi":"Layers 1 and 2. The IEEE 802 standards define the physical layer and the data link layer (LLC and MAC).","pre":"Lessons 1 to 10.","time":"about 2 hours","next":"Unit IV, the network layer."})}
${LEARN(["list the main IEEE 802 standards and say what each one covers","encode bits with Manchester and Differential Manchester encoding and decode a waveform","describe the Ethernet frame fields and the minimum and maximum frame size","name the Ethernet and Wi-Fi variants and their main values","state the MAC protocol that each standard uses"])}
${SEC("11.1","The IEEE 802 project")}
<p><b>IEEE 802</b> is the group of standards for local area networks (LAN) and metropolitan area networks (MAN) made by the IEEE (Institute of Electrical and Electronics Engineers). The standards define the <b>physical layer</b> and the <b>data link layer</b>. The data link layer is divided into the LLC and the MAC sublayers (Lesson 1). Each standard has a number. A letter after the number (for example 802.11b) is a variant or an amendment.</p>
<table class="dt gt cmpt"><thead><tr><th>Standard</th><th>Subject</th><th>Remark</th></tr></thead><tbody>
<tr><td><b>802.1</b></td><td>Overview, architecture, bridging and management. Includes 802.1D (spanning tree), 802.1Q (VLAN) and 802.1X (port-based access control).</td><td>Used with all LAN types</td></tr>
<tr><td><b>802.2</b></td><td>Logical Link Control (LLC)</td><td>The upper sublayer for all LANs</td></tr>
<tr><td><b>802.3</b></td><td>Ethernet, CSMA/CD</td><td>Most common wired LAN</td></tr>
<tr><td><b>802.4</b></td><td>Token bus</td><td>Withdrawn</td></tr>
<tr><td><b>802.5</b></td><td>Token ring</td><td>Replaced by Ethernet; no longer used in new networks</td></tr>
<tr><td><b>802.11</b></td><td>Wireless LAN (Wi-Fi), CSMA/CA</td><td>Most common wireless LAN</td></tr>
<tr><td><b>802.15</b></td><td>Wireless personal area network. 802.15.1 is Bluetooth. 802.15.4 is the low-rate standard that ZigBee uses.</td><td>Short range</td></tr>
<tr><td><b>802.16</b></td><td>Broadband wireless access (WiMAX), a wireless MAN</td><td>Long range</td></tr></tbody></table>
${SEC("11.2","The 802 layering: LLC, MAC and physical layer")}
<p>The network layer hands a packet to the data link layer. The LLC, the MAC and the physical layer each add their own part. Step through the process.</p>
<div class="vis"><div id="sk"></div><div id="sks"></div></div>
${NOTE("In practice most IP traffic on Ethernet uses the <b>Type</b> field of Ethernet II and does not carry an LLC header. The LLC header (IEEE 802.2) is used with the Length field of 802.3 and in Wi-Fi.")}
${SEC("11.3","Ethernet (IEEE 802.3)")}
<p><b>Ethernet</b> is the most widely used wired LAN technology. It was developed by Robert Metcalfe at Xerox PARC in 1973. It has grown from 2.94 Mbps in the first version to 400 Gbps in modern networks. The IEEE standard is 802.3, which defines the frame format, the transmission and the control of access on wired networks.</p>
<p><b>Standard Ethernet</b> runs at 10 Mbps and uses CSMA/CD to share the medium. It first used a bus (one cable for all stations). Modern Ethernet uses a star with a hub or a switch, which is more reliable and easier to manage.</p>
<p>An Ethernet frame has seven fields (the preamble and the SFD are shown separately). Click a field to read its description.</p>
<div class="vis"><div class="efr" id="ef">${EFIELDS.map((f,i)=>`<button type="button" data-f="${i}" aria-pressed="${i===2}" style="flex:${typeof f.b==='number'?Math.max(f.b,5):14} 1 0">${f.n}<br><span class="small">${f.b} B</span></button>`).join('')}</div><div id="efd" class="callout i"></div></div>
<p>The frame without the preamble and the SFD has a size between <b>64 and 1518 bytes</b>: 6 + 6 + 2 + (46 to 1500) + 4. The minimum comes from the collision-detection rule (Lesson 5). Move the slider to change the data size.</p>
<div class="vis"><div class="row"><span>Data from the upper layer <input type="range" id="ep" min="1" max="1500" value="100" aria-label="Data size"> <b id="epv">100</b> bytes</span></div><div id="epr"></div></div>
<h3 class="h4">Build a frame</h3>
<p>Enter the addresses and the data. The tool adds the padding and calculates the FCS (CRC-32), as the network card does. The preamble and the SFD are not shown. The bytes are in hexadecimal.</p>
<div class="vis"><div class="row"><label>Destination <input id="ebd" value="FF:FF:FF:FF:FF:FF" size="18" aria-label="Destination" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></label><label>Source <input id="ebs" value="00:1A:2B:3C:4D:5E" size="18" aria-label="Source" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></label><label>Type <select id="ebt" aria-label="Type"><option value="0800">0x0800 IPv4</option><option value="0806">0x0806 ARP</option><option value="86DD">0x86DD IPv6</option><option value="L">length (IEEE 802.3)</option></select></label></div><div class="row"><label>Data (text) <input id="ebp" value="Hello" size="40" aria-label="Data" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></label></div><div id="ebo"></div></div>
${DOIT(["Keep the defaults. The data has 5 bytes, so 41 bytes of padding are added and the frame has 64 bytes.","Change the destination to 01:00:5E:00:00:FB and read the note on the address type.","Type a long text of more than 46 characters. No padding is added."])}
<h3 class="h4">Signalling on the wire: line encoding</h3>
<p>A computer network sends <b>digital</b> data, but the cable carries a physical signal. Two kinds of signal are used.</p>
<table class="dt gt cmpt"><thead><tr><th>Analog signal</th><th>Digital signal</th></tr></thead><tbody>
<tr><td>Continuous values</td><td>Discrete values (usually 2)</td></tr>
<tr><td>Infinite number of levels</td><td>Finite number of levels</td></tr>
<tr><td>Sensitive to noise, hard to recover</td><td>Resistant to noise, easy to recover</td></tr>
<tr><td>Examples: human voice, temperature, FM radio</td><td>Examples: Ethernet, Wi-Fi, USB, computer memory</td></tr></tbody></table>
<div class="vis"><svg id="ad" viewBox="0 0 760 150" role="img" aria-label="An analog and a digital waveform"></svg></div>
<p>The bits 10110010 are not sent as the characters 1 and 0. The network card converts the bits to changes of voltage. This conversion is called <b>line encoding</b>. The order is: digital data, line encoding, electrical signal, transmission medium. The wire carries digital information in an analog physical form, a voltage waveform.</p>
<p>A simple rule such as "1 = high voltage, 0 = low voltage" has a fault: a long run of equal bits gives a signal with no change, and the receiver cannot tell where one bit ends and the next begins. The receiver needs a clock. <b>Manchester encoding</b> puts the clock into the data signal by making a transition in the middle of every bit.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>Manchester</th><th>Differential Manchester</th></tr></thead><tbody>
<tr><td>Transition in the middle of every bit</td><td>Always</td><td>Always</td></tr>
<tr><td>Bit 1</td><td>Low to high in the middle</td><td>No transition at the start of the bit</td></tr>
<tr><td>Bit 0</td><td>High to low in the middle</td><td>A transition at the start of the bit</td></tr>
<tr><td>Decode by</td><td>The direction of the middle transition</td><td>Whether there is a transition at the start of the bit</td></tr>
<tr><td>Depends on the voltage level</td><td>Yes</td><td>No (only on transitions)</td></tr>
<tr><td>Clock synchronisation</td><td>Yes</td><td>Yes</td></tr></tbody></table>
${NOTE("Books differ on which direction means 1 in Manchester encoding. The course notes use low to high for 1 and high to low for 0. Some books use the opposite rule. Use the rule of your course in the examination and state it.")}
<p>Manchester encoding uses two signal levels for each bit, so the signal changes up to twice as often as the bit rate. A 10 Mbps Ethernet link therefore needs a signal rate of 20 million changes per second. Enter bits and select the encoding. The dashed lines mark the bit boundaries, and the arrows give the middle transition.</p>
<div class="vis"><div class="row"><label>Bits <input id="lcb" value="10110010" size="20" aria-label="Bits" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></label>${seg("lcs",[["p","Plain voltage"],["m","Manchester"],["d","Differential Manchester"]])}</div><svg id="lcw" role="img" aria-label="Line encoded waveform"></svg><div id="lco" class="small"></div></div>
${DOIT(["Select plain voltage and enter 00000000. The line stays flat, so there is nothing to synchronise on.","Select Manchester with the same bits. There is a transition in every bit.","Enter 10110 and select Differential Manchester. Bits 0 have a transition at the start. Bits 1 do not.","Decode test: press the button, read the waveform, enter the bits and check."])}
<div class="vis"><div class="row"><button class="btn pri" type="button" id="lct">New decode test</button><span id="lcq"></span></div><svg id="lcx" role="img" aria-label="Waveform to decode"></svg><div class="row"><label>Your bits <input id="lca" size="10" aria-label="Your answer" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></label><button class="btn" type="button" id="lcc">Check</button><span id="lcr"></span></div></div>
${quiz("r11q1","In Manchester encoding (course notes), which transition in the middle of the bit means 1?",["High to low","Low to high","No transition","Transition at the start"],1,"The notes use low to high for 1 and high to low for 0. 1 climbs, 0 falls.")}
${quiz("r11q2","In Differential Manchester, a bit 0 is shown by:",["No transition at the start of the bit","A transition at the start of the bit","A low level","A high level"],1,"0 has a transition at the start and 1 has none. There is always a transition in the middle.")}
${quiz("r11q3","Why is plain 1 = high, 0 = low voltage a poor line code?",["It uses too much power","A long run of equal bits has no changes, so the receiver loses the clock","It cannot carry 0","It needs two wires"],1,"Without transitions the receiver cannot find the bit boundaries.")}
<h3 class="h4">Ethernet variants</h3>
<table class="dt gt cmpt"><thead><tr><th>Name</th><th>Year</th><th>Speed</th><th>Medium</th><th>Largest segment</th><th>Topology</th></tr></thead><tbody>
<tr><td>10BASE5 (thick Ethernet)</td><td>1980</td><td>10 Mbps</td><td>Thick coaxial cable</td><td>500 m</td><td>Bus</td></tr>
<tr><td>10BASE2 (thin Ethernet)</td><td>1985</td><td>10 Mbps</td><td>Thin coaxial cable</td><td>185 m</td><td>Bus</td></tr>
<tr><td>10BASE-T</td><td>1990</td><td>10 Mbps</td><td>Twisted pair (UTP)</td><td>100 m</td><td>Star (hub)</td></tr>
<tr><td>100BASE-TX (Fast Ethernet)</td><td>1995</td><td>100 Mbps</td><td>UTP Category 5</td><td>100 m</td><td>Star (hub or switch)</td></tr>
<tr><td>1000BASE-T (Gigabit Ethernet)</td><td>1999</td><td>1 Gbps</td><td>UTP Category 5e or 6</td><td>100 m</td><td>Star (switch)</td></tr>
<tr><td>10GBASE-T</td><td>2006</td><td>10 Gbps</td><td>UTP Category 6a</td><td>100 m</td><td>Star (switch), full duplex</td></tr></tbody></table>
<p><b>Fast Ethernet</b> raised the speed to 100 Mbps and kept the frame format, so it works with the older types. It introduced <b>auto-negotiation</b>: two devices choose the best speed that both support. <b>Gigabit Ethernet</b> (1 Gbps) mainly uses full-duplex links, which remove collisions, so CSMA/CD is not needed. <b>10 Gigabit Ethernet</b> (10 Gbps) is used in data centres and backbone networks.</p>
<p>The name shows the speed (10, 100, 1000), the signalling (BASE means baseband) and the medium (5 and 2 are the segment lengths in hundreds of metres, T is twisted pair, X is a coding method). Early Ethernet shared one cable and used CSMA/CD. Modern Ethernet connects each station to a <b>switch</b> by its own link. The link is full duplex, so there is no collision and CSMA/CD is not used, but the frame format is the same.</p>
${SEC("11.4","Wireless LAN (IEEE 802.11, Wi-Fi)")}
<p>IEEE 802.11 is the standard for wireless LANs, known as <b>Wi-Fi</b>. Devices communicate by radio waves and not by cables. The name Wi-Fi is managed by the Wi-Fi Alliance.</p>
<h3 class="h4">Architecture</h3>
<ul><li><b>Infrastructure mode</b> (the usual mode): the stations communicate through an <b>access point (AP)</b>. One AP and the stations that are connected to it form a <b>Basic Service Set (BSS)</b>. Several BSSs connected through a distribution system (usually Ethernet) form an <b>Extended Service Set (ESS)</b>. A station moves from one AP to another in an ESS (roaming). The <b>SSID</b> is the name of the network.</li>
<li><b>Ad hoc mode</b>: the stations communicate directly, without an access point. They form an <b>Independent Basic Service Set (IBSS)</b>.</li></ul>
<div class="vis"><svg id="wf" role="img" aria-label="BSS, ESS and IBSS"></svg><div id="wfs"></div></div>
<p><b>MAC.</b> 802.11 has the <b>DCF</b> (Distributed Coordination Function), which is CSMA/CA with an ACK for each frame and optional RTS/CTS (Lesson 6). It also has an optional <b>PCF</b> (Point Coordination Function), in which the AP polls the stations in turn (a collision-free method).</p>
<h3 class="h4">Evolution</h3>
<table class="dt gt cmpt"><thead><tr><th>Variant</th><th>Name</th><th>Year</th><th>Band</th><th>Highest rate (theoretical)</th><th>Remark</th></tr></thead><tbody>
<tr><td>802.11b</td><td>Wi-Fi 1</td><td>1999</td><td>2.4 GHz</td><td>11 Mbps</td><td>First popular Wi-Fi</td></tr>
<tr><td>802.11a</td><td>Wi-Fi 2</td><td>1999</td><td>5 GHz</td><td>54 Mbps</td><td>OFDM</td></tr>
<tr><td>802.11g</td><td>Wi-Fi 3</td><td>2003</td><td>2.4 GHz</td><td>54 Mbps</td><td>Works with 802.11b</td></tr>
<tr><td>802.11n</td><td>Wi-Fi 4</td><td>2009</td><td>2.4 and 5 GHz</td><td>600 Mbps</td><td>MIMO (several antennas)</td></tr>
<tr><td>802.11ac</td><td>Wi-Fi 5</td><td>2013</td><td>5 GHz</td><td>about 6.9 Gbps</td><td>Wider channels, more streams</td></tr>
<tr><td>802.11ax</td><td>Wi-Fi 6</td><td>2019</td><td>2.4 and 5 GHz (6 GHz in Wi-Fi 6E)</td><td>about 9.6 Gbps</td><td>OFDMA, better use in crowded places</td></tr></tbody></table>
<table class="dt gt cmpt"><thead><tr><th></th><th>2.4 GHz</th><th>5 GHz</th></tr></thead><tbody>
<tr><td>Range</td><td>Longer; passes walls better</td><td>Shorter</td></tr><tr><td>Speed</td><td>Lower</td><td>Higher</td></tr><tr><td>Interference</td><td>More (many devices use this band)</td><td>Less</td></tr></tbody></table>
<h3 class="h4">The 802.11 frame</h3>
<p>An 802.11 data frame has: Frame Control (2 bytes), Duration/ID (2), Address 1 (6), Address 2 (6), Address 3 (6), Sequence Control (2), Address 4 (6, only between access points), Frame body (0 to 2312) and FCS (4). Click a field.</p>
<div class="vis"><div id="wfg"></div><div id="wfn" class="callout i small"></div></div>
<p>Up to four addresses are needed because a frame can pass through an access point. The meaning of the addresses depends on two bits of the Frame Control field: <b>To DS</b> (the frame goes to the distribution system) and <b>From DS</b>. Select a case. The stations are S1 (source), S2 (destination) and the access point AP.</p>
<div class="vis"><div class="row">${seg("wa",[["0","Station to station in an ad hoc network"],["1","AP to station (From DS)"],["2","Station to AP (To DS)"],["3","AP to AP (both)"]])}</div><div id="wao"></div></div>
${SEC("11.5","Other standards")}
<ul><li><b>802.1Q (VLAN).</b> A 4-byte tag is added to the Ethernet frame to show the virtual LAN of the frame.</li>
<li><b>802.1D (spanning tree).</b> Switches use it to remove loops from a bridged LAN.</li>
<li><b>802.15.1 (Bluetooth).</b> A <b>piconet</b> has one master and up to seven active slaves. The master controls access by time slots, so no collision happens.</li>
<li><b>802.15.4.</b> Low data rate (250 kbps) and low power, for sensors. ZigBee is built on it.</li>
<li><b>802.16 (WiMAX).</b> Wireless access over several kilometres. The base station controls the channel (collision-free scheduling).</li>
<li><b>802.5 (token ring) and 802.4 (token bus).</b> A small frame called the <b>token</b> goes around the stations. Only the station that holds the token may send. This is controlled access with no collisions. These networks are no longer used in new installations.</li></ul>
${SEC("11.6","The MAC protocol of each standard")}
<table class="dt gt cmpt"><thead><tr><th>Standard</th><th>MAC protocol</th><th>Class</th><th>Lesson</th></tr></thead><tbody>
<tr><td>802.3 shared Ethernet</td><td>1-persistent CSMA/CD with BEB</td><td>Random access</td><td>2, 5</td></tr>
<tr><td>802.3 switched, full duplex</td><td>No contention (a link for each station)</td><td>None needed</td><td>1</td></tr>
<tr><td>802.11 (DCF)</td><td>CSMA/CA, optional RTS/CTS</td><td>Random access</td><td>6</td></tr>
<tr><td>802.11 (PCF)</td><td>Polling by the AP</td><td>Controlled access</td><td>8</td></tr>
<tr><td>802.4, 802.5</td><td>Token passing</td><td>Collision-free</td><td>8</td></tr>
<tr><td>802.15.1 Bluetooth</td><td>Master polls the slaves in time slots</td><td>Collision-free</td><td>8</td></tr>
<tr><td>Satellite and radio data links, RFID readers</td><td>ALOHA and Slotted ALOHA, or a variant</td><td>Random access</td><td>3</td></tr></tbody></table>
${quiz("m8q1","Which standard defines Ethernet?",["IEEE 802.2","IEEE 802.3","IEEE 802.5","IEEE 802.11"],1,"802.3 is Ethernet (CSMA/CD). 802.11 is Wi-Fi.")}
${quiz("m8q2","What is the minimum size of an Ethernet frame (destination address to FCS)?",["46 bytes","64 bytes","512 bytes","1518 bytes"],1,"The data field has at least 46 bytes, so the frame has at least 14 + 46 + 4 = 64 bytes.")}
${quiz("m8q3","Which MAC protocol does the basic Wi-Fi mode (DCF) use?",["CSMA/CD","Token passing","CSMA/CA","Slotted ALOHA"],2,"A wireless station cannot detect a collision while it sends, so 802.11 uses collision avoidance.")}
${EXAM(["List the IEEE 802 standards 802.1, 802.2, 802.3, 802.11, 802.15 and 802.16 with one line on each.","Draw the Ethernet frame and give the size of each field. Why is the minimum data size 46 bytes?","A station sends 20 bytes of data on Ethernet. How many bytes of padding are added? What is the frame size? (Answer: 26 bytes of padding and a 64-byte frame.)","Compare 802.11b, 802.11g and 802.11n by band and highest rate.","State the MAC protocol used by 802.3, 802.11 and 802.15.1, and say whether it is contention or collision-free."])}
${SUM(["IEEE 802 standards define the physical layer and the LLC and MAC sublayers.","802.3 is Ethernet (CSMA/CD with BEB; switched full-duplex Ethernet has no collisions). Its frame is 64 to 1518 bytes.","802.11 is Wi-Fi. Its MAC is CSMA/CA (DCF) with an ACK, and RTS/CTS can be used. Variants differ in band and rate.","802.15.1 (Bluetooth), 802.5 (token ring) and 802.16 use controlled, collision-free access."])}
`,

  const STP=[

      E('line',{x1:222,y1:150,x2:538,y2:150,stroke:'var(--fg)','stroke-width':4},wsv);stnW(380,150,'Switch','ok');E('text',{x:380,y:122,'text-anchor':'middle',class:'tk'},wsv).textContent='distribution system';E('text',{x:380,y:290,'text-anchor':'middle',class:'sl'},wsv).textContent='Two BSSs joined by a distribution system form an ESS. A station can roam from AP 1 to AP 2.'}

  const wfx=story(r,"#wfs",{draw:wpic});wfx.set([{cap:'<b>Infrastructure mode, one BSS.</b> The stations in the radio range of one access point form a Basic Service Set. All frames go through the AP, which is connected to the router and the Internet.'},{cap:'<b>Extended Service Set.</b> Several BSSs are joined by a distribution system (usually Ethernet). A station keeps its connection when it moves from one AP to the next. This is roaming.'},{cap:'<b>Ad hoc mode.</b> The stations communicate directly and form an Independent Basic Service Set (IBSS).'}]);

  const WA=[["0","0","destination (S2)","source (S1)","BSSID","not used"],["0","1","destination (S2)","BSSID (the AP)","source (S1)","not used"],["1","0","BSSID (the AP)","source (S1)","destination (S2)","not used"],["1","1","receiving AP","transmitting AP","destination (S2)","source (S1)"]];
  bindSeg(r,"wa",v=>{const a=WA[+v];$("#wao",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>To DS / From DS</td><td><b>${a[0]} / ${a[1]}</b></td></tr><tr><td>Address 1 (receiver)</td><td>${a[2]}</td></tr><tr><td>Address 2 (transmitter)</td><td>${a[3]}</td></tr><tr><td>Address 3</td><td>${a[4]}</td></tr><tr><td>Address 4</td><td>${a[5]}</td></tr></tbody></table>`});
  $("#wao",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>To DS / From DS</td><td><b>0 / 0</b></td></tr><tr><td>Address 1 (receiver)</td><td>destination (S2)</td></tr><tr><td>Address 2 (transmitter)</td><td>source (S1)</td></tr><tr><td>Address 3</td><td>BSSID</td></tr><tr><td>Address 4</td><td>not used</td></tr></tbody></table>`;
  /* line encoding */
  {const ad=$("#ad",r);ad.innerHTML='';
   E('text',{x:190,y:16,'text-anchor':'middle',class:'sl hd'},ad).textContent='Analog: continuous';E('text',{x:570,y:16,'text-anchor':'middle',class:'sl hd'},ad).textContent='Digital: discrete levels';
   let d='';for(let i=0;i<=160;i++){const x=40+i*2.9,y=80-40*Math.sin(i/160*Math.PI*4);d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}
   E('path',{d,fill:'none',stroke:'var(--c1)','stroke-width':3},ad);
   let q='M420 120',lv=[1,1,0,1,0,0,1,0],x=420;lv.forEach((b,i)=>{const y=b?40:120;q+=`L${x} ${y}L${x+40} ${y}`;x+=40});E('path',{d:q,fill:'none',stroke:'var(--c2)','stroke-width':3},ad);
   E('text',{x:40,y:142,class:'tk'},ad).textContent='amplitude against time';E('text',{x:420,y:142,class:'tk'},ad).textContent='levels 0 and 1';}
  const lcEnc=(bits,k)=>{const S=[];let lv=0;bits.forEach(b=>{if(k==='p'){S.push([b,b]);}else if(k==='m'){S.push(b?[0,1]:[1,0])}else{if(b===0)lv=1-lv;S.push([lv,1-lv]);lv=1-lv}});return S};
  const lcDraw=(svg,bits,k,ann)=>{const S=lcEnc(bits,k),n=S.length,W=760,L=30,bw=Math.min(96,(W-2*L)/Math.max(n,1)),Hh=ann?170:130,yH=40,yL=100;svg.innerHTML='';svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);
   bits.forEach((b,i)=>{const x=L+i*bw;E('line',{x1:x,x2:x,y1:26,y2:116,stroke:'var(--line2)','stroke-dasharray':'4 4'},svg);if(ann)E('text',{x:x+bw/2,y:18,'text-anchor':'middle',class:'sl hd'},svg).textContent=b});
   E('line',{x1:L+n*bw,x2:L+n*bw,y1:26,y2:116,stroke:'var(--line2)','stroke-dasharray':'4 4'},svg);
   let d='',prev=null;S.forEach((h,i)=>{const x=L+i*bw,y1=h[0]?yH:yL,y2=h[1]?yH:yL;d+=(prev===null?`M${x} ${y1}`:`L${x} ${y1}`)+`L${x+bw/2} ${y1}`;if(h[0]!==h[1]||k!=='p')d+=`L${x+bw/2} ${y2}`;d+=`L${x+bw} ${y2}`;prev=y2});
   E('path',{d,fill:'none',stroke:'var(--pri)','stroke-width':3.5},svg);
   if(ann&&k!=='p'){S.forEach((h,i)=>{const x=L+i*bw;const up=h[1]>h[0];E('text',{x:x+bw/2,y:138,'text-anchor':'middle',class:'sl',style:'font-size:12px'},svg).textContent=up?'mid: up':'mid: down';

  let lck='m';

  $("#lct",r).onclick=lcNew;$("#lcc",r).onclick=()=>{const a=$("#lca",r).value.replace(/[^01]/g,'');$("#lcr",r).innerHTML=a===lcAns?' <b>Correct.</b>':` <span class="bad">Not correct.</span> The bits are <b>${lcAns}</b>.`};lcNew();
}});

function renderLive(){$("#livebox").innerHTML=`<p class="small muted" style="margin:0 0 8px">Quick reference, Unit III.</p><h4 style="margin:12px 0 6px">MAC address</h4><div class="code">48 bits: OUI (24) + device (24)\nI/G bit = 1: group address\nU/L bit = 1: local address\nFF:FF:FF:FF:FF:FF = broadcast</div><h4 style="margin:12px 0 6px">BEB</h4><div class="code">after n-th collision:\nK in 0 .. 2^min(n,10) - 1\nwait K x slot (512 bit times\n= 51.2 us at 10 Mbps)\ngive up at 16</div><h4 style="margin:12px 0 6px">ALOHA</h4><div class="code">Pure:    S = G e^(-2G)\n         max 0.184 at G = 0.5\n         vulnerable time 2T\nSlotted: S = G e^(-G)\n         max 0.368 at G = 1\n         vulnerable time T</div><h4 style="margin:12px 0 6px">CSMA family</h4><div class="code">a = Tp / T\nCSMA vulnerable time = Tp\nCSMA/CD: T >= 2 Tp\n  min frame = 2 Tp x rate\n  eff = 1/(1+5a) or 1/(1+5.44a)\nCSMA/CA: DIFS, back-off\n  (pauses when busy),\n  ACK after SIFS, RTS/CTS, NAV</div><h4 style="margin:12px 0 6px">Channelization</h4><div class="code">FDMA: (B - (N-1) guard) / N\nTDMA: frame = N x slot\nCDMA: decode = (S . code) / n</div><h4 style="margin:12px 0 6px">Collision-free</h4><div class="code">Bit map: d/(N+d) low,\n         d/(d+1) high\nBinary countdown: d/(d+log2 N)\nMLMA: G + active groups x M\nTree walk: depth first, left first</div><h4 style="margin:12px 0 6px">Ethernet frame</h4><div class="code">Preamble 7 | SFD 1 | Dest 6 | Src 6\nType/Len 2 | Data 46-1500 | FCS 4\nFrame 64 to 1518 bytes</div>`}

renderLive();go(0);
