lesson({nav:"1. MAC sublayer and MAC addressing",title:"MAC sublayer, channel allocation and MAC addressing",syl:"MAC Sub layer: MAC Addressing",
html:()=>`
${GUIDE({"syl":"MAC Sub layer: MAC Addressing","why":"Many LANs use one shared medium. Only one station can send at a time or the signals are damaged. The MAC sublayer decides which station sends and when. This lesson explains the problem. Lessons 2 to 9 give the solutions. The lesson also explains the MAC address, which identifies a station on the LAN.","map":[["1.1","Point-to-point and broadcast links","Why does a shared medium need extra rules, and what is a collision physically?","Compare the two kinds of link and add two waves with different phase and frequency."],["1.2","LLC and MAC sublayers","How is the data link layer divided?","Place LLC, MAC and the physical layer in the 802 model."],["1.3","The channel allocation problem","Can the channel be divided in advance among N stations?","Calculate the delay of static division (FDM) with a calculator."],["1.4","Classes of MAC protocols","Which families of access methods exist?","Read the map of the unit."],["1.5","MAC address format","What does a 48-bit MAC address contain?","Enter an address and read each field."],["1.6","How a NIC uses the MAC address","How does one frame on a shared cable reach only one station?","Step through unicast, broadcast, multicast and promiscuous mode."]],"osi":"Layer 2, MAC sublayer. The LLC sublayer is above it and the physical layer (layer 1) is below it.","pre":"Unit II, Lesson 1: the frame and the data link layer.","time":"about 1 hour 15 minutes","next":"Lesson 2, the Binary Exponential Back-off algorithm."})}
${LEARN(["explain why a shared channel needs a MAC protocol","describe a collision as the addition of two signals on the medium","state the five assumptions of the dynamic channel allocation problem","calculate the delay of static channel division","split a MAC address into OUI and device part, and find the I/G and U/L bits","explain how a NIC decides to accept or drop a frame"])}
${SEC("1.1","Point-to-point and broadcast links")}
<p>A network link is one of two kinds.</p>
<ul><li>A <b>point-to-point link</b> has one sender at one end and one receiver at the other end. Unit II described the protocols for this kind of link (framing, flow control, error control).</li>
<li>A <b>broadcast link</b> (also called a <b>multi-access link</b> or <b>multiple-access channel</b>) connects many stations to one shared medium. Every station receives every signal.</li></ul>
${DEF("Medium Access Control (MAC)","is the set of rules that decides which station may use a shared channel at a given time.")}
<p>If two stations send at the same time on a shared channel, the signals overlap and the receivers cannot read either frame. This event is called a <b>collision</b>. The MAC rules reduce collisions or avoid them.</p>
${NOTE("A shared medium is used in classic Ethernet (one coaxial cable or a hub), in Wi-Fi (the radio channel) and in satellite and cellular uplinks. A modern switched Ethernet link between a host and a switch is point-to-point and has no collisions.")}
<h3 class="h4">What a collision is, physically</h3>
<p>Bits are digital, but the medium carries a physical signal: a voltage on a cable or an electromagnetic wave in the air. The medium does not know about frames. The signals of all senders simply <b>add</b>:</p>
<div class="callout i"><b>Received signal = signal of A + signal of B + noise</b></div>
<p>A collision happens when two or more stations put energy on the same medium at the same time, within the bandwidth of the receiver. The receiver sees the sum instead of one signal. Example on a cable that expects 0 V or +5 V: if A and B both send +5 V at the same instant, the cable carries about +10 V. This level is not valid in the encoding, so the receiver cannot decode it. Classic Ethernet stations use this: each compares what it sends with what it hears (Lesson 5).</p>
<p>The result depends on frequency, amplitude and phase. Two signals of the <b>same frequency</b> add by their phase: in phase the amplitude doubles (constructive interference), 180 degrees apart they cancel (destructive interference). Signals of <b>different frequencies</b> can be separated by a filter, so they do not collide. This is the idea of FDMA (Lesson 7). The wavelength is &lambda; = c / f, so the same frequency means the same wavelength.</p>
<table class="dt gt cmpt"><thead><tr><th>Frequency f</th><th>Wavelength &lambda; = c / f (c = 3 &times; 10<sup>8</sup> m/s)</th><th>Use</th></tr></thead><tbody>
<tr><td>900 MHz</td><td>33.3 cm</td><td>Example channel 1</td></tr><tr><td>950 MHz</td><td>31.6 cm</td><td>Example channel 2: can be filtered from 900 MHz</td></tr><tr><td>2.4 GHz</td><td>12.5 cm</td><td>Wi-Fi (all devices on the same channel overlap)</td></tr><tr><td>5 GHz</td><td>6 cm</td><td>Wi-Fi</td></tr></tbody></table>
<p>Change the second signal and read the peak of the sum.</p>
<div class="vis"><div class="row">${seg("cps",[["a","Same phase"],["b","Opposite phase"],["c","Different frequency"],["d","Your values"]])}</div><div class="row"><span>Amplitude of B <input type="range" id="cpa" min="0" max="2" step="0.1" value="1" aria-label="Amplitude of B"> <b id="cpav">1</b></span><span>Frequency of B <input type="range" id="cpf" min="1" max="4" step="0.5" value="1" aria-label="Frequency of B"> <b id="cpfv">1</b> &times; f<sub>A</sub></span><span>Phase of B <input type="range" id="cpp" min="0" max="360" step="15" value="0" aria-label="Phase of B"> <b id="cppv">0</b>&deg;</span></div><svg id="cpw" role="img" aria-label="Two signals and their sum"></svg><div id="cpo" class="small"></div></div>
${DOIT(["Select same phase. The sum has twice the amplitude of one signal.","Select opposite phase. The sum is zero: the signals cancel.","Select different frequency. The sum is a different shape, but the two parts have different frequencies, so a filter can separate them. Two signals of the same frequency cannot be separated.","In a real network the phase is not under control, so a collision gives a distorted waveform that cannot be decoded."])}
<p>Switched Ethernet gives each station a private link, so practically no collisions occur and CSMA/CD is not used. Wi-Fi shares the air, so the waves of two senders overlap and CSMA/CA is used (Lesson 6). In short, a collision is a physical event on the waveform that is detected and handled by the digital protocol.</p>
${SEC("1.2","The LLC and MAC sublayers")}
<p>The IEEE 802 standards divide the data link layer into two sublayers.</p>
<table class="dt gt cmpt"><thead><tr><th>Sublayer</th><th>Task</th></tr></thead><tbody>
<tr><td><b>LLC</b> (Logical Link Control, IEEE 802.2)</td><td>Gives one interface to the network layer for all LAN types. It identifies the upper layer protocol and can give flow control and error control.</td></tr>
<tr><td><b>MAC</b> (Medium Access Control)</td><td>Controls access to the shared medium, adds the MAC addresses and the check sequence to the frame, and sends and receives frames through the physical layer. Each LAN type (Ethernet, Wi-Fi) has its own MAC.</td></tr></tbody></table>
<div class="vis"><svg id="lm" viewBox="0 0 700 250" role="img" aria-label="OSI layers 1 and 2 compared with the IEEE 802 model"></svg></div>
${SEC("1.3","The channel allocation problem")}
<p>The <b>channel allocation problem</b> is how to share one channel among many competing stations. There are two approaches.</p>
<ul><li><b>Static allocation.</b> The channel is divided in advance, by frequency (<b>FDM</b>, frequency division multiplexing) or by time (<b>TDM</b>, time division multiplexing). Each of the N stations gets 1/N of the capacity.</li>
<li><b>Dynamic allocation.</b> The channel is given to a station when it has a frame to send.</li></ul>
<p>Static allocation is simple and has no collisions. It wastes capacity when the traffic is bursty, because a station that has nothing to send leaves its part of the channel unused while another station waits. LAN traffic is bursty, so dynamic allocation is used. Static allocation is still used where each station has a steady flow, for example in mobile telephone networks. Lesson 7 describes it under the name <b>channelization</b> (FDMA, TDMA and CDMA).</p>
<p>The delay shows this. Let C be the channel capacity in bits per second, 1/&mu; the mean frame length in bits and &lambda; the frame arrival rate in frames per second. With a queueing model the mean delay for one channel of capacity C is <b>T = 1 / (&mu;C - &lambda;)</b>. If the channel is divided into N static sub-channels, each of capacity C/N and each with arrival rate &lambda;/N, the delay is <b>T(N) = N / (&mu;C - &lambda;)</b>, which is N times worse.</p>
<div class="vis"><div class="row"><span>Capacity C <input type="range" id="fc" min="10" max="1000" step="10" value="100" aria-label="Capacity"> <b id="fcv">100</b> Mbps</span><span>Mean frame <input type="range" id="ff" min="1000" max="20000" step="1000" value="10000" aria-label="Frame length"> <b id="ffv">10000</b> bits</span><span>Arrival rate <input type="range" id="fl" min="500" max="9500" step="500" value="5000" aria-label="Arrival rate"> <b id="flv">5000</b> frames/s</span><span>Sub-channels N <input type="range" id="fn" min="1" max="20" value="10" aria-label="N"> <b id="fnv">10</b></span></div><div id="fres"></div></div>
${DOIT(["Keep the default values. One shared channel has a delay of 0.2 ms. With N = 10 static sub-channels the delay is 2 ms.","Increase the arrival rate until it is close to &mu;C. The delay of both systems grows without limit, but the divided channel is always N times worse.","Set N = 1. The two delays are equal. Static division gives no loss only when there is one station."])}
<p>Dynamic allocation protocols are designed with five assumptions.</p>
<table class="dt gt cmpt"><thead><tr><th>#</th><th>Assumption</th><th>Meaning</th></tr></thead><tbody>
<tr><td>1</td><td>Independent traffic</td><td>There are N independent stations. Each generates frames at a given rate. After a frame is generated, the station is blocked until the frame is sent.</td></tr>
<tr><td>2</td><td>Single channel</td><td>One channel is used for all communication. All stations can send on it and receive from it.</td></tr>
<tr><td>3</td><td>Observable collisions</td><td>If two frames overlap in time, the signal is garbled. This is a collision. All stations can detect a collision. A frame that collided must be sent again.</td></tr>
<tr><td>4</td><td>Continuous or slotted time</td><td>With <b>continuous time</b> a frame can start at any instant. With <b>slotted time</b> time is divided into slots and a frame starts only at the start of a slot.</td></tr>
<tr><td>5</td><td>Carrier sense or no carrier sense</td><td>With <b>carrier sense</b> a station can check if the channel is in use before it sends. Without carrier sense a station sends and finds the result later.</td></tr></tbody></table>
${SEC("1.4","Classes of MAC protocols")}
<p>The methods of multiple access are placed in three families. The table is the map for Lessons 2 to 9.</p>
<table class="dt gt cmpt"><thead><tr><th>Family</th><th>Idea</th><th>Methods in this unit</th><th>Lesson</th></tr></thead><tbody>
<tr><td><b>Random access</b> (contention)</td><td>Any station sends when it has a frame. Collisions can happen. The station sends again after a random time.</td><td>BEB algorithm, ALOHA, Slotted ALOHA, CSMA, CSMA/CD, CSMA/CA</td><td>2 to 6</td></tr>
<tr><td><b>Channelization</b></td><td>The channel is divided in advance into parts for the stations, by frequency, by time or by code.</td><td>FDMA, TDMA, CDMA</td><td>7</td></tr>
<tr><td><b>Controlled access</b> (collision-free)</td><td>The stations agree on the order of transmission, so no collision happens.</td><td>Reservation, polling, token passing, basic bit map, BRAP, binary countdown, MLMA</td><td>8</td></tr>
<tr><td><b>Limited contention</b></td><td>Contention at low load, collision-free turns at high load.</td><td>Adaptive tree walk</td><td>9</td></tr></tbody></table>
<p>Lesson 10 compares the protocols with performance metrics. Lesson 11 describes the IEEE 802 standards that use them.</p>
${SEC("1.5","MAC address format")}
<p>A <b>MAC address</b> (also called a <b>physical address</b>, <b>LAN address</b> or <b>hardware address</b>) identifies one network interface on the LAN. It is 48 bits (6 bytes) long and is usually written as six pairs of hexadecimal digits, for example <b>00:1A:2B:3C:4D:5E</b>. The address is stored in the <b>NIC</b> (network interface card).</p>
<table class="dt gt cmpt"><thead><tr><th>Bytes</th><th>Field</th><th>Meaning</th></tr></thead><tbody>
<tr><td>1 to 3 (24 bits)</td><td><b>OUI</b>, Organizationally Unique Identifier</td><td>Assigned to the manufacturer by the IEEE.</td></tr>
<tr><td>4 to 6 (24 bits)</td><td>Device part</td><td>Assigned by the manufacturer. It is unique for each interface.</td></tr></tbody></table>
<p>Two bits in the first byte have a special meaning.</p>
<ul><li><b>I/G bit</b> (Individual/Group, the least significant bit of byte 1). 0 means a unicast address (one interface). 1 means a group (multicast) address.</li>
<li><b>U/L bit</b> (Universal/Local, the second least significant bit of byte 1). 0 means the address is globally unique (given by the manufacturer). 1 means the address is locally administered (set by the administrator or the operating system).</li></ul>
<p>The address <b>FF:FF:FF:FF:FF:FF</b> (all 48 bits are 1) is the <b>broadcast address</b>. Every station on the LAN accepts a frame sent to it.</p>
<div class="vis"><div class="row"><label>MAC address <input id="mi" value="00:1A:2B:3C:4D:5E" size="22" aria-label="MAC address" style="padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></label><button class="btn sm" type="button" data-ex="01:00:5E:00:00:FB">multicast example</button><button class="btn sm" type="button" data-ex="FF:FF:FF:FF:FF:FF">broadcast</button><button class="btn sm" type="button" data-ex="02:42:AC:11:00:02">locally administered</button><button class="btn sm" type="button" data-ex="3C:5A:B4:12:34:56">unicast</button></div><div id="mo"></div></div>
${SEC("1.6","How a NIC uses the MAC address")}
<p>On a shared cable every station receives every frame. The NIC of each station reads the <b>destination address</b> at the start of the frame and compares it with its own MAC address. The NIC passes the frame to the upper layers only if the addresses match, or if the destination is the broadcast address or a group address that the station has joined. Otherwise the NIC discards the frame. Step through the cases.</p>
<div class="vis"><svg id="bus" role="img" aria-label="Four stations on a shared cable"></svg><div id="busst"></div></div>
<table class="dt gt cmpt"><thead><tr><th>Feature</th><th>MAC address</th><th>IP address</th></tr></thead><tbody>
<tr><td>Layer</td><td>2 (data link)</td><td>3 (network)</td></tr><tr><td>Length</td><td>48 bits</td><td>32 bits (IPv4), 128 bits (IPv6)</td></tr>
<tr><td>Scope</td><td>One LAN (changes at every hop)</td><td>End to end (does not change)</td></tr><tr><td>Assigned by</td><td>Manufacturer (can be changed in software)</td><td>Network administrator or DHCP</td></tr></tbody></table>
<p>A host finds the MAC address that belongs to an IP address with ARP (Unit II, Lesson 6).</p>
${quiz("m1q1","Which bit shows that a MAC address is a multicast address?",["The U/L bit of byte 1","The I/G bit (least significant bit of byte 1)","The most significant bit of byte 6","The last bit of the OUI"],1,"I/G = 1 means a group address. Broadcast FF:FF:FF:FF:FF:FF also has this bit set.")}
${quiz("m1q2","A frame is sent to a MAC address that does not match the NIC of station B. What does B do?",["Passes the frame to the network layer","Discards the frame, unless B is in promiscuous mode","Sends an error to the sender","Forwards it to the next station"],1,"The NIC compares the destination address and drops the frame if it does not match. Promiscuous mode accepts all frames.")}
${quiz("m1q3","Static division of a channel into N sub-channels changes the mean delay from T to:",["T / N","T","N x T","T + N"],2,"T(N) = N / (&mu;C - &lambda;), which is N times the delay of one shared channel.")}
${EXAM(["Define MAC. Why is a MAC sublayer needed for a broadcast link?","List the five assumptions of the dynamic channel allocation problem.","A channel of 100 Mbps carries frames of 10000 bits at 5000 frames per second. Find the mean delay with one channel and with 10 static sub-channels. (Answer: 0.2 ms and 2 ms.)","The MAC address of a NIC is 01:80:C2:00:00:00. Is it unicast or group? Is it universal or local? (Answer: group, universal.)","State the difference between a MAC address and an IP address."])}
${SUM(["The MAC sublayer decides who uses a shared channel. LLC is above it and the physical layer is below it.","Static allocation (FDM, TDM) wastes capacity and makes delay N times worse. LANs use dynamic allocation.","A MAC address is 48 bits: 24 bits OUI and 24 bits device part. The I/G bit and the U/L bit are in byte 1.","The NIC accepts a frame if the destination is its own address, the broadcast address, or a group address it has joined."])}
`,

function bebRun(seed){
  const rn=prng(seed),A=[],B=[],steps=[];let t=0,a=0,win=null;
  const both=(s)=>{A.push(s);B.push({...s})};
  for(;;){
    a++;const t0=t;
    both({a:t,b:t+1,cls:'bad',txt:'send'});both({a:t+1,b:t+2,cls:'jam',txt:'jam'});t+=2;
    steps.push({upto:t,cap:`<b>Collision number ${a}.</b> A and B both started to send at time ${t0}. The two signals overlap on the cable. Each station detects the collision, stops sending the frame and sends a short <b>jam signal</b> so that all stations know about the collision. Each station now has a collision counter n = ${a}.`});
    const m=Math.min(a,10),R=1<<m,ka=Math.floor(rn()*R),kb=Math.floor(rn()*R);
    if(ka>0)A.push({a:t,b:t+ka,cls:'bo',txt:'K='+ka});if(kb>0)B.push({a:t,b:t+kb,cls:'bo',txt:'K='+kb});
    steps.push({upto:t+Math.max(ka,kb),cap:`<b>Each station chooses K at random from 0 to ${R-1}</b> (that is 0 to 2<sup>${m}</sup> - 1). A chooses <b>K = ${ka}</b> and B chooses <b>K = ${kb}</b>. Each station waits K slot times before it tries again. There are ${R} possible values, so the chance that both pick the same value is 1/${R}.`});
    if(a>=16){steps.push({upto:t+Math.max(ka,kb)+1,cap:`<b>16 attempts have failed.</b> The MAC sublayer gives up and reports an error to the upper layer.`});break}
    if(ka===kb){t+=ka;steps.push({upto:t,cap:`<b>Both chose K = ${ka}.</b> Their waiting times end at the same time, so both send again at time ${t} and collide again. The counter will be ${a+1}, so the range of K doubles.`});continue}
    const lo=Math.min(ka,kb),hi=Math.max(ka,kb),f=ka<kb?A:B,o=ka<kb?B:A,fn=ka<kb?'A':'B',on=ka<kb?'B':'A';
    f.push({a:t+lo,b:t+lo+3,cls:'ok',txt:'frame'});
    const tb=t+hi,endF=t+lo+3;let st=tb;
    if(tb<endF){o.push({a:tb,b:endF,cls:'wait',txt:'defer'});st=endF}
    o.push({a:st,b:st+3,cls:'ok',txt:'frame'});win=st+3;
    steps.push({upto:t+lo+3,cap:`<b>${fn} has the smaller K (${lo}), so ${fn} sends first.</b> The frame of ${fn} is sent without a collision. ${on} waits until K = ${hi} and then listens to the cable.`});
    steps.push({upto:win,cap:tb<endF?`<b>${on} finds the cable busy</b> when its waiting time ends, so ${on} <b>defers</b> until the frame of ${fn} ends and then sends its own frame. Both frames are delivered after ${a} collision${a>1?'s':''}.`:`<b>The waiting time of ${on} ends after the frame of ${fn}.</b> The cable is free, so ${on} sends its frame. Both frames are delivered after ${a} collision${a>1?'s':''}.`});
    break}
  const T=Math.max(16,Math.ceil((win||t+3)+1));
  return {A,B,steps,T,collisions:a}}
function bebMC(N,trials,seed){
  const rn=prng(seed);let tot=0,gave=0,hist=Array(8).fill(0);
  for(let k=0;k<trials;k++){let a=0,ok=false;
    while(a<16){a++;const R=1<<Math.min(a,10);let mn=1e9,c=0;for(let i=0;i<N;i++){const v=Math.floor(rn()*R);if(v<mn){mn=v;c=1}else if(v===mn)c++}if(c===1){ok=true;break}}
    if(!ok)gave++;tot+=a;hist[Math.min(a,8)-1]++}
  return {mean:tot/trials,gave,hist}}
lesson({nav:"2. Binary Exponential Back-off (BEB)",title:"Binary Exponential Back-off algorithm",syl:"Binary Exponential Back-off (BEB) Algorithm",
html:()=>`
${GUIDE({"syl":"Binary Exponential Back-off (BEB) Algorithm","why":"When two stations collide, both must send the frame again. If both wait the same time, they collide again. The BEB algorithm chooses a random waiting time and doubles the range after every collision. Ethernet (CSMA/CD) uses it, so this lesson comes before the protocols of Lessons 3 and 4.","map":[["2.1","Why a random waiting time","What happens if both stations wait a fixed time?","Read the problem and the requirement."],["2.2","The BEB rules","How is the waiting time chosen?","Learn the formula, the slot time and the limits (10 and 16)."],["2.3","BEB step by step","How does a collision between two stations end?","Run the animation and change the random seed."],["2.4","Many stations","What happens when N stations collide together?","Run a simulation for N stations and read the average number of collisions."],["2.5","Advantages and disadvantages","Why is BEB used, and what is its weakness?","Read the lists."],["2.6","Worked examples","How does the rule work for two and for three stations?","Step through the example of the course notes and use the wait calculator."],["2.7","The capture effect","Why can one station win again and again?","Run the simulation and read the share of the winner."]],"osi":"Layer 2, MAC sublayer (used by Ethernet CSMA/CD).","pre":"Lesson 1: the collision and the shared channel.","time":"about 1 hour 15 minutes","next":"Lesson 3, ALOHA and Slotted ALOHA."})}
${LEARN(["explain why a collision needs a random waiting time","apply the BEB rule: K chosen from 0 to 2^n - 1, with n limited to 10 and 16 attempts","calculate the longest waiting time after the n-th collision","explain how the range of the waiting time adjusts to the number of stations"])}
${SEC("2.1","Why a random waiting time")}
<p>After a collision, each station must send its frame again. Suppose every station waits the same fixed time. Then the stations that collided send again at the same instant and collide again, and this repeats. The waiting time must therefore be <b>different for different stations</b>. A random choice gives this without any coordination between the stations.</p>
<p>There is a second requirement. If only two stations collide, a short random range (for example 0 or 1 slot) is enough. If 30 stations collide, a short range gives many repeated collisions. The range must grow when collisions continue. A station does not know how many other stations are involved, but the number of collisions it has had is a good estimate of the load.</p>
${SEC("2.2","The BEB rules")}
${DEF("Binary Exponential Back-off (BEB)","is an algorithm in which a station that has had n collisions for one frame waits a random number of slot times K, chosen from 0 to 2<sup>n</sup> - 1, before it tries again. The range doubles after every collision.")}
<ol><li>A station sends a frame. If there is no collision, the frame is delivered.</li>
<li>After the n-th collision for this frame, the station chooses <b>K</b> at random (all values equally likely) from the set <b>{0, 1, ..., 2<sup>n</sup> - 1}</b>.</li>
<li>The station waits <b>K &times; slot time</b> and then tries again (it first checks that the cable is free).</li>
<li>The exponent is limited. After 10 collisions the range stays at 0 to 1023 (this is called <b>truncated</b> BEB).</li>
<li>After <b>16</b> failed attempts the station stops and reports an error.</li></ol>
<p>The <b>slot time</b> in classic Ethernet is <b>512 bit times</b>. This is the time for the sender to be sure that no collision will happen: it is at least the round-trip delay of the longest cable plus the jam time. At 10 Mbps, one bit time is 0.1 &micro;s, so the slot time is 51.2 &micro;s.</p>
<table class="dt gt cmpt"><thead><tr><th>Collision n</th><th>Range of K</th><th>Number of values</th><th>Chance that two stations choose the same K</th><th>Longest wait at 10 Mbps</th></tr></thead><tbody>
${[1,2,3,4,5,6,10].map(n=>{const R=1<<n;return `<tr><td>${n}</td><td>0 to ${R-1}</td><td>${R}</td><td>1/${R} = ${(100/R).toFixed(2)}%</td><td>${(51.2*(R-1)).toFixed(1)} &micro;s</td></tr>`}).join('')}</tbody></table>
${NOTE("The chance of a repeated collision between two stations is 1/2<sup>n</sup>. It is 50% after the first collision and only 0.1% after the tenth. Two stations almost always succeed within a few attempts.")}
${SEC("2.3","BEB step by step")}
<p>Stations A and B send a frame at the same time. Time is shown in slot times. Press <b>Next step</b> to see each collision and each random choice. Press <b>New random run</b> to start again with another random seed.</p>
<div class="vis"><div class="row"><button class="btn pri" type="button" id="bnew">New random run</button><span class="small muted" id="bseed"></span></div><svg id="bsvg" role="img" aria-label="Timeline of two stations with collisions and back-off"></svg><div id="bst"></div>
<div class="legend small"><span class="pill" style="background:var(--bad-soft)">send (collision)</span> <span class="pill" style="background:var(--bad);color:var(--on)">jam</span> <span class="pill" style="background:var(--sec-soft)">K = back-off wait</span> <span class="pill" style="background:var(--warn-soft)">defer (cable busy)</span> <span class="pill" style="background:var(--good-soft)">frame delivered</span></div></div>
${DOIT(["Press <b>New random run</b> several times. Most runs end after one or two collisions.","Find a run in which both stations choose the same K. Read what the next range of K is.","In a run with K = 0 for one station and K = 1 for the other, find why the second station defers."])}
${SEC("2.4","Many stations")}
<p>When N stations collide, the chance of success in one round is the chance that exactly one of them has the smallest K. With a small range this chance is low. The range doubles after each collision, so the chance improves. The simulation below uses a simple model: N stations start together, and in every round all of them choose K from 0 to 2<sup>n</sup> - 1 (n = round number, limited to 10). A round succeeds when exactly one station has the smallest K. The program runs 2000 trials.</p>
<div class="vis"><div class="row"><span>Stations N <input type="range" min="2" max="40" value="5" id="bn" aria-label="Number of stations"> <b id="bnv">5</b></span></div><div id="bmc"></div></div>
${DOIT(["With N = 2 the mean number of collisions before success is about 1.6.","Increase N to 10 and then to 40. The mean rises slowly (about 3.3 for N = 10 and about 5.3 for N = 40) because the range doubles each time.","Even for N = 40 no trial reaches 16 attempts in this model. In a real network the stations do not all start together, so the figures are only a guide."])}
${SEC("2.5","Advantages and disadvantages")}
<table class="dt gt cmpt"><thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td><b>Adaptive.</b> The range of the waiting time grows with the load. Light load gives a short delay. Heavy load spreads the stations over a long range.</td><td><b>Unfair in the short term.</b> The capture effect (Section 2.7) lets some stations win more often than others.</td></tr>
<tr><td><b>Distributed.</b> No station needs to know the number of other stations.</td><td><b>High delay under heavy traffic.</b> The waiting range becomes long after several collisions.</td></tr>
<tr><td><b>Simple.</b> The rule is easy to put in the hardware of the network card.</td><td><b>Not suitable for real-time traffic</b> such as voice or video, because the waiting time is random and has no upper limit.</td></tr>
<tr><td><b>It reduces repeated collisions.</b> The chance of a second collision between the same stations is 1/2<sup>n</sup>.</td><td><b>Loss of data.</b> After 16 failed attempts the frame is dropped.</td></tr></tbody></table>
<p>In the course notes the random number is written <i>r</i> and the rule is <b>wait time = r &times; slot time</b>, with r chosen from {0, 1, ..., 2<sup>min(k, 10)</sup> - 1}, where k is the number of collisions. This lesson writes K for r and n for k. The meaning is the same.</p>
${SEC("2.6","Worked examples")}
<p><b>Two stations.</b> A and B send at the same time and collide. After the first collision n = 1, so each station chooses K from {0, 1}. If A chooses 0 and B chooses 1, A sends at once. B waits one slot time (51.2 &micro;s at 10 Mbps) and then sends. Both frames are delivered.</p>
<p><b>Three stations.</b> B, C and D send at the same time and collide. Step through the example of the course notes. A frame lasts 2 slot times in the picture. Time is in slot times.</p>
<div class="vis"><svg id="b3" role="img" aria-label="Timeline of three stations B, C and D with back-off"></svg><div id="b3s"></div>
<div class="legend small"><span class="pill" style="background:var(--bad-soft)">send (collision)</span> <span class="pill" style="background:var(--bad);color:var(--on)">jam</span> <span class="pill" style="background:var(--sec-soft)">K = back-off wait</span> <span class="pill" style="background:var(--warn-soft)">defer (cable busy)</span> <span class="pill" style="background:var(--good-soft)">frame delivered</span></div></div>
<p>The wait calculator gives the range and the longest wait after the n-th collision for the bit rate that you select. The slot time is always 512 bit times.</p>
<div class="vis"><div class="row"><span>Collision number n <input type="range" id="wn" min="1" max="16" value="2" aria-label="Collision number"> <b id="wnv">2</b></span><span>Bit rate <select id="wr" aria-label="Bit rate"><option value="10">10 Mbps</option><option value="100">100 Mbps</option><option value="1000">1 Gbps</option></select></span><span>Chosen K <input type="number" id="wk" min="0" value="3" style="width:80px" aria-label="Chosen K"></span></div><div id="wres"></div></div>
${DOIT(["Set n = 2 and K = 2. The wait is 2 &times; 51.2 = 102.4 &micro;s at 10 Mbps. Set K = 3 and read 153.6 &micro;s. These are the two values in the example above.","Set n = 11. The range stops at 0 to 1023, because the exponent is limited to 10.","Set n = 16 and read the note: this is the last attempt."])}
${SEC("2.7","The capture effect")}
<p>Two stations A and B always have frames to send. When A sends a frame successfully, its next frame starts with no collision count. B has a frame that has already collided. The next contest begins when the cable becomes idle, so both send at once and collide. A chooses K from {0, 1}. B chooses from a larger range because its collision count is higher. A is therefore more likely to win again. Each win makes the next win more likely. This is the <b>capture effect</b>.</p>
<div class="vis"><div class="row"><span>Frames to simulate <select id="cn" aria-label="Frames"><option>200</option><option selected>1000</option><option>5000</option></select></span><button class="btn pri" type="button" id="cnew">New random run</button></div><div id="cres"></div></div>
${DOIT(["Run the simulation several times. The station that won the previous frame also wins the next frame much more often than 50% of the time.","Look at the longest run. A single station can send many frames one after the other while the other station waits. The run ends when the waiting station reaches 16 failed attempts and drops its frame, or when it draws a small value by chance."])}
${quiz("m2q1","After the 3rd collision a station chooses K from:",["0 to 3","0 to 7","1 to 8","0 to 15"],1,"After the n-th collision K is chosen from 0 to 2^n - 1. For n = 3 this is 0 to 7.")}
${quiz("m2q2","In truncated BEB, what happens after 10 collisions?",["The station gives up","The range stays at 0 to 1023","The range keeps doubling","The slot time doubles"],1,"The exponent is limited to 10, so the range stops growing at 0 to 1023. The station gives up only after 16 attempts.")}
${quiz("m2q3","Two stations collide for the first time. What is the chance that they collide again?",["0","1/4","1/2","1"],2,"After the first collision each station chooses 0 or 1. They choose the same value with probability 1/2.")}
${EXAM(["State the BEB algorithm. What are the limits 10 and 16?","Find the longest waiting time (in microseconds) after the 4th collision on 10 Mbps Ethernet with a slot time of 512 bit times. (Answer: 15 x 51.2 = 768 &micro;s.)","Two stations collide. Find the probability that they collide at the second attempt and at the third attempt. (Answer: 1/2 and then 1/4 for a repeated collision.)","Why must the waiting time be random and not fixed?","Explain the capture effect."])}
${SUM(["After the n-th collision the station chooses K from 0 to 2^n - 1 and waits K slot times (K is called r in the course notes).","The exponent is limited to 10. The station gives up after 16 attempts. The slot time is 512 bit times (51.2 &micro;s at 10 Mbps).","The random choice separates the stations. The doubling range adapts to the number of colliding stations.","BEB is not fair in the short term because of the capture effect."])}
`,
mount(r){
  let seed=7,run,st,svg=$("#bsvg",r);
  const build=()=>{run=bebRun(seed);$("#bseed",r).textContent=`Random seed ${seed}. ${run.collisions} collision${run.collisions>1?'s':''} in this run.`;
    const c={T:run.T,tick:2,tlabel:'time in slot times',lanes:[{label:'Station A',segs:run.A},{label:'Station B',segs:run.B}]};
    st=story(r,"#bst",{draw:i=>lanes(svg,c,run.steps[i].upto)});st.set(run.steps.map(s=>({cap:s.cap})))};

  $("#bn",r).oninput=mc;mc();

    {label:'Station C',segs:[Sg(0,1,'bad','send'),Sg(1,2,'jam','jam'),Sg(2,3,'bad','send'),Sg(3,4,'jam','jam'),Sg(4,7,'bo','K=3'),Sg(7,8,'wait','busy'),Sg(8,10,'ok','frame')]},
    {label:'Station D',segs:[Sg(0,1,'bad','send'),Sg(1,2,'jam','jam'),Sg(2,3,'bo','K=1'),Sg(3,4,'wait','busy'),Sg(4,6,'ok','frame')]}]};
  const c3c=[[2,'<b>Collision 1.</b> B, C and D send together at time 0. They detect the collision and send the jam signal. Each station has n = 1.'],
   [3,'<b>Each station chooses K from {0, 1}.</b> B chooses 0, C chooses 0 and D chooses 1. B and C send again at once (time 2). D waits one slot time.'],
   [4,'<b>Collision 2 (B and C).</b> B and C collide again because they chose the same value. At time 3 D finds the cable busy, so it defers. B and C send the jam signal. Their count is now n = 2.'],
   [6,'<b>D sends.</b> After the jam, the cable is idle at time 4. D sends its frame and it is delivered (time 4 to 6). B and C choose from {0, 1, 2, 3}: B chooses 2 (a wait of 102.4 &micro;s) and C chooses 3 (a wait of 153.6 &micro;s).'],
   [8,'<b>B sends.</b> The wait of B ends at time 6. The cable is idle, so B sends and its frame is delivered.'],
   [10,'<b>C sends.</b> The wait of C ends at time 7, when B is sending. C defers until the cable is idle at time 8 and then sends. All three frames are delivered. The range {0, 1, 2, 3} separated B and C.']];
  const s3=story(r,"#b3s",{draw:i=>lanes($("#b3",r),c3,c3c[i][0])});s3.set(c3c.map(x=>({cap:x[1]})));
  const wc=()=>{const n=+$("#wn",r).value,bw=+$("#wr",r).value,e=Math.min(n,10),R=1<<e,slot=512/bw;let K=Math.max(0,Math.floor(+$("#wk",r).value||0));$("#wnv",r).textContent=n;
    const ok=K<=R-1;
    $("#wres",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>Slot time = 512 bit times</td><td>512 / ${bw} Mbps = <b>${slot.toFixed(2)} &micro;s</b></td></tr><tr><td>Exponent = min(n, 10)</td><td><b>${e}</b></td></tr><tr><td>Range of K</td><td><b>0 to ${R-1}</b> (${R} values)</td></tr><tr><td>Longest wait</td><td>${R-1} &times; ${slot.toFixed(2)} = <b>${((R-1)*slot).toFixed(1)} &micro;s</b></td></tr><tr><td>Wait for K = ${K}</td><td>${ok?`${K} &times; ${slot.toFixed(2)} = <b>${(K*slot).toFixed(1)} &micro;s</b>`:`<span class="bad">K = ${K} is outside the range 0 to ${R-1}</span>`}</td></tr></tbody></table>${n===16?'<div class="callout k small">This is the 16th attempt. If it fails, the frame is dropped and an error is reported.</div>':''}`};
  ["wn","wr","wk"].forEach(k=>$("#"+k,r).oninput=wc);$("#wr",r).onchange=wc;wc();
  /* 2.7 capture effect */
  let cseed=21;
  const cap=()=>{const N=+$("#cn",r).value,rn=prng(cseed),kc=[0,0],tot=[0,0];let prev=-1,same=0,run=0,best=0,drop=0;
    for(let f=0;f<N;f++){let a=kc[0]+1,b=kc[1]+1,w=-1;

  $("#cn",r).onchange=cap;$("#cnew",r).onclick=()=>{cseed=cseed*5+3;cap()};cap();
}});

/* ===== Unit III (rebuilt) Lesson 3: ALOHA and Slotted ALOHA ===== */
function alohaSim(slotted,G,seed,Tend){
  const rn=prng(seed),n=Math.max(1,Math.round(G*Tend)),fr=[];
  for(let i=0;i<n;i++){let t=rn()*(Tend-1);if(slotted)t=Math.floor(t);fr.push({a:t,b:t+1,ok:true})}
  fr.sort((x,y)=>x.a-y.a);
  for(let i=0;i<fr.length;i++)for(let j=i+1;j<fr.length&&fr[j].a<fr[i].b;j++){fr[i].ok=false;fr[j].ok=false}
  const ends=[];fr.forEach(f=>{let k=ends.findIndex(e=>e<=f.a);if(k<0){k=ends.length;ends.push(0)}ends[k]=f.b;f.lane=k});
  const good=fr.filter(f=>f.ok).length;
  return {fr,n,good,bad:n-good,S:good/Tend,lanes:ends.length}}
const SPURE=G=>G*Math.exp(-2*G),SSLOT=G=>G*Math.exp(-G);
lesson({nav:"3. ALOHA and Slotted ALOHA",title:"Random access for data services: ALOHA and Slotted ALOHA",syl:"Distributed Random Access Schemes/Contention Schemes: for Data Services (ALOHA and Slotted ALOHA)",
html:()=>`
${GUIDE({"syl":"Distributed Random Access Schemes/Contention Schemes: for Data Services (ALOHA and Slotted ALOHA)","why":"ALOHA is the first random access protocol. A station sends whenever it has data and handles collisions by sending again after a random time. It is simple, but it uses the channel poorly. Slotted ALOHA doubles the best throughput. The ideas of vulnerable time and throughput S = G e^(-kG) from this lesson are needed in the performance lesson (Lesson 10).","map":[["3.1","Random access and pure ALOHA","Where does ALOHA fit among the access methods, and what are its rules?","Read the three families and the rules of pure ALOHA."],["3.2","Pure ALOHA in time","What happens to frames that overlap?","Step through a timeline with a collision."],["3.3","Vulnerable time and throughput","How long is a frame at risk, and what is the throughput?","Follow the derivation S = G e^(-2G)."],["3.4","Slotted ALOHA","How do time slots help?","Read the derivation S = G e^(-G)."],["3.5","Simulation","How do the two protocols behave when the load rises?","Run a random simulation and compare it with the formula."],["3.6","Comparison and examples","How do I solve exam problems?","Work the numerical examples."]],"osi":"Layer 2, MAC sublayer. ALOHA was designed for radio data networks (satellite and ground radio).","pre":"Lessons 1 and 2: shared channel, collision, random waiting time.","time":"about 1 hour 30 minutes","next":"Lesson 4, CSMA."})}
${LEARN(["state the rules of pure ALOHA and Slotted ALOHA","explain vulnerable time and show why it is 2T for pure ALOHA and T for Slotted ALOHA","derive and use S = G e^(-2G) and S = G e^(-G)","state the maximum throughput of each protocol and the load at which it occurs"])}
${SEC("3.1","Random access and pure ALOHA")}
<p>The methods by which stations share a channel are placed in three families.</p>
<table class="dt gt cmpt"><thead><tr><th>Family</th><th>Who decides when a station sends</th><th>Examples</th><th>Lesson</th></tr></thead><tbody>
<tr><td><b>Random access</b> (contention)</td><td>The station itself. No station controls another. If two frames overlap, there is a collision.</td><td>ALOHA, CSMA, CSMA/CD, CSMA/CA</td><td>3 to 6</td></tr>
<tr><td><b>Channelization</b></td><td>The channel is divided in advance. Each station has its own part.</td><td>FDMA, TDMA, CDMA</td><td>7</td></tr>
<tr><td><b>Controlled access</b></td><td>The stations take turns by an agreed rule. There is no collision.</td><td>Reservation, polling, token passing</td><td>8</td></tr></tbody></table>
${NOTE("<b>Notation.</b> The course notes write T<sub>p</sub> for the frame time in the ALOHA topic and also for the propagation delay in the CSMA topics. This lab uses <b>T</b> for the frame time (the time to send one frame) and <b>T<sub>p</sub></b> for the propagation delay, so that the two are never mixed. When your notes say \"vulnerable time = 2 T<sub>p</sub>\" for pure ALOHA, read it as 2T.")}
<p><b>ALOHA</b> was developed at the University of Hawaii in the early 1970s (Norman Abramson) to connect computers on different islands by radio. All stations send on the same radio channel. The protocol is called <b>pure ALOHA</b> to separate it from Slotted ALOHA.</p>
${DEF("Pure ALOHA","is a random access protocol in which a station sends a frame whenever it has one. It then waits for an acknowledgement. If no acknowledgement arrives within the time-out, it assumes a collision, waits a random time and sends the frame again.")}
<ol><li>A station that has a frame sends it at once. It does not listen to the channel first (there is no carrier sense).</li>
<li>After it sends, the station waits for an acknowledgement. The time-out is the maximum round-trip time, 2 &times; T<sub>p</sub> (propagation delay), plus a small margin.</li>
<li>If the acknowledgement arrives, the frame is delivered.</li>
<li>If there is no acknowledgement, the station waits a <b>random back-off time</b> and sends the frame again. A random time is needed because a fixed time makes the stations that collided collide again (Lesson 2).</li>
<li>After a maximum number of attempts K<sub>max</sub> the station gives up and tries later.</li></ol>
<p>Two frames collide if they overlap in time, even by one bit. Both frames are then damaged and both must be sent again.</p>
${SEC("3.2","Pure ALOHA in time")}
<p>Three stations A, B and C use the channel. Each frame takes one frame time T (shown as 2 units here). Step through the timeline.</p>
<div class="vis"><svg id="a1" role="img" aria-label="Pure ALOHA timeline"></svg><div id="a1s"></div></div>
${SEC("3.3","Vulnerable time and throughput")}
${DEF("Vulnerable time","is the time interval in which a frame can be damaged by another frame. A frame sent at time t is at risk during the vulnerable time.")}
<p>Let the frame time be T. Take a test frame sent at time t, so it occupies the interval t to t + T.</p>
<ul><li>A frame that another station starts in the interval (t - T) to t is still being sent at time t, so its end overlaps the start of the test frame.</li>
<li>A frame that another station starts in the interval t to (t + T) overlaps the test frame.</li></ul>
<p>The test frame survives only if no other frame starts in the interval from t - T to t + T. The vulnerable time of pure ALOHA is therefore <b>2T</b>. The picture shows four other frames. Two of them collide with the test frame and two do not.</p>
<div class="vis"><svg id="a2" role="img" aria-label="Vulnerable time of pure ALOHA is two frame times"></svg></div>
<p class="small muted">The shaded interval, from t - T to t + T, is the set of start times that cause a collision with the test frame. A frame that starts outside it does not overlap the test frame.</p>
${DEF("Offered load G","is the average number of frames that all stations try to send in one frame time T. It includes new frames and frames that are sent again.")}
${DEF("Throughput S","is the average number of frames that are sent successfully in one frame time T. S is at most 1.")}
<p>Assume that G follows a Poisson distribution. The probability that k frames start in an interval where the mean is &lambda; is P(k) = (&lambda;<sup>k</sup> e<sup>-&lambda;</sup>) / k!. For pure ALOHA the interval is 2T, so the mean number of frames in it is 2G. A frame is successful when no other frame starts in the interval, so k = 0:</p>
<div class="callout i"><b>P(no other frame in 2T) = e<sup>-2G</sup></b><br>The throughput is the load times the chance of success:<br><b>S = G &times; e<sup>-2G</sup></b></div>
<p>To find the largest S, set the derivative to zero: dS/dG = e<sup>-2G</sup> (1 - 2G) = 0, so <b>G = 0.5</b>. Then S = 0.5 e<sup>-1</sup> = <b>0.184</b> (1/(2e)). The best case is that <b>18.4%</b> of the channel carries good frames. If the load rises above 0.5, more collisions occur and the throughput falls.</p>
${SEC("3.4","Slotted ALOHA")}
<p>Slotted ALOHA (Roberts, 1972) halves the vulnerable time. Time is divided into <b>slots</b> of one frame time T. A station may start a frame only at the <b>start of a slot</b>. All stations must agree on the slot boundaries, which needs a clock signal. Two frames either use the same slot completely (a collision) or different slots (no overlap). A partial overlap is not possible.</p>
<div class="vis"><svg id="a3" role="img" aria-label="Slotted ALOHA slots"></svg></div>
<p>A frame is at risk only from frames that start at the same slot boundary. The <b>vulnerable time is T</b>. The mean number of frames in this interval is G, so the chance that there is no other frame is e<sup>-G</sup>:</p>
<div class="callout i"><b>S = G &times; e<sup>-G</sup></b></div>
<p>The derivative is e<sup>-G</sup> (1 - G) = 0 at <b>G = 1</b>. Then S = e<sup>-1</sup> = <b>0.368</b>. At G = 1 the slots are used like this: 36.8% have exactly one frame (success), 36.8% are empty, and 26.4% have two or more frames (collision). Slotted ALOHA has twice the maximum throughput of pure ALOHA.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>Pure ALOHA</th><th>Slotted ALOHA</th></tr></thead><tbody>
<tr><td>When a station may send</td><td>Any time</td><td>Only at the start of a slot</td></tr><tr><td>Synchronisation</td><td>Not needed</td><td>Needed (common clock)</td></tr>

${DOIT(["Select pure ALOHA, G = 0.5 and press <b>New random run</b> several times. The measured S is near 0.18.","Raise G to 3. Almost every frame is red. The throughput falls although the stations try to send more.","Select Slotted ALOHA and G = 1. Frames start only at slot boundaries, so a collision always involves complete overlap. Compare the measured S with 0.37."])}
${SEC("3.6","Comparison and numerical examples")}
<p><b>Disadvantages of ALOHA.</b> The channel is used well only at low load. A station does not listen before it sends, so it can destroy a frame that is already in progress. Pure ALOHA wastes a frame in a partial overlap. Slotted ALOHA needs synchronisation, and a station that has a frame must wait for the next slot. Lessons 4 to 6 add carrier sense to improve this.</p>

${quiz("m3q3","Why does Slotted ALOHA have a higher throughput than pure ALOHA?",["It listens before sending","Frames can start only at slot boundaries, so the vulnerable time is T and not 2T","It uses a higher bit rate","It uses acknowledgements"],1,"Frames overlap completely or not at all, so only frames that start in the same slot can collide.")}

lesson({nav:"4. CSMA and persistence methods",title:"Random access for LANs: CSMA",syl:"Distributed Random Access Schemes/Contention Schemes: for Local-Area Networks (CSMA)",
html:()=>`
${GUIDE({"syl":"Distributed Random Access Schemes/Contention Schemes: for Local-Area Networks (CSMA)","why":"ALOHA sends without looking at the channel. In a LAN the stations are close together and can listen before they send. This lesson adds carrier sense (CSMA), shows why collisions still happen, and describes the three persistence methods. Lesson 5 adds collision detection (CSMA/CD) and Lesson 6 adds collision avoidance (CSMA/CA).","map":[["4.1","Carrier sense","What does a station check before it sends?","Read the CSMA rule."],["4.2","Propagation delay and vulnerable time","Why do collisions still happen?","Watch two signals meet on a cable and calculate the propagation time."],["4.3","Persistence methods","What does a station do when the cable is busy?","Compare 1-persistent, non-persistent and p-persistent."],["4.4","Choosing p","What value of p gives the most successful slots?","Change N and p and read the chance of success."],["4.5","Comparison","How does CSMA differ from ALOHA?","Read the comparison tables."]],"osi":"Layer 2, MAC sublayer. CSMA is the base of Ethernet (IEEE 802.3) and Wi-Fi (IEEE 802.11).","pre":"Lesson 2 (BEB) and Lesson 3 (collision, vulnerable time, throughput).","time":"about 1 hour 15 minutes","next":"Lesson 5, CSMA/CD."})}
${LEARN(["state the CSMA rule: sense before transmit","explain why collisions still happen, using the propagation delay","state that the vulnerable time of CSMA is the propagation delay","compare 1-persistent, non-persistent and p-persistent CSMA","find the value of p that gives the most successful slots"])}
${SEC("4.1","Carrier sense")}
${DEF("Carrier Sense Multiple Access (CSMA)","is a random access method in which a station <b>listens to the channel before it sends</b>. This is called carrier sense. The station sends only if the channel is idle. The principle is: sense before transmit.")}
<p>CSMA is better than ALOHA because a station does not interrupt a frame that is already in progress. The method works well when the propagation delay between stations is small compared with the frame time. This is true in a LAN, where the distance is short. It is not true on a satellite link, where the delay is long, so ALOHA is used there.</p>
<p>CSMA reduces the chance of a collision. It cannot remove it. The next section shows why.</p>
${SEC("4.2","Propagation delay and vulnerable time")}
<p>A station that starts to send cannot be heard by a far station until the signal arrives. The time that the signal needs to travel from one end of the channel to the other is the <b>propagation delay T<sub>p</sub></b>. During this time a far station can sense an idle channel and start to send, and the two frames collide. In the animation Station A and Station B are at the two ends of a cable.</p>
<div class="vis"><svg id="w1" role="img" aria-label="Two signals meeting on a cable"></svg><div id="w1s"></div></div>
<div class="callout i">The <b>vulnerable time</b> of CSMA is the <b>propagation delay T<sub>p</sub></b>. A frame is at risk only during the first T<sub>p</sub> after it starts. After that time every station can hear the signal and will not start.</div>
<p>Compare this with ALOHA, where the vulnerable time is 2T or T and T is the whole frame time. In CSMA the vulnerable time is T<sub>p</sub>, which is short when the cable is short. This is why CSMA has a much higher throughput.</p>
<div class="vis"><div class="row"><span>Cable length <input type="range" id="pl" min="10" max="5000" step="10" value="500" aria-label="Cable length"> <b id="plv">500</b> m</span><span>Signal speed <select id="ps_" aria-label="Signal speed"><option value="2e8">2 &times; 10<sup>8</sup> m/s (copper)</option><option value="3e8">3 &times; 10<sup>8</sup> m/s (radio, air)</option></select></span><span>Bit rate <select id="pb" aria-label="Bit rate"><option value="10">10 Mbps</option><option value="100">100 Mbps</option><option value="1000">1 Gbps</option></select></span><span>Frame <input type="number" id="pf_" value="1000" min="64" max="12144" style="width:90px" aria-label="Frame bits"> bits</span></div><div id="pres_"></div></div>
${DOIT(["Keep the default values. T<sub>p</sub> is 2.5 &micro;s and the frame time T is 100 &micro;s, so a = T<sub>p</sub> / T is 0.025. The frame is at risk for only 2.5% of its length.","Set the bit rate to 1 Gbps. T falls to 1 &micro;s and a rises to 2.5. Now the frame is shorter than the propagation time and carrier sense cannot help.","Set the cable to 10 m and read a again."])}
${SEC("4.3","Persistence methods")}
${DEF("Persistence method","is the rule that tells a station what to do when it senses the channel and finds it busy, and what to do when it finds it idle.")}
<table class="dt gt cmpt"><thead><tr><th>Method</th><th>When the channel is busy</th><th>When the channel is idle</th><th>Result</th></tr></thead><tbody>
<tr><td><b>1-persistent</b></td><td>Keeps listening and sends <b>as soon as</b> the channel becomes idle.</td><td>Sends at once (with probability 1).</td><td>Low delay. If two or more stations wait, they all send when the channel becomes idle, so they <b>always collide</b>. Used by Ethernet.</td></tr>
<tr><td><b>Non-persistent</b></td><td>Does <b>not</b> keep listening. Waits a random time and then listens again.</td><td>Sends at once.</td><td>Fewer collisions. The channel can stay idle while stations wait, so the delay is higher.</td></tr>
<tr><td><b>p-persistent</b> (slotted channel)</td><td>Keeps listening until the channel is idle.</td><td>In an idle slot, sends with probability <b>p</b>. With probability q = 1 - p it waits for the next slot and repeats. If the channel becomes busy in the meantime, it behaves as if there was a collision (waits and starts again).</td><td>A balance between the two. A small p reduces collisions but increases the delay.</td></tr></tbody></table>
<p>The animation shows one busy period. Station X is sending. Stations A and B get frames at t = 2 and t = 3. Select a method.</p>
<div class="vis"><div class="row">${seg("psg",[["1","1-persistent"],["n","Non-persistent"],["p","p-persistent (p = 0.5)"]])}</div><svg id="ps" role="img" aria-label="Persistence methods timeline"></svg><div id="pst"></div>
<div class="legend small"><span class="pill" style="background:var(--warn-soft)">sensing a busy channel</span> <span class="pill" style="background:var(--sec-soft)">random wait</span> <span class="pill" style="background:var(--good-soft)">frame delivered</span> <span class="pill" style="background:var(--bad-soft)">collision</span> <span class="pill" style="background:var(--surface2)">idle wait</span></div></div>
${SEC("4.4","Choosing p in p-persistent CSMA")}
<p>Suppose N stations are waiting for the channel to become idle. In the first idle slot each station sends with probability p. The slot is successful when exactly one station sends:</p>
<div class="callout i">P(success) = N &times; p &times; (1 - p)<sup>N - 1</sup>, &nbsp; P(idle slot) = (1 - p)<sup>N</sup>, &nbsp; P(collision) = 1 - P(idle) - P(success)</div>
<p>If p is large the stations collide. If p is small the slot is wasted because nobody sends. The best value is <b>p = 1/N</b>. Then P(success) is about 0.37 for large N. Change N and p.</p>
<div class="vis"><div class="row"><span>Waiting stations N <input type="range" id="qn" min="2" max="30" value="8" aria-label="Waiting stations"> <b id="qnv">8</b></span><span>p <input type="range" id="qp" min="0.02" max="1" step="0.02" value="0.5" aria-label="p"> <b id="qpv">0.5</b></span></div><div id="qres"></div><div id="qch"></div></div>
${DOIT(["With N = 8 and p = 0.5 the chance of success is 3%: eight stations almost always collide.","Set p = 0.12 (about 1/8). The chance of success rises to 39%.","Increase N to 30 with p unchanged. The best p moves to about 1/30. This is why a station needs to know, or estimate, the number of waiting stations."])}
${SEC("4.5","Comparison")}
<table class="dt gt cmpt"><thead><tr><th></th><th>1-persistent</th><th>Non-persistent</th><th>p-persistent</th></tr></thead><tbody>
<tr><td>Listens continuously when busy</td><td>Yes</td><td>No</td><td>Yes</td></tr>
<tr><td>Sends when idle</td><td>At once</td><td>At once</td><td>With probability p in a slot</td></tr>
<tr><td>Chance of collision</td><td>High</td><td>Low</td><td>Low (for a good p)</td></tr>
<tr><td>Idle channel time</td><td>Low</td><td>High</td><td>Medium</td></tr>
<tr><td>Delay</td><td>Low</td><td>High</td><td>Medium</td></tr></tbody></table>
<table class="dt gt cmpt"><thead><tr><th></th><th>ALOHA</th><th>CSMA</th></tr></thead><tbody>
<tr><td>Listens before sending</td><td>No</td><td>Yes</td></tr><tr><td>Vulnerable time</td><td>2T (pure) or T (slotted)</td><td>T<sub>p</sub></td></tr>
<tr><td>Collision when propagation delay is zero</td><td>Still possible (stations do not listen)</td><td>No</td></tr>
<tr><td>Action after a collision</td><td>Wait for time-out, send again</td><td>Same. CSMA/CD (Lesson 5) stops at once.</td></tr></tbody></table>
${quiz("r4q1","Why can a collision still happen in CSMA?",["A station does not listen","The signal of a station needs time to reach the other stations, so a far station may find the channel idle","The cable is too short","The frame is too long"],1,"The propagation delay creates a time during which a station has started but cannot be heard.")}
${quiz("r4q2","A 1-persistent station and a non-persistent station both find the channel busy. What is the difference?",["There is none","1-persistent keeps listening and sends when idle; non-persistent waits a random time before listening again","1-persistent waits a random time; non-persistent sends at once","Non-persistent never sends"],1,"1-persistent sends as soon as the channel becomes idle. Non-persistent waits a random time and then senses again.")}

lesson({nav:"5. CSMA/CD (collision detection)",title:"Random access for LANs: CSMA/CD",syl:"Distributed Random Access Schemes/Contention Schemes: for Local-Area Networks (CSMA/CD)",
html:()=>`
${GUIDE({"syl":"Distributed Random Access Schemes/Contention Schemes: for Local-Area Networks (CSMA/CD)","why":"In plain CSMA two stations that collide go on sending their whole frames, and the channel is wasted. CSMA/CD makes the station listen while it sends, so it can stop at once. The method needs a minimum frame length. It is the access method of classic Ethernet (IEEE 802.3).","map":[["5.1","The idea","What does CSMA/CD add to CSMA?","Read the definition."],["5.2","Phases of CSMA/CD","What does a station do, step by step?","Step through the flow chart for success, collision and abort."],["5.3","Detecting a collision on the cable","How does a sender notice a collision?","Watch the signals on a cable for a long and for a short frame."],["5.4","The minimum frame size","How long must a frame be?","Use the calculator for T >= 2 Tp."],["5.5","The Ethernet frame","Which frame does CSMA/CD send?","Click each field."],["5.6","Efficiency","How much of the time carries data?","Change a and compare the two constants."],["5.7","Advantages and disadvantages","When is CSMA/CD suitable?","Read the lists."]],"osi":"Layer 2, MAC sublayer. CSMA/CD is the access method of classic IEEE 802.3 Ethernet.","pre":"Lesson 2 (BEB) and Lesson 4 (CSMA, propagation delay).","time":"about 1 hour 45 minutes","next":"Lesson 6, CSMA/CA."})}
${LEARN(["describe the five phases of CSMA/CD","explain how a sender detects a collision and why it sends a jam signal","show that the frame time must be at least 2 Tp and calculate the minimum frame size","describe the Ethernet frame fields","calculate the efficiency 1 / (1 + 5a) and compare it with 1 / (1 + 5.44a)"])}
${SEC("5.1","The idea")}
${DEF("CSMA/CD (CSMA with Collision Detection)","is CSMA in which a station keeps listening <b>while it sends</b>. If it detects a collision, it stops the frame at once, sends a short <b>jam signal</b> and waits a random time (BEB, Lesson 2) before it tries again.")}
<p>In plain CSMA the station goes on sending a damaged frame to the end. If the frame is long, much channel time is lost. In CSMA/CD the lost time is only the time to detect the collision, plus the jam signal. This gives a higher efficiency.</p>
${SEC("5.2","Phases of CSMA/CD")}
<ol><li><b>Sense.</b> The station listens to the cable. If it is busy, the station waits until it is idle.</li>
<li><b>Transmit and detect.</b> The cable is idle, so the station sends and listens at the same time.</li>
<li><b>Jam.</b> If a collision is detected, the station stops and sends a <b>32-bit jam signal</b>.</li>
<li><b>Back off.</b> The station adds 1 to its collision counter k and waits r &times; slot time with the BEB rule, then returns to the first phase.</li>
<li><b>Abort.</b> After 16 collisions for the same frame the station drops the frame and reports an error.</li></ol>
<p>The flow chart shows the three possible paths. Select one and press Next step.</p>
<div class="vis"><div class="row">${seg("cdp",[["ok","Success"],["col","Collision and retry"],["ab","Abort after 16"]])}</div><svg id="cdf" role="img" aria-label="CSMA/CD flow chart"></svg><div id="cdfs"></div></div>
${SEC("5.3","Detecting a collision on the cable")}
<p>The animation shows the cable of Lesson 4 again. Station A starts at t = 0. Station B starts at t = 11, just before the signal of A reaches it. The signal takes 12 time units to cross the cable (T<sub>p</sub> = 12). Select the length of the frame of A.</p>
<div class="vis"><div class="row">${seg("cdg",[["l","Long frame (30 time units)"],["s","Short frame (10 time units)"]])}</div><svg id="w2" role="img" aria-label="Collision detection on a cable"></svg><div id="w2s"></div></div>
<p>Physically, the signals of the two senders add on the cable (Lesson 1, Section 1.1), so the cable carries a waveform that does not match the encoding. </p><p>On a coaxial cable a station detects a collision by <b>voltage level</b>: when two signals add on the cable, the voltage is higher than the voltage of one signal. On twisted pair the station detects activity on the receive pair while it sends on the transmit pair.</p>
${SEC("5.4","The minimum frame size")}
<p>The animation shows the rule. A station must still be sending when the collision signal comes back. In the worst case the other station starts just before the signal arrives. The collision signal then needs one more propagation delay to come back. The sender must therefore send for at least the <b>round-trip time 2T<sub>p</sub></b>.</p>
<div class="callout i"><b>T &ge; 2 T<sub>p</sub></b>, so the <b>minimum frame size = 2 &times; T<sub>p</sub> &times; bit rate</b>. (The course notes write T<sub>f</sub> for the frame time T.)</div>
<div class="vis"><div class="row"><span>Bit rate <select id="cb" aria-label="Bit rate"><option value="10">10 Mbps</option><option value="100">100 Mbps</option><option value="1000">1 Gbps</option></select></span><span>Cable length <input type="range" id="cd" min="100" max="5000" step="100" value="2500" aria-label="Cable length"> <b id="cdv">2500</b> m</span><span class="small muted">Signal speed 2 &times; 10<sup>8</sup> m/s</span></div><div id="cres"></div></div>
<p>Classic Ethernet (10 Mbps) uses a minimum frame of <b>64 bytes = 512 bits</b>. This takes 51.2 &micro;s at 10 Mbps, which is the slot time of Lesson 2. The value is larger than 2T<sub>p</sub> of the 2500 m maximum cable because it includes the delay of repeaters and a safety margin. A frame shorter than 64 bytes is padded.</p>
${SEC("5.5","The Ethernet frame")}
<p>CSMA/CD sends the Ethernet frame. Click a field.</p>
<div class="vis"><div id="cdhg"></div><div id="cdhn" class="callout i small"></div></div>
<p>The frame from the destination address to the FCS has 6 + 6 + 2 + (46 to 1500) + 4 = <b>64 to 1518 bytes</b>. With the preamble and the SFD (8 bytes) the frame on the cable has 72 to 1526 bytes. Lesson 11 describes the Ethernet variants.</p>
${SEC("5.6","Efficiency of CSMA/CD")}
<p>The efficiency is the part of the time that the channel carries successful frames. Let a = T<sub>p</sub> / T. A station that sends a frame can lose the channel to a collision for at most 2T<sub>p</sub>. On average about e = 2.718 contention intervals of 2T<sub>p</sub> are needed before a frame is sent successfully. So the time for one frame is T + 2eT<sub>p</sub>, and the efficiency is</p>
<div class="callout i"><b>Efficiency = T / (T + 2e T<sub>p</sub>) = 1 / (1 + 2ea) = 1 / (1 + 5.44a)</b></div>
<p>The course notes use the rounded form <b>1 / (1 + 5a)</b>. Some books use 6.44. The form depends on the model of the derivation. All forms say the same thing: the efficiency falls when a rises, that is, when the cable is long or the frame is short. State the formula that you use.</p>
<div class="vis"><div class="row"><span>a = Tp / T <input type="range" id="ea" min="0.005" max="1" step="0.005" value="0.1" aria-label="a"> <b id="eav">0.1</b></span></div><div id="eres"></div><div id="ech"></div></div>
${DOIT(["Set a = 0.1. The efficiency is 66.7% with 1 / (1 + 5a) and 64.8% with 1 / (1 + 5.44a).","Set a = 0.01 (a short cable and a long frame). The efficiency is about 95%.","Set a = 1. The efficiency falls to about 16%. A frame that lasts only as long as the signal crosses the cable gives CSMA/CD no benefit."])}
${SEC("5.7","Advantages and disadvantages")}
<table class="dt gt cmpt"><thead><tr><th>Advantages</th><th>Disadvantages</th></tr></thead><tbody>
<tr><td>Collisions are detected quickly, so little channel time is lost.</td><td>It works only when a is small. A long cable or a high bit rate needs a longer minimum frame.</td></tr>
<tr><td>Simple and cheap. It was the base of the success of Ethernet.</td><td>The delay is not bounded and the efficiency falls at heavy load.</td></tr>
<tr><td>Good efficiency at low and medium load.</td><td>It cannot be used on a wireless channel (Lesson 6).</td></tr>
<tr><td>Fair in the long run, because every station uses the same rule.</td><td>Not suitable for real-time traffic.</td></tr></tbody></table>
${quiz("r5q1","What does a CSMA/CD station do when it detects a collision?",["Continues the frame to the end","Stops, sends a jam signal and backs off with BEB","Sends a frame twice as long","Waits for an acknowledgement"],1,"The station stops the frame at once, sends the jam signal and waits r x slot time.")}
${quiz("r5q2","Why is a minimum frame size needed in CSMA/CD?",["To save memory","So that the sender is still sending when the collision signal returns, which needs at least 2Tp","To fill the preamble","To reduce the jam signal"],1,"The collision signal returns after at most 2Tp. If the frame is shorter, the sender cannot detect the collision.")}
${quiz("r5q3","After how many collisions for the same frame does a CSMA/CD station give up?",["8","10","16","32"],2,"After 16 attempts the frame is dropped and an error is reported. The exponent of BEB stops at 10.")}
${quiz("r5q4","The efficiency of CSMA/CD for a = 0.2 with 1/(1+5a) is:",["33%","50%","83%","20%"],1,"1 / (1 + 5 x 0.2) = 1 / 2 = 0.5.")}
${EXAM(["Explain CSMA/CD with a flow chart. What is the jam signal for?","A CSMA/CD network of 10 Mbps has a cable of 2 km. The signal speed is 2 &times; 10<sup>8</sup> m/s. Find the minimum frame size. (Answer: T<sub>p</sub> = 2000 / 2 &times; 10<sup>8</sup> = 10 &micro;s. 2T<sub>p</sub> = 20 &micro;s. Minimum frame = 20 &micro;s &times; 10 Mbps = 200 bits.)","Why must the frame time be at least 2T<sub>p</sub>? Explain with a short frame.","Find the efficiency of a CSMA/CD LAN with a = 0.1 by 1 / (1 + 5a). (Answer: 66.7%.)","Draw the Ethernet frame. State the size of each field and the minimum and maximum frame size."])}
${SUM(["CSMA/CD: sense, transmit and listen, jam on collision (32 bits), BEB, abort after 16.","The frame time must be at least 2Tp, so the minimum frame is 2 Tp x bit rate. Ethernet uses 64 bytes (512 bits).","Efficiency = 1 / (1 + 5a) in the course notes, or 1 / (1 + 5.44a) from the derivation, with a = Tp / T.","CSMA/CD is used by classic Ethernet. It cannot work on a wireless channel."])}

  let fst=null;
  const fshow=m=>{const P=CDP[m];fst=story(r,"#cdfs",{draw:i=>fsm($("#cdf",r),{W:760,H:500,states:CDS,edges:CDE},{cur:P[i].cur,hl:P[i].hl})});fst.set(P.map(x=>({cap:x.cap})))};
  bindSeg(r,"cdp",fshow);fshow('ok');
  const s2=$("#w2",r);let st2=null;
  const cd=short=>{const sg=[{x0:80,ts:0,te:short?10:27,cls:'a'},{x0:680,ts:11,te:16,cls:'b'}];
    const stp=short?[
     [0,`<b>A starts to send at t = 0.</b> The frame of A lasts only 10 time units, which is less than 2T<sub>p</sub> = 24.`,{A:'sends'}],
     [10,`<b>A has finished sending at t = 10.</b> A considers the frame sent. The signal of A is still on its way to B.`,{A:'frame sent'}],
     [11,`<b>B starts at t = 11.</b> The signal of A has not reached B (its front is at x = 630, B is at x = 680), so B finds the cable idle. B sends.`,{A:'frame sent',B:'sends'}],
     [12,`<b>The signals meet and B detects a collision at t = 12.</b> B stops and sends a jam signal.`,{A:'frame sent',B:'collision'}],
     [18,`<b>The garbled signal moves toward A.</b>`,{A:'frame sent',B:'jam'}],
     [23,`<b>The collision signal reaches A at t = 23, but A stopped sending at t = 10.</b> A is not sending, so A does not detect the collision. A believes that its frame was delivered, but the receiver got a damaged frame. The frame is lost. This is why the frame must be at least 2T<sub>p</sub> long.`,{A:'did not detect'}]]:[
