lesson({guide:true,nav:"Unit guide: start here",title:"Unit IV guide: what we are going to learn",syl:"Network Layer: Need, Services Provided, Design issues, Routing algorithms (Least Cost Routing, Dijkstra, Bellman-Ford, Hierarchical Routing, Multicast Routing), IP Addresses, Header format, Packet forwarding, Fragmentation and reassembly, ICMP, Comparative study of IPv4 & IPv6 (8 hours)",
html:()=>`
<div class="synbox"><b>Syllabus of this unit (8 lecture hours):</b><br>"Network Layer: Need, Services Provided, Design issues, Routing algorithms (Least Cost Routing, Dijkstra, Bellman-Ford, Hierarchical Routing, Multicast Routing), IP Addresses, Header format, Packet forwarding, Fragmentation and reassembly, ICMP, Comparative study of IPv4 &amp; IPv6."<br>The eight lessons follow this syllabus in the same order.</div>
${SEC("G.1","Scope of the unit")}
<p>The data link layer moves a frame over one link. A message from one computer to another usually crosses many links and many networks. The <b>network layer</b> is responsible for host-to-host delivery across all of them. It gives each host a logical address, chooses a path through the routers and forwards each packet along that path. This unit describes the services of the layer, the algorithms that find the paths, the Internet Protocol (IP) with its addresses and header, and the support protocol ICMP. It ends with IPv6.</p>
${SEC("G.2","Position of the unit in the OSI model")}
<p>The network layer is layer 3. It uses the data link layer (layer 2, Units II and III) to cross each link, and it provides a service to the transport layer (layer 4, Unit V). In the TCP/IP model it is the Internet layer.</p>
<div class="vis">${osiStack(3,"This unit covers layer 3, the network layer. The unit of data is the packet (datagram in IP).")}</div>
${SEC("G.3","Map of the unit")}
<table class="dt gt cmpt"><thead><tr><th>Lesson</th><th>Syllabus words</th><th>Question</th><th>After the lesson you can</th><th>Time</th></tr></thead><tbody>
<tr><td><b>1</b></td><td>Need, services, design issues</td><td>What does the network layer do, and how can it be offered?</td><td>Explain store-and-forward, datagram and virtual-circuit service</td><td>1 h</td></tr>
<tr><td><b>2</b></td><td>Least cost routing, Dijkstra</td><td>How is the best path found when the whole map is known?</td><td>Run Dijkstra on a graph and build the routing table</td><td>1 h 15 min</td></tr>
<tr><td><b>3</b></td><td>Bellman-Ford, distance vector</td><td>How do routers find paths with only neighbour information?</td><td>Run Bellman-Ford and explain count to infinity</td><td>1 h 30 min</td></tr>
<tr><td><b>4</b></td><td>Hierarchical and multicast routing</td><td>How is routing kept small in a large network, and how is one packet sent to a group?</td><td>Calculate table sizes and trace reverse path forwarding</td><td>1 h 15 min</td></tr>
<tr><td><b>5</b></td><td>IP addresses</td><td>How are hosts identified?</td><td>Use classes, CIDR and subnet masks</td><td>1 h 30 min</td></tr>
<tr><td><b>6</b></td><td>Header format, packet forwarding</td><td>What is in an IP datagram and how does a router forward it?</td><td>Compute the checksum and apply longest prefix match</td><td>1 h 30 min</td></tr>
<tr><td><b>7</b></td><td>Fragmentation, reassembly, ICMP</td><td>What if a datagram is larger than the link allows?</td><td>Calculate fragments; explain ping and traceroute</td><td>1 h 30 min</td></tr>
<tr><td><b>8</b></td><td>IPv4 and IPv6</td><td>Why a new version of IP?</td><td>Compare the two and write IPv6 addresses</td><td>1 h 15 min</td></tr></tbody></table>
<p>The total time is about 10 hours, including the practice questions. The syllabus allows 8 lecture hours.</p>
${SEC("G.4","Relation between the lessons")}
<div class="chain"><div><b>1. Services</b>Datagram or virtual circuit. Routing is needed.</div><div><b>2. Dijkstra</b>Full map known. Link state.</div><div><b>3. Bellman-Ford</b>Only neighbours known. Distance vector.</div><div><b>4. Hierarchy, multicast</b>Smaller tables. One packet to many.</div><div><b>5. IP address</b>Network part and host part.</div><div><b>6. Header, forwarding</b>Table lookup by longest prefix.</div><div><b>7. Fragmentation, ICMP</b>MTU and error reports.</div><div><b>8. IPv6</b>128-bit address, simpler header.</div></div>
${SEC("G.5","Terms used in this unit")}
<table class="dt cmpt"><thead><tr><th>Term</th><th>Meaning</th><th>Lesson</th></tr></thead><tbody>
<tr><td><b>Router</b></td><td>A device that connects networks and forwards packets between them</td><td>1</td></tr>
<tr><td><b>Routing</b></td><td>Finding the path (building the table). Done by an algorithm.</td><td>2 to 4</td></tr>
<tr><td><b>Forwarding</b></td><td>Moving one packet to the next hop by using the table</td><td>1, 6</td></tr>
<tr><td><b>Datagram</b></td><td>A packet that is routed independently of the others</td><td>1, 6</td></tr>
<tr><td><b>Virtual circuit</b></td><td>A path set up before data is sent. All packets follow it.</td><td>1</td></tr>
<tr><td><b>Link cost</b></td><td>A number given to a link (delay, distance, price)</td><td>2, 3</td></tr>
<tr><td><b>Routing table</b></td><td>A list of destinations with the next hop for each</td><td>2, 3, 6</td></tr>
<tr><td><b>Prefix, mask</b></td><td>The network part of an address, and the bit pattern that selects it</td><td>5, 6</td></tr>
<tr><td><b>TTL</b></td><td>Time to live: a hop count that is decreased at each router</td><td>6, 7</td></tr>
<tr><td><b>MTU</b></td><td>The largest packet that a link can carry</td><td>7</td></tr>
<tr><td><b>ICMP</b></td><td>The protocol used for error reports and queries at the IP level</td><td>7</td></tr></tbody></table>
${SEC("G.6","How to use the animations")}
<ul>
<li><b>Step players</b> (caption box with Back, Next step, Auto-play and Restart): press <b>Next step</b> and read the caption.</li>
<li><b>Network pictures</b>: circles are routers or hosts, lines are links, and the number on a line is its cost. A thick blue border marks the router that is being examined. The captions explain the other colours.</li>
<li><b>Calculators</b> (CIDR, subnet, checksum, fragments, IPv6): change a value and the result is recalculated. Check your own working against them.</li>
<li><b>Dark mode</b> and <b>Text size</b> are in the left panel.</li></ul>
${SEC("G.7","Relation to the practical list")}
<p>The practical experiments on IP addressing and subnetting, routing (static and dynamic), and the use of ping and traceroute use the ideas of this unit. Lesson 5 gives the address arithmetic, Lessons 2 and 3 give the algorithms behind the routing protocols, and Lesson 7 explains what ping and traceroute send.</p>
${SEC("G.8","Check before you start")}
${quiz("n0q1","Which device forwards packets between different networks?",["Hub","Repeater","Router","Bridge"],2,"A router works at the network layer and connects networks.")}
${quiz("n0q2","Which layer gives each host a logical address?",["Physical layer","Data link layer","Network layer","Session layer"],2,"The network layer uses logical (IP) addresses. The data link layer uses physical (MAC) addresses.")}
${SUM(["The unit has eight lessons in the syllabus order: services, Dijkstra, Bellman-Ford, hierarchical and multicast routing, IP addresses, header and forwarding, fragmentation and ICMP, IPv4 and IPv6.","The network layer is layer 3. It provides host-to-host delivery across many networks.","Routing builds the table; forwarding uses the table."])}
`});

/* ===== Unit IV Lesson 1: network layer need, services, design issues ===== */
const NL_ROUTE={r2:[['H1','R1'],['R1','R2'],['R2','R4'],['R4','H2']],r3:[['H1','R1'],['R1','R3'],['R3','R4'],['R4','H2']]};
lesson({nav:"1. Network layer: need, services, design issues",title:"Network layer: need, services provided and design issues",syl:"Network Layer: Need, Services Provided, Design issues",
html:()=>`
${GUIDE({"syl":"Network Layer: Need, Services Provided, Design issues","why":"A data link layer moves a frame over one link. A message that goes from one computer to another usually crosses many links and many networks. The network layer is responsible for this journey. This lesson explains what the layer does, which services it offers to the transport layer, and the problems that its designers must solve.","map":[["1.1","The need for a network layer","Why is the data link layer not enough?","Compare delivery over one link and over many links."],["1.2","Store-and-forward packet switching","How does a packet cross a network?","Step through a packet that is stored and forwarded."],["1.3","Services provided to the transport layer","What does the network layer promise?","Read the goals and the two kinds of service."],["1.4","Datagram and virtual-circuit networks","Does every packet take the same path?","Run both animations and compare."],["1.5","Design issues","What must the layer decide?","Read the design issues and the difference between routing and forwarding."]],"osi":"Layer 3 (network layer). It uses the data link layer below it and gives service to the transport layer (layer 4) above it.","pre":"Unit II (frames, ARP) and Unit III (MAC addresses and LANs).","time":"about 1 hour 15 minutes","next":"Lesson 2, least cost routing and Dijkstra's algorithm."})}
${LEARN(["explain why a network layer is needed and name its data unit and device","describe store-and-forward packet switching","compare connectionless (datagram) and connection-oriented (virtual circuit) service","state the design issues of the network layer and the difference between routing and forwarding"])}
${SEC("1.1","The need for a network layer")}
<p>The data link layer delivers a frame between two nodes that share one link or one LAN. Its addresses (MAC addresses) work only on that link. A message from a computer in Bhopal to a server in another country passes through many links and many networks. No single link layer covers this whole path.</p>
${DEF("Network layer","is layer 3 of the OSI model. It is responsible for delivering a <b>packet</b> from the source host to the destination host, across any number of networks. It uses a logical address (the IP address) that is valid in the whole internetwork.")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Data link layer (layer 2)</th><th>Network layer (layer 3)</th></tr></thead><tbody>
<tr><td>Delivers</td><td>Frames from node to node on one link</td><td>Packets from source host to destination host</td></tr>
<tr><td>Address</td><td>MAC address (valid on the link)</td><td>IP address (valid on the whole internetwork)</td></tr>
<tr><td>Device</td><td>Switch, bridge</td><td><b>Router</b></td></tr>
<tr><td>Path</td><td>One hop</td><td>Many hops, chosen by routing</td></tr></tbody></table>
<div class="vis">${osiStack(3,"Layer 3 is the subject of this unit. Each router has layers 1 to 3.")}</div>
${SEC("1.2","Store-and-forward packet switching")}
<p>An internetwork has hosts and <b>routers</b>. A router connects two or more networks. Routers use <b>store-and-forward packet switching</b>: a host sends a packet to the nearest router. The router <b>stores</b> the whole packet, checks it (for example, it checks the checksum), and <b>forwards</b> it to the next router. This is repeated until the packet reaches the destination host.</p>
<div class="vis"><svg id="sf" role="img" aria-label="A packet crossing routers"></svg><div id="sfs"></div></div>
${SEC("1.3","Services provided to the transport layer")}
<p>The network layer gives its service to the transport layer. The designers set three goals (Tanenbaum).</p>
<ol><li>The service must be <b>independent of the router technology</b>.</li>
<li>The transport layer must be <b>shielded</b> from the number, type and topology of the routers.</li>
<li>The network addresses that the transport layer sees must use a <b>uniform numbering plan</b>, even across LANs and WANs.</li></ol>
<p>There are two kinds of service.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>Connectionless service (datagram)</th><th>Connection-oriented service (virtual circuit)</th></tr></thead><tbody>
<tr><td>Set-up before data</td><td>None. Each packet is sent alone.</td><td>A path is set up first and released at the end.</td></tr>
<tr><td>Addressing in each packet</td><td>Full destination address</td><td>Only a short virtual-circuit number</td></tr>
<tr><td>Path of the packets</td><td>Each packet is routed independently, so paths can differ</td><td>All packets follow the same path</td></tr>
<tr><td>Order of delivery</td><td>Not guaranteed</td><td>Packets arrive in order</td></tr>
<tr><td>State in routers</td><td>None for each connection (only the routing table)</td><td>One table entry for each open circuit</td></tr>
<tr><td>Router failure</td><td>Packets use another route</td><td>All circuits through the router are lost</td></tr>
<tr><td>Used by</td><td>The Internet (IP)</td><td>X.25, Frame Relay, ATM, MPLS</td></tr></tbody></table>
<p>The Internet uses the connectionless service. The Internet community argued that the network should be simple and may lose packets, and that the hosts (the transport layer, for example TCP) should add reliability. The telephone companies argued for the connection-oriented service, where the network itself gives a reliable service.</p>
${SEC("1.4","Datagram and virtual-circuit networks")}
<p>The network below has two hosts H1 and H2 and four routers. There are two paths from R1 to R4, one through R2 and one through R3. Select the kind of network and step through.</p>
<div class="vis"><div class="row">${seg("nlg",[["d","Datagram network"],["v","Virtual-circuit network"]])}</div><svg id="dv" role="img" aria-label="Datagram and virtual circuit"></svg><div id="dvs"></div></div>
${SEC("1.5","Design issues")}
<table class="dt gt cmpt"><thead><tr><th>Issue</th><th>Question</th><th>Solution and where it is described</th></tr></thead><tbody>
<tr><td><b>Addressing</b></td><td>How is each host identified in the whole network?</td><td>IP addresses (Lesson 5)</td></tr>
<tr><td><b>Routing</b></td><td>Which path should a packet take?</td><td>Routing algorithms (Lessons 2 to 4)</td></tr>
<tr><td><b>Forwarding</b></td><td>How does a router send each arriving packet on its way?</td><td>Table look-up (Lesson 6)</td></tr>
<tr><td><b>Packet size</b></td><td>Networks accept packets of different maximum sizes</td><td>Fragmentation and reassembly (Lesson 7)</td></tr>
<tr><td><b>Error reporting</b></td><td>How does the network tell a host that a packet failed?</td><td>ICMP (Lesson 7)</td></tr>
<tr><td><b>Congestion</b></td><td>What if too many packets arrive at a router?</td><td>Congestion control (Unit V for TCP)</td></tr>
<tr><td><b>Quality of service</b></td><td>Can some traffic get priority or a bounded delay?</td><td>Traffic classes in the IP header (Lesson 6)</td></tr>
<tr><td><b>Address space</b></td><td>What if 32-bit addresses run out?</td><td>IPv6 (Lesson 8)</td></tr></tbody></table>
${DEF("Routing and forwarding","are two different tasks. <b>Routing</b> is the process that builds the routing table (it chooses the best path and runs in the background). <b>Forwarding</b> is what a router does for each packet: it looks up the destination in the table and sends the packet to the next hop.")}
<p>A routing table holds, for each destination network, the <b>next hop</b> and the outgoing interface. Example for router R1 of the network in 1.4:</p>
<table class="dt cmpt"><thead><tr><th>Destination</th><th>Next hop</th><th>Interface</th></tr></thead><tbody><tr><td>H1 network</td><td>direct</td><td>eth0</td></tr><tr><td>H2 network</td><td>R2</td><td>eth1</td></tr><tr><td>R4</td><td>R2</td><td>eth1</td></tr></tbody></table>
<p>Routing algorithms are <b>static</b> (non-adaptive: the routes are set by the administrator and do not change with traffic) or <b>dynamic</b> (adaptive: the routes change when the topology or the traffic changes). Dynamic routing is used in the Internet.</p>
${quiz("n1q1","Which device works at the network layer?",["Hub","Switch","Router","Repeater"],2,"A router forwards packets using IP addresses. A switch works at layer 2.")}
${quiz("n1q2","In a datagram network what does each packet contain?",["Only a virtual-circuit number","The full destination address","No address","Only the MAC address of the destination"],1,"Each packet is routed alone, so it must carry the full destination address.")}
${quiz("n1q3","What is the difference between routing and forwarding?",["None","Routing builds the table; forwarding uses the table for each packet","Forwarding builds the table; routing uses it","Routing is at layer 2"],1,"Routing algorithms fill the routing table. Forwarding is the table look-up for each packet.")}
${EXAM(["Explain the need for a network layer. How is it different from the data link layer?","Explain store-and-forward packet switching.","Compare datagram and virtual-circuit service in a table.","List the design issues of the network layer.","Differentiate between routing and forwarding. What is a routing table?"])}
${SUM(["The network layer delivers packets from the source host to the destination host over many links. The device is the router.","Routers store each packet and forward it to the next hop.","Datagram (connectionless) service routes each packet independently. A virtual circuit sets up one path first.","The main design issues are addressing, routing, forwarding, packet size, congestion and quality of service. Routing builds the table. Forwarding uses it."])}
`,
mount(r){
  /* store-and-forward */
  const sv=$("#sf",r),sp={A:'H1',B:'R1',C:'R2'};
  const stp=[
   {cap:`<b>Network.</b> Host H1 sends a packet to host H2. The packet must cross the routers R1, R2 and R4.`,st:{pkt:{at:'H1',t:'pkt'},tag:{}}},
   {cap:`<b>The packet reaches R1.</b> R1 receives all the bits of the packet and <b>stores</b> it in memory. It does not forward a packet before it has received the whole packet.`,st:{pkt:{at:'R1',t:'pkt'},done:['R1'],hl:[['H1','R1']],tag:{R1:'stores packet'}}},
   {cap:`<b>R1 checks the packet and looks up the destination in its routing table.</b> The table says that the next hop for H2 is R2. R1 <b>forwards</b> the packet over the link R1 to R2.`,st:{pkt:{at:'R1',t:'pkt'},done:['R1'],hl:[['R1','R2']],tag:{R1:'next hop: R2'}}},
   {cap:`<b>R2 stores the packet</b> and forwards it to R4 in the same way. Each router does the same steps. The time on each link adds to the total delay of the packet.`,st:{pkt:{at:'R2',t:'pkt'},done:['R1','R2'],hl:[['R2','R4']],tag:{R2:'next hop: R4'}}},
   {cap:`<b>R4 is connected to the network of H2.</b> R4 delivers the packet to H2 in a frame of that network. The packet has crossed three routers.`,st:{pkt:{at:'H2',t:'pkt'},done:['R1','R2','R4','H2'],hl:[['R4','H2']],tag:{}}}];
  const sst=story(r,"#sfs",{draw:i=>gpic(sv,GNET,{...stp[i].st,noW:true})});sst.set(stp.map(s=>({cap:s.cap})));
  /* datagram vs virtual circuit */
  const dv=$("#dv",r);let ds=null;
  const mk=k=>{const p2=NL_ROUTE.r2,p3=NL_ROUTE.r3;
    const D=[
     {cap:`<b>Datagram network.</b> H1 has three packets for H2: P1, P2 and P3. Each packet has the full destination address of H2. No path is set up in advance.`,st:{}},
     {cap:`<b>P1.</b> R1 looks up H2 in its table. The best next hop is R2. P1 goes through R2 and R4.`,st:{hl:p2,pkt:{at:'R2',t:'P1'}}},
     {cap:`<b>P2.</b> A little later the table of R1 has changed (the route through R2 is now busy). R1 sends P2 through R3. Routers treat each packet separately. They keep no record of the earlier packet.`,st:{hl:p3,pkt:{at:'R3',t:'P2'}}},
     {cap:`<b>P3.</b> The table changes back. P3 goes through R2. The packets can arrive in a different order, for example P2 before P1. Putting them in order is the task of the transport layer.`,st:{hl:p2,pkt:{at:'R2',t:'P3'}}},
     {cap:`<b>If R2 fails</b>, the routers find another route (through R3) and the following packets use it. Packets are lost only if they were in R2 at that time. This is the advantage of the datagram network.`,st:{fail:['R2'],hl:p3,pkt:{at:'R3',t:'P4'}}}];
    const V=[
     {cap:`<b>Virtual-circuit network.</b> Before data is sent, H1 asks for a connection to H2. No data is sent yet.`,st:{}},
     {cap:`<b>Set-up.</b> A set-up packet goes through R1, R2 and R4 to H2. Each router chooses a <b>virtual-circuit (VC) number</b> and stores an entry in its table: for example, R1 stores "in VC 5 from H1, out VC 2 to R2".`,st:{hl:p2,pkt:{at:'R2',t:'setup'},tag:{R1:'VC5 to VC2 (R2)',R2:'VC2 to VC7 (R4)',R4:'VC7 to H2'}}},
     {cap:`<b>Data.</b> H2 accepts the call. Now every data packet carries only the short VC number. Each router reads the number, finds the entry, replaces the number and forwards the packet. <b>All packets follow the same path</b>, so they arrive in order.`,st:{hl:p2,pkt:{at:'R4',t:'VC 5'},tag:{R1:'VC5 to VC2 (R2)',R2:'VC2 to VC7 (R4)',R4:'VC7 to H2'}}},
     {cap:`<b>If R2 fails</b>, every circuit that passes through R2 is lost. The hosts must set up a new circuit through R3. This is the disadvantage of the virtual circuit.`,st:{fail:['R2'],bad:[['R1','R2'],['R2','R4']],tag:{R2:'down'}}},
     {cap:`<b>Release.</b> When the data transfer is finished, a release packet frees the table entries in all routers. The cost of a virtual circuit is the state that routers hold and the delay of set-up. The benefit is a short header and the order of packets.`,st:{hl:p3,tag:{}}}];
    const S=k==='d'?D:V;ds=story(r,"#dvs",{draw:i=>gpic(dv,GNET,{...S[i].st,noW:true})});ds.set(S.map(s=>({cap:s.cap})))};
  bindSeg(r,"nlg",mk);mk('d');
}});

/* ===== Unit IV Lesson 2: least cost routing and Dijkstra ===== */
function dijk(src){
  const N=Object.keys(G6.nodes),adj={};N.forEach(n=>adj[n]=[]);G6.edges.forEach(([u,v,w])=>{adj[u].push([v,w]);adj[v].push([u,w])});
  const dist={},prev={},done=[],steps=[];N.forEach(n=>dist[n]=Infinity);dist[src]=0;
  const snap=(cap,cur,hl)=>steps.push({cap,dist:{...dist},prev:{...prev},done:[...done],cur,hl:hl||[]});
  snap(`<b>Start.</b> The source is <b>${src}</b>. Set the distance of ${src} to 0 and the distance of every other node to infinity (no path known yet). No node is final yet.`,null);
  while(done.length<N.length){
    let u=null;N.forEach(n=>{if(!done.includes(n)&&dist[n]<Infinity&&(u===null||dist[n]<dist[u]))u=n});if(u===null)break;
    done.push(u);const ups=[];
    adj[u].forEach(([v,w])=>{if(done.includes(v))return;const alt=dist[u]+w;if(alt<dist[v]){ups.push(`${v}: ${dist[v]===Infinity?'infinity':dist[v]} becomes ${dist[u]} + ${w} = <b>${alt}</b>`);dist[v]=alt;prev[v]=u}else ups.push(`${v}: ${dist[u]} + ${w} = ${alt}, not better than ${dist[v]}, so no change`)});
    snap(`<b>Choose ${u}.</b> Among the nodes that are not final, ${u} has the smallest distance (<b>${dist[u]}</b>). Its distance is now final.${ups.length?` Check each neighbour that is not final: ${ups.join('; ')}.`:' It has no neighbour that is not final.'}`,u,adj[u].map(x=>[u,x[0]]));
  }
  snap(`<b>Finished.</b> All nodes are final. The green edges form the <b>shortest-path tree</b> of ${src}. The table gives the least cost to each node. The previous node of each node gives the path.`,null);
  return steps}
function pathTo(prev,src,t){const p=[t];while(t!==src&&prev[t]){t=prev[t];p.unshift(t)}return p}
lesson({nav:"2. Least cost routing and Dijkstra's algorithm",title:"Routing: least cost routing and Dijkstra's algorithm",syl:"Routing algorithms: Least Cost Routing algorithm, Dijkstra's algorithm",
html:()=>`
${GUIDE({"syl":"Routing algorithms: Least Cost Routing algorithm, Dijkstra's algorithm","why":"A router must decide which neighbour should get each packet. To decide, it needs the best path to every destination. This lesson defines the best path as the least cost path and shows how Dijkstra's algorithm finds it. Link-state routing (OSPF) is built on this algorithm.","map":[["2.1","The routing problem","What is a routing algorithm?","Read the definition and the properties of a good algorithm."],["2.2","Least cost routing","How is the best path defined?","Model a network as a graph with costs."],["2.3","Dijkstra's algorithm","How is the least cost path found?","Step through the algorithm for any source node."],["2.4","From the result to a routing table","How does the router use the result?","Read the routing table that the algorithm gives."],["2.5","Where it is used","Which protocol uses it?","Read the link-state routing summary."]],"osi":"Layer 3 (network layer): the routing function.","pre":"Lesson 1 (routing and forwarding).","time":"about 1 hour 15 minutes","next":"Lesson 3, Bellman-Ford and distance vector routing."})}
${LEARN(["define least cost routing and model a network as a weighted graph","apply Dijkstra's algorithm and write the distance table","derive the routing table and the shortest-path tree for a router","explain the idea of link-state routing"])}
${SEC("2.1","The routing problem")}
${DEF("Routing algorithm","is the part of the network layer that decides which outgoing line a packet should use. For a datagram network it decides for each packet. For a virtual-circuit network it decides when the circuit is set up.")}
<p>A good routing algorithm is correct, simple, <b>robust</b> (it survives router and line failures), <b>stable</b> (it reaches a steady state), <b>fair</b> and <b>efficient</b>.</p>
<p>The <b>optimality principle</b> says: if router J is on the best path from router I to router K, then the best path from J to K is the same as the part of that path after J. The best paths from all routers to one destination therefore form a tree, the <b>sink tree</b>, which has no loops. Routing algorithms find these trees.</p>
${SEC("2.2","Least cost routing")}
<p>The network is a <b>graph</b>. Each router is a <b>node</b>. Each link is an <b>edge</b> with a number called the <b>cost</b>. The cost can be one unit for each hop, the distance, the delay, the inverse of the bandwidth, or a mixture. The cost of a path is the sum of the costs of its edges.</p>
${DEF("Least cost routing","is routing in which every packet uses the path with the smallest total cost between the source and the destination.")}
<p>In the network below the numbers on the edges are the costs. Path A-B-C-D costs 7 + 10 + 11 = 28. Path A-C-D costs 9 + 11 = 20. So A-C-D is better than A-B-C-D. To find the best path for all pairs we need an algorithm.</p>
${SEC("2.3","Dijkstra's algorithm")}
<p>Dijkstra's algorithm finds the least cost path from <b>one source node</b> to all other nodes. It needs the cost of every link, so it is used when each router knows the whole network (link-state routing). The steps are:</p>
<ol><li><b>Initialise.</b> distance(source) = 0. distance(every other node) = infinity. All nodes are not final.</li>
<li>Choose the node <b>u</b> that is not final and has the smallest distance. Mark u as final.</li>
<li>For every neighbour <b>v</b> of u that is not final: if distance(u) + cost(u, v) is less than distance(v), set distance(v) to this value and set previous(v) = u. (This step is called <b>relaxation</b>.)</li>
<li>Repeat from step 2 until all nodes are final.</li></ol>
<div class="vis"><div class="row"><span>Source node <select id="ds" aria-label="Source node">${'ABCDEF'.split('').map(c=>`<option>${c}</option>`).join('')}</select></span></div><svg id="dj" role="img" aria-label="Dijkstra on a graph"></svg><div id="djs"></div><div id="djt"></div></div>
<p class="small muted">Thick blue border: the node that was chosen in this step. Green circle: final node. Green edge: edge of the shortest-path tree. Orange edge: edges that are checked in this step.</p>
${DOIT(["With source A, watch node D. It first gets distance 22 through B (7 + 15). Later C becomes final and D improves to 20 through C (9 + 11).","Look at the step in which C becomes final. F first gets 14 (direct from A) and then <b>improves to 11</b> through C (9 + 2). This is the relaxation step.","Change the source to E and run the algorithm again. Write the shortest-path tree of E."])}
${SEC("2.4","From the result to a routing table")}
<p>The <b>previous</b> column gives the path to each node. The router needs only the <b>first hop</b> of the path: the neighbour to which it sends the packet. The table below is built from the last step for the source node that you selected above.</p>
<div id="rt"></div>
${SEC("2.5","Where Dijkstra's algorithm is used")}
<p><b>Link-state routing</b> works in this way. (1) Each router finds its neighbours and the cost of the links. (2) It builds a <b>link-state packet</b> and (3) <b>floods</b> it to all routers. (4) Each router now has the complete map and runs Dijkstra's algorithm with itself as the source. The result is its routing table. OSPF (Open Shortest Path First), the interior routing protocol of large networks, and IS-IS use this method.</p>
<p><b>Cost of the algorithm.</b> For N nodes the simple version takes about N<sup>2</sup> steps. With a priority queue it takes about E log N steps for E edges. Dijkstra's algorithm does not work if any cost is negative.</p>
${quiz("n2q1","In Dijkstra's algorithm, which node is made final in each step?",["The node with the largest distance","The node that is not final and has the smallest distance","The node with most neighbours","Any neighbour of the source"],1,"The node with the smallest distance cannot be improved by any other path, because all costs are positive.")}
${quiz("n2q2","Dijkstra's algorithm gives the least cost path from",["every node to every node","one source node to all other nodes","one source to one destination only","all nodes to one destination only"],1,"One run gives the shortest path tree of one source. Each router runs it for itself.")}
${quiz("n2q3","Which routing method uses Dijkstra's algorithm?",["Distance vector","Link-state","Static routing","Flooding"],1,"Link-state routing (OSPF, IS-IS) gives each router the whole map and it runs Dijkstra's algorithm.")}
${EXAM(["Define least cost routing. What can the cost of a link be?","Write the steps of Dijkstra's algorithm.","For the network of 2.3 find the least cost path from A to every other node. (Answer: B 7, C 9, F 11, D 20, E 20.)","Why does Dijkstra's algorithm fail for negative costs?","Explain how a router builds its routing table in link-state routing."])}
${SUM(["A network is a graph. Routers are nodes and links are edges with costs.","Dijkstra's algorithm: choose the non-final node with the smallest distance, make it final, and relax its neighbours.","The previous-node column gives the path. The first hop goes to the routing table.","Link-state routing floods link-state packets and runs Dijkstra's algorithm in every router."])}
`,
mount(r){
  const svg=$("#dj",r);let st=null,steps=null;
  const run=()=>{const src=$("#ds",r).value;steps=dijk(src);
    const N=Object.keys(G6.nodes);
    const draw=i=>{const s=steps[i],tree=Object.keys(s.prev).filter(n=>s.done.includes(n)).map(n=>[n,s.prev[n]]);
      const tag={};N.forEach(n=>tag[n]=s.dist[n]===Infinity?'∞':s.dist[n]);
      gpic(svg,G6,{done:s.done,cur:s.cur,tree,hl:s.hl,tag});
      $("#djt",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Node</th>${N.map(n=>`<th>${n}</th>`).join('')}</tr></thead><tbody><tr><td><b>Distance</b></td>${N.map(n=>`<td>${s.dist[n]===Infinity?'∞':s.dist[n]}</td>`).join('')}</tr><tr><td><b>Previous</b></td>${N.map(n=>`<td>${s.prev[n]||'-'}</td>`).join('')}</tr><tr><td><b>Final?</b></td>${N.map(n=>`<td>${s.done.includes(n)?'yes':'no'}</td>`).join('')}</tr></tbody></table>`;
      if(i===steps.length-1){const rows=N.filter(n=>n!==src).map(n=>{const p=pathTo(s.prev,src,n);return `<tr><td>${n}</td><td>${s.dist[n]}</td><td>${p.join(' - ')}</td><td><b>${p[1]}</b></td></tr>`}).join('');
        $("#rt",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Destination</th><th>Least cost</th><th>Path</th><th>Next hop (routing table)</th></tr></thead><tbody>${rows}</tbody></table>`}else $("#rt",r).innerHTML='<div class="callout i small">Step through to the last step of the animation to see the routing table of the selected source.</div>'};
    st=story(r,"#djs",{draw});st.set(steps.map(s=>({cap:s.cap})))};
  $("#ds",r).onchange=run;run();
}});

/* ===== Unit IV Lesson 3: Bellman-Ford and distance vector routing ===== */
const GN=Object.keys(G6.nodes),INF=1e9,fmtd=d=>d>=INF?'∞':d;
function bfRounds(src){
  let d={};GN.forEach(n=>d[n]=INF);d[src]=0;let pv={};const out=[{k:0,d:{...d},pv:{},ch:[],cap:`<b>Start.</b> The distance of ${src} is 0. All other distances are infinity. After round k the algorithm knows the best path that uses at most k links.`}];
  for(let k=1;k<GN.length;k++){const nd={...d},np={...pv},ch=[];
    G6.edges.forEach(([u,v,w])=>{[[u,v],[v,u]].forEach(([a,b])=>{if(d[a]<INF&&d[a]+w<nd[b]){nd[b]=d[a]+w;np[b]=a}})});
    GN.forEach(n=>{if(nd[n]!==d[n])ch.push(`${n} = ${fmtd(d[n])} becomes <b>${nd[n]}</b> (through ${np[n]})`)});
    d=nd;pv=np;
    out.push({k,d:{...d},pv:{...pv},ch,cap:`<b>Round ${k}.</b> Every edge is relaxed in both directions: for the edge u-v with cost w, if d(u) + w is less than d(v), then d(v) is set to d(u) + w. The values of the last round are used. ${ch.length?'Changes: '+ch.join('; ')+'.':'<b>Nothing changed.</b> The distances are final, and the algorithm can stop.'}`});
    if(!ch.length)break}
  return out}
function dvRounds(){
  const cost={};GN.forEach(a=>{cost[a]={};});G6.edges.forEach(([u,v,w])=>{cost[u][v]=w;cost[v][u]=w});
  let T={};GN.forEach(x=>{T[x]={};GN.forEach(y=>{T[x][y]=x===y?{d:0,nh:'-'}:cost[x][y]!=null?{d:cost[x][y],nh:y}:{d:INF,nh:'-'}})});
  const out=[{k:0,T:JSON.parse(JSON.stringify(T)),ch:{},cap:`<b>Round 0.</b> Each router knows only the cost of the links to its own neighbours. Distances to routers that are not neighbours are infinity.`}];
  for(let k=1;k<=8;k++){const N2={},ch={};GN.forEach(x=>{N2[x]={};GN.forEach(y=>{let b=T[x][y];Object.keys(cost[x]).forEach(v=>{const c=cost[x][v]+T[v][y].d;if(x!==y&&c<b.d)b={d:c,nh:v}});N2[x][y]=b;if(b.d!==T[x][y].d)(ch[x]=ch[x]||[]).push(y)})});
    const any=Object.keys(ch).length;T=N2;out.push({k,T:JSON.parse(JSON.stringify(T)),ch,cap:`<b>Round ${k}.</b> Each router sends its vector (its distance to every destination) to its neighbours. Each router then computes for every destination: <b>D(x, y) = minimum over neighbours v of [ cost(x, v) + D(v, y) ]</b>. ${any?'The cells that changed are marked in orange.':'<b>Nothing changed. The tables are stable.</b>'}`});if(!any)break}
  return out}
function c2i(mode){
  const rows=[],INFV=16;let a=2,b=INFV;// after C fails: A believes 2 (via B), B has lost the direct route
  if(mode==='plain'){let A=2,B=INFV,t=0;rows.push({cap:`<b>Before the failure.</b> The line A - B - C has cost 1 on each link. B reaches C directly (cost 1). A reaches C through B (cost 2).`,A:2,B:1});
    rows.push({cap:`<b>The link B to C fails.</b> B sees that C cannot be reached directly, so B sets its cost to C to infinity (16 in RIP). A still has the old route to C with cost 2 through B.`,A:2,B:INFV});
    let turn='B';for(let i=0;i<16&&!(A>=INFV&&B>=INFV);i++){if(turn==='B'){B=Math.min(INFV,A+1);rows.push({cap:`<b>A sends its vector to B.</b> A says that it can reach C with cost ${A}. B does not know that this route goes through B itself. B sets its cost to <b>${A} + 1 = ${B}</b> through A.`,A,B});turn='A'}else{A=Math.min(INFV,B+1);rows.push({cap:`<b>B sends its vector to A.</b> B says that it can reach C with cost ${B}. A sets its cost to <b>${B} + 1 = ${A}</b> through B.`,A,B});turn='B'}}
    rows.push({cap:`<b>The cost reaches 16, which RIP treats as infinity.</b> This took many update rounds. During this time packets for C go back and forth between A and B (a routing loop), and the bad news spreads very slowly. This problem is called <b>count to infinity</b>.`,A,B})}
  else{rows.push({cap:`<b>Before the failure.</b> The line A - B - C has cost 1 on each link. B reaches C directly. A reaches C through B (cost 2).`,A:2,B:1});
    rows.push({cap:`<b>The link B to C fails.</b> B sets its cost to C to infinity. With <b>split horizon</b>, A does not advertise to B the routes that A learned from B. So A does not tell B that it can reach C.`,A:2,B:INFV});
    rows.push({cap:`<b>B sends its vector to A.</b> B says that C is unreachable (cost infinity). A had its route to C through B, so A accepts the news and sets its cost to <b>infinity</b>. There is no loop and the network is stable after one update.`,A:INFV,B:INFV});
    rows.push({cap:`<b>Poison reverse</b> is the stronger form: A tells B explicitly "my cost to C is infinity", because A's route goes through B. Split horizon fails when three or more routers form a loop. Then other methods are used: triggered updates, hold-down timers and a small value for infinity.`,A:INFV,B:INFV})}
  return rows}
lesson({nav:"3. Bellman-Ford and distance vector routing",title:"Routing: Bellman-Ford algorithm and distance vector routing",syl:"Routing algorithms: Bellman-Ford algorithm",
html:()=>`
${GUIDE({"syl":"Routing algorithms: Bellman-Ford algorithm","why":"Dijkstra's algorithm needs the map of the whole network. Bellman-Ford needs only the information that a router gets from its neighbours. This is the basis of distance vector routing (RIP). The lesson also shows its main weakness, count to infinity.","map":[["3.1","The Bellman-Ford idea","How can a router find the best path with only local information?","Learn the equation."],["3.2","The Bellman-Ford algorithm","How are the distances improved round by round?","Step through the rounds for any source."],["3.3","Distance vector routing","How do routers exchange vectors?","Watch the routing tables of any router change."],["3.4","Count to infinity","What happens when a link fails?","Step through the problem and the split horizon fix."],["3.5","Distance vector and link state","Which one is better?","Compare the two methods."]],"osi":"Layer 3 (network layer): the routing function.","pre":"Lesson 2 (graph, cost, Dijkstra).","time":"about 1 hour 30 minutes","next":"Lesson 4, hierarchical and multicast routing."})}
${LEARN(["state the Bellman-Ford equation and apply it","run the Bellman-Ford algorithm round by round","explain how distance vector routing builds tables by exchanging vectors","explain count to infinity and split horizon","compare distance vector and link-state routing"])}
${SEC("3.1","The Bellman-Ford idea")}
<p>A router does not need the whole map. It needs only two things: the cost of the link to each of its neighbours, and the distance to every destination as reported by each neighbour. The best path through a neighbour v costs cost(x, v) + (the distance from v to the destination). The best of all neighbours gives the distance of x:</p>
<div class="callout i"><b>D(x, y) = minimum over all neighbours v of x of [ c(x, v) + D(v, y) ]</b><br>D(x, y) is the least cost from x to y. c(x, v) is the cost of the link from x to its neighbour v.</div>
<p>Example. Router X has two neighbours: Y at cost 2 and Z at cost 7. Y says that it can reach W with cost 1, and Z says that it can reach W with cost 1. Through Y the cost is 2 + 1 = 3. Through Z the cost is 7 + 1 = 8. So D(X, W) = 3 through Y.</p>
${SEC("3.2","The Bellman-Ford algorithm")}
<p>The algorithm finds the least cost from one source node to all the others. It repeats a simple <b>relaxation</b> for every edge. If a network has N nodes, the best path has at most N - 1 links, so N - 1 rounds are enough.</p>
<ol><li>distance(source) = 0. distance(others) = infinity.</li>
<li>Repeat N - 1 times (a round): for every edge u-v with cost w, if distance(u) + w &lt; distance(v) then distance(v) = distance(u) + w.</li>
<li>Stop when a round changes nothing.</li></ol>
<p>After round k the distances are the best that use at most k links. Bellman-Ford is slower than Dijkstra but works also when some costs are negative, and it works with only local information.</p>
<div class="vis"><div class="row"><span>Source node <select id="bs" aria-label="Source node">${'ABCDEF'.split('').map(c=>`<option>${c}</option>`).join('')}</select></span></div><svg id="bf" role="img" aria-label="Bellman-Ford rounds"></svg><div id="bfs"></div><div id="bft"></div></div>
${SEC("3.3","Distance vector routing")}
${DEF("Distance vector routing","is a dynamic routing method in which each router keeps a table (a vector) with the best known distance to every destination and the next hop. Every router sends this vector to its neighbours at regular intervals and updates its own table with the Bellman-Ford equation.")}
<p>Each router knows only its neighbours and the vectors that they send. No router knows the whole network. In the animation, the same network is used. Select a router and step through the rounds. The table shows the cost and the next hop to each destination.</p>
<div class="vis"><div class="row"><span>Show the table of router <select id="vr" aria-label="Router">${'ABCDEF'.split('').map(c=>`<option>${c}</option>`).join('')}</select></span></div><svg id="dvg" role="img" aria-label="Distance vector network"></svg><div id="dvs"></div><div id="dvt"></div></div>
<p><b>RIP</b> (Routing Information Protocol) is the best-known distance vector protocol. Its cost is the <b>hop count</b>. The largest usable distance is 15 (16 is infinity). Routers send their full table every 30 seconds.</p>
${SEC("3.4","Count to infinity")}
<p>Distance vector routing spreads <b>good news</b> fast: a new, shorter route is found after a few rounds. It spreads <b>bad news</b> slowly. The animation shows three routers in a line, A - B - C. The link between B and C fails. Select the method.</p>
<div class="vis"><div class="row">${seg("cig",[["plain","Without split horizon"],["sh","With split horizon"]])}</div><div id="cit"></div><div id="cis"></div></div>
${SEC("3.5","Distance vector and link state")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Distance vector (Bellman-Ford)</th><th>Link state (Dijkstra)</th></tr></thead><tbody>
<tr><td>What a router knows</td><td>Its neighbours and their vectors</td><td>The whole network map</td></tr>
<tr><td>What it sends</td><td>Its whole table, to the neighbours only</td><td>The state of its own links, to all routers (flooding)</td></tr>
<tr><td>Algorithm</td><td>Bellman-Ford</td><td>Dijkstra</td></tr>
<tr><td>Convergence</td><td>Slow (count to infinity)</td><td>Fast</td></tr>
<tr><td>Memory and processing</td><td>Small</td><td>Larger</td></tr>
<tr><td>Size of the network</td><td>Small networks</td><td>Large networks</td></tr>
<tr><td>Protocols</td><td>RIP</td><td>OSPF, IS-IS</td></tr></tbody></table>
${quiz("n3q1","Router X has neighbour Y at cost 2 and neighbour Z at cost 7. Y reports a distance of 1 to W and Z reports 1 to W. What is D(X, W)?",["2","3","8","1"],1,"Through Y: 2 + 1 = 3. Through Z: 7 + 1 = 8. The minimum is 3.")}
${quiz("n3q2","How many rounds are enough for Bellman-Ford in a network of N nodes?",["1","N - 1","N squared","log N"],1,"The best path has at most N - 1 links.")}
${quiz("n3q3","What does split horizon do?",["It splits the network into two parts","A router does not advertise a route back to the neighbour from which it learned the route","It doubles the update rate","It removes the next hop column"],1,"This stops the two routers from passing a lost route back and forth.")}
${EXAM(["State the Bellman-Ford equation. Find D(X, W) in the example of 3.1 if the link X-Y costs 5.","Explain the Bellman-Ford algorithm. Run it for the network of the animation with source A and write the distances after each round.","Explain how distance vector routing works. What does a router send?","Explain count to infinity with an example. How does split horizon help? When does it fail?","Compare distance vector and link-state routing."])}
${SUM(["D(x, y) = min over neighbours v of [ c(x, v) + D(v, y) ].","Bellman-Ford relaxes all edges N - 1 times. After round k it knows the best paths with at most k links.","Distance vector: each router sends its table to its neighbours. RIP uses hop count, with 16 as infinity.","Count to infinity: bad news spreads slowly. Split horizon and poison reverse reduce it."])}
`,

    const st=story(r,"#cis",{draw,ms:2200});st.set(R.map(s=>({cap:s.cap})))};

function hierPic(svg,mode){
  svg.innerHTML='';svg.setAttribute('viewBox','0 0 720 260');
  const R=[['Region 1',20,['A1','A2','A3']],['Region 2',260,['B1','B2','B3']],['Region 3',500,['C1','C2','C3']]];
  R.forEach(([n,x,rs],k)=>{E('rect',{x,y:20,width:200,height:200,rx:14,fill:mode>=1?'var(--pri-soft)':'none',stroke:mode>=1?'var(--pri)':'var(--line)','stroke-width':mode>=1?3:1,'stroke-dasharray':mode>=1?'':'5 4'},svg);

  E('line',{x1:200,y1:130,x2:300,y2:130,stroke:'var(--muted)','stroke-width':2},svg);E('line',{x1:440,y1:130,x2:540,y2:130,stroke:'var(--muted)','stroke-width':2},svg);
  R.forEach(([n,x,rs])=>rs.forEach((q,i)=>{const cx=x+40+i*60,cy=130;E('circle',{cx,cy,r:22,class:'tnode '+(q==='A1'?'cur ok':'')},svg);E('text',{x:cx,y:cy+4,'text-anchor':'middle',class:'sl'},svg).textContent=q}));
