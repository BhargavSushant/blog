const ebc=c=>{const k=c.charCodeAt(0);if(k===32)return 0x40;if(k>=48&&k<=57)return 0xF0+k-48;if(k>=65&&k<=73)return 0xC1+k-65;if(k>=74&&k<=82)return 0xD1+k-74;if(k>=83&&k<=90)return 0xE2+k-83;if(k>=97&&k<=105)return 0x81+k-97;if(k>=106&&k<=114)return 0x91+k-106;if(k>=115&&k<=122)return 0xA2+k-115;return null};
function huff(s){const fr={};for(const c of s)fr[c]=(fr[c]||0)+1;let id=0,N=Object.keys(fr).sort().map(c=>({c,f:fr[c],id:id++}));if(!N.length)return {codes:{},fr,bits:0};
  if(N.length===1)return {codes:{[N[0].c]:'0'},fr,bits:s.length};
  while(N.length>1){N.sort((a,b)=>a.f-b.f||a.id-b.id);const a=N.shift(),b=N.shift();N.push({f:a.f+b.f,l:a,r:b,id:id++})}
  const codes={};(function w(n,p){if(n.c!==undefined){codes[n.c]=p||'0';return}w(n.l,p+'0');w(n.r,p+'1')})(N[0],'');
  let bits=0;for(const c in fr)bits+=fr[c]*codes[c].length;return {codes,fr,bits}}
function rle(s){let o='',i=0;while(i<s.length){let j=i;while(j<s.length&&s[j]===s[i])j++;o+=(j-i)+s[i];i=j}return o}
function caesar(s,k){return s.replace(/[A-Za-z]/g,c=>{const b=c<='Z'?65:97;return String.fromCharCode(mod(c.charCodeAt(0)-b+k,26)+b)})}
function vig(s,key,dir){if(!key)return s;let j=0;return s.replace(/[A-Za-z]/g,c=>{const b=c<='Z'?65:97,k=key[j++%key.length].toLowerCase().charCodeAt(0)-97;return String.fromCharCode(mod(c.charCodeAt(0)-b+dir*k,26)+b)})}
const gcd=(a,b)=>b?gcd(b,a%b):a;
function rsaKeys(p,q){const n=p*q,ph=(p-1)*(q-1);let e=3;while(gcd(e,ph)!==1)e+=2;let d=1;while((d*e)%ph!==1)d++;return {n,ph,e,d}}
const TELN=[{f:0,t:1,label:'IAC DO ECHO'},{f:1,t:0,label:'IAC WILL ECHO',cls:'ack'},{f:0,t:1,label:'IAC DO SUPPRESS-GO-AHEAD'},{f:1,t:0,label:'IAC WILL SUPPRESS-GO-AHEAD',cls:'ack'},{f:0,t:1,label:'IAC WILL TERMINAL-TYPE'},{f:1,t:0,label:'IAC DONT TERMINAL-TYPE',cls:'lost'},{f:0,t:1,label:'login: data in NVT format (7-bit ASCII, CR LF)',cls:'retx'}];
lesson({nav:"9. Presentation layer",title:"Presentation layer: conversion, coding, compression, encryption and protocols",syl:"Presentation layer: Data conversion, Character code translation, Compression, Encryption/Decryption, protocols (LPP, Telnet, X.25 packet Assembler/Disassembler)",
html:()=>`
${GUIDE({"syl":"Presentation layer: Data conversion, Character code translation, Compression, Encryption/Decryption, protocols (LPP, Telnet, X.25 packet Assembler/Disassembler)","why":"Two computers may store numbers and text in different ways, and the data may be large or secret. The presentation layer deals with the form of the data: how it is represented, how it is made smaller and how it is protected.","map":[["9.1","The presentation layer","What are its tasks?","Read the list."],["9.2","Data conversion","How are numbers exchanged between different machines?","Convert an integer to network byte order."],["9.3","Character code translation","How does text move between ASCII, EBCDIC and Unicode?","Encode your own text."],["9.4","Compression","How is data made smaller?","Compress a text with RLE and Huffman coding."],["9.5","Encryption and decryption","How is data kept secret?","Use a cipher and a small RSA example."],["9.6","Protocols: LPP, Telnet, X.25 PAD","Which protocols give these services?","Step through a Telnet negotiation and a PAD."]],"osi":"Layer 6 (presentation layer). It uses the session layer (layer 5) and serves the application layer (layer 7). In the TCP/IP model it is part of the application layer.","pre":"Lesson 8.","time":"about 1 hour 45 minutes","next":"Lesson 10, the application layer: WWW and HTTP."})}
${LEARN(["list the functions of the presentation layer","explain big-endian and little-endian byte order and network byte order","translate characters between ASCII, EBCDIC and UTF-8","compress text with run-length coding and Huffman coding","explain symmetric and public-key encryption","describe LPP, Telnet and the X.25 PAD"])}
${SEC("9.1","The presentation layer")}
${DEF("Presentation layer","is layer 6 of the OSI model. It is concerned with the <b>syntax and semantics</b> of the information that two systems exchange. It translates the data between the format of the application and a common format for the network.")}
<div class="vis">${osiStack(6,"Layer 6. In the TCP/IP model there is no separate presentation layer.")}</div>
<ul><li><b>Data conversion (translation):</b> different computers store integers, floating-point numbers and text in different ways. A common form is used on the network.</li>
<li><b>Character code translation:</b> ASCII, EBCDIC and Unicode.</li>
<li><b>Compression:</b> fewer bits are sent, so the transfer is faster.</li>
<li><b>Encryption and decryption:</b> the data is made unreadable for others on the way.</li></ul>
${SEC("9.2","Data conversion")}
<p>A 32-bit integer is stored in 4 bytes. In a <b>big-endian</b> computer the most significant byte has the lowest address. In a <b>little-endian</b> computer (the Intel processors) the least significant byte has the lowest address. If a little-endian host sends its bytes as they are, a big-endian host reads another number. The Internet protocols therefore use the <b>network byte order</b>, which is big-endian. A host converts before sending (the functions htons and htonl) and after receiving (ntohs, ntohl). For complex data (structures, lists, floating-point numbers) standards such as <b>ASN.1 with BER</b> (used by SNMP) and <b>XDR</b> give a common encoding.</p>
<div class="vis"><div class="row"><span>Integer (decimal, 0 to 4294967295) <input type="number" id="en" value="305419896" min="0" max="4294967295" style="width:150px" aria-label="Integer"></span></div><div id="enr"></div></div>
${DOIT(["The default value is 305419896 = 0x12345678. In big-endian the bytes are 12 34 56 78, in little-endian they are 78 56 34 12.","Enter 80 (the port of HTTP). As a 32-bit number it is 00 00 00 50 in network order. A 16-bit port field holds 00 50.","Enter 1: a little-endian host stores 01 00 00 00. If it sends these bytes without conversion, the receiver reads 16777216."])}
${SEC("9.3","Character code translation")}
<p>Each character has a code. <b>ASCII</b> uses 7 bits (128 characters, 8 bits with parity). <b>EBCDIC</b> is an 8-bit code of IBM mainframes, with different values. <b>Unicode</b> gives each character of all languages a number (code point). <b>UTF-8</b> encodes a code point in 1 to 4 bytes. The ASCII characters keep their 1-byte values, so UTF-8 text in English is the same as ASCII. If a mainframe and a PC communicate, the presentation layer translates the codes.</p>
<div class="vis"><div class="row"><span>Text <input id="ct" value="Hi 5 &#8377;" size="20" aria-label="Text"></span></div><div id="ctr"></div></div>
${DOIT(["Enter ABC. The ASCII codes are 41 42 43 and the EBCDIC codes are C1 C2 C3.","Enter a digit: ASCII 0 is 30 and EBCDIC 0 is F0.","Enter a character such as the rupee sign or an Indian-language letter. It has no ASCII or EBCDIC code, and UTF-8 needs 3 bytes."])}
${SEC("9.4","Compression")}
<p>Compression reduces the number of bits. It can be <b>lossless</b> (the original data is recovered exactly: text, programs; ZIP, PNG, GIF) or <b>lossy</b> (some information is dropped: JPEG for images, MP3 for audio, MPEG for video).</p>
<ul><li><b>Run-length encoding (RLE).</b> A run of equal symbols is replaced by the count and the symbol: AAAABBBCCD becomes 4A3B2C1D.</li>
<li><b>Huffman coding.</b> Frequent symbols get short codes and rare symbols get long codes. No code is the start of another code (a prefix code), so the bit stream can be decoded without gaps. The code is built by joining the two least frequent items again and again, giving 0 to one branch and 1 to the other.</li></ul>
<div class="vis"><div class="row"><span>Text <input id="hf" value="AAAABBBCCD" size="30" aria-label="Text to compress"></span></div><div id="hfr"></div></div>
${DOIT(["With AAAABBBCCD: RLE gives 4A3B2C1D (8 characters instead of 10). Huffman gives A = 0 (1 bit) for the most frequent letter, and 19 bits in all instead of 80.","Try ABCDEFGH. All symbols are equally frequent, so Huffman codes have the same length (3 bits) and there is no gain over 3 bits per symbol.","Try a text with no runs, like ABABAB. RLE makes it longer (1A1B1A1B1A1B). RLE is good only for data with long runs."])}
${SEC("9.5","Encryption and decryption")}
<p><b>Encryption</b> changes the <b>plaintext</b> into <b>ciphertext</b> with a key. <b>Decryption</b> does the reverse.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>Symmetric key</th><th>Public key (asymmetric)</th></tr></thead><tbody>
<tr><td>Keys</td><td>One secret key, the same at both ends</td><td>A key pair: a public key (known to all) and a private key (secret)</td></tr>
<tr><td>Encryption</td><td>With the shared key</td><td>With the public key of the receiver</td></tr>
<tr><td>Decryption</td><td>With the same key</td><td>With the private key of the receiver</td></tr>
<tr><td>Speed</td><td>Fast (for large data)</td><td>Slow (used for small data and key exchange)</td></tr>
<tr><td>Problem</td><td>How to share the key safely</td><td>Number of operations and key length</td></tr>
<tr><td>Examples</td><td>DES, 3DES, AES</td><td>RSA, Diffie-Hellman, elliptic curves</td></tr></tbody></table>
<p>Real systems combine both: public-key methods agree a session key, and a symmetric cipher (AES) encrypts the data.</p>
<p><b>Simple ciphers.</b> The <b>Caesar cipher</b> shifts every letter by k places. The <b>Vigenere cipher</b> shifts by the letters of a repeated key word. They show the idea, but they are easy to break and are not used today.</p>
<div class="vis"><div class="row"><span>Message <input id="ci" value="Meet at noon" size="22" aria-label="Message"></span><span>Caesar shift <input type="range" id="ck" min="1" max="25" value="3" aria-label="Caesar shift"> <b id="ckv">3</b></span><span>Vigenere key <input id="cv" value="key" size="8" aria-label="Vigenere key"></span></div><div id="cir"></div></div>
<p><b>RSA</b> is the best known public-key method. It uses two prime numbers p and q. With very large primes (hundreds of digits) the method is secure. Here small primes are used so that you can check the arithmetic.</p>
<ol><li>n = p x q. &phi; = (p - 1)(q - 1).</li><li>Choose e with no common factor with &phi; (here the smallest odd value above 1). Find d with e x d mod &phi; = 1.</li><li>Public key = (e, n). Private key = (d, n).</li><li>Encrypt a number m &lt; n: c = m<sup>e</sup> mod n. Decrypt: m = c<sup>d</sup> mod n.</li></ol>
<div class="vis"><div class="row"><span>Primes p, q <select id="rp" aria-label="Primes"><option value="3,11">3, 11</option><option value="5,11">5, 11</option><option value="7,11">7, 11</option><option value="7,13" selected>7, 13</option><option value="11,13">11, 13</option></select></span><span>Message number m <input type="number" id="rm" value="9" min="0" style="width:80px" aria-label="Message number"></span></div><div id="rr"></div></div>
${SEC("9.6","Protocols: LPP, Telnet and the X.25 packet assembler/disassembler")}
<p><b>LPP (Lightweight Presentation Protocol, RFC 1085).</b> The OSI applications expect the services of the OSI presentation layer. LPP gives these services on top of <b>TCP or UDP</b>, so that OSI applications (for example directory and management programs) can run in a TCP/IP network without the full OSI stack. It is "lightweight" because it offers a reduced set of presentation services (it maps the presentation service directly to the transport service).</p>
<p><b>Telnet</b> (RFC 854, TCP port 23) is a remote terminal protocol. It lets a user on one host log in to another as if the terminal were attached to it. Because the hosts and terminals differ, Telnet defines a common terminal, the <b>Network Virtual Terminal (NVT)</b>: 7-bit ASCII characters, and CR LF as the end of a line. The client converts its local terminal to NVT, and the server converts from NVT to its own. This conversion is a presentation function. Telnet commands are sent in-band, started by a byte <b>IAC</b> (255). The two ends <b>negotiate options</b> with four commands: <b>WILL</b> (I want to do it), <b>WONT</b>, <b>DO</b> (please do it) and <b>DONT</b>. Telnet sends the password and the data in clear text, so it was replaced by SSH (Lesson 11).</p>
<div class="vis"><svg id="tv" role="img" aria-label="Telnet option negotiation"></svg><div id="tvs"></div></div>
<p><b>X.25 packet assembler/disassembler (PAD).</b> X.25 is a packet-switching network standard (ITU-T) that was widely used before the Internet. A simple terminal sends single characters and cannot form X.25 packets. The <b>PAD</b> does it: it <b>assembles</b> the characters from the terminal into packets, and <b>disassembles</b> the packets coming from the network into characters for the terminal. Three recommendations define it: <b>X.3</b> (the PAD parameters, such as the forwarding condition and the echo), <b>X.28</b> (the interface between the terminal and the PAD) and <b>X.29</b> (the procedures between the PAD and the host).</p>
<div class="vis"><div class="row"><span>Text typed at the terminal<br><textarea id="pt" rows="3" style="width:100%;font-family:var(--mono)" aria-label="Terminal text">login: sushant
password: ****</textarea></span></div><div class="row"><span>Packet data size <select id="ps" aria-label="Packet size"><option>8</option><option selected>16</option><option>32</option><option>128</option></select> bytes</span></div><div id="pr"></div></div>
${quiz("p9q1","A little-endian host sends the 32-bit number 1. In which order must it send the bytes on the Internet?",["01 00 00 00","00 00 00 01","00 01 00 00","Any order"],1,"The network byte order is big-endian: the most significant byte first, so 00 00 00 01.")}
${quiz("p9q2","Why is Telnet unsafe today?",["It uses UDP","It sends the password and data in clear text","It has no port","It needs a router"],1,"Telnet does not encrypt. SSH replaced it.")}
${quiz("p9q3","Which method gives short codes to frequent symbols?",["Run-length encoding","Huffman coding","Caesar cipher","Parity"],1,"Huffman coding builds a prefix code with short codes for frequent symbols.")}
${EXAM(["List the functions of the presentation layer.","What is network byte order? Why is it needed? Write 0x1A2B3C4D in big-endian and little-endian order. (1A 2B 3C 4D and 4D 3C 2B 1A)","Differentiate ASCII, EBCDIC and Unicode.","Compress AAAAABBBCDD by run-length encoding. (5A3B1C2D)","Build the Huffman code for A:5, B:2, C:1, D:1. What is the total number of bits? (Code lengths: A 1 bit, B 2 bits, C 3 bits, D 3 bits. Total = 5 + 4 + 3 + 3 = 15 bits.)","With p = 7, q = 13 find n, phi, e and d. Encrypt m = 9. (n = 91, phi = 72, e = 5, d = 29, c = 9^5 mod 91 = 81.)","Differentiate symmetric and public-key encryption.","Explain Telnet and the NVT. Explain the work of an X.25 PAD with X.3, X.28 and X.29."])}
${SUM(["The presentation layer (layer 6) deals with data representation: conversion, character codes, compression and encryption.","Internet protocols send numbers in network byte order (big-endian).","Huffman coding gives short codes to frequent symbols. RLE replaces runs by a count and a symbol.","Symmetric ciphers use one key. Public-key ciphers use a pair of keys. RSA depends on the difficulty of factoring n = p x q.","LPP gives OSI presentation services over TCP/UDP. Telnet uses the NVT and option negotiation. The X.25 PAD assembles characters into packets (X.3, X.28, X.29)."])}

lesson({nav:"10. WWW and HTTP",title:"Application layer: the World Wide Web and HTTP",syl:"Application Layer: WWW and HTTP",
html:()=>`
${GUIDE({"syl":"Application Layer: WWW and HTTP","why":"The application layer is where the user's programs use the network. The web is the largest application. Its protocol, HTTP, shows the common pattern of all application protocols: a client sends a request over TCP and a server sends a reply, using text commands.","map":[["10.1","The application layer","What do application protocols have in common?","Read the points."],["10.2","The Web and URLs","How is a document named?","Split a URL into its parts."],["10.3","HTTP messages","What does a request and a response look like?","Build a request."],["10.4","Persistent connections","How long does a page take to load?","Use the calculator."],["10.5","Cookies and caching","How does a stateless protocol remember?","Step through the two cases."]],"osi":"Layer 7 (application layer). HTTP uses TCP (layer 4), usually on port 80, and HTTPS adds TLS on port 443.","pre":"Lessons 1 to 7, in particular the TCP handshake and TCP port numbers.","time":"about 1 hour 15 minutes","next":"Lesson 11, FTP and SSH."})}
${LEARN(["explain the client-server model of application protocols","split a URL into scheme, host, port, path, query and fragment","read an HTTP request and response, the methods and the status codes","calculate the time for a page with persistent and non-persistent connections","explain cookies, caching and the conditional GET"])}
${SEC("10.1","The application layer")}
<div class="vis">${osiStack(7,"Layer 7. It contains the protocols that user programs use: HTTP, FTP, SMTP, DNS, SNMP.")}</div>
<p>The application layer is the top layer. In the OSI model the work of layers 5, 6 and 7 is done here in the TCP/IP model. An application protocol defines the <b>types of messages</b> (request, response), the <b>syntax</b> of the messages, the <b>meaning</b> of the fields and the <b>rules</b> for when a process sends. Most of them follow the <b>client-server model</b>: a <b>server</b> process waits on a well-known port, and a <b>client</b> process starts the communication. (In <b>peer-to-peer</b> applications every host is both.) The application protocols are text-based (HTTP, SMTP, FTP) or binary (DNS, SNMP) and use the services of TCP or UDP through sockets (Lesson 1).</p>
${SEC("10.2","The World Wide Web and URLs")}
<p>The <b>World Wide Web (WWW)</b> is a system of linked documents on servers all over the Internet. A <b>web page</b> is a base file written in <b>HTML</b> and a number of <b>objects</b> (images, scripts, style sheets) that the page refers to. A <b>browser</b> is the client. A <b>web server</b> stores the objects. <b>HTTP (HyperText Transfer Protocol)</b> is the protocol that moves them.</p>
${DEF("URL (Uniform Resource Locator)","is the name of an object on the Web. It says which protocol to use, which host has the object and where it is on that host: <code>scheme://host:port/path?query#fragment</code>.")}
<div class="vis"><div class="row"><span>URL <input id="ui" style="width:100%;min-width:320px" value="https://www.example.com:8443/courses/cn/unit5.html?lesson=10&amp;view=full#timers" aria-label="URL"></span></div><div id="ur"></div></div>
${DOIT(["Read the parts of the default URL. The port is 8443. Delete the port from the URL. The tool shows the default port of the scheme (443 for https).","Change https to http. The default port becomes 80.","Remove the query part and check that the path remains."])}
${SEC("10.3","HTTP messages")}
<p>HTTP is a <b>request-response</b> protocol. It runs over <b>TCP</b>. The client opens a connection to port 80, sends a request, and the server sends a response. HTTP is <b>stateless</b>: the server does not remember earlier requests of a client.</p>
<p><b>The request message</b> has a request line (method, URL path, version), header lines, a blank line and an optional body. <b>The response message</b> has a status line (version, status code, phrase), header lines, a blank line and the body (the object).</p>
<div class="vis"><div class="row"><span>Method <select id="hm" aria-label="Method"><option>GET</option><option>HEAD</option><option>POST</option></select></span><span>Path <input id="hp" value="/index.html" size="16" aria-label="Path"></span><span>Host <input id="hh" value="www.example.com" size="18" aria-label="Host"></span><span>Status of the reply <select id="hs" aria-label="Status"><option value="200">200 OK</option><option value="301">301 Moved Permanently</option><option value="304">304 Not Modified</option><option value="404">404 Not Found</option><option value="500">500 Internal Server Error</option></select></span></div><div id="hr"></div></div>
<p><b>Methods.</b></p>
<table class="dt gt cmpt"><thead><tr><th>Method</th><th>Use</th><th>Safe to repeat</th><th>Has a body</th></tr></thead><tbody>${HM.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('')}</tbody></table>
<p><b>Status codes.</b> The first digit gives the class.</p>
<table class="dt gt cmpt"><thead><tr><th>Class</th><th>Meaning</th><th>Examples</th></tr></thead><tbody>${HS.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table>
<p><b>Important headers.</b> Request: <code>Host</code> (required in HTTP/1.1), <code>User-Agent</code>, <code>Accept</code>, <code>Cookie</code>, <code>If-Modified-Since</code>. Response: <code>Content-Type</code>, <code>Content-Length</code>, <code>Last-Modified</code>, <code>Set-Cookie</code>, <code>Location</code> (with 3xx).</p>
${SEC("10.4","Non-persistent and persistent connections")}
<p>A page with N embedded objects needs N + 1 objects in all (the base file and the N objects). With <b>non-persistent HTTP</b> (HTTP/1.0) every object needs its own TCP connection: one RTT for the handshake and one RTT for the request and the first bytes of the response. With <b>persistent HTTP</b> (HTTP/1.1, the default) the connection stays open for all the objects. With <b>pipelining</b> the client sends the requests without waiting for each response. (HTTP/2 goes further: it multiplexes many requests as streams on one connection. HTTP/3 does this over QUIC and UDP.)</p>
<div class="vis"><div class="row"><span>Embedded objects N <input type="number" id="hn" value="10" min="0" max="100" style="width:70px" aria-label="Number of objects"></span><span>RTT <input type="number" id="hrtt" value="100" min="1" max="1000" style="width:80px" aria-label="RTT"> ms</span><span>Transmission time of one object T <input type="number" id="ht" value="20" min="0" max="1000" style="width:80px" aria-label="Transmission time"> ms</span></div><div id="hc"></div></div>
${DOIT(["Use the defaults. Non-persistent: 11 x (2 x 100 + 20) = 2420 ms. Persistent without pipelining: 1420 ms. Persistent with pipelining: 520 ms.","Set RTT to 10 ms (a nearby server). The differences become small. The saving depends on the RTT.","Set N to 0 (a single object). All three modes give the same time."])}
${SEC("10.5","Cookies and web caching")}
<p><b>Cookies.</b> Because HTTP is stateless, a server that must recognise a user (a shopping cart, a login) uses a <b>cookie</b>. The server sends an identifier in the header <code>Set-Cookie</code>. The browser stores it and sends it back in the header <code>Cookie</code> in every later request to that server.</p>
<p><b>Web caching and the conditional GET.</b> A <b>cache</b> (in the browser or in a proxy server) keeps copies of the objects that were requested. A later request for the same object can be served from the cache. To be sure that the copy is current, the cache asks the server with <b>If-Modified-Since</b>. If the object has not changed, the server sends only <b>304 Not Modified</b>.</p>
<div class="vis"><div class="row">${seg("hcg",[["b","Basic page load"],["k","Cookie"],["c","Conditional GET"]])}</div><svg id="hv" role="img" aria-label="HTTP exchange"></svg><div id="hvs"></div></div>
<table class="dt gt cmpt"><thead><tr><th></th><th>HTTP/1.0</th><th>HTTP/1.1</th><th>HTTP/2</th><th>HTTP/3</th></tr></thead><tbody><tr><td>Transport</td><td>TCP</td><td>TCP</td><td>TCP (with TLS)</td><td>QUIC over UDP</td></tr><tr><td>Connections</td><td>One for each object</td><td>Persistent, pipelining</td><td>One connection, many streams</td><td>One connection, many streams</td></tr><tr><td>Format</td><td>Text</td><td>Text</td><td>Binary frames</td><td>Binary frames</td></tr><tr><td>Header compression</td><td>No</td><td>No</td><td>Yes (HPACK)</td><td>Yes (QPACK)</td></tr></tbody></table>
${quiz("p10q1","Which header makes HTTP, a stateless protocol, remember a user between requests?",["Host","Cookie","Content-Length","Accept"],1,"The server gives an identifier with Set-Cookie, and the browser returns it in the Cookie header.")}
${quiz("p10q2","The server answers a conditional GET with 304. What does it send in the body?",["The object","An error page","Nothing","The cookie"],2,"304 Not Modified has no body. The browser uses its cached copy.")}
${quiz("p10q3","Which class of status code means that the client made an error?",["2xx","3xx","4xx","5xx"],2,"4xx is a client error (for example 404 Not Found). 5xx is a server error.")}
${EXAM(["Write the parts of a URL. Split http://www.sage.edu:8080/cs/cn.html?u=5#top. (scheme http, host www.sage.edu, port 8080, path /cs/cn.html, query u=5, fragment top)","Explain the format of an HTTP request and response message.","List the HTTP methods and the status code classes.","Explain persistent and non-persistent connections. A page has 5 objects besides the base file, RTT is 50 ms, and T is 10 ms. Find the time for non-persistent connections. (6 x (100 + 10) = 660 ms)","What is a cookie? How does it give state to HTTP?","What is a conditional GET? Explain web caching.","Compare HTTP/1.1 and HTTP/2."])}
${SUM(["The application layer protocols use the client-server model over TCP or UDP. HTTP uses TCP port 80 (HTTPS: 443).","A URL has the scheme, the host, an optional port, the path, a query and a fragment.","HTTP is a stateless request-response protocol with text headers. The status code class tells the result.","Persistent connections and pipelining save round trips. Cookies give state. A cache and the conditional GET save bandwidth."])}

    e.innerHTML=KV([['Scheme (protocol)',p.sch],['Host',p.host],['Port',p.port?p.port:(p.dp?p.dp+' (default for '+p.sch+')':'none')],['Path',p.path],['Query',p.q||'none'],['Fragment',p.frag||'none']])};

  ['#hm','#hs'].forEach(s=>$(s,r).onchange=hr);['#hp','#hh'].forEach(s=>$(s,r).oninput=hr);hr();

    $("#hc",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Mode</th><th>Calculation</th><th>Total time</th></tr></thead><tbody><tr><td>Non-persistent (one connection for each object)</td><td>(N + 1) x (2 RTT + T)</td><td><b>${A} ms</b></td></tr><tr><td>Persistent, no pipelining</td><td>2 RTT + T + N x (RTT + T)</td><td><b>${B} ms</b></td></tr><tr><td>Persistent, with pipelining</td><td>2 RTT + T + RTT + N x T</td><td><b>${C} ms</b></td></tr></tbody></table><div class="small muted">Simple model: no parallel connections, no slow start, equal objects. The 2 RTT of the first object are one RTT for the TCP handshake and one for the request and response.</div>`};
  ['#hn','#hrtt','#ht'].forEach(s=>$(s,r).oninput=hc);hc();
  let hs=null;const hg=k=>{const c=HCASE[k];hs=story(r,"#hvs",{draw:i=>seqd($("#hv",r),{actors:['Browser (client)','Web server'],msgs:c.M,rowH:40},i)});hs.set(c.S.map(x=>({cap:x})))};

const FTPC=[['USER name','Send the user name'],['PASS password','Send the password'],['PWD','Show the current directory'],['CWD dir','Change the directory'],['LIST','List the files of a directory (on the data connection)'],['RETR file','Retrieve (download) a file'],['STOR file','Store (upload) a file'],['TYPE A / TYPE I','Set the data type: ASCII text or binary (image)'],['PORT h1,h2,h3,h4,p1,p2','Active mode: the address and port where the client waits for the data connection'],['PASV','Passive mode: the server opens a port and tells it to the client'],['QUIT','End the session']];

const FT={a:{M:[{f:0,t:1,label:'TCP connect to port 21 (control)',cls:'ack'},{f:1,t:0,label:'220 Service ready'},{f:0,t:1,label:'USER sushant'},{f:1,t:0,label:'331 Need password',cls:'ack'},{f:0,t:1,label:'PASS ****'},{f:1,t:0,label:'230 User logged in',cls:'ack'},{f:0,t:1,label:'PORT 10,0,0,1,195,80  (client waits on port 50000)'},{f:1,t:0,label:'200 PORT command okay',cls:'ack'},{f:0,t:1,label:'RETR notes.pdf'},{f:1,t:0,label:'150 Opening data connection'},{f:1,t:0,label:'DATA: server port 20 connects to client port 50000, file sent',cls:'retx'},{f:1,t:0,label:'226 Transfer complete',cls:'ack'},{f:0,t:1,label:'QUIT'}],

 p:{M:[{f:0,t:1,label:'Control connection to port 21, USER and PASS (as before)',cls:'ack'},{f:0,t:1,label:'PASV'},{f:1,t:0,label:'227 Entering passive mode (10,0,0,9,200,10)',cls:'ack'},{f:0,t:1,label:'RETR notes.pdf'},{f:0,t:1,label:'DATA: client connects to server port 51210, file sent',cls:'retx'},{f:1,t:0,label:'226 Transfer complete',cls:'ack'}],

lesson({nav:"11. FTP and SSH",title:"Application layer: FTP and SSH",syl:"Application Layer: FTP, SSH",
html:()=>`
${GUIDE({"syl":"Application Layer: FTP, SSH","why":"FTP moves files between hosts and shows an unusual design: two TCP connections, one for commands and one for data. SSH gives a secure remote login and secure tunnels. It replaced Telnet and the clear-text file transfer.","map":[["11.1","FTP","How does file transfer work?","Read the model."],["11.2","FTP commands and replies","What is sent on the control connection?","Read the tables."],["11.3","Active and passive mode","Who opens the data connection?","Step through both."],["11.4","SSH","How is a remote login made secure?","Read the three layers."],["11.5","Key exchange","How do two hosts agree on a secret key in public?","Compute a Diffie-Hellman exchange."],["11.6","The SSH session","Which steps does a login take?","Step through the session."]],"osi":"Layer 7 (application layer). FTP and SSH use TCP (ports 21 and 20 for FTP, 22 for SSH).","pre":"Lessons 3 and 9 (TCP connections, Telnet, encryption).","time":"about 1 hour 15 minutes","next":"Lesson 12, email."})}
${LEARN(["explain why FTP uses a control connection and a data connection","read FTP commands and reply codes","compare active and passive mode","describe the three layers of SSH and the uses of SSH","calculate a Diffie-Hellman shared key"])}
${SEC("11.1","FTP: File Transfer Protocol")}
${DEF("FTP (File Transfer Protocol, RFC 959)","is the standard protocol to copy a file from one host to another. The client logs in to the server and can list directories, download files (<b>get</b>) and upload files (<b>put</b>).")}
<p>FTP uses <b>two TCP connections</b>.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>Control connection</th><th>Data connection</th></tr></thead><tbody>
<tr><td>Server port</td><td>21</td><td>20 (in active mode) or a port chosen by the server (passive mode)</td></tr>
<tr><td>Open</td><td>For the whole session</td><td>Opened for each file or listing and closed afterwards</td></tr>
<tr><td>Carries</td><td>Commands and replies, as NVT ASCII text</td><td>The file or the list of files</td></tr>
<tr><td>Why</td><td colspan="2">The commands travel <b>out of band</b>, separate from the data. The control connection stays free for commands, such as abort, while a large file is moving. Different data types and modes can be used on the data connection.</td></tr></tbody></table>
<p>FTP is <b>stateful</b>: the server keeps the user, the current directory and the transfer type during the session. This is different from HTTP. FTP sends the password in clear text, so use <b>SFTP</b> or <b>FTPS</b> (FTP over TLS) when security is needed.</p>
${SEC("11.2","FTP commands and replies")}
<table class="dt gt cmpt"><thead><tr><th>Command</th><th>Meaning</th></tr></thead><tbody>${FTPC.map(x=>`<tr><td><code>${x[0]}</code></td><td>${x[1]}</td></tr>`).join('')}</tbody></table>
<p>Every command gets a reply with a <b>three-digit code</b>. The first digit gives the class, the second digit the category (syntax, information, connection, authentication, file system).</p>
<table class="dt gt cmpt"><thead><tr><th>Code</th><th>Class</th><th>Examples</th></tr></thead><tbody>${FTPR.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table>
${SEC("11.3","Active and passive mode")}
<p>Who opens the data connection? In <b>active mode</b> the client tells the server where to connect with PORT, and the <b>server</b> opens the data connection from its port 20. A firewall on the client side usually blocks this incoming connection. In <b>passive mode</b> the client sends PASV, the server opens a port and tells it, and the <b>client</b> opens the data connection. Select the mode and step through a download.</p>
<div class="vis"><div class="row">${seg("ftg",[["a","Active mode"],["p","Passive mode"]])}</div><svg id="fv" role="img" aria-label="FTP session"></svg><div id="fvs"></div></div>
${DOIT(["In active mode find the PORT command. The six numbers 10,0,0,1,195,80 mean address 10.0.0.1 and port 195 x 256 + 80 = 50000.","In passive mode find the reply 227. The numbers 200,10 give the port 200 x 256 + 10 = 51210.","In both modes notice that the control connection stays open while the data connection comes and goes."])}
${SEC("11.4","SSH: Secure Shell")}
${DEF("SSH (Secure Shell, RFC 4251 to 4254)","is a protocol for secure remote login and other secure services over an insecure network. It uses TCP port 22. It gives <b>confidentiality</b> (encryption), <b>integrity</b> (a message authentication code) and <b>authentication</b> of the server and of the user.")}
<p>SSH replaced Telnet, rlogin and rsh for remote login, and FTP for file transfer. It has three layers.</p>
<table class="dt gt cmpt"><thead><tr><th>Layer</th><th>Task</th></tr></thead><tbody>
<tr><td><b>Transport layer protocol</b></td><td>Server authentication with a host key, key exchange, encryption, integrity check and optional compression</td></tr>
<tr><td><b>User authentication protocol</b></td><td>Proves the identity of the user: by password or, better, by a <b>public key</b> (the user signs a challenge with the private key)</td></tr>
<tr><td><b>Connection protocol</b></td><td>Multiplexes several <b>channels</b> on one connection: an interactive shell, a single command, file transfer (<b>SFTP</b>, <b>SCP</b>) and <b>port forwarding</b></td></tr></tbody></table>
<p><b>Port forwarding (tunnelling).</b> SSH can carry the data of another TCP application inside its encrypted connection. For example, a local port on the client is forwarded to a database server through the SSH server. The data between the client and the SSH server is encrypted, even if the application itself is not.</p>
<p><b>Host keys</b> protect against a false server. The first time that a client connects, it shows the fingerprint of the server host key and stores it. If the key later changes, the client warns the user, as this could be a man-in-the-middle attack.</p>
${SEC("11.5","Key exchange: Diffie-Hellman")}
<p>Both ends must have the same secret key for the encryption, but they cannot send it over the network in the clear. In the <b>Diffie-Hellman</b> method two hosts agree on a shared secret over a public channel.</p>
<ol><li>Both agree on a prime p and a number g (public).</li><li>The client chooses a secret a and sends A = g<sup>a</sup> mod p. The server chooses a secret b and sends B = g<sup>b</sup> mod p.</li><li>The client computes K = B<sup>a</sup> mod p. The server computes K = A<sup>b</sup> mod p. Both get g<sup>ab</sup> mod p, the same number.</li></ol>
<p>An eavesdropper knows p, g, A and B but not a or b. With very large p (2048 bits) it is not possible to find a from A (the discrete logarithm problem). The numbers below are small so that you can check them.</p>
<div class="vis"><div class="row"><span>Prime p <select id="dp" aria-label="Prime p"><option>23</option><option>47</option><option>101</option></select></span><span>g <select id="dg" aria-label="g"><option>5</option><option>2</option></select></span><span>Client secret a <input type="number" id="da" value="6" min="2" max="97" style="width:70px" aria-label="Secret a"></span><span>Server secret b <input type="number" id="db" value="15" min="2" max="97" style="width:70px" aria-label="Secret b"></span></div><div id="dr"></div></div>
${DOIT(["With p = 23, g = 5, a = 6 and b = 15: A = 5^6 mod 23 = 8, B = 5^15 mod 23 = 19. Both ends get K = 2.","Change a and b. The two keys are always equal.","Check the line for the eavesdropper. It shows only p, g, A and B."])}
<p>The plain Diffie-Hellman exchange does not authenticate the other end. So the server signs the exchange with its host key, and the client checks the signature. This stops a man-in-the-middle.</p>
${SEC("11.6","The SSH session")}
<div class="vis"><svg id="sv" role="img" aria-label="SSH session"></svg><div id="svs"></div></div>
${quiz("p11q1","In active mode FTP, which host opens the data connection?",["The client, to port 21","The server, from port 20","The client, to port 20","Neither"],1,"The client sends PORT with its address, and the server opens the connection from its port 20.")}
${quiz("p11q2","Why does FTP use a separate control connection?",["To make the transfer faster","To send commands out of band while data is moving","To encrypt the data","Because UDP cannot carry files"],1,"The commands are not mixed with the data, so a command such as abort can be sent during a transfer.")}
${quiz("p11q3","With p = 23, g = 5 and a secret a = 6, what does the client send in Diffie-Hellman?",["5","6","8","15625"],2,"A = 5^6 mod 23 = 15625 mod 23 = 8.")}
${EXAM(["Explain the working of FTP. Why are two connections used?","Differentiate active and passive mode. Which one works better with a firewall? Why?","What does the command PORT 192,168,1,5,4,1 mean? (Address 192.168.1.5, port 4 x 256 + 1 = 1025)","List the FTP commands and the classes of reply codes.","Explain the architecture of SSH. What are its three layers?","How does SSH protect against Telnet's weaknesses? What is port forwarding?","With p = 11, g = 2, a = 3 and b = 4, find A, B and the shared key. (A = 8, B = 5, K = 5^3 mod 11 = 4)"])}
${SUM(["FTP uses a control connection (port 21, for the whole session) and a data connection (opened for each transfer).","In active mode the server opens the data connection. In passive mode the client does.","SSH (port 22) has a transport layer (encryption, key exchange), user authentication and a connection layer with channels and port forwarding.","Diffie-Hellman lets two hosts compute the same key from public values: K = g^(ab) mod p."])}
`,
mount(r){
  let fs=null;const fb=k=>{const c=FT[k];fs=story(r,"#fvs",{draw:i=>seqd($("#fv",r),{actors:['FTP client','FTP server'],msgs:c.M,rowH:34,L:130},i)});fs.set(c.S.map(x=>({cap:x})))};
  bindSeg(r,"ftg",fb);fb('a');
  const dh=()=>{const p=+$("#dp",r).value,g=+$("#dg",r).value,a=Math.max(2,Math.min(p-2,Math.floor(+$("#da",r).value||2))),b=Math.max(2,Math.min(p-2,Math.floor(+$("#db",r).value||2))),A=powmod(g,a,p),B=powmod(g,b,p),K1=powmod(B,a,p),K2=powmod(A,b,p);
    $("#dr",r).innerHTML=KV([['Public values',`p = ${p}, g = ${g}`],['Client sends A = g<sup>a</sup> mod p',`${g}<sup>${a}</sup> mod ${p} = <b>${A}</b>`],['Server sends B = g<sup>b</sup> mod p',`${g}<sup>${b}</sup> mod ${p} = <b>${B}</b>`],['Client computes K = B<sup>a</sup> mod p',`${B}<sup>${a}</sup> mod ${p} = <b>${K1}</b>`],['Server computes K = A<sup>b</sup> mod p',`${A}<sup>${b}</sup> mod ${p} = <b>${K2}</b>`],['Eavesdropper sees',`p, g, A = ${A}, B = ${B}. The secrets a and b stay unknown.`],['Result',K1===K2?'<b>The two keys are equal.</b>':'The keys differ.']])};
  ['#dp','#dg'].forEach(s=>$(s,r).onchange=dh);['#da','#db'].forEach(s=>$(s,r).oninput=dh);dh();
  const ss=story(r,"#svs",{draw:i=>seqd($("#sv",r),{actors:['SSH client','SSH server'],msgs:SSHM,rowH:34,L:130},i)});
  ss.set([{cap:'<b>TCP connection</b> to port 22.'},{cap:'<b>Version exchange.</b> The client sends its protocol version string.'},{cap:'<b>The server answers</b> with its own version string.'},{cap:'<b>Algorithm negotiation (KEXINIT).</b> The client lists the key exchange, encryption, MAC and compression methods that it supports.'},{cap:'<b>The server lists its methods.</b> They choose the first method that both support.'},{cap:'<b>Key exchange.</b> The client sends its public value (A in Diffie-Hellman).'},{cap:'<b>The server sends its value B</b>, its host key and a signature of the exchange made with the host key. The client checks the host key against the stored key. Both ends now compute the same shared secret and derive the keys for encryption and integrity.'},{cap:'<b>NEWKEYS.</b> From here all the traffic is encrypted and protected by a message authentication code.'},{cap:'<b>User authentication.</b> The client proves the identity of the user. With a public key, the client signs a value with the private key, and the server checks it with the stored public key of the user. A password can be used instead, now inside the encrypted connection.'},{cap:'<b>Authentication succeeded.</b> This is the point where the server also decides what the user is allowed to do (authorization).'},{cap:'<b>The client opens a channel</b> of type session and asks for a shell (or a command, or a file transfer subsystem).'},{cap:'<b>The terminal data</b> flows in both directions, encrypted. More channels can be opened on the same connection.'}]);
}});

/* ===== Unit V Lesson 12: email (SMTP, MIME, IMAP) ===== */
const MAILFLOW=[{f:0,t:1,label:'SMTP: send message to bob@b.example',cls:''},{f:1,t:2,label:'DNS MX lookup, then SMTP over TCP port 25',cls:'retx'},{f:2,t:2,label:'stored in the mailbox of Bob'},{f:3,t:2,label:'IMAP or POP3: Bob reads the mail',cls:'ack'}];
const MIMET=[['text/plain','Plain text'],['text/html','HTML text'],['image/jpeg, image/png','Images'],['audio/mpeg, video/mp4','Audio and video'],['application/pdf','A PDF file'],['application/octet-stream','Any binary data'],['multipart/mixed','A message with several parts (for example text and attachments)'],['multipart/alternative','The same content in several forms (plain text and HTML)']];
const IMAPS=[{f:0,t:1,label:'* OK IMAP server ready',rev:1},{f:0,t:1,label:'A001 LOGIN bob ****'},{f:1,t:0,label:'A001 OK LOGIN completed',cls:'ack'},{f:0,t:1,label:'A002 SELECT INBOX'},{f:1,t:0,label:'* 3 EXISTS   A002 OK [READ-WRITE]',cls:'ack'},{f:0,t:1,label:'A003 FETCH 3 (BODY[HEADER])'},{f:1,t:0,label:'* 3 FETCH (headers only)   A003 OK',cls:'ack'},{f:0,t:1,label:'A004 STORE 3 +FLAGS (\\Seen)'},{f:1,t:0,label:'A004 OK flag stored on the server',cls:'ack'},{f:0,t:1,label:'A005 LOGOUT'}];

lesson({nav:"12. Email: SMTP, MIME, IMAP",title:"Application layer: electronic mail (SMTP, MIME and IMAP)",syl:"Application Layer: Email (SMTP, MIME, IMAP)",
html:()=>`
${GUIDE({"syl":"Application Layer: Email (SMTP, MIME, IMAP)","why":"Electronic mail is the oldest large Internet application. It uses three protocols for three jobs: SMTP moves the message between servers, MIME lets the message carry more than ASCII text, and IMAP lets the user read the mailbox.","map":[["12.1","Architecture of email","Which parts take part?","Step through the path of a message."],["12.2","SMTP","How is a message sent?","Write a message and read the SMTP dialogue."],["12.3","MIME","How are attachments and non-ASCII text sent?","Encode text in Base64."],["12.4","Mail access: IMAP and POP3","How does the user read the mail?","Step through an IMAP session."]],"osi":"Layer 7 (application layer). SMTP, IMAP and POP3 use TCP.","pre":"Lessons 1 and 10 (ports, client-server model).","time":"about 1 hour 15 minutes","next":"Lesson 13, DNS."})}
${LEARN(["name the parts of the email system and the protocol between each pair","read an SMTP dialogue with its commands and reply codes","explain what MIME adds and encode data in Base64","compare IMAP and POP3"])}
${SEC("12.1","Architecture of email")}
<p>The email system has three kinds of parts.</p>
<ul><li><b>User agent (UA):</b> the program that the user uses to write and read mail (a mail app or a web mail page).</li>
<li><b>Message transfer agent (MTA):</b> the mail server that sends mail to other servers and receives mail from them. It uses SMTP.</li>
<li><b>Message access agent (MAA):</b> the server part that lets the user read the mailbox. It uses IMAP or POP3 (or HTTP for web mail).</li></ul>
<p>When Alice sends a message to Bob, her UA sends it to <b>her mail server</b> with SMTP. Her server finds the mail server of Bob by a DNS query for the <b>MX record</b> (mail exchanger) of the domain in the address (Lesson 13), and sends the message with SMTP, over TCP port 25. The server of Bob puts it in Bob's <b>mailbox</b>. Later Bob's UA gets the message with IMAP or POP3. Email is <b>asynchronous</b>: the receiver need not be online when the mail is sent. An address has the form <code>user@domain</code>.</p>
<div class="vis"><svg id="mv" role="img" aria-label="Path of an email"></svg><div id="mvs"></div></div>
<p><b>SMTP is a push protocol</b>: the sender pushes the message to the server. <b>IMAP and POP3 are pull protocols</b>: the receiver pulls the message from its server. This is why a separate protocol is needed to read mail.</p>
${SEC("12.2","SMTP: Simple Mail Transfer Protocol")}
${DEF("SMTP (Simple Mail Transfer Protocol, RFC 5321)","is the protocol that moves mail from a client MTA to a server MTA. It uses TCP port 25 (port 587 for a user agent that submits mail). The commands are text lines, and the replies have a three-digit code, as in FTP.")}
<table class="dt gt cmpt"><thead><tr><th>Command</th><th>Meaning</th><th>Reply</th></tr></thead><tbody>
<tr><td><code>HELO / EHLO domain</code></td><td>The client names itself</td><td>250</td></tr><tr><td><code>MAIL FROM:&lt;address&gt;</code></td><td>Sender of the message (the envelope sender)</td><td>250</td></tr><tr><td><code>RCPT TO:&lt;address&gt;</code></td><td>A recipient (given once for each recipient)</td><td>250 or 550 (no such user)</td></tr><tr><td><code>DATA</code></td><td>Start of the message text</td><td>354 (send it, end with a line with only a dot)</td></tr><tr><td><code>.</code></td><td>End of the message</td><td>250 (accepted)</td></tr><tr><td><code>QUIT</code></td><td>End the session</td><td>221</td></tr></tbody></table>
<p>The message has <b>headers</b> (From, To, Subject, Date), an <b>empty line</b> and the <b>body</b>. SMTP was designed for 7-bit ASCII text, so everything else must be encoded (MIME). Write a message and read the dialogue that SMTP uses.</p>
<div class="vis"><div class="row"><span>From <input id="sf" value="alice@a.example" size="18" aria-label="From"></span><span>To <input id="st" value="bob@b.example" size="18" aria-label="To"></span><span>Subject <input id="ss" value="Unit 5 notes" size="18" aria-label="Subject"></span></div><div class="row"><span>Body<br><textarea id="sb" rows="2" style="width:100%" aria-label="Body">Please find the notes for Unit 5.</textarea></span></div><div id="sr"></div></div>
${DOIT(["Read the dialogue. The client commands start with MAIL FROM, RCPT TO and DATA. Every command has a numeric reply.","Change the To address to carol@c.example. The client opens a connection to the mail server of c.example, not b.example.","Add a line with only a dot (.) to the body. The tool sends it with a second dot (dot stuffing), so that the server does not take it as the end of the message."])}
${SEC("12.3","MIME: Multipurpose Internet Mail Extensions")}
<p>SMTP can send only 7-bit ASCII. <b>MIME</b> (RFC 2045 to 2049) lets mail carry other content without changing SMTP. It adds headers to the message and defines how to encode the data.</p>
<ul><li><code>MIME-Version: 1.0</code></li><li><code>Content-Type:</code> the type and subtype of the data (below)</li><li><code>Content-Transfer-Encoding:</code> how the data was changed to ASCII: <b>7bit</b>, <b>8bit</b>, <b>base64</b> (any binary data) or <b>quoted-printable</b> (mostly ASCII text with a few other characters)</li></ul>
<table class="dt gt cmpt"><thead><tr><th>Content-Type</th><th>Meaning</th></tr></thead><tbody>${MIMET.map(x=>`<tr><td><code>${x[0]}</code></td><td>${x[1]}</td></tr>`).join('')}</tbody></table>
<p><b>Base64</b> takes 3 bytes (24 bits), splits them into four groups of 6 bits, and writes each group as one character of a table of 64 characters (A to Z, a to z, 0 to 9, + and /). If the data does not fill the last group, the output is padded with = characters. The result is 4/3 the size of the original.</p>
<div class="vis"><div class="row"><span>Data <input id="bt" value="Hi!" size="24" aria-label="Data to encode"></span></div><div id="br"></div></div>
${DOIT(["The default value Hi! has exactly 3 bytes: 01001000 01101001 00100001. The 6-bit groups are 010010, 000110, 100100, 100001, which are the characters S, G, k and h. The result is SGkh.","Enter Hi. There are 2 bytes. The last group is padded with zeros and the output ends with one =.","Enter H. One byte gives two characters and ==."])}
${SEC("12.4","Mail access: IMAP and POP3")}
<p>The user reads mail from the mailbox on the server with a message access protocol.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>POP3 (Post Office Protocol, port 110)</th><th>IMAP (Internet Message Access Protocol, port 143, 993 with TLS)</th></tr></thead><tbody>
<tr><td>Where the mail is kept</td><td>Downloaded to the user's computer (and usually deleted from the server)</td><td>Stays on the server. The client shows it.</td></tr>
<tr><td>State kept on the server</td><td>None between sessions</td><td>Folders, flags (seen, answered, deleted)</td></tr>
<tr><td>Several devices</td><td>Difficult: the mail is on one device</td><td>Easy: every device shows the same mailbox</td></tr>
<tr><td>Partial download</td><td>No (a whole message)</td><td>Yes: headers only, or one attachment</td></tr>
<tr><td>Search on the server</td><td>No</td><td>Yes</td></tr></tbody></table>
<p>In IMAP every client command begins with a <b>tag</b> (A001, A002, ...). The server answers with untagged lines that start with * and finishes with a tagged line that carries the same tag and the result (OK, NO or BAD). Step through a session.</p>
<div class="vis"><svg id="iv" role="img" aria-label="IMAP session"></svg><div id="ivs"></div></div>
<p><b>Web mail</b> (Gmail, Outlook on the web) uses HTTP between the browser and the web server. The two mail servers still use SMTP between them.</p>
${quiz("p12q1","Which protocol moves a message from the mail server of Alice to the mail server of Bob?",["IMAP","POP3","SMTP","HTTP only"],2,"SMTP is the protocol between mail servers (port 25).")}
${quiz("p12q2","Why is MIME needed?",["To route mail","To send non-ASCII data such as attachments in a 7-bit ASCII mail system","To read mail","To find the mail server"],1,"MIME defines headers and encodings such as Base64 so that any data can be carried by SMTP.")}
${quiz("p12q3","Which protocol keeps the mail on the server and the same view on all devices?",["POP3","SMTP","IMAP","FTP"],2,"IMAP keeps the mailbox, folders and flags on the server.")}
${EXAM(["Explain the architecture of the email system with a diagram. Name the protocol used in each part.","Explain the SMTP commands and reply codes. Write the dialogue for a mail with one recipient.","What is MIME? Explain the headers Content-Type and Content-Transfer-Encoding.","Encode the two bytes of the text Hi in Base64. (SGk=)","Compare POP3 and IMAP.","Why is SMTP called a push protocol and IMAP a pull protocol?","How does a mail server find the server of the receiver? (DNS MX record)"])}
${SUM(["A message goes from the user agent to the sender's mail server and to the receiver's mail server by SMTP (port 25), and is read by IMAP or POP3.","SMTP uses text commands (MAIL FROM, RCPT TO, DATA) and three-digit replies. It carries 7-bit ASCII.","MIME adds headers and encodings, such as Base64, so that any data can be sent.","IMAP keeps the mailbox on the server. POP3 downloads it."])}
`,

/* ===== Unit V Lesson 13: DNS ===== */
const GD={nodes:{Host:[50,150],LDNS:[220,150],Root:[430,45],TLD:[620,150],Auth:[430,262]},edges:[['Host','LDNS',1],['LDNS','Root',1],['LDNS','TLD',1],['LDNS','Auth',1],['Root','TLD',1],['TLD','Auth',1]]};
const DNSH=[[{n:'Identification',b:16,note:'A 16-bit number chosen by the client. The response carries the same number, so the client can match response and query.'},{n:'Flags',b:16,bl:'16 bits',note:'QR (1 bit: 0 query, 1 response), Opcode (4 bits), AA (authoritative answer), TC (truncated, retry with TCP), RD (recursion desired), RA (recursion available), reserved bits, and RCODE (4 bits: 0 no error, 3 name does not exist).'}],[{n:'Question count',b:16,note:'Number of entries in the question section (normally 1).'},{n:'Answer count',b:16,note:'Number of resource records in the answer section.'}],[{n:'Authority count',b:16,note:'Number of resource records in the authority section (the name servers).'},{n:'Additional count',b:16,note:'Number of resource records in the additional section (for example the addresses of the name servers).'}]];
const ZONE=[{n:'example.com',t:'A',ttl:3600,v:'192.0.2.1'},{n:'example.com',t:'NS',ttl:86400,v:'ns1.example.com'},{n:'example.com',t:'MX',ttl:3600,v:'10 mail.example.com'},{n:'example.com',t:'TXT',ttl:3600,v:'"v=spf1 mx -all"'},{n:'ns1.example.com',t:'A',ttl:86400,v:'192.0.2.53'},{n:'www.example.com',t:'CNAME',ttl:3600,v:'web.example.com'},{n:'web.example.com',t:'A',ttl:300,v:'192.0.2.80'},{n:'web.example.com',t:'AAAA',ttl:300,v:'2001:db8::80'},{n:'mail.example.com',t:'A',ttl:3600,v:'192.0.2.25'},{n:'80.2.0.192.in-addr.arpa',t:'PTR',ttl:3600,v:'web.example.com'}];
const RRT=[['A','Name to IPv4 address'],['AAAA','Name to IPv6 address'],['NS','Name server of a zone'],['CNAME','Canonical name (an alias)'],['MX','Mail server of a domain, with a preference number (lower is first)'],['PTR','Address to name (reverse lookup, in in-addr.arpa)'],['SOA','Start of authority: the zone parameters (serial number, refresh times)'],['TXT','Free text, used for example by mail authentication (SPF)']];
function dnsQuery(name,type){name=name.trim().toLowerCase().replace(/\.$/,'');const out=[];let cur=name,hops=0;
  while(hops++<5){const exact=ZONE.filter(z=>z.n===cur&&z.t===type);if(exact.length){exact.forEach(z=>out.push(z));return {rc:'NOERROR',out}}
    const cn=ZONE.find(z=>z.n===cur&&z.t==='CNAME');if(cn&&type!=='CNAME'){out.push(cn);cur=cn.v;continue}break}
  if(out.length)return {rc:'NOERROR',out};
  return {rc:ZONE.some(z=>z.n===name)?'NOERROR (no data of this type)':'NXDOMAIN (the name does not exist)',out}}
function dnsSteps(mode,cache){const it=mode==='i',S=[];
  const q=(t,hl,tag,done)=>S.push({cap:t,hl,tag,done});
  q(`<b>The application needs the address of www.example.com.</b> The host (the <b>stub resolver</b>) sends a <b>recursive query</b> to its local DNS server (set by DHCP). The host sends one query and waits for the final answer.`,[['Host','LDNS']],{Host:'query'},[]);
  if(cache==='a'){q(`<b>The local DNS server has the answer in its cache</b> (from an earlier query, and the TTL has not expired). It answers at once, with no query to any other server. The answer is marked as <i>non-authoritative</i>.`,[['Host','LDNS']],{LDNS:'cache hit'},['LDNS']);q(`<b>Done.</b> 2 messages in all. The host can open a TCP connection to the address.`,[['Host','LDNS']],{Host:'address'},['LDNS','Host']);return S}
  let used=0;
  if(it){
   if(cache!=='t'){q(`<b>Query to a root server.</b> The local server asks a root server (it knows the addresses of the 13 root server groups). Iterative: the root will not find the answer for it.`,[['LDNS','Root']],{LDNS:'ask root'},[]);used++;
     q(`<b>Referral.</b> The root server does not know the address. It answers with the name servers of the <b>.com</b> top-level domain (an NS record and its address).`,[['LDNS','Root']],{Root:'refer to .com'},['Root']);used++}
   q(`<b>Query to the TLD server.</b> The local server asks a .com server.`+(cache==='t'?' (The addresses of the .com servers were in the cache, so the root server was skipped.)':''),[['LDNS','TLD']],{LDNS:'ask .com'},cache==='t'?[]:['Root']);used++;
   q(`<b>Referral.</b> The .com server sends the name servers of <b>example.com</b>.`,[['LDNS','TLD']],{TLD:'refer to example.com'},cache==='t'?['TLD']:['Root','TLD']);used++;
   q(`<b>Query to the authoritative server</b> of example.com.`,[['LDNS','Auth']],{LDNS:'ask example.com'},['Root','TLD']);used++;
   q(`<b>The answer.</b> The authoritative server returns the A record with the address. Its TTL tells how long it may be cached. The local server stores it.`,[['LDNS','Auth']],{Auth:'A record, TTL'},['Root','TLD','Auth']);used++}
  else{
   if(cache!=='t'){q(`<b>Recursive query to the root.</b> The local server asks the root, and the root takes over the task of finding the answer.`,[['LDNS','Root']],{LDNS:'ask root'},[]);used++;q(`<b>The root passes the query on</b> to the .com server.`,[['Root','TLD']],{Root:'ask .com'},['Root']);used++}
   else{q(`<b>Recursive query to the .com server</b> (known from the cache). The .com server takes over the task.`,[['LDNS','TLD']],{LDNS:'ask .com'},[]);used++}
   q(`<b>The .com server passes the query on</b> to the authoritative server of example.com.`,[['TLD','Auth']],{TLD:'ask example.com'},cache==='t'?[]:['Root','TLD']);used++;
   q(`<b>The answer goes back</b> from the authoritative server to the .com server.`,[['TLD','Auth']],{Auth:'A record'},['Root','TLD','Auth']);used++;
   q(`<b>The answer is passed back</b> along the same path to the local server.`,cache==='t'?[['LDNS','TLD']]:[['LDNS','Root'],['Root','TLD']],{TLD:'A record'},['Root','TLD','Auth']);used+=cache==='t'?1:2}
  q(`<b>The local server answers the host</b> and keeps the record in its cache until the TTL expires.`,[['Host','LDNS']],{LDNS:'answer'},['Root','TLD','Auth','LDNS']);

lesson({nav:"13. DNS",title:"Application layer: the Domain Name System",syl:"Application Layer: DNS",
html:()=>`
${GUIDE({"syl":"Application Layer: DNS","why":"People use names such as www.example.com. Packets need IP addresses. The Domain Name System (DNS) turns one into the other. Almost every application uses it first, so it is among the most important services of the Internet.","map":[["13.1","The need for DNS","Why not a file of names?","Read the reasons."],["13.2","The name space","How are names organised?","Read the hierarchy."],["13.3","Name resolution","How is a name found?","Step through iterative and recursive resolution with and without a cache."],["13.4","Resource records","What does a server store?","Query the example zone."],["13.5","Messages and caching","What does a DNS message look like?","Click the header fields."]],"osi":"Layer 7 (application layer). DNS uses UDP port 53 (TCP port 53 for large answers and zone transfers).","pre":"Lessons 1 and 2 (ports and UDP); Unit IV, Lesson 5 (IP addresses).","time":"about 1 hour 15 minutes","next":"Lesson 14, SNMP."})}
${LEARN(["explain why DNS is needed and why it is distributed","describe the hierarchy of the name space and read a domain name","trace iterative and recursive resolution and the effect of the cache","name the resource record types and query a zone","read the DNS message header"])}
${SEC("13.1","The need for DNS")}
<p>Computers communicate by IP addresses, but users remember names. In the early Internet one file, <code>hosts.txt</code>, held all the names and addresses. A copy was sent to every host. When the network grew, this was impossible: the file was too large, it changed all the time, and one central place could not serve all the hosts. The <b>Domain Name System</b> replaced it with a <b>distributed database</b>. Many servers each hold a part. The system has no single point of failure and it scales to all the hosts of the Internet.</p>
${DEF("DNS (Domain Name System, RFC 1034 and 1035)","is a distributed database of names and a protocol that lets hosts look up the data. Its main service is to translate a host name into an IP address. Other services: aliases for hosts (CNAME), the mail server of a domain (MX), reverse lookup from an address to a name, and load distribution (several addresses for one name).")}
${SEC("13.2","The name space")}
<p>Names are arranged in a <b>tree</b> with the <b>root</b> at the top. A name is read from the <b>right to the left</b>, from the root to the host. The labels are separated by dots. A name that is complete up to the root, such as <code>www.example.com.</code> (with the last dot for the root), is a <b>fully qualified domain name (FQDN)</b>.</p>
<table class="dt gt cmpt"><thead><tr><th>Level</th><th>Example</th><th>Who manages it</th></tr></thead><tbody>
<tr><td><b>Root</b></td><td>. (dot)</td><td>13 groups of root servers (names a to m), operated by 12 organisations, with hundreds of copies all over the world</td></tr>
<tr><td><b>Top-level domain (TLD)</b></td><td>com, org, edu, in, uk</td><td>Generic TLDs (com, org, net) and country code TLDs (in, uk, jp), each with registry servers</td></tr>
<tr><td><b>Second-level domain</b></td><td>example.com</td><td>The organisation that registered the name</td></tr>
<tr><td><b>Subdomain and host</b></td><td>www.example.com</td><td>The same organisation</td></tr></tbody></table>
<p>A <b>zone</b> is the part of the tree for which one set of servers is responsible. The <b>authoritative name servers</b> of a zone hold the real records. A domain can be divided into several zones, and the responsibility for each is given to a different server (delegation). Every zone has a primary server and one or more secondary servers that copy the data from it (a <b>zone transfer</b>, over TCP).</p>
${SEC("13.3","Name resolution")}
<p>The software that asks the DNS is the <b>resolver</b>. The host has a small <b>stub resolver</b> that sends the question to a <b>local DNS server</b> (the address is given by DHCP), also called the recursive resolver. The local server does the work. There are two ways to ask a server.</p>
<ul><li><b>Recursive query.</b> The server must give the final answer (or an error). If it does not know, it finds the answer for the client. The host always uses a recursive query to its local server.</li>
<li><b>Iterative query.</b> The server answers with the best information that it has: either the answer or a <b>referral</b> to another server that is closer to the answer. The client then asks that server itself.</li></ul>
<p>In practice the local server uses iterative queries to the root, the TLD and the authoritative servers, as this keeps the load on the top servers low. Select the style and the state of the cache and step through the resolution of <code>www.example.com</code>.</p>
<div class="vis"><div class="row"><span>Servers query each other in ${seg("dmg",[["i","iterative style"],["r","recursive style"]])}</span><span>The cache of the local server ${seg("dcg",[["n","is empty"],["t","knows the .com servers"],["a","has the answer"]])}</span></div><svg id="dv" role="img" aria-label="DNS resolution"></svg><div id="dvs"></div></div>
${DOIT(["Select the iterative style with an empty cache. Count the messages: 8. The local server contacts the root, the .com server and the authoritative server in turn.","Select the cache with the .com servers. The root server is not needed, and 6 messages are used.","Select the cache with the answer. Only 2 messages are used. This is why caching is the main reason that the root servers can serve the whole Internet.","Select the recursive style. The root server now has to ask the next server for the local server. The number of messages is the same, but the top servers carry more work."])}
${SEC("13.4","Resource records")}
<p>The servers store <b>resource records (RR)</b>. A record has five parts: <b>name</b>, <b>TTL</b> (time to live in seconds, how long the answer may be cached), <b>class</b> (IN for the Internet), <b>type</b> and <b>value</b>.</p>
<table class="dt gt cmpt"><thead><tr><th>Type</th><th>Meaning</th></tr></thead><tbody>${RRT.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td></tr>`).join('')}</tbody></table>
<p>The table shows the zone of a small organisation. Ask a question in the box.</p>
<div class="vis"><table class="dt cmpt"><thead><tr><th>Name</th><th>TTL</th><th>Type</th><th>Value</th></tr></thead><tbody>${ZONE.map(z=>`<tr><td>${z.n}</td><td>${z.ttl}</td><td>${z.t}</td><td>${z.v}</td></tr>`).join('')}</tbody></table>
<div class="row" style="margin-top:8px"><span>Name <input id="qn" value="www.example.com" size="26" aria-label="Name to query"></span><span>Type <select id="qt" aria-label="Record type"><option>A</option><option>AAAA</option><option>NS</option><option>CNAME</option><option>MX</option><option>PTR</option><option>TXT</option></select></span></div><div id="qr"></div></div>
${DOIT(["Ask for www.example.com of type A. The name is an alias (CNAME) for web.example.com, so the answer has both the CNAME record and the A record.","Ask for example.com of type MX. The answer has the preference number 10 and the name of the mail server (Lesson 12).","Ask for 80.2.0.192.in-addr.arpa of type PTR. This is a <b>reverse lookup</b>: the address 192.0.2.80 is written backwards with in-addr.arpa.","Ask for nothing.example.com of type A and read the NXDOMAIN error."])}
${SEC("13.5","DNS messages and caching")}
<p>Query and response have the same format. DNS uses <b>UDP port 53</b> for most queries (one request, one reply, no handshake: the best fit for UDP, Lesson 2). If the answer is longer than allowed, the server sets the TC (truncated) flag and the client repeats the query over TCP. The message has a 12-byte header and four sections: question, answer, authority and additional. Click a field of the header.</p>
<div class="vis"><div id="dh"></div><div id="dd" class="small" style="margin-top:8px;min-height:3em"></div></div>
<p><b>Caching.</b> Every server stores the answers that it gets, until the <b>TTL</b> runs out. A short TTL (300 s for web.example.com) allows quick changes. A long TTL (86400 s) saves traffic. The data in a cache is <b>non-authoritative</b>: it can be out of date until the TTL expires.</p>
<p><b>Security.</b> The plain DNS has no authentication, so a false answer can be given (cache poisoning). <b>DNSSEC</b> signs the records, so that a resolver can check them. <b>DNS over HTTPS (DoH)</b> and <b>DNS over TLS</b> encrypt the queries.</p>
${quiz("p13q1","A host asks its local DNS server for www.example.com. Which kind of query is this?",["Iterative","Recursive","Reverse","Authoritative"],1,"The local server must return the final answer, so the query is recursive.")}
${quiz("p13q2","Which record gives the mail server of a domain?",["A","NS","MX","PTR"],2,"MX (mail exchanger) records name the mail servers and their preference.")}
${quiz("p13q3","What does the TTL of a DNS record control?",["How many hops the query may take","How long the record may be kept in a cache","The size of the message","The port number"],1,"The TTL is the time in seconds for which a resolver may keep the record.")}
${EXAM(["Why was DNS introduced? Why is it distributed?","Explain the DNS name space with a diagram. What is an FQDN? What is a zone?","Differentiate iterative and recursive resolution. Show the steps for www.example.com.","How does caching reduce the load on the root servers?","List the DNS resource record types and their meanings.","Explain the format of a DNS message.","Why does DNS normally use UDP? When does it use TCP?","How is a reverse lookup done for the address 192.0.2.80? (Query PTR for 80.2.0.192.in-addr.arpa)"])}
${SUM(["DNS is a distributed hierarchical database that maps names to addresses and other data. It uses UDP port 53.","A name is read from right to left: host, domain, TLD, root. A zone is served by authoritative servers.","The host sends a recursive query to the local server. The local server usually uses iterative queries to the root, the TLD and the authoritative servers.","Resource records have a name, TTL, class, type and value. Caching with the TTL cuts the traffic and the delay."])}
`,

/* ===== Unit V Lesson 14: network management and SNMP ===== */
const MIB=[['1.3.6.1.2.1.1.1.0','sysDescr','OCTET STRING','Router R1, software 15.2','ro'],['1.3.6.1.2.1.1.3.0','sysUpTime','TimeTicks','123456','ro'],['1.3.6.1.2.1.1.5.0','sysName','OCTET STRING','R1','rw'],['1.3.6.1.2.1.2.1.0','ifNumber','INTEGER','2','ro'],['1.3.6.1.2.1.2.2.1.1.1','ifIndex.1','INTEGER','1','ro'],['1.3.6.1.2.1.2.2.1.1.2','ifIndex.2','INTEGER','2','ro'],['1.3.6.1.2.1.2.2.1.10.1','ifInOctets.1','Counter32','8123456','ro'],['1.3.6.1.2.1.2.2.1.10.2','ifInOctets.2','Counter32','4500','ro'],['1.3.6.1.2.1.2.2.1.16.1','ifOutOctets.1','Counter32','2200000','ro'],['1.3.6.1.2.1.4.3.0','ipInReceives','Counter32','99123','ro']];
const oidCmp=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const p=x[i]===undefined?-1:x[i],q=y[i]===undefined?-1:y[i];if(p!==q)return p<q?-1:1}return 0};
const SNMPM=[{f:0,t:1,label:'GetRequest  sysDescr.0  (to port 161)'},{f:1,t:0,label:'Response  sysDescr.0 = "Router R1, software 15.2"',cls:'ack'},{f:0,t:1,label:'SetRequest  sysName.0 = "Lab-R1"',cls:'retx'},{f:1,t:0,label:'Response  noError  (value changed)',cls:'ack'},{f:1,t:0,label:'Trap  linkDown ifIndex.2  (to port 162)',cls:'lost'}];
