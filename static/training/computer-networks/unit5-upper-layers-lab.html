lesson({nav:"14. Network management: SNMP",title:"Application layer: network management and SNMP",syl:"Application Layer: Network Management (SNMP)",
html:()=>`
${GUIDE({"syl":"Application Layer: Network Management (SNMP)","why":"A network has hundreds of routers, switches and servers. An administrator must know which are up, how busy they are and where the faults are. The Simple Network Management Protocol (SNMP) lets one program read and change the state of all of them with the same method.","map":[["14.1","Network management","What must be managed?","Read the five areas."],["14.2","The SNMP model","Which parts are involved?","Read the three parts: SMI, MIB, SNMP."],["14.3","SMI and MIB","How are objects named?","Walk through a small MIB."],["14.4","SNMP messages","Which operations exist?","Step through a Get, a Set and a Trap."],["14.5","Using the counters","How is the traffic of a link found?","Calculate a rate from two polls."]],"osi":"Layer 7 (application layer). SNMP uses UDP, port 161 for requests and port 162 for traps.","pre":"Lessons 2 (UDP) and 9 (data representation).","time":"about 1 hour 15 minutes","next":"Unit I and the rest of the course, or the revision of Unit V."})}
${LEARN(["list the areas of network management","name the manager, the agent, the SMI, the MIB and the SNMP protocol","read an object identifier and walk a MIB with GetNext","explain the SNMP operations and the trap","calculate a data rate from two counter readings"])}
${SEC("14.1","Network management")}
${DEF("Network management","is the work of monitoring, testing, configuring and repairing the devices of a network so that the network works as planned. The ISO model of network management has five functional areas (FCAPS).")}
<table class="dt gt cmpt"><thead><tr><th>Area</th><th>Task</th><th>Example</th></tr></thead><tbody><tr><td><b>Fault</b></td><td>Find, isolate and repair faults</td><td>A trap tells that a link is down</td></tr><tr><td><b>Configuration</b></td><td>Set up and change the settings of devices</td><td>Change the name of a router</td></tr><tr><td><b>Accounting</b></td><td>Measure the use of resources by users</td><td>Bytes sent by each department</td></tr><tr><td><b>Performance</b></td><td>Measure load, delay and loss</td><td>Link utilisation, errors</td></tr><tr><td><b>Security</b></td><td>Control access to the network</td><td>Who may read or change values</td></tr></tbody></table>
${SEC("14.2","The SNMP model")}
<p>SNMP is built from a <b>manager</b>, an <b>agent</b> and three standards.</p>
<ul><li><b>Manager (network management station, NMS):</b> the host that runs the management program. It asks questions and receives the alarms.</li>
<li><b>Agent:</b> a program in the managed device (router, switch, server, printer). It keeps the values and answers the manager.</li>
<li><b>SMI (Structure of Management Information):</b> the rules for naming objects and for their data types.</li>
<li><b>MIB (Management Information Base):</b> the collection of the objects of a device (counters, settings, tables). A manager reads and writes these objects.</li>
<li><b>SNMP:</b> the protocol that carries the requests and the responses between the manager and the agent.</li></ul>
<p>The manager sends requests to UDP port <b>161</b> of the agent. The agent sends unrequested alarm messages, called <b>traps</b>, to UDP port <b>162</b> of the manager. SNMP uses UDP because it is simple, it works even when the network is in trouble, and the manager can repeat a request.</p>
${SEC("14.3","SMI and MIB: names of objects")}
<p>Every object has a unique <b>object identifier (OID)</b>, a sequence of numbers separated by dots. The OIDs form a <b>tree</b>. The Internet standard MIB-2 is at <code>1.3.6.1.2.1</code> (iso.org.dod.internet.mgmt.mib-2). The name <code>sysDescr.0</code> is <code>1.3.6.1.2.1.1.1.0</code>. The last number <code>.0</code> is the instance of a single object. In a table the last number is the row (for example the interface number).</p>
<div class="vis"><div style="font:13px var(--mono);line-height:1.7">iso(1) &rarr; org(3) &rarr; dod(6) &rarr; internet(1) &rarr; mgmt(2) &rarr; mib-2(1)<br><span style="margin-left:2ch"></span>&boxur; system(1): sysDescr(1), sysUpTime(3), sysName(5)<br><span style="margin-left:2ch"></span>&boxur; interfaces(2): ifNumber(1), ifTable(2) &rarr; ifEntry(1) &rarr; ifIndex(1), ifInOctets(10), ifOutOctets(16)<br><span style="margin-left:2ch"></span>&boxur; ip(4): ipInReceives(3)</div></div>
<p>The SMI gives the data types: INTEGER, OCTET STRING (text), OBJECT IDENTIFIER, <b>IpAddress</b>, <b>Counter32</b> (increases, then wraps to 0 at 2<sup>32</sup>), <b>Gauge32</b> (goes up and down), <b>TimeTicks</b> (hundredths of a second). The values are encoded with <b>ASN.1 BER</b> (Basic Encoding Rules) as <b>type, length, value</b> (TLV): the integer 5 is <code>02 01 05</code>, and the text "R1" is <code>04 02 52 31</code>. This is an example of the data conversion of the presentation layer (Lesson 9).</p>
<p>Use the tool as a manager. The agent has the MIB below. <b>Get</b> reads the object with exactly this OID. <b>GetNext</b> returns the next object in the OID order, so a manager can <b>walk</b> through a MIB without knowing the names. <b>Set</b> changes an object, but only if it is writable (only sysName is). Counters here are fixed.</p>
<div class="vis"><table class="dt cmpt"><thead><tr><th>OID</th><th>Name</th><th>Type</th><th>Value</th><th>Access</th></tr></thead><tbody>${MIB.map(m=>`<tr><td><code>${m[0]}</code></td><td>${m[1]}</td><td>${m[2]}</td><td>${m[3]}</td><td>${m[4]==='rw'?'read-write':'read-only'}</td></tr>`).join('')}</tbody></table>
<div class="row" style="margin-top:8px"><span>OID <input id="so" value="1.3.6.1.2.1.1" size="26" aria-label="OID" style="font-family:var(--mono)"></span><span>New value (for Set) <input id="sv" value="Lab-R1" size="10" aria-label="Value"></span></div><div class="row"><button type="button" class="btn pri sm" id="sg">Get</button><button type="button" class="btn sm" id="sn">GetNext</button><button type="button" class="btn sm" id="ss2">Set</button><button type="button" class="btn sm" id="sw">Walk the whole MIB</button><button type="button" class="btn sm" id="sc">Clear</button></div><pre class="code" id="slog" style="white-space:pre-wrap;max-height:260px;overflow:auto;min-height:60px"></pre></div>
${DOIT(["Press GetNext with the starting OID 1.3.6.1.2.1.1. The reply is sysDescr.0, the first object after that OID. Press it again with the OID of the reply to move on.","Press Walk. The tool repeats GetNext until the end of the MIB. This is how snmpwalk works.","Press Get with an OID that does not exist, such as 1.3.6.1.2.1.1.2.0. The agent returns noSuchName.","Set the OID 1.3.6.1.2.1.1.5.0 with a new value and press Set. It works. Try Set on sysDescr and read the error."])}
${SEC("14.4","SNMP messages")}
<p>An SNMP message has a <b>version</b>, a <b>community string</b> (a password in v1 and v2c) and a <b>PDU</b>. A PDU has a <b>type</b>, a <b>request identifier</b> (to match the reply), an <b>error status</b>, an <b>error index</b> and a list of <b>variable bindings</b> (OID and value pairs).</p>
<table class="dt gt cmpt"><thead><tr><th>PDU</th><th>From</th><th>Purpose</th></tr></thead><tbody>
<tr><td><b>GetRequest</b></td><td>Manager</td><td>Read the value of one or more objects</td></tr>
<tr><td><b>GetNextRequest</b></td><td>Manager</td><td>Read the next object in the MIB order (walk a table)</td></tr>
<tr><td><b>GetBulkRequest</b> (v2)</td><td>Manager</td><td>Read many objects in one request</td></tr>
<tr><td><b>SetRequest</b></td><td>Manager</td><td>Change the value of an object</td></tr>
<tr><td><b>Response</b></td><td>Agent</td><td>The answer to a request, with the values or an error</td></tr>
<tr><td><b>Trap</b></td><td>Agent</td><td>An unrequested alarm (for example a link went down, a restart). No reply.</td></tr>
<tr><td><b>InformRequest</b> (v2)</td><td>Agent or manager</td><td>An alarm that must be acknowledged</td></tr></tbody></table>
<div class="vis"><svg id="nv" role="img" aria-label="SNMP exchange"></svg><div id="nvs"></div></div>
<p><b>Versions.</b> SNMPv1 (1988) is simple and has no real security. SNMPv2c adds GetBulk and 64-bit counters but still sends the community string in clear text. <b>SNMPv3</b> adds authentication of the sender, protection of the content (encryption) and access control for users.</p>
<p><b>Polling and traps.</b> The manager <b>polls</b> the agents at intervals to collect counters. The agents send <b>traps</b> for events, so that a fault is seen at once. Using both gives a good picture with little traffic.</p>
${SEC("14.5","Using the counters: the rate of a link")}
<p>A counter such as <code>ifInOctets</code> counts the bytes received since the start. To find the traffic, the manager reads it twice and divides the difference by the time. A Counter32 wraps at 4,294,967,296, so if the second value is smaller, 2<sup>32</sup> is added to the difference.</p>
<div class="vis"><div class="row"><span>First reading <input type="number" id="c1" value="8123456" min="0" max="4294967295" style="width:130px" aria-label="First reading"></span><span>Second reading <input type="number" id="c2" value="9373456" min="0" max="4294967295" style="width:130px" aria-label="Second reading"></span><span>Interval <input type="number" id="ci" value="10" min="1" style="width:70px" aria-label="Interval"> s</span><span>Link speed <input type="number" id="cs" value="100" min="1" style="width:70px" aria-label="Link speed"> Mbit/s</span></div><div id="cr"></div></div>
${DOIT(["The defaults give 1,250,000 bytes in 10 s: 1 Mbit/s, which is 1% of a 100 Mbit/s link.","Enter 4294960000 as the first reading and 5000 as the second. The counter wrapped, and the tool adds 2^32.","Change the interval to 300 s (a usual polling interval of 5 minutes) and see the rate."])}
${quiz("p14q1","On which UDP port does an SNMP agent receive requests?",["25","53","161","162"],2,"Agents listen on port 161. Managers receive traps on port 162.")}
${quiz("p14q2","Which operation lets a manager read a whole table without knowing the names of the objects?",["Get","Set","GetNext (walk)","Trap"],2,"GetNext returns the next object, so repeating it goes through the MIB.")}
${quiz("p14q3","An agent sends a message without being asked, because a link went down. What is it?",["Response","Trap","GetRequest","SetRequest"],1,"A trap is an unrequested alarm from the agent to the manager (port 162).")}
${EXAM(["List the five areas of network management.","Explain the model of SNMP: manager, agent, SMI, MIB and SNMP.","What is an object identifier? Write the OID of sysDescr.0. (1.3.6.1.2.1.1.1.0)","Explain the SNMP PDUs. What is a trap?","How does GetNext help to read a table?","Why does SNMP use UDP? Which ports does it use?","Compare SNMPv1, v2c and v3.","Two readings of ifInOctets are 1,000,000 and 3,500,000, 20 seconds apart. Find the rate. (2,500,000 bytes x 8 / 20 s = 1 Mbit/s)"])}
${SUM(["SNMP has a manager, agents, the SMI (naming and types), the MIB (objects) and the protocol. It uses UDP ports 161 (requests) and 162 (traps).","Objects have OIDs in a tree. MIB-2 is at 1.3.6.1.2.1. Values are encoded with ASN.1 BER.","The operations are Get, GetNext, GetBulk, Set, Response and Trap. The manager polls and the agent sends traps.","The rate of a link is the difference of two counter readings (allowing for the wrap) divided by the time."])}
`,
mount(r){
  const lg=$("#slog",r),P=t=>{lg.textContent+=t+'\n';lg.scrollTop=lg.scrollHeight};
  const fmt=m=>`${m[0]} (${m[1]}) = ${m[2]}: ${m[3]}`;
  $("#sg",r).onclick=()=>{const o=$("#so",r).value.trim(),m=MIB.find(x=>x[0]===o);P('GetRequest  '+o);P(m?'  Response: '+fmt(m):'  Response: error noSuchName (no object with this OID)')};
  $("#sn",r).onclick=()=>{const o=$("#so",r).value.trim();if(!/^\d+(\.\d+)*$/.test(o)){P('GetNextRequest  '+o);P('  Response: error (not a valid OID)');return}const m=MIB.find(x=>oidCmp(x[0],o)>0);P('GetNextRequest  '+o);if(m){P('  Response: '+fmt(m));$("#so",r).value=m[0]}else P('  Response: endOfMibView (no object after this OID)')};
  $("#ss2",r).onclick=()=>{const o=$("#so",r).value.trim(),v=$("#sv",r).value,m=MIB.find(x=>x[0]===o);P('SetRequest  '+o+' = '+v);if(!m)P('  Response: error noSuchName');else if(m[4]!=='rw')P('  Response: error notWritable ('+m[1]+' is read-only)');else{m[3]=v;P('  Response: noError. '+m[1]+' is now '+v);const tb=$$('tbody tr',r).find(tr=>tr.cells[0]&&tr.cells[0].textContent===o);if(tb)tb.cells[3].textContent=v}};
  $("#sw",r).onclick=()=>{let o='1.3.6.1.2.1',n=0;P('Walk from '+o);while(n++<30){const m=MIB.find(x=>oidCmp(x[0],o)>0);if(!m){P('  endOfMibView');break}P('  GetNext -> '+fmt(m));o=m[0]}$("#so",r).value=o};
  $("#sc",r).onclick=()=>{lg.textContent=''};
  const ns=story(r,"#nvs",{draw:i=>seqd($("#nv",r),{actors:['Manager (NMS)','Agent in router R1'],msgs:SNMPM,rowH:40,L:140},i)});
  ns.set([{cap:'<b>GetRequest.</b> The manager asks for sysDescr.0. It sends the community string and a request id in the UDP datagram to port 161 of the agent.'},{cap:'<b>Response.</b> The agent returns the same request id and the variable binding: the OID with its value. The error status is noError.'},{cap:'<b>SetRequest.</b> The manager changes the name of the router. The agent checks that the object is writable and that the community string allows writing.'},{cap:'<b>Response.</b> noError. The new value is now in the agent. A set that is not allowed gives an error status (for example notWritable).'},{cap:'<b>Trap.</b> The interface 2 goes down. The agent sends a trap on its own, without a request, to port 162 of the manager. There is no reply, because a trap is not acknowledged. (An Inform is the same, but it is acknowledged.)'}]);
  const cc=()=>{const a=+$("#c1",r).value,b=+$("#c2",r).value,t=+$("#ci",r).value,s=+$("#cs",r).value;if(!(t>0&&s>0))return;const w=b<a,d=w?b+4294967296-a:b-a,bps=d*8/t;
    $("#cr",r).innerHTML=KV([['Difference',`${w?b+' + 4,294,967,296 - '+a:b+' - '+a} = <b>${d.toLocaleString('en-US')} bytes</b>${w?' (the counter wrapped)':''}`],['Rate',`${d.toLocaleString('en-US')} x 8 / ${t} s = <b>${(bps/1e6).toFixed(3)} Mbit/s</b>`],['Utilisation',`${(bps/(s*1e6)*100).toFixed(2)}% of ${s} Mbit/s`]])};
  ['#c1','#c2','#ci','#cs'].forEach(s=>$(s,r).oninput=cc);cc();
}});

function renderLive(){$("#livebox").innerHTML=`<p class="small muted" style="margin:0 0 8px">Quick reference, Unit V.</p><h4 style="margin:12px 0 6px">Transport layer (layer 4)</h4><div class="code">Port: 16 bits. Socket = IP + port\nWell-known 0-1023, ephemeral 49152+\nUDP header 8 bytes, TCP header 20+ bytes</div><h4 style="margin:12px 0 6px">TCP</h4><div class="code">Handshake: SYN, SYN+ACK, ACK\nClose: FIN, ACK, FIN, ACK\nWindow = min(rwnd, cwnd)\nSlow start: cwnd doubles per RTT\nAvoidance: cwnd + 1 MSS per RTT\nLoss: ssthresh = cwnd / 2\nRTO = SRTT + 4 x RTTVAR</div><h4 style="margin:12px 0 6px">Application layer</h4><div class="code">HTTP 80, HTTPS 443, FTP 21/20\nSSH 22, SMTP 25, IMAP 143\nDNS 53, SNMP 161/162</div>`}

renderLive();go(0);
