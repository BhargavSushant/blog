lesson({nav:"4. TCP: reliability of data transfer",title:"TCP: reliability of data transfers",syl:"TCP (Reliability of Data Transfers)",
html:()=>`
${GUIDE({"syl":"TCP (Reliability of Data Transfers)","why":"IP can lose, duplicate, delay and reorder packets. TCP builds a reliable byte stream on top of it. It uses sequence numbers, acknowledgements, a checksum and retransmission. This lesson shows how each of them works.","map":[["4.1","What reliable means","What must TCP guarantee?","Read the list."],["4.2","Sequence and acknowledgement numbers","How are bytes numbered and confirmed?","Use the segment calculator."],["4.3","Error control","How are damaged, lost, duplicate and out-of-order segments handled?","Read the rules."],["4.4","Retransmission","When does TCP send a segment again?","Step through four cases."],["4.5","Comparison with ARQ","How is it related to Unit II?","Read the table."]],"osi":"Layer 4 (transport layer).","pre":"Lesson 3 (connection); Unit II (ARQ, Go-Back-N, Selective Repeat).","time":"about 1 hour 30 minutes","next":"Lesson 5, flow control."})}
${LEARN(["explain how TCP numbers bytes and how it acknowledges them","list how TCP handles damaged, lost, duplicate and out-of-order segments","explain the two events that cause a retransmission","trace a transfer with a lost segment and a lost acknowledgement","compare TCP with Go-Back-N and Selective Repeat"])}
${SEC("4.1","What reliable means")}
<p>TCP gives the application a stream of bytes with these properties: <b>no byte is lost</b>, <b>no byte is duplicated</b>, <b>no byte is damaged</b> and the bytes arrive <b>in the same order</b> in which they were sent. TCP does this over IP, which gives none of these guarantees. Four tools are used: a <b>checksum</b> (to find damage), <b>sequence numbers</b> (to find loss, duplicates and disorder), <b>acknowledgements</b> (to confirm) and <b>retransmission</b> (to repair).</p>
${SEC("4.2","Sequence numbers and acknowledgement numbers")}
<ul><li><b>Sequence number</b> (32 bits). TCP numbers every byte of the stream, starting at the ISN chosen at the connection set-up (plus 1 for the SYN). The sequence number in a segment is the number of its <b>first data byte</b>. The numbers wrap round after 2<sup>32</sup> - 1.</li>
<li><b>Acknowledgement number</b> (32 bits). It is the number of the <b>next byte that the receiver expects</b>. It confirms that all bytes before it have arrived. This is a <b>cumulative acknowledgement</b>. It is valid only if the ACK flag is set.</li></ul>
<p>A segment with n data bytes and sequence number s will be acknowledged by an ACK with ack = s + n. Use the calculator for a transfer.</p>
<div class="vis"><div class="row"><span>First data byte (ISN + 1) <input type="number" id="sq1" value="1" min="0" max="4294967295" style="width:130px" aria-label="First byte number"></span><span>Bytes to send <input type="number" id="sq2" value="5000" min="1" max="100000" style="width:90px" aria-label="Bytes"></span><span>MSS <input type="number" id="sq3" value="1460" min="100" max="9000" style="width:80px" aria-label="MSS"></span></div><div id="sqr"></div></div>
${DOIT(["With the default values the data is cut in 3 full segments of 1460 bytes and one of 620 bytes. The next segment number is the previous number plus the length.","Enter 4294966000 as the first byte. The sequence numbers wrap round to 0 after 4294967295.","Set MSS to 500. Count the segments."])}
<p>The <b>maximum segment size (MSS)</b> is the largest amount of data in one segment. It is announced in the SYN segments. On Ethernet the MTU is 1500 bytes, minus 20 bytes of IP header and 20 bytes of TCP header, so MSS = 1460 bytes.</p>
${SEC("4.3","Error control")}
<table class="dt gt cmpt"><thead><tr><th>Problem</th><th>How TCP finds it</th><th>What TCP does</th></tr></thead><tbody>
<tr><td><b>Damaged segment</b></td><td>The 16-bit checksum does not match (the same method as in UDP, with a pseudo-header)</td><td>Discards the segment. No ACK is sent, so the sender will retransmit.</td></tr>
<tr><td><b>Lost segment</b></td><td>A gap in the sequence numbers (receiver). No ACK before the timer expires (sender).</td><td>The sender retransmits it.</td></tr>
<tr><td><b>Duplicate segment</b></td><td>The sequence number is below the next expected number, or already buffered</td><td>Discards it and sends an ACK again.</td></tr>
<tr><td><b>Out-of-order segment</b></td><td>The sequence number is above the next expected number</td><td>Stores it in the buffer. Sends a duplicate ACK for the byte that is missing. Delivers to the application only when the gap is filled.</td></tr>
<tr><td><b>Lost ACK</b></td><td>The sender gets no ACK</td><td>A later cumulative ACK covers it. If none comes, the timer causes a retransmission.</td></tr></tbody></table>
<p><b>Rules for sending ACKs</b> (RFC 5681): (1) when data arrives in order, wait up to 500 ms for a second segment and send one ACK for both (<b>delayed ACK</b>); an ACK must be sent for every second full-sized segment at least; (2) when a segment arrives out of order, send a <b>duplicate ACK</b> at once; (3) when a segment fills a gap, send the cumulative ACK at once.</p>
<p><b>Selective acknowledgement (SACK).</b> The cumulative ACK says only "up to byte n". With the SACK option (negotiated in the SYN) the receiver also lists blocks of bytes that arrived after the gap. The sender then retransmits only the missing bytes.</p>
${SEC("4.4","Retransmission")}
<p>TCP retransmits a segment in two cases.</p>
<ol><li><b>Retransmission time-out (RTO).</b> The sender has a timer for the oldest unacknowledged segment. If the ACK does not arrive before the timer expires, the segment is sent again. The value of the RTO is calculated from the measured round-trip time (Lesson 7).</li>
<li><b>Three duplicate ACKs (fast retransmit).</b> If the sender gets three duplicate ACKs (four ACKs with the same number), it concludes that the segment after that number is lost. It retransmits it at once, without waiting for the timer.</li></ol>
<p>Select a case and step through it. The time runs downward. The note at the right gives the next byte that the receiver expects.</p>
<div class="vis"><div class="row">${seg("rsg",[["n","Normal, delayed ACK"],["t","Lost segment, time-out"],["f","Lost segment, fast retransmit"],["a","Lost ACK"]])}</div><div class="small muted" id="rsn"></div><svg id="rv" role="img" aria-label="TCP data transfer"></svg><div id="rvs"></div></div>
${DOIT(["Compare the time-out case and the fast retransmit case. In the fast retransmit case the repair starts after the third duplicate ACK, not after the timer. In practice the RTO is much longer than one round trip, so fast retransmit saves a lot of time.","In the lost-ACK case no segment is sent twice. Think about what would happen if the ACK for segment 2 was lost too."])}
${SEC("4.5","TCP compared with the ARQ protocols of Unit II")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Go-Back-N</th><th>Selective Repeat</th><th>TCP</th></tr></thead><tbody>
<tr><td>Acknowledgement</td><td>Cumulative</td><td>Individual</td><td>Cumulative (plus optional SACK)</td></tr>
<tr><td>Receiver stores out-of-order data</td><td>No (discards)</td><td>Yes</td><td>Yes</td></tr>
<tr><td>Numbering</td><td>Frames</td><td>Frames</td><td><b>Bytes</b></td></tr>
<tr><td>Retransmission</td><td>The lost frame and all after it</td><td>Only the lost frame</td><td>Normally only the first missing segment</td></tr>
<tr><td>Timers</td><td>One (oldest frame)</td><td>One for each frame</td><td>One (oldest segment)</td></tr>
<tr><td>Window</td><td>Fixed</td><td>Fixed</td><td>Changes (flow and congestion control)</td></tr></tbody></table>
<p>TCP is a mixture: it uses cumulative ACKs as Go-Back-N does, and it buffers out-of-order segments as Selective Repeat does.</p>
${quiz("p4q1","A segment has sequence number 4001 and carries 500 bytes. What acknowledgement number confirms it?",["4001","4500","4501","5001"],2,"ack = sequence number + number of data bytes = 4001 + 500 = 4501.")}
${quiz("p4q2","When does the TCP sender start a fast retransmit?",["When the timer expires","After 3 duplicate ACKs","When the window is zero","When the connection opens"],1,"Three duplicate ACKs show that a later segment arrived while one is missing.")}
${quiz("p4q3","The ACK of segment 1 is lost, but the ACK of segment 2 arrives in time. What does the sender do?",["Retransmits segment 1","Retransmits segment 2","Nothing for these segments, because the ACK is cumulative","Closes the connection"],2,"ack = 2001 confirms all earlier bytes, so segment 1 is also confirmed.")}
${EXAM(["How does TCP provide reliable delivery over IP?","What is the meaning of the sequence number and the acknowledgement number in TCP? A segment with seq = 7001 carries 1000 bytes. What is the ACK? (8001)","Explain the two events that cause TCP to retransmit a segment.","What is a duplicate ACK? Explain fast retransmit.","Explain delayed ACK and selective ACK.","A file of 10,000 bytes is sent with MSS 1460 and first sequence number 1. How many segments are needed and what are their sequence numbers? (7 segments: 1, 1461, 2921, 4381, 5841, 7301, 8761; the last carries 1240 bytes.)","Compare TCP with Go-Back-N and Selective Repeat."])}
${SUM(["TCP numbers every byte. The ACK number is the next byte expected (cumulative).","Damaged segments are discarded, lost segments are retransmitted, duplicates are dropped and out-of-order segments are buffered.","A segment is retransmitted when the RTO expires or when three duplicate ACKs arrive.","TCP is a mixture of Go-Back-N (cumulative ACK) and Selective Repeat (buffering at the receiver)."])}
`,
mount(r){
  const sq=()=>{let s=Math.max(0,Math.floor(+$("#sq1",r).value||0)),n=Math.max(1,Math.floor(+$("#sq2",r).value||1)),m=Math.max(1,Math.floor(+$("#sq3",r).value||1460)),rows=[],left=n,k=1;
    while(left>0&&k<=40){const l=Math.min(m,left),sn=s%4294967296,an=(s+l)%4294967296;rows.push(`<tr><td>${k}</td><td>${sn}</td><td>${l}</td><td>${sn} to ${(s+l-1)%4294967296}</td><td>${an}</td></tr>`);s+=l;left-=l;k++}
    $("#sqr",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Segment</th><th>Sequence number</th><th>Data bytes</th><th>Bytes carried</th><th>ACK that confirms it</th></tr></thead><tbody>${rows.join('')}</tbody></table><div class="small muted">${Math.ceil(n/m)} segment${Math.ceil(n/m)>1?'s':''} for ${n} bytes.${left>0?' (Only the first 40 are shown.)':''}</div>`};
  ['#sq1','#sq2','#sq3'].forEach(s=>$(s,r).oninput=sq);sq();
  let rst=null;const rb=k=>{const c=RSC[k];$("#rsn",r).textContent=c.name+'. Sender on the left, receiver on the right. Segments of 1000 bytes are used to keep the numbers short.';
    rst=story(r,"#rvs",{draw:i=>seqd($("#rv",r),{actors:['Sender','Receiver'],msgs:c.M,rowH:36},i)});rst.set(c.S.map(x=>({cap:x})))};
  bindSeg(r,"rsg",rb);rb('n');
}});

/* ===== Unit V Lesson 5: TCP flow control ===== */
function flowSim(B,R,MSS){let s=1,used=0,wadv=B,M=[],buf=[],cap=[];const P=(m,c)=>{M.push(m);buf.push(used);cap.push(c)};
  for(let rd=1;rd<=2;rd++){const n=Math.floor(wadv/MSS);
    for(let k=0;k<n;k++){used+=MSS;P({f:0,t:1,label:`seq=${s}  (${MSS} B)`},k===0?`<b>Round ${rd}: the sender sends ${n} segment${n>1?'s':''}.</b> The window that the receiver advertised is ${wadv} bytes, so it may send ${n} segment${n>1?'s':''} of ${MSS} bytes without waiting. Segment seq = ${s} arrives and fills the receiver buffer.`:`<b>Segment seq = ${s}</b> arrives. The buffer holds ${used} of ${B} bytes.`);s+=MSS}
    wadv=B-used;P({f:1,t:0,label:`ACK ack=${s}  win=${wadv}`,cls:'ack',nr:`buffer free: ${wadv}`},wadv===0?`<b>Zero window.</b> The receiver acknowledges all the bytes (ack = ${s}) and advertises <b>win = 0</b>: its buffer is full. The sender must stop. It starts the persist timer (Lesson 7).`:`<b>The receiver acknowledges</b> ack = ${s} and advertises win = ${wadv}, the free space in its buffer.`);
    const rd1=Math.min(R,used);used-=rd1;P({f:1,t:1,label:`application reads ${rd1} B`},`<b>The application reads ${rd1} bytes</b> from the receive buffer. This frees space. TCP does not send a window update at once unless the free space is large enough (at least one MSS, or half the buffer).`);
    wadv=B-used;P({f:1,t:0,label:`ACK ack=${s}  win=${wadv} (window update)`,cls:'retx',nr:`buffer free: ${wadv}`},`<b>Window update.</b> The receiver sends an ACK with the same ack number and a larger window, win = ${wadv}. The sender can continue.`)}
  return {M,buf,cap}}
lesson({nav:"5. TCP: flow control",title:"TCP flow control",syl:"TCP (Flow Control)",
html:()=>`
${GUIDE({"syl":"TCP (Flow Control)","why":"A fast sender can send data faster than a slow receiver can read it. Flow control stops the sender before the receiver's buffer overflows. TCP does this with a sliding window whose size the receiver announces in every segment.","map":[["5.1","Flow control and the receiver window","What does the receiver tell the sender?","Read the definitions."],["5.2","The sliding window","Which bytes may be sent?","Read the four zones."],["5.3","A flow control run","What happens when the buffer fills?","Change the buffer and the read size."],["5.4","Silly window syndrome","Why are tiny segments a problem?","Read the two remedies."],["5.5","Window and throughput","How large must the window be?","Use the calculator."]],"osi":"Layer 4 (transport layer).","pre":"Lessons 3 and 4; Unit II (sliding window).","time":"about 1 hour 15 minutes","next":"Lesson 6, congestion control."})}
${LEARN(["explain the difference between flow control and congestion control","explain the receiver window and the sliding window of TCP","trace a transfer with a zero window and a window update","explain silly window syndrome, Nagle's algorithm and Clark's solution","calculate the bandwidth-delay product and the throughput limited by the window"])}
${SEC("5.1","Flow control and the receiver window")}
${DEF("Flow control","is the method that keeps a sender from overflowing the buffer of a receiver. It deals with the speed of the receiving host, not with the network.")}
<p>Congestion control (Lesson 6) is different: it deals with the capacity of the <b>network</b>. Both limit the sender, but for different reasons.</p>
<p>The TCP receiver has a buffer. The application reads data from it, but possibly more slowly than the data arrives. In every segment that it sends, the receiver puts the <b>window size field</b> (16 bits). This is the <b>receiver window (rwnd)</b>: the number of bytes that the receiver can still store, that is, buffer size minus the bytes not yet read.</p>
<p>The sender must never have more than rwnd unacknowledged bytes in the network. This is flow control by the receiver, and it is why TCP is called a <b>sliding window</b> protocol. The window is in bytes, and it can grow and shrink during the connection. (In the ARQ protocols of Unit II the window was a fixed number of frames.)</p>
${SEC("5.2","The sliding window")}
<p>At any time the sender divides the byte stream into four zones.</p>
<div class="vis"><div style="display:flex;font:600 12px var(--mono);text-align:center;border:1px solid var(--line);border-radius:8px;overflow:hidden"><div style="flex:3;background:var(--good-soft);padding:10px 4px">1. Sent and acknowledged<br><span style="font-weight:400">can be removed from the buffer</span></div><div style="flex:3;background:var(--sec-soft);padding:10px 4px">2. Sent, not yet acknowledged<br><span style="font-weight:400">kept for retransmission</span></div><div style="flex:3;background:var(--pri-soft);padding:10px 4px">3. Not sent, allowed<br><span style="font-weight:400">inside the window</span></div><div style="flex:3;background:var(--surface2);padding:10px 4px">4. Not sent, not allowed<br><span style="font-weight:400">outside the window</span></div></div>
<div style="display:flex;font:12px var(--mono);margin-top:4px"><div style="flex:3;text-align:right;padding-right:4px">&#8593; SND.UNA</div><div style="flex:3;text-align:right;padding-right:4px">&#8593; SND.NXT</div><div style="flex:3;text-align:right;padding-right:4px">&#8593; SND.UNA + window</div><div style="flex:3"></div></div></div>
<ul><li>Zones 2 and 3 together are the <b>window</b>. Its size is <b>min(rwnd, cwnd)</b>. Here cwnd is the congestion window of Lesson 6.</li>
<li>When an ACK arrives, the left edge of the window moves right (it <b>slides</b>). If the ACK also carries a larger rwnd, the right edge moves right too.</li>
<li><b>Bytes that may still be sent</b> = window - bytes in flight (zone 2).</li>
<li>The window can <b>shrink</b> if the receiver announces a smaller value, but the right edge should not move to the left, because the sender may already have sent those bytes. When rwnd = 0, the sender stops (zero window).</li>
<li>The 16-bit field limits the window to 65,535 bytes. The <b>window scale option</b> (set in the SYN) multiplies the field by 2<sup>s</sup>, with s up to 14, to give a window up to about 1 GB.</li></ul>
${SEC("5.3","A flow control run")}
<p>The receiver has a buffer. The application reads from it in blocks. The sender is fast. Change the buffer size and the number of bytes that the application reads, then step through. The boxes under the picture show the receive buffer: a filled box is a segment that is waiting for the application.</p>
<div class="vis"><div class="row"><span>Receiver buffer <select id="fbf" aria-label="Receiver buffer"><option value="3000">3000 B</option><option value="4000" selected>4000 B</option><option value="6000">6000 B</option></select></span><span>The application reads <select id="frd" aria-label="Bytes read"><option value="1000">1000 B</option><option value="2000" selected>2000 B</option><option value="3000">3000 B</option></select> at a time</span><span class="small muted">Segment size 1000 B</span></div><svg id="fv" role="img" aria-label="Flow control with a window"></svg><div id="fbuf" style="display:flex;gap:4px;margin:6px 0;align-items:center"></div><div id="fvs"></div></div>
${DOIT(["Use the default values. The sender sends 4 segments and the receiver advertises win = 0. The sender has to wait until the window update comes.","Choose a 6000 B buffer. The first round sends 6 segments. The window is larger, so more data is in the network.","Choose 1000 B reads. The window update announces only 1000 B, so the sender can send one segment at a time. A slow application slows the sender."])}
<p>If the window update is lost, the sender would wait for ever, because the receiver thinks that it has already told the sender. TCP prevents this deadlock with the <b>persist timer</b>: while the window is zero, the sender sends a small <b>window probe</b> segment at intervals, and the receiver answers it with its current window (Lesson 7).</p>
${SEC("5.4","Silly window syndrome")}
<p>If the sender or the receiver handles very small amounts of data, many segments carry only a few bytes. A segment with 1 byte of data has 40 bytes of header (20 TCP and 20 IP). The efficiency is 1 / 41 = 2.4%. This is the <b>silly window syndrome</b>. It has two causes, and two remedies.</p>
<table class="dt gt cmpt"><thead><tr><th>Cause</th><th>Remedy</th></tr></thead><tbody>
<tr><td><b>The sender</b> produces data slowly (for example a keystroke at a time) and sends each byte at once.</td><td><b>Nagle's algorithm.</b> Send the first byte at once. Then collect data until either the first byte is acknowledged or a full MSS is ready, and send it as one segment. (Interactive programs may turn it off.)</td></tr>
<tr><td><b>The receiver</b> has a full buffer, the application reads 1 byte, and the receiver announces a window of 1 byte. The sender sends 1 byte, and so on.</td><td><b>Clark's solution.</b> The receiver does not announce a larger window until it can give at least min(MSS, buffer size / 2) bytes. It sends ACKs, but with win = 0 until then. A <b>delayed ACK</b> gives the application time to read and so helps too.</td></tr></tbody></table>
${SEC("5.5","Window size and throughput")}
<p>The sender can send at most one window of data in each round-trip time (RTT). So the throughput cannot be more than <b>window / RTT</b>, whatever the speed of the link. The amount of data that fills the link for one RTT is the <b>bandwidth-delay product (BDP)</b>.</p>
<div class="vis"><div class="row"><span>Link rate <input type="number" id="wb" value="100" min="1" max="100000" style="width:90px" aria-label="Link rate"> Mbit/s</span><span>RTT <input type="number" id="wr" value="50" min="1" max="2000" style="width:80px" aria-label="RTT"> ms</span><span>Window <input type="number" id="ww" value="65535" min="1000" max="1073725440" style="width:130px" aria-label="Window bytes"> bytes</span></div><div id="wres"></div></div>
${DOIT(["With the defaults a 100 Mbit/s link with 50 ms RTT has a BDP of 625,000 bytes. A window of 65,535 bytes gives only about 10.5 Mbit/s: the link is mostly idle.","Set the window to 625000. The throughput now reaches the link rate. This is why the window scale option exists.","Set RTT to 1 ms (a LAN). The 65,535-byte window is enough."])}
${quiz("p5q1","What does the window size field in a TCP header carry?",["The congestion window of the sender","The free buffer space of the sender of this segment, as the receiver window","The MSS","The size of the segment"],1,"It is the receiver window (rwnd): the number of bytes that the sender of this segment can still accept.")}
${quiz("p5q2","The receiver announces win = 0. What does the sender do?",["Closes the connection","Stops sending data and later sends window probes","Sends data at half the rate","Retransmits everything"],1,"The sender stops. The persist timer sends small probe segments until the window opens.")}
${quiz("p5q3","The link rate is 8 Mbit/s and RTT is 100 ms. What is the bandwidth-delay product?",["10,000 bytes","100,000 bytes","800,000 bytes","80,000 bytes"],1,"8,000,000 bit/s x 0.1 s = 800,000 bits = 100,000 bytes.")}
${EXAM(["Explain flow control in TCP. How is it different from congestion control?","Explain the sliding window of TCP with a diagram of the four zones.","The receiver has a buffer of 4000 bytes, the sender sends 3000 bytes, and the application has read none. What window does the receiver advertise? (4000 - 3000 = 1000 bytes)","What is silly window syndrome? Explain Nagle's algorithm and Clark's solution.","Why is the persist timer needed?","A link has 10 Mbit/s and RTT 100 ms. Find the BDP and the throughput with a window of 65,535 bytes. (BDP = 125,000 bytes. Throughput = 65,535 x 8 / 0.1 = 5.24 Mbit/s.)"])}
${SUM(["The receiver announces its free buffer space (rwnd) in every segment. The sender may have at most min(rwnd, cwnd) bytes outstanding.","A zero window stops the sender. A window update or a window probe (persist timer) restarts it.","Silly window syndrome is avoided by Nagle's algorithm at the sender and Clark's solution at the receiver.","Throughput is at most window / RTT. The window must be at least the bandwidth-delay product to fill the link."])}
`,
mount(r){
  let st=null;const fb=()=>{const B=+$("#fbf",r).value,R=+$("#frd",r).value,s=flowSim(B,R,1000);
    st=story(r,"#fvs",{draw:i=>{seqd($("#fv",r),{actors:['Sender','Receiver'],msgs:s.M,rowH:30},i);const u=s.buf[i]/1000,n=B/1000;$("#fbuf",r).innerHTML=`<span class="small" style="margin-right:6px">Receive buffer:</span>`+Array.from({length:n},(_,k)=>`<span style="width:44px;height:22px;border:2px solid var(--pri);border-radius:4px;background:${k<u?'var(--pri)':'var(--surface)'}"></span>`).join('')+`<span class="small" style="margin-left:8px">${s.buf[i]} of ${B} bytes used</span>`}});
    st.set(s.cap.map(c=>({cap:c})))};
  $("#fbf",r).onchange=fb;$("#frd",r).onchange=fb;fb();
  const wc=()=>{const b=+$("#wb",r).value*1e6,rt=+$("#wr",r).value/1000,w=+$("#ww",r).value;if(!(b>0&&rt>0&&w>0))return;const bdp=b*rt/8,th=Math.min(b,w*8/rt),u=th/b;let sc=0;while(65535*Math.pow(2,sc)<bdp&&sc<14)sc++;
    $("#wres",r).innerHTML=KV([['Bandwidth-delay product',`${Math.round(b)} bit/s x ${rt} s / 8 = <b>${Math.round(bdp).toLocaleString('en-US')} bytes</b>`],['Throughput limit of the window',`window x 8 / RTT = <b>${(w*8/rt/1e6).toFixed(2)} Mbit/s</b>`],['Throughput (smaller of link and window)',`<b>${(th/1e6).toFixed(2)} Mbit/s</b>`],['Link utilisation',`<b>${(u*100).toFixed(1)}%</b>`],['Window scale needed for a full link',w>=bdp?'none (the window is large enough)':`scale factor ${sc} (65,535 x 2<sup>${sc}</sup> = ${(65535*Math.pow(2,sc)).toLocaleString('en-US')} bytes)`]])};
  ['#wb','#wr','#ww'].forEach(s=>$(s,r).oninput=wc);wc();
}});

/* ===== Unit V Lesson 6: TCP congestion control ===== */
function ccSim(variant,ss0,ev,N){const cw=[1],th=[ss0],ph=[1<ss0?'slow start':'congestion avoidance'],note=[''];let c=1,s=ss0;
  for(let r=0;r<N;r++){const e=ev.find(x=>x.r===r);let n='';
    if(e){s=Math.max(Math.floor(c/2),2);if(e.t==='to'||variant==='tahoe'){c=1;n=(e.t==='to'?'time-out':'3 duplicate ACKs')+': ssthresh = '+s+', cwnd = 1'}else{c=s;n='3 duplicate ACKs (Reno): ssthresh = cwnd = '+s}}
    else if(c<s)c=Math.min(c*2,s);else c=c+1;
    cw.push(c);th.push(s);ph.push(c<s?'slow start':'congestion avoidance');note.push(n)}
  return {cw,th,ph,note}}
lesson({nav:"6. TCP: congestion control",title:"TCP congestion control",syl:"TCP (Congestion Control)",
html:()=>`
${GUIDE({"syl":"TCP (Congestion Control)","why":"If all senders send as fast as the receivers allow, the routers' queues overflow, packets are lost and the senders retransmit, which makes it worse. TCP controls the sending rate by a second window, the congestion window. This lesson explains slow start, congestion avoidance and the reaction to loss.","map":[["6.1","What is congestion","Why does the network need control?","Read the definition."],["6.2","The congestion window","How is the sending limited?","Read the three variables."],["6.3","Slow start","How does TCP find the rate?","Step through the rounds."],["6.4","Congestion avoidance","How does it grow after that?","Continue stepping."],["6.5","Reaction to loss, Tahoe and Reno","What happens after a loss?","Choose the loss events."],["6.6","Throughput of TCP","What rate does TCP reach?","Use the calculator."]],"osi":"Layer 4 (transport layer). It reacts to events in layer 3 (router queues).","pre":"Lessons 4 and 5; Unit IV, Lesson 1 (routers and queues).","time":"about 1 hour 30 minutes","next":"Lesson 7, header format and timers."})}
${LEARN(["explain congestion and how it differs from lack of buffer at the receiver","describe cwnd, ssthresh and the rule window = min(rwnd, cwnd)","trace slow start and congestion avoidance round by round","compare TCP Tahoe and TCP Reno after a time-out and after three duplicate ACKs","explain additive increase multiplicative decrease (AIMD)"])}
${SEC("6.1","What is congestion")}
${DEF("Congestion","is the state of a network in which too many packets are sent for the routers and links to carry. The queues in the routers grow, delays increase and packets are dropped.")}
<p>When a packet is dropped, the sender times out and sends it again. The extra packets add to the load. If nothing is done, the throughput falls to a very low value, a situation called <b>congestion collapse</b> (it happened on the early Internet in 1986). Flow control is not enough, because the receiver may have plenty of buffer while the <b>network</b> is full. So TCP has congestion control as well. The network does not tell the sender anything: the TCP sender <b>guesses</b> the state of the network from the signals that it can see, packet loss (a time-out or three duplicate ACKs) and, if enabled, ECN marks.</p>
${SEC("6.2","The congestion window")}
<p>The sender keeps three variables.</p>
<ul><li><b>cwnd</b>, the <b>congestion window</b>: the number of bytes that the sender may have in the network, as decided by the sender from the congestion signals. It is measured here in MSS.</li>
<li><b>ssthresh</b>, the <b>slow-start threshold</b>: the value at which the growth changes from exponential to linear.</li>
<li><b>rwnd</b>, the receiver window (Lesson 5).</li></ul>
<p>The sender may have at most <b>min(rwnd, cwnd)</b> bytes unacknowledged. In the rest of this lesson rwnd is large, so cwnd decides. Time is counted in <b>rounds</b>: one round is one RTT, in which the sender sends a full window and gets back the ACKs.</p>
${SEC("6.3","Slow start")}
<p>When a connection starts, the sender does not know the capacity of the path. It starts with <b>cwnd = 1 MSS</b> (modern systems use up to 10) and increases cwnd by 1 MSS for <b>every ACK</b> that arrives. In one round a window of n segments gives n ACKs, so cwnd becomes 2n. The window <b>doubles every RTT</b>: 1, 2, 4, 8, 16. The growth is exponential, so "slow start" is a name for a quick start. It stops when cwnd reaches ssthresh, or when a loss occurs.</p>
${SEC("6.4","Congestion avoidance")}
<p>From cwnd = ssthresh, TCP is near the capacity that was found before, so it grows more carefully. It increases cwnd by <b>1 MSS per round</b> (that is, by 1/cwnd of an MSS for each ACK). This is <b>additive increase</b>. The window grows linearly until a loss occurs.</p>
${SEC("6.5","Reaction to loss: multiplicative decrease")}
<p>A loss means that the network is congested. TCP then halves its threshold. This is <b>multiplicative decrease</b>. The two events differ in how bad the situation looks.</p>
<table class="dt gt cmpt"><thead><tr><th>Event</th><th>Meaning</th><th>Tahoe</th><th>Reno</th></tr></thead><tbody>
<tr><td><b>Time-out</b></td><td>Severe: nothing came back</td><td>ssthresh = cwnd / 2, cwnd = 1, slow start</td><td>ssthresh = cwnd / 2, cwnd = 1, slow start</td></tr>
<tr><td><b>3 duplicate ACKs</b></td><td>Mild: later segments still get through</td><td>ssthresh = cwnd / 2, cwnd = 1, slow start (the same as for a time-out)</td><td>ssthresh = cwnd / 2, <b>cwnd = ssthresh</b> (fast recovery), then congestion avoidance</td></tr></tbody></table>
<p>The combined behaviour is <b>AIMD</b> (additive increase, multiplicative decrease): add 1 MSS per RTT, halve on loss. It gives the saw-tooth shape of the TCP window. AIMD also shares a bottleneck link fairly between connections.</p>
<p>Set the initial threshold and two loss events. The chart shows Tahoe and Reno together. The table and the step player follow the variant that you select.</p>
<div class="vis"><div class="row"><span>Variant ${seg("ccg",[["reno","Reno"],["tahoe","Tahoe"]])}</span><span>Initial ssthresh <select id="ccs" aria-label="Initial ssthresh"><option>8</option><option selected>16</option><option>32</option></select> MSS</span></div>
<div class="row"><span>Loss 1 at round <select id="cr1" aria-label="Round of loss 1"></select> type <select id="ct1" aria-label="Type of loss 1"><option value="dup">3 duplicate ACKs</option><option value="to">Time-out</option></select></span><span>Loss 2 at round <select id="cr2" aria-label="Round of loss 2"></select> type <select id="ct2" aria-label="Type of loss 2"><option value="to">Time-out</option><option value="dup">3 duplicate ACKs</option></select></span></div>
<div id="ccc"></div><div id="ccb" style="display:flex;flex-wrap:wrap;gap:3px;margin:8px 0;min-height:24px"></div><div id="ccs2"></div><div style="max-height:300px;overflow:auto;margin-top:8px"><table class="dt cmpt"><thead><tr><th>Round</th><th>cwnd (MSS)</th><th>ssthresh</th><th>Phase</th><th>Event at the end of this round</th></tr></thead><tbody id="cct"></tbody></table></div></div>
${DOIT(["With the defaults read the rounds 0 to 4: 1, 2, 4, 8, 16. This is slow start. At 16 (= ssthresh) the growth becomes linear: 17, 18, 19.","At the first loss (round 10, three duplicate ACKs) Reno halves the window and continues linearly. Tahoe goes back to 1 and repeats slow start up to the new ssthresh. Compare the two lines on the chart.","Change loss 1 to a time-out. Now Reno and Tahoe do the same.","Set the initial ssthresh to 8 and see where the growth turns linear."])}
<p><b>Other mechanisms.</b> <b>Fast recovery</b> (in Reno) keeps the ACK clock running after a fast retransmit: the sender adds 1 MSS for each further duplicate ACK and so keeps sending new data. <b>ECN</b> (explicit congestion notification) lets a router mark packets instead of dropping them. Newer variants (CUBIC, the default in Linux, and BBR) change how the window grows, but the structure is the same.</p>
${SEC("6.6","Throughput of TCP")}
<p>If the loss probability is p, a TCP sender with the saw-tooth window reaches an average throughput of about <b>1.22 x MSS / (RTT x &radic;p)</b> (the Mathis formula). Throughput falls with a longer RTT and with a higher loss rate.</p>
<div class="vis"><div class="row"><span>MSS <input type="number" id="mm" value="1460" min="100" max="9000" style="width:80px" aria-label="MSS"> bytes</span><span>RTT <input type="number" id="mr2" value="100" min="1" max="2000" style="width:80px" aria-label="RTT"> ms</span><span>Loss probability <select id="mp" aria-label="Loss probability"><option value="0.0001">0.01%</option><option value="0.001">0.1%</option><option value="0.01" selected>1%</option><option value="0.05">5%</option></select></span></div><div id="mres"></div></div>
${quiz("p6q1","TCP is in slow start with cwnd = 8 MSS. How big is cwnd one RTT later, if there is no loss and ssthresh is 32?",["9 MSS","16 MSS","32 MSS","10 MSS"],1,"In slow start cwnd doubles each RTT, so 8 becomes 16.")}
${quiz("p6q2","cwnd is 20 MSS and a time-out occurs. What are ssthresh and cwnd afterwards?",["ssthresh 20, cwnd 1","ssthresh 10, cwnd 1","ssthresh 10, cwnd 10","ssthresh 40, cwnd 1"],1,"ssthresh = cwnd / 2 = 10. cwnd restarts at 1 MSS in slow start.")}
${quiz("p6q3","What does TCP Reno do after three duplicate ACKs, and Tahoe does not?",["Closes the connection","Sets cwnd = ssthresh and continues with congestion avoidance (fast recovery)","Doubles cwnd","Sets rwnd to 0"],1,"Reno treats three duplicate ACKs as a mild signal and does not go back to slow start.")}
${EXAM(["Explain congestion. Why is flow control not enough?","Explain slow start and congestion avoidance with a graph of cwnd against the round number.","What are ssthresh and cwnd after a time-out when cwnd was 24? (ssthresh = 12, cwnd = 1)","Explain the difference between Tahoe and Reno.","What is AIMD? Why does the window have a saw-tooth shape?","Starting with cwnd = 1 and ssthresh = 16, give cwnd for rounds 0 to 7. (1, 2, 4, 8, 16, 17, 18, 19)","What is the effect of the RTT and of the loss rate on TCP throughput?"])}
${SUM(["The sender limits itself to min(rwnd, cwnd). cwnd is set from the loss signals.","Slow start doubles cwnd every RTT up to ssthresh. Then congestion avoidance adds 1 MSS per RTT.","On a time-out: ssthresh = cwnd / 2 and cwnd = 1. On three duplicate ACKs: Tahoe does the same, Reno sets cwnd = ssthresh.","This AIMD behaviour gives the saw-tooth window and a fair share of a bottleneck link."])}
`,
mount(r){
  const N=24;let variant='reno',cst=null;
  const fill=(id,v)=>{$(id,r).innerHTML=`<option value="-1">none</option>`+Array.from({length:N-2},(_,k)=>`<option value="${k+2}"${k+2===v?' selected':''}>${k+2}</option>`).join('')};fill("#cr1",10);fill("#cr2",17);
  const go=()=>{const s0=+$("#ccs",r).value,ev=[];[["#cr1","#ct1"],["#cr2","#ct2"]].forEach(([a,b])=>{const rr=+$(a,r).value;if(rr>=0)ev.push({r:rr,t:$(b,r).value})});ev.sort((a,b)=>a.r-b.r);
    const T=ccSim('tahoe',s0,ev,N),R=ccSim('reno',s0,ev,N),S=variant==='reno'?R:T,ymax=Math.max(8,...T.cw,...R.cw)+2;
    const chart=up=>lineChart({W:700,H:300,xmax:N,ymax:Math.ceil(ymax/4)*4,xl:'round (RTT)',yl:'cwnd (MSS)',xt:12,yt:4,label:'cwnd against rounds',legR:230,series:[{f:x=>x>up+1e-9?NaN:R.cw[Math.min(N,Math.floor(x+1e-9))],name:'Reno',c:'var(--pri)'},{f:x=>x>up+1e-9?NaN:T.cw[Math.min(N,Math.floor(x+1e-9))],name:'Tahoe',c:'var(--sec)'},{f:x=>x>up+1e-9?NaN:S.th[Math.min(N,Math.floor(x+1e-9))],name:'ssthresh ('+variant+')',c:'var(--good)'}],pts:ev.filter(e=>e.r<=up).map(e=>({x:e.r,y:S.cw[e.r],txt:e.t==='to'?'time-out':'3 dup ACKs'}))});
    cst=story(r,"#ccs2",{draw:i=>{$("#ccc",r).innerHTML=chart(i);const c=S.cw[i];$("#ccb",r).innerHTML=`<span class="small" style="margin-right:6px">Segments in one round:</span>`+Array.from({length:Math.min(c,40)},()=>`<span style="width:16px;height:16px;border-radius:3px;background:${S.ph[i]==='slow start'?'var(--sec)':'var(--pri)'}"></span>`).join('')+(c>40?'<span class="small">...</span>':'')+`<span class="small" style="margin-left:6px">cwnd = ${c}, ${S.ph[i]}</span>`}});
    cst.set(S.cw.map((c,i)=>({cap:i===0?`<b>Round 0.</b> The connection starts: cwnd = 1 MSS, ssthresh = ${s0} MSS. The sender sends 1 segment.`:`<b>Round ${i}.</b> cwnd = <b>${c}</b> MSS, ssthresh = ${S.th[i]}. Phase: <b>${S.ph[i]}</b>. ${S.note[i-1]?'The previous round ended with: '+S.note[i-1]+'.':(S.ph[i]==='slow start'?'The window doubled (or reached ssthresh).':'The window grew by 1 MSS.')}`})));
    $("#cct",r).innerHTML=S.cw.map((c,i)=>`<tr><td>${i}</td><td>${c}</td><td>${S.th[i]}</td><td>${S.ph[i]}</td><td>${S.note[i]||''}</td></tr>`).join('')};
  bindSeg(r,"ccg",v=>{variant=v;go()});['#ccs','#cr1','#ct1','#cr2','#ct2'].forEach(s=>$(s,r).onchange=go);go();
  const mc=()=>{const m=+$("#mm",r).value,rt=+$("#mr2",r).value/1000,p=+$("#mp",r).value;if(!(m>0&&rt>0))return;const t=1.22*m*8/(rt*Math.sqrt(p));$("#mres",r).innerHTML=KV([['Throughput',`1.22 x ${m} x 8 / (${rt} s x &radic;${p}) = <b>${(t/1e6).toFixed(2)} Mbit/s</b>`]])};
  ['#mm','#mr2'].forEach(s=>$(s,r).oninput=mc);$("#mp",r).onchange=mc;mc();
}});

/* ===== Unit V Lesson 7: TCP header format and timer management ===== */
const TCPH=[[{n:'Source port',b:16,note:'Port of the sending process.'},{n:'Destination port',b:16,note:'Port of the receiving process.'}],[{n:'Sequence number',b:32,note:'Number of the first data byte in this segment (Lesson 4). In a SYN segment it is the ISN.'}],[{n:'Acknowledgement number',b:32,note:'Number of the next byte that the sender of this segment expects to receive. Valid only if the ACK flag is 1.'}],
 [{n:'HLEN',b:4,bl:'4 bits',note:'Header length in units of 4 bytes. Minimum 5 (20 bytes), maximum 15 (60 bytes). It shows where the data starts.'},{n:'Reserved',b:6,bl:'6 bits',note:'Reserved for future use. Set to 0.'},{n:'URG',b:1,bl:'1',note:'Urgent pointer is valid.'},{n:'ACK',b:1,bl:'1',note:'The acknowledgement number is valid. It is 1 in all segments except the first SYN.'},{n:'PSH',b:1,bl:'1',note:'Push: deliver the data to the application at once, do not wait for the buffer to fill.'},{n:'RST',b:1,bl:'1',note:'Reset: abort the connection, or refuse a connection.'},{n:'SYN',b:1,bl:'1',note:'Synchronise sequence numbers: connection request.'},{n:'FIN',b:1,bl:'1',note:'The sender has no more data: terminate the connection.'},{n:'Window size',b:16,note:'The receiver window: number of bytes that the sender of this segment can accept (Lesson 5). With the window scale option it is multiplied by 2^s.'}],
 [{n:'Checksum',b:16,note:'16-bit one\'s complement checksum over the pseudo-header (with protocol 6), the TCP header and the data. It is required in TCP (it is optional in UDP over IPv4).'},{n:'Urgent pointer',b:16,note:'Offset from the sequence number to the last urgent byte. Used only when URG = 1.'}],[{n:'Options and padding',b:32,bl:'0 to 40 bytes',note:'Examples: MSS (kind 2), window scale (kind 3), SACK permitted (kind 4), SACK blocks (kind 5), timestamps (kind 8). Padded to a multiple of 4 bytes.'}]];
const FLG=[['URG',32],['ACK',16],['PSH',8],['RST',4],['SYN',2],['FIN',1]];
function tcpKind(f){const on=n=>!!(f&FLG.find(x=>x[0]===n)[1]);if(on('RST'))return 'Reset: the connection is aborted or refused';if(on('SYN')&&!on('ACK'))return 'Connection request (first segment of the three-way handshake)';if(on('SYN')&&on('ACK'))return 'Connection accepted (second segment of the handshake)';if(on('FIN')&&on('ACK'))return 'Close request (and acknowledgement)';if(on('FIN'))return 'Close request';if(on('PSH')&&on('ACK'))return 'Data segment, push to the application, with acknowledgement';if(on('ACK'))return 'Acknowledgement (and possibly data)';return 'Data segment'}
function tcpParse(hex){const h=hex.replace(/[^0-9a-fA-F]/g,'');if(h.length<40||h.length%2)return null;const b=[];for(let i=0;i<h.length;i+=2)b.push(parseInt(h.substr(i,2),16));
  const u32=i=>((b[i]<<24)|(b[i+1]<<16)|(b[i+2]<<8)|b[i+3])>>>0,u16=i=>(b[i]<<8)|b[i+1],off=b[12]>>4,fl=b[13]&63,o={sp:u16(0),dp:u16(2),seq:u32(4),ack:u32(8),off,fl,win:u16(14),ck:u16(16),urg:u16(18),opts:[],len:b.length};
  if(off<5||off*4>b.length){o.bad='The header length field ('+off+') does not fit the data. It must be at least 5 and not more than the bytes given.';return o}
  let i=20;while(i<off*4){const k=b[i];if(k===0){o.opts.push('End of option list');break}if(k===1){o.opts.push('No operation (padding)');i++;continue}const l=b[i+1];if(!l||l<2)break;
    if(k===2)o.opts.push('MSS = '+u16(i+2)+' bytes');else if(k===3)o.opts.push('Window scale = '+b[i+2]+' (multiply the window by '+Math.pow(2,b[i+2])+')');else if(k===4)o.opts.push('SACK permitted');else if(k===8)o.opts.push('Timestamps');else o.opts.push('Option kind '+k+', length '+l);i+=l}
  return o}
function rttSim(S){const R=[];let sr=0,rv=0;S.forEach((x,i)=>{if(i===0){sr=x;rv=x/2}else{rv=0.75*rv+0.25*Math.abs(sr-x);sr=0.875*sr+0.125*x}R.push({x,sr,rv,rto:sr+4*rv})});return R}
lesson({nav:"7. TCP: header format and timer management",title:"TCP header format and timer management",syl:"TCP (Header Format, Timer Management)",
html:()=>`
${GUIDE({"syl":"TCP (Header Format, Timer Management)","why":"Every feature of TCP in the last four lessons is carried by a field in the header or controlled by a timer. This lesson puts the header together and explains the four timers, above all the retransmission timer and the way its value is calculated.","map":[["7.1","The TCP header","What fields does a segment carry?","Click each field."],["7.2","Flags and options","What does each flag and option do?","Decode a header from hex."],["7.3","Timers of TCP","Which four timers does TCP use?","Read the table."],["7.4","Retransmission time-out","How is the RTO calculated?","Enter RTT samples."],["7.5","Karn's algorithm and back-off","How are retransmitted segments handled?","Read the rules and the table."]],"osi":"Layer 4 (transport layer).","pre":"Lessons 3 to 6.","time":"about 1 hour 30 minutes","next":"Lesson 8, the session layer."})}
${LEARN(["draw the TCP header and state the use of every field","decode the flags and options of a segment","list the timers of TCP and their purpose","calculate SRTT, RTTVAR and RTO from RTT samples","explain Karn's algorithm and exponential back-off"])}
${SEC("7.1","The TCP header")}
<p>A TCP segment is a header followed by data. The header has 20 bytes of fixed fields and up to 40 bytes of options. Click a field to read what it does and where it was used.</p>
<div class="vis"><div id="th"></div><div id="td" class="small" style="margin-top:8px;min-height:3em"></div></div>
<table class="dt gt cmpt"><thead><tr><th>Field</th><th>Size</th><th>Used for (lesson)</th></tr></thead><tbody>
<tr><td>Source port, destination port</td><td>16 + 16</td><td>Process-to-process delivery (1)</td></tr><tr><td>Sequence number</td><td>32</td><td>Byte numbering, connection set-up (3, 4)</td></tr><tr><td>Acknowledgement number</td><td>32</td><td>Cumulative acknowledgement (4)</td></tr><tr><td>HLEN</td><td>4</td><td>Where the data starts</td></tr><tr><td>Flags URG, ACK, PSH, RST, SYN, FIN</td><td>6</td><td>Connection management and control (3)</td></tr><tr><td>Window size</td><td>16</td><td>Flow control (5)</td></tr><tr><td>Checksum</td><td>16</td><td>Error detection (4)</td></tr><tr><td>Urgent pointer</td><td>16</td><td>Urgent data</td></tr><tr><td>Options</td><td>0 to 320</td><td>MSS, window scale, SACK, timestamps</td></tr></tbody></table>
${SEC("7.2","Flags and options")}
<p>The six flags are bits. Select the flags and read the kind of segment. The same segment type is used in the handshake and release of Lesson 3.</p>
<div class="vis"><div class="row">${FLG.map(f=>`<label class="pill"><input type="checkbox" data-fl="${f[1]}"${f[0]==='SYN'?' checked':''}>${f[0]}</label>`).join('')}</div><div id="flr" class="callout i small"></div></div>
<p>Now decode a header. The box holds the bytes of a TCP header in hexadecimal. Change any byte and the fields are decoded again. The first value is a SYN segment from port 5000 to port 80 with the MSS option.</p>
<div class="vis"><div class="row"><span>Hex bytes <input id="hxi" style="width:100%;min-width:300px;font-family:var(--mono)" value="13 88 00 50 00 00 03 E8 00 00 00 00 60 02 FF FF 12 34 00 00 02 04 05 B4" aria-label="TCP header in hexadecimal"></span></div><div id="hxr"></div></div>
${DOIT(["Read the default header. The byte 60 means HLEN = 6, so the header has 6 x 4 = 24 bytes. The last four bytes are the MSS option, 05B4 = 1460.","Change the fourteenth byte from 02 to 12 (the pair 60 02 becomes 60 12). The flags become SYN + ACK.","Replace the first four bytes 13 88 00 50 with 00 50 13 88. The ports are swapped, as in a segment from the server to the client."])}
${SEC("7.3","Timers of TCP")}
<table class="dt gt cmpt"><thead><tr><th>Timer</th><th>Started when</th><th>If it expires</th><th>Typical value</th></tr></thead><tbody>
<tr><td><b>Retransmission timer</b></td><td>A segment is sent (for the oldest unacknowledged segment)</td><td>The segment is sent again. The RTO is doubled.</td><td>Calculated from the RTT (next section), at least 1 s</td></tr>
<tr><td><b>Persistence timer</b></td><td>The receiver announces a zero window</td><td>The sender sends a one-byte window probe. The next interval is longer.</td><td>Starts at about 5 s, up to 60 s</td></tr>
<tr><td><b>Keepalive timer</b></td><td>The connection has been idle (optional, off by default)</td><td>The server sends a probe. After several unanswered probes the connection is closed.</td><td>2 hours idle, then probes every 75 s, 9 times</td></tr>
<tr><td><b>Time-waited timer</b></td><td>The connection enters TIME_WAIT</td><td>The connection goes to CLOSED</td><td>2 MSL (1 to 4 minutes)</td></tr></tbody></table>
<p>There is also a <b>connection-establishment time-out</b>: if the SYN+ACK does not arrive, the SYN is sent again (after 1 s, then 2 s, 4 s and so on) and the attempt is abandoned after a limit.</p>
${SEC("7.4","The retransmission time-out (RTO)")}
<p>If the RTO is too short, TCP retransmits segments that were only delayed, and adds to the load. If it is too long, TCP waits a long time before it repairs a loss. The best value is a little above the RTT. But the RTT is not constant: it depends on the queues on the path. So TCP <b>measures</b> the RTT of the segments and keeps a running estimate. The method of Jacobson and Karels (RFC 6298) uses the measured <b>RTT sample R</b> and two variables.</p>
<ul><li><b>First sample:</b> SRTT = R, RTTVAR = R / 2.</li>
<li><b>Each later sample:</b> RTTVAR = (1 - &beta;) RTTVAR + &beta; |SRTT - R| with &beta; = 1/4, then SRTT = (1 - &alpha;) SRTT + &alpha; R with &alpha; = 1/8. (Calculate RTTVAR first, with the old SRTT.)</li>
<li><b>Time-out:</b> RTO = SRTT + 4 x RTTVAR. (RFC 6298 also sets a minimum of 1 second. The calculator below does not apply it, so that the effect of the samples is visible.)</li></ul>
<p>SRTT is the <b>smoothed RTT</b>. RTTVAR is the smoothed <b>deviation</b>. A steady RTT gives a small deviation and an RTO close to the RTT. A sudden jump in the RTT first raises RTTVAR, and so the RTO, quickly.</p>
<div class="vis"><div class="row"><span>RTT samples (ms) <input id="rti" style="width:100%;min-width:280px" value="100, 120, 90, 300, 110, 105, 95, 100" aria-label="RTT samples in milliseconds"></span></div><div id="rtc"></div><div id="rtt"></div></div>
${DOIT(["With the default samples the first sample is 100, so SRTT = 100, RTTVAR = 50 and RTO = 300.","Look at the fourth sample, 300 ms. The RTO rises at once. Then it falls back as the samples return to about 100.","Enter ten samples of 100. The RTO falls towards 100 plus a small value, because RTTVAR gets small."])}
${SEC("7.5","Karn's algorithm and exponential back-off")}
<p>When a segment is retransmitted, an ACK that arrives cannot be matched to the first or to the second copy. If the sample is wrong, the estimate is wrong. <b>Karn's algorithm</b> has two rules.</p>
<ol><li><b>Do not take an RTT sample from a retransmitted segment.</b> Only segments that were sent once are measured. (The timestamp option removes this problem.)</li>
<li><b>Exponential back-off.</b> After every time-out the RTO is <b>doubled</b> until an ACK for new data comes. Then the RTO is calculated from the formula again.</li></ol>
<div class="vis"><div class="row"><span>Normal RTO <input type="number" id="kb" value="400" min="10" max="10000" style="width:90px" aria-label="RTO"> ms</span></div><div id="kbr"></div></div>
${quiz("p7q1","The HLEN field of a TCP header is 8. How long is the header?",["8 bytes","20 bytes","32 bytes","40 bytes"],2,"HLEN is in units of 4 bytes: 8 x 4 = 32 bytes. That is 20 bytes of fixed fields and 12 bytes of options.")}
${quiz("p7q2","Which flags are 1 in the second segment of the three-way handshake?",["SYN only","ACK only","SYN and ACK","FIN and ACK"],2,"The server accepts the request (SYN) and acknowledges the client SYN (ACK).")}
${quiz("p7q3","The first RTT sample is 80 ms. What is the RTO?",["80 ms","160 ms","240 ms","320 ms"],2,"SRTT = 80 and RTTVAR = 40, so RTO = 80 + 4 x 40 = 240 ms.")}
${EXAM(["Draw the TCP header with the size of each field.","What is the use of the HLEN field? A header has HLEN = 15. How many bytes of options does it have? (15 x 4 = 60, options 40 bytes)","Explain the six flags of the TCP header.","List the timers used by TCP and the purpose of each.","How does TCP calculate the retransmission time-out? Find SRTT, RTTVAR and RTO for the first sample of 200 ms. (SRTT 200, RTTVAR 100, RTO 600 ms)","What is Karn's algorithm? Why is exponential back-off used?","What are the TCP options? Why is the window scale option needed?"])}
${SUM(["The TCP header has 20 bytes of fixed fields: ports, sequence and acknowledgement numbers, HLEN, six flags, window, checksum and urgent pointer. Options can add up to 40 bytes.","TCP has four timers: retransmission, persistence, keepalive and time-waited.","RTO = SRTT + 4 x RTTVAR, with SRTT and RTTVAR updated by exponential averaging of the RTT samples.","Karn's algorithm does not measure retransmitted segments, and the RTO is doubled after each time-out."])}
`,
mount(r){
  hdrGrid($("#th",r),TCPH,f=>{$("#td",r).innerHTML=`<b>${f.n}</b> (${f.bl||f.b+' bits'}). ${f.note}`});
  const fl=()=>{let v=0;$$('[data-fl]',r).forEach(c=>{if(c.checked)v|=+c.dataset.fl});$("#flr",r).innerHTML=`Flag byte value: <b>${v}</b>. ${v===0?'No flag is set.':'This is: <b>'+tcpKind(v)+'</b>.'}`};
  $$('[data-fl]',r).forEach(c=>c.onchange=fl);fl();
  const hx=()=>{const o=tcpParse($("#hxi",r).value),e=$("#hxr",r);if(!o){e.innerHTML='<div class="warn small">Enter at least 20 bytes (40 hex digits).</div>';return}
    if(o.bad){e.innerHTML=`<div class="warn small">${o.bad}</div>`;return}
    const fn=FLG.filter(f=>o.fl&f[1]).map(f=>f[0]).join(' + ')||'none';
    e.innerHTML=KV([['Source port',o.sp],['Destination port',o.dp+(WK.find(x=>x[0]===o.dp)?' ('+WK.find(x=>x[0]===o.dp)[1]+')':'')],['Sequence number',o.seq],['Acknowledgement number',o.ack],['HLEN',`${o.off} (header = ${o.off*4} bytes, options = ${o.off*4-20} bytes)`],['Flags',`${fn} (${o.fl}). ${tcpKind(o.fl)}`],['Window size',o.win],['Checksum',h4(o.ck)],['Urgent pointer',o.urg],['Options',o.opts.length?o.opts.join('; '):'none'],['Data in the bytes given',Math.max(0,o.len-o.off*4)+' bytes']])};
  $("#hxi",r).oninput=hx;hx();
  const rt=()=>{const S=$("#rti",r).value.split(/[ ,;]+/).map(Number).filter(x=>x>0&&isFinite(x)).slice(0,30);if(!S.length){$("#rtt",r).innerHTML='<div class="warn small">Enter positive numbers separated by commas.</div>';$("#rtc",r).innerHTML='';return}
    const R=rttSim(S),n=R.length,ym=Math.ceil(Math.max(...R.map(x=>x.rto),...S)*1.1/50)*50;
    $("#rtc",r).innerHTML=lineChart({W:700,H:260,xmax:Math.max(n,2),ymax:ym,xl:'sample number',yl:'ms',xt:Math.min(n,10),yt:4,legR:200,label:'RTT samples and RTO',series:[{f:x=>x<n?R[Math.min(n-1,Math.floor(x+1e-9))].x:NaN,name:'RTT sample',c:'var(--sec)'},{f:x=>x<n?R[Math.min(n-1,Math.floor(x+1e-9))].rto:NaN,name:'RTO',c:'var(--pri)'}]});
    $("#rtt",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>#</th><th>RTT sample R</th><th>RTTVAR</th><th>SRTT</th><th>RTO = SRTT + 4 RTTVAR</th></tr></thead><tbody>${R.map((x,i)=>`<tr><td>${i+1}</td><td>${x.x}</td><td>${x.rv.toFixed(1)}</td><td>${x.sr.toFixed(1)}</td><td><b>${x.rto.toFixed(1)}</b></td></tr>`).join('')}</tbody></table>`};
  $("#rti",r).oninput=rt;rt();
  const kb=()=>{const b=+$("#kb",r).value;if(!(b>0))return;$("#kbr",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Attempt</th><th>RTO used</th></tr></thead><tbody>${[0,1,2,3,4].map(k=>`<tr><td>${k===0?'First send':'Retransmission '+k}</td><td>${b*Math.pow(2,k)} ms</td></tr>`).join('')}</tbody></table>`};
  $("#kb",r).oninput=kb;kb();
}});

/* ===== Unit V Lesson 8: session layer ===== */
const fnv=s=>{let h=0x811c9dc5;for(const c of utf8(s)){h^=c;h=Math.imul(h,0x01000193)>>>0}return h.toString(16).toUpperCase().padStart(8,'0')};
const H245=[{f:0,t:1,label:'TerminalCapabilitySet (I can send G.711, H.261)'},{f:1,t:0,label:'TerminalCapabilitySetAck',cls:'ack'},{f:1,t:0,label:'TerminalCapabilitySet (I can receive G.711, H.261)'},{f:0,t:1,label:'TerminalCapabilitySetAck',cls:'ack'},{f:0,t:1,label:'MasterSlaveDetermination (number 4711)'},{f:1,t:0,label:'MasterSlaveDeterminationAck (you are master)',cls:'ack'},{f:0,t:1,label:'OpenLogicalChannel (audio, G.711)'},{f:1,t:0,label:'OpenLogicalChannelAck (RTP port)',cls:'ack'}];
lesson({nav:"8. Session layer",title:"Session layer: authentication, authorization and protocols",syl:"Session layer: Authentication, Authorization, session layer protocol (PAP, SCP, H.245)",
html:()=>`
${GUIDE({"syl":"Session layer: Authentication, Authorization, session layer protocol (PAP, SCP, H.245)","why":"Two programs that communicate need more than a delivery service. They need to agree who may speak, they need to know who the other party is, and they need a way to restart after a failure without sending everything again. These are the tasks of the session layer.","map":[["8.1","The session layer","What does layer 5 do?","Read the services."],["8.2","Dialog control and synchronisation","How is a long transfer protected against a crash?","Change the checkpoint interval."],["8.3","Authentication and authorization","Who are you, and what may you do?","Read the comparison."],["8.4","PAP and CHAP","How is a password checked?","Compare what an eavesdropper sees."],["8.5","SCP and H.245","How are sessions and media channels controlled?","Step through the H.245 set-up."]],"osi":"Layer 5 (session layer). It uses the transport layer (layer 4) and serves the presentation layer (layer 6). In the TCP/IP model there is no separate session layer: its work is done by the application and by the protocols below it.","pre":"Lessons 1 to 7.","time":"about 1 hour 15 minutes","next":"Lesson 9, the presentation layer."})}
${LEARN(["state the services of the session layer","explain dialog control, token management and synchronisation points","explain the difference between authentication and authorization","compare PAP and CHAP","describe the purpose of SCP and of H.245"])}
${SEC("8.1","The session layer")}
${DEF("Session layer","is layer 5 of the OSI model. It lets two application processes establish, use and end a connection, called a <b>session</b>. It controls the dialog between them and adds checkpoints for recovery.")}
<div class="vis">${osiStack(5,"Layer 5. In the TCP/IP model the work of layers 5 to 7 is done by the application layer.")}</div>
<p>A session is a longer relationship than one transport connection. For example, a user logs in to a bank, makes several transactions over several connections, and logs out. The session layer services are:</p>
<ul><li><b>Session establishment, maintenance and termination.</b> It uses the transport connection, and can reuse or re-open it.</li>
<li><b>Dialog control.</b> It decides who may send at a given time: one direction only (simplex), alternately (half duplex) or both together (full duplex).</li>
<li><b>Token management.</b> A <b>token</b> is a right. Only the end that holds the token may do some operation (for example send data in half-duplex mode). The token is passed to the other end on request.</li>
<li><b>Synchronisation.</b> The session layer puts <b>synchronisation points</b> (checkpoints) in the data stream. After a failure, the transfer restarts from the last confirmed checkpoint and not from the start. There are <b>major</b> points (they divide the session into activities and must be confirmed) and <b>minor</b> points.</li>
<li><b>Authentication and authorization</b> (Section 8.3) are often counted here, as in the syllabus.</li></ul>
<p>The TCP/IP protocols have no session layer. TCP gives a connection. Applications do the rest: a web server gives a cookie (a session identifier) to the browser, TLS keeps a session key, and remote procedure call (RPC) systems manage their own sessions.</p>
${SEC("8.2","Synchronisation: restart after a failure")}
<p>A file of 20 pages is sent. If the connection breaks while page <i>c</i> is being sent, how much must be sent again? Without checkpoints, everything. With a checkpoint after every <i>k</i> pages, the receiver confirms each checkpoint, and the transfer restarts after the last one.</p>
<div class="vis"><div class="row"><span>Checkpoint after every <select id="sk" aria-label="Checkpoint interval"><option value="0">none</option><option value="1">1 page</option><option value="2">2 pages</option><option value="5" selected>5 pages</option><option value="10">10 pages</option></select></span><span>Failure while page <input type="number" id="sc" min="1" max="20" value="13" style="width:70px" aria-label="Page of failure"> is being sent</span></div><div id="sy"></div></div>
${DOIT(["With 5-page checkpoints and a failure at page 13, the last confirmed checkpoint is after page 10. Pages 11 and 12 are sent again, so 2 pages are repeated.","Select none. All 12 pages that were sent are repeated.","Select 1 page. Only the page that was interrupted is sent again, but there are 20 checkpoint messages. Frequent checkpoints cost more overhead. This is the trade-off."])}
${SEC("8.3","Authentication and authorization")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Authentication</th><th>Authorization</th></tr></thead><tbody>
<tr><td>Question</td><td>Who are you?</td><td>What are you allowed to do?</td></tr>
<tr><td>Purpose</td><td>Prove the identity of a user or host</td><td>Decide the access rights of an identified user</td></tr>
<tr><td>Order</td><td>First</td><td>After authentication</td></tr>
<tr><td>Methods</td><td>Password, challenge-response, certificate, token, biometric</td><td>Access control list, role, permission</td></tr>
<tr><td>Example</td><td>Login to a bank with a user name and a one-time password</td><td>The same user may view the account but not approve a transfer above a limit</td></tr></tbody></table>
<p>Authentication can use <b>something you know</b> (a password), <b>something you have</b> (a card or a phone) or <b>something you are</b> (a fingerprint). A scheme that uses two of these is <b>two-factor authentication</b>. In a network the main danger is that someone listens to the line and copies the password, then uses it again (a <b>replay attack</b>). The protocols below show two ways to handle it.</p>
${SEC("8.4","Session layer protocol: PAP and CHAP")}
<p><b>PAP (Password Authentication Protocol)</b> and <b>CHAP (Challenge-Handshake Authentication Protocol)</b> are used with PPP, the protocol of dial-up and many point-to-point links, to check a user before the link is opened to the network.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>PAP</th><th>CHAP</th></tr></thead><tbody>
<tr><td>Handshake</td><td>Two-way: the user sends the name and password, the server accepts or rejects</td><td>Three-way: challenge, response, success or failure</td></tr>
<tr><td>Password on the line</td><td><b>Yes, in clear text</b></td><td><b>Never</b>. Only a hash of the password and a random challenge is sent.</td></tr>
<tr><td>Checked</td><td>Once, at the start</td><td>At the start and again at random times during the session</td></tr>
<tr><td>Who starts</td><td>The user (peer)</td><td>The server (authenticator)</td></tr>
<tr><td>Replay attack</td><td>Possible: a copy of the message works again</td><td>Not possible: the challenge is different each time</td></tr></tbody></table>
<p>In CHAP the response is the hash of the identifier, the shared secret and the challenge (in the real protocol, MD5). The server computes the same hash and compares. In the demonstration below a simple <b>toy hash</b> (FNV-1a) is used to show the idea. It is not secure. Enter a user name and a password and compare what an eavesdropper on the line sees.</p>
<div class="vis"><div class="row"><span>User <input id="au" value="sushant" size="10" aria-label="User name"></span><span>Password <input id="ap2" value="s3cret" size="10" aria-label="Password"></span><span>${seg("apg",[["p","PAP"],["c","CHAP"]])}</span></div><svg id="av" role="img" aria-label="PAP or CHAP exchange"></svg><div id="avs"></div><div id="aev" class="callout k small"></div></div>
${DOIT(["Select PAP and step to the end. The eavesdropper box shows the password in clear text.","Select CHAP. The password never appears. A new challenge gives a different response for the same password: step through twice and compare the challenge numbers (Restart picks the next challenge).","Change the password in the box. In CHAP the hash changes completely, even for a small change of the password. In PAP the new password is visible at once."])}
${SEC("8.5","SCP and H.245")}
<p><b>SCP (Session Control Protocol).</b> A session control protocol sets up, manages and ends sessions between applications: it opens the session, keeps the state of the dialog, and closes it. Do not confuse it with the Secure Copy Protocol, which also has the letters SCP but is a file copy program that runs over SSH (Lesson 11).</p>
<p><b>H.245</b> is the control protocol of ITU-T for multimedia communication. It is used with H.323 for voice and video calls over IP networks. It runs on its own reliable channel, the <b>control channel</b>, while the audio and video go in RTP over UDP (Lesson 2). It controls the session in four ways:</p>
<ul><li><b>Capability exchange.</b> Each terminal tells the other which codecs (coding methods) it can send and receive.</li>
<li><b>Master-slave determination.</b> If both ends could take a decision, one is chosen as the master (the one with the larger random number). The master settles conflicts.</li>
<li><b>Logical channel signalling.</b> Opens and closes the channels for audio and video, with their parameters.</li>
<li><b>Other control messages:</b> flow control, round-trip delay measurement and end of session.</li></ul>
<div class="vis"><svg id="hv" role="img" aria-label="H.245 session set-up"></svg><div id="hvs"></div></div>
${quiz("p8q1","Which service puts checkpoints in the data stream so that a failed transfer does not restart from the beginning?",["Token management","Dialog control","Synchronisation","Authorization"],2,"Synchronisation points are the checkpoints.")}
${quiz("p8q2","Which statement about CHAP is true?",["The password is sent in clear text","The server sends a challenge and the user answers with a hash","It checks the user only once","It uses a two-way handshake"],1,"CHAP uses a three-way handshake. The password is never sent.")}
${quiz("p8q3","What is the difference between authentication and authorization?",["There is none","Authentication proves who the user is, authorization decides what the user may do","Authorization comes before authentication","Authentication is done by the router"],1,"First the identity is proved, then the rights of that identity are checked.")}
${EXAM(["List the services of the session layer.","What is a synchronisation point? Explain with an example of a file transfer. How do major and minor points differ?","Explain token management and dialog control.","Differentiate authentication and authorization with examples.","Compare PAP and CHAP.","Explain the role of H.245 in a multimedia call.","A file of 20 pages has a checkpoint after every 5 pages. The connection fails while page 13 is sent. How many pages are sent again? (2: pages 11 and 12; sending resumes with page 11.)"])}
${SUM(["The session layer (layer 5) manages dialogs: session set-up and release, dialog control, token management and synchronisation points.","Authentication proves the identity. Authorization gives the rights. Authentication comes first.","PAP sends the password in clear text once. CHAP uses a challenge and a hash, and repeats the check during the session.","H.245 controls multimedia sessions: capability exchange, master-slave determination and logical channels."])}
