lesson({nav:"1. Transport layer: design issues",title:"Transport layer: design issues",syl:"Transport Layer: Design Issues",
html:()=>`
${GUIDE({"syl":"Transport Layer: Design Issues","why":"The network layer delivers a packet from one host to another host. A host runs many programs at the same time, and the network layer does not know which program a packet is for. The transport layer fixes this and can also add reliability. This lesson lists what the layer must do and the main design decisions.","map":[["1.1","Why a transport layer","What does it add to the network layer?","Read the comparison table."],["1.2","Services","What does an application get from it?","Read the two kinds of service."],["1.3","Addressing, ports, sockets","How does a segment reach the right program?","Use the port lookup tool."],["1.4","Multiplexing and demultiplexing","How do many programs share one network connection?","Step through the socket story."],["1.5","Other design issues","Flow control, error control, congestion, connection set-up","Read the table."],["1.6","Transport primitives","Which calls does a program use?","Step through the socket call order."]],"osi":"Layer 4 (transport layer). In the TCP/IP model it is the transport layer. It uses layer 3 (Unit IV) and serves layers 5 to 7.","pre":"Unit IV, Lessons 1 and 5 (IP address, datagram service).","time":"about 1 hour","next":"Lesson 2, UDP."})}
${LEARN(["state the difference between host-to-host and process-to-process delivery","explain port numbers, socket addresses and well-known ports","explain multiplexing and demultiplexing","list the design issues of the transport layer","name the socket calls and the order in which a client and a server use them"])}
${SEC("1.1","Why a transport layer is needed")}
<p>The network layer (IP) delivers a packet from a source host to a destination host. It is unreliable: packets can be lost, duplicated, delayed or delivered out of order. It also does not say which program on the host must get the data. The <b>transport layer</b> adds two things on the end hosts: <b>process-to-process delivery</b> and, if the application needs it, <b>reliable delivery</b>.</p>
${DEF("Transport layer","is layer 4 of the OSI model. It provides logical communication between application processes that run on different hosts. It runs only in the end hosts, not in the routers. Its data unit is called a <b>segment</b> (TCP) or a <b>user datagram</b> (UDP).")}
<table class="dt gt cmpt"><thead><tr><th></th><th>Network layer</th><th>Transport layer</th></tr></thead><tbody>
<tr><td>Delivers between</td><td>Two hosts</td><td>Two processes (application programs)</td></tr>
<tr><td>Address</td><td>IP address</td><td>IP address and port number</td></tr>
<tr><td>Runs in</td><td>Hosts and routers</td><td>End hosts only</td></tr>
<tr><td>Reliability</td><td>None (best effort)</td><td>None in UDP, full in TCP</td></tr>
<tr><td>Data unit</td><td>Datagram (packet)</td><td>Segment or user datagram</td></tr></tbody></table>
<div class="vis">${osiStack(4,"Layer 4. The transport layer protocols are TCP and UDP.")}</div>
${SEC("1.2","Services provided to the upper layers")}
<p>An application can choose one of two kinds of transport service.</p>
<table class="dt gt cmpt"><thead><tr><th></th><th>Connection-oriented (TCP)</th><th>Connectionless (UDP)</th></tr></thead><tbody>
<tr><td>Connection set-up</td><td>Yes, before data is sent</td><td>No</td></tr>
<tr><td>Delivery</td><td>Reliable, in order, without duplicates</td><td>Best effort. Loss and disorder are possible.</td></tr>
<tr><td>Data model</td><td>Byte stream (no message boundaries)</td><td>Messages (boundaries are kept)</td></tr>
<tr><td>Flow and congestion control</td><td>Yes</td><td>No</td></tr>
<tr><td>Overhead</td><td>Higher (20-byte header or more)</td><td>Low (8-byte header)</td></tr>
<tr><td>Typical use</td><td>Web, email, file transfer, remote login</td><td>DNS, DHCP, voice, video, SNMP</td></tr></tbody></table>
<p>The transport layer hides the network from the application. The application does not care whether the network below is a LAN, a satellite link or the Internet, and it does not care that the network is unreliable.</p>
${SEC("1.3","Addressing: port numbers and sockets")}
<p>A host may run a web browser, a mail program and a music player at the same time. To choose between them the transport layer uses a <b>port number</b>, a 16-bit integer from 0 to 65535.</p>
${DEF("Port number","is a 16-bit number that identifies a process on a host. The transport header carries a source port and a destination port.")}
${DEF("Socket address","is the pair (IP address, port number). A connection is identified by two socket addresses, one for each end. TCP uses the four values (source IP, source port, destination IP, destination port) to identify a connection.")}
<ul><li><b>Well-known ports (0 to 1023)</b> are assigned by IANA to standard servers. A client knows the port of the service it wants.</li>
<li><b>Registered ports (1024 to 49151)</b> are registered for applications.</li>
<li><b>Ephemeral (dynamic) ports (49152 to 65535)</b> are chosen at random by the client operating system for the source port of a connection.</li></ul>
<table class="dt gt cmpt"><caption class="small muted" style="text-align:left">Well-known ports that you must know</caption><thead><tr><th>Port</th><th>Service</th><th>Transport</th></tr></thead><tbody>${WK.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('')}</tbody></table>
<p>Try delivering a segment to a server host. The host listens on the sockets in the table.</p>
<div class="vis"><div class="row"><span>Transport ${seg("pdg",[["TCP","TCP"],["UDP","UDP"]])}</span><span>Destination port <input type="number" id="pdp" min="0" max="65535" value="80" style="width:90px" aria-label="Destination port"></span></div>
<table class="dt cmpt"><thead><tr><th>Protocol</th><th>Port</th><th>Process on the server host</th></tr></thead><tbody id="pdt"></tbody></table><div id="pdr" class="callout i small"></div></div>
${DOIT(["Select TCP and port 80. The segment goes to the web server.","Select UDP and port 80. No process listens on UDP 80, so the host sends an ICMP destination unreachable, port unreachable message (Unit IV, Lesson 7).","Select TCP and port 53. A DNS server normally listens on UDP 53, and on TCP 53 for large answers. In this table only UDP 53 is open."])}
${SEC("1.4","Multiplexing and demultiplexing")}
<p><b>Multiplexing</b> at the sender: many processes send data and the transport layer adds a header with the port numbers, so that all segments can go to the same network layer. <b>Demultiplexing</b> at the receiver: the transport layer reads the port numbers in each arriving segment and gives the data to the correct process.</p>
<p>UDP demultiplexes by the destination port only. TCP uses all four values of the connection. So one server port (80) can have many connections at the same time, one for each client socket. Step through three connections to one web server.</p>
<div class="vis"><div id="dmx"></div><div id="dms"></div></div>
${SEC("1.5","Other design issues")}
<table class="dt gt cmpt"><thead><tr><th>Issue</th><th>Question</th><th>Solution and lesson</th></tr></thead><tbody>
<tr><td><b>Connection establishment</b></td><td>How do both ends agree to communicate, when packets can be delayed or duplicated?</td><td>Three-way handshake with initial sequence numbers (Lesson 3)</td></tr>
<tr><td><b>Connection release</b></td><td>How do both ends close without losing data?</td><td>Four-step release and TIME_WAIT (Lesson 3)</td></tr>
<tr><td><b>Error control</b></td><td>How are lost, damaged and duplicate segments handled?</td><td>Checksum, sequence numbers, acknowledgements, retransmission (Lessons 2 and 4)</td></tr>
<tr><td><b>Flow control</b></td><td>How is a fast sender stopped from overflowing a slow receiver?</td><td>Sliding window with the receiver window (Lesson 5)</td></tr>
<tr><td><b>Congestion control</b></td><td>How is the sender stopped from overloading the network?</td><td>Slow start, congestion avoidance (Lesson 6)</td></tr>
<tr><td><b>Buffering</b></td><td>How many segments does each end store?</td><td>Window sizes (Lesson 5)</td></tr>
<tr><td><b>Multiplexing</b></td><td>How do many processes share one connection to the network?</td><td>Port numbers (this lesson)</td></tr>
<tr><td><b>Crash recovery</b></td><td>What if a host crashes and restarts?</td><td>Timers and resets (Lesson 7)</td></tr></tbody></table>
<p>Flow control and error control exist in the data link layer too (Unit II). The difference is that the data link layer works on one link and the transport layer works end to end, across a network whose delay is large and not constant. A segment can wait in a router queue, be lost there, or arrive after a long time. The transport layer must handle this.</p>
${SEC("1.6","Transport primitives and the socket interface")}
<p>The transport service has a few calls (primitives). In the Berkeley socket interface they are the calls shown below. Step through the order of the calls for a TCP client and a TCP server.</p>
<table class="dt gt cmpt"><thead><tr><th>Primitive</th><th>Socket call</th><th>What it does</th></tr></thead><tbody>
<tr><td>LISTEN</td><td>listen()</td><td>The server waits for a client</td></tr>
<tr><td>CONNECT</td><td>connect()</td><td>The client starts a connection (sends SYN)</td></tr>
<tr><td>ACCEPT</td><td>accept()</td><td>The server takes a new connection from the queue</td></tr>
<tr><td>SEND</td><td>send() / write()</td><td>Send data</td></tr>
<tr><td>RECEIVE</td><td>recv() / read()</td><td>Receive data (waits if none)</td></tr>
<tr><td>DISCONNECT</td><td>close()</td><td>Release the connection</td></tr></tbody></table>
<div class="vis"><svg id="skc" role="img" aria-label="Socket calls"></svg><div id="sks"></div></div>
${quiz("p1q1","What does the transport layer add to the network layer service?",["Routing between networks","Process-to-process delivery","Framing of bits","Physical addressing"],1,"The network layer delivers host to host. The transport layer uses port numbers to deliver to a process.")}
${quiz("p1q2","A client chooses a source port from the range 49152 to 65535. What is this kind of port called?",["Well-known port","Registered port","Ephemeral port","Reserved port"],2,"The client operating system picks a short-lived (ephemeral) port.")}
${quiz("p1q3","Which values identify a TCP connection?",["Destination port only","Source and destination IP address only","Source IP, source port, destination IP, destination port","MAC addresses"],2,"TCP demultiplexes with all four values, so one server port can serve many clients.")}
${EXAM(["Explain process-to-process delivery. How is it different from host-to-host delivery?","What is a socket address? What are the port ranges and who assigns them?","Explain multiplexing and demultiplexing in the transport layer.","List the design issues of the transport layer.","Write the well-known port numbers of HTTP, SMTP, DNS, SSH, FTP and SNMP. (80, 25, 53, 22, 21 and 20, 161)","Compare connection-oriented and connectionless transport service."])}
${SUM(["The transport layer gives process-to-process delivery. It runs only in the end hosts.","A port number (16 bits) identifies the process. A socket address is (IP address, port).","UDP demultiplexes by destination port. TCP uses the four values of the connection.","Design issues: connection set-up and release, error control, flow control, congestion control, buffering, multiplexing, crash recovery."])}
`,
mount(r){
  let pr='TCP';
  const pd=()=>{const p=+$("#pdp",r).value;$("#pdt",r).innerHTML=PORTS.map(x=>`<tr${x[0]===pr&&x[1]===p?' style="background:var(--pri-soft)"':''}><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td></tr>`).join('');
    const m=PORTS.find(x=>x[0]===pr&&x[1]===p);$("#pdr",r).innerHTML=m?`A ${pr} segment for port ${p} is <b>delivered to the ${m[2]}</b>.`:(pr==='TCP'?`No process listens on TCP port ${p}. The host sends a <b>TCP reset (RST)</b> and the connection attempt fails.`:`No process listens on UDP port ${p}. The host sends an <b>ICMP destination unreachable (port unreachable)</b> message.`)};
  bindSeg(r,"pdg",v=>{pr=v;pd()});$("#pdp",r).oninput=pd;pd();
  /* socket demux story */
  const C=[['10.0.0.1',49152,'Browser tab 1 on host A'],['10.0.0.1',49153,'Browser tab 2 on host A'],['10.0.0.2',49152,'Browser on host B']];
  const dm=story(r,"#dms",{draw:i=>{const rows=C.slice(0,Math.min(3,i+1));
    $("#dmx",r).innerHTML=`<table class="dt cmpt"><thead><tr><th>Segment arrives at server 10.0.0.9</th><th>Four values</th><th>Socket that gets the data</th></tr></thead><tbody>${rows.map((c,k)=>`<tr${k===Math.min(2,i)&&i<3?' style="background:var(--pri-soft)"':''}><td>${c[2]}</td><td><code>${c[0]}:${c[1]} to 10.0.0.9:80</code></td><td>Socket ${k+1}</td></tr>`).join('')}</tbody></table>`+(i>=3?'<div class="small" style="margin-top:6px">UDP would use only the destination port. The segments would all go to one socket.</div>':'')}});
  dm.set([{cap:'<b>Connection 1.</b> Tab 1 on host A opens a connection to the web server. The client OS chooses the ephemeral source port 49152. The server creates socket 1 for the four values (10.0.0.1, 49152, 10.0.0.9, 80).'},{cap:'<b>Connection 2.</b> Tab 2 on the same host A uses a different source port, 49153. The destination is the same (port 80), but the four values differ, so the server creates socket 2.'},{cap:'<b>Connection 3.</b> Host B uses the same source port 49152 as tab 1. The source IP address is different, so the four values are different and the server creates socket 3.'},{cap:'<b>Demultiplexing.</b> When a segment arrives, TCP reads the four values and delivers the data to the matching socket. One well-known port (80) serves many clients. This is why a web server can handle thousands of connections on a single port.'}]);
  /* socket calls */
  const sk=story(r,"#sks",{draw:i=>seqd($("#skc",r),{actors:['Client','Server'],msgs:SOCKCALL,rowH:36},i)});
  sk.set([{cap:'<b>The server creates a socket</b> (the end point that the program uses to talk to the transport layer). bind() attaches it to the well-known port 80 and listen() puts it in the LISTEN state to wait for connection requests.'},{cap:'<b>The client creates a socket</b> and calls connect() with the server IP address and port 80.'},{cap:'<b>Three-way handshake.</b> The transport layers exchange SYN, SYN+ACK and ACK (Lesson 3). On the server, accept() returns a new socket for this client. The original socket keeps listening for other clients.'},{cap:'<b>The client sends a request</b> with send(). The server reads it with recv().'},{cap:'<b>The server sends the reply</b> and the client reads it.'},{cap:'<b>close()</b>: both ends release the connection (Lesson 3).'}]);
}});

/* ===== Unit V Lesson 2: UDP ===== */
const UDPH=[[{n:'Source port',b:16,note:'Port of the sending process. It is optional: it may be 0 if no reply is wanted.'},{n:'Destination port',b:16,note:'Port of the receiving process (for example 53 for DNS). The receiver demultiplexes with this value.'}],[{n:'Length',b:16,note:'Length of the whole user datagram in bytes, header plus data. Minimum 8.'},{n:'Checksum',b:16,note:'16-bit one\'s complement checksum over a pseudo-header, the UDP header and the data. In IPv4 it may be 0 (not used). In IPv6 it is required.'}]];
const RTPH=[[{n:'V',b:2,bl:'2 bits',note:'Version, value 2.'},{n:'P',b:1,bl:'1',note:'Padding present at the end.'},{n:'X',b:1,bl:'1',note:'Extension header present.'},{n:'CC',b:4,bl:'4 bits',note:'Number of contributing sources (CSRC) that follow the header.'},{n:'M',b:1,bl:'1',note:'Marker. For video it marks the last packet of a frame.'},{n:'Payload type',b:7,bl:'7 bits',note:'Says how the media is coded (for example 0 = PCM mu-law audio, 26 = JPEG video).'},{n:'Sequence number',b:16,note:'Increases by 1 for each packet. The receiver detects loss and puts packets in order.'}],[{n:'Timestamp',b:32,note:'Sampling time of the first byte of the data. The receiver uses it to play the media at the right pace and to measure jitter.'}],[{n:'SSRC',b:32,note:'Identifies the source of the stream.'}]];
const udpWords=(src,dst,sp,dp,txt,corrupt)=>{let d=utf8(txt);const len=8+d.length;if(d.length%2)d=[...d,0];const dw=[];for(let i=0;i<d.length;i+=2)dw.push((d[i]<<8)|d[i+1]);
  const rows=[['Source IP (high)',src>>>16],['Source IP (low)',src&0xFFFF],['Destination IP (high)',dst>>>16],['Destination IP (low)',dst&0xFFFF],['Zero + protocol 17',0x0011],['UDP length',len],['Source port',sp],['Destination port',dp],['Length',len],['Checksum (set to 0)',0]];
  dw.forEach((w,i)=>rows.push(['Data word '+(i+1)+' ("'+String.fromCharCode(w>>8,w&255).replace(/\0/g,'')+'")',w]));return {rows,len,dw}};
lesson({nav:"2. UDP",title:"User Datagram Protocol (UDP)",syl:"UDP (Header Format, Per-Segment Checksum, Carrying Unicast/Multicast Real-Time Traffic)",
html:()=>`
${GUIDE({"syl":"UDP (Header Format, Per-Segment Checksum, Carrying Unicast/Multicast Real-Time Traffic)","why":"UDP is the simplest transport protocol. It adds only port numbers and an optional error check to IP. It is used where speed matters more than reliability: DNS, DHCP, SNMP, and live voice and video.","map":[["2.1","What UDP provides","What does UDP do and not do?","Read the list."],["2.2","Header format","What is in the 8-byte header?","Click each field."],["2.3","Per-segment checksum","How is a damaged datagram detected?","Compute a checksum and corrupt a byte."],["2.4","Real-time traffic","Why is UDP used for voice and video?","Change the playout delay."],["2.5","Unicast and multicast","How does one stream reach many receivers?","Compare the traffic."]],"osi":"Layer 4 (transport layer), using IP (protocol number 17) at layer 3.","pre":"Lesson 1; Unit IV, Lessons 4 and 6 (multicast, IP header).","time":"about 1 hour 15 minutes","next":"Lesson 3, TCP connection management."})}
${LEARN(["list what UDP does and does not provide","draw the UDP header and explain each field","calculate the UDP checksum with the pseudo-header","explain why real-time traffic uses UDP, and what RTP adds","explain the use of UDP for unicast and multicast"])}
${SEC("2.1","What UDP provides")}
${DEF("UDP (User Datagram Protocol, RFC 768)","is a connectionless, unreliable transport protocol. It provides process-to-process delivery by port numbers and a simple error check. It does nothing else.")}
<ul><li><b>Connectionless.</b> There is no handshake. Each user datagram is independent of the others.</li>
<li><b>Unreliable.</b> There is no acknowledgement, no retransmission, no ordering and no duplicate removal. If a datagram is lost, UDP does not know.</li>
<li><b>No flow control and no congestion control.</b> The sender can send at any rate.</li>
<li><b>Message oriented.</b> The boundaries of the application messages are kept. One send() call gives one datagram and one recv() call.</li>
<li><b>Low overhead.</b> The header is only 8 bytes.</li></ul>
<p>An application chooses UDP when (a) a request and a reply are small and a connection set-up would cost more than the data (DNS), (b) a late packet is useless, so it is better to lose it than to wait for a copy (voice, video, games), (c) the application does its own error control, or (d) the data is sent to many receivers (multicast and broadcast).</p>
${SEC("2.2","Header format")}
<p>The UDP header has four fields of 16 bits each. Click a field.</p>
<div class="vis"><div id="uh"></div><div id="ud" class="small" style="margin-top:8px;min-height:3em"></div></div>
<p>The user datagram is carried in the data part of an IP datagram. The IP header has Protocol = 17. The maximum length is 65,535 bytes, but the IP header takes 20 bytes and the UDP header 8 bytes, so the data is at most 65,507 bytes. In practice it is kept below the MTU (about 1472 bytes on Ethernet) to avoid fragmentation (Unit IV, Lesson 7).</p>
${SEC("2.3","Per-segment checksum")}
<p>The checksum protects the UDP header, the data and some IP fields. The IP fields (source address, destination address, protocol) are included so that a datagram that was delivered to the wrong host or the wrong protocol is detected. They are taken from a <b>pseudo-header</b> that is used only for the calculation and is not sent.</p>
<ol><li>Build the pseudo-header: source IP address (32 bits), destination IP address (32 bits), a byte of zeros, the protocol number (17) and the UDP length (16 bits).</li>
<li>Add the UDP header with the checksum field set to 0, and the data. If the data has an odd number of bytes, add a zero byte (this byte is not sent).</li>
<li>Divide everything into 16-bit words and add them in <b>one's complement</b> arithmetic: if a carry comes out of bit 16, add it back at the right.</li>
<li>The checksum is the <b>one's complement</b> (every bit inverted) of the sum. If the result is 0, send FFFF (0 means "no checksum").</li>
<li>The receiver does the same sum over everything, including the received checksum. If no bits changed, the result is <b>FFFF</b>. Any other result means an error and the datagram is discarded without a message.</li></ol>
<div class="vis"><div class="row"><span>Source IP <input id="us" value="10.0.0.1" size="12" aria-label="Source IP"></span><span>Destination IP <input id="ud2" value="10.0.0.9" size="12" aria-label="Destination IP"></span><span>Source port <input id="usp" type="number" value="5000" style="width:80px" aria-label="Source port"></span><span>Destination port <input id="udp" type="number" value="53" style="width:80px" aria-label="Destination port"></span></div>
<div class="row"><span>Data <input id="udt" value="HELLO" size="18" aria-label="Data text"></span><label class="pill"><input type="checkbox" id="ucr">Damage the data in transit (flip one bit)</label></div><div id="ucs"></div></div>
${DOIT(["Use the default values. The data has 5 bytes, so a zero byte is added and the UDP length is 13.","Read the running sum column. A carry out of 16 bits is added back (marked in the table).","Tick the damage box. The receiver sum is not FFFF, so the datagram is discarded.","Change the data to text of an even length and check that nothing is added."])}
<p>The checksum finds most errors, but not all. If two words change in a way that cancels, the sum stays the same. The checksum is also weaker than the CRC of the data link layer (Unit II).</p>
${SEC("2.4","Carrying real-time traffic")}
<p>Voice and video are <b>real-time traffic</b>. The data must reach the receiver in time to be played. A packet that arrives late is useless. TCP is a poor choice for this: its retransmissions add delay, and its congestion control cuts the rate when a loss occurs. So real-time applications use UDP and add what they need above it, with the <b>Real-time Transport Protocol (RTP)</b>.</p>
${DEF("RTP (RFC 3550)","is an application-level protocol that runs over UDP. Each RTP packet carries a sequence number, a timestamp and a payload type. The companion protocol <b>RTCP</b> carries reports about the quality (loss, delay, jitter) between the sender and the receivers.")}
<div class="vis"><div id="rh"></div><div id="rd" class="small" style="margin-top:8px;min-height:3em"></div></div>
<p>The packets of one stream leave at regular intervals, but the delays in the network are not constant. The variation of the delay is <b>jitter</b>. The receiver stores the packets in a <b>playout buffer</b> and starts the playout after a fixed <b>playout delay</b>. A packet that arrives after its play time is discarded as late. A long playout delay loses fewer packets but adds delay to a conversation (more than about 150 ms is noticeable).</p>
<div class="vis"><div class="row"><span>Playout delay <input type="range" id="pod" min="20" max="220" step="10" value="80" aria-label="Playout delay"> <b id="podv">80</b> ms</span><span>Network jitter ${seg("jig",[["lo","Low"],["mid","Medium"],["hi","High"]],"mid")}</span><button type="button" class="btn sm" id="jnew">New random run</button></div><svg id="jsv" role="img" aria-label="Packet delays against the playout delay"></svg><div id="jres" class="callout i small"></div></div>
${DOIT(["With the default values some packets are late (red). Increase the playout delay until none is late. Note the delay that is needed.","Select High jitter. The needed playout delay is larger, so the conversation has more delay.","Reduce the playout delay to 40 ms. Many packets are lost. This is the choice that a real-time application makes: a lower delay and some loss."])}
${SEC("2.5","Unicast and multicast")}
<p>UDP can carry a stream to one receiver (<b>unicast</b>) or to a group (<b>multicast</b>). For multicast the destination IP address is a class D address (224.0.0.0 to 239.255.255.255, prefix 224.0.0.0/4) that names a group. Hosts join the group with IGMP. The routers copy the datagram at the branch points of a tree (Unit IV, Lesson 4). TCP cannot do this because a TCP connection is between exactly two hosts. For multicast to a group UDP is the only choice.</p>
<div class="vis"><div class="row"><span>Receivers <input type="range" id="mn" min="1" max="100" value="20" aria-label="Number of receivers"> <b id="mnv">20</b></span><span>Stream rate <input type="range" id="mr" min="1" max="8" value="2" aria-label="Rate in Mbit/s"> <b id="mrv">2</b> Mbit/s</span></div><div id="mres"></div></div>
${DOIT(["With 20 receivers and 2 Mbit/s the unicast sender must send 40 Mbit/s. The multicast sender sends 2 Mbit/s.","Increase the receivers to 100. Unicast needs 200 Mbit/s. Multicast still needs 2 Mbit/s on the sender link."])}
${quiz("p2q1","What is the length of the UDP header?",["4 bytes","8 bytes","20 bytes","32 bytes"],1,"Four fields of 16 bits: source port, destination port, length and checksum.")}
${quiz("p2q2","Why does the UDP checksum include a pseudo-header with the IP addresses?",["To make the datagram longer","To detect a datagram that was delivered to the wrong host or protocol","To encrypt the datagram","To find the route"],1,"If the IP header is damaged, the datagram can reach the wrong host. The pseudo-header makes the UDP checksum depend on the addresses.")}
${quiz("p2q3","Why is UDP preferred for live voice?",["It is reliable","A late packet is useless, so retransmission would only add delay","It encrypts the voice","It has a larger header"],1,"Real-time data must arrive in time. TCP retransmissions and congestion control add delay.")}
${EXAM(["Draw the UDP header and state the use of each field.","Explain the calculation of the UDP checksum. Why is a pseudo-header used?","Calculate the checksum of a user datagram with the 16-bit words 4500, 0073 and 4011 (one's complement sum). (Sum: 4500 + 0073 = 4573, + 4011 = 8584. Checksum = 7A7B.)","Why is UDP used for real-time traffic? What does RTP add to UDP?","What is jitter? How does a playout buffer reduce its effect?","Explain how UDP carries multicast traffic. Why can TCP not do this?","Give four applications that use UDP and the port of each. (DNS 53, DHCP 67/68, SNMP 161, TFTP 69, NTP 123.)"])}
${SUM(["UDP gives process-to-process delivery with an 8-byte header and nothing more: no connection, no reliability, no flow or congestion control.","The checksum is the one's complement of the one's complement sum of the pseudo-header, the UDP header and the data. The receiver gets FFFF if there is no error.","Real-time traffic uses UDP and adds RTP (sequence number, timestamp) and a playout buffer to handle jitter.","UDP can send to a multicast group. One copy leaves the sender and the routers copy it where the paths split."])}
`,
mount(r){
  hdrGrid($("#uh",r),UDPH,f=>{$("#ud",r).innerHTML=`<b>${f.n}</b> (${f.b} bits). ${f.note}`});
  hdrGrid($("#rh",r),RTPH,f=>{$("#rd",r).innerHTML=`<b>${f.n}</b>. ${f.note} <span class="muted">(RTP header: 12 bytes, carried in the UDP data.)</span>`});
  const ck=()=>{const s=ip2n($("#us",r).value),d=ip2n($("#ud2",r).value),sp=+$("#usp",r).value,dp=+$("#udp",r).value,txt=$("#udt",r).value||'A',o=$("#ucs",r);
    if(s==null||d==null){o.innerHTML='<div class="warn small">Enter valid IPv4 addresses.</div>';return}
    const {rows,len}=udpWords(s,d,sp&0xFFFF,dp&0xFFFF,txt);const a=ocsum(rows.map(x=>x[1]));const cs=(~a.sum&0xFFFF)||0xFFFF;
    const all=rows.map(x=>x[1]).slice();all[9]=cs;if($("#ucr",r).checked){const k=10;all[k]=all[k]^1}const b=ocsum(all);
    o.innerHTML=`<table class="dt cmpt"><thead><tr><th>Word</th><th>Hex</th><th>Running sum</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${x[0]}</td><td><code>${h4(x[1])}</code></td><td><code>${h4(a.steps[i][1])}</code>${a.steps[i][2]?' (carry added back)':''}</td></tr>`).join('')}</tbody></table>
    <div class="small" style="margin:6px 0">Sum = <code>${h4(a.sum)}</code>. Checksum = one's complement = <b><code>${h4(cs)}</code></b>. UDP length = ${len} bytes.</div>
    <div class="callout ${b.sum===0xFFFF?'i':'k'} small"><b>Receiver:</b> sum of all words including the checksum = <code>${h4(b.sum)}</code>. ${b.sum===0xFFFF?'The result is FFFF, so no error is found.':'The result is not FFFF, so the datagram is <b>discarded</b>.'}</div>`};
  ['#us','#ud2','#usp','#udp','#udt'].forEach(s=>$(s,r).oninput=ck);$("#ucr",r).onchange=ck;ck();
  /* jitter */
  let seed=7,lvl='mid';const SD={lo:25,mid:55,hi:100};
  const js=()=>{const pd=+$("#pod",r).value;$("#podv",r).textContent=pd;const rn=prng(seed),N=50,base=30,sp=SD[lvl];const dl=[];for(let i=0;i<N;i++){const u=rn()+rn()+rn()-1.5;dl.push(Math.max(5,Math.round(base+sp*(0.5+u*0.8))))}
    const W=760,H=250,m={l:50,r:12,t:12,b:36},iw=W-m.l-m.r,ih=H-m.t-m.b,ym=Math.max(240,...dl)+10,X=i=>m.l+(i+0.5)*iw/N,Y=v=>m.t+ih-v/ym*ih;let late=0;
    let s=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(0)}" y2="${Y(0)}" class="axis"/><line x1="${m.l}" x2="${m.l}" y1="${m.t}" y2="${Y(0)}" class="axis"/>`;
    for(let v=0;v<=ym;v+=50)s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line2)"/><text x="${m.l-6}" y="${Y(v)+4}" text-anchor="end" class="tk">${v}</text>`;
    dl.forEach((v,i)=>{const lt=v>pd;if(lt)late++;s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="4.5" fill="${lt?'var(--bad)':'var(--good)'}"/>`});
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(pd)}" y2="${Y(pd)}" stroke="var(--sec)" stroke-width="3"/><text x="${W-m.r-4}" y="${Y(pd)-6}" text-anchor="end" class="sl" style="font-size:12px">playout delay ${pd} ms</text><text x="${m.l+iw/2}" y="${H-6}" text-anchor="middle" class="sl">packet number</text><text x="12" y="${m.t+ih/2}" text-anchor="middle" class="sl" transform="rotate(-90 12 ${m.t+ih/2})">network delay (ms)</text>`;
    $("#jsv",r).setAttribute('viewBox',`0 0 ${W} ${H}`);$("#jsv",r).innerHTML=s;
    const need=Math.max(...dl),mean=Math.round(dl.reduce((a,b)=>a+b)/N);
    $("#jres",r).innerHTML=`Late packets: <b>${late} of ${N}</b> (${late*2}%). Mean network delay ${mean} ms, largest ${need} ms. A playout delay of ${need} ms would lose none. Green = played, red = discarded as late.${pd>150?' <b>The total delay is above 150 ms, which is noticeable in a conversation.</b>':''}`};
  $("#pod",r).oninput=js;$("#jnew",r).onclick=()=>{seed=seed*7+3;js()};bindSeg(r,"jig",v=>{lvl=v;js()});js();
  const mc=()=>{const n=+$("#mn",r).value,rt=+$("#mr",r).value;$("#mnv",r).textContent=n;$("#mrv",r).textContent=rt;
    $("#mres",r).innerHTML=KV([['Unicast: sender link load',`${n} copies x ${rt} Mbit/s = <b>${n*rt} Mbit/s</b>`],['Multicast: sender link load',`1 copy x ${rt} Mbit/s = <b>${rt} Mbit/s</b>`],['Saving at the sender',`${Math.round((1-1/n)*100)}%`]])+`<div class="small muted" style="margin-top:4px">Inside the network, the routers copy the multicast datagram only where the paths to the members split.</div>`};
  $("#mn",r).oninput=mc;$("#mr",r).oninput=mc;mc();
}});

/* ===== Unit V Lesson 3: TCP connection management ===== */
const TS={CLOSED:[380,28],SYN_SENT:[130,100],LISTEN:[630,100],SYN_RCVD:[630,180],ESTABLISHED:[380,250],FIN_WAIT_1:[130,320],CLOSE_WAIT:[630,320],FIN_WAIT_2:[130,395],LAST_ACK:[630,395],CLOSING:[380,355],TIME_WAIT:[130,450]};
const TE=[{a:'CLOSED',b:'LISTEN',label:'passive open',lp:[540,52]},{a:'CLOSED',b:'SYN_SENT',label:'active open / SYN',lp:[225,52]},{a:'LISTEN',b:'SYN_RCVD',label:'rcv SYN / SYN+ACK',lp:[690,142]},{a:'SYN_SENT',b:'ESTABLISHED',label:'rcv SYN+ACK / ACK',lp:[210,190]},{a:'SYN_RCVD',b:'ESTABLISHED',label:'rcv ACK',lp:[520,222]},
 {a:'ESTABLISHED',b:'FIN_WAIT_1',label:'close / FIN',lp:[250,296]},{a:'ESTABLISHED',b:'CLOSE_WAIT',label:'rcv FIN / ACK',lp:[520,296]},{a:'FIN_WAIT_1',b:'FIN_WAIT_2',label:'rcv ACK',lp:[85,360]},{a:'FIN_WAIT_1',b:'CLOSING',label:'rcv FIN / ACK',lp:[270,345]},{a:'FIN_WAIT_2',b:'TIME_WAIT',label:'rcv FIN / ACK',lp:[80,426]},{a:'CLOSING',b:'TIME_WAIT',label:'rcv ACK',lp:[300,420]},
 {a:'TIME_WAIT',b:'CLOSED',label:'timeout 2 MSL',via:[[30,450],[30,28]],lp:[75,250]},{a:'CLOSE_WAIT',b:'LAST_ACK',label:'close / FIN',lp:[690,362]},{a:'LAST_ACK',b:'CLOSED',label:'rcv ACK',via:[[740,395],[740,28]],lp:[700,250]}];
const CPATH=[{cur:['CLOSED'],hl:[],cap:'<b>CLOSED.</b> There is no connection. The client program calls connect().'},{cur:['SYN_SENT'],hl:[1],cap:'<b>Active open.</b> The client sends a SYN segment and goes to <b>SYN_SENT</b>.'},{cur:['ESTABLISHED'],hl:[1,3],cap:'<b>The SYN+ACK arrives.</b> The client sends the third segment, an ACK, and goes to <b>ESTABLISHED</b>. Data can now be sent in both directions.'},{cur:['FIN_WAIT_1'],hl:[1,3,5],cap:'<b>Active close.</b> The client program calls close(). The client sends a FIN and goes to <b>FIN_WAIT_1</b>.'},{cur:['FIN_WAIT_2'],hl:[1,3,5,7],cap:'<b>The ACK of the FIN arrives.</b> The client goes to <b>FIN_WAIT_2</b>. The client has finished sending, but it can still receive data (half-close).'},{cur:['TIME_WAIT'],hl:[1,3,5,7,9],cap:'<b>The server FIN arrives.</b> The client sends an ACK and goes to <b>TIME_WAIT</b>. It waits for two maximum segment lifetimes (2 MSL).'},{cur:['CLOSED'],hl:[1,3,5,7,9,11],cap:'<b>The timer expires.</b> The connection is CLOSED and its socket pair can be used again.'}];
const SPATH=[{cur:['CLOSED'],hl:[],cap:'<b>CLOSED.</b> The server program has created a socket.'},{cur:['LISTEN'],hl:[0],cap:'<b>Passive open.</b> The server calls listen() and goes to <b>LISTEN</b>. It waits for a SYN.'},{cur:['SYN_RCVD'],hl:[0,2],cap:'<b>A SYN arrives.</b> The server sends SYN+ACK and goes to <b>SYN_RCVD</b>. This is the state that a SYN flood attack fills.'},{cur:['ESTABLISHED'],hl:[0,2,4],cap:'<b>The ACK arrives.</b> The server goes to <b>ESTABLISHED</b>.'},{cur:['CLOSE_WAIT'],hl:[0,2,4,6],cap:'<b>A FIN arrives.</b> The server sends an ACK and goes to <b>CLOSE_WAIT</b>. The server program may still send data.'},{cur:['LAST_ACK'],hl:[0,2,4,6,12],cap:'<b>The server closes.</b> It sends its own FIN and goes to <b>LAST_ACK</b>.'},{cur:['CLOSED'],hl:[0,2,4,6,12,13],cap:'<b>The last ACK arrives.</b> The server goes to <b>CLOSED</b>. The server does not use TIME_WAIT here, because the client, which closed first, does.'}];
lesson({nav:"3. TCP: connection management",title:"TCP connection management",syl:"TCP (Connection Management)",
html:()=>`
${GUIDE({"syl":"TCP (Connection Management)","why":"TCP is connection oriented. Before data moves, both ends must agree to communicate and agree on the starting sequence numbers. When the data is done, both ends must close without losing data. This lesson describes the three-way handshake, the four-step release and the state machine that controls both.","map":[["3.1","What TCP provides","What are the features of TCP?","Read the list."],["3.2","Three-way handshake","How is a connection opened?","Step through the exchange and enter your own sequence number."],["3.3","Why three steps","What if an old SYN arrives late?","Select the delayed duplicate case."],["3.4","Connection release","How is a connection closed?","Step through the four segments."],["3.5","State machine","Which states does each end pass through?","Follow the client and the server paths."]],"osi":"Layer 4 (transport layer). TCP is IP protocol number 6.","pre":"Lesson 1 (ports, sockets).","time":"about 1 hour 30 minutes","next":"Lesson 4, reliability of data transfer."})}
${LEARN(["list the features of TCP","trace the three-way handshake with sequence and acknowledgement numbers","explain why a three-way handshake is used","trace the connection release and explain TIME_WAIT","follow the TCP state diagram for a client and a server"])}
${SEC("3.1","What TCP provides")}
${DEF("TCP (Transmission Control Protocol, RFC 9293)","is a connection-oriented, reliable, byte-stream transport protocol. It gives a full-duplex connection between two processes, with flow control and congestion control.")}
<ul><li><b>Connection oriented.</b> A connection is set up and released. It is identified by the four values (source IP, source port, destination IP, destination port).</li>
<li><b>Byte stream.</b> The application writes bytes. TCP cuts them into segments. It does not keep the boundaries of the writes.</li>
<li><b>Numbered bytes.</b> Every byte has a sequence number. The sequence number in a segment is the number of its first byte.</li>
<li><b>Reliable.</b> Data arrives complete, in order and without duplicates (Lesson 4).</li>
<li><b>Full duplex.</b> Both ends send data at the same time on the same connection. Each segment can carry an acknowledgement for the other direction (piggybacking).</li>
<li><b>Flow control and congestion control</b> (Lessons 5 and 6).</li></ul>
${SEC("3.2","Connection establishment: the three-way handshake")}
<p>The client opens the connection (<b>active open</b>). The server has waited with listen() (<b>passive open</b>). Three segments are exchanged. Each end picks an <b>initial sequence number (ISN)</b> for its own data. The ISN is chosen from a clock or at random, not always 0, so that segments of an old connection with the same ports are not accepted as new data.</p>
<ol><li><b>SYN.</b> The client sends a segment with the SYN flag and its ISN <i>x</i>.</li>
<li><b>SYN+ACK.</b> The server sends a segment with SYN and ACK, its own ISN <i>y</i>, and the acknowledgement number <i>x + 1</i>.</li>
<li><b>ACK.</b> The client sends an ACK with sequence number <i>x + 1</i> and acknowledgement number <i>y + 1</i>.</li></ol>
<p>A SYN segment carries no data but it <b>uses one sequence number</b>. That is why the acknowledgement is x + 1. The same is true of a FIN. During the handshake the two ends also exchange options: the <b>maximum segment size (MSS)</b>, the window scale factor and the selective acknowledgement permission.</p>
<div class="vis"><div class="row"><span>Client ISN x <input type="number" id="hx" value="1000" min="0" max="4000000000" style="width:120px" aria-label="Client ISN"></span><span>Server ISN y <input type="number" id="hy" value="5000" min="0" max="4000000000" style="width:120px" aria-label="Server ISN"></span></div>
<div class="row">${seg("hdg",[["n","Normal handshake"],["d","Delayed duplicate SYN"]])}</div><svg id="hs" role="img" aria-label="Three-way handshake"></svg><div id="hss"></div></div>
${DOIT(["Change x and y and watch the acknowledgement numbers: they are always the other end's number plus 1.","Open the connection and note the states in the notes at the two sides of the picture.","Select the delayed duplicate case and read the next section."])}
${SEC("3.3","Why three segments are needed")}
<p>Suppose that only two segments were used (SYN and SYN+ACK). A SYN from an old, closed connection can be delayed in the network and arrive at the server much later. The server would think that it is a new request, send SYN+ACK and open a connection. The client does not want it, so the server would hold resources for a connection that nobody uses. With three segments the server waits for the third one. The client checks the acknowledgement number in the SYN+ACK. If it does not match the ISN of a request that the client really made, the client sends a reset (RST) and the server drops the half-open connection. Select the "Delayed duplicate SYN" case above to see this.</p>
<p>A server has a limited queue of half-open connections (in SYN_RCVD). A <b>SYN flood</b> attack sends many SYN segments with false source addresses and never sends the third segment. The queue fills and real clients cannot connect. A defence is <b>SYN cookies</b>: the server encodes the connection data in its ISN and keeps no state until the ACK arrives.</p>
${SEC("3.4","Connection release")}
<p>Each direction of a TCP connection is closed on its own. This is called a <b>half-close</b>. One end sends a FIN when it has no more data. The other end acknowledges it, and may continue to send data until it also sends a FIN. So four segments are normally needed.</p>
<div class="vis"><svg id="rs" role="img" aria-label="Connection release"></svg><div id="rss"></div></div>
<p><b>TIME_WAIT.</b> The end that sends the last ACK (normally the one that closed first) does not go to CLOSED at once. It waits for <b>two maximum segment lifetimes (2 MSL)</b>. There are two reasons. (1) If the last ACK is lost, the other end sends its FIN again, and the waiting end can answer it. (2) Old segments of this connection that are still in the network disappear before a new connection with the same four values can start. MSL is defined as 2 minutes in the original standard. Many systems use 30 seconds or 1 minute.</p>
<p>A connection can also be aborted with a <b>RST</b> segment, for example when a segment arrives for a port where nobody listens. The connection is dropped at once and no acknowledgement is sent.</p>
${SEC("3.5","The TCP state machine")}
<p>The behaviour of TCP in each end is described by a finite state machine with 11 states. A line is a change of state. The label gives the <b>event / action</b>: what arrives or what the application does, then what TCP sends. Select the client or the server and press Next step.</p>
<div class="vis"><div class="row">${seg("fsg",[["c","Client (active open and close)"],["s","Server (passive open)"]])}</div><svg id="fsv" role="img" aria-label="TCP state diagram"></svg><div id="fss"></div></div>
<table class="dt gt cmpt"><thead><tr><th>State</th><th>Meaning</th></tr></thead><tbody>
<tr><td><b>CLOSED</b></td><td>No connection</td></tr><tr><td><b>LISTEN</b></td><td>The server waits for a SYN</td></tr><tr><td><b>SYN_SENT</b></td><td>The client has sent a SYN and waits for SYN+ACK</td></tr><tr><td><b>SYN_RCVD</b></td><td>The server has received a SYN and sent SYN+ACK, and waits for the ACK</td></tr><tr><td><b>ESTABLISHED</b></td><td>The connection is open. Data moves.</td></tr><tr><td><b>FIN_WAIT_1</b></td><td>This end has sent a FIN and waits for its ACK</td></tr><tr><td><b>FIN_WAIT_2</b></td><td>The FIN is acknowledged. This end waits for the other FIN.</td></tr><tr><td><b>CLOSE_WAIT</b></td><td>The other end has closed. This end has not yet closed.</td></tr><tr><td><b>CLOSING</b></td><td>Both ends sent a FIN at the same time</td></tr><tr><td><b>LAST_ACK</b></td><td>This end has sent its FIN (after CLOSE_WAIT) and waits for the last ACK</td></tr><tr><td><b>TIME_WAIT</b></td><td>Waits 2 MSL before CLOSED</td></tr></tbody></table>
${quiz("p3q1","The client ISN is 3000. What is the acknowledgement number in the SYN+ACK from the server?",["3000","3001","3002","The server ISN + 1"],1,"A SYN uses one sequence number, so the server acknowledges x + 1 = 3001.")}
${quiz("p3q2","Why does the end that closes first wait in TIME_WAIT?",["To get more data","To answer a repeated FIN if the last ACK was lost, and to let old segments die","To start a new connection","To measure the RTT"],1,"The wait of 2 MSL protects both against a lost final ACK and against old duplicate segments.")}
${quiz("p3q3","Which state does a server enter when it receives a SYN?",["LISTEN","SYN_SENT","SYN_RCVD","CLOSE_WAIT"],2,"After the SYN arrives, the server sends SYN+ACK and waits in SYN_RCVD for the final ACK.")}
${EXAM(["Explain the three-way handshake. Show the sequence and acknowledgement numbers when the client ISN is 8000 and the server ISN is 15000. (SYN seq 8000; SYN+ACK seq 15000 ack 8001; ACK seq 8001 ack 15001.)","Why is a two-way handshake not enough? Explain with a delayed duplicate SYN.","Explain the connection release in TCP. What is half-close?","What is TIME_WAIT? Why is it used?","Draw the TCP state transition diagram for the client.","What is a SYN flood attack? How can it be reduced?"])}
${SUM(["A TCP connection is opened by SYN, SYN+ACK, ACK. Each SYN and FIN uses one sequence number.","The ISN is not fixed, so old segments are not mistaken for new data. The third segment protects the server from delayed duplicate SYNs.","Release uses FIN and ACK in each direction (four segments). The end that closes first waits in TIME_WAIT for 2 MSL.","The state machine has 11 states. The client goes through SYN_SENT and the server through LISTEN and SYN_RCVD."])}

  const R=[{f:0,t:1,label:'FIN seq=u',nl:'FIN_WAIT_1'},{f:1,t:0,label:'ACK ack=u+1',cls:'ack',nl:'FIN_WAIT_2',nr:'CLOSE_WAIT'},{f:1,t:0,label:'last data from the server',cls:'retx'},{f:1,t:0,label:'FIN seq=v',nr:'LAST_ACK'},{f:0,t:1,label:'ACK ack=v+1',cls:'ack',nl:'TIME_WAIT',nr:'CLOSED'},{f:0,t:0,label:'waits 2 MSL, then CLOSED'}];
  const rl=story(r,"#rss",{draw:i=>seqd($("#rs",r),{actors:['Client (closes first)','Server'],msgs:R,rowH:42},i)});
  rl.set([{cap:'<b>FIN.</b> The client has no more data. It sends a FIN and goes to FIN_WAIT_1.'},{cap:'<b>ACK.</b> The server acknowledges the FIN and goes to CLOSE_WAIT. The client goes to FIN_WAIT_2. The direction client to server is closed. The other direction is still open.'},{cap:'<b>Half-close.</b> The server can still send data to the client. The client receives and acknowledges it.'},{cap:'<b>FIN.</b> When the server has finished, it sends its own FIN and goes to LAST_ACK.'},{cap:'<b>ACK.</b> The client acknowledges the server FIN and goes to TIME_WAIT. The server receives the ACK and goes to CLOSED.'},{cap:'<b>TIME_WAIT.</b> The client waits 2 MSL in case the last ACK was lost, and then goes to CLOSED.'}]);

const RSC={
 n:{name:'Normal transfer with delayed ACK',M:[{f:0,t:1,label:'seq=1  (1000 B)'},{f:0,t:1,label:'seq=1001  (1000 B)'},{f:1,t:0,label:'ACK ack=2001',cls:'ack',nr:'next expected: 2001'},{f:0,t:1,label:'seq=2001  (1000 B)'},{f:0,t:1,label:'seq=3001  (1000 B)'},{f:1,t:0,label:'ACK ack=4001',cls:'ack',nr:'next expected: 4001'}],
  S:['<b>The sender sends segment 1</b> with sequence number 1. It carries 1000 bytes (bytes 1 to 1000). The sender starts a timer for the oldest unacknowledged segment.','<b>The sender sends segment 2</b> with sequence number 1001 (bytes 1001 to 2000). It does not wait for an acknowledgement, because the window allows more segments.','<b>A delayed ACK.</b> The receiver waits a short time (up to 500 ms) or until a second segment arrives, and then sends one ACK for both. ack = 2001 means "all bytes up to 2000 have arrived, I expect byte 2001 next". This is a <b>cumulative acknowledgement</b>.','<b>Segment 3</b> (seq = 2001) is sent.','<b>Segment 4</b> (seq = 3001) is sent.','<b>One ACK for the two segments.</b> ack = 4001. The sender removes bytes 1 to 4000 from its buffer and its timer.']},
 t:{name:'Lost segment, timeout',M:[{f:0,t:1,label:'seq=1  (1000 B)'},{f:0,t:1,label:'seq=1001  (1000 B)',lost:true},{f:0,t:1,label:'seq=2001  (1000 B)'},{f:1,t:0,label:'ACK ack=1001',cls:'ack',nr:'next expected: 1001'},{f:1,t:0,label:'ACK ack=1001 (duplicate)',cls:'ack',nr:'2001 kept in buffer'},{f:0,t:0,label:'timer expires (RTO)'},{f:0,t:1,label:'seq=1001  (retransmitted)',cls:'retx'},{f:1,t:0,label:'ACK ack=3001',cls:'ack',nr:'next expected: 3001'}],
  S:['<b>Segment 1</b> arrives and is acknowledged later.','<b>Segment 2</b> (seq = 1001) is <b>lost</b> in the network. The sender does not know yet.','<b>Segment 3</b> (seq = 2001) arrives out of order. The receiver keeps it in its buffer. It cannot deliver it to the application because byte 1001 is missing.','<b>ACK 1001.</b> The receiver acknowledges segment 1. It still expects byte 1001.','<b>Duplicate ACK.</b> The out-of-order segment makes the receiver send the same acknowledgement (ack = 1001) again. A duplicate ACK is a signal that something is missing.','<b>Time-out.</b> Only one duplicate ACK came, which is not enough for a fast retransmit. The retransmission timer of the oldest segment expires after the RTO (Lesson 7).','<b>Retransmission.</b> The sender sends segment 2 again. TCP also reduces its congestion window (Lesson 6).','<b>Cumulative ACK.</b> The receiver already holds bytes 2001 to 3000, so with segment 2 it has bytes 1 to 3000. It acknowledges 3001 at once.']},
 f:{name:'Lost segment, fast retransmit (3 duplicate ACKs)',M:[{f:0,t:1,label:'seq=1  (1000 B)'},{f:0,t:1,label:'seq=1001  (1000 B)',lost:true},{f:0,t:1,label:'seq=2001  (1000 B)'},{f:0,t:1,label:'seq=3001  (1000 B)'},{f:0,t:1,label:'seq=4001  (1000 B)'},{f:1,t:0,label:'ACK ack=1001',cls:'ack'},{f:1,t:0,label:'dup ACK 1 (ack=1001)',cls:'ack'},{f:1,t:0,label:'dup ACK 2 (ack=1001)',cls:'ack'},{f:1,t:0,label:'dup ACK 3 (ack=1001)',cls:'ack'},{f:0,t:1,label:'seq=1001  (fast retransmit)',cls:'retx'},{f:1,t:0,label:'ACK ack=5001',cls:'ack',nr:'next expected: 5001'}],

 a:{name:'Lost acknowledgement',M:[{f:0,t:1,label:'seq=1  (1000 B)'},{f:0,t:1,label:'seq=1001  (1000 B)'},{f:1,t:0,label:'ACK ack=1001',cls:'ack',lost:true},{f:1,t:0,label:'ACK ack=2001',cls:'ack',nr:'next expected: 2001'},{f:0,t:1,label:'seq=2001  (1000 B)'}],
