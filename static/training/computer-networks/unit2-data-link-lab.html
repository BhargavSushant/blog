lesson({nav:"4. Elementary and sliding window protocols",hero:true,title:"Data link protocols: 1-bit, Go-Back-N, Selective Repeat, Hybrid ARQ",syl:"Elementary and Sliding Window protocol: 1-bit, Go-Back-N, Selective Repeat, Hybrid ARQ",
html:()=>`
${GUIDE({"syl": "Data Link Layer Protocol: Elementary and Sliding Window protocol: 1-bit, Go-Back-N, Selective Repeat, Hybrid ARQ", "why": "Lesson 3 describes how the receiver detects a damaged frame. This lesson describes how the sender delivers the data correctly in spite of damaged or lost frames, by using acknowledgements, timers and sequence numbers. You will run the three standard protocols with frame and ACK losses and compare them.", "map": [["4.1", "Automatic repeat request (ARQ)", "What does ARQ need to work?", "Read the four elements and the problem of a lost frame versus a lost ACK."], ["4.2", "Stop-and-Wait ARQ (1-bit sliding window)", "How does the simplest protocol recover from loss?", "Run scenarios A to C and see how a duplicate frame is detected."], ["4.3", "Go-Back-N ARQ", "How does a sender with a window recover from loss?", "Run scenarios A to C and count the frames sent again."], ["4.4", "Selective Repeat ARQ", "Can only the lost frame be sent again?", "Run scenarios A to D and see how the receiver buffers frames."], ["4.5", "Window size and sequence numbers", "Why is the window limited by the number of sequence bits?", "Study a failure case and use the slider."], ["4.6", "Piggybacking, NAK and Hybrid ARQ", "What other techniques are used?", "Read and compare Type I and Type II Hybrid ARQ."], ["4.7", "Comparison of the protocols", "Which protocol suits which link?", "Select the losses and compare all three protocols."]], "osi": "Layer 2 (data link layer). The same ideas are used at layer 4 in TCP, between the end hosts.", "pre": "Lesson 2 (sliding window) and Lesson 3 (error detection).", "time": "about 1 hour 45 minutes", "next": "Lesson 5, protocol verification."})}
${LEARN(["explain why the sender cannot tell a lost frame from a lost ACK","describe how timers, acknowledgements and sequence numbers work together","trace Stop-and-Wait, Go-Back-N and Selective Repeat and find the number of frames each one sends again","find the maximum window size for a given number of sequence bits","explain Hybrid ARQ"])}
${SEC("4.1","Automatic repeat request (ARQ)")}
<p>Lesson 3 describes how the receiver <b>detects</b> a damaged frame. The receiver discards the damaged frame, so the data is missing. <b>Automatic repeat request (ARQ)</b> is the method in which the sender sends the missing data again. ARQ uses four elements.</p>
<table class="dt cmpt"><thead><tr><th>Ingredient</th><th>What it is</th><th>Why it is needed</th></tr></thead><tbody>
<tr><td><b>Acknowledgement (ACK)</b></td><td>A small frame from the receiver that confirms that frame k was received.</td><td>It is the only way the sender learns that a frame arrived.</td></tr>
<tr><td><b>Timer (timeout)</b></td><td>The sender starts a timer when it sends a frame. If no ACK arrives before the timer expires, the sender assumes that the frame is lost.</td><td>A lost frame causes no event at the receiver, so the sender needs a timer to detect the loss.</td></tr>
<tr><td><b>Retransmission</b></td><td>Sending the same frame again.</td><td>It recovers the lost or damaged frame.</td></tr>
<tr><td><b>Sequence number</b></td><td>A number in the header of every frame and ACK.</td><td>The receiver can detect duplicate frames, and the sender knows which frame an ACK confirms.</td></tr></tbody></table>
<p>When the timer expires, the sender cannot know whether the <b>frame</b> was lost or the <b>ACK</b> was lost. In both cases it sends the frame again. If the ACK was lost, the receiver gets the same frame twice. The protocol must therefore detect duplicate frames. This is the sequence number's purpose.</p>
${SEC("4.2","Stop-and-Wait ARQ")}
<p>Stop-and-Wait ARQ is the simplest ARQ protocol. It is also called the <b>1-bit sliding window protocol</b>, because the window size is one frame and the sequence number alternates between 0 and 1.</p>
<div class="card"><b>Sender rules</b><ol><li>Send frame k and start the timer.</li><li>If ACK k arrives before the timer expires, stop the timer and send the next frame.</li><li>If the timer expires, send frame k again and restart the timer.</li></ol><b>Receiver rules</b><ol><li>If the frame is the expected frame, deliver the data, send an ACK and expect the next number.</li><li>If the frame is a <b>duplicate</b> (its number was already received), discard it and send the ACK again.</li></ol></div>
<p>Run the three scenarios one at a time. Press <b>Next event</b> repeatedly (or press Play with "Pause at important moments" selected) and read the commentary above the diagram.</p>
<div class="vis" id="a1"></div>
${WARN("Without sequence numbers, in scenario C the receiver could not recognise that the second F1 is a duplicate. It would pass the same data twice to the network layer. The sequence number prevents this.")}
${SEC("4.3","Go-Back-N")}
<p>Stop-and-Wait uses the link poorly (Lesson 2). In <b>Go-Back-N ARQ</b> the sender can have up to <b>N</b> unacknowledged frames at one time. Sending several frames before an ACK arrives is called <b>pipelining</b>. When one frame is lost, several other frames are already on the link. Go-Back-N handles this as follows.</p>
<div class="card"><b>Sender rules</b><ol><li>Send up to N frames without waiting. Keep a copy of every unacknowledged frame.</li><li>Use <b>one timer</b>, for the oldest unacknowledged frame.</li><li>ACKs are <b>cumulative</b>. ACK k confirms all frames up to and including k. The window then starts at k + 1.</li><li>When the timer expires, <b>go back</b>: send the oldest unacknowledged frame <b>and all frames after it</b> again.</li></ol><b>Receiver rules</b><ol><li>Accept only the next expected frame and send an ACK for it.</li><li>Discard any <b>out-of-order</b> frame and send the ACK for the last correct frame again.</li></ol></div>
<p>The receiver is simple. It needs no buffer for out-of-order frames, only a counter for the next expected frame. The disadvantage is that good frames are sent again after a loss.</p>
<div class="vis" id="a2"></div>
${SEC("4.4","Selective Repeat")}
<p>Go-Back-N discards good frames that arrive after a lost frame. In <b>Selective Repeat ARQ</b> the receiver keeps them.</p>
<div class="card"><b>Sender rules</b><ol><li>Send up to N frames without waiting. Use a <b>separate timer for every frame</b>.</li><li>ACKs are <b>individual</b>. ACK k confirms only frame k.</li><li>When a timer expires, send <b>only that frame</b> again.</li><li>The window slides when the oldest frame is acknowledged.</li></ol><b>Receiver rules</b><ol><li>Accept any frame inside the receive window, even if it is out of order. <b>Store</b> it in a buffer and send an ACK.</li><li>Deliver the data to the network layer <b>in order</b>. When the missing frame arrives, deliver it together with the buffered frames that follow it.</li></ol></div>
<p>Selective Repeat needs buffer space at the receiver, one timer per frame at the sender, and more complex logic. One lost frame causes only one frame to be sent again.</p>
<div class="vis" id="a3"></div>
${SEC("4.5","Window size and sequence numbers")}
<p>The sequence number is a header field of <b>m bits</b>, so there are only 2<sup>m</sup> different numbers. After the highest number, the numbering starts again at 0. The window therefore cannot be as large as the whole number range. The receiver must not mistake an <b>old copy</b> of a frame for a <b>new</b> frame with the same number.</p>
<div class="card"><h3>Failure with a window that is too large (Selective Repeat, m = 2, numbers 0 to 3, window 4)</h3><ol><li>The sender sends frames 0, 1, 2, 3. All four arrive. The receiver delivers them and now expects the numbers <b>0, 1, 2, 3 again</b> (the next cycle).</li><li>All four ACKs are lost.</li><li>The timer expires and the sender sends the <b>old</b> frame 0 again.</li><li>The receiver is expecting a new frame 0. It cannot distinguish the two, so it <b>accepts the old frame as new data</b>. A duplicate is delivered as new data.</li></ol><p>If the window is half of the numbers (2 here), the old and new ranges of numbers do not overlap, and this error cannot occur.</p></div>
<div class="vis"><div class="row">Sequence number bits <b>m</b> <input type="range" id="mb" min="1" max="6" value="3" aria-label="Sequence number bits"> <b id="mbv">3</b></div><div id="mbo"></div></div>
${SEC("4.6","Piggybacking, NAK and Hybrid ARQ")}
<p><b>Piggybacking.</b> When data flows in both directions, the ACK is placed in the header of a data frame that goes in the opposite direction. A separate ACK frame is not needed, which saves bandwidth. If there is no data to send, the receiver waits for a short time and then sends a separate ACK frame.</p>
<p><b>NAK (negative acknowledgement).</b> A receiver that finds a damaged frame or a missing frame can send a NAK for frame k immediately. The sender then sends frame k again without waiting for the timer to expire.</p>
<h3 class="sub">Hybrid ARQ (HARQ)</h3>
<p>ARQ detects errors and sends the frame again. <b>Forward error correction</b> (FEC) adds enough redundancy so that the receiver corrects errors without a retransmission. <b>Hybrid ARQ combines ARQ and FEC.</b> Each frame has some FEC bits, so small errors are corrected at the receiver. If a frame has more errors than FEC can correct, ARQ requests a retransmission.</p>
<ul><li><b>Type I:</b> every frame has FEC bits and an error-detection code. If correction fails, the receiver discards the frame and the whole frame is sent again.</li><li><b>Type II (incremental redundancy):</b> the first transmission has few redundant bits. If decoding fails, the sender does not repeat the frame. It sends <b>additional parity bits</b>. The receiver <b>combines</b> the damaged first frame with the new bits and tries to decode again. Less data is sent in each retransmission.</li></ul>
<p>HARQ is used in 4G and 5G mobile networks, where the radio channel has many errors and retransmission is costly.</p>
${SEC("4.7","Comparison of the protocols")}
<p>Select any protocol, window size and frame or ACK losses. The table under the diagram compares the three protocols for the same losses.</p>
<div class="vis" id="a4"></div>
<table class="dt cmpt"><thead><tr><th></th><th>Stop-and-Wait</th><th>Go-Back-N</th><th>Selective Repeat</th></tr></thead><tbody>
<tr><td><b>Sender window</b></td><td>1</td><td>up to 2<sup>m</sup> - 1</td><td>up to 2<sup>m-1</sup></td></tr>
<tr><td><b>Receiver window</b></td><td>1</td><td>1</td><td>same as sender</td></tr>
<tr><td><b>ACKs</b></td><td>per frame</td><td>cumulative</td><td>individual</td></tr>
<tr><td><b>Receiver buffers out-of-order frames?</b></td><td>not needed</td><td>no, discards</td><td>yes</td></tr>
<tr><td><b>Timers at sender</b></td><td>1</td><td>1</td><td>1 per frame</td></tr>
<tr><td><b>After one lost frame</b></td><td>re-send it</td><td>re-send it and all later frames</td><td>re-send only it</td></tr>
<tr><td><b>Link usage</b></td><td>poor on long links</td><td>good</td><td>good</td></tr>
<tr><td><b>Complexity</b></td><td>lowest</td><td>low</td><td>highest</td></tr></tbody></table>
${SUM(["The sender cannot tell a lost frame from a lost ACK, so after a timeout it sends the frame again. <b>Sequence numbers</b> let the receiver discard duplicates.","<b>Stop-and-Wait</b> sends one frame at a time. <b>Go-Back-N</b> uses a window, cumulative ACKs and sends all frames from the lost frame again. <b>Selective Repeat</b> sends only the lost frame again, but the receiver needs a buffer.","With m-bit numbers, the window is at most <b>2<sup>m</sup> - 1</b> for Go-Back-N and <b>2<sup>m-1</sup></b> for Selective Repeat.","<b>Hybrid ARQ</b> adds forward error correction, so fewer frames are sent again."])}
${quiz("c4q1","Frame 2 is lost; the window is 4 and frames 3, 4, 5 were already sent. How many frames does Go-Back-N re-send, and how many does Selective Repeat?",["GBN 1, SR 1","GBN 4 (frames 2 to 5), SR 1","GBN 1, SR 4","GBN 2, SR 2"],1,"Go-Back-N discards 3, 4, 5 at the receiver, so it sends 2, 3, 4, 5 again. Selective Repeat buffers 3, 4, 5 and sends only 2 again. Run scenario B in both simulations to check.")}
${quiz("c4q2","In Stop-and-Wait, the ACK for frame 1 is lost. What does the receiver do when frame 1 arrives a second time?",["Delivers it again","Discards it, because its sequence number shows that it is a duplicate, and sends the ACK again","Ignores it completely","Sends a NAK"],1,"The receiver already has frame 1 (same sequence number), so it must not deliver it twice. It sends the ACK again, because the sender has not received it.")}
${quiz("c4q3","Sequence numbers are 3 bits long. What are the largest windows for Go-Back-N and Selective Repeat?",["8 and 8","7 and 4","4 and 7","7 and 7"],1,"2<sup>3</sup> - 1 = 7 for Go-Back-N and 2<sup>3-1</sup> = 4 for Selective Repeat.")}
${EXAM(["A sender uses Go-Back-N with window 5 and frames 0 to 9. Frame 3 is lost, the rest are fine. List the frames that are sent on the wire, in order, until all are delivered (assume the timeout fires after frame 7 would have been sent). Check with the simulator.","Why does Selective Repeat need a smaller window than Go-Back-N for the same sequence-number size?","A satellite link has 540 ms one-way delay and 1 Mbps bandwidth; frames are 1000 bits. Which protocol would you choose, and what is the smallest useful window?","Explain how Hybrid ARQ reduces retransmissions.","Define ARQ. State the role of the timer and the sequence number in ARQ."])}`,
mount(r){
  arqLab($("#a1",r),{id:'a1',proto:'sw',fixed:true,N:4,P:3,compare:false,
    scenarios:[{label:'A. Everything works',loseD:[],loseA:[],desc:'<b>Scenario A.</b> No frame or ACK is lost. Each frame is sent, delivered and acknowledged before the next frame is sent. The sender is idle while it waits for each ACK.'},
      {label:'B. A frame is lost',loseD:[1],loseA:[],desc:'<b>Scenario B.</b> Frame F1 is lost on the link. The receiver does not receive it, so it sends no ACK. The timer of the sender expires and the sender sends F1 again.'},
      {label:'C. An ACK is lost',loseD:[],loseA:[1],desc:'<b>Scenario C.</b> F1 arrives correctly but its ACK is lost. The sender cannot distinguish this case from scenario B, so it sends F1 again. The receiver receives F1 <b>twice</b>. The sequence number shows that the second F1 is a duplicate.'}]});
  arqLab($("#a2",r),{id:'a2',proto:'gbn',fixed:true,N:8,P:3,W:4,compare:false,
    scenarios:[{label:'A. No loss: pipelining',loseD:[],loseA:[],desc:'<b>Scenario A.</b> Four frames are sent one after another without waiting. The ACKs return and the window slides forward. Compare the finish time with Stop-and-Wait.'},
      {label:'B. Frame F2 is lost',loseD:[2],loseA:[],desc:'<b>Scenario B.</b> F2 is lost. The receiver gets F3, F4 and F5 but expects F2, so it <b>discards</b> them and repeats ACK1. After the timeout the sender goes back and sends F2, F3, F4 and F5 again. <b>Four frames are sent again for one loss.</b>'},
      {label:'C. An ACK is lost',loseD:[],loseA:[3],desc:'<b>Scenario C.</b> ACK3 is lost, but ACK4 arrives later. ACKs are <b>cumulative</b>, so ACK4 also confirms F3. No retransmission is needed.'}]});
  arqLab($("#a3",r),{id:'a3',proto:'sr',fixed:true,N:8,P:3,W:4,compare:false,
    scenarios:[{label:'A. No loss',loseD:[],loseA:[],desc:'<b>Scenario A.</b> Without losses Selective Repeat works like Go-Back-N, except that each frame has its own ACK.'},
      {label:'B. Frame F2 is lost',loseD:[2],loseA:[],desc:'<b>Scenario B.</b> F3, F4 and F5 arrive out of order. The receiver <b>stores them in its buffer</b> and sends an ACK for each. Only the timer of F2 expires, and only F2 is sent again. When F2 arrives, F2 to F5 are delivered in order. <b>One loss causes one retransmission.</b>'},
      {label:'C. An ACK is lost',loseD:[],loseA:[3],desc:'<b>Scenario C.</b> ACK3 is lost. ACKs are individual, so ACK4 does not confirm F3. The timer of F3 expires and the sender sends F3 again. The receiver detects the duplicate and sends the ACK again.'},
      {label:'D. Two frames lost',loseD:[2,5],loseA:[],desc:'<b>Scenario D.</b> F2 and F5 are lost. Each frame has its own timer, so only F2 and F5 are sent again.'}]});
  arqLab($("#a4",r),{id:'a4',proto:'gbn',N:8,P:3,W:4,loseD:[2]});
  const u=()=>{const m=+$("#mb",r).value;$("#mbv",r).textContent=m;$("#mbo",r).innerHTML=`<table class="dt cmpt"><tbody><tr><td>Different sequence numbers available</td><td class="num">2<sup>${m}</sup> = ${2**m} (0 to ${2**m-1})</td></tr><tr><td>Go-Back-N: maximum window, 2<sup>m</sup> - 1</td><td class="num"><b>${2**m-1}</b></td></tr><tr><td>Selective Repeat: maximum window, 2<sup>m-1</sup></td><td class="num"><b>${2**(m-1)}</b></td></tr><tr><td>Stop-and-Wait</td><td class="num">window 1; m = 1 bit is enough</td></tr></tbody></table>`};
  $("#mb",r).oninput=u;u()}});

/* ===== Lesson 5: protocol verification (FSM and Petri nets) ===== */
/* generic finite-state-machine picture: nodes {id:[x,y,letter,desc]}, edges [{id,f,t,l,lp,off,arc,loop}] */
function fsmPic(svg,N,T,vb){svg.setAttribute('viewBox',vb);arrowDefs(svg);const edges={},nodes={};
  const boxA=(a,b,off)=>boxArrow(svg,a,b,66,26,off);
  T.forEach(t=>{const a=N[t.f],b=N[t.t];
    if(t.loop){const x=a[0],y=a[1],d=t.loop>0?-1:1;edges[t.id]=E('path',{d:`M${x-28},${y+d*26} C${x-48},${y+d*86} ${x+48},${y+d*86} ${x+28},${y+d*26}`,class:'ed','marker-end':'url(#ah)'},svg)}
    else if(t.arc)edges[t.id]=E('path',{d:t.arc,class:'ed','marker-end':'url(#ah)'},svg);
    else edges[t.id]=boxA([a[0],a[1]],[b[0],b[1]],t.off||0);
    E('text',{x:t.lp[0],y:t.lp[1],class:'sm',style:'font-size:12.5px'},svg).textContent=t.l});
  Object.keys(N).forEach(k=>{const [x,y,l,d]=N[k];nodes[k]=E('rect',{x:x-66,y:y-26,width:132,height:52,rx:10,class:'nd'},svg);E('text',{x,y:y-7,class:'nt'},svg).textContent=l;E('text',{x,y:y+12,class:'sm',style:'fill:var(--fg)'},svg).textContent=d});
  return {set(map){Object.keys(nodes).forEach(k=>nodes[k].setAttribute('class','nd'+(map[k]?' '+map[k]:'')))},edge(id,on){Object.values(edges).forEach(e=>e.setAttribute('class',e.getAttribute('class').replace(' path','')));if(on&&edges[on])edges[on].setAttribute('class',edges[on].getAttribute('class')+' path')}}}
/* generic Petri net */
function petri(svg,cfg){svg.setAttribute('viewBox',cfg.vb);arrowDefs(svg);
  const {PL,TR,IN,OUT}=cfg;let mk={...cfg.mk0};
  Object.keys(IN).forEach(t=>{IN[t].forEach(p=>arrow(svg,[PL[p][0],PL[p][1]],[TR[t][0],TR[t][1]],26,16));OUT[t].forEach(p=>{if(cfg.skipOut&&cfg.skipOut(t,p))return;arrow(svg,[TR[t][0],TR[t][1]],[PL[p][0],PL[p][1]],16,28)})});
  (cfg.paths||[]).forEach(d=>E('path',{d,class:'ed','marker-end':'url(#ah)'},svg));
  const tk={},te={};
  Object.keys(PL).forEach(p=>{const [x,y,n,dx,dy]=PL[p];E('circle',{cx:x,cy:y,r:26,class:'nd'},svg);E('text',{x:x+(dx||0),y:y+dy,class:'sm',style:dx?'text-anchor:start':''},svg).textContent=n;tk[p]=E('g',{},svg)});
  Object.keys(TR).forEach(t=>{const [x,y,n,dx,dy]=TR[t];te[t]=E('rect',{x:x-9,y:y-18,width:18,height:36,rx:3,class:'nd',style:'cursor:pointer',tabindex:0,role:'button','aria-label':'fire transition '+n},svg);E('text',{x:x+dx,y:y+dy,class:'sm',style:dx>0?'text-anchor:start':dx<0?'text-anchor:end':''},svg).textContent=n;
    const f=()=>fire(t);te[t].onclick=f;te[t].onkeydown=e=>{if(e.key==='Enter'||e.key===' ')f()}});
  const ok=t=>!(cfg.disabled&&cfg.disabled(t))&&IN[t].every(p=>mk[p]>0);
  const fire=t=>{if(!ok(t))return;const before={...mk};IN[t].forEach(p=>mk[p]--);OUT[t].forEach(p=>mk[p]++);draw(t,before)};
  function draw(fired,before){Object.keys(PL).forEach(p=>{tk[p].innerHTML='';const [x,y]=PL[p],n=mk[p];
      if(n<=3)for(let i=0;i<n;i++)E('circle',{cx:x+(n===1?0:(i-(n-1)/2)*11),cy:y,r:5,fill:'var(--fg)'},tk[p]);else E('text',{x,y,class:'nt'},tk[p]).textContent=n});
    const en=Object.keys(TR).filter(ok);Object.keys(TR).forEach(t=>{te[t].setAttribute('class','nd'+(ok(t)?' en':''));te[t].style.opacity=(cfg.disabled&&cfg.disabled(t))?.25:1});
    cfg.onChange&&cfg.onChange({mk:{...mk},enabled:en,fired,before})}
  draw(null);
  return {reset(){mk={...cfg.mk0};draw(null)},redraw(){draw(null)},add(p){mk[p]++;draw(null)}}}

lesson({nav:"5. Protocol verification (FSM, Petri)",title:"Protocol verification: finite state machines and Petri nets",syl:"Protocol verification: Finite State Machine models and Petri net models",
html:()=>`
${GUIDE({"syl": "Protocol verification: Finite State Machine models and Petri net models", "why": "A protocol can contain an error that appears only in a rare sequence of events. Verification checks all possible behaviours of a model of the protocol before it is used. This lesson models Stop-and-Wait as a finite state machine and as a Petri net, and finds a deadlock.", "map": [["5.1", "Need for protocol verification", "Why is testing not enough?", "Read the types of errors that verification looks for."], ["5.2", "Finite state machine (FSM)", "What are states, events and transitions?", "Apply events to a turnstile and read its transition table."], ["5.3", "FSM model of Stop-and-Wait", "What are the states and events of the protocol?", "Move through the machine. Remove the timer and find a deadlock."], ["5.4", "Reachability analysis", "How are all states checked?", "Run the algorithm with the timer on and off."], ["5.5", "Petri net model", "What are places, tokens and transitions?", "Fire transitions in a simple net and in a Stop-and-Wait net."], ["5.6", "FSM and Petri net compared", "When is each model used?", "Read the comparison table."]], "osi": "Layer 2 (data link layer). The method applies to protocols at any layer.", "pre": "Lesson 4: Stop-and-Wait ARQ, timers and acknowledgements.", "time": "about 1 hour", "next": "Lesson 6, ARP, RARP and GARP."})}
${LEARN(["explain why protocols are verified and define deadlock","read and draw a finite state machine (states, events, transitions)","model Stop-and-Wait as an FSM and find a deadlock by reachability analysis","read a Petri net (places, tokens, transitions) and apply the firing rule"])}
${SEC("5.1","Need for protocol verification")}
<p>A protocol is a set of rules for communication between machines. An error in a protocol is costly to correct after it is in use on many devices. Testing is not sufficient. A protocol can have very many sequences of events (frames arriving, frames lost, timers expiring in different orders), and a test covers only a few of them.</p>
<p><b>Verification</b> is the construction of a <b>model</b> of the protocol and the checking of <b>every</b> possible behaviour of the model. The usual properties that are checked are:</p>
<ul><li><b>Deadlock:</b> can the system reach a state from which no event can occur? (For example, both sides wait for each other.)</li><li><b>Lost progress:</b> can a message wait forever?</li><li><b>Incorrect behaviour:</b> can the receiver deliver a duplicate frame or a frame out of order?</li></ul>
<p>This unit uses two models: <b>finite state machines</b> and <b>Petri nets</b>.</p>
${SEC("5.2","Finite state machine (FSM)")}
${DEF("Finite state machine (FSM)","is a model that has a finite number of <b>states</b> (the conditions of the system), <b>events</b> (inputs that occur) and <b>transitions</b> (a transition gives the next state for a state and an event). One state is the <b>initial state</b>. The machine is in exactly one state at a time.")}
<p>A turnstile has two states: <b>Locked</b> and <b>Unlocked</b>. Two events can occur: a <b>coin</b> is inserted or the arm is <b>pushed</b>. Apply the events in different orders and read the result.</p>
<div class="vis"><svg id="ts" role="img" aria-label="State machine of a turnstile"></svg><div class="row" id="tsb"></div><div class="cap narr" id="tcap" aria-live="polite"></div><div id="tstab"></div></div>
${DOIT(["Press <b>push</b> in the Locked state. The state does not change. The arrow goes back to the same state.","Press <b>coin</b> and then <b>coin</b> again. The second coin does not change the state.","Press <b>push</b> in the Unlocked state. The turnstile goes to the Locked state."])}
<p>The table below the diagram is the same machine as a <b>transition table</b>. Each row is a state, each column is an event, and each cell gives the next state. The diagram and the table have the same information.</p>
${SEC("5.3","FSM model of Stop-and-Wait")}
<p>We now model a protocol. The model describes the transfer of one frame in Stop-and-Wait. The channel is included, because the frame or the ACK can be in transit or lost. Four states are sufficient:</p>
<table class="dt cmpt"><thead><tr><th>State</th><th>Meaning</th></tr></thead><tbody><tr><td><b>A</b> Ready to send</td><td>The sender has the next frame and has not sent it yet.</td></tr><tr><td><b>B</b> Frame in flight</td><td>The frame is on the link. The sender is waiting for the ACK.</td></tr><tr><td><b>C</b> ACK in flight</td><td>The frame has arrived. The ACK is on the link to the sender.</td></tr><tr><td><b>D</b> Lost</td><td>The frame or the ACK is lost. Nothing is on the link. The sender is waiting.</td></tr></tbody></table>
<p>The events are: <i>send</i>, <i>frame arrives</i>, <i>ACK arrives</i>, <i>frame lost</i>, <i>ACK lost</i> and <i>timeout</i> (the timer expires). The buttons show only the events that are possible in the current state.</p>
<div class="vis"><div class="row"><label class="pill"><input type="checkbox" id="tim" checked> The sender has a timeout timer</label><button type="button" class="btn" id="fsr">Reset</button></div><svg id="fsm" role="img" aria-label="State machine of Stop-and-Wait"></svg><div class="row" id="fev"></div><div class="cap narr" id="fcap" aria-live="polite"></div></div>
${DOIT(["From A press <b>send frame</b> and then <b>frame is lost</b>. The machine is in state D.","With the timer <b>ON</b>, state D has an exit (timeout). Use it. The machine goes to state B and the frame is sent again.","Clear the timer option and repeat. State D has <b>no exit</b>, and the sender waits for ever. This is a <b>deadlock</b>."])}
${SEC("5.4","Reachability analysis")}
<p><b>Reachability analysis</b> checks all states of the model. Start from the initial state and find every state that can be reached by any sequence of events. Then check each reachable state for at least one outgoing transition. A reachable state with no outgoing transition is a deadlock. Run the algorithm with the timer on and off.</p>
<div class="vis"><div class="row">${seg("rt",[["on","Timer ON"],["off","Timer OFF"]])}</div><svg id="fsm2" role="img" aria-label="Reachability analysis of the Stop-and-Wait state machine"></svg></div><div id="rchs"></div>
${NOTE("This model is small and checks only for deadlock. A complete verification of Stop-and-Wait includes the sequence number in each state and checks that the receiver never delivers a duplicate frame. The method is the same but the machine is larger. Model checkers such as SPIN explore millions of states automatically.")}
${SEC("5.5","Petri net model")}
<p>An FSM is in one state at a time. This is not convenient when several things occur at the same time, for example a frame on the link, a sender waiting and a timer running. A <b>Petri net</b> can show these concurrent parts directly.</p>
${DEF("Petri net","has <b>places</b> (circles that represent conditions or resources), <b>tokens</b> (dots in places; a token shows that the condition is true or that a resource is available), <b>transitions</b> (bars that represent events) and <b>arcs</b> (arrows that connect places and transitions). The <b>marking</b> is the number of tokens in each place at a given time.")}
${DEF("Firing rule","A transition is <b>enabled</b> when <b>every</b> place that has an arrow into it holds at least one token. Firing it <b>removes one token from each input place</b> and <b>adds one token to each output place</b>.")}
<h3 class="sub">5.5.1 A simple net: making tea</h3>
<p>Making tea needs boiling water <b>and</b> a tea bag. The transition <b>brew</b> has two input places, so it needs a token in both. Click the buttons to add tokens. When the transition is enabled, click the bar to fire it.</p>
<div class="vis"><svg id="tea" role="img" aria-label="Petri net for making tea"></svg><div class="row"><button type="button" class="btn" id="tw">Boil water (+1 token)</button><button type="button" class="btn" id="tb">Take a tea bag (+1 token)</button><button type="button" class="btn" id="trs">Reset</button></div><div class="cap narr" id="tecap" aria-live="polite"></div></div>
<h3 class="sub">5.5.2 Stop-and-Wait as a Petri net</h3>
<p>Click the <b>orange</b> bars (the enabled transitions) one at a time. After each click, read the explanation and observe the tokens.</p>
<div class="vis"><div class="row"><label class="pill"><input type="checkbox" id="ptim" checked> Include the timeout transition</label><button type="button" class="btn" id="prs">Reset</button></div><svg id="pn" role="img" aria-label="Petri net of Stop-and-Wait"></svg><div class="cap narr" id="pcap" aria-live="polite"></div></div>
${DOIT(["Fire <b>send</b>, <b>receive</b> and <b>get ACK</b>. This is one successful exchange. <b>Delivered</b> has 1 token.","Fire <b>send</b> and then <b>lose frame</b>. Only <b>timeout</b> is enabled.","Clear the timeout option and repeat. <b>No transition is enabled.</b> This is a dead marking, which is a deadlock in a Petri net.","Fire <b>send</b>, then <b>timeout</b> at once (a timer that expires too early), and then <b>send</b> again. Two frames are in the channel and both are delivered. This is how a duplicate frame occurs, and it is the reason for sequence numbers."])}
${SEC("5.6","FSM and Petri net compared")}
<table class="dt cmpt"><thead><tr><th></th><th>Finite state machine</th><th>Petri net</th></tr></thead><tbody><tr><td><b>Picture</b></td><td>States joined by labelled arrows</td><td>Places, tokens and transitions</td></tr><tr><td><b>Where is the system?</b></td><td>In exactly one state</td><td>In many places at the same time (the marking)</td></tr><tr><td><b>Concurrency</b></td><td>Difficult: each combination of conditions needs a separate state</td><td>Direct: each independent part has its own places</td></tr><tr><td><b>Deadlock means</b></td><td>A reachable state with no outgoing transition</td><td>A reachable marking where no transition is enabled</td></tr><tr><td><b>Good for</b></td><td>Small protocols and a single machine</td><td>Systems with parallel parts, shared resources and synchronisation</td></tr></tbody></table>
${SUM(["Verification checks <b>all</b> behaviours of a model. Testing cannot do this.","An FSM has states, events and transitions. <b>Reachability analysis</b> finds every reachable state and checks for a state with no exit, which is a <b>deadlock</b>.","Stop-and-Wait without a timer is in deadlock when a frame or an ACK is lost. The timer prevents the deadlock.","A Petri net has places, tokens and transitions. A transition can fire only if <b>all</b> its input places have a token. Firing removes tokens from the input places and adds tokens to the output places."])}
${quiz("c5q1","In the FSM, the 'Lost' state has no outgoing transition when the timer is removed. What is this called?",["A livelock","A deadlock","A race condition","A buffer overflow"],1,"A state from which no event can occur is a deadlock. The sender waits for ever for an ACK that does not come. The timer removes this deadlock.")}
${quiz("c5q2","In a Petri net, a transition has two input places. Place 1 has 3 tokens and place 2 has 0. Can it fire?",["Yes, it takes tokens from place 1","No, every input place needs a token","Yes, but only twice","Only if it has an output place"],1,"The firing rule needs a token in <b>every</b> input place. Place 2 has no token, so the transition cannot fire.")}
${EXAM(["Draw the FSM of a traffic light with states Red, Green, Yellow and a single event 'timer'. Write its transition table.","Explain what reachability analysis does and why it is better than testing.","In the Petri net, why can a premature timeout cause duplicate frames?","Give one example where a Petri net is a better model than an FSM."])}`,

    S(`<b>A builds an ARP request.</b> The request contains the IP address and MAC address of A (192.168.1.10, AA:AA:AA:AA:AA:AA) and the target IP address 192.168.1.20. The target MAC field is all zeros because this is the value that A needs. The frame is sent to the <b>broadcast address</b> FF:FF:FF:FF:FF:FF, which all hosts on the LAN accept.`,[],{hl:{A:'on'},pk:[['Ethernet destination',BCAST,''],['Ethernet source',H.A.mac,''],['Opcode','1 (request)',''],['Sender MAC',H.A.mac,''],['Sender IP',H.A.ip,''],['Target MAC',ZERO+' (unknown)',''],['Target IP',H.B.ip,'']]});

    cache={A:{[H.B.ip]:'0B:0B:0B:0B:0B:01 (old card)'},B:{},C:{[H.B.ip]:'0B:0B:0B:0B:0B:01 (old card)'},D:{}};
    S(`<b>Situation.</b> The network card of Host B was replaced, so its MAC address <b>changed</b> to BB:BB:BB:BB:BB:BB. A and C still have the <b>old</b> MAC address in their ARP caches (shown below). Frames that they send to B would be sent to a card that no longer exists.`,[],{hl:{B:'on'}});
    S(`<b>B sends a gratuitous ARP.</b> B sends an ARP packet without a request. This is a <b>gratuitous ARP (GARP)</b>. In a GARP the <b>sender IP address and the target IP address are the same</b>, which is the IP address of B. The frame is sent to the broadcast address.`,[],{hl:{B:'on'},pk:[['Ethernet destination',BCAST,''],['Ethernet source',H.B.mac,''],['Opcode','1 (request)',''],['Sender MAC',H.B.mac,''],['Sender IP',H.B.ip,''],['Target MAC',ZERO,''],['Target IP',H.B.ip+' (same as sender)','']]});
    S(`<b>The GARP is broadcast to all hosts.</b>`,[[['B','sw']],[['sw','A'],['sw','C'],['sw','D']]],{hl:{B:'on',A:'on',C:'on',D:'on'}});
    S(`<b>Caches are updated.</b> A and C already have an entry for 192.168.1.20, so they <b>replace it</b> with the new MAC address. D has no entry, and most systems do not create an entry from a GARP. No host replies, because a GARP is not a request.`,[],{hl:{A:'ok',C:'ok',D:'bad'},cache:(()=>{const c=clone(cache);c.A[H.B.ip]=H.B.mac;c.C[H.B.ip]=H.B.mac;return c})()});
    S(`<b>Other uses of GARP.</b> (1) <b>Duplicate IP address detection:</b> a host that is given an IP address sends an ARP probe for it. If another host <i>replies</i>, two hosts have the same IP address. (2) <b>Failover:</b> when a backup router takes the IP address of a failed router, it sends a GARP so that all hosts and switches learn the new MAC address.`,[],{hl:{B:'ok'}});
  }else{
    ipOf={...ipOf,C:null};
    S(`<b>Situation.</b> Host C is a <b>diskless workstation</b>. It knows its own MAC address (stored in its network card) but has <b>no IP address</b>, because it has no disk to store one. Host D is a <b>RARP server</b> that has a table of MAC addresses and IP addresses. RARP (<i>Reverse</i> ARP) maps a MAC address to an IP address.`,[],{hl:{C:'on',D:'on'}});
    S(`<b>C sends a RARP request.</b> The request contains the MAC address of C (CC:CC:CC:CC:CC:CC) and asks for the IP address. The frame is sent to the broadcast address, because C does not know the address of the server and has no IP address.`,[],{hl:{C:'on'},pk:[['Ethernet destination',BCAST,''],['Ethernet source',H.C.mac,''],['Opcode','3 (RARP request)',''],['Sender MAC',H.C.mac,''],['Sender IP','? (unknown)',''],['Target MAC',H.C.mac+' (its own)',''],['Target IP','? (unknown)','']]});
    S(`<b>The RARP request is broadcast to all hosts.</b>`,[[['C','sw']],[['sw','A'],['sw','B'],['sw','D']]],{hl:{C:'on',A:'on',B:'on',D:'on'}});
    S(`<b>Only the RARP server replies.</b> A and B are ordinary hosts and discard the request. D is the RARP server. It finds CC:CC:CC:CC:CC:CC in its table and gets the IP address 192.168.1.30.`,[],{hl:{A:'bad',B:'bad',D:'ok'}});
    S(`<b>D sends the RARP reply</b> to C (unicast).`,[[['D','sw']],[['sw','C']]],{hl:{D:'ok',C:'on'},pk:[['Ethernet destination',BCAST,H.C.mac],['Ethernet source',H.C.mac,H.D.mac],['Opcode','3 (RARP request)','4 (RARP reply)'],['Sender MAC',H.C.mac,H.D.mac],['Sender IP','? (unknown)',H.D.ip],['Target MAC',H.C.mac+' (its own)',H.C.mac],['Target IP','? (unknown)',H.C.ip+' (the answer)']]});
    S(`<b>C gets its IP address.</b> C sets its IP address to 192.168.1.30 and can communicate normally.`,[],{hl:{C:'ok'},ipOf:{C:H.C.ip}});
    S(`<b>Why RARP is no longer used.</b> RARP gives only an IP address (no subnet mask, default router or DNS server). Routers do not forward broadcasts, so each network needs its own RARP server. <b>BOOTP</b> and then <b>DHCP</b> replaced RARP. They provide all these parameters and work across networks.`,[],{hl:{C:'ok'}});
  }
  return steps}
lesson({nav:"6. ARP, RARP, GARP",title:"ARP, RARP and GARP",syl:"ARP / RARP / GARP",
html:()=>`
${GUIDE({"syl": "ARP / RARP / GARP", "why": "A frame is delivered on a link by using a MAC address (layer 2), but the network layer and the applications use IP addresses (layer 3). ARP finds the MAC address that belongs to an IP address on the same LAN. RARP finds the IP address for a MAC address. GARP is an ARP message that a host sends without a request to announce or update its address mapping.", "map": [["6.1", "MAC address and IP address", "Why does a host need both addresses?", "Read the comparison table and the Ethernet frame header."], ["6.2", "ARP, GARP and RARP operation", "What messages are sent and what does each host store?", "Step through each protocol on a LAN of four hosts and watch the ARP caches and the packet fields."], ["6.3", "Comparison of ARP, GARP and RARP", "What is the difference between the three?", "Read the table and the note on ARP spoofing."]], "osi": "Between layer 3 (network) and layer 2 (data link). ARP takes a layer 3 address (IP) and gives a layer 2 address (MAC). ARP messages are carried directly in Ethernet frames. Many textbooks, including Forouzan, treat ARP as a network layer protocol.", "pre": "Lesson 1: the frame header holds the destination MAC address, and the packet header holds the IP address.", "time": "about 1 hour", "next": "Unit III, the MAC sublayer."})}
${LEARN(["explain why a host needs both an IP address and a MAC address","describe how ARP finds a MAC address and why the request is broadcast and the reply is unicast","explain the purpose of a gratuitous ARP","explain the function of RARP and why DHCP replaced it"])}
${SEC("6.1","MAC address and IP address")}
<p>A host on a network has two addresses: a <b>MAC address</b> (physical address) and an <b>IP address</b> (logical address). The table compares them.</p>
<table class="dt cmpt"><thead><tr><th></th><th>MAC address</th><th>IP address</th></tr></thead><tbody>
<tr><td><b>Layer</b></td><td>Data link</td><td>Network</td></tr>
<tr><td><b>What it names</b></td><td>One network interface card</td><td>One connection of a host to a network</td></tr>
<tr><td><b>Looks like</b></td><td>3C:52:82:1A:9F:07 (6 bytes)</td><td>192.168.1.20 (4 bytes, in IPv4)</td></tr>
<tr><td><b>Given by</b></td><td>The manufacturer (fixed in the hardware)</td><td>The network administrator or DHCP</td></tr>
<tr><td><b>Changes?</b></td><td>No (it belongs to the hardware)</td><td>Yes, when the host joins another network</td></tr>
<tr><td><b>Scope</b></td><td>Used on <b>one link</b> only</td><td>Used for the whole path, anywhere in the Internet</td></tr></tbody></table>
<p>The layers above the data link layer use IP addresses. The frame header, however, needs the destination MAC address, so that the correct interface accepts the frame. Before a frame is sent, the sender must <b>map the IP address to a MAC address</b>. The figure shows an Ethernet frame and the position of the MAC addresses:</p>
<div class="vis">${cells([{c:'Destination MAC (6 bytes)',cl:'flag'},{c:'Source MAC (6 bytes)',cl:'flag'},{c:'Type (2 bytes): IP, ARP...',cl:'cnt'},{c:'Data: the IP packet (46 to 1500 bytes)',cl:'run'},{c:'FCS (4 bytes)',cl:''}])}</div>
${SEC("6.2","ARP, GARP and RARP operation")}
<p>The <b>Address Resolution Protocol (ARP)</b> maps an IP address to a MAC address on a local network. The sender broadcasts an ARP request to all hosts on the LAN, and the host that has the IP address sends a reply. Step through the operation below. The four boxes under the diagram are the ARP caches of the four hosts. The table shows the fields of the ARP packet that is sent.</p>
<div class="vis"><div class="row">${seg("am",[["arp","ARP: A looks for B's MAC"],["garp","GARP: B announces a new MAC"],["rarp","RARP: C asks for its IP"]])}</div>
<svg id="lan" viewBox="0 0 700 330" role="img" aria-label="Four hosts on a switch exchanging ARP frames"></svg><div class="grid2" id="caches"></div><div id="apk"></div></div>
<div id="lans"></div>
${DOIT(["Select <b>ARP</b> and press Next step. At step 7 see which hosts answer (green) and which ignore the request (red).","Compare the <b>Ethernet destination</b> in the request (broadcast) with that in the reply (the MAC address of A). Why are they different?","Select <b>GARP</b>. Find its two features: the sender IP and the target IP are the same, and there is no reply.","Select <b>RARP</b>. The question is the reverse of the ARP question."])}
${DEF("Broadcast","is the delivery of a frame to <b>all hosts</b> on the local network. The destination is the MAC address FF:FF:FF:FF:FF:FF. <b>Unicast</b> is the delivery of a frame to one host. Routers do <b>not</b> forward broadcasts, so an ARP request reaches only the local network. ARP therefore works only for hosts on the <i>same</i> LAN.")}
${WARN("ARP has no authentication. Any host can send a false ARP reply that maps an IP address to its own MAC address, and other hosts accept it. This attack is called <b>ARP spoofing</b> (or ARP poisoning). It allows an attacker to receive the traffic of other hosts. Defences include static ARP entries and dynamic ARP inspection on switches.")}
${SEC("6.3","Comparison of ARP, GARP and RARP")}
<table class="dt cmpt"><thead><tr><th></th><th>ARP</th><th>GARP (gratuitous ARP)</th><th>RARP</th></tr></thead><tbody>
<tr><td><b>Question it answers</b></td><td>What is the MAC address for this IP address?</td><td>No question. The host announces its IP address and its MAC address.</td><td>What is the IP address for my MAC address?</td></tr>
<tr><td><b>Who sends</b></td><td>A host that needs a MAC</td><td>A host whose address mapping has changed, or that has just started</td><td>A host with no IP address, usually a diskless workstation</td></tr>
<tr><td><b>Request goes to</b></td><td>Broadcast</td><td>Broadcast</td><td>Broadcast</td></tr>
<tr><td><b>Answer</b></td><td>Unicast reply from the owner of the IP</td><td>None expected</td><td>Unicast reply from a RARP server</td></tr>
<tr><td><b>Used today?</b></td><td>Yes, in IPv4 networks</td><td>Yes: failover, duplicate IP address check, cache update</td><td>No. BOOTP and DHCP replaced it</td></tr></tbody></table>
<p>IPv6 does not use ARP. It uses <b>Neighbor Discovery</b>, which does the same work with multicast messages.</p>
${SUM(["A host has an <b>IP address</b> (logical address, layer 3) and a <b>MAC address</b> (physical address, layer 2). The frame header needs the MAC address.","<b>ARP</b> finds the MAC address for an IP address on the local LAN. It uses a <b>broadcast request</b> and a <b>unicast reply</b>. The result is stored in the <b>ARP cache</b>.","<b>GARP</b> is an ARP message sent without a request (sender IP = target IP). It updates the ARP caches of other hosts and detects duplicate IP addresses.","<b>RARP</b> maps a MAC address to an IP address. BOOTP and DHCP replaced it."])}
${quiz("c6q1","Why is an ARP request broadcast but the ARP reply is not?",["Replies are shorter","The asker does not know the target's MAC yet, but the target learns the asker's MAC from the request","Switches drop unicast frames","ARP replies use IP, not MAC"],1,"The request must reach all hosts because the MAC address of the target is not known. The request has the IP address and the MAC address of the sender, so the target can reply directly (unicast).")}
${quiz("c6q2","What marks a packet as a gratuitous ARP?",["Its opcode is 3","The sender IP and the target IP are the same","It is sent to a unicast address","It has no sender MAC"],1,"A GARP announces the address of the sender, so the sender IP and the target IP are the same.")}
${quiz("c6q3","Host X wants to reach 10.0.5.7, which is on a different network. Whose MAC address does X look up with ARP?",["10.0.5.7's","X's own","The default gateway's (the local router)","The DNS server's"],2,"ARP works only on the local network. For a destination in another network, the frame is sent to the router (default gateway), so X uses ARP to find the MAC address of the router. The destination IP address in the packet is still 10.0.5.7.")}
${EXAM(["Why can ARP not be used to find the MAC address of a host in another network?","What does an ARP cache store, and why do entries expire?","State two differences between an ARP request and an ARP reply (frame destination address and opcode).","Why was RARP replaced by DHCP?"])}`,
mount(r){
  const svg=$("#lan",r);arrowDefs(svg);const H=HOSTS,SW=[350,165];
  Object.keys(H).forEach(k=>E('line',{x1:H[k].x,y1:H[k].y,x2:SW[0],y2:SW[1],class:'ed',style:'marker-end:none;stroke-width:3'},svg));
  E('rect',{x:SW[0]-55,y:SW[1]-22,width:110,height:44,rx:8,class:'nd'},svg);E('text',{x:SW[0],y:SW[1],class:'nt'},svg).textContent='Switch';
  const rect={},ipt={};
  Object.keys(H).forEach(k=>{const h=H[k];rect[k]=E('rect',{x:h.x-52,y:h.y-26,width:104,height:52,rx:8,class:'nd'},svg);E('text',{x:h.x,y:h.y-8,class:'nt'},svg).textContent='Host '+k;ipt[k]=E('text',{x:h.x,y:h.y+12,class:'sm',style:'fill:var(--fg)'},svg)});
  const pos=n=>n==='sw'?SW:[H[n].x,H[n].y];
  const fly=(a,b)=>{const A=pos(a),B=pos(b);const g=E('g',{},svg);E('rect',{x:-26,y:-12,width:52,height:24,rx:6,class:'fr'},g);E('text',{x:0,y:0,class:'nt'},g).textContent='frame';return slide(g,A[0],A[1],B[0],B[1],800).then(()=>g.remove())};
  let mode='arp',steps=lanStories('arp'),token=0;
  const draw=async(i,anim)=>{const s=steps[i];const my=++token;
    Object.keys(H).forEach(k=>{rect[k].setAttribute('class','nd'+(s.hl[k]?' '+s.hl[k]:''));ipt[k].textContent=s.ipOf[k]||'IP: ?'});
    $("#caches",r).innerHTML=Object.keys(H).map(k=>`<div class="card" style="margin:6px 0;padding:10px"><b>Host ${k}</b> <span class="small muted">ARP cache</span><div class="small muted">IP ${s.ipOf[k]||'not set'}</div><table class="dt"><tbody>${Object.keys(s.cache[k]).map(i=>`<tr><td class="small">${i}</td><td class="small" style="white-space:normal;word-break:break-all">${s.cache[k][i]}</td></tr>`).join("")||'<tr><td class="small muted">(empty)</td></tr>'}</tbody></table></div>`).join("");
    const two=s.pk.length&&s.pk[0].length>2&&s.pk.some(p=>p[2]);
    $("#apk",r).innerHTML=s.pk.length?`<div style="overflow:auto"><table class="dt cmpt" style="margin-top:6px;font-size:12.5px"><thead><tr><th>Field</th><th>${mode==='rarp'?'RARP request':mode==='garp'?'Gratuitous ARP':'ARP request'}</th>${two?`<th>${mode==='rarp'?'RARP reply':'ARP reply'}</th>`:''}</tr></thead><tbody>${s.pk.map(p=>`<tr><td><b>${p[0]}</b></td><td style="word-break:break-all">${p[1]}</td>${two?`<td style="word-break:break-all">${p[2]}</td>`:''}</tr>`).join("")}</tbody></table></div>`:'';
    if(anim&&s.fly.length){for(const grp of s.fly){if(my!==token||!svg.isConnected)return;await Promise.all(grp.map(([a,b])=>fly(a,b)))}}};
  const st=story(r,"#lans",{draw});st.set(steps.map(s=>({cap:s.cap})));
  bindSeg(r,"am",v=>{mode=v;steps=lanStories(v);st.set(steps.map(s=>({cap:s.cap})))});
}});

function renderLive(){$("#livebox").innerHTML=`<p class="small muted" style="margin:0 0 8px">Quick reference, Unit II.</p><h4 style="margin:12px 0 6px">OSI layers</h4><div class="code">7 Application   data\n6 Presentation  data\n5 Session       data\n4 Transport     segment\n3 Network       packet\n2 Data link    frame  <--\n1 Physical      bits</div><h4 style="margin:12px 0 6px">Frame</h4><div class="code">Frame = header + packet + trailer\nHeader: dst MAC, src MAC\nTrailer: FCS (check bits)</div><h4 style="margin:12px 0 6px">Framing</h4><div class="code">FLAG bits: 01111110\nBit stuffing: insert 0 after five 1s\nByte stuffing: ESC before FLAG/ESC</div><h4 style="margin:12px 0 6px">Flow control</h4><div class="code">a = Tp / Tt\nStop-and-Wait U = 1/(1+2a)\nWindow W: U = min(1, W/(1+2a))</div><h4 style="margin:12px 0 6px">Error control</h4><div class="code">Even parity: total 1s is even\nCRC: append r zeros, divide by\ngenerator (r+1 bits) using XOR,\nremainder = r-bit CRC.\nReceiver: remainder 0 = accept.</div><h4 style="margin:12px 0 6px">Window sizes (m-bit numbers)</h4><div class="code">Go-Back-N: 2^m - 1\nSelective Repeat: 2^(m-1)</div>`}
