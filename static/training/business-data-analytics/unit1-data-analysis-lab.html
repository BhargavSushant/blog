lesson({nav:"Understanding data and its types",title:"Understanding data and the types of data",syl:"Understanding Data, Types of Data (Quantitative and Qualitative)",
html:()=>`<p class="lead"><b>Data</b> is recorded facts: numbers, words, dates, answers. <b>Information</b> is what you learn after you organise and read the data. 16 survey rows are data. "Instagram is the favourite app of 6 out of 16" is information.</p>
<div class="grid2"><div class="card"><h2>Quantitative</h2><p>Numbers you can add and average. <b>Discrete</b> = counted (siblings: 0, 1, 2). <b>Continuous</b> = measured (study hours: 2.5).</p></div>
<div class="card"><h2>Qualitative</h2><p>Labels or categories (city, app, hair colour). You count how many fall in each, but you cannot add them up meaningfully.</p></div></div>
<div class="callout k"><b>Trap to teach:</b> a number is not always quantitative. A phone PIN or an ID of 7 is a label. Ask: <i>does adding or averaging it make sense?</i></div>
<div class="card try"><h3>Try it: classify each variable</h3><div id="tq"></div><p class="small muted" id="tscore"></p></div>
<div class="card"><h3>Look at our table</h3><p class="small">Open the live data on the right. <b>Age, Pocket money, Study hrs</b> are quantitative. <b>Name, Gender, City, Favourite app</b> are qualitative. <b>Satisfaction (1 to 5)</b> looks like a number but behaves like a ranked label. Lesson 2 explains why.</p></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">${g("data","Data")} is recorded facts: numbers, words, dates and answers. ${g("information","Information")} is what you learn after you organise and read the data. Sixteen rows of a survey are data. The statement "Instagram is the favourite app of 6 out of 16" is information.</p><p class="small">Data is of two broad kinds. ${g("quantitative","Quantitative data")} is numerical, and adding or averaging it makes sense. It is ${g("discrete","discrete")} when it is counted (the number of siblings: 0, 1, 2) and ${g("continuous","continuous")} when it is measured (study hours: 2.5). ${g("qualitative","Qualitative data")} is made of labels or categories, such as city or hair colour. You can count how many fall in each category, but adding the categories has no meaning.</p><p class="small">A number is not always quantitative. A phone number, a roll number or a PIN is a label. The test is simple: does adding or averaging it make sense? If not, treat it as qualitative.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Each variable in the demo has to be classified. Age, pocket money and study hours are quantitative. City, favourite app and hair colour are qualitative. The satisfaction rating looks like a number, but a rating of 4 is a ranked label: it says "better than 3", not "twice as good as 2". The next lesson explains why. The table on the right holds the real survey, so you can check each column against it.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Classify each column before you calculate anything.</li><li>Ask whether adding or averaging the values makes sense.</li><li>Treat IDs, phone numbers and PINs as labels.</li><li>Decide whether a number is counted (discrete) or measured (continuous).</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales_Raw</b> of bmt-sales-dataset.xlsx (1015 rows in 2 to 1016; Region is column C, OrderDate B, Units F, Rating J).</p><ol class="small"><li>Look at the alignment. Numbers sit on the right of the cell and text on the left. Dates are numbers shown in date format.</li><li>Test a column with a formula: <code>=ISNUMBER(F2)</code> and <code>=ISTEXT(C2)</code>. Fill down and count the results.</li><li>Home &gt; the Number Format box shows how Excel treats a cell (General, Number, Date, Text).</li><li>Classify each column: Region, Product and PaymentMode are qualitative; Units, MRP and DiscountPct are quantitative.</li></ol></div>

${task(["Open the live table and write the type (quantitative or qualitative) of each of its columns.","Give two examples of numbers that are really labels.","Write one discrete and one continuous variable from your own day."])}
${quizSet(1)}`,
mount(r){regQuiz("q1",1,"Bill amount is a measured number you can add and average.");
  const box=$("#tq",r);let score=0,ans=0;
  box.innerHTML=TYPEQ.map((q,i)=>`<div class="row" data-i="${i}" style="justify-content:space-between;border-bottom:1px solid var(--line2);padding-bottom:6px"><span>${q[0]}</span><span><button class="btn sm" data-a="Quantitative">Quantitative</button> <button class="btn sm" data-a="Qualitative">Qualitative</button> <span class="fb small"></span></span></div>`).join("");
  $$("[data-a]",box).forEach(b=>b.onclick=()=>{const row=b.closest("[data-i]");if(row.dataset.d)return;row.dataset.d=1;ans++;
    const ok=b.dataset.a===TYPEQ[+row.dataset.i][1];if(ok)score++;
    $(".fb",row).innerHTML=ok?'<span class="tag g">Correct</span>':`<span class="tag b">It is ${TYPEQ[+row.dataset.i][1]}</span>`;
    $("#tscore",r).textContent=`Score: ${score} of ${ans}`;});}
});
/* ---------- 2. Scales ---------- */
const SCALES=[["Gender","Nominal"],["City","Nominal"],["Satisfaction rating (Poor to Excellent)","Ordinal"],["Class rank","Ordinal"],["Temperature in Celsius","Interval"],["Calendar year","Interval"],["Pocket money (Rs)","Ratio"],["Study hours","Ratio"]];
const OPS=[["Count / mode","Nominal,Ordinal,Interval,Ratio"],["Rank order / median","Ordinal,Interval,Ratio"],["Add and subtract / mean","Interval,Ratio"],["Say 'twice as much'","Ratio"]];
lesson({nav:"Measurement scales",title:"Data measurement scales",syl:"Data Measurement Scales (nominal, ordinal, interval, ratio)",
html:()=>`<p class="lead">The scale tells you <b>which calculations are legal</b>. Using the wrong one gives a number that looks fine but means nothing.</p>
<div class="grid2">
<div class="card"><span class="tag p">Nominal</span> names only. Gender, city, app. <br><span class="tag p">Ordinal</span> names with an order, but gaps are unknown. Poor, Fair, Good.</div>
<div class="card"><span class="tag s">Interval</span> equal gaps, no true zero. Celsius, year. 40 degrees is not "twice as hot" as 20.<br><span class="tag s">Ratio</span> equal gaps and a true zero. Rs, hours, age. 6000 is twice 3000.</div></div>
<div class="card try"><h3>Try it: which scale?</h3><div id="sq"></div><p class="small muted" id="sscore"></p></div>
<div class="card try"><h3>Try it: what can you calculate?</h3>
<div class="row">Pick a column: <select id="scol"><option value="city">City (nominal)</option><option value="sat">Satisfaction 1-5 (ordinal)</option><option value="pocket">Pocket money (ratio)</option></select></div>
<table class="dt"><thead><tr><th>Operation</th><th>Allowed?</th><th>Result on our data</th></tr></thead><tbody id="sops"></tbody></table>
<div class="callout k small" id="snote"></div></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">The ${g("scale","measurement scale")} of a variable tells you which calculations are meaningful. There are four scales. On a ${g("nominal","nominal")} scale the values are names only (gender, city). On an ${g("ordinal","ordinal")} scale the values have an order but the gaps between them are not known (Poor, Fair, Good). On an ${g("interval","interval")} scale the gaps are equal but there is no true zero (temperature in Celsius, calendar year). On a ${g("ratio","ratio")} scale the gaps are equal and there is a true zero (rupees, hours, age).</p><p class="small">The scale decides the allowed operations. Counts and the mode are allowed on every scale. The median needs an order, so it needs at least an ordinal scale. The mean and the differences need equal gaps, so they need an interval or a ratio scale. A statement such as "twice as much" needs a true zero, so it needs a ratio scale.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The second demo lists the operations for the column you pick. City is nominal, so only the count and the mode are allowed. Satisfaction is ordinal, so the median is allowed but the mean is blocked. Pocket money is ratio, so every operation is allowed and "twice as much" is meaningful: Rs 6,000 is twice Rs 3,000. Forty degrees Celsius is not twice as hot as 20 degrees, because zero degrees is not the absence of heat.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Identify the scale before you choose a statistic.</li><li>For ordinal data use the median and counts, not the mean.</li><li>Use the word "times" or "twice" only for ratio data.</li><li>When in doubt, choose the weaker scale.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales_Raw</b> of bmt-sales-dataset.xlsx (1015 rows in 2 to 1016; Region is column C, OrderDate B, Units F, Rating J).</p><ol class="small"><li>Write the scale of each column in row 1 notes or on a new sheet: Region (nominal), Rating (ordinal), OrderDate (interval), Units and MRP (ratio).</li><li>For ordinal data prefer the median: <code>=MEDIAN(J2:J1016)</code>. Compare it with <code>=AVERAGE(J2:J1016)</code>.</li><li>A ratio makes sense only on a ratio scale: <code>=G3/G2</code> is meaningful for prices, but a ratio of two dates is not.</li></ol></div>

${task(["Write the scale of each column of the survey table.","For satisfaction ratings, write the median and say why the mean is risky.","Explain in two sentences why a year is interval and not ratio."])}
${quizSet(2)}`,
mount(r){regQuiz("q2",1,"Ordinal data has order but unequal, unknown gaps. Prefer median and counts. (Many surveys still average it; just say so.)");
  let sc=0,an=0;$("#sq",r).innerHTML=SCALES.map((q,i)=>`<div class="row" data-i="${i}" style="justify-content:space-between;border-bottom:1px solid var(--line2);padding-bottom:6px"><span>${q[0]}</span><span>${["Nominal","Ordinal","Interval","Ratio"].map(s=>`<button class="btn sm" data-a="${s}">${s}</button>`).join(" ")} <span class="fb small"></span></span></div>`).join("");
  $$("[data-a]",$("#sq",r)).forEach(b=>b.onclick=()=>{const row=b.closest("[data-i]");if(row.dataset.d)return;row.dataset.d=1;an++;const t=SCALES[+row.dataset.i][1],ok=b.dataset.a===t;if(ok)sc++;
    $(".fb",row).innerHTML=ok?'<span class="tag g">Correct</span>':`<span class="tag b">It is ${t}</span>`;$("#sscore",r).textContent=`Score: ${sc} of ${an}`;});
  const lvl={city:"Nominal",sat:"Ordinal",pocket:"Ratio"};
  function draw(){const c=$("#scol",r).value,v=DATA.map(d=>d[c]),L0=lvl[c],num=typeof v[0]==="number";
    const res=[
      v=>{const m=mode(v);return `Mode = ${m}`},
      v=>num?`Median = ${fmt(median(v))}`:"Cannot rank cities",
      v=>num?`Mean = ${fmt(mean(v))}`:"Average of city names? Meaningless",
      v=>c==="pocket"?`Max / min = ${fmt(Math.max(...v)/Math.min(...v))} times`:"Not meaningful"];
    $("#sops",r).innerHTML=OPS.map((o,i)=>{const ok=o[1].split(",").includes(L0);return `<tr><td>${o[0]}</td><td>${ok?'<span class="tag g">Yes</span>':'<span class="tag b">No</span>'}</td><td>${ok?res[i](v):'<span class="muted">Blocked for '+L0+' data</span>'}</td></tr>`}).join("");
    $("#snote",r).textContent=c==="sat"?"Mean is allowed only if you treat the gaps as equal. It is the grey zone: report the median and the counts too.":`Scale of this column: ${L0}.`;}
  $("#scol",r).onchange=draw;draw();}
});
/* ---------- dirty data (used in lessons 3 and 9) ---------- */
const DC=[["id","ID"],["name","Name"],["age","Age"],["city","City"],["joined","Joined"],["rating","Rating"]];
const DIRTY0=()=>[
 [1,"Aarav ",18,"bhopal","12-04-2025",4],[2,"diya",19,"Indore","2025-04-13",5],[3,"Kabir","","Sehore","14/04/2025",3],
 [4,"Meera",190,"BHOPAL","15-04-2025",4],[5,"Diya",19,"Indore","2025-04-13",5],[6,"Rohan","nineteen","Indore ","16-04-2025","N/A"],
 [7,"Sana",18,"Raisen","17-04-2025",5],[8,"Isha",19,"Vidisha","18-04-2025",9],[9,"Arjun",20,"Indore","19-04-2025",3],[10,"",21,"Bhopal","20-04-2025",4]
].map(r=>Object.fromEntries(DC.map((c,i)=>[c[0],r[i]])));
const proper=s=>String(s).trim().replace(/\s+/g," ").toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
const isISO=s=>/^\d{4}-\d{2}-\d{2}$/.test(s);
function cellIssue(r,c,all){
  const v=r[c];
  if(v===""||v==null) return "blank";
  if(c==="name"||c==="city"){ if(String(v)!==proper(v)) return "text"; }
  if(c==="age"){ if(typeof v!=="number") return "type"; if(v<15||v>100) return "range"; }
  if(c==="rating"){ if(typeof v!=="number") return "type"; if(v<1||v>5) return "range"; }
  if(c==="joined"&&!isISO(v)) return "date";
  return null;
}
function dupIdx(rows){const seen={},d=new Set();rows.forEach((r,i)=>{const k=[proper(r.name),r.age,proper(r.city),r.joined].join("|");if(seen[k]!=null)d.add(i);else seen[k]=i});return d}
const ISS={blank:["Missing value","ix"],text:["Spacing or letter case","iy"],type:["Wrong type (text in a number column)","ix"],range:["Impossible value","ix"],date:["Date not in yyyy-mm-dd","iz"],dup:["Duplicate row","iz"]};

/* ---------- 3. Quality ---------- */
lesson({nav:"Why data quality matters",title:"Importance of data quality, and how to ensure it",syl:"Importance of Data Quality, Ensuring Data Quality",
html:()=>`<p class="lead"><b>Garbage in, garbage out.</b> A report is only as good as its data. Bad data costs money: wrong stock orders, wrong bills, wrong decisions.</p>
<div class="card"><h2>Six checks (the quality checklist)</h2>
<span class="pill"><b>Complete</b>: nothing missing</span><span class="pill"><b>Accurate</b>: values are true</span><span class="pill"><b>Consistent</b>: same format everywhere</span><span class="pill"><b>Valid</b>: within allowed range</span><span class="pill"><b>Unique</b>: no duplicates</span><span class="pill"><b>Timely</b>: recent enough</span></div>
<div class="card try"><h3>Try it: run a quality audit on a dirty file</h3>
<p class="small muted">This is a small copy of the Sunrise sales problem. Press the button. Each coloured cell breaks one rule. Click a coloured cell to see why.</p>
<div class="row"><button class="btn pri" id="audit" type="button">Run audit</button><span id="asum" class="small"></span></div>
<div id="atab"></div><div class="callout k small" id="awhy">Click a coloured cell for the reason.</div>
<div id="aleg" class="small"></div></div>
<div class="card"><h2>Ensuring quality: prevent first, then fix</h2>
<p><b>At entry (best):</b> data validation rules (dropdown lists, number limits, date pickers). In Google Sheets: select the range, Data, Data validation. In Excel: Data, Data Validation.</p>
<p><b>After entry:</b> audits like the one above, then the cleaning steps in lesson 9.</p></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">${g("quality","Data quality")} means how well the data suits the purpose it is used for. A report is only as good as its data: bad data leads to wrong stock orders, wrong bills and wrong decisions. Six checks are used. Data is complete when nothing is missing. It is accurate when the values are true. It is consistent when the same thing is written the same way everywhere. It is valid when each value lies in the allowed range. It is unique when no row is repeated. It is timely when it is recent enough for the decision.</p><p class="small">Quality is cheaper to protect than to repair. ${g("validation","Data validation")} sets rules at the point of entry, such as a drop-down list or a limit on a number, so that wrong values cannot be typed in.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The audit marks each broken cell in a colour. Red cells are blank, of the wrong type or impossible (an age of 190, an age written as "nineteen", a rating of 9). Yellow cells have spacing or case problems (bhopal and BHOPAL). Blue cells have a date in another format or are duplicates. Click a cell to read the reason. The same kinds of errors appear in real files, and the audit gives you a checklist to look for them before any analysis.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Audit a new file against the six checks before you analyse it.</li><li>Prevent errors with validation at entry where you can.</li><li>Keep a copy of the original file.</li><li>Record each problem found and how it was fixed.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Stop bad data at the point of entry.</p><ol class="small"><li>Select the Units column and choose Data &gt; Data Validation. Allow Whole number, between 1 and 100.</li><li>Select PaymentMode and choose Data &gt; Data Validation. Allow List, source <code>UPI,Card,Cash,Net Banking</code>.</li><li>On the Error Alert tab write a clear message, such as "Choose a payment mode from the list".</li><li>For existing data choose Data &gt; Data Validation &gt; Circle Invalid Data. Excel circles every value that breaks the rule.</li></ol></div>

${task(["Run the audit and write the number of red, yellow and blue cells.","Write one validation rule for each of age, city and rating.","Find which of the six checks fails for 'nineteen' and which fails for 190."])}
${quizSet(3)}`,
mount(r){regQuiz("q3",1,"Preventing errors at entry costs far less than finding them later.");
  const rows=DIRTY0();let on=false;
  function draw(){const dups=dupIdx(rows),cnt={};
    const cc=(row,c,i)=>{if(!on)return"";let k=cellIssue(row,c);if(!k&&dups.has(i)&&c==="id")k="dup";if(k){cnt[k]=(cnt[k]||0)+1;return " "+ISS[k][1]}return""};
    $("#atab",r).innerHTML=table(rows,DC,{cellClass:cc,small:true});
    if(on){$("#asum",r).innerHTML=Object.entries(cnt).map(([k,v])=>`<span class="tag ${k==='dup'?'p':'w'}">${v} x ${ISS[k][0]}</span>`).join(" ");}
    $$("#atab td",r).forEach(td=>td.onclick=()=>{if(!on)return;const tr=td.parentElement,ri=[...tr.parentElement.children].indexOf(tr),ci=[...tr.children].indexOf(td),c=DC[ci][0];
      let k=cellIssue(rows[ri],c);if(!k&&dups.has(ri)&&c==="id")k="dup";
      $("#awhy",r).textContent=k?`Row ${rows[ri].id}, ${DC[ci][1]}: ${ISS[k][0]}.`+(k==="dup"?" Same person, age, city and date as an earlier row.":""):"This cell is fine.";});}
  $("#audit",r).onclick=()=>{on=true;draw()};draw();
  $("#aleg",r).innerHTML=`<span class="tag b">red</span> blank, wrong type, impossible value &nbsp; <span class="tag w">yellow</span> spacing or case &nbsp; <span class="tag p">blue</span> date format or duplicate`;}
});

/* ---------- 4. Primary data ---------- */
lesson({nav:"Primary data",title:"Primary data: collect it yourself",syl:"Primary Data",
html:()=>`<p class="lead"><b>Primary data</b> is data you collect <b>first-hand</b>, for <b>your own question</b>. You decide the questions, the people and the method. The class survey on the right is primary data.</p>
<div class="grid2"><div class="card"><span class="tag g">Pros</span><p class="small">Fits your exact question. You know how it was collected. Fresh. You own it.</p></div>
<div class="card"><span class="tag b">Cons</span><p class="small">Takes time and money. Needs consent. Small samples. You must clean it yourself.</p></div></div>
<div class="card"><h3>Common primary methods</h3><span class="pill">Survey / questionnaire</span><span class="pill">Interview</span><span class="pill">Observation</span><span class="pill">Experiment</span><span class="pill">Focus group</span><p class="small muted">Lesson 6 helps you choose between them.</p></div>
<div class="card try"><h3>Try it: collect a response</h3>
<p class="small muted">Fill the form and submit. The new row appears in the live table on the right and is used by every other lesson.</p>
<div class="row"><input type="text" id="fn" placeholder="Name" size="9"><input type="number" id="fa" placeholder="Age" min="15" max="60" style="width:76px">
<select id="fg"><option>M</option><option>F</option></select><select id="fc">${CITIES.map(c=>`<option>${c}</option>`).join("")}</select>
<input type="number" id="fp" placeholder="Pocket Rs" style="width:100px"><input type="number" id="fs" placeholder="Study hrs" step="0.5" style="width:90px">
<select id="fap">${APPS.map(c=>`<option>${c}</option>`).join("")}</select><select id="fsat"><option>5</option><option>4</option><option selected>3</option><option>2</option><option>1</option></select></div>
<div class="row"><button class="btn pri" id="add" type="button">Submit response</button><button class="btn" id="add5" type="button">Collect 5 random responses</button><button class="btn" id="reset" type="button">Reset to 16</button><span id="fmsg" class="small"></span></div></div>
<div class="callout i small">Notice the form already enforces quality: Age is limited to 15 to 60, City is a dropdown. That is lesson 3 in action.</div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">${g("primary","Primary data")} is data that you collect first-hand for your own question. You decide the questions, the people and the method. The class survey in the panel on the right is primary data. Its strengths are that it fits your exact question, that you know how it was collected, and that it is fresh. Its weaknesses are that it takes time and money, that it needs the consent of the people, that samples are often small and that you must clean it yourself.</p><p class="small">Common methods are the ${g("survey","survey")} (many people answer the same questions), the ${g("interview","interview")} (a one-to-one conversation), ${g("observation","observation")} (watching behaviour) and the ${g("experiment","experiment")} (changing one thing and measuring the effect). Lesson 6 shows how to choose between them.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Fill in the form and submit it. A new row is added to the live table on the right, and every other lesson uses it. You will notice that the form accepts only the fields that you asked for. This is a design decision: each field you add costs the respondent time and raises a privacy question. A short, clear form gives better answers than a long one.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Write the question you want to answer before you write the form.</li><li>Ask only what you need.</li><li>Test the form on two or three people before you use it.</li><li>Record who collected the data, when and how.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Collect your own data.</p><ol class="small"><li>Make a sheet with one question per column and one respondent per row. Turn it into a table with Ctrl+T.</li><li>Add Data Validation to each column (list for choices, whole number 1 to 5 for ratings).</li><li>Enter 10 responses, then count with <code>=COUNTIF(B2:B11,"Tea")</code> or Insert &gt; PivotTable.</li></ol></div>

${task(["Add one row to the survey and write the number of rows after adding it.","Write three questions for a survey on canteen food and say the type of data each gives.","Write one advantage and one disadvantage of primary data for a small shop."])}
${quizSet(4)}`,
mount(r){regQuiz("q4",0,"You observed it yourself for your own question, so it is primary data collected by observation.");
  const msg=t=>$("#fmsg",r).textContent=t;
  $("#add",r).onclick=()=>{const n=$("#fn",r).value.trim(),a=+$("#fa",r).value,p=+$("#fp",r).value,s=+$("#fs",r).value;
    if(!n||!(a>=15&&a<=60)||!(p>0)||!(s>=0&&$("#fs",r).value!==""))return msg("Please fill name, age (15-60), pocket money and study hours.");
    DATA.push({id:DATA.length+1,name:n,age:a,gender:$("#fg",r).value,city:$("#fc",r).value,pocket:p,study:s,app:$("#fap",r).value,sat:+$("#fsat",r).value});
    newFrom=DATA.length-1;renderLive();msg("Added. Now "+DATA.length+" rows.");["fn","fa","fp","fs"].forEach(i=>$("#"+i,r).value="");};
  $("#add5",r).onclick=()=>{const N=["Zoya","Nikhil","Pari","Om","Kriti","Harsh","Jiya","Reyansh"],st=DATA.length;
    for(let i=0;i<5;i++){const rd=(a)=>a[Math.floor(Math.random()*a.length)];DATA.push({id:DATA.length+1,name:rd(N),age:18+Math.floor(Math.random()*5),gender:rd(["M","F"]),city:rd(CITIES),pocket:2500+100*Math.floor(Math.random()*45),study:+(1+Math.random()*4).toFixed(1),app:rd(APPS),sat:1+Math.floor(Math.random()*5)})}
    newFrom=st;renderLive();msg("5 responses added. Now "+DATA.length+" rows.");};
  $("#reset",r).onclick=()=>{DATA=DATA.slice(0,16);newFrom=null;renderLive();msg("Back to 16 rows.");};}
});

/* ---------- 5. Secondary data (hero) ---------- */
const bin=a=>a<=19?"18-19":a<=21?"20-21":"22+";
function makeSecondary(o){
  if(o.mode==="copy"){
    const cols=[...(o.keepName?[["name","Name"]]:[]),[o.binAge?"ageBin":"age",o.binAge?"Age band":"Age"],["gender","Gender"],["city","City"],["pocket","Pocket money"],["study","Study hrs"],["app","App"],["sat","Satisfaction"]];
    const rows=DATA.map(d=>({name:d.name,age:d.age,ageBin:bin(d.age),gender:d.gender,city:d.city,pocket:o.round?Math.round(d.pocket/500)*500:d.pocket,study:d.study,app:d.app,sat:d.sat}));
    return {cols,rows,kind:"Anonymised copy"};
  }
  if(o.mode==="summary"){
    const key=o.group,gs={};DATA.forEach(d=>{const k=key==="age"?bin(d.age):d[key];(gs[k]=gs[k]||[]).push(d)});
    const rows=Object.keys(gs).sort().map(k=>{const g=gs[k];return {group:k,n:g.length,age:+mean(g.map(x=>x.age)).toFixed(1),pocket:Math.round(mean(g.map(x=>x.pocket))),study:+mean(g.map(x=>x.study)).toFixed(2),sat:+mean(g.map(x=>x.sat)).toFixed(2)}});
    return {cols:[["group","Group: "+({city:"City",gender:"Gender",age:"Age band"}[key])],["n","Students"],["age","Avg age"],["pocket","Avg pocket (Rs)"],["study","Avg study hrs"],["sat","Avg satisfaction"]],rows,kind:"Summary table by "+key};
  }
  return {cols:[["stat","Published statistic"],["value","Value"]],rows:[{stat:"Students surveyed",value:DATA.length},{stat:"Average pocket money (Rs)",value:Math.round(mean(DATA.map(d=>d.pocket)))},{stat:"Average satisfaction",value:+mean(DATA.map(d=>d.sat)).toFixed(2)}],kind:"Headline figures"};
}
const QSX=[["Average pocket money in Indore?",(o)=>o.mode==="copy"?"yes":o.mode==="summary"&&o.group==="city"?"yes":"no"],
 ["Average age of boys vs girls?",(o)=>o.mode==="copy"?(o.binAge?"approx":"yes"):o.mode==="summary"&&o.group==="gender"?"yes":"no"],
 ["Who studies the most? (a name)",(o)=>o.mode==="copy"&&o.keepName?"yes":"no"],
 ["Does pocket money rise with study hours?",(o)=>o.mode==="copy"?(o.round?"approx":"yes"):"no"],
 ["Overall average satisfaction?",(o)=>o.mode==="copy"||o.mode==="headline"||o.mode==="summary"?"yes":"no"]];
lesson({hero:true,nav:"Secondary data, and how it comes from primary",title:"Secondary data, and how it relates to primary data",syl:"Secondary Data (and Primary Data)",
html:()=>`<p class="lead"><b>Secondary data</b> is data that <b>someone else collected</b> (or that was collected for another purpose) and you <b>reuse</b>. Census tables, RBI reports, company sales records, a classmate's survey results: all secondary for you.</p>
<div class="callout k"><b>The relationship, in one line:</b> primary and secondary are not two kinds of numbers. They are two <i>positions</i> relative to the data. The same table is <b>primary for the person who collected it</b> and <b>secondary for everyone who uses it later</b>. Most secondary data starts life as someone's primary data, then gets cleaned, anonymised and summarised before it is shared.</div>
<div class="card try"><h3>Perspective switch</h3>
<div class="seg" id="persp" role="group" aria-label="Who are you?"><button type="button" data-p="c" aria-pressed="true">I collected it</button><button type="button" data-p="r" aria-pressed="false">I downloaded it from someone</button></div>
<div class="row"><span id="pbadge"></span><span class="small muted" id="ptxt"></span></div></div>
<div class="card sec"><h3>Try it: turn primary data into secondary data</h3>
<p class="small muted">Left: the primary survey (live from the right panel). Choose how it will be shared, then press the button. You are the survey owner publishing it for other researchers.</p>
<div class="flow"><div><span class="tag p">Primary</span> <span class="small" id="pn"></span><div id="ptab"></div></div><div class="arrow" aria-hidden="true">&#10132;</div><div><span class="tag s">Secondary</span> <span class="small" id="sn">(not generated yet)</span><div id="stab"><div class="callout small">Press the button below.</div></div></div></div>
<h3 style="margin-top:14px">How will you share it?</h3>
<div class="row"><div class="seg s" id="mode" role="group" aria-label="Sharing mode"><button type="button" data-m="copy" aria-pressed="true">Anonymised copy</button><button type="button" data-m="summary" aria-pressed="false">Summary table</button><button type="button" data-m="headline" aria-pressed="false">Headline figures</button></div></div>
<div class="row" id="opts"></div>
<div class="row"><button class="btn sec" id="gen" type="button">Generate secondary data</button><span id="lineage" class="small"></span></div></div>
<div class="card" id="useCard" hidden><h3>Now you are the researcher who only receives this secondary data</h3>
<p class="small muted">Which questions can the researcher answer? Change the sharing options above and press the button again to compare.</p><div id="qs"></div></div>
<div class="card" id="revCard" hidden><h3>Can the researcher get the primary data back?</h3>
<p class="small muted">The summary shows the average pocket money for the largest group. Press the button: the computer builds other student lists that give the <b>same published average</b>.</p>
<div class="row"><button class="btn" id="rev" type="button">Try to rebuild the original</button></div><div id="revout"></div></div>
<div class="card"><h3>Primary vs secondary, side by side</h3>
<table class="dt"><thead><tr><th></th><th>Primary</th><th>Secondary</th></tr></thead><tbody>
<tr><td>Who collected it</td><td>You</td><td>Someone else</td></tr><tr><td>Purpose</td><td>Your exact question</td><td>Their question, you reuse it</td></tr>
<tr><td>Cost and time</td><td>High</td><td>Low</td></tr><tr><td>Control over quality</td><td>Full</td><td>Limited, check the source</td></tr>
<tr><td>Detail</td><td>Row-level, raw</td><td>Often summarised or anonymised</td></tr>
<tr><td>Examples</td><td>Your survey, interviews, lab experiment</td><td>Census of India, RBI, NSSO, company annual reports, published research</td></tr></tbody></table>
<p class="small"><b>Before you trust secondary data, ask:</b> Who collected it? When? Why? How were they sampled? What was removed?</p></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">${g("secondary","Secondary data")} is data that someone else collected, or that was collected for another purpose and that you reuse. Census tables, reports of the Reserve Bank and company sales records are examples. Primary and secondary are not two kinds of numbers. They describe your position relative to the data. The same table is primary for the person who collected it and secondary for everyone who uses it later.</p><p class="small">Secondary data is cheaper and faster, and it often covers more people than you could reach yourself. The price is control. It was collected for another question, it may be summarised or anonymised, and you cannot check how it was collected. Before you trust it, ask who collected it, when, why, how the people were chosen and what was removed.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The demo turns the class survey, which is primary for you, into data that others could use. You choose how to share it: as an anonymised copy, a summary table or headline figures. You can keep the names, replace the age with an age band, or round pocket money. Each choice protects the people more, but removes some detail. The result is a secondary dataset, and the detail that was removed is no longer available to the person who receives it.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Record the source, the date and the meaning of each column of any secondary data.</li><li>Check that the data covers the people and the period you need.</li><li>Prefer a recent source for a question about today.</li><li>Say clearly in your report which data is primary and which is secondary.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Bring in data somebody else collected.</p><ol class="small"><li>Choose Data &gt; Get Data &gt; From File &gt; From Text/CSV, pick the file, check the preview and choose Load.</li><li>For a table on a web page choose Data &gt; Get Data &gt; From Other Sources &gt; From Web.</li><li>If everything lands in one column, select it and choose Data &gt; Text to Columns.</li><li>On a new sheet write the source, the date it was published and what each column means. Without these the data cannot be trusted.</li></ol></div>

${task(["Write whether each is primary or secondary for you: your class survey, the Census of India, a friend's survey results.","Share the survey as headline figures and write one thing that you can no longer see.","Choose one secondary source for a question on mobile phone sales and write four checks that you will make."])}
${quizSet(5)}`,
mount(r){regQuiz("q5",0,"It depends on who is using the data and whether they collected it.");
  let o={mode:"copy",keepName:false,binAge:true,round:true,group:"city"},persp="c";
  const pt=$("#ptab",r),pn=$("#pn",r);
  function drawP(){pn.textContent=DATA.length+" rows";pt.innerHTML=table(DATA,[["name","Name"],["age","Age"],["gender","Gen"],["city","City"],["pocket","Pocket"],["study","Study"],["sat","Sat"]],{});}
  function badge(){const c=persp==="c";$("#pbadge",r).innerHTML=c?'<span class="tag p">PRIMARY for you</span>':'<span class="tag s">SECONDARY for you</span>';
    $("#ptxt",r).textContent=c?"You asked the questions and gathered the answers. You know every detail of how it was collected.":"Someone else gathered it. You only see what they chose to share, and you must trust their method.";}
  function drawOpts(){let h="";
    if(o.mode==="copy")h=`<label class="chk"><input type="checkbox" id="oN" ${o.keepName?"checked":""}> Keep names</label><label class="chk"><input type="checkbox" id="oA" ${o.binAge?"checked":""}> Replace age with age band</label><label class="chk"><input type="checkbox" id="oR" ${o.round?"checked":""}> Round pocket money to nearest Rs 500</label>`;
    else if(o.mode==="summary")h=`Group by <select id="oG"><option value="city" ${o.group==="city"?"selected":""}>City</option><option value="gender" ${o.group==="gender"?"selected":""}>Gender</option><option value="age" ${o.group==="age"?"selected":""}>Age band</option></select>`;
    else h=`<span class="small muted">Three overall numbers only.</span>`;
    $("#opts",r).innerHTML=h;
    const bind=(id,k)=>{const e=$("#"+id,r);if(e)e.onchange=()=>{o[k]=e.type==="checkbox"?e.checked:e.value}};bind("oN","keepName");bind("oA","binAge");bind("oR","round");bind("oG","group");}
  $$("#persp button",r).forEach(b=>b.onclick=()=>{persp=b.dataset.p;$$("#persp button",r).forEach(x=>x.setAttribute("aria-pressed",x===b));badge()});
  $$("#mode button",r).forEach(b=>b.onclick=()=>{o.mode=b.dataset.m;$$("#mode button",r).forEach(x=>x.setAttribute("aria-pressed",x===b));drawOpts()});
  let last=null;
  $("#gen",r).onclick=()=>{last=makeSecondary(o);const s=last;
    $("#sn",r).textContent=`${s.kind}: ${s.rows.length} rows`;
    $("#stab",r).innerHTML=table(s.rows,s.cols,{newFrom:0});
    const lost=[];if(o.mode==="copy"){if(!o.keepName)lost.push("names");if(o.binAge)lost.push("exact ages");if(o.round)lost.push("exact pocket money")}else if(o.mode==="summary")lost.push("every individual row");else lost.push("all rows and columns");
    $("#lineage",r).innerHTML=`<b>Lineage:</b> ${DATA.length} primary rows &#10132; ${s.rows.length} secondary rows. <b>Lost:</b> ${lost.join(", ")||"nothing"}.`;
    $("#useCard",r).hidden=false;
    $("#qs",r).innerHTML=`<table class="dt"><thead><tr><th>Researcher's question</th><th>Can they answer it?</th></tr></thead><tbody>`+QSX.map(q=>{const a=q[1](o);return `<tr><td>${q[0]}</td><td>${a==="yes"?'<span class="tag g">Yes</span>':a==="approx"?'<span class="tag w">Only approximately</span>':'<span class="tag b">No, the information was removed</span>'}</td></tr>`}).join("")+`</tbody></table><p class="small muted">Privacy up means detail down. This trade-off is why secondary data is never "the same" as the primary data it came from.</p>`;
    $("#revCard",r).hidden=o.mode!=="summary";$("#revout",r).innerHTML="";};
  $("#rev",r).onclick=()=>{if(!last||o.mode!=="summary")return;const g=last.rows.reduce((a,b)=>b.n>a.n?b:a),n=g.n,avg=g.pocket,out=[];
    for(let t=0;t<3;t++){let v,ok=false;for(let k=0;k<400&&!ok;k++){v=[];let s=0;for(let i=0;i<n-1;i++){const x=2500+100*Math.floor(Math.random()*46);v.push(x);s+=x}
      const last0=avg*n-s;if(last0>=2500&&last0<=7000){v.push(last0);ok=true}}
      if(ok)out.push(v)}
    const real=DATA.filter(d=>({city:d.city,gender:d.gender,age:bin(d.age)}[o.group])===g.group).map(d=>d.pocket);
    $("#revout",r).innerHTML=`<p class="small">Published: group <b>${esc(g.group)}</b>, ${n} students, average Rs ${avg}.</p>`+out.map((v,i)=>`<div class="code">Possible list ${String.fromCharCode(65+i)}: ${v.join(", ")}  &#8594; average ${Math.round(mean(v))}</div>`).join("")+`<div class="code">The real list (only the collector has it): ${real.join(", ")}</div><div class="callout k small">Many different lists give the same average. Secondary data <b>cannot be turned back</b> into primary data. That is a reason to keep the original.</div>`;};
  drawP();badge();drawOpts();}
});
/* ---------- 6. Choosing a method ---------- */
const METHODS=[
 {n:"Survey / questionnaire",t:"Primary",d:"Many people answer the same questions.",depth:1,size:3,time:2,cost:1,numbers:3,why:2},
 {n:"Interview",t:"Primary",d:"One to one conversation.",depth:3,size:1,time:1,cost:2,numbers:1,why:3},
 {n:"Observation",t:"Primary",d:"Watch behaviour, no questions asked.",depth:2,size:2,time:1,cost:2,numbers:2,why:2},
 {n:"Experiment",t:"Primary",d:"Change one thing, measure the effect.",depth:2,size:2,time:1,cost:1,numbers:3,why:3},
 {n:"Existing records / reports",t:"Secondary",d:"Census, company records, published studies.",depth:1,size:3,time:3,cost:3,numbers:3,why:1}];
lesson({nav:"Choosing a collection method",title:"Choosing the right data collection method",syl:"Choosing the Right Data Collection Method",
html:()=>`<p class="lead">No method is best. Pick by your <b>question</b>, then check <b>time, money and people</b>.</p>
<div class="card"><table class="dt"><thead><tr><th>Method</th><th>Type</th><th>What it is</th></tr></thead><tbody>${METHODS.map(m=>`<tr><td><b>${m.n}</b></td><td><span class="tag ${m.t==="Primary"?"p":"s"}">${m.t}</span></td><td>${m.d}</td></tr>`).join("")}</tbody></table></div>
<div class="card try"><h3>Try it: method adviser</h3>
<div class="grid2"><label>What do you need?<br><select id="w1"><option value="numbers">Numbers to compare groups</option><option value="why">The reasons behind behaviour</option></select></label>
<label>How many people?<br><select id="w2"><option value="3">Hundreds</option><option value="2">Dozens</option><option value="1">A handful</option></select></label>
<label>How much time do you have?<br><select id="w3"><option value="3">Hours</option><option value="2">Days</option><option value="1">Weeks</option></select></label>
<label>Budget<br><select id="w4"><option value="3">Almost none</option><option value="2">Small</option><option value="1">Comfortable</option></select></label></div>
<div class="row"><label class="chk"><input type="checkbox" id="w5"> Good data on this topic may already exist</label></div>
<div id="wout"></div></div>
<div class="card"><h3>Case: Students want to know if hostel students spend more on food</h3><p class="small">Numbers to compare two groups, dozens of people, days, small budget. A <b>short survey</b> fits. If the college already publishes mess billing, <b>existing records</b> are quicker, but check they cover day scholars too.</p></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">No method is best for every question. Start with the question and then check the time, the money and the number of people. A survey gives numbers that you can compare across many people. An interview gives reasons and detail from a few people. Observation shows what people really do, which may differ from what they say. An experiment shows the effect of changing one thing. Existing records are the cheapest source when they cover the people and the period you need.</p><p class="small">A good choice often combines methods: a few interviews to find the right questions, then a survey to count how common each answer is.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The adviser asks what you need, how many people you can reach, how much time and money you have, and whether good data may already exist. It then ranks the five methods. The ranking is a teaching model, not a law, so change the answers and watch the order move. In the hostel case, numbers for two groups of dozens of students within days and on a small budget point to a short survey. If the college already publishes mess billing, the records are quicker, but you must check that they cover day scholars too.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Choose the method from the question, not from habit.</li><li>Check whether usable data already exists.</li><li>Use interviews to find reasons and surveys to measure how common they are.</li><li>Write down the limits of the method you chose.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Collect and summarise survey answers.</p><ol class="small"><li>Put each question in a column and give the rating columns a list validation of 1 to 5.</li><li>Tally a closed question with <code>=COUNTIF(range,"Yes")/COUNTA(range)</code> to get the share.</li><li>Insert &gt; PivotTable puts a category in Rows and Count of responses in Values, so you can compare groups.</li></ol></div>

${task(["Use the adviser for a question on why students skip the library. Write the best method it gives and whether you agree.","Change the time to 'Hours' and write what happens to the ranking.","Write a plan that combines two methods for one question."])}
${quizSet(6)}`,
mount(r){regQuiz("q6",1,"Interviews give depth and reasons. A tick-box survey can come after, to measure how common each reason is.");
  function draw(){const need=$("#w1",r).value,size=+$("#w2",r).value,time=+$("#w3",r).value,cost=+$("#w4",r).value,exist=$("#w5",r).checked;
    const sc=METHODS.map(m=>{let s=m[need]*2+(3-Math.abs(m.size-size))+(3-Math.abs(m.time-time)*1)*(0.5)+(3-Math.abs(m.cost-cost))*0.5;if(m.t==="Secondary")s+=exist?3:-2;return {m,s}}).sort((a,b)=>b.s-a.s);
    $("#wout",r).innerHTML=sc.map((x,i)=>`<div class="row" style="margin:6px 0"><b style="min-width:200px">${i===0?"Best fit: ":""}${x.m.n}</b><div class="bar" style="flex:1;min-width:120px"><i style="width:${Math.max(8,Math.round(x.s/13*100))}%"></i></div></div>`).join("")+`<p class="small muted">A teaching model, not a law: change the answers and see how the ranking moves.</p>`}
  ["w1","w2","w3","w4","w5"].forEach(i=>$("#"+i,r).onchange=draw);draw();}
});
/* ---------- 7. Ethics ---------- */
const EF=[["name","Name"],["age","Exact age"],["gender","Gender"],["city","City"],["pocket","Pocket money"],["app","Favourite app"]];
const SCEN=[["Collecting a classmate's phone number for a food survey that only needs averages.","No"],["Telling respondents what the data is for, and that they can skip any question.","Yes"],["Publishing a table with names beside each person's pocket money.","No"],["Storing survey data in a shared folder open to anyone with the link.","No"]];
lesson({nav:"Ethics in data collection",title:"Ethical considerations in data collection",syl:"Ethical Considerations in Data Collection",
html:()=>`<p class="lead">Data is about real people. Four habits: <b>consent</b> (they agree, knowing the purpose), <b>minimum data</b> (ask only what you need), <b>privacy</b> (people cannot be identified), <b>honesty</b> (report what you found, not what you wanted).</p>
<div class="card try"><h3>Try it: how identifiable is your survey?</h3>
<p class="small muted">Tick the columns you would publish. The meter counts how many of the ${"{N}"} students would be <b>unique</b> on that combination, meaning anyone who knows these facts about a person could find their row.</p>
<div class="row" id="efs">${EF.map(f=>`<label class="chk"><input type="checkbox" value="${f[0]}"> ${f[1]}</label>`).join("")}</div>
<div class="bar"><i id="ebar" style="width:0"></i></div><p id="etxt" class="small"></p></div>
<div class="card try"><h3>Try it: ethical or not?</h3><div id="sc"></div></div>
<div class="callout i small"><b>India:</b> the Digital Personal Data Protection Act, 2023 covers personal data. For classroom work, the rule of thumb is consent, anonymise, minimum data, secure storage. Check the current text of the Act for anything beyond a class exercise.</div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">Data is about real people, so its collection has duties. ${g("consent","Informed consent")} means that people agree to give data after they are told the purpose. Minimum data means that you ask only for what you need. Privacy means that people cannot be identified from what you publish. Honesty means that you report what you found and not what you hoped to find.</p><p class="small">To ${g("anonymise","anonymise")} data is to remove or change details so that a person cannot be found. Removing the name is not enough. A combination of age, city and favourite app may belong to only one person, and anyone who knows those facts can find that row. In India, the Digital Personal Data Protection Act, 2023 covers personal data. For classroom work, use the rule of thumb: consent, anonymise, minimum data and secure storage.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The meter counts how many of the 16 students are unique on the columns you tick. With only the city, few students are unique. Add the exact age and the pocket money and almost every student becomes unique, even without the name. This is why published tables should combine rare values, such as age bands instead of exact ages. The second demo gives four practice cases. Checking each one against the four habits is the skill to learn.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Tell people the purpose and that they can skip a question.</li><li>Collect only what the analysis needs.</li><li>Check the combinations of columns for uniqueness before you publish.</li><li>Store the data where only the intended people can open it.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales_Raw</b> of bmt-sales-dataset.xlsx (1015 rows in 2 to 1016; Region is column C, OrderDate B, Units F, Rating J).</p><ol class="small"><li>Copy the sheet first (right-click the tab &gt; Move or Copy &gt; Create a copy) and work on the copy.</li><li>Remove direct identifiers: delete the Salesperson column (it holds names) and, if needed, replace CustomerID with codes.</li><li>Combine rare categories with Find and Replace (Ctrl+H).</li><li>Hide small counts in a published table: <code>=IF(COUNTIF(C2:C1016,"North")<5,"fewer than 5",COUNTIF(C2:C1016,"North"))</code>.</li><li>Choose File &gt; Info &gt; Check for Issues &gt; Inspect Document to remove the author name and hidden data before sharing.</li></ol></div>

${task(["Tick City only and then City, Age and Pocket money. Write how the number of unique students changes.","Rewrite the question 'What is your phone number?' for a survey that needs only the average spend.","Write a consent sentence for the first page of a class survey."])}
${quizSet(7)}`,
mount(r){regQuiz("q7",0,"Removing direct identifiers and avoiding unique combinations lowers the risk of re-identification.");
  $("#efs",r).previousElementSibling.innerHTML=$("#efs",r).previousElementSibling.innerHTML.replace("{N}",DATA.length);
  function draw(){const sel=$$("#efs input:checked",r).map(i=>i.value);
    if(!sel.length){$("#ebar",r).style.width="0";$("#etxt",r).textContent="Nothing selected: nobody can be identified.";return}
    const key=d=>sel.map(k=>k==="age"?d.age:d[k]).join("|"),cnt={};DATA.forEach(d=>cnt[key(d)]=(cnt[key(d)]||0)+1);
    const u=DATA.filter(d=>cnt[key(d)]===1).length,p=Math.round(100*u/DATA.length);
    $("#ebar",r).style.width=p+"%";$("#etxt",r).innerHTML=`<b>${u} of ${DATA.length}</b> students (${p}%) are unique. ${p>=50?'<span class="tag b">High risk</span> Drop or generalise a column.':p>=15?'<span class="tag w">Medium risk</span>':'<span class="tag g">Low risk</span>'}`}
  $$("#efs input",r).forEach(i=>i.onchange=draw);draw();
  $("#sc",r).innerHTML=SCEN.map((s,i)=>`<div class="row" data-i="${i}" style="justify-content:space-between;border-bottom:1px solid var(--line2);padding-bottom:6px"><span style="flex:1;min-width:220px">${s[0]}</span><span><button class="btn sm" data-a="Yes">Ethical</button> <button class="btn sm" data-a="No">Not ethical</button> <span class="fb small"></span></span></div>`).join("");
  $$("#sc [data-a]",r).forEach(b=>b.onclick=()=>{const row=b.closest("[data-i]"),ok=b.dataset.a===SCEN[+row.dataset.i][1];$(".fb",row).innerHTML=ok?'<span class="tag g">Correct</span>':'<span class="tag b">Think again</span>'});}
});
/* ---------- 8. Basic operations ---------- */
lesson({nav:"Basic data operations",title:"Basic data operations: sort, filter, summarise",syl:"Basic Data Operations (also: central tendency and variability)",
html:()=>`<p class="lead">Almost all analysis is four moves: <b>sort</b> the rows, <b>filter</b> some rows, <b>calculate</b> a number, <b>group</b> and compare.</p>
<div class="card try"><h3>Try it: operate on the survey</h3>
<div class="row">Filter city <select id="bc"><option value="">All</option>${CITIES.map(c=>`<option>${c}</option>`).join("")}</select>
Sort by <select id="bs"><option value="id">Order entered</option><option value="pocket">Pocket money</option><option value="study">Study hours</option><option value="age">Age</option></select>
<select id="bd"><option value="1">low to high</option><option value="-1">high to low</option></select></div>
<div id="btab"></div></div>
<div class="card try"><h3>Central tendency and variability</h3>
<div class="row">Column <select id="nc"><option value="pocket">Pocket money</option><option value="study">Study hours</option><option value="age">Age</option><option value="sat">Satisfaction</option></select> (uses the filter above)</div>
<div class="grid3" id="stats"></div><div id="sform" class="code" style="margin-top:10px"></div></div>
<div class="callout k small"><b>Mean vs median:</b> if one very rich student joins, the mean jumps and the median hardly moves. Try adding a row in lesson 4 with pocket money 90000 and come back.</div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">Almost all analysis uses four moves: sort the rows, filter some of them, calculate a number, and group and compare. To sort is to reorder the rows by a column. To filter is to show only the rows that meet a condition.</p><p class="small">The numbers that summarise a column are of two kinds. Measures of centre say where the values are. The ${g("mean","mean")} is the sum divided by the count. The median is the middle value after sorting. The mode is the most frequent value. Measures of spread say how far the values are from each other: the range (maximum minus minimum), the ${g("sd","standard deviation")} and the ${g("quartile","quartiles")}. When the mean is above the median, the data is ${g("skew","right-skewed")}: a few large values pull the mean up.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Choose a city filter and a sort order and the table changes. The panel below it shows all the summary numbers for the visible rows. Compare the mean and the median of the pocket money. If you add a row with Rs 90,000 in lesson 4, the mean jumps and the median hardly moves. That is why the median is the safer centre for skewed data such as incomes and pocket money. With a filter on, use SUBTOTAL in a sheet so that hidden rows are not included.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Always report the centre together with the spread.</li><li>Compare the mean and the median before you decide which to use.</li><li>Sort and filter the whole table, never one column alone.</li><li>State which rows are included in each number.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales_Raw</b> of bmt-sales-dataset.xlsx (1015 rows in 2 to 1016; Region is column C, OrderDate B, Units F, Rating J).</p><ol class="small"><li>Sort: click a cell in the data, choose Data &gt; Sort, then Add Level (for example Region, then Units largest to smallest).</li><li>Filter: press Ctrl+Shift+L and use the drop-down arrows.</li><li>Summarise a numeric column: <code>=AVERAGE(F2:F1016)</code>, <code>=MEDIAN(F2:F1016)</code>, <code>=MODE.SNGL(F2:F1016)</code>, <code>=STDEV.S(F2:F1016)</code>, <code>=MIN(F2:F1016)</code>, <code>=MAX(F2:F1016)</code>.</li><li>If the mean is above the median, a few large values pull the mean up (right-skewed).</li><li>For many statistics at once enable the Analysis ToolPak (File &gt; Options &gt; Add-ins) and use Data &gt; Data Analysis &gt; Descriptive Statistics.</li></ol></div>

${task(["Filter the city to Bhopal and write the mean and median of pocket money.","Add a row with pocket money 90000 in lesson 4 and write what happens to the mean and the median.","Write the range and the standard deviation of study hours."])}
${quizSet(8)}`,
mount(r){regQuiz("q8",0,"When mean is above median, a few large values stretch the right side (right-skewed).");
  const colL={pocket:"Pocket money",study:"Study hours",age:"Age",sat:"Satisfaction"};
  function rows(){const c=$("#bc",r).value,k=$("#bs",r).value,d=+$("#bd",r).value;return DATA.filter(x=>!c||x.city===c).sort((a,b)=>(a[k]-b[k])*d)}
  function draw(){const R=rows();$("#btab",r).innerHTML=R.length?table(R,COLS.filter(c=>c[0]!=="app"),{}):'<div class="callout">No rows match.</div>';
    const col=$("#nc",r).value,v=R.map(x=>x[col]);
    if(v.length<2){$("#stats",r).innerHTML='<div class="cardsel">Need at least 2 rows.</div>';$("#sform",r).textContent="";return}
    const S=[["Mean",mean(v)],["Median",median(v)],["Mode",mode(v)],["Minimum",Math.min(...v)],["Maximum",Math.max(...v)],["Range",Math.max(...v)-Math.min(...v)],["Std deviation",sd(v)],["Q1",quant(v,.25)],["Q3",quant(v,.75)]];
    $("#stats",r).innerHTML=S.map(s=>`<div class="cardsel"><div class="small muted">${s[0]}</div><b style="font-size:18px">${typeof s[1]==="number"?fmt(s[1]):s[1]}</b></div>`).join("");
    const cc={pocket:"F",study:"G",age:"C",sat:"I"}[col];
    $("#sform",r).textContent=`In a sheet (data in rows 2 to ${DATA.length+1}):  =AVERAGE(${cc}2:${cc}${DATA.length+1})   =MEDIAN(...)   =MODE(...)   =STDEV(...)   =QUARTILE(...,1)\nWith a filter, use SUBTOTAL(101, range) for the average of visible rows only.`}
  ["bc","bs","bd","nc"].forEach(i=>$("#"+i,r).onchange=draw);draw();}
});
/* ---------- 9. Cleaning ---------- */
const STEPS=[
 ["Trim spaces and fix letter case","=PROPER(TRIM(B2))  then copy, paste values only",rows=>rows.map(r=>({...r,name:r.name===""?"":proper(r.name),city:proper(r.city)})),"Select the cell, run the formula, copy the result, Paste special, Values only."],
 ["Fix wrong types (text to number, N/A to blank)","=IFERROR(VALUE(C2),\"\") and a Find and Replace of N/A with nothing",rows=>rows.map(r=>({...r,age:r.age==="nineteen"?19:r.age,rating:r.rating==="N/A"?"":r.rating})),"Here we convert the word 'nineteen' by hand, because no formula can read English reliably."],
 ["Make all dates yyyy-mm-dd","=DATE(RIGHT(E2,4),MID(E2,4,2),LEFT(E2,2)) for dd-mm-yyyy text",rows=>rows.map(r=>{const m=String(r.joined).match(/^(\d{2})[-\/](\d{2})[-\/](\d{4})$/);return m?{...r,joined:`${m[3]}-${m[2]}-${m[1]}`}:r}),"Locale-proof: build the date from its pieces instead of trusting auto-detect."],
 ["Remove duplicate rows","Data, Data cleanup, Remove duplicates (Excel: Data, Remove Duplicates)",rows=>{const d=dupIdx(rows);return rows.filter((_,i)=>!d.has(i))},"Run this after steps 1 to 3, otherwise 'diya' and 'Diya' look different."],
 ["Handle impossible values (set to blank)","=IF(OR(C2<15,C2>100),\"\",C2)  and =IF(OR(F2<1,F2>5),\"\",F2)",rows=>rows.map(r=>({...r,age:(typeof r.age==="number"&&(r.age<15||r.age>100))?"":r.age,rating:(typeof r.rating==="number"&&(r.rating<1||r.rating>5))?"":r.rating})),"Do not guess. 190 is probably 19, but check the source before you change it."]];
lesson({nav:"Data cleaning",title:"Data cleaning techniques",syl:"Data Cleaning Techniques",
html:()=>`<p class="lead">Cleaning means fixing the problems you found in the audit (lesson 3). Do the steps <b>in this order</b>, and keep the original sheet untouched.</p>
<div class="card try"><h3>Try it: clean the file step by step</h3>
<div class="row"><button class="btn pri" id="cstep" type="button">Apply next step</button><button class="btn" id="creset" type="button">Start over</button><span id="cinfo" class="small"></span></div>
<div id="clog" class="small"></div><div id="ctab"></div><div class="legend small muted" style="margin-top:6px">Green cells changed in the last step.</div></div>
<div class="card try" id="missCard" hidden><h3>Last decision: blank values</h3>
<p class="small">Blanks remain in Age, Name and Rating. There is no single right answer. Choose, and see what happens to the average age.</p>
<div class="row"><div class="seg" id="miss"><button type="button" data-m="none" aria-pressed="true">Leave blank</button><button type="button" data-m="drop" aria-pressed="false">Drop those rows</button><button type="button" data-m="fill" aria-pressed="false">Fill age with median</button></div></div>
<p id="mout" class="small"></p></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">${g("cleaning","Data cleaning")} fixes the problems found in the audit. The usual problems are spacing and case differences, ${g("duplicate","duplicate")} rows, values of the wrong type, impossible values, ${g("missing","missing values")} and dates in different formats. Always keep the original sheet untouched and work on a copy, so that you can check your work and start again.</p><p class="small">The order of the steps matters. Fix spaces and case first, because "diya " and "Diya" can be recognised as the same person only after they look the same. Then remove duplicates. Then deal with types, impossible values and missing values. For each missing value there are two choices, drop the row or fill the value, and either one is acceptable if you write down what you did.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Press the button to apply one step at a time to the ten-row file. Green cells show what changed in the last step. Step 1 fixes spaces and case, so the two Diya rows become identical. Step 2 converts the word "nineteen" to 19 and turns the N/A rating into a blank. Step 3 makes the dates the same. Step 4 removes the duplicate Diya row, which works only because step 1 came first. Step 5 sets the impossible age of 190 and the impossible rating of 9 to blank. After the five steps the file has nine rows and no wrong values, but it still has missing values, which you must handle by a stated choice.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Work on a copy of the file.</li><li>Fix the text first, then the duplicates, then the values.</li><li>Do not guess: if a value cannot be known, mark it missing.</li><li>Write a short log of each change and the number of rows affected.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales_Raw</b> of bmt-sales-dataset.xlsx (1015 rows in 2 to 1016; Region is column C, OrderDate B, Units F, Rating J). Work on a copy of the sheet.</p><ol class="small"><li><b>Fix spaces and case.</b> In a new column enter <code>=PROPER(TRIM(C2))</code> and fill down. The 25 spellings of the region become 5: Central, East, North, South, West. Copy the column and use Paste Special &gt; Values over column C.</li><li><b>Remove duplicates, after the fix.</b> Select the data and choose Data &gt; Remove Duplicates with all columns ticked. Excel reports 15 duplicate rows removed and 1000 unique rows remaining.</li><li><b>Fix text dates.</b> 20 dates are text such as 24-11-2025. Find them with <code>=ISTEXT(B2)</code>, then convert with <code>=DATE(RIGHT(B2,4),MID(B2,4,2),LEFT(B2,2))</code>.</li><li><b>Handle missing values.</b> Press Ctrl+Shift+L, open the Units filter and tick (Blanks). There are 12. The clean reference file drops these rows, which leaves 988 orders.</li><li><b>Handle wrong types.</b> Six ratings contain the text N/A. Use Ctrl+H to replace N/A with nothing, so that averages ignore them.</li><li>Check the result with a PivotTable of Region: it must show five rows only.</li></ol></div>

${task(["Apply all five steps in the demo and write the number of rows at the end.","Write which step removed the duplicate and why it had to come after the case fix.","Step 5 sets the age 190 and the rating 9 to blank. Write why a blank is better than guessing a value."])}
${quizSet(9)}`,
mount(r){regQuiz("q9",0,"Duplicate detection compares exact text, so standardise first.");
  let rows=DIRTY0(),step=0,prev=null;
  function draw(){const cls=(row,c,i)=>{if(!prev)return"";const p=prev.find(x=>x.id===row.id);return p&&String(p[c])!==String(row[c])?" chg":""};
    $("#ctab",r).innerHTML=table(rows,DC,{cellClass:cls,small:true});
    $("#cinfo",r).textContent=`Step ${step} of ${STEPS.length} done, ${rows.length} rows`;
    $("#cstep",r).disabled=step>=STEPS.length;$("#missCard",r).hidden=step<STEPS.length;if(step>=STEPS.length)miss();}
  function miss(){const m=$$("#miss [aria-pressed=true]",r)[0].dataset.m;let R=rows;
    if(m==="drop")R=rows.filter(x=>x.name!==""&&x.age!==""&&x.rating!=="");
    const ages=R.map(x=>x.age).filter(a=>typeof a==="number"),med=median(rows.map(x=>x.age).filter(a=>typeof a==="number"));
    const avg=m==="fill"?mean(R.map(x=>x.age===""?med:x.age)):mean(ages);
    $("#mout",r).innerHTML=`Rows: <b>${R.length}</b>. Average age: <b>${avg.toFixed(2)}</b>. ${m==="drop"?"You lose data, but nothing is invented.":m==="fill"?"Median fill keeps the row, but it adds guesses that shrink the variability.":"Most functions (AVERAGE, COUNT) ignore blanks, so this is often fine."}`}
  $("#cstep",r).onclick=()=>{if(step>=STEPS.length)return;prev=rows.map(x=>({...x}));const s=STEPS[step];rows=s[2](rows);step++;
    $("#clog",r).innerHTML=`<div class="callout i"><b>Step ${step}: ${s[0]}</b><div class="code" style="margin-top:6px">${esc(s[1])}</div><span class="muted">${s[3]}</span></div>`;draw()};
  $("#creset",r).onclick=()=>{rows=DIRTY0();step=0;prev=null;$("#clog",r).innerHTML="";draw()};
  $$("#miss button",r).forEach(b=>b.onclick=()=>{$$("#miss button",r).forEach(x=>x.setAttribute("aria-pressed",x===b));miss()});
  draw();}
});
/* ---------- 10. Reshape ---------- */
const WIDE=[{Student:"Aarav",Maths:62,Statistics:70,Excel:81},{Student:"Diya",Maths:75,Statistics:68,Excel:90},{Student:"Kabir",Maths:58,Statistics:55,Excel:72}];
lesson({nav:"Transforming and reshaping",title:"Transforming and reshaping data",syl:"Transforming and Reshaping Data",
html:()=>`<p class="lead"><b>Transforming</b> = making new columns from old ones (Net Sales = Units x MRP x discount). <b>Reshaping</b> = changing the table's shape without changing the facts.</p>
<div class="grid2"><div class="card"><span class="tag p">Wide</span> one row per student, a column per subject. Easy to read.</div><div class="card"><span class="tag s">Long</span> one row per student per subject. Needed for pivot tables, filters and most charts.</div></div>
<div class="card try"><h3>Try it: wide to long and back</h3>
<div class="seg" id="shape"><button type="button" data-s="w" aria-pressed="true">Wide</button><button type="button" data-s="l" aria-pressed="false">Long</button></div>
<div id="stab2" style="margin-top:10px"></div><div id="snote2" class="callout i small"></div></div>
<div class="card try"><h3>Try it: transform a column</h3>
<p class="small muted">Make a new column from existing ones. Pick the formula and see the new column appear on the survey.</p>
<div class="row"><select id="tf"><option value="a">Pocket money per day = pocket / 30</option><option value="b">Age band = IF(age&lt;=19,"18-19","20+")</option><option value="c">Spender = IF(pocket&gt;=5000,"High","Normal")</option></select></div><div id="ttab"></div><div class="code" id="tform"></div></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">To ${g("transform","transform")} data is to make new columns from existing ones. Net sales is units multiplied by the price and the discount factor. An age band is made from age. A pocket money per day is the monthly amount divided by 30. To ${g("reshape","reshape")} data is to change the shape of the table without changing its facts.</p><p class="small">A table in ${g("wide","wide format")} has one row per student and one column per subject. It is easy to read. In long format there is one row per student per subject. Pivot tables, filters and most charts need long format, because then one column holds the subject and one column holds the marks. Going from wide to long is called unpivoting.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The first demo switches between the wide and the long form of the same marks. The number of rows grows from 3 to 9, and the number of columns falls from 4 to 3. No fact has changed. The second demo adds a new column to the survey, such as pocket money per day, an age band or a spender class. The formula for row 2 is shown, and it is filled down for all rows. A calculated column is better than a typed one, because it updates when the data changes.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Keep the raw columns and add calculated columns beside them.</li><li>Use long format when you want to pivot or chart by a category.</li><li>Check one row of a new column by hand.</li><li>Name each new column so that others know what it means.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales_Raw</b> of bmt-sales-dataset.xlsx (1015 rows in 2 to 1016; Region is column C, OrderDate B, Units F, Rating J).</p><ol class="small"><li><b>Calculated column.</b> Add NetSales: <code>=F2*G2*(1-H2/100)</code>. Add Month: <code>=TEXT(B2,"yyyy-mm")</code>.</li><li><b>Split a column.</b> Type the first name next to the first row, press Ctrl+E (Flash Fill) and Excel fills the rest.</li><li><b>Wide to long.</b> Select the data, choose Data &gt; From Table/Range, select the columns to keep, then Transform &gt; Unpivot Other Columns. Close and load.</li><li><b>Long to wide.</b> Insert &gt; PivotTable, then drag the category to Columns.</li><li>Turn the range into a table with Ctrl+T, so that formulas and pivots grow with new rows.</li></ol></div>

${task(["Switch the marks table from wide to long and write the number of rows.","Add the age band column to the survey and write how many students are in the 20+ band.","Write a formula for a spender class that is High for pocket money of 5000 or more."])}
${quizSet(10)}`,
mount(r){regQuiz("q10",1,"Long format has one column holding the subject, so you can drag it into Rows or Filters.");
  let sh="w";const subs=["Maths","Statistics","Excel"];
  function draw(){if(sh==="w"){$("#stab2",r).innerHTML=table(WIDE,[["Student","Student"],...subs.map(s=>[s,s])],{small:true});$("#snote2",r).textContent="3 rows, 4 columns. Each subject is its own column. In Sheets, reshaping to long: use a formula per row, or Power Query's Unpivot in Excel and Power BI."}
    else{const L=[];WIDE.forEach(w=>subs.forEach(s=>L.push({Student:w.Student,Subject:s,Score:w[s]})));$("#stab2",r).innerHTML=table(L,[["Student","Student"],["Subject","Subject"],["Score","Score"]],{newFrom:0,small:true});$("#snote2",r).textContent="9 rows, 3 columns. Same 9 facts. Power Query: select Student, then Transform, Unpivot other columns."}}
  $$("#shape button",r).forEach(b=>b.onclick=()=>{sh=b.dataset.s;$$("#shape button",r).forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});draw();
  function t(){const k=$("#tf",r).value,F={a:[d=>+(d.pocket/30).toFixed(0),"Per day (Rs)","=F2/30"],b:[d=>d.age<=19?"18-19":"20+","Age band",'=IF(C2<=19,"18-19","20+")'],c:[d=>d.pocket>=5000?"High":"Normal","Spender",'=IF(F2>=5000,"High","Normal")']}[k];
    $("#ttab",r).innerHTML=table(DATA.slice(0,8).map(d=>({name:d.name,age:d.age,pocket:d.pocket,x:F[0](d)})),[["name","Name"],["age","Age"],["pocket","Pocket"],["x",F[1]]],{small:true});$("#tform",r).textContent="New column formula (row 2):  "+F[2]}
  $("#tf",r).onchange=t;t();}
});
/* ---------- 11. Merge ---------- */
const ORD=[{order:"O1",cust:"C1",amt:500},{order:"O2",cust:"C2",amt:300},{order:"O3",cust:"C4",amt:700},{order:"O4",cust:"C9",amt:200}];
const CUS=[{cust:"C1",name:"Aarav",city:"Bhopal"},{cust:"C2",name:"Diya",city:"Indore"},{cust:"C3",name:"Kabir",city:"Sehore"},{cust:"C4",name:"Meera",city:"Bhopal"}];
lesson({nav:"Merging and joining",title:"Merging and joining datasets",syl:"Merging and Joining Datasets",
html:()=>`<p class="lead">Real data lives in several tables. A <b>join</b> glues them together using a shared <b>key</b> column (here, <code>cust</code>). This is exactly what VLOOKUP and XLOOKUP do, one column at a time.</p>
<div class="grid2"><div><span class="tag p">Orders</span>${table(ORD,[["order","Order"],["cust","Cust"],["amt","Amount"]],{small:true})}</div><div><span class="tag s">Customers</span>${table(CUS,[["cust","Cust"],["name","Name"],["city","City"]],{small:true})}</div></div>
<div class="card try"><h3>Try it: choose a join</h3>
<div class="seg s" id="jt"><button type="button" data-j="inner" aria-pressed="true">Inner</button><button type="button" data-j="left" aria-pressed="false">Left (keep all orders)</button><button type="button" data-j="right" aria-pressed="false">Right (keep all customers)</button><button type="button" data-j="outer" aria-pressed="false">Full outer</button></div>
<p id="jtxt" class="small"></p><div id="jtab"></div><div id="jnote" class="callout k small"></div></div>
<div class="card"><h3>In a spreadsheet</h3><div class="code">=XLOOKUP(B2, Customers!A:A, Customers!B:B, "Not found")\n=VLOOKUP(B2, Customers!$A$2:$C$5, 2, FALSE)</div><p class="small">A lookup works like a <b>left join</b>: every row of the main sheet stays, and unmatched keys show #N/A (or your "Not found" text). In Power BI and Excel, use Power Query, Home, Merge Queries.</p></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">Real data is spread over several tables. A ${g("join","join")} combines two tables by a ${g("key","key column")}, a column that appears in both. In the example, the Cust column links each order to a customer. Four joins are common. An inner join keeps only the keys found in both tables. A left join keeps every row of the left table and leaves blanks where there is no match. A right join does the opposite. A full outer join keeps every row of both.</p><p class="small">The ${g("lookup","VLOOKUP and XLOOKUP")} functions of a spreadsheet work like a left join, one column at a time. Each row of the main sheet is kept. A key with no match shows an error such as #N/A, or a text that you choose.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Choose a join and the result table changes. The inner join gives 3 rows: order O4 (customer C9) is dropped because C9 is not in the customer table, and customer Kabir (C3) is dropped because he has no order. The left join keeps O4 with blanks for the name and city. The right join keeps Kabir with blanks for the order. The full join keeps every row of both. The choice depends on the question: to list all orders with customer details, use the left join and look for blanks.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Check that the key is the same kind of value in both tables.</li><li>Choose the join from the question, then check the row count.</li><li>Look for unmatched keys after every join.</li><li>Keep the original tables unchanged.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales_Raw</b> of bmt-sales-dataset.xlsx (1015 rows in 2 to 1016; Region is column C, OrderDate B, Units F, Rating J).</p><ol class="small"><li><b>Lookup.</b> Add the product category from the Products sheet: <code>=VLOOKUP(D2,Products!$A$2:$D$13,2,FALSE)</code>. Add the customer city: <code>=VLOOKUP(I2,Customers!$A$2:$D$121,3,FALSE)</code>. In newer Excel <code>=XLOOKUP(I2,Customers!A:A,Customers!C:C)</code> does the same.</li><li>Wrap the formula in <code>=IFERROR(...,"not found")</code>. Orders with no match show "not found", which is the left join result: every order is kept.</li><li><b>Merge with Power Query.</b> Load both tables with Data &gt; From Table/Range, then choose Data &gt; Get Data &gt; Combine Queries &gt; Merge. Pick the matching columns and a join kind (Left Outer keeps every order, Inner keeps only matches).</li><li><b>Stack tables.</b> To add rows from a second month with the same columns choose Combine Queries &gt; Append.</li></ol></div>

${task(["Run all four joins and write the number of rows each gives.","Write which join you would use to list all customers who have not placed an order.","Write one reason why a key might fail to match even when the customer exists."
])}
${quizSet(11)}`,
mount(r){regQuiz("q11",1,"A left join keeps every order and leaves the customer columns blank when there is no match.");
  const exp={inner:"Only keys that appear in both tables. O3's customer C4 matches; O4 (C9) and Kabir (C3) are dropped.",left:"All orders, with customer details where they exist. O4 has blanks for name and city.",right:"All customers, with their orders where they exist. Kabir (C3) appears with no order.",outer:"Everything from both sides. Blanks fill wherever there is no partner."};
  function draw(){const j=$$("#jt [aria-pressed=true]",r)[0].dataset.j,out=[];
    ORD.forEach(o=>{const c=CUS.find(x=>x.cust===o.cust);if(c)out.push({order:o.order,cust:o.cust,amt:o.amt,name:c.name,city:c.city});else if(j==="left"||j==="outer")out.push({order:o.order,cust:o.cust,amt:o.amt,name:"",city:""})});
    if(j==="right"||j==="outer")CUS.forEach(c=>{if(!ORD.some(o=>o.cust===c.cust))out.push({order:"",cust:c.cust,amt:"",name:c.name,city:c.city})});
    $("#jtab",r).innerHTML=table(out,[["order","Order"],["cust","Cust"],["amt","Amount"],["name","Name"],["city","City"]],{newFrom:0,small:true});
    $("#jtxt",r).textContent=out.length+" rows in the result.";$("#jnote",r).textContent=exp[j]}
  $$("#jt button",r).forEach(b=>b.onclick=()=>{$$("#jt button",r).forEach(x=>x.setAttribute("aria-pressed",x===b));draw()});draw();}
});
