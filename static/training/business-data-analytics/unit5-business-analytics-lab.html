<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Analytics Lab - Unit V</title>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#EFEBE1; --fg:#12110E; --muted:#44403A; --line:#B9B2A2; --line2:#D9D3C4;
  --pri:#1F3FB5; --pri-soft:#DDE5FA; --sec:#9A4208; --sec-soft:#FBE3CC;
  --good:#0F6A31; --good-soft:#D5F0DD; --warn:#744500; --warn-soft:#F9E8B8; --bad:#A31D12; --bad-soft:#FADAD5;
  --code:#EFEBE1; --on:#FFFFFF; --grid:#CFC9BA; --shadow:0 1px 2px rgba(18,17,14,.08),0 6px 18px rgba(18,17,14,.06);
  --c1:#1F3FB5; --c2:#9A4208; --c3:#0F6A31; --c4:#7A2A9C; --c5:#8A6D00; --c6:#B0235C;
  --disp:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --zoom:1;
}
:root[data-theme="dark"]{
  --bg:#0C0C0A; --surface:#181714; --surface2:#242320; --fg:#F7F4EA; --muted:#CFCABD; --line:#5B574B; --line2:#35332C;
  --pri:#9DB1FF; --pri-soft:#1B2350; --sec:#FFAE6B; --sec-soft:#40240E;
  --good:#6FE09A; --good-soft:#0F3320; --warn:#F5C964; --warn-soft:#3B2E0A; --bad:#FF9A8C; --bad-soft:#451A15;
  --code:#1F1E1A; --on:#0C0C0A; --grid:#46433A; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  --c1:#9DB1FF; --c2:#FFAE6B; --c3:#6FE09A; --c4:#D9A0FF; --c5:#F0D060; --c6:#FF8FB8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);zoom:var(--zoom)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;min-height:calc(100vh / var(--zoom))}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.brand{font-family:var(--disp);font-size:20px;line-height:1.15;margin:0 4px 4px}
.brand small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:4px}
.nav ol{list-style:none;margin:16px 0 0;padding:0}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.nav li button:hover{background:var(--surface2)}
.nav li button[aria-current="true"]{background:var(--pri-soft);font-weight:600}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.nav li.done .n{background:var(--good);color:var(--on);border-color:var(--good)}
.nav .t{font-size:13.5px;line-height:1.3}
.nav .hero .n{border-color:var(--sec);color:var(--sec)}
.tools{margin:18px 4px 0;display:grid;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;text-align:left}
.tools button:hover{border-color:var(--fg)}
.tools .hint{font-size:12px;color:var(--muted)}
main{padding:26px 30px 70px;min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px}
h2{font-family:var(--disp);font-size:20px;margin:0 0 8px}
h3{font-size:13.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.syl{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card.try{border-left:5px solid var(--pri)}
.card.sec{border-left:5px solid var(--sec)}
.lead{font-size:16.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.tag.p{background:var(--pri-soft);color:var(--pri)} .tag.s{background:var(--sec-soft);color:var(--sec)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)} .btn.sec{background:var(--sec);color:var(--on);border-color:var(--sec)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.dt td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:340px}
.tw.sm{max-height:none}
.new{animation:pop .6s ease both}
@keyframes pop{from{background:var(--sec-soft);transform:translateY(-4px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;overflow:auto;white-space:pre-wrap;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface2);border:1px solid var(--line2)}
.callout.k{background:var(--sec-soft);border-color:transparent} .callout.i{background:var(--pri-soft);border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on)}
.seg.s button[aria-pressed="true"]{background:var(--sec)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px}
input[type=range]{accent-color:var(--pri);vertical-align:middle}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
.live{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.live .tw{max-height:none}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arrow{font-size:28px;color:var(--sec);text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--surface)}
td.ix{background:var(--bad-soft)} td.iy{background:var(--warn-soft)} td.iz{background:var(--pri-soft)} td.chg{background:var(--good-soft)}
.cardsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.nextrow{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
svg.chart{width:100%;height:auto;display:block;max-height:420px}
svg.chart text{fill:var(--fg);font:12px var(--body)}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .gr{stroke:var(--grid);stroke-width:1}
svg.chart .lbl{fill:var(--muted)}
.sheet{border-collapse:collapse;font-size:13.5px;font-family:var(--mono);width:100%}
.sheet th{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:600;color:var(--muted)}
.sheet td{border:1px solid var(--line);padding:0;min-width:80px}
.sheet td input{width:100%;border:0;background:transparent;padding:4px 7px;font:inherit;border-radius:0}
.sheet td.sel{outline:2px solid var(--pri);outline-offset:-2px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.live{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav ol{display:flex;overflow:auto;gap:4px}.nav li{flex:none}.nav .t{display:none}main{padding:18px 16px 60px}.grid2,.grid3,.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}

</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Lessons">
    <h2 class="brand">Analytics Lab<small>Unit V, Introduction to Business Analytics<br>BBA Sem I, Business Management Tools I</small></h2>
    <ol id="navlist"></ol>
    <div class="tools"><button id="themeBtn" type="button">Theme</button><button id="zoomBtn" type="button">Text size</button><span class="hint">Projector tip: if text is hard to see, switch theme (or press Alt+D) and raise the text size.</span></div>
  </nav>
  <main id="stage" tabindex="-1"></main>
  <aside class="live" aria-label="Live data"><h3>Live data: Sunrise Retail</h3><div id="livebox"></div></aside>
</div>
<script>
"use strict";
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v==="number"?(Number.isInteger(v)?v.toLocaleString("en-US"):v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})):v;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,l=Math.floor(p);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(p-l)};
const mode=a=>{const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx).join(", ")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const groupBy=(rows,f)=>{const g={};rows.forEach(r=>{const k=f(r);(g[k]=g[k]||[]).push(r)});return g};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return a/Math.sqrt(b*c)};
const linfit=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2});const m=a/b;return {m,b:my-m*mx,r:corr(x,y)}};
function table(rows,cols,opts={}){
  const head=cols.map(c=>`<th>${esc(c[1])}</th>`).join("");
  const body=rows.map((r,i)=>`<tr${opts.newFrom!=null&&i>=opts.newFrom?' class="new"':''}>`+cols.map(c=>{
    const v=r[c[0]],cls=(typeof v==="number"?"num":"")+((opts.cellClass&&opts.cellClass(r,c[0],i))||"");
    return `<td class="${cls.trim()}">${v===""||v==null?'<span class="muted">(blank)</span>':esc(typeof v==="number"?fmt(v,c[2]!=null?c[2]:(Number.isInteger(v)?0:2)):v)}</td>`}).join("")+"</tr>").join("");
  return `<div class="tw${opts.small?' sm':''}"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const QUIZ={};
function quiz(id,q,opts,ans,why){QUIZ[id]={ans,why};
  return `<div class="card"><h3>Quick check</h3><p style="margin:0 0 6px"><b>${q}</b></p>`+opts.map((o,i)=>`<button class="opt" type="button" data-q="${id}" data-i="${i}">${o}</button>`).join("")+`<div class="small muted" id="why-${id}" style="margin-top:6px"></div></div>`;}
function regQuiz(id,ans,why){QUIZ[id]={ans,why}}
function seg(id,items,cls=""){return `<div class="seg ${cls}" id="${id}" role="group">`+items.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${i===0}">${x[1]}</button>`).join("")+`</div>`}
function bindSeg(root,id,fn){const g=$("#"+id,root);$$("button",g).forEach(b=>b.onclick=()=>{$$("button",g).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return ()=>$$("[aria-pressed=true]",g)[0].dataset.v}
const IN=n=>n.toLocaleString("en-US",{maximumFractionDigits:0});

/* ===== SVG charts (colours come from CSS variables, so both themes work) ===== */
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const nice=(max)=>{const e=Math.pow(10,Math.floor(Math.log10(max||1))),f=max/e;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*e};
function ticks(lo,hi,n=5){const out=[],st=(hi-lo)/n;for(let i=0;i<=n;i++)out.push(lo+st*i);return out}
const short=v=>Math.abs(v)>=100000?(v/100000).toFixed(1).replace(/\.0$/,"")+"L":Math.abs(v)>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":(Math.round(v*100)/100)+"";
function chartBar(items,o={}){ // items:[{label,value,color}]
  const W=o.w||640,H=o.h||320,m={l:56,r:14,t:o.title?34:16,b:o.rotate?70:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...items.map(i=>i.value))*1.08),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih,bw=iw/items.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"bar chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*.15,w=bw*.7,y=sy(Math.max(it.value,mn));
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(mn)-y)}" fill="${it.color||o.color||"var(--c1)"}" rx="2"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    if(o.values!==false&&items.length<=14)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="font-size:11px">${short(it.value)}</text>`;
    const lx=x+w/2,ly=H-m.b+16;s+=o.rotate?`<text x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-35 ${lx} ${ly})">${esc(it.label)}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(it.label)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return s+"</svg>";}
function chartLine(series,labels,o={}){ // series:[{name,vals,color,dash}]
  const W=o.w||640,H=o.h||320,m={l:56,r:o.legendRight?110:16,t:o.title?34:16,b:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null)),mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...all)*1.08);
  const sx=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"line chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  const step=Math.ceil(labels.length/(o.maxLabels||12));labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="lbl" x="${sx(i)}" y="${H-m.b+16}" text-anchor="middle">${esc(l)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  series.forEach((se,k)=>{const c=se.color||PAL[k%6];let d="";se.vals.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+sx(i).toFixed(1)+" "+sy(v).toFixed(1)});
    if(o.area&&k===0)s+=`<path d="${d}L${sx(se.vals.length-1)} ${sy(mn)}L${sx(0)} ${sy(mn)}Z" fill="${c}" opacity=".18"/>`;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${se.w||2.5}" ${se.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
    if(o.dots!==false&&!se.dash)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${c}"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`});
    if(o.legendRight)s+=`<text x="${W-m.r+8}" y="${m.t+14+k*16}" style="fill:${c};font-weight:600">${esc(se.name)}</text>`;
    else if(series.length>1)s+=`<text x="${m.l+8+k*150}" y="${H-6}" style="fill:${c};font-weight:600">&#9632; ${esc(se.name)}</text>`});
  (o.marks||[]).forEach(mk=>{s+=`<text x="${sx(mk.i)}" y="${sy(mk.v)-10}" text-anchor="middle" style="font-weight:700;fill:${mk.color||"var(--sec)"}">${esc(mk.text)}</text>`});
  return s+"</svg>";}
function chartScatter(pts,o={}){ // pts:[{x,y,r,color,label}]
  const W=o.w||640,H=o.h||340,m={l:60,r:16,t:o.title?34:16,b:46},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=o.x0!=null?o.x0:Math.min(...xs),x1=o.x1!=null?o.x1:Math.max(...xs),y0=o.y0!=null?o.y0:0,y1=o.y1||nice(Math.max(...ys)*1.05);
  const sx=v=>m.l+(v-x0)/(x1-x0||1)*iw,sy=v=>m.t+ih-(v-y0)/(y1-y0)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"scatter chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(y0,y1).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  ticks(x0,x1).forEach(t=>s+=`<text class="lbl" x="${sx(t)}" y="${H-m.b+16}" text-anchor="middle">${short(t)}</text>`);

function chartPie(items,o={}){const W=o.w||420,H=o.h||300,cx=120,cy=H/2,R=100,tot=sum(items.map(i=>i.value));let a=-Math.PI/2,s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="pie chart">`;

function histBins(vals,n,lo,hi){const w=(hi-lo)/n,b=Array(n).fill(0);vals.forEach(v=>{let i=Math.floor((v-lo)/w);if(i>=n)i=n-1;if(i<0)i=0;b[i]++});return b.map((c,i)=>({label:short(lo+i*w),value:c,lo:lo+i*w,hi:lo+(i+1)*w}))}

const L=[];

let cur=0, done=new Set();
const UKEY="dalab_"+(document.title||"x");
try{JSON.parse(localStorage.getItem(UKEY)||"[]").forEach(x=>done.add(x))}catch(e){}
function go(i){
  cur=Math.max(0,Math.min(L.length-1,i));
  const l=L[cur],st=$("#stage");
  st.innerHTML=`<div class="crumb">Lesson ${cur+1} of ${L.length}</div><h1>${l.title}</h1><div class="syl">Syllabus: ${l.syl}</div>`+l.html()+
    `<div class="nextrow"><button class="btn" type="button" id="prevB" ${cur?"":"disabled"}>Previous</button><button class="btn pri" type="button" id="nextB" ${cur<L.length-1?"":"disabled"}>Next lesson</button></div>`;
  $("#prevB").onclick=()=>go(cur-1); $("#nextB").onclick=()=>go(cur+1);
  l.mount&&l.mount(st);
  $$("[data-q]",st).forEach(b=>b.onclick=()=>{
    const id=b.dataset.q,k=QUIZ[id],ok=+b.dataset.i===k.ans;
    $$(`[data-q="${id}"]`,st).forEach(x=>x.classList.remove("ok","no"));
    b.classList.add(ok?"ok":"no");
    $("#why-"+id,st).textContent=(ok?"Correct. ":"Not quite. ")+k.why;
    if(ok){done.add(cur);try{localStorage.setItem(UKEY,JSON.stringify([...done]))}catch(e){}drawNav()}
  });
  drawNav(); window.scrollTo(0,0); st.focus({preventScroll:true});
}
function drawNav(){
  $("#navlist").innerHTML=L.map((l,i)=>`<li class="${done.has(i)?"done":""}${l.hero?" hero":""}"><button type="button" data-go="${i}" ${i===cur?'aria-current="true"':""}><span class="n">${done.has(i)?"&#10003;":i+1}</span><span class="t">${l.nav}</span></button></li>`).join("");
  $$("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
}

const PRODUCTS=[{"Product":"Notebook A5","Category":"Stationery","CostPrice":18,"MRP":40},{"Product":"Gel Pen Pack","Category":"Stationery","CostPrice":12,"MRP":30},{"Product":"Desk Organizer","Category":"Stationery","CostPrice":90,"MRP":180},{"Product":"Wireless Mouse","Category":"Electronics","CostPrice":220,"MRP":450},{"Product":"USB Flash 64GB","Category":"Electronics","CostPrice":260,"MRP":500},{"Product":"Earphones","Category":"Electronics","CostPrice":180,"MRP":399},{"Product":"Backpack","Category":"Accessories","CostPrice":350,"MRP":799},{"Product":"Water Bottle","Category":"Accessories","CostPrice":110,"MRP":249},{"Product":"Laptop Sleeve","Category":"Accessories","CostPrice":240,"MRP":549},{"Product":"Study Lamp","Category":"Home","CostPrice":300,"MRP":699},{"Product":"Wall Clock","Category":"Home","CostPrice":150,"MRP":349},{"Product":"Photo Frame","Category":"Home","CostPrice":80,"MRP":199}];

const MLAB=MONTHS.map(m=>{const [y,mo]=m.split("-");return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+mo-1]+" "+y.slice(2)});
const sumBy=(rows,keyf,valf=r=>r.net)=>{const g={};rows.forEach(r=>{const k=keyf(r);g[k]=(g[k]||0)+valf(r)});return g};
const monthly=(rows=SALES)=>{const g=sumBy(rows,r=>r.month);return MONTHS.map(m=>g[m]||0)};
const REGIONS=["Central","East","North","South","West"],CATS=["Accessories","Electronics","Home","Stationery"];
const sample=(arr,n)=>{const a=arr.slice();for(let i=0;i<n;i++){const j=i+Math.floor(Math.random()*(a.length-i));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)};

function renderLive(){
  const tot=sum(SALES.map(r=>r.net));
  $("#livebox").innerHTML=`<p class="small muted" style="margin:0 0 8px">The Sunrise Retail data (1 Apr 2025 to 31 Mar 2026), already cleaned. Same numbers as your Notion pages.</p><div class="grid2"><div class="kpi"><span class="small muted">Orders</span><b>${SALES.length}</b></div><div class="kpi"><span class="small muted">Net sales</span><b>${fmt(tot)}</b></div></div><div style="height:8px"></div>`+
  table(SALES.slice(0,14),[["order","Order"],["region","Region"],["product","Product"],["units","Units"],["net","Net sales"]],{small:true})+`<p class="small muted">First 14 of ${SALES.length} rows. Net Sales = Units x MRP x (1 - Discount/100).</p>`;
}

/* ===== Unit V: Introduction to Business Analytics ===== */
const TOTAL=sum(SALES.map(x=>x.net)),PROFIT=sum(SALES.map(x=>x.profit)),MN=monthly(),MEANM=mean(MN),SDM=sd(MN);
const byCust=Object.entries(groupBy(SALES,x=>x.cust)).map(([c,rs])=>({cust:c,orders:rs.length,net:sum(rs.map(x=>x.net)),last:Math.max(...rs.map(x=>MONTHS.indexOf(x.month)))}));
/* 1 */
const LEVELS=[["What were total sales last year?","Descriptive"],["Which category earned the most profit?","Descriptive"],["Why did March sales jump?","Diagnostic"],["What will next month's sales be?","Predictive"],["Which customers are likely to stop buying?","Predictive"],["How many of each product should we make with limited hours?","Prescriptive"],["What discount should we offer to keep margin above 50%?","Prescriptive"],["How many orders came from the North?","Descriptive"]];
lesson({nav:"What is business analytics?",title:"Business analytics: definition, role and significance",syl:"Definition, role and significance of business analytics",
html:()=>`<p class="lead"><b>Business analytics</b> is using data, statistics and tools to answer business questions and support decisions. It works on four levels:</p>
<div class="grid2"><div class="card"><span class="tag p">Descriptive</span> <b>What happened?</b><br><span class="small">Totals, averages, charts. Units I, II, IV.</span></div><div class="card"><span class="tag s">Diagnostic</span> <b>Why did it happen?</b><br><span class="small">Drill down, compare groups.</span></div><div class="card"><span class="tag g">Predictive</span> <b>What will happen?</b><br><span class="small">Forecasts, probabilities. Unit III and lesson 5 here.</span></div><div class="card"><span class="tag w">Prescriptive</span> <b>What should we do?</b><br><span class="small">Optimization and simulation. Lessons 6 and 7.</span></div></div>
<div class="card try"><h3>Try it: which level is each question?</h3><div id="lv"></div><p class="small muted" id="lsc"></p></div>
<div class="card"><h3>Why it matters</h3><p class="small">Decisions backed by evidence are easier to defend and usually better than gut feeling alone. On the Sunrise data: total sales <b>${fmt(TOTAL)}</b>, profit <b>${fmt(PROFIT)}</b> (margin <b>${(100*PROFIT/TOTAL).toFixed(2)}%</b>). Those numbers are descriptive. The decisions in this unit go further.</p></div>
${quiz("u5q1","'How many units of each product should we make?' is which kind of analytics?",["Descriptive","Predictive","Prescriptive"],2,"It recommends an action under limits, which is prescriptive.")}`,
mount(r){let s=0,a=0;$("#lv",r).innerHTML=LEVELS.map((q,i)=>`<div class="row" data-i="${i}" style="justify-content:space-between;border-bottom:1px solid var(--line2);padding-bottom:6px"><span style="flex:1;min-width:230px">${q[0]}</span><span>${["Descriptive","Diagnostic","Predictive","Prescriptive"].map(l=>`<button class="btn sm" data-a="${l}">${l}</button>`).join(" ")} <span class="fb small"></span></span></div>`).join("");
  $$("[data-a]",r).forEach(b=>b.onclick=()=>{const row=b.closest("[data-i]");if(row.dataset.d)return;row.dataset.d=1;a++;const t=LEVELS[+row.dataset.i][1],ok=b.dataset.a===t;if(ok)s++;$(".fb",row).innerHTML=ok?'<span class="tag g">Correct</span>':`<span class="tag b">${t}</span>`;$("#lsc",r).textContent=`Score ${s} of ${a}`})}
});
/* 2 */
const PROC=[["1. Define the problem","Turn a vague worry into a question with a number: 'Should we drop Stationery?'","Lesson 3 of this unit"],["2. Collect data","Find or gather the data: sales records, a survey, a database.","Unit I (primary and secondary data)"],["3. Clean and prepare","Fix duplicates, blanks, formats, so the numbers can be trusted. Often 60 to 80 percent of the time.","Unit I (cleaning, joins)"],["4. Analyze","Summaries, pivots, probability, models, forecasts.","Units III, IV and lessons 4 to 7"],["5. Communicate","Charts, dashboards and a clear recommendation.","Unit II"],["6. Act and monitor","Make the decision, track KPIs, and loop back if results differ.","Lesson 8 (KPIs)"]];
lesson({nav:"Process and life cycle",title:"The business analytics process and life cycle",syl:"Business analytics process and life cycle",
html:()=>`<p class="lead">Analytics is a <b>cycle</b>, not a straight line. Results raise new questions and you loop back. Click each step.</p>
<div class="card try"><h3>Try it: walk the cycle with Sunrise Retail</h3><div class="row" id="pst"></div><div class="callout i" id="pbox"></div></div>
<div class="callout k small"><b>Mapping to this course:</b> every unit you studied is one or two steps of this cycle. That is why the order of units makes sense.</div>
${quiz("u5q2","Most of an analyst's time usually goes into...",["Building models","Collecting, cleaning and preparing data","Making charts"],1,"Defining the problem and preparing data take the largest share, which is why Unit I matters.")}`,
mount(r){function d(i){$("#pst",r).innerHTML=PROC.map((p,k)=>`<button class="btn ${k===i?"pri":""}" data-k="${k}" type="button">${p[0].split(".")[0]}</button>`).join("");$("#pbox",r).innerHTML=`<h2>${PROC[i][0]}</h2><p>${PROC[i][1]}</p><p class="small"><b>Where in this course:</b> ${PROC[i][2]}</p>`;$$("[data-k]",r).forEach(b=>b.onclick=()=>d(+b.dataset.k))}d(0)}
});
/* 3 decisions */
const catRows=CATS.map(c=>{const rs=SALES.filter(x=>x.cat===c);const n=sum(rs.map(x=>x.net)),p=sum(rs.map(x=>x.profit));return {cat:c,orders:rs.length,units:sum(rs.map(x=>x.units)),net:n,profit:p,margin:100*p/n}});
lesson({hero:true,nav:"Data-driven decisions",title:"Data-driven decision making: should we drop Stationery?",syl:"Data-driven decision making",
html:()=>`<p class="lead">The owner says: <i>"Stationery sells little. Should we drop it?"</i> A data-driven decision turns the question into numbers, compares the options, and states what the data cannot show.</p>
<div class="card try"><h3>Step 1: the numbers</h3>${table(catRows.map(c=>({...c,margin:+c.margin.toFixed(1)})),[["cat","Category"],["orders","Orders"],["units","Units"],["net","Net sales"],["profit","Profit"],["margin","Margin %",1]],{small:true})}</div>
<div class="card try"><h3>Step 2: test the options</h3>
<div class="row">${seg("dd",[["keep","Keep all four"],["drop","Drop Stationery"]])}</div><div id="ddo"></div></div>
<div class="card try"><h3>Step 3: write the recommendation</h3><p class="small muted">Pick the best statement.</p><div id="rec"></div></div>
<div class="card"><h3>What the data cannot tell us</h3><p class="small">Whether Stationery buyers also buy other items, whether it brings new customers, or whether space and staff time could earn more elsewhere. Name the gap in your recommendation.</p></div>
${quiz("u5q3","A good analytics recommendation includes...",["Only the number","A number, an action and a stated limitation","A long table"],1,"Evidence, a clear action, and honesty about limits.")}`,
mount(r){const st=catRows.find(c=>c.cat==="Stationery");function d(v){const keep=v==="keep",p=keep?PROFIT:PROFIT-st.profit,n=keep?TOTAL:TOTAL-st.net;
    $("#ddo",r).innerHTML=`<div class="grid3"><div class="kpi"><span class="small muted">Net sales</span><b>${fmt(n)}</b></div><div class="kpi"><span class="small muted">Profit</span><b>${fmt(p)}</b></div><div class="kpi"><span class="small muted">Margin</span><b>${(100*p/n).toFixed(2)}%</b></div></div><div class="callout k small">${keep?"Baseline.":`Dropping Stationery loses <b>${fmt(st.profit)}</b> of profit. Margin rises only slightly, because Stationery's margin (${st.margin.toFixed(1)}%) is not far below average.`}</div>`}
  d("keep");bindSeg(r,"dd",d);
  const R=[["Drop it: it is only 4.8% of net sales.",false,"Share of sales is not the same as profit. It still earns "+fmt(st.profit)+"."],["Keep it for now: it earns "+fmt(st.profit)+" profit at "+st.margin.toFixed(1)+"% margin. Check whether its buyers also buy other items before deciding.",true,"Clear number, action and limit."],["Keep it: gut feeling says it is fine.",false,"No evidence in this statement."]];
  $("#rec",r).innerHTML=R.map((x,i)=>`<button class="opt" data-i="${i}" type="button">${x[0]}</button>`).join("")+'<div class="small muted" id="recw"></div>';
  $$("#rec .opt",r).forEach(b=>b.onclick=()=>{const x=R[+b.dataset.i];b.classList.add(x[1]?"ok":"no");$("#recw",r).textContent=x[2]})}
});
/* 4 mining */
lesson({nav:"Data mining basics",title:"Data mining basics: Pareto and RFM",syl:"Key techniques: data mining basics",
html:()=>`<p class="lead"><b>Data mining</b> looks for useful patterns in large data. Two simple techniques you can do in a spreadsheet: <b>Pareto analysis</b> (does a small group give most of the value?) and <b>RFM</b> (<b>R</b>ecency, <b>F</b>requency, <b>M</b>onetary value of each customer).</p>
<div class="card try"><h3>Pareto: customers ranked by net sales</h3><div class="row">Show top <input type="range" id="pk" min="5" max="120" value="24"> <b id="pkv">24</b> of ${byCust.length} customers</div><div id="pc"></div><div class="callout k small" id="pn"></div></div>
<div class="card try"><h3>RFM: who are our best and at-risk customers?</h3><p class="small muted">Each customer gets a score of 1 (low) to 3 (high) on Recency (latest purchase), Frequency (orders) and Monetary (net sales), using terciles.</p><div id="rfm"></div></div>
<div class="card"><h3>Market-basket idea (no data here)</h3><p class="small">'Customers who bought a Laptop Sleeve also bought a Backpack' is found by counting pairs of items in the same bill. Groups that go together can be bundled. Our dataset has one product per order, so we cannot do it here, but the method is the same counting.</p></div>
${quiz("u5q4","In RFM, a customer who bought recently, often and spent a lot is called...",["At risk","A champion","Lost"],1,"High on all three scores: your best customers.")}`,
mount(r){const S=byCust.slice().sort((a,b)=>b.net-a.net),cum=[];let c=0;S.forEach(x=>{c+=x.net;cum.push(c)});
  function d(){const k=+$("#pk",r).value;$("#pkv",r).textContent=k;const it=S.slice(0,k).map((x,i)=>({label:i<12?x.cust:"",value:Math.round(x.net),color:"var(--c1)"}));
    $("#pc",r).innerHTML=chartBar(it,{w:640,h:260,title:"Net sales by customer (top "+k+")",values:false});$("#pn",r).innerHTML=`The top <b>${k}</b> customers (${(100*k/S.length).toFixed(0)}%) give <b>${(100*cum[k-1]/TOTAL).toFixed(1)}%</b> of sales. ${k===24?"For 20 percent of customers the share is 33.9 percent: flatter than the usual 80/20 rule. A finding in itself.":""}`}
  $("#pk",r).oninput=d;d();
  const tert=(arr,f)=>{const v=arr.map(f).sort((a,b)=>a-b);return [v[Math.floor(v.length/3)],v[Math.floor(2*v.length/3)]]};
  const tr=tert(byCust,x=>x.last),tf=tert(byCust,x=>x.orders),tm=tert(byCust,x=>x.net),sc=(v,t)=>v<=t[0]?1:v<=t[1]?2:3;
  const seg=x=>{const R=sc(x.last,tr),F=sc(x.orders,tf),M=sc(x.net,tm);x.R=R;x.F=F;x.M=M;return R===3&&F===3&&M===3?"Champions":R===1&&(F>=2||M>=2)?"At risk (valuable but quiet)":R===3&&F===1?"New or occasional":F===3||M===3?"Loyal / big spenders":"Others"};
  const g=groupBy(byCust,seg),order=["Champions","Loyal / big spenders","New or occasional","At risk (valuable but quiet)","Others"];
  $("#rfm",r).innerHTML=table(order.filter(k=>g[k]).map(k=>({seg:k,n:g[k].length,net:sum(g[k].map(x=>x.net)),avg:mean(g[k].map(x=>x.net))})),[["seg","Segment"],["n","Customers"],["net","Net sales"],["avg","Avg per customer"]],{small:true})+`<p class="small muted">Action idea: send the 'At risk' group an offer; thank the 'Champions'. Tercile cut-offs depend on the data, so another year gives different groups.</p>`;}
});
/* 5 forecasting */
const FM={naive:["Naive: next = last month",(h,i)=>h[i-1]],ma3:["3-month moving average",(h,i)=>mean(h.slice(i-3,i))],msf:["Mean so far",(h,i)=>mean(h.slice(0,i))],lin:["Linear trend (FORECAST)",(h,i)=>{const xs=Array.from({length:i},(_,k)=>k+1),f=linfit(xs,h.slice(0,i));return f.m*(i+1)+f.b}]};
lesson({hero:true,nav:"Forecasting models",title:"Forecasting models and back-testing",syl:"Key techniques: forecasting models",
html:()=>`<p class="lead">A <b>forecast</b> predicts the next value from past ones. Which method is best? Do not guess: <b>back-test</b>. Pretend you do not know the last 9 months, predict each, and measure the average error (MAE).</p>
<div class="card try"><h3>Try it: compare methods</h3><div class="row">${seg("fm",Object.entries(FM).map(([k,v])=>[k,v[0]]))}</div><div id="fo"></div><div class="callout k small" id="fn"></div></div>
<div class="card"><h3>In a spreadsheet</h3><div class="code">Naive:      =B13\n3-month avg: =AVERAGE(B11:B13)\nTrend:      =FORECAST(13, B2:B13, A2:A13)      (A = month numbers 1 to 12)\nError (MAE): =AVERAGE(ABS range of errors)  or  =SUMPRODUCT(ABS(B5:B13-C5:C13))/9</div></div>
${quiz("u5q5","Monthly sales have R-squared 0.0085 against time. Which forecast is sensible?",["A steep upward trend line","The long-run average","Last month's spike (March) repeated"],1,"With no real trend, the average is the safest guide. A spike should not be projected forward.")}`,
mount(r){function d(k){const f=FM[k][1],pred=MN.map((_,i)=>i>=3?f(MN,i):null),errs=pred.map((p,i)=>p==null?null:Math.abs(MN[i]-p)).filter(x=>x!=null),mae=mean(errs),nxt=f([...MN],MN.length);
    $("#fo",r).innerHTML=chartLine([{name:"Actual",vals:MN,color:"var(--c1)"},{name:FM[k][0],vals:pred,color:"var(--c2)",dash:true}],MLAB,{w:640,h:280,min:0,maxLabels:12});
    const all=Object.entries(FM).map(([kk,v])=>[v[0],mean(MN.map((_,i)=>i>=3?Math.abs(MN[i]-v[1](MN,i)):null).filter(x=>x!=null))]);
    $("#fn",r).innerHTML=`Back-test average error for this method: <b>${fmt(mae,0)}</b>. Forecast for next month (Apr 26): <b>${fmt(nxt)}</b>.<br>All methods: `+all.map(a=>`${a[0]}: <b>${fmt(a[1],0)}</b>`).join("; ")+`.<br>Ranked, lowest error first: `+all.slice().sort((a,b)=>a[1]-b[1]).map(a=>a[0].split(":")[0].split(" (")[0]).join(", ")+`. The simplest averaging methods beat the clever ones because the data has no trend.`}
  d("naive");bindSeg(r,"fm",d);}
});
/* 6 optimization */
function solve(A,P,mx=120){let best={p:-1};for(let b=0;b<=200;b++)for(let l=0;l<=220;l++){const m=Math.min(mx,Math.floor(A-2*b-1.5*l),Math.floor(2*(P-b-l)));if(m<0)continue;const p=449*b+399*l+230*m;if(p>best.p)best={b,l,m,p}}return best}
lesson({hero:true,nav:"Optimization (Solver)",title:"Optimization: the product-mix problem",syl:"Key techniques: optimization",
html:()=>`<p class="lead"><b>Optimization</b> finds the best choice under limits. Three parts: <b>decision variables</b> (what you choose), an <b>objective</b> (what to maximise) and <b>constraints</b> (the limits). A workshop makes three products:</p>
<div class="card"><table class="dt"><thead><tr><th></th><th>Backpack</th><th>Study Lamp</th><th>Wireless Mouse</th><th>Limit</th></tr></thead><tbody><tr><td>Profit per unit (Rs)</td><td>449</td><td>399</td><td>230</td><td>maximise</td></tr><tr><td>Assembly hours per unit</td><td>2</td><td>1.5</td><td>1</td><td>at most <b id="aL">400</b></td></tr><tr><td>Packing hours per unit</td><td>1</td><td>1</td><td>0.5</td><td>at most <b id="pL">220</b></td></tr><tr><td>Mouse demand</td><td></td><td></td><td></td><td>at most 120</td></tr></tbody></table></div>
<div class="card try"><h3>Try it by hand, then let the computer search</h3>
<div class="grid3"><label>Backpacks <input type="range" id="ob" min="0" max="200" value="50"> <b id="obv">50</b></label><label>Study Lamps <input type="range" id="ol" min="0" max="200" value="50"> <b id="olv">50</b></label><label>Mice <input type="range" id="om" min="0" max="140" value="50"> <b id="omv">50</b></label></div>
<div id="oo"></div><div class="row"><button class="btn pri" id="ofind" type="button">Find the best plan (Solver)</button> ${seg("os",[["400|220","400 assembly, 220 packing hours"],["410|220","410 assembly hours"],["400|230","230 packing hours"]],"s")}</div><div id="of" class="callout k"></div></div>
<div class="card"><h3>Solver in your tool</h3><p class="small"><b>Google Sheets:</b> Extensions, Add-ons, search Solver, install. <b>Excel:</b> Data, Solver (enable the add-in first). <b>LibreOffice:</b> Tools, Solver. Set the objective (profit cell) to Max, variable cells = the three quantities, add the three constraints, and Solve. Expect <b>Backpack 80, Study Lamp 80, Wireless Mouse 120, profit 95,440</b>.</p></div>
${quiz("u5q6","If one more packing hour raises best profit by Rs 249, that number is called the...",["Shadow price","Margin","Break-even"],0,"The shadow price is the value of relaxing a constraint by one unit.")}`,
mount(r){let A=400,P=220;
  function hand(){const b=+$("#ob",r).value,l=+$("#ol",r).value,m=+$("#om",r).value;$("#obv",r).textContent=b;$("#olv",r).textContent=l;$("#omv",r).textContent=m;
    const as=2*b+1.5*l+m,pk=b+l+.5*m,ok=as<=A&&pk<=P&&m<=120,pr=449*b+399*l+230*m;
    $("#oo",r).innerHTML=`<div class="grid3"><div class="kpi"><span class="small muted">Assembly hours used / ${A}</span><b style="color:${as<=A?"var(--good)":"var(--bad)"}">${as}</b></div><div class="kpi"><span class="small muted">Packing hours used / ${P}</span><b style="color:${pk<=P?"var(--good)":"var(--bad)"}">${pk}</b></div><div class="kpi"><span class="small muted">Profit</span><b>${fmt(pr)}</b></div></div><p class="small">${ok?'<span class="tag g">Feasible</span> Can you beat it? Try 80, 80, 120.':'<span class="tag b">Not feasible</span> A limit is broken.'}</p>`}
  ["ob","ol","om"].forEach(i=>$("#"+i,r).oninput=hand);hand();
  function find(){const s=solve(A,P);$("#of",r).innerHTML=`Best plan: <b>${s.b} Backpacks, ${s.l} Study Lamps, ${s.m} Mice</b> &rarr; profit <b>${fmt(s.p)}</b> ${A===400&&P===220?"":`(base case 95,440, so the extra hours add ${fmt(s.p-95440)}, about Rs ${fmt((s.p-95440)/10)} per hour).`}`;$("#ob",r).value=s.b;$("#ol",r).value=s.l;$("#om",r).value=s.m;hand()}
  $("#ofind",r).onclick=find;bindSeg(r,"os",v=>{[A,P]=v.split("|").map(Number);$("#aL",r).textContent=A;$("#pL",r).textContent=P;hand();find()});find();}
});
/* 7 simulation */
lesson({nav:"Simulation",title:"Simulation: what range of outcomes is possible?",syl:"Key techniques: simulation (Monte Carlo)",
html:()=>`<p class="lead"><b>Simulation</b> repeats a random process thousands of times to see the <b>range</b> of outcomes. Optimization gives one best answer; simulation shows the risk around it. Here: next month's sales ~ Normal(mean ${fmt(MEANM,0)}, SD ${fmt(SDM,0)}), the figures from our 12 months.</p>
<div class="card try"><h3>Try it: probability of making a loss</h3><div class="row">Fixed cost per month (invented): Rs <input type="range" id="fc" min="20000" max="50000" step="1000" value="30000"> <b id="fcv">30,000</b> &nbsp; Runs: <select id="sr"><option>200</option><option selected>1000</option><option>5000</option></select> <button class="btn pri" id="sgo" type="button">Simulate</button></div>
<div id="so"></div><div class="callout k small" id="sn"></div></div>
<div class="code">In a sheet:  =NORMINV(RAND(), 62685, 18392)   fill down 1000 rows\n             =PERCENTILE(range, 0.05)  and  =COUNTIF(range, "&lt;"&amp;break_even)/1000\nBreak-even sales = fixed cost / margin (${(100*PROFIT/TOTAL).toFixed(2)}%)</div>
${quiz("u5q7","A simulation gives the 5th percentile of next month's sales as Rs 33,000. This means...",["Sales will be exactly 33,000","In 5 percent of runs sales were at or below 33,000","Sales cannot exceed 33,000"],1,"A percentile marks a position in the simulated range, not a prediction of the single outcome.")}`,
mount(r){const margin=PROFIT/TOTAL;const gn=()=>{let u=0,v=0;while(!u)u=Math.random();v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
  $("#fc",r).oninput=()=>$("#fcv",r).textContent=(+$("#fc",r).value).toLocaleString();
  function go(){const n=+$("#sr",r).value,fcost=+$("#fc",r).value,be=fcost/margin,v=Array.from({length:n},()=>Math.max(0,MEANM+SDM*gn()));
    $("#so",r).innerHTML=chartBar(histBins(v,20,0,130000),{w:640,h:260,title:n+" simulated months",values:false});
    const below=v.filter(x=>x<be).length/n;$("#sn",r).innerHTML=`Break-even sales = ${fmt(fcost)} / ${margin.toFixed(4)} = <b>${fmt(be)}</b>. P(loss month) &approx; <b>${(100*below).toFixed(1)}%</b>. 5th to 95th percentile of sales: <b>${fmt(quant(v,.05),0)}</b> to <b>${fmt(quant(v,.95),0)}</b>. In the actual data, 5 of 12 months were below 57,204 when fixed cost is 30,000.`}
  $("#sgo",r).onclick=go;go();}
});
/* 8 KPIs */
const KP=[["Net sales",TOTAL,"Sales head",750000,"higher"],["Profit margin %",100*PROFIT/TOTAL,"Finance",50,"higher"],["Average order value",TOTAL/SALES.length,"Sales head",750,"higher"],["Average rating",mean(SALES.filter(x=>x.rating!=null).map(x=>x.rating)),"Service lead",4,"higher"],["Discount given %",100*(1-TOTAL/sum(SALES.map(x=>x.units*x.mrp))),"Marketing",5,"lower"],["Cash share %",100*SALES.filter(x=>x.pay==="Cash").length/SALES.length,"Finance",20,"lower"]];
lesson({nav:"KPIs and metrics",title:"KPIs and metrics",syl:"Key performance indicators (KPIs) and metrics",
html:()=>`<p class="lead">A <b>metric</b> is any measurement. A <b>KPI</b> (Key Performance Indicator) is a metric tied to a goal, with a <b>target</b>, an <b>owner</b> and a review rhythm. "A number without a target and an owner is only a metric."</p>
<div class="card try"><h3>Try it: set targets and read the lights</h3><p class="small muted">Change a target and watch the status change. Green = target met.</p><div id="kp"></div></div>
<div class="card"><h3>SMART check</h3><span class="pill"><b>S</b>pecific</span><span class="pill"><b>M</b>easurable</span><span class="pill"><b>A</b>chievable</span><span class="pill"><b>R</b>elevant</span><span class="pill"><b>T</b>ime-bound</span></div>
<div class="code">Gross sales  =SUMPRODUCT(F2:F989,G2:G989)\nDiscount %   =(gross - SUM(M2:M989))/gross     (here 5.17%)</div>
${quiz("u5q8","Which is a better KPI?",["Number of charts made","Profit margin against a 50% target, owned by Finance, reviewed monthly","Total rows in the sheet"],1,"It has a measure, a target, an owner and a review rhythm.")}`,
mount(r){const tg=KP.map(k=>k[3]);function d(){$("#kp",r).innerHTML=`<table class="dt"><thead><tr><th>KPI</th><th>Value</th><th>Target</th><th>Owner</th><th>Status</th></tr></thead><tbody>`+KP.map((k,i)=>{const ok=k[4]==="higher"?k[1]>=tg[i]:k[1]<=tg[i];return `<tr><td>${k[0]}</td><td class="num"><b>${fmt(k[1])}</b></td><td><input type="number" data-t="${i}" value="${tg[i]}" style="width:100px"> <span class="small muted">${k[4]==="higher"?"or more":"or less"}</span></td><td>${k[2]}</td><td>${ok?'<span class="tag g">On target</span>':'<span class="tag b">Off target</span>'}</td></tr>`}).join("")+`</tbody></table>`;
    $$("[data-t]",r).forEach(i=>i.onchange=()=>{tg[+i.dataset.t]=+i.value;d()})}d();}
});
/* 9 marketing and finance */
lesson({nav:"Marketing and finance",title:"Business analytics in marketing and finance",syl:"Business analytics applications: marketing and finance",
html:()=>`<p class="lead"><b>Marketing:</b> who buys, and does discounting pay? <b>Finance:</b> margin, break-even, and cost of incentives. Same tools, different questions.</p>
<div class="card try"><h3>Marketing: segments</h3><div id="mseg"></div></div>
<div class="card try"><h3>Marketing: does discounting pay?</h3><div id="mdisc"></div><div class="callout k small" id="mdn"></div></div>
<div class="card try"><h3>Finance: break-even (invented fixed cost)</h3><div class="row">Fixed cost per month Rs <input type="range" id="bf" min="20000" max="50000" step="1000" value="30000"> <b id="bfv"></b></div><div id="bfo"></div></div>
<div class="card try"><h3>Finance: commission cost by region</h3><div class="row">${seg("cm",[["rule","Rule: 5% if North or order >= 1500, else 2%"],["flat","Flat 2% for everyone"]])}</div><div id="cmo"></div></div>
${quiz("u5q9","Margin falls as discount rises (54.9% at 0%, 47.3% at 15%). To justify a 15% discount you need...",["More volume to make up the lost margin","Nothing, discounts always pay","Fewer customers"],0,"Each sale earns less, so you must sell enough extra units. The data here does not show that extra volume.")}`,
mount(r){const g=groupBy(SALES,x=>x.seg);$("#mseg",r).innerHTML=table(Object.entries(g).map(([k,rs])=>({seg:k,orders:rs.length,net:sum(rs.map(x=>x.net)),avg:mean(rs.map(x=>x.net))})),[["seg","Segment"],["orders","Orders"],["net","Net sales"],["avg","Average order"]],{small:true});
  const gd=groupBy(SALES,x=>x.disc),dk=Object.keys(gd).map(Number).sort((a,b)=>a-b),mg=dk.map(k=>100*sum(gd[k].map(x=>x.profit))/sum(gd[k].map(x=>x.net)));
  $("#mdisc",r).innerHTML=chartBar(dk.map((k,i)=>({label:k+"% off",value:+mg[i].toFixed(2),color:"var(--c2)"})),{w:520,h:240,title:"Profit margin % by discount level",min:40,max:60});$("#mdn",r).innerHTML=`Margin: ${dk.map((k,i)=>k+"% = "+mg[i].toFixed(2)+"%").join(", ")}. (Axis starts at 40 on purpose to show a small range; say so when you present.)`;
  const margin=PROFIT/TOTAL;function be(){const f=+$("#bf",r).value;$("#bfv",r).textContent=f.toLocaleString();const b=f/margin,below=MN.filter(x=>x<b).length;$("#bfo",r).innerHTML=chartLine([{name:"Monthly net sales",vals:MN,color:"var(--c1)"},{name:"Break-even",vals:MN.map(()=>b),color:"var(--bad)",dash:true}],MLAB,{w:640,h:250,min:0,maxLabels:12})+`<p class="small">Break-even sales = ${fmt(f)} / ${margin.toFixed(4)} = <b>${fmt(b)}</b>. <b>${below} of 12</b> months fall below it.</p>`}
  $("#bf",r).oninput=be;be();
  function cm(v){const o=REGIONS.map(g=>{const rs=SALES.filter(x=>x.region===g),c=sum(rs.map(x=>(v==="flat"?.02:(g==="North"||x.net>=1500)?.05:.02)*x.net)),n=sum(rs.map(x=>x.net));return {region:g,comm:Math.round(c*100)/100,rate:+(100*c/n).toFixed(2)}});
    $("#cmo",r).innerHTML=table(o,[["region","Region"],["comm","Commission (Rs)"],["rate","Effective rate %"]],{small:true})+`<p class="small">Total: <b>${fmt(sum(o.map(x=>x.comm)))}</b> ${v==="rule"?"(27,364.35 as in Unit IV)":""}</p>`}
  cm("rule");bindSeg(r,"cm",cm);}
});
/* 10 operations and HR */
lesson({nav:"Operations and HR",title:"Business analytics in operations and HR",syl:"Business analytics applications: operations and human resources",
html:()=>`<p class="lead"><b>Operations:</b> workload, capacity, efficiency. <b>HR analytics:</b> attrition, performance, hiring. The same tables and ratios apply.</p>
<div class="card try"><h3>Operations: salesperson workload and results</h3><div class="row">${seg("sp",[["net","Net sales"],["orders","Orders"],["avg","Average order"]])}</div><div id="spo"></div><div class="callout k small">Workload is fairly even (90 to 107 orders) but sales per person vary by about 50 percent. The difference comes from the average order size, not the number of orders.</div></div>
<div class="card try"><h3>HR: attrition rate (invented practice data)</h3><p class="small muted">Attrition rate = exits / average headcount. Edit the numbers.</p><div id="hr"></div></div>
${quiz("u5q10","Department A: start 40, end 38, exits 4. What is the attrition rate?",["10.3%","10.0%","4%"],0,"Average headcount = (40+38)/2 = 39. 4/39 = 10.3%.")}`,
mount(r){const sp=Object.entries(groupBy(SALES,x=>x.sp)).map(([k,rs])=>({k,net:sum(rs.map(x=>x.net)),orders:rs.length,avg:mean(rs.map(x=>x.net))}));
  function d(v){const s=sp.slice().sort((a,b)=>b[v]-a[v]);$("#spo",r).innerHTML=chartBar(s.map(x=>({label:x.k.split(" ")[0],value:Math.round(x[v]),color:"var(--c1)"})),{w:640,h:260,rotate:true,title:"By salesperson"})}d("net");bindSeg(r,"sp",d);
  const H=[["Sales",40,38,4],["Operations",25,24,3],["IT",20,22,2],["HR",10,10,1]];
  function hr(){$("#hr",r).innerHTML=`<table class="dt"><thead><tr><th>Department</th><th>Start</th><th>End</th><th>Exits</th><th>Attrition %</th></tr></thead><tbody>`+H.map((h,i)=>`<tr><td>${h[0]}</td>${[1,2,3].map(k=>`<td><input type="number" data-h="${i}-${k}" value="${h[k]}" style="width:70px"></td>`).join("")}<td><b>${(100*h[3]/((h[1]+h[2])/2)).toFixed(1)}%</b></td></tr>`).join("")+`</tbody></table><p class="small">Formula: <code>=D2/AVERAGE(B2:C2)</code></p>`;
    $$("[data-h]",r).forEach(i=>i.onchange=()=>{const [a,b]=i.dataset.h.split("-").map(Number);H[a][b]=+i.value;hr()})}hr();}
});
/* 11 case studies and challenges */
lesson({nav:"Case studies and challenges",title:"Case studies, success stories and challenges",syl:"Case studies and success stories, challenges (data privacy, quality, organizational adoption)",
html:()=>`<p class="lead">Real examples show these ideas at scale. <b>Verify the facts and figures yourself from a reliable source before class</b>: numbers in popular articles change and differ by source.</p>
<div class="grid3"><div class="card"><span class="tag g">Optimization</span><h2>UPS routing</h2><p class="small">UPS built route-optimisation software (ORION) to plan delivery routes. It has reported large savings in miles and fuel, and the work was recognised by the INFORMS Edelman Award. Links to: lesson 6.</p></div>
<div class="card"><span class="tag p">Data mining</span><h2>Netflix recommendations</h2><p class="small">Netflix uses viewing patterns to recommend titles. Its researchers have described large business value from keeping subscribers. Links to: lesson 4.</p></div>
<div class="card"><span class="tag b">Ethics</span><h2>Target and pregnancy prediction</h2><p class="small">A 2012 news story described a retailer predicting life events from purchases, raising privacy concerns. Links to: lesson 12.</p></div></div>
<div class="card try"><h3>Challenge 1: data quality scorecard</h3><p class="small muted">The raw Sunrise file, after removing 15 exact duplicates (1,000 rows), still contained:</p>
${table([{p:"Blank Units",n:12},{p:"'N/A' ratings",n:6},{p:"Dates stored as text",n:20},{p:"Region cells with spacing or case problems",n:268},{p:"Salesperson cells with case problems",n:86}],[["p","Problem"],["n","Count"]],{small:true})}<p class="small">That is how much work step 3 of the cycle can be.</p></div>
<div class="card try"><h3>Challenge 2: privacy and adoption</h3><div id="ch"></div></div>

const SKL=["Spreadsheets (Excel / Sheets)","Statistics","Data visualization (Power BI)","SQL","Python basics","Business knowledge","Communication and storytelling","Ethics and privacy"];
lesson({nav:"Future, ethics and skills",title:"Future trends, ethics and the skills of an analyst",syl:"Future trends (AI, machine learning, automation), ethics (bias, transparency, accountability), skills of a business analyst",
html:()=>`<p class="lead"><b>Trends:</b> <b>AI and machine learning</b> (computers learn patterns from data), <b>automation</b> (repeat tasks run themselves, like your formulas and scripts), and natural-language tools that answer questions about data. <b>Ethics:</b> <b>bias</b> (unfair treatment), <b>transparency</b> (people can see how a result was produced), <b>accountability</b> (someone owns the outcome).</p>
<div class="card try"><h3>Ethics lab: is the commission rule fair?</h3><p class="small muted">Rule: 5% if the region is North or the order is Rs 1,500 or more; otherwise 2%. Compare what each region effectively earns.</p><div id="eo"></div><div class="callout k small" id="en"></div>
<div class="row"><label class="chk"><input type="checkbox" data-e="0"> The rule is written down and staff can read it (transparency)</label><label class="chk"><input type="checkbox" data-e="1"> Someone is named as owner of the rule (accountability)</label><label class="chk"><input type="checkbox" data-e="2"> There is a business reason for treating North differently (no hidden bias)</label></div><p class="small" id="ee"></p></div>
<div class="card try"><h3>Skills self-assessment</h3><p class="small muted">Rate yourself 1 to 5. The two lowest are your next learning goals.</p><div id="sk"></div><div class="callout i small" id="skn"></div></div>
${quiz("u5q12","An automated rule treats groups differently and nobody can explain why. Which principle is broken?",["Transparency and accountability","Speed","Accuracy of arithmetic"],0,"People affected must be able to see and question how decisions are made, and someone must own the result.")}`,
mount(r){const eff=REGIONS.map(g=>{const rs=SALES.filter(x=>x.region===g),n=sum(rs.map(x=>x.net)),c=sum(rs.map(x=>((g==="North"||x.net>=1500)?.05:.02)*x.net));return {label:g,value:+(100*c/n).toFixed(2),color:g==="North"?"var(--c2)":"var(--c1)"}});
  $("#eo",r).innerHTML=chartBar(eff,{w:520,h:240,title:"Effective commission rate % by region",values:true,max:6});$("#en",r).innerHTML=`North earns <b>5.00%</b> on every order. Others earn <b>${Math.min(...eff.filter(x=>x.label!=="North").map(x=>x.value))}% to ${Math.max(...eff.filter(x=>x.label!=="North").map(x=>x.value))}%</b>. A flat 2% rule would cost North 3,168 instead of 7,921.`;
  const ch=[0,0,0];$$("[data-e]",r).forEach(c=>c.onchange=()=>{ch[+c.dataset.e]=c.checked?1:0;const n=sum(ch);$("#ee",r).textContent=n===3?"All three satisfied: the rule is defensible.":"Missing: "+["transparency","accountability","a business reason"].filter((_,i)=>!ch[i]).join(", ")+"."});
  const v=SKL.map(()=>3);function sk(){$("#sk",r).innerHTML=SKL.map((s,i)=>`<div class="row" style="margin:4px 0"><span style="min-width:240px">${s}</span><input type="range" min="1" max="5" value="${v[i]}" data-s="${i}"><b>${v[i]}</b></div>`).join("");
    const low=SKL.map((s,i)=>[s,v[i]]).sort((a,b)=>a[1]-b[1]).slice(0,2);$("#skn",r).innerHTML="Focus next on: <b>"+low.map(x=>x[0]).join("</b> and <b>")+"</b>.";
    $$("[data-s]",r).forEach(i=>i.onchange=()=>{v[+i.dataset.s]=+i.value;sk()})}sk();}
});
