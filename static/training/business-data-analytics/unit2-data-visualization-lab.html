<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Visualization Lab - Unit II</title>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#EFEBE1; --fg:#12110E; --muted:#44403A; --line:#B9B2A2; --line2:#D9D3C4;
  --pri:#1F3FB5; --pri-soft:#DDE5FA; --sec:#9A4208; --sec-soft:#FBE3CC;
  --good:#0F6A31; --good-soft:#D5F0DD; --warn:#744500; --warn-soft:#F9E8B8; --bad:#A31D12; --bad-soft:#FADAD5;
  --code:#EFEBE1; --on:#FFFFFF; --grid:#CFC9BA; --shadow:0 1px 2px rgba(18,17,14,.08),0 6px 18px rgba(18,17,14,.06);
  --c1:#1F3FB5; --c2:#9A4208; --c3:#0F6A31; --c4:#7A2A9C; --c5:#8A6D00; --c6:#B0235C;
  --disp:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --zoom:1;
}
:root[data-theme="dark"]{
  --bg:#0C0C0A; --surface:#181714; --surface2:#242320; --fg:#F7F4EA; --muted:#CFCABD; --line:#5B574B; --line2:#35332C;
  --pri:#9DB1FF; --pri-soft:#1B2350; --sec:#FFAE6B; --sec-soft:#40240E;
  --good:#6FE09A; --good-soft:#0F3320; --warn:#F5C964; --warn-soft:#3B2E0A; --bad:#FF9A8C; --bad-soft:#451A15;
  --code:#1F1E1A; --on:#0C0C0A; --grid:#46433A; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  --c1:#9DB1FF; --c2:#FFAE6B; --c3:#6FE09A; --c4:#D9A0FF; --c5:#F0D060; --c6:#FF8FB8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);zoom:var(--zoom)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;min-height:calc(100vh / var(--zoom))}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.brand{font-family:var(--disp);font-size:20px;line-height:1.15;margin:0 4px 4px}
.brand small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:4px}
.nav ol{list-style:none;margin:16px 0 0;padding:0}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.nav li button:hover{background:var(--surface2)}
.nav li button[aria-current="true"]{background:var(--pri-soft);font-weight:600}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.nav li.done .n{background:var(--good);color:var(--on);border-color:var(--good)}
.nav .t{font-size:13.5px;line-height:1.3}
.nav .hero .n{border-color:var(--sec);color:var(--sec)}
.tools{margin:18px 4px 0;display:grid;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;text-align:left}
.tools button:hover{border-color:var(--fg)}
.tools .hint{font-size:12px;color:var(--muted)}
main{padding:26px 30px 70px;min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px}
h2{font-family:var(--disp);font-size:20px;margin:0 0 8px}
h3{font-size:13.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.syl{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card.try{border-left:5px solid var(--pri)}
.card.sec{border-left:5px solid var(--sec)}
.lead{font-size:16.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.tag.p{background:var(--pri-soft);color:var(--pri)} .tag.s{background:var(--sec-soft);color:var(--sec)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)} .btn.sec{background:var(--sec);color:var(--on);border-color:var(--sec)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.dt td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:340px}
.tw.sm{max-height:none}
.new{animation:pop .6s ease both}
@keyframes pop{from{background:var(--sec-soft);transform:translateY(-4px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;overflow:auto;white-space:pre-wrap;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface2);border:1px solid var(--line2)}
.callout.k{background:var(--sec-soft);border-color:transparent} .callout.i{background:var(--pri-soft);border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on)}
.seg.s button[aria-pressed="true"]{background:var(--sec)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px}
input[type=range]{accent-color:var(--pri);vertical-align:middle}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
.live{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.live .tw{max-height:none}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arrow{font-size:28px;color:var(--sec);text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--surface)}
td.ix{background:var(--bad-soft)} td.iy{background:var(--warn-soft)} td.iz{background:var(--pri-soft)} td.chg{background:var(--good-soft)}
.cardsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.nextrow{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
svg.chart{width:100%;height:auto;display:block;max-height:420px}
svg.chart text{fill:var(--fg);font:12px var(--body)}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .gr{stroke:var(--grid);stroke-width:1}
svg.chart .lbl{fill:var(--muted)}
.sheet{border-collapse:collapse;font-size:13.5px;font-family:var(--mono);width:100%}
.sheet th{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:600;color:var(--muted)}
.sheet td{border:1px solid var(--line);padding:0;min-width:80px}
.sheet td input{width:100%;border:0;background:transparent;padding:4px 7px;font:inherit;border-radius:0}
.sheet td.sel{outline:2px solid var(--pri);outline-offset:-2px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.live{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav ol{display:flex;overflow:auto;gap:4px}.nav li{flex:none}.nav .t{display:none}main{padding:18px 16px 60px}.grid2,.grid3,.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}

</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Lessons">
    <h2 class="brand">Visualization Lab<small>Unit II, Data Visualization<br>BBA Sem I, Business Management Tools I</small></h2>
    <ol id="navlist"></ol>
    <div class="tools"><button id="themeBtn" type="button">Theme</button><button id="zoomBtn" type="button">Text size</button><span class="hint">Projector tip: if text is hard to see, switch theme (or press Alt+D) and raise the text size.</span></div>
  </nav>
  <main id="stage" tabindex="-1"></main>
  <aside class="live" aria-label="Live data"><h3>Live data: Sunrise Retail</h3><div id="livebox"></div></aside>
</div>
<script>
"use strict";
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v==="number"?(Number.isInteger(v)?v.toLocaleString("en-US"):v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})):v;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,l=Math.floor(p);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(p-l)};
const mode=a=>{const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx).join(", ")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const groupBy=(rows,f)=>{const g={};rows.forEach(r=>{const k=f(r);(g[k]=g[k]||[]).push(r)});return g};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return a/Math.sqrt(b*c)};
const linfit=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2});const m=a/b;return {m,b:my-m*mx,r:corr(x,y)}};
function table(rows,cols,opts={}){
  const head=cols.map(c=>`<th>${esc(c[1])}</th>`).join("");
  const body=rows.map((r,i)=>`<tr${opts.newFrom!=null&&i>=opts.newFrom?' class="new"':''}>`+cols.map(c=>{
    const v=r[c[0]],cls=(typeof v==="number"?"num":"")+((opts.cellClass&&opts.cellClass(r,c[0],i))||"");
    return `<td class="${cls.trim()}">${v===""||v==null?'<span class="muted">(blank)</span>':esc(typeof v==="number"?fmt(v,c[2]!=null?c[2]:(Number.isInteger(v)?0:2)):v)}</td>`}).join("")+"</tr>").join("");
  return `<div class="tw${opts.small?' sm':''}"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const QUIZ={};
function quiz(id,q,opts,ans,why){QUIZ[id]={ans,why};
  return `<div class="card"><h3>Quick check</h3><p style="margin:0 0 6px"><b>${q}</b></p>`+opts.map((o,i)=>`<button class="opt" type="button" data-q="${id}" data-i="${i}">${o}</button>`).join("")+`<div class="small muted" id="why-${id}" style="margin-top:6px"></div></div>`;}
function regQuiz(id,ans,why){QUIZ[id]={ans,why}}
function seg(id,items,cls=""){return `<div class="seg ${cls}" id="${id}" role="group">`+items.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${i===0}">${x[1]}</button>`).join("")+`</div>`}
function bindSeg(root,id,fn){const g=$("#"+id,root);$$("button",g).forEach(b=>b.onclick=()=>{$$("button",g).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return ()=>$$("[aria-pressed=true]",g)[0].dataset.v}
const IN=n=>n.toLocaleString("en-US",{maximumFractionDigits:0});

/* ===== SVG charts (colours come from CSS variables, so both themes work) ===== */
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const nice=(max)=>{const e=Math.pow(10,Math.floor(Math.log10(max||1))),f=max/e;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*e};
function ticks(lo,hi,n=5){const out=[],st=(hi-lo)/n;for(let i=0;i<=n;i++)out.push(lo+st*i);return out}
const short=v=>Math.abs(v)>=100000?(v/100000).toFixed(1).replace(/\.0$/,"")+"L":Math.abs(v)>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":(Math.round(v*100)/100)+"";
function chartBar(items,o={}){ // items:[{label,value,color}]
  const W=o.w||640,H=o.h||320,m={l:56,r:14,t:o.title?34:16,b:o.rotate?70:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...items.map(i=>i.value))*1.08),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih,bw=iw/items.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"bar chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*.15,w=bw*.7,y=sy(Math.max(it.value,mn));
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(mn)-y)}" fill="${it.color||o.color||"var(--c1)"}" rx="2"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    if(o.values!==false&&items.length<=14)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="font-size:11px">${short(it.value)}</text>`;
    const lx=x+w/2,ly=H-m.b+16;s+=o.rotate?`<text x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-35 ${lx} ${ly})">${esc(it.label)}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(it.label)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return s+"</svg>";}
function chartLine(series,labels,o={}){ // series:[{name,vals,color,dash}]
  const W=o.w||640,H=o.h||320,m={l:56,r:o.legendRight?110:16,t:o.title?34:16,b:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null)),mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...all)*1.08);
  const sx=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"line chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  const step=Math.ceil(labels.length/(o.maxLabels||12));labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="lbl" x="${sx(i)}" y="${H-m.b+16}" text-anchor="middle">${esc(l)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  series.forEach((se,k)=>{const c=se.color||PAL[k%6];let d="";se.vals.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+sx(i).toFixed(1)+" "+sy(v).toFixed(1)});
    if(o.area&&k===0)s+=`<path d="${d}L${sx(se.vals.length-1)} ${sy(mn)}L${sx(0)} ${sy(mn)}Z" fill="${c}" opacity=".18"/>`;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${se.w||2.5}" ${se.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
    if(o.dots!==false&&!se.dash)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${c}"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`});
    if(o.legendRight)s+=`<text x="${W-m.r+8}" y="${m.t+14+k*16}" style="fill:${c};font-weight:600">${esc(se.name)}</text>`;
    else if(series.length>1)s+=`<text x="${m.l+8+k*150}" y="${H-6}" style="fill:${c};font-weight:600">&#9632; ${esc(se.name)}</text>`});
  (o.marks||[]).forEach(mk=>{s+=`<text x="${sx(mk.i)}" y="${sy(mk.v)-10}" text-anchor="middle" style="font-weight:700;fill:${mk.color||"var(--sec)"}">${esc(mk.text)}</text>`});
  return s+"</svg>";}
function chartScatter(pts,o={}){ // pts:[{x,y,r,color,label}]
  const W=o.w||640,H=o.h||340,m={l:60,r:16,t:o.title?34:16,b:46},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=o.x0!=null?o.x0:Math.min(...xs),x1=o.x1!=null?o.x1:Math.max(...xs),y0=o.y0!=null?o.y0:0,y1=o.y1||nice(Math.max(...ys)*1.05);
  const sx=v=>m.l+(v-x0)/(x1-x0||1)*iw,sy=v=>m.t+ih-(v-y0)/(y1-y0)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"scatter chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(y0,y1).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  ticks(x0,x1).forEach(t=>s+=`<text class="lbl" x="${sx(t)}" y="${H-m.b+16}" text-anchor="middle">${short(t)}</text>`);

function chartPie(items,o={}){const W=o.w||420,H=o.h||300,cx=120,cy=H/2,R=100,tot=sum(items.map(i=>i.value));let a=-Math.PI/2,s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="pie chart">`;

function histBins(vals,n,lo,hi){const w=(hi-lo)/n,b=Array(n).fill(0);vals.forEach(v=>{let i=Math.floor((v-lo)/w);if(i>=n)i=n-1;if(i<0)i=0;b[i]++});return b.map((c,i)=>({label:short(lo+i*w),value:c,lo:lo+i*w,hi:lo+(i+1)*w}))}

const L=[];

let cur=0, done=new Set();
const UKEY="dalab_"+(document.title||"x");
try{JSON.parse(localStorage.getItem(UKEY)||"[]").forEach(x=>done.add(x))}catch(e){}
function go(i){
  cur=Math.max(0,Math.min(L.length-1,i));
  const l=L[cur],st=$("#stage");
  st.innerHTML=`<div class="crumb">Lesson ${cur+1} of ${L.length}</div><h1>${l.title}</h1><div class="syl">Syllabus: ${l.syl}</div>`+l.html()+
    `<div class="nextrow"><button class="btn" type="button" id="prevB" ${cur?"":"disabled"}>Previous</button><button class="btn pri" type="button" id="nextB" ${cur<L.length-1?"":"disabled"}>Next lesson</button></div>`;
  $("#prevB").onclick=()=>go(cur-1); $("#nextB").onclick=()=>go(cur+1);
  l.mount&&l.mount(st);
  $$("[data-q]",st).forEach(b=>b.onclick=()=>{
    const id=b.dataset.q,k=QUIZ[id],ok=+b.dataset.i===k.ans;
    $$(`[data-q="${id}"]`,st).forEach(x=>x.classList.remove("ok","no"));
    b.classList.add(ok?"ok":"no");
    $("#why-"+id,st).textContent=(ok?"Correct. ":"Not quite. ")+k.why;
    if(ok){done.add(cur);try{localStorage.setItem(UKEY,JSON.stringify([...done]))}catch(e){}drawNav()}
  });
  drawNav(); window.scrollTo(0,0); st.focus({preventScroll:true});
}
function drawNav(){
  $("#navlist").innerHTML=L.map((l,i)=>`<li class="${done.has(i)?"done":""}${l.hero?" hero":""}"><button type="button" data-go="${i}" ${i===cur?'aria-current="true"':""}><span class="n">${done.has(i)?"&#10003;":i+1}</span><span class="t">${l.nav}</span></button></li>`).join("");
  $$("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
}

const sumBy=(rows,keyf,valf=r=>r.net)=>{const g={};rows.forEach(r=>{const k=keyf(r);g[k]=(g[k]||0)+valf(r)});return g};
const monthly=(rows=SALES)=>{const g=sumBy(rows,r=>r.month);return MONTHS.map(m=>g[m]||0)};
const REGIONS=["Central","East","North","South","West"],CATS=["Accessories","Electronics","Home","Stationery"];
const sample=(arr,n)=>{const a=arr.slice();for(let i=0;i<n;i++){const j=i+Math.floor(Math.random()*(a.length-i));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)};

  table(SALES.slice(0,14),[["order","Order"],["region","Region"],["product","Product"],["units","Units"],["net","Net sales"]],{small:true})+`<p class="small muted">First 14 of ${SALES.length} rows. Net Sales = Units x MRP x (1 - Discount/100).</p>`;

/* ===== Unit II: Data Visualization ===== */
const regionItems=(rows=SALES,sorted=false,colorf)=>{const g=sumBy(rows,r=>r.region);let it=REGIONS.map(k=>({label:k,value:Math.round(g[k]||0)}));if(sorted)it.sort((a,b)=>b.value-a.value);return it.map((x,i)=>({...x,color:colorf?colorf(x,i):"var(--c1)"}))};

/* 1 Anscombe */
const AN={x:[10,8,13,9,11,14,6,4,12,7,5],y1:[8.04,6.95,7.58,8.81,8.33,9.96,7.24,4.26,10.84,4.82,5.68],y2:[9.14,8.14,8.74,8.77,9.26,8.10,6.13,3.10,9.13,7.26,4.74],y3:[7.46,6.77,12.74,7.11,7.81,8.84,6.08,5.39,8.15,6.42,5.73],x4:[8,8,8,8,8,8,8,19,8,8,8],y4:[6.58,5.76,7.71,8.84,8.47,7.04,5.25,12.50,5.56,7.91,6.89]};
lesson({nav:"Why we visualize (Anscombe)",title:"Why we visualize data",syl:"Introduction to Data Visualization, importance of visualization",
html:()=>`<p class="lead">Numbers summarise. Pictures <b>reveal</b>. In 1973 the statistician Francis Anscombe built four small datasets with <b>almost identical statistics</b> but completely different shapes.</p>
<div class="card try"><h3>Try it: compare four datasets</h3>
<div class="row">${seg("anv",[["stats","1. Statistics only"],["plots","2. Now draw them"]])}</div>
<div id="anout"></div><div class="callout k small" id="annote"></div></div>
<div class="card"><h3>Why this matters for business</h3><p class="small">An average order of Rs 761 hides a skewed distribution (lesson 4). A flat yearly total hides a March spike (lesson 5). <b>Always plot before you trust a summary.</b></p></div>
${quiz("u2q1","What is the lesson of Anscombe's quartet?",["Mean and correlation can be identical while the data looks totally different","Scatter plots are always better than tables","Small datasets are useless"],0,"Identical summary statistics can hide very different patterns, so look at the picture.")}`,
mount(r){
  const sets=[["I",AN.x,AN.y1],["II",AN.x,AN.y2],["III",AN.x,AN.y3],["IV",AN.x4,AN.y4]];
  function draw(v){
    if(v==="stats"){$("#anout",r).innerHTML=`<table class="dt"><thead><tr><th>Set</th><th>Mean of x</th><th>Mean of y</th><th>Fit line</th><th>Correlation</th></tr></thead><tbody>`+sets.map(s=>{const f=linfit(s[1],s[2]);return `<tr><td>${s[0]}</td><td>${mean(s[1]).toFixed(2)}</td><td>${mean(s[2]).toFixed(2)}</td><td>y = ${f.b.toFixed(2)} + ${f.m.toFixed(2)}x</td><td>${f.r.toFixed(3)}</td></tr>`}).join("")+`</tbody></table>`;
      $("#annote",r).textContent="All four rows look the same. Would you say these datasets are alike? Now press 'Now draw them'."}
    else{$("#anout",r).innerHTML=`<div class="grid2">`+sets.map(s=>{const f=linfit(s[1],s[2]);return chartScatter(s[1].map((x,i)=>({x,y:s[2][i],r:5})),{w:360,h:240,title:"Set "+s[0],fit:f,x0:2,x1:20,y0:2,y1:14})}).join("")+`</div>`;
      $("#annote",r).textContent="I: a clean line. II: a curve. III: a line with one outlier. IV: all points at one x except one. Same statistics, four different stories."}}
  draw("stats");bindSeg(r,"anv",draw);}
});
/* 2 Choosing a chart */
const QMAP={compare:["Compare categories (which region is biggest?)","Bar chart","Bars are the easiest shape for the eye to compare. Sort them.","Pie chart with many slices"],
 part:["Show parts of a whole (share of sales by category)","Pie chart (max 5 slices) or a stacked bar","Use only if parts add to 100 percent and there are few of them.","3D pie, or more than 6 slices"],
 trend:["See change over time (monthly sales)","Line chart","A line joins points in time order, so slope shows direction.","Bar chart for 100+ dates, or unordered lines"],
 rel:["See if two numbers move together (discount vs units)","Scatter plot","Each dot is one case. Add a trend line and report the correlation.","Two separate bar charts"],
 dist:["See how values are spread (order sizes)","Histogram or box plot","Shows the typical value, the spread and the outliers at once.","A bar chart of averages"]};
lesson({nav:"Choosing the right chart",title:"Choosing the right chart for the question",syl:"Choosing the right visualization, types of charts",
html:()=>`<p class="lead">Pick the chart from the <b>question</b>, not from what looks nice. Five questions cover most business charts.</p>
<div class="card try"><h3>Try it: what do you want to know?</h3>
<div class="row"><select id="qsel">${Object.entries(QMAP).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></div>
<div class="grid2"><div id="qchart"></div><div><p><span class="tag g">Use</span> <b id="qbest"></b></p><p class="small" id="qwhy"></p><p><span class="tag b">Avoid</span> <span class="small" id="qavoid"></span></p></div></div></div>
${quiz("u2q2","Monthly sales for 12 months: which chart?",["Pie chart","Line chart","Scatter plot of month vs month"],1,"Time on the x-axis, one value per month: a line chart.")}`,
mount(r){function draw(){const k=$("#qsel",r).value,q=QMAP[k];let c="";
    if(k==="compare")c=chartBar(regionItems(SALES,true),{w:420,h:260,title:"Net sales by region"});
    else if(k==="part"){const g=sumBy(SALES,x=>x.cat);c=chartPie(CATS.map((n,i)=>({label:n,value:g[n]})),{})}
    else if(k==="trend")c=chartLine([{name:"Net sales",vals:monthly()}],MLAB,{w:420,h:260,title:"Net sales by month",maxLabels:6});
    else if(k==="rel"){const s=SALES.filter((_,i)=>i%2===0);c=chartScatter(s.map(x=>({x:x.disc,y:x.units+(Math.random()-.5)*.5,r:3})),{w:420,h:260,title:"Discount % vs units (jittered)",x0:-1,x1:16,y0:0})}
    else{const b=histBins(SALES.map(x=>x.net),20,0,5600);c=chartBar(b,{w:420,h:260,title:"Order value (histogram)",rotate:false,values:false})}
    $("#qchart",r).innerHTML=c;$("#qbest",r).textContent=q[1];$("#qwhy",r).textContent=q[2];$("#qavoid",r).textContent=q[3]}
  $("#qsel",r).onchange=draw;draw();regQuiz("u2q2",1,"Time on the x-axis, one value per month: a line chart.")}
});
/* 3 Bar and pie */
lesson({nav:"Bar and pie charts",title:"Bar charts and pie charts",syl:"Bar charts, pie charts",
html:()=>`<p class="lead"><b>Bar charts</b> compare amounts. <b>Pie charts</b> show shares of one whole. Same data, different job.</p>
<div class="card try"><h3>Try it: region sales</h3>
<div class="row">${seg("bpt",[["bar","Bar"],["pie","Pie"]])} <label class="chk"><input type="checkbox" id="bps" checked> Sort high to low</label><label class="chk"><input type="checkbox" id="bpz"> Start axis at 120,000 (truncated)</label></div>
<div id="bpc"></div><div class="callout k small" id="bpn"></div></div>
<div class="card"><h3>Rules</h3><p class="small">Bars must start at <b>zero</b>, because the eye reads bar length as quantity. A pie works only for a few slices that add to 100 percent; with five regions that are all near 20 percent, a pie is hard to read, and a sorted bar is clearer.</p></div>
${quiz("u2q3","Why must a bar chart start at zero?",["Because Excel requires it","Because bar length is read as the value, so cutting the axis exaggerates differences","Because zero looks neat"],1,"A truncated axis makes a small gap look huge. That is the most common misleading chart.")}`,
mount(r){let t="bar";const gt=bindSeg(r,"bpt",v=>{t=v;draw()});
  function draw(){const so=$("#bps",r).checked,tr=$("#bpz",r).checked,it=regionItems(SALES,so);
    if(t==="pie")$("#bpc",r).innerHTML=chartPie(it.map(x=>({label:x.label,value:x.value})));
    else $("#bpc",r).innerHTML=chartBar(it,{w:620,h:300,title:"Net sales by region",min:tr?120000:0,max:tr?170000:undefined});
    const mx=Math.max(...it.map(x=>x.value)),mn=Math.min(...it.map(x=>x.value));
    $("#bpn",r).innerHTML=t==="pie"?"Five slices of about 17 to 22 percent are hard to rank by eye. Use a bar.":tr?`<b>Misleading:</b> the true ratio of biggest to smallest region is ${(mx/mn).toFixed(2)} times, but the truncated bars make the tallest look ${((mx-120000)/(mn-120000)).toFixed(1)} times the smallest.`:`True picture: Central ${fmt(mx)} vs East ${fmt(mn)}, a ratio of ${(mx/mn).toFixed(2)}.`}
  $("#bps",r).onchange=draw;$("#bpz",r).onchange=draw;draw();}
});
/* 4 Histogram and box plot */
function boxSvg(vals,o={}){const q1=quant(vals,.25),q2=quant(vals,.5),q3=quant(vals,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr,mn=Math.min(...vals),mx=Math.max(...vals);
  const inside=vals.filter(v=>v>=lo&&v<=hi),wl=Math.min(...inside),wh=Math.max(...inside),out=vals.filter(v=>v>hi||v<lo);
  const W=640,H=130,m=30,sx=v=>m+(v-0)/(Math.ceil(mx/500)*500)*(W-2*m),y=64;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="box plot">`;
  ticks(0,Math.ceil(mx/500)*500,8).forEach(t=>s+=`<line class="gr" x1="${sx(t)}" x2="${sx(t)}" y1="30" y2="100"/><text class="lbl" x="${sx(t)}" y="118" text-anchor="middle">${short(t)}</text>`);
  s+=`<line x1="${sx(wl)}" x2="${sx(q1)}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-width="2"/><line x1="${sx(q3)}" x2="${sx(wh)}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-width="2"/>`;
  s+=`<rect x="${sx(q1)}" y="${y-18}" width="${sx(q3)-sx(q1)}" height="36" fill="var(--pri-soft)" stroke="var(--pri)" stroke-width="2"/><line x1="${sx(q2)}" x2="${sx(q2)}" y1="${y-18}" y2="${y+18}" stroke="var(--sec)" stroke-width="3"/>`;
  out.forEach(v=>s+=`<circle cx="${sx(v)}" cy="${y}" r="3" fill="var(--bad)" fill-opacity=".6"/>`);
  return {svg:s+"</svg>",q1,q2,q3,iqr,hi,lo,out:out.length};}
lesson({nav:"Histogram and box plot",title:"Histograms and box plots: seeing the distribution",syl:"Histograms, box plots (distribution of data)",
html:()=>`<p class="lead">A <b>histogram</b> cuts the number line into bins and counts how many values fall in each. A <b>box plot</b> draws five numbers: minimum, Q1, median, Q3, maximum, and marks outliers.</p>
<div class="card try"><h3>Try it: order value (NetSales, 988 orders)</h3>
<div class="row">Number of bins: <input type="range" id="hb" min="5" max="60" value="20"> <b id="hbv">20</b></div>
<div id="hc"></div><div class="callout k small" id="hn"></div></div>
<div class="card try"><h3>Box plot of the same data</h3><div id="bc"></div><div id="bn" class="small"></div>
<div class="code">In a sheet:  =QUARTILE(M2:M989,1)   =MEDIAN(M2:M989)   =QUARTILE(M2:M989,3)\nUpper fence = Q3 + 1.5 x (Q3 - Q1)   then   =COUNTIF(M2:M989,"&gt;"&amp;fence)</div></div>
${quiz("u2q4","The box plot's median line sits left of centre inside the box and a long tail runs right. This means...",["Right-skewed data","Symmetric data","Left-skewed data"],0,"A long right tail means a few large values: right-skewed, like order values here.")}`,
mount(r){const v=SALES.map(x=>x.net);
  function h(){const n=+$("#hb",r).value;$("#hbv",r).textContent=n;const b=histBins(v,n,0,5600);$("#hc",r).innerHTML=chartBar(b,{w:640,h:300,title:"Order value histogram, "+n+" bins",values:false,ylabel:"Orders"});
    $("#hn",r).textContent=n<=8?"Too few bins hide the shape.":n>=45?"Too many bins make it jagged and noisy.":"Most orders are small, and a long tail of large orders stretches to the right. Mean "+fmt(mean(v))+" is above median "+fmt(median(v))+"."}
  $("#hb",r).oninput=h;h();
  const b=boxSvg(v);$("#bc",r).innerHTML=b.svg;$("#bn",r).innerHTML=`Q1 <b>${fmt(b.q1)}</b>, median <b>${fmt(b.q2)}</b>, Q3 <b>${fmt(b.q3)}</b>, IQR ${fmt(b.iqr)}. Upper fence <b>${fmt(b.hi)}</b>, so <b>${b.out} orders</b> are outliers (red dots). They are real big orders, not errors: check before deleting.`;}
});
/* 5 Line, area, trend */
lesson({nav:"Line, area and trend",title:"Line charts, area charts and trend lines",syl:"Line charts, area charts, trend analysis",
html:()=>`<p class="lead">A <b>line chart</b> shows change over time. An <b>area chart</b> fills under the line to stress volume. A <b>trend line</b> fits a straight line to see the direction, and a <b>moving average</b> smooths noise.</p>
<div class="card try"><h3>Try it: monthly net sales</h3>
<div class="row">${seg("lt",[["line","Line"],["area","Area"]])} <label class="chk"><input type="checkbox" id="lta"> Trend line</label><label class="chk"><input type="checkbox" id="ltm"> Moving average of <input type="range" id="ltw" min="2" max="6" value="3"> <b id="ltwv">3</b> months</label></div>
<div id="lc"></div><div class="callout k small" id="ln"></div></div>
${quiz("u2q5","A trend line with R-squared 0.0085 means...",["A strong upward trend","Time explains almost none of the variation, so there is no real trend","The data is wrong"],1,"R-squared near 0 means the line explains nearly nothing. Sales here bounce around a flat average.")}`,
mount(r){const m=monthly();let t="line";bindSeg(r,"lt",v=>{t=v;d()});
  function d(){const w=+$("#ltw",r).value;$("#ltwv",r).textContent=w;const s=[{name:"Net sales",vals:m,color:"var(--c1)"}];
    const xs=m.map((_,i)=>i+1),f=linfit(xs,m),r2=f.r*f.r;
    if($("#lta",r).checked)s.push({name:"Trend",vals:xs.map(x=>f.m*x+f.b),color:"var(--c2)",dash:true});
    if($("#ltm",r).checked)s.push({name:w+"-month average",vals:m.map((_,i)=>i+1<w?null:mean(m.slice(i-w+1,i+1))),color:"var(--c3)",dash:true});
    const pk=m.indexOf(Math.max(...m)),lw=m.indexOf(Math.min(...m));
    $("#lc",r).innerHTML=chartLine(s,MLAB,{w:640,h:320,title:"Net sales by month",area:t==="area",min:0,marks:[{i:pk,v:m[pk],text:"Peak "+short(m[pk])},{i:lw,v:m[lw],text:"Low "+short(m[lw]),color:"var(--bad)"}]});
    $("#ln",r).innerHTML=`Peak: <b>${MLAB[pk]}</b> (${fmt(m[pk])}). Low: <b>${MLAB[lw]}</b> (${fmt(m[lw])}). Trend slope ${f.m.toFixed(2)} per month, R&sup2; <b>${r2.toFixed(4)}</b>: ${r2<.1?"practically no trend. Do not claim growth.":"some trend."}`}
  $("#lta",r).onchange=d;$("#ltm",r).onchange=d;$("#ltw",r).oninput=d;d();}
});
/* 6 Scatter and bubble */
const NF={units:"Units",mrp:"MRP",disc:"Discount %",net:"Net sales",rating:"Rating"};
lesson({nav:"Scatter and bubble charts",title:"Scatter plots and bubble charts: relationships",syl:"Scatter plots, bubble charts, correlation",
html:()=>`<p class="lead">A <b>scatter plot</b> puts one number on each axis, one dot per case. A <b>bubble chart</b> adds a third number as the dot size. The <b>correlation r</b> (from -1 to +1) summarises the straight-line relationship.</p>
<div class="card try"><h3>Try it: pick two columns (orders)</h3>
<div class="row">x: <select id="sx">${Object.entries(NF).map(([k,v])=>`<option value="${k}" ${k==="disc"?"selected":""}>${v}</option>`).join("")}</select> y: <select id="sy">${Object.entries(NF).map(([k,v])=>`<option value="${k}" ${k==="net"?"selected":""}>${v}</option>`).join("")}</select> <label class="chk"><input type="checkbox" id="sf" checked> Trend line</label></div>
<div id="sc"></div><div class="callout k small" id="sn"></div></div>
<div class="card try"><h3>Bubble chart: products</h3><p class="small muted">x = MRP, y = units sold, bubble size = net sales.</p><div id="bub"></div></div>
${quiz("u2q6","Two columns have correlation 0.9. Does one cause the other?",["Yes, strongly","Not necessarily: correlation shows they move together, not why","Only if r is negative"],1,"Correlation is not causation. A third factor may drive both.")}`,
mount(r){function d(){const a=$("#sx",r).value,b=$("#sy",r).value,rows=SALES.filter(x=>x[a]!=null&&x[b]!=null),xs=rows.map(x=>x[a]),ys=rows.map(x=>x[b]),f=linfit(xs,ys),jit=(k)=>["units","disc","rating"].includes(k)?(Math.random()-.5)*.35:0;
    $("#sc",r).innerHTML=chartScatter(rows.map(x=>({x:x[a]+jit(a),y:x[b]+jit(b),r:2.8})),{w:640,h:330,title:NF[a]+" vs "+NF[b],xlabel:NF[a],ylabel:NF[b],fit:$("#sf",r).checked?f:null,y0:Math.min(0,Math.min(...ys)),x0:Math.min(...xs)-.5,x1:Math.max(...xs)+.5,alpha:.35});
    const R=f.r,ab=Math.abs(R);$("#sn",r).innerHTML=`Correlation r = <b>${R.toFixed(3)}</b> (${ab<.1?"no linear relationship":ab<.3?"very weak":ab<.5?"weak":ab<.7?"moderate":"strong"}${R>0?", positive":R<0?", negative":""}). ${a==="units"&&b==="net"?"Net sales grow with units, as they must (it is units x price).":a==="disc"&&b==="units"?"Discounts do not visibly lift units here.":"Check whether the pattern makes business sense."}`}
  ["sx","sy","sf"].forEach(i=>$("#"+i,r).onchange=d);d();
  const g=groupBy(SALES,x=>x.product),pts=Object.entries(g).map(([p,rs],i)=>({x:rs[0].mrp,y:sum(rs.map(z=>z.units)),r:Math.max(6,Math.sqrt(sum(rs.map(z=>z.net)))/6),label:p,color:PAL[i%6]}));
  $("#bub",r).innerHTML=chartScatter(pts,{w:640,h:340,xlabel:"MRP (Rs)",ylabel:"Units sold",labels:true,x0:0,x1:900,alpha:.5});}
});
/* 7 Colour, shape, size, labels, data-ink */
lesson({nav:"Colour, labels and data-ink",title:"Colour, shape, size, labelling and data-ink",syl:"Design principles: colour, shape, size, labelling, data-ink ratio",
html:()=>`<p class="lead">Every mark on a chart should earn its place. Edward Tufte called the useful part the <b>data-ink</b>. Remove decoration, keep the message. Use <b>colour to highlight</b>, not to decorate.</p>
<div class="card try"><h3>Try it: tidy the chart</h3>
<div class="row"><label class="chk"><input type="checkbox" id="c1"> Rainbow colours</label><label class="chk"><input type="checkbox" id="c2" checked> Highlight the top region only</label><label class="chk"><input type="checkbox" id="c3" checked> Value labels on bars</label><label class="chk"><input type="checkbox" id="c4" checked> Sort bars</label></div>
<div id="cc"></div><div class="callout k small" id="cn"></div></div>
<div class="card"><h3>Checklist</h3><span class="pill"><b>Colour</b>: one highlight, others grey; keep contrast</span><span class="pill"><b>Shape</b>: bars compare, lines connect</span><span class="pill"><b>Size</b>: area must match value</span><span class="pill"><b>Labels</b>: title says the insight; label directly</span><span class="pill"><b>Accessibility</b>: do not rely on red vs green alone</span></div>
${quiz("u2q7","The best use of colour in a business chart is to...",["Make every bar different","Draw attention to the one thing that matters","Match the company logo"],1,"Colour is a spotlight. Use one accent colour on the finding and keep the rest quiet.")}`,
mount(r){function d(){const rb=$("#c1",r).checked,hi=$("#c2",r).checked,vl=$("#c3",r).checked,so=$("#c4",r).checked;
    const it=regionItems(SALES,so,(x,i)=>rb?PAL[i%5]:hi?(x.label==="Central"?"var(--c1)":"var(--muted)"):"var(--c1)");
    $("#cc",r).innerHTML=chartBar(it,{w:620,h:300,title:hi?"Central leads net sales; East trails by 20%":"Net sales by region",values:vl});
    $("#cn",r).textContent=rb?"Rainbow colours carry no meaning here: the eye hunts for a legend that does not exist.":hi?"Grey for context, one colour for the finding. The title states the message.":"Plain single colour is fine, but nothing tells the viewer where to look."}
  ["c1","c2","c3","c4"].forEach(i=>$("#"+i,r).onchange=d);d();}
});
/* 8 Fix a bad chart */
const BAD=[["Starts at zero (not truncated)","The axis starts at 120,000, so differences look huge."],["Sorted","Bars are in random order."],["Title states the insight","The title is missing or only a topic."],["One calm colour (plus a highlight)","Rainbow colours with no meaning."],["Value labels instead of a busy grid","Readers cannot read exact values."]];
lesson({nav:"Fix a bad chart",title:"Common visualization mistakes: fix a bad chart",syl:"Common mistakes in data visualization, best practices",
html:()=>`<p class="lead">Start from a chart with five classic mistakes. Fix them one by one and watch it improve.</p>
<div class="card try"><h3>Try it: tick each fix</h3><div class="row">${BAD.map((b,i)=>`<label class="chk"><input type="checkbox" id="f${i}"> ${b[0]}</label>`).join("")}</div>
<div id="fc"></div><div class="callout k small" id="fn"></div><p class="small" id="fs"></p></div>
${quiz("u2q8","Which mistake changes the viewer's conclusion the most?",["A missing title","A truncated axis","Using grey instead of blue"],1,"A truncated axis can turn a 5 percent difference into a 'doubling'.")}`,
mount(r){function d(){const f=BAD.map((_,i)=>$("#f"+i,r).checked);
    let it=regionItems(SALES,f[1],(x,i)=>f[3]?(x.label==="Central"?"var(--c1)":"var(--muted)"):PAL[i%5]);
    $("#fc",r).innerHTML=chartBar(it,{w:620,h:300,title:f[2]?"Central region leads net sales (Rs 1.64 lakh)":"Chart 1",min:f[0]?0:120000,max:f[0]?undefined:170000,values:f[4]});
    const n=f.filter(Boolean).length;$("#fs",r).innerHTML=`Fixes applied: <b>${n} of 5</b>`;
    const first=f.findIndex(x=>!x);$("#fn",r).textContent=first<0?"A clean chart: honest axis, ordered, clear message, calm colour, direct labels.":"Still wrong: "+BAD[first][1]}
  BAD.forEach((_,i)=>$("#f"+i,r).onchange=d);d();}
});
/* 9 Storytelling */
lesson({nav:"Storytelling with data",title:"Data storytelling",syl:"Storytelling with data, communicating insights",
html:()=>`<p class="lead">A chart is not a story. A story has <b>context</b> (what is normal), an <b>insight</b> (what changed), and an <b>action</b> (what to do). Three charts, three sentences.</p>
<div class="card try"><h3>Try it: build a story from the data</h3><div class="row">${seg("stv",[["1","1. Context"],["2","2. Insight"],["3","3. Action"]],"s")}</div>
<div class="grid2"><div id="stc"></div><div><h2 id="sth"></h2><p id="stt"></p><p class="small muted">Edit the headline to say what <i>you</i> would present:</p><input type="text" id="sti" style="width:100%"></div></div></div>
<div class="card"><h3>A good story title says the insight</h3><p class="small"><b>Weak:</b> "Sales by month". <b>Strong:</b> "March is our biggest month, and six months fall below the average." Test: could someone read only the titles and get your message?</p></div>
${quiz("u2q9","The best chart title is...",["Net sales by month","The finding, in a sentence","The date the chart was made"],1,"Titles should state the insight so the slide works on its own.")}`,
mount(r){const m=monthly(),avg=mean(m),pk=m.indexOf(Math.max(...m)),below=m.filter(v=>v<avg).length;const g=sumBy(SALES,x=>x.region);const top=REGIONS.slice().sort((a,b)=>g[b]-g[a]);
  const S={1:["Context: a typical month is about Rs "+IN(avg),`Over 12 months, average net sales are ${fmt(avg)} per month. Sales are flat, with ups and downs.`,()=>chartLine([{name:"Net sales",vals:m},{name:"Average",vals:m.map(()=>avg),dash:true,color:"var(--c2)"}],MLAB,{w:420,h:260,maxLabels:6})],
   2:["Insight: "+MLAB[pk]+" is "+Math.round(100*(m[pk]/avg-1))+"% above average",`${MLAB[pk]} sold ${fmt(m[pk])}. ${below} of 12 months fell below the average.`,()=>chartBar(MLAB.map((l,i)=>({label:l,value:Math.round(m[i]),color:i===pk?"var(--c2)":"var(--muted)"})),{w:420,h:260,rotate:true,values:false})],
   3:["Action: learn from "+top[0]+" and lift "+top[4],`${top[0]} leads (${fmt(g[top[0]])}). ${top[4]} trails by ${Math.round(100*(1-g[top[4]]/g[top[0]]))}%. Find what ${top[0]} does differently, then test it in ${top[4]}.`,()=>chartBar(regionItems(SALES,true,(x)=>x.label===top[0]?"var(--c1)":x.label===top[4]?"var(--c2)":"var(--muted)"),{w:420,h:260})]};
  function d(v){const s=S[v];$("#stc",r).innerHTML=s[2]();$("#sth",r).textContent=s[0];$("#stt",r).textContent=s[1];$("#sti",r).value=s[0]}
  d("1");bindSeg(r,"stv",d);}
});
/* 10 Dashboards */
lesson({hero:true,nav:"Dashboards and slicers",title:"Dashboards: one screen, one decision",syl:"Dashboards, interactive visualization (Power BI / Excel)",
html:()=>`<p class="lead">A <b>dashboard</b> puts the few numbers and charts a decision-maker needs on <b>one screen</b>. <b>Slicers</b> (filters) let you change the view without rebuilding anything. This is what Power BI, Excel and Sheets dashboards do.</p>
<div class="card try"><h3>Try it: slice the Sunrise dashboard</h3>
<div class="row">Region <select id="dr"><option value="">All</option>${REGIONS.map(x=>`<option>${x}</option>`).join("")}</select> Category <select id="dc"><option value="">All</option>${CATS.map(x=>`<option>${x}</option>`).join("")}</select> Segment <select id="ds"><option value="">All</option><option>Corporate</option><option>Retail</option><option>Student</option></select></div>
<div class="grid3" id="dk"></div><div class="grid2"><div id="d1"></div><div id="d2"></div></div><div id="d3"></div></div>
<div class="card"><h3>Build it in your tool</h3><p class="small"><b>Google Sheets:</b> pivot tables + charts + Data, Add a slicer. <b>Excel:</b> PivotCharts + Insert Slicer. <b>Power BI Desktop:</b> Get data, drag fields onto visuals, add Slicer visuals, and clicking a bar filters the others (cross-filtering).</p></div>
${quiz("u2q10","The main job of a slicer is to...",["Delete rows","Filter all linked visuals at once","Change the colour theme"],1,"A slicer applies a filter across the dashboard so you can explore without new charts.")}`,
mount(r){function d(){const R=$("#dr",r).value,C=$("#dc",r).value,S=$("#ds",r).value,rows=SALES.filter(x=>(!R||x.region===R)&&(!C||x.cat===C)&&(!S||x.seg===S));
    const n=sum(rows.map(x=>x.net)),p=sum(rows.map(x=>x.profit));
    $("#dk",r).innerHTML=[["Net sales",fmt(n)],["Orders",rows.length],["Profit margin",rows.length?(100*p/n).toFixed(1)+"%":"-"]].map(k=>`<div class="kpi"><span class="small muted">${k[0]}</span><b>${k[1]}</b></div>`).join("");
    if(!rows.length){$("#d1",r).innerHTML=$("#d2",r).innerHTML=$("#d3",r).innerHTML='<div class="callout">No rows for this combination.</div>';return}
    $("#d1",r).innerHTML=chartLine([{name:"Net sales",vals:monthly(rows)}],MLAB,{w:420,h:240,title:"By month",maxLabels:6,min:0});
    const g=sumBy(rows,x=>x.cat);$("#d2",r).innerHTML=chartBar(CATS.map(c=>({label:c,value:Math.round(g[c]||0),color:"var(--c2)"})),{w:420,h:240,title:"By category"});
    const gp=sumBy(rows,x=>x.product),tp=Object.entries(gp).sort((a,b)=>b[1]-a[1]).slice(0,6);$("#d3",r).innerHTML=chartBar(tp.map(x=>({label:x[0],value:Math.round(x[1]),color:"var(--c3)"})),{w:640,h:240,title:"Top products"})}
  ["dr","dc","ds"].forEach(i=>$("#"+i,r).onchange=d);d();}
});
/* 11 Tools, export, ethics */
lesson({nav:"Tools, exporting and ethics",title:"Visualization tools, exporting and ethical visualization",syl:"Visualization tools (Excel, Power BI, Tableau, Python), exporting, ethics",
html:()=>`<p class="lead">Different tools, same principles. Choose by audience, data size and budget.</p>
<div class="card"><table class="dt"><thead><tr><th>Tool</th><th>Best for</th><th>Notes</th></tr></thead><tbody>
<tr><td><b>Excel</b></td><td>Quick charts, small to medium data</td><td>Paid (MS Office). Pivot charts, slicers</td></tr>
<tr><td><b>Google Sheets</b></td><td>Free, shareable, collaborative</td><td>Runs in a browser. Good for classroom</td></tr>
<tr><td><b>Power BI Desktop</b></td><td>Dashboards and large data</td><td>Free desktop app (Windows). Cross-filtering visuals</td></tr>
<tr><td><b>Tableau</b></td><td>Polished interactive dashboards</td><td>Check current licensing before recommending it</td></tr>
<tr><td><b>Python (matplotlib)</b></td><td>Repeatable, automated charts</td><td>Needs coding; scripts are in your Notion page</td></tr></tbody></table></div>
<div class="card try"><h3>Ethics: the same data, two stories</h3><p class="small muted">Sales for East vs Central. Which chart would you be proud to show?</p>
<div class="row">${seg("et",[["h","Honest"],["m","Misleading"]],"s")}</div><div id="ec"></div><div class="callout k small" id="en"></div></div>
<div class="card"><h3>Exporting checklist</h3><p class="small">Export as PNG for slides, PDF for reports, and keep the source file. Check: readable at slide size, title says the insight, source and date in a footnote, colours readable in grayscale.</p></div>
${quiz("u2q11","A manager asks you to cut the axis so the growth 'looks better'. What do you do?",["Do it, they are the boss","Show the honest chart and explain the real size of the change","Remove the axis labels"],1,"Honest charts protect your credibility and your decisions. You can emphasise a real finding without distorting it.")}`,
mount(r){const a=SALES.filter(x=>x.region==="Central"),b=SALES.filter(x=>x.region==="East");const va=sum(a.map(x=>x.net)),vb=sum(b.map(x=>x.net));
  function d(v){const it=[{label:"East",value:Math.round(vb),color:"var(--c2)"},{label:"Central",value:Math.round(va),color:"var(--c1)"}];
    $("#ec",r).innerHTML=v==="h"?chartBar(it,{w:420,h:240,title:"Net sales: East vs Central"}):chartBar(it,{w:420,h:240,title:"Central DOUBLES East!",min:125000,max:166000});
    $("#en",r).textContent=v==="h"?`Central is ${(100*(va/vb-1)).toFixed(0)}% larger than East. A real gap, honestly drawn.`:`Truncated axis plus a loud title makes a ${(100*(va/vb-1)).toFixed(0)}% gap look like 'doubles'. Never do this.`}
  d("h");bindSeg(r,"et",d);}
});
