<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Visualization Lab - Unit II</title>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#EFEBE1; --fg:#12110E; --muted:#44403A; --line:#B9B2A2; --line2:#D9D3C4;
  --pri:#1F3FB5; --pri-soft:#DDE5FA; --sec:#9A4208; --sec-soft:#FBE3CC;
  --good:#0F6A31; --good-soft:#D5F0DD; --warn:#744500; --warn-soft:#F9E8B8; --bad:#A31D12; --bad-soft:#FADAD5;
  --code:#EFEBE1; --on:#FFFFFF; --grid:#CFC9BA; --shadow:0 1px 2px rgba(18,17,14,.08),0 6px 18px rgba(18,17,14,.06);
  --c1:#1F3FB5; --c2:#9A4208; --c3:#0F6A31; --c4:#7A2A9C; --c5:#8A6D00; --c6:#B0235C;
  --disp:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --zoom:1;
}
:root[data-theme="dark"]{
  --bg:#0C0C0A; --surface:#181714; --surface2:#242320; --fg:#F7F4EA; --muted:#CFCABD; --line:#5B574B; --line2:#35332C;
  --pri:#9DB1FF; --pri-soft:#1B2350; --sec:#FFAE6B; --sec-soft:#40240E;
  --good:#6FE09A; --good-soft:#0F3320; --warn:#F5C964; --warn-soft:#3B2E0A; --bad:#FF9A8C; --bad-soft:#451A15;
  --code:#1F1E1A; --on:#0C0C0A; --grid:#46433A; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  --c1:#9DB1FF; --c2:#FFAE6B; --c3:#6FE09A; --c4:#D9A0FF; --c5:#F0D060; --c6:#FF8FB8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);zoom:var(--zoom)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;min-height:calc(100vh / var(--zoom))}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.brand{font-family:var(--disp);font-size:20px;line-height:1.15;margin:0 4px 4px}
.brand small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:4px}
.nav ol{list-style:none;margin:16px 0 0;padding:0}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.nav li button:hover{background:var(--surface2)}
.nav li button[aria-current="true"]{background:var(--pri-soft);font-weight:600}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.nav li.done .n{background:var(--good);color:var(--on);border-color:var(--good)}
.nav .t{font-size:13.5px;line-height:1.3}
.nav .hero .n{border-color:var(--sec);color:var(--sec)}
.tools{margin:18px 4px 0;display:grid;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;text-align:left}
.tools button:hover{border-color:var(--fg)}
.tools .hint{font-size:12px;color:var(--muted)}
main{padding:26px 30px 70px;min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px}
h2{font-family:var(--disp);font-size:20px;margin:0 0 8px}
h3{font-size:13.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.syl{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card.try{border-left:5px solid var(--pri)}
.card.sec{border-left:5px solid var(--sec)}
.lead{font-size:16.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.tag.p{background:var(--pri-soft);color:var(--pri)} .tag.s{background:var(--sec-soft);color:var(--sec)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)} .btn.sec{background:var(--sec);color:var(--on);border-color:var(--sec)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.dt td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:340px}
.tw.sm{max-height:none}
.new{animation:pop .6s ease both}
@keyframes pop{from{background:var(--sec-soft);transform:translateY(-4px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;overflow:auto;white-space:pre-wrap;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface2);border:1px solid var(--line2)}
.callout.k{background:var(--sec-soft);border-color:transparent} .callout.i{background:var(--pri-soft);border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on)}
.seg.s button[aria-pressed="true"]{background:var(--sec)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px}
input[type=range]{accent-color:var(--pri);vertical-align:middle}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
.live{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.live .tw{max-height:none}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arrow{font-size:28px;color:var(--sec);text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--surface)}
td.ix{background:var(--bad-soft)} td.iy{background:var(--warn-soft)} td.iz{background:var(--pri-soft)} td.chg{background:var(--good-soft)}
.cardsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.nextrow{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
svg.chart{width:100%;height:auto;display:block;max-height:420px}
svg.chart{font-size:calc(12px*var(--zoom))}
svg.chart text{fill:var(--fg);font-family:var(--body);font-size:1em}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .gr{stroke:var(--grid);stroke-width:1}
svg.chart .lbl{fill:var(--muted)}
.sheet{border-collapse:collapse;font-size:13.5px;font-family:var(--mono);width:100%}
.sheet th{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:600;color:var(--muted)}
.sheet td{border:1px solid var(--line);padding:0;min-width:80px}
.sheet td input{width:100%;border:0;background:transparent;padding:4px 7px;font:inherit;border-radius:0}
.sheet td.sel{outline:2px solid var(--pri);outline-offset:-2px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.live{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav ol{display:flex;overflow:auto;gap:4px}.nav li{flex:none}.nav .t{display:none}main{padding:18px 16px 60px}.grid2,.grid3,.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}

.dt.wrap td,.dt.wrap th{white-space:normal}
.card.task{border-left:5px solid var(--good)}
.numt{margin:4px 0 10px}.numt .tw{margin-top:8px}
a.g{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)} a.g:hover{border-bottom-style:solid}
.gl.hl{outline:3px solid var(--pri)}
.qq+.qq{border-top:1px solid var(--line2);margin-top:8px}
.opt:disabled{cursor:default}
#prog{margin-top:6px;font-size:12.5px;line-height:1.5}
select{max-width:100%}
.grid3>*{min-width:0}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Lessons">
    <h2 class="brand">Visualization Lab<small>Unit II, Data Visualization<br>BBA Sem I, Business Management Tools I</small></h2>
    <ol id="navlist"></ol>
    <div class="tools"><button id="themeBtn" type="button">Theme</button><button id="zoomBtn" type="button">Text size</button><div id="prog" class="small"></div><button id="resetP" type="button">Reset my score</button><span class="hint">Projector tip: if text is hard to see, switch theme (or press Alt+D) and raise the text size.</span></div>
  </nav>
  <main id="stage" tabindex="-1"></main>
  <aside class="live" aria-label="Live data"><h3>Live data: Sunrise Retail</h3><div id="livebox"></div></aside>
</div>
<script>
"use strict";
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v==="number"?(Number.isInteger(v)?v.toLocaleString("en-IN"):v.toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d})):v;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,l=Math.floor(p);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(p-l)};
const mode=a=>{const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx).join(", ")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const groupBy=(rows,f)=>{const g={};rows.forEach(r=>{const k=f(r);(g[k]=g[k]||[]).push(r)});return g};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return a/Math.sqrt(b*c)};
const linfit=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2});const m=a/b;return {m,b:my-m*mx,r:corr(x,y)}};
function table(rows,cols,opts={}){
  const head=cols.map(c=>`<th>${esc(c[1])}</th>`).join("");
  const body=rows.map((r,i)=>`<tr${opts.newFrom!=null&&i>=opts.newFrom?' class="new"':''}>`+cols.map(c=>{
    const v=r[c[0]],cls=(typeof v==="number"?"num":"")+((opts.cellClass&&opts.cellClass(r,c[0],i))||"");
    return `<td class="${cls.trim()}">${v===""||v==null?'<span class="muted">(blank)</span>':esc(typeof v==="number"?fmt(v,c[2]!=null?c[2]:(Number.isInteger(v)?0:2)):v)}</td>`}).join("")+"</tr>").join("");
  return `<div class="tw${opts.small?' sm':''}"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const IN=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const num=v=>Number(v).toLocaleString("en-IN",{maximumFractionDigits:2});
const RS=v=>"Rs "+IN(v);
function seg(id,items,cls=""){return `<div class="seg ${cls}" id="${id}" role="group">`+items.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${i===0}">${x[1]}</button>`).join("")+`</div>`}
function bindSeg(root,id,fn){const g=$("#"+id,root);$$("button",g).forEach(b=>b.onclick=()=>{$$("button",g).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return ()=>$$("[aria-pressed=true]",g)[0].dataset.v}

/* ===== SVG charts: colours from CSS variables; text size follows the Text size control ===== */
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const lakh=v=>v===0?"0":String(+(v/100000).toFixed(2))+"L";
const fa=hi=>hi>=100000?lakh:num;                     /* one unit per axis: lakh or plain */
const short=v=>Math.abs(v)>=100000?lakh(v):num(v);
function niceStep(raw){const e=Math.pow(10,Math.floor(Math.log10(raw||1))),f=raw/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function axisFor(maxv){const step=niceStep((maxv||1)/5),n=Math.max(1,Math.ceil(maxv/step-1e-9));return {hi:step*n,n}}
function ticks(lo,hi,n=5){const out=[],st=(hi-lo)/n;for(let i=0;i<=n;i++)out.push(+(lo+st*i).toFixed(6));return out}
function tk(lo,hi,intOnly){let st=niceStep((hi-lo)/5||1);if(intOnly)st=Math.max(1,Math.round(st));const out=[];for(let v=Math.ceil(lo/st-1e-9)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(6));return out}
const TB=(h,rows,note)=>` data-tbl="${esc(JSON.stringify({h,rows,note:note||""}))}"`;
const TS="font-weight:700;font-size:1.17em";
function chartBar(items,o={}){
  const W=o.w||640,H=o.h||320,m={l:58,r:14,t:o.title?34:16,b:o.rotate?70:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mn=o.min!=null?o.min:0,vmax=Math.max(...items.map(i=>i.value));
  let mx,n=5;if(o.max){mx=o.max}else{const a=axisFor(vmax*1.04);mx=a.hi;n=a.n}
  const fm=fa(mx),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih,bw=iw/items.length,step=(items.length>14&&!o.rotate)?Math.ceil(items.length/10):1;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"bar chart")}"${TB([o.cat||"Item",o.vlabel||"Value"],items.map(i=>[i.label,i.value]))}>`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="${TS}">${esc(o.title)}</text>`;
  ticks(mn,mx,n).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${fm(t)}</text>`);
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*.15,w=bw*.7,y=sy(Math.max(it.value,mn));
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(mn)-y)}" fill="${it.color||o.color||"var(--c1)"}" rx="2"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    if(o.values!==false&&items.length<=14)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="font-size:.92em">${fm(it.value)}</text>`;
    if(i%step===0){const lx=x+w/2,ly=H-m.b+16;s+=o.rotate?`<text x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-35 ${lx} ${ly})">${esc(it.label)}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(it.label)}</text>`}});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return s+"</svg>";}
function chartLine(series,labels,o={}){
  const W=o.w||640,H=o.h||320,m={l:58,r:o.legendRight?110:26,t:o.title?34:16,b:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null)),mn=o.min!=null?o.min:0;
  let mx,n=5;if(o.max){mx=o.max}else{const a=axisFor(Math.max(...all)*1.08);mx=a.hi;n=a.n}
  const fm=fa(mx),sx=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"line chart")}"${TB([o.cat||"Period"].concat(series.map(x=>x.name)),labels.map((l,i)=>[l].concat(series.map(x=>x.vals[i]==null?"":Math.round(x.vals[i]*100)/100))))}>`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="${TS}">${esc(o.title)}</text>`;
  ticks(mn,mx,n).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${fm(t)}</text>`);
  const step=Math.ceil(labels.length/(o.maxLabels||12));labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="lbl" x="${sx(i)}" y="${H-m.b+16}" text-anchor="middle">${esc(l)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  series.forEach((se,k)=>{const c=se.color||PAL[k%6];let d="";se.vals.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+sx(i).toFixed(1)+" "+sy(v).toFixed(1)});
    if(o.area&&k===0)s+=`<path d="${d}L${sx(se.vals.length-1)} ${sy(mn)}L${sx(0)} ${sy(mn)}Z" fill="${c}" opacity=".18"/>`;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${se.w||2.5}" ${se.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
    if(o.dots!==false&&!se.dash)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${c}"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`});
    if(o.legendRight)s+=`<text x="${W-m.r+8}" y="${m.t+14+k*16}" style="fill:${c};font-weight:600">${esc(se.name)}</text>`;
    else if(series.length>1)s+=`<text x="${m.l+8+k*150}" y="${H-6}" style="fill:${c};font-weight:600">&#9632; ${esc(se.name)}</text>`});
  (o.marks||[]).forEach(mk=>{const x=sx(mk.i),up=sy(mk.v)-10>m.t+12,anc=x<m.l+70?"start":x>W-m.r-70?"end":"middle",dx=anc==="start"?-4:anc==="end"?4:0;

const QZ={},QBY={};let QS={};

function shufQ(opts,ans,seed){const idx=opts.map((_,i)=>i);let h=(Math.imul(seed+1,2654435761)>>>0)^0x9e3779b9;const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};for(let k=0;k<8;k++)rnd();for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return {opts:idx.map(i=>opts[i]),ans:idx.indexOf(ans)}}

const L=[];

  st.innerHTML=`<div class="crumb">${l.ref?"Reference":"Lesson "+(cur+1)+" of "+nl}</div><h1>${l.title}</h1><div class="syl">Syllabus: ${l.syl}</div>`+l.html()+

lesson({nav:"Why we visualize (Anscombe)",title:"Why we visualize data",syl:"Introduction to Data Visualization, importance of visualization",
html:()=>`<p class="lead">A summary statistic turns many numbers into one. That is useful, but one number cannot show the shape of the data. In 1973 the statistician Francis Anscombe built four small datasets to prove this point. They are called ${g("quartet")}. Each set has 11 pairs of numbers (x, y). All four sets give almost the same summary numbers, and their pictures are completely different.</p>
<div class="card"><h3>Four terms used in the table</h3><ul class="small">
<li><b>Mean</b>: the sum of the values divided by how many there are. Every set has a mean of x of 9.00 and a mean of y of about 7.50.</li>
<li><b>${g("correlation","Correlation (r)")}</b>: a score from -1 to +1 that says how tightly the points hug a straight line. Near +1 or -1 means tight. Near 0 means no straight-line pattern.</li>
<li><b>${g("fitline","Fit line")}</b>: the straight line that comes closest to all the points. It is the line a spreadsheet draws when you add a trendline. The method that finds it is called ${g("regression")}.</li>
<li><b>${g("outlier")}</b>: a point far away from the others.</li></ul></div>
<div class="card try"><h3>Try it: compare four datasets</h3>
<div class="row">${seg("anv",[["stats","1. Statistics only"],["plots","2. Now draw them"]])}</div>
<div id="anout"></div><div class="callout k small" id="annote"></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The table says that all four sets have the same mean, the same fit line (y = 3.00 + 0.50x) and a correlation of 0.816 or 0.817. The pictures show why the numbers cannot be trusted alone:</p>
<ul class="small"><li><b>Set I</b> is a scatter around a straight line. The summary describes it well. This is the case most people assume for every dataset.</li>
<li><b>Set II</b> follows a smooth curve. y rises and then falls, so a straight line is the wrong shape, even though r is high.</li>
<li><b>Set III</b> has ten points almost exactly on one line and one outlier. The outlier tilts the fit line. Without it the correlation is close to 1.00.</li>
<li><b>Set IV</b> has ten points at the same x value, 8, and one point at x = 19. That single point alone decides the fit line. Without it, no line can be drawn.</li></ul></div>
<div class="card sec"><h3>What to do</h3><p class="small">Draw the scatter plot before you read r or the fit line. Look for a curve, an outlier, or points stacked at one x value. Check every outlier against the source record before you keep or remove it. Then report the summary and the picture together.</p></div>
<div class="card"><h3>Why this matters for business</h3><p class="small">The average order in the Sunrise Retail data is Rs ${IN(mean(NV))}. That number hides a skewed distribution (lesson 4). A flat yearly total hides a March peak (lesson 5). In this unit, every chart is drawn from the same 988 orders, so you can check each claim against the data.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Check that identical numbers can hide different pictures.</p><ol class="small"><li>Type two columns of numbers in A1:B11 (for example the X and Y values of one Anscombe set).</li><li>In D1 enter <code>=AVERAGE(B1:B11)</code>, in D2 <code>=STDEV.S(B1:B11)</code>, in D3 <code>=CORREL(A1:A11,B1:B11)</code>. Repeat for the next set.</li><li>Select the two columns and choose Insert &gt; Scatter. Compare the pictures: the numbers match, the shapes do not.</li></ol></div>
${task(["Download the data with the button in the right-hand panel and open it in Excel or Google Sheets.","Select <b>Units</b> (column F) and <b>NetSales</b> (column M) and insert a scatter plot.","Write one sentence: do orders with more units have a higher net sales? Then calculate <code>=CORREL(F2:F989,M2:M989)</code> and compare the number with what you see."])}

lesson({nav:"Choosing the right chart",title:"Choosing the right chart for the question",syl:"Choosing the right visualization, types of charts",
html:()=>`<p class="lead">A chart type is a tool for one kind of question. Write the question first, then choose the chart. If you choose the chart first, you will answer the question the chart happens to be good at, which may not be the one the reader asked.</p>
<div class="card"><h3>Five questions cover most business charts</h3><div class="tw sm"><table class="dt wrap"><thead><tr><th>You want to know</th><th>Chart</th><th>Why</th></tr></thead><tbody>
<tr><td>Which category is bigger?</td><td>Sorted bar chart</td><td>Bar length is easy to compare.</td></tr>
<tr><td>What share does each part hold?</td><td>Pie (up to 5 slices) or stacked bar</td><td>The parts add to one whole.</td></tr>
<tr><td>How did it change over time?</td><td>Line chart</td><td>The line follows the time order.</td></tr>
<tr><td>Do two numbers move together?</td><td>Scatter plot</td><td>One dot per case shows the pattern.</td></tr>
<tr><td>How are the values spread?</td><td>Histogram or box plot</td><td>Shows the typical value, the spread and the outliers.</td></tr></tbody></table></div></div>
<div class="card try"><h3>Try it: what do you want to know?</h3>
<div class="row"><select id="qsel" aria-label="Question">${Object.entries(QMAP).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join("")}</select></div>
<div class="grid2"><div id="qchart"></div><div><p><span class="tag g">Use</span> <b id="qbest"></b></p><p class="small" id="qwhy"></p><p><span class="tag b">Avoid</span> <span class="small" id="qavoid"></span></p></div></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The same 988 orders appear in five different charts. Each chart answers a different question. The bar chart ranks the regions, the pie shows how the four categories share the total, the line follows the months, the scatter plot compares units with net sales, and the histogram shows how order values are spread. None of these charts can answer the other four questions well.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Write the question as a sentence before you open the chart menu.</li><li>Look at the data types first: categories (region) need bars or a pie, numbers over time need a line, two numbers need a scatter plot.</li><li>A line implies order. Do not use it for regions, products or any categories without a natural order.</li><li>A pie works only when the slices add up to one whole and there are few of them.</li><li>If two charts could answer the question, choose the one the reader can read fastest.</li></ul></div>
<div class="card"><h3>Why the question comes first</h3><p class="small">A request such as "show me sales" is not yet a question. "Which region sold the least, and by how much?" is a question, and it points to a sorted bar chart. "Did sales grow this year?" points to a line chart. A vague request gives a vague chart, so ask what decision the chart will support before you choose anything. After you choose, run two checks. Can the reader answer the question in five seconds? Would a table be clearer? A table is the better choice when readers need exact values, not a pattern.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales</b> of bmt-sales-clean-reference.xlsx (988 orders in rows 2 to 989; Region is column C, Units F, PaymentMode K, NetSales M, Month P).</p><ol class="small"><li>Click any cell in the data and choose Insert &gt; Recommended Charts. Excel suggests charts for the columns you selected.</li><li>Do not accept the first suggestion. Ask the question first (compare, share, trend, distribution, relationship) and then pick the chart type from the table above.</li><li>To change the type later, click the chart and choose Chart Design &gt; Change Chart Type.</li></ol></div>
${task(["Write five questions that a store manager could ask about the Sunrise Retail data.","Choose the chart type for each question, using the table above.","Draw one of them from the CSV and check that the chart answers the question in one look."])}
${quizSet(2)}`,
mount(r){function draw(){const k=$("#qsel",r).value,q=QMAP[k];let c="";
    if(k==="compare")c=chartBar(regionItems(SALES,true),{w:420,h:260,title:"Net sales by region (Rs)"});
    else if(k==="part"){const g=sumBy(SALES,x=>x.cat);c=chartPie(CATS.map((n,i)=>({label:n,value:g[n]})),{})}
    else if(k==="trend")c=chartLine([{name:"Net sales",vals:monthly()}],MLAB,{w:420,h:260,title:"Net sales by month (Rs)",maxLabels:6});
    else if(k==="rel"){const s=SALES.filter((_,i)=>i%2===0);c=chartScatter(s.map(x=>({x:x.units,y:x.net,r:3})),{w:420,h:260,title:"Units vs net sales (Rs)",x0:0,x1:12,y0:0,xint:true,xlabel:"Units",alpha:.4})}
    else{const b=histBins(SALES.map(x=>x.net),20,0,5600);c=chartBar(b,{w:420,h:260,title:"Order value (histogram)",rotate:false,values:false,cat:"Bin start (Rs)",vlabel:"Orders"})}
    $("#qchart",r).innerHTML=c;$("#qbest",r).textContent=q[1];$("#qwhy",r).textContent=q[2];$("#qavoid",r).textContent=q[3]}
  $("#qsel",r).onchange=draw;draw();}
});
/* 3 Bar and pie */
lesson({nav:"Bar and pie charts",title:"Bar charts and pie charts",syl:"Bar charts, pie charts",
html:()=>`<p class="lead">A <b>bar chart</b> shows one value per category as the length of a bar. A <b>pie chart</b> shows each category as a slice of one whole. The two charts do different jobs: bars compare amounts, a pie shows shares.</p>
<div class="card try"><h3>Try it: region sales</h3>
<div class="row">${seg("bpt",[["bar","Bar"],["pie","Pie"]])} <label class="chk"><input type="checkbox" id="bps" checked> Sort high to low</label><label class="chk"><input type="checkbox" id="bpz"> Start axis at Rs 1,20,000 (cut axis)</label></div>
<div id="bpc"></div><div class="callout k small" id="bpn"></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The five regions have net sales between ${LK(EAS)} (East) and ${LK(CEN)} (Central). The true ratio of the largest to the smallest is <b>${RATIO.toFixed(2)}</b>. When you tick the cut axis, the tallest bar looks <b>${((CEN-120000)/(EAS-120000)).toFixed(1)} times</b> the shortest. Every number on the chart is still correct, but the picture now gives a wrong impression, because the eye compares bar lengths and not the numbers on the axis. Switch to the pie: five slices of 17 to 22 percent are almost the same angle, so you cannot rank them without reading the labels.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>The value axis of a bar chart starts at <b>zero</b> (a ${g("trunc","cut axis")} exaggerates differences).</li><li>Sort the bars from largest to smallest unless the categories have a natural order, such as months.</li><li>Use a pie only for a few slices (up to five) that add up to one whole. Otherwise use sorted bars.</li><li>Use horizontal bars when the labels are long.</li><li>Do not use 3D. It distorts the lengths and adds nothing.</li></ul><p class="small">The same gap between East and Central is described in three different ways in lessons 3, 7 and 11. Lesson 11 explains why all three are correct.</p></div>
<div class="card"><h3>Build the region chart in three steps</h3><ol class="small"><li>Choose the category column (Region) and the measure to add up (NetSales).</li><li>Total the measure for each category. A PivotTable does this in one step.</li><li>Draw the bars, sort them from largest to smallest, start the axis at zero, and write a title that says what the chart shows.</li></ol><p class="small">The same three steps work for products, categories or salespeople.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales</b> of bmt-sales-clean-reference.xlsx (988 orders in rows 2 to 989; Region is column C, Units F, PaymentMode K, NetSales M, Month P).</p><ol class="small"><li>Click a cell in the data and choose Insert &gt; PivotTable &gt; OK.</li><li>Drag <b>Region</b> to Rows and <b>NetSales</b> to Values (it shows Sum of NetSales).</li><li>Right-click a value, choose Sort &gt; Sort Largest to Smallest.</li><li>Click inside the pivot and choose Insert &gt; Column or Bar Chart &gt; Clustered Column. For a pie choose Insert &gt; Pie instead.</li><li>To keep the axis honest, right-click the vertical axis, choose Format Axis and set Minimum to 0. Try 120000 to see the exaggeration.</li></ol></div>
${task(["Build a PivotTable of net sales by Region from the CSV and draw a sorted column chart with the axis starting at zero.","Copy the chart and set the axis minimum to 120000. Put the two charts side by side.","Write one sentence that tells a reader what changed between the two and which one is honest."])}
${quizSet(3)}`,
mount(r){let t="bar";bindSeg(r,"bpt",v=>{t=v;draw()});
  function draw(){const so=$("#bps",r).checked,tr=$("#bpz",r).checked,it=regionItems(SALES,so);
    if(t==="pie")$("#bpc",r).innerHTML=chartPie(it.map(x=>({label:x.label,value:x.value})));
    else $("#bpc",r).innerHTML=chartBar(it,{w:620,h:300,title:"Net sales by region (Rs)",min:tr?120000:0,max:tr?170000:undefined,cat:"Region",vlabel:"Net sales (Rs)"});
    const mx=Math.max(...it.map(x=>x.value)),mn=Math.min(...it.map(x=>x.value));
    $("#bpn",r).innerHTML=t==="pie"?"Five slices of about 17 to 22 percent are hard to rank by eye. Use a bar.":tr?`<b>Misleading:</b> the true ratio of biggest to smallest region is ${(mx/mn).toFixed(2)} times, but the cut axis makes the tallest look ${((mx-120000)/(mn-120000)).toFixed(1)} times the smallest.`:`True picture: Central ${RS(mx)} vs East ${RS(mn)}, a ratio of ${(mx/mn).toFixed(2)}.`}
  $("#bps",r).onchange=draw;$("#bpz",r).onchange=draw;draw();}
});
/* 4 Histogram and box plot */
function boxSvg(vals,o={}){const q1=quant(vals,.25),q2=quant(vals,.5),q3=quant(vals,.75),iqr=q3-q1,lo=q1-1.5*iqr,hi=q3+1.5*iqr,mn=Math.min(...vals),mx=Math.max(...vals);
  const inside=vals.filter(v=>v>=lo&&v<=hi),wl=Math.min(...inside),wh=Math.max(...inside),out=vals.filter(v=>v>hi||v<lo);
  const W=640,H=130,m=30,top=Math.ceil(mx/500)*500,sx=v=>m+(v-0)/top*(W-2*m),y=64;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="box plot of order value"${TB(["Statistic","Rs"],[["Lowest whisker end",Math.round(wl*100)/100],["Q1",q1],["Median",q2],["Q3",q3],["Upper whisker end",Math.round(wh*100)/100],["Upper fence",hi],["Largest value",mx],["Values beyond the fence",out.length]])}>`;
  ticks(0,top,8).forEach(t=>s+=`<line class="gr" x1="${sx(t)}" x2="${sx(t)}" y1="30" y2="100"/><text class="lbl" x="${sx(t)}" y="118" text-anchor="middle">${num(t)}</text>`);
  s+=`<line x1="${sx(wl)}" x2="${sx(q1)}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-width="2"/><line x1="${sx(q3)}" x2="${sx(wh)}" y1="${y}" y2="${y}" stroke="var(--fg)" stroke-width="2"/>`;
  s+=`<rect x="${sx(q1)}" y="${y-18}" width="${sx(q3)-sx(q1)}" height="36" fill="var(--pri-soft)" stroke="var(--pri)" stroke-width="2"/><line x1="${sx(q2)}" x2="${sx(q2)}" y1="${y-18}" y2="${y+18}" stroke="var(--sec)" stroke-width="3"/>`;
  out.forEach(v=>s+=`<circle cx="${sx(v)}" cy="${y}" r="3" fill="var(--bad)" fill-opacity=".6"/>`);
  return {svg:s+"</svg>",q1,q2,q3,iqr,hi,lo,out:out.length};}
lesson({nav:"Histogram and box plot",title:"Histograms and box plots: seeing the distribution",syl:"Histograms, box plots (distribution of data)",
html:()=>`<p class="lead">The ${g("distribution")} of a column tells you where most values lie and how far they extend. Two charts show it. A <b>${g("histogram")}</b> cuts the number line into ${g("bin","bins")} and counts how many values fall in each. A <b>box plot</b> shows the middle half of the data as a box and marks the unusual values separately.</p>
<div class="card try"><h3>Try it: order value (NetSales, 988 orders)</h3>
<div class="row">Number of bins: <input type="range" id="hb" min="5" max="60" value="20" aria-label="Number of bins"> <b id="hbv">20</b></div>
<div id="hc"></div><div class="callout k small" id="hn"></div></div>
<div class="card try"><h3>Box plot of the same data</h3><div id="bc"></div><div id="bn" class="small"></div>
<div class="code">In a sheet:  =QUARTILE.INC(M2:M989,1)   =MEDIAN(M2:M989)   =QUARTILE.INC(M2:M989,3)\nUpper fence = Q3 + 1.5 x (Q3 - Q1)   then   =COUNTIF(M2:M989,"&gt;"&amp;fence)</div></div>
<div class="card"><h3>How to read a box plot</h3><ul class="small"><li>The <b>box</b> runs from ${g("quartile","Q1")} to Q3. It holds the middle half of the values. Its length is the ${g("iqr")}.</li><li>The <b>line</b> inside the box is the ${g("median")}.</li><li>The <b>whiskers</b> reach the furthest values that are still inside the ${g("fence","fences")}.</li><li>The <b>dots</b> are values beyond a fence. They are the ${g("outlier","outliers")}.</li></ul></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Half of all orders are below Rs ${IN(QN[1])} (the median) and three quarters are below Rs ${IN(QN[2])}. The mean is Rs ${IN(mean(NV))}, well above the median. The upper fence is Rs ${num(FENCE)}, and ${NOUT} orders lie beyond it. The data is ${g("skew","right-skewed")}: most orders are small and a few are large. Move the bin slider. With 5 bins the shape disappears, and with 60 bins the bars become jagged. Between 15 and 25 bins shows the shape clearly for about a thousand values.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>For skewed data report the median, and give the mean only with a note.</li><li>Choose a bin count that shows the shape without noise. Try several.</li><li>Check an outlier against the source before you delete it. Here the large orders are real purchases, not errors.</li><li>Use a box plot to compare several groups side by side. Use a histogram to see one distribution in detail.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales</b> of bmt-sales-clean-reference.xlsx (988 orders in rows 2 to 989; Region is column C, Units F, PaymentMode K, NetSales M, Month P).</p><ol class="small"><li>Select the NetSales column, M2:M989.</li><li>Choose Insert &gt; Insert Statistic Chart &gt; Histogram. Right-click the horizontal axis, choose Format Axis and set Bin width (for example 500).</li><li>For the box plot choose Insert &gt; Insert Statistic Chart &gt; Box and Whisker.</li><li>Check the picture with numbers: <code>=MEDIAN(M2:M989)</code>, <code>=AVERAGE(M2:M989)</code>, <code>=QUARTILE.INC(M2:M989,1)</code> and <code>=QUARTILE.INC(M2:M989,3)</code>. If the average is above the median, the data is right-skewed.</li></ol></div>
${task(["Select <b>NetSales</b> (M2:M989) in the CSV and insert a histogram. Try bin widths of 250 and 1000.","Write one sentence about the shape of the distribution.","Calculate Q1, the median, Q3 and the upper fence, and count how many orders lie above the fence."])}
${quizSet(4)}`,
mount(r){const v=NV;
  function h(){const n=+$("#hb",r).value;$("#hbv",r).textContent=n;const b=histBins(v,n,0,5600);$("#hc",r).innerHTML=chartBar(b,{w:640,h:300,title:"Order value histogram, "+n+" bins",values:false,ylabel:"Orders",cat:"Bin start (Rs)",vlabel:"Orders"});
    $("#hn",r).textContent=n<=8?"Too few bins hide the shape.":n>=45?"Too many bins make it jagged and noisy.":"Most orders are small, and a long tail of large orders stretches to the right. Mean "+fmt(mean(v))+" is above median "+fmt(median(v))+"."}
  $("#hb",r).oninput=h;h();
  const b=boxSvg(v);$("#bc",r).innerHTML=b.svg;$("#bn",r).innerHTML=`Q1 <b>${fmt(b.q1)}</b>, median <b>${fmt(b.q2)}</b>, Q3 <b>${fmt(b.q3)}</b>, IQR ${fmt(b.iqr)}. Upper fence <b>${fmt(b.hi)}</b>, so <b>${b.out} orders</b> lie beyond it (red dots). They are real big orders, not errors: check before deleting.`;}
});
/* 5 Line, area, trend */
lesson({nav:"Line, area and trend",title:"Line charts, area charts and trend lines",syl:"Line charts, area charts, trend analysis",
html:()=>`<p class="lead">A <b>line chart</b> shows how a value changes over time. It needs a ${g("timeseries")}: values in time order. An <b>area chart</b> fills the space under the line to stress volume. A <b>trend line</b> is the ${g("fitline")} through the points, and a ${g("movavg")} smooths short-term noise.</p>
<div class="card try"><h3>Try it: monthly net sales</h3>
<div class="row">${seg("lt",[["line","Line"],["area","Area"]])} <label class="chk"><input type="checkbox" id="lta"> Trend line</label><label class="chk"><input type="checkbox" id="ltm"> Moving average of <input type="range" id="ltw" min="2" max="6" value="3" aria-label="Moving average length"> <b id="ltwv">3</b> months</label></div>
<div id="lc"></div><div class="callout k small" id="ln"></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Average monthly net sales are ${RS(AVGM)}. The peak is <b>${MLAB[PK]}</b> at ${RS(M12[PK])} and the low is <b>${MLAB[LW]}</b> at ${RS(M12[LW])}. ${BELOW} of the 12 months fall below the average. Tick the trend line. It is almost flat, and its ${g("rsquared")} is only ${(()=>{const f=linfit(M12.map((_,i)=>i+1),M12);return (f.r*f.r).toFixed(4)})()}, which means that time explains less than 1 percent of the ups and downs. The data does not support a claim of growth. The moving average shows the same thing in another way: the smoothed line stays close to the average.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Put time on the x-axis, in order, and join the points with a line.</li><li>Use an area chart for one series (a total) and start the axis at zero. Do not stack many areas.</li><li>Add a trend line only to test a claim, and report R-squared next to it. An R-squared near 0 means there is no trend to report.</li><li>Use a moving average to see the pattern, not to predict the future.</li><li>Label the peak and the low directly, so the reader does not need to search.</li></ul></div>
<div class="card"><h3>How to read a line chart</h3><p class="small">Check four things in this order: the direction (up, down or flat), the size of the swings compared with the average, any month far from the others, and whether a pattern repeats. With only 12 months you cannot test whether a pattern repeats every year, so say "in this year" and do not generalise. When the peak month is the finding, name it in the title.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales</b> of bmt-sales-clean-reference.xlsx (988 orders in rows 2 to 989; Region is column C, Units F, PaymentMode K, NetSales M, Month P).</p><ol class="small"><li>Build a PivotTable with <b>Month</b> (column P) in Rows and <b>NetSales</b> in Values.</li><li>Click inside it and choose Insert &gt; Line (or Area).</li><li>Click the line, then the + button next to the chart &gt; Trendline &gt; More Options, and tick Display R-squared value on chart.</li><li>Check by formula: <code>=RSQ(B2:B13,A2:A13)</code> where A holds month numbers 1 to 12 and B the monthly totals. A value near 0 means no real trend.</li></ol></div>
${task(["Build a PivotTable of net sales by <b>Month</b> (column P) from the CSV and draw a line chart.","Add a trend line and display R-squared on the chart.","Write one sentence that says whether sales are growing, and use the R-squared value as your evidence."])}
${quizSet(5)}`,
mount(r){const m=M12;let t="line";bindSeg(r,"lt",v=>{t=v;d()});
  function d(){const w=+$("#ltw",r).value;$("#ltwv",r).textContent=w;const s=[{name:"Net sales",vals:m,color:"var(--c1)"}];
    const xs=m.map((_,i)=>i+1),f=linfit(xs,m),r2=f.r*f.r;
    if($("#lta",r).checked)s.push({name:"Trend",vals:xs.map(x=>f.m*x+f.b),color:"var(--c2)",dash:true});
    if($("#ltm",r).checked)s.push({name:w+"-month average",vals:m.map((_,i)=>i+1<w?null:mean(m.slice(i-w+1,i+1))),color:"var(--c3)",dash:true});
    $("#lc",r).innerHTML=chartLine(s,MLAB,{w:640,h:320,title:"Net sales by month (Rs)",area:t==="area",min:0,cat:"Month",marks:[{i:PK,v:m[PK],text:"Peak "+lakh(m[PK])},{i:LW,v:m[LW],text:"Low "+lakh(m[LW]),color:"var(--bad)"}]});
    $("#ln",r).innerHTML=`Peak: <b>${MLAB[PK]}</b> (${RS(m[PK])}). Low: <b>${MLAB[LW]}</b> (${RS(m[LW])}). Trend slope ${f.m.toFixed(0)} rupees per month, R-squared <b>${r2.toFixed(4)}</b>: ${r2<.1?"practically no trend. Do not claim growth.":"some trend."}`}
  $("#lta",r).onchange=d;$("#ltm",r).onchange=d;$("#ltw",r).oninput=d;d();}
});
/* 6 Scatter and bubble */
const NF={units:"Units",mrp:"MRP (Rs)",disc:"Discount %",net:"Net sales (Rs)",rating:"Rating"};
const DISCRETE=["units","disc","rating"];
lesson({nav:"Scatter and bubble charts",title:"Scatter plots and bubble charts: relationships",syl:"Scatter plots, bubble charts, correlation",
html:()=>`<p class="lead">A <b>scatter plot</b> puts one number on each axis and draws one dot per case. It answers the question: do these two numbers move together? A <b>${g("bubble")}</b> adds a third number as the size of the dot. The ${g("correlation","correlation r")} summarises the straight-line pattern in one number from -1 to +1.</p>
<div class="card try"><h3>Try it: pick two columns (orders)</h3>
<div class="row">x: <select id="sx" aria-label="x column">${Object.entries(NF).map(([k,v])=>`<option value="${k}" ${k==="units"?"selected":""}>${v}</option>`).join("")}</select> y: <select id="sy" aria-label="y column">${Object.entries(NF).map(([k,v])=>`<option value="${k}" ${k==="net"?"selected":""}>${v}</option>`).join("")}</select> <label class="chk"><input type="checkbox" id="sf" checked> Trend line</label></div>
<div id="sc"></div><div class="callout k small" id="sn"></div><p class="small muted" id="sd"></p></div>
<div class="card try"><h3>Bubble chart: products</h3><p class="small muted">x = MRP (Rs), y = units sold, bubble size = net sales (Rs).</p><div id="bub"></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Units against net sales gives a cloud of dots that rises to the right, with r = <b>${corr(SALES.map(x=>x.units),NV).toFixed(2)}</b>. That is expected, because net sales are units times price. Now choose Discount % against Units. The dots form four vertical stripes, because discount takes only four values (0, 5, 10 and 15), and r is close to zero (${corr(SALES.map(x=>x.disc),SALES.map(x=>x.units)).toFixed(2)}). The discounts in this shop do not visibly lift the units sold. A scatter plot works best when both columns have many different values. When a column has only a few values, the dots stack in stripes and several dots hide behind each other. The chart adds a small random shift (jitter) to separate them.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Read the picture first, then r. A high r is a summary of a picture that you have already looked at.</li><li>Correlation does not show cause. Two columns can move together because a third one drives both.</li><li>A trend line only helps when the dots roughly follow a line.</li><li>Choose a bubble chart only when a third number matters, and scale the <b>area</b> of the bubble, not the radius.</li></ul></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales</b> of bmt-sales-clean-reference.xlsx (988 orders in rows 2 to 989; Region is column C, Units F, PaymentMode K, NetSales M, Month P).</p><ol class="small"><li>Select Units (F2:F989), then hold Ctrl and select NetSales (M2:M989).</li><li>Choose Insert &gt; Scatter. Click the + button next to the chart and add a Trendline.</li><li>Find the correlation: <code>=CORREL(F2:F989,M2:M989)</code>. A high value shows the columns move together; it does not show that one causes the other.</li><li>For a bubble chart choose Insert &gt; Scatter or Bubble Chart &gt; Bubble. Put one measure on X, one on Y and a third (such as total units) as the bubble size.</li></ol></div>
${task(["Plot <b>Units</b> (x) against <b>NetSales</b> (y) from the CSV, add a trend line and calculate <code>=CORREL(F2:F989,M2:M989)</code>.","Plot <b>DiscountPct</b> (column H) against <b>NetSales</b>. Explain in one sentence why the dots form stripes.","Write one sentence about whether discounts help sales in this data."])}
${quizSet(6)}`,
mount(r){function d(){const a=$("#sx",r).value,b=$("#sy",r).value,rows=SALES.filter(x=>x[a]!=null&&x[b]!=null),xs=rows.map(x=>x[a]),ys=rows.map(x=>x[b]),f=linfit(xs,ys),jit=(k)=>DISCRETE.includes(k)?(Math.random()-.5)*.35:0;
    const ints=k=>DISCRETE.includes(k);
    $("#sc",r).innerHTML=chartScatter(rows.map(x=>({x:Math.max(0,x[a]+jit(a)),y:Math.max(0,x[b]+jit(b)),r:2.8})),{w:640,h:330,title:NF[a]+" vs "+NF[b],xlabel:NF[a],ylabel:NF[b],fit:$("#sf",r).checked?f:null,y0:0,x0:0,x1:Math.ceil(Math.max(...xs)*1.04),xint:ints(a),yint:ints(b),alpha:.35});
    const R=f.r,ab=Math.abs(R);$("#sn",r).innerHTML=ab<.1?`Correlation r = <b>${R.toFixed(3)}</b>: no linear relationship.`:`Correlation r = <b>${R.toFixed(3)}</b> (${ab<.3?"very weak":ab<.5?"weak":ab<.7?"moderate":"strong"}, ${R>0?"positive":"negative"}). ${a==="units"&&b==="net"?"Net sales grow with units, as they must (it is units x price).":a==="disc"&&b==="units"?"Discounts do not visibly lift units here.":"Check whether the pattern makes business sense."}`;
    const dis=[a,b].filter(ints).map(k=>`${NF[k]} has only ${new Set(rows.map(x=>x[k])).size} different values`);
    $("#sd",r).textContent=dis.length?dis.join(" and ")+", so many dots share one position and form stripes. A small random shift (jitter) has been added so that they do not hide each other.":"Both columns have many different values, so the dots form a cloud."}
  ["sx","sy","sf"].forEach(i=>$("#"+i,r).onchange=d);d();
  const g=groupBy(SALES,x=>x.product),pts=Object.entries(g).map(([p,rs],i)=>({x:rs[0].mrp,y:sum(rs.map(z=>z.units)),r:Math.max(5,Math.sqrt(sum(rs.map(z=>z.net)))/9),label:p,color:PAL[i%6]}));
  $("#bub",r).innerHTML=chartScatter(pts,{w:640,h:340,xlabel:"MRP (Rs)",ylabel:"Units sold",labels:true,x0:0,x1:1000,alpha:.5});}
});
/* 7 Colour, shape, size, labels, data-ink */
lesson({nav:"Colour, labels and data-ink",title:"Colour, shape, size, labelling and data-ink",syl:"Design principles: colour, shape, size, labelling, data-ink ratio",
html:()=>`<p class="lead">Every mark on a chart should carry information. The statistician Edward Tufte called the part of a chart that shows data the ${g("dataink")}. The rest is decoration. A good chart keeps the data-ink, removes the decoration, and uses colour only to point at the finding.</p>
<div class="card try"><h3>Try it: tidy the chart</h3>
<div class="row"><label class="chk"><input type="checkbox" id="c1"> Rainbow colours</label><label class="chk"><input type="checkbox" id="c2" checked> Highlight the top region only</label><label class="chk"><input type="checkbox" id="c3" checked> Value labels on bars</label><label class="chk"><input type="checkbox" id="c4" checked> Sort bars</label></div>
<div id="cc"></div><div class="callout k small" id="cn"></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Tick rainbow colours. Each region gets its own colour, but the colours mean nothing, so the reader looks for a legend that is not there. Now tick the highlight. Central is blue and the other four regions are grey. The eye goes straight to Central, and the title says what to notice: Central leads, and East is about ${Math.round(100*(1-1/RATIO))} percent below it. Value labels let the reader see exact numbers without the gridlines. The title, the highlight and the labels together carry the message in a few seconds. (Lesson 11 shows why this percentage depends on the base you choose.)</p></div>
<div class="card sec"><h3>Rules to follow</h3><div class="grid2"><div><span class="pill"><b>Colour</b>: one highlight colour, the rest grey. Keep strong contrast with the background.</span><span class="pill"><b>Shape</b>: bars compare, lines connect, dots show relationships.</span><span class="pill"><b>Size</b>: the area must match the value. Scale the area of a bubble, not its radius.</span></div><div><span class="pill"><b>Labels</b>: the title states the finding. Label bars and lines directly. Show units (Rs) and the source.</span><span class="pill"><b>Data-ink</b>: delete the 3D effect, heavy gridlines, borders and a legend that repeats the title.</span><span class="pill"><b>Accessibility</b>: do not rely on red against green alone. About 1 in 12 men cannot tell them apart.</span></div></div></div>
<div class="card"><h3>Worked example</h3><p class="small">Start with the region chart drawn with five colours, a legend, heavy gridlines and the title "Chart". Make four bars grey and Central blue. Delete the legend and the gridlines. Add value labels. Replace the title with the finding. The chart now has fewer marks and a clearer message. That is the data-ink idea at work: take away what carries no information, and what is left is easier to read.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Use the pivot chart from lesson 3.</p><ol class="small"><li>Click the chart, then choose Chart Design &gt; Change Colors, or click one bar twice and use Format Data Point &gt; Fill to colour only the bar that matters.</li><li>Colour the other bars grey. One accent colour is enough.</li><li>Click the gridlines and press Delete. Delete the legend if there is one series.</li><li>Choose Chart Design &gt; Add Chart Element &gt; Data Labels, so readers do not need the axis.</li></ol></div>
${task(["Take the sorted region chart from lesson 3 in your spreadsheet.","Colour only the Central bar and make the others grey. Delete the gridlines and add data labels.","Replace the title with a sentence that states the finding."])}
${quizSet(7)}`,
mount(r){function d(){const rb=$("#c1",r).checked,hi=$("#c2",r).checked,vl=$("#c3",r).checked,so=$("#c4",r).checked;
    const it=regionItems(SALES,so,(x,i)=>rb?PAL[i%5]:hi?(x.label==="Central"?"var(--c1)":"var(--muted)"):"var(--c1)");
    $("#cc",r).innerHTML=chartBar(it,{w:620,h:300,title:hi?"Central leads net sales; East is about "+Math.round(100*(1-1/RATIO))+"% below it":"Net sales by region (Rs)",values:vl,cat:"Region",vlabel:"Net sales (Rs)"});
    $("#cn",r).textContent=rb?"Rainbow colours carry no meaning here: the eye hunts for a legend that does not exist.":hi?"Grey for context, one colour for the finding. The title states the message.":"Plain single colour is fine, but nothing tells the viewer where to look."}
  ["c1","c2","c3","c4"].forEach(i=>$("#"+i,r).onchange=d);d();}
});
/* 8 Fix a bad chart */
const BAD=[["Starts at zero (not cut)","The axis starts at Rs 1,20,000, so differences look huge."],["Sorted","Bars are in random order."],["Title states the insight","The title is missing or only a topic."],["One calm colour (plus a highlight)","Rainbow colours with no meaning."],["Value labels instead of a busy grid","Readers cannot read exact values."]];
lesson({nav:"Fix a bad chart",title:"Common visualization mistakes: fix a bad chart",syl:"Common mistakes in data visualization, best practices",
html:()=>`<p class="lead">Most bad charts repeat the same few mistakes. They are easy to name and easy to fix. This lesson starts from a chart that contains five of them. Tick each fix and watch the chart improve.</p>
<div class="card try"><h3>Try it: tick each fix</h3><div class="row">${BAD.map((b,i)=>`<label class="chk"><input type="checkbox" id="f${i}"> ${b[0]}</label>`).join("")}</div>
<div id="fc"></div><div class="callout k small" id="fn"></div><p class="small" id="fs"></p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The starting chart uses a ${g("trunc","cut axis")}, random order, a title that says only "Chart 1", rainbow colours and no value labels. Fix the axis first: the gap between the largest and smallest bar shrinks from about ${((CEN-120000)/(EAS-120000)).toFixed(1)} times to the true ${RATIO.toFixed(2)} times. That one change alters the conclusion a reader draws. The other four fixes make the chart faster to read, but they do not change what it says. When you fix a chart, work in this order: first anything that distorts the data (axis, scale, 3D), then anything that hides the message (title, order, colour), then anything that adds clutter (gridlines, borders, repeated legends).</p></div>
<div class="card sec"><h3>Checklist before you show a chart</h3><ul class="small"><li>Do the bars start at zero? Is any 3D effect or second axis distorting the values?</li><li>Are the categories sorted, or in their natural order?</li><li>Does the title state the finding? Are units (Rs), source and period shown?</li><li>Does colour mean something, or is it decoration?</li><li>Can a reader find an exact value without guessing?</li></ul><p class="small">Other common mistakes: a pie with many slices, a line chart for unordered categories, two vertical axes with different scales, and comparing sizes by the radius of a circle.</p></div>
<div class="card"><h3>A five-second test</h3><p class="small">Show the chart to someone for five seconds, then hide it and ask what it said. If the answer is not your finding, the problem is in the labels, the order or the colour, and you should fix those first.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Open a bad chart (3D, truncated axis, unsorted, no title) and repair it.</p><ol class="small"><li>Click the chart and choose Chart Design &gt; Change Chart Type. Pick a flat 2D type.</li><li>Right-click the vertical axis &gt; Format Axis &gt; set Minimum to 0.</li><li>Sort the data from largest to smallest in the pivot.</li><li>Click the chart title and replace it with a title that states the finding. Add axis titles with Chart Design &gt; Add Chart Element &gt; Axis Titles.</li></ol></div>
${task(["Make a bad chart on purpose from the CSV: 3D columns, unsorted, axis cut at 120000, rainbow colours, title 'Chart 1'.","Fix it one problem at a time and save a copy after each fix.","List the five changes and say which one altered the message most."])}
${quizSet(8)}`,
mount(r){function d(){const f=BAD.map((_,i)=>$("#f"+i,r).checked);
    let it=regionItems(SALES,f[1],(x,i)=>f[3]?(x.label==="Central"?"var(--c1)":"var(--muted)"):PAL[i%5]);
    $("#fc",r).innerHTML=chartBar(it,{w:620,h:300,title:f[2]?"Central region leads net sales ("+LK(CEN)+")":"Chart 1",min:f[0]?0:120000,max:f[0]?undefined:170000,values:f[4],cat:"Region",vlabel:"Net sales (Rs)"});
    const n=f.filter(Boolean).length;$("#fs",r).innerHTML=`Fixes applied: <b>${n} of 5</b>`;
    const first=f.findIndex(x=>!x);$("#fn",r).textContent=first<0?"A clean chart: honest axis, ordered, clear message, calm colour, direct labels.":"Still wrong: "+BAD[first][1]}
  BAD.forEach((_,i)=>$("#f"+i,r).onchange=d);d();}
});
/* 9 Storytelling */
lesson({nav:"Storytelling with data",title:"Data storytelling",syl:"Storytelling with data, communicating insights",
html:()=>`<p class="lead">A chart is not yet a story. A story has three parts: the <b>context</b> (what is normal), the <b>insight</b> (what is different or has changed) and the <b>action</b> (what the reader should do). Each part gets one chart and one sentence.</p>
<div class="card try"><h3>Try it: build a story from the data</h3><div class="row">${seg("stv",[["1","1. Context"],["2","2. Insight"],["3","3. Action"]],"s")}</div>
<div class="grid2"><div id="stc"></div><div><h2 id="sth"></h2><p id="stt"></p><p class="small muted">Edit the headline to say what <i>you</i> would present:</p><input type="text" id="sti" style="width:100%" aria-label="Your headline"></div></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The context chart shows an ordinary month, about ${RS(AVGM)}, with the average drawn as a dashed line. The insight chart colours one bar: ${MLAB[PK]} is ${Math.round(100*(M12[PK]/AVGM-1))} percent above the average, and ${BELOW} of the 12 months are below it. The action chart compares the best region, ${TOPR[0]}, with the weakest, ${TOPR[4]}, and the headline names the next step. Each headline is a full sentence. If someone reads only the three headlines, they still get the message.</p></div>
<div class="card sec"><h3>A good title says the insight</h3><p class="small"><b>Weak:</b> "Sales by month". <b>Strong:</b> "March is our biggest month, and ${BELOW} of the 12 months fall below the average." Test: could someone read only the titles and get your message?</p><ul class="small"><li>Know the audience and the decision they must make before you draw anything.</li><li>Give one message per chart.</li><li>Claim only what the data supports. A peak month is not growth (lesson 5), and a high correlation is not cause (lesson 6).</li><li>End with an action that someone can take.</li></ul></div>
<div class="card"><h3>How to write the action</h3><p class="small">An action is something a named person can do. "Improve East" is a wish. "Ask the East store manager to compare the product mix with Central for one month" is an action. If you cannot write an action, you may not have an insight yet. Return to the data and ask a more specific question.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Turn a chart into a story slide.</p><ol class="small"><li>Replace the chart title with the finding, for example "March is our biggest month, and six months fall below the average".</li><li>Add the average line: in a helper column enter <code>=AVERAGE($B$2:$B$13)</code> in every row and add it to the chart as a second series.</li><li>Colour the peak month with the accent colour and the rest grey. Add one text box with Insert &gt; Text Box for the action the reader should take.</li></ol></div>
${task(["Choose three charts from this unit and write a context headline, an insight headline and an action headline for them.","Present the three headlines to a partner in 60 seconds, without reading the numbers aloud.","Ask your partner what they would do next. If it is not your action, rewrite the headlines."])}
${quizSet(9)}`,
mount(r){const m=M12,avg=AVGM,pk=PK,below=BELOW;const g=BYREG;const top=TOPR;
  const S={1:["Context: a typical month is about Rs "+IN(avg),`Over 12 months, average net sales are ${RS(avg)} per month. Sales are flat, with ups and downs.`,()=>chartLine([{name:"Net sales",vals:m},{name:"Average",vals:m.map(()=>avg),dash:true,color:"var(--c2)"}],MLAB,{w:420,h:260,maxLabels:6,cat:"Month"})],
   2:["Insight: "+MLAB[pk]+" is "+Math.round(100*(m[pk]/avg-1))+"% above average",`${MLAB[pk]} sold ${RS(m[pk])}. ${below} of 12 months fell below the average.`,()=>chartBar(MLAB.map((l,i)=>({label:l,value:Math.round(m[i]),color:i===pk?"var(--c2)":"var(--muted)"})),{w:420,h:260,rotate:true,values:false,cat:"Month",vlabel:"Net sales (Rs)"})],
   3:["Action: learn from "+top[0]+" and lift "+top[4],`${top[0]} leads (${RS(g[top[0]])}). ${top[4]} trails by ${Math.round(100*(1-g[top[4]]/g[top[0]]))}%. Find what ${top[0]} does differently, then test it in ${top[4]}.`,()=>chartBar(regionItems(SALES,true,(x)=>x.label===top[0]?"var(--c1)":x.label===top[4]?"var(--c2)":"var(--muted)"),{w:420,h:260,cat:"Region",vlabel:"Net sales (Rs)"})]};
  function d(v){const s=S[v];$("#stc",r).innerHTML=s[2]();$("#sth",r).textContent=s[0];$("#stt",r).textContent=s[1];$("#sti",r).value=s[0]}
  d("1");bindSeg(r,"stv",d);}
});
/* 10 Dashboards */
lesson({hero:true,nav:"Dashboards and slicers",title:"Dashboards: one screen, one decision",syl:"Dashboards, interactive visualization (Power BI / Excel)",
html:()=>`<p class="lead">A ${g("dashboard")} puts the few numbers and charts a decision-maker needs on <b>one screen</b>. The numbers at the top are ${g("kpi","KPIs")}. ${g("slicer","Slicers")} (filters) let the reader change the view without rebuilding anything. Power BI, Excel and Google Sheets can all build dashboards.</p>
<div class="card try"><h3>Try it: slice the Sunrise dashboard</h3>
<div class="row">Region <select id="dr" aria-label="Region"><option value="">All</option>${REGIONS.map(x=>`<option>${x}</option>`).join("")}</select> Category <select id="dc" aria-label="Category"><option value="">All</option>${CATS.map(x=>`<option>${x}</option>`).join("")}</select> Segment <select id="ds" aria-label="Segment"><option value="">All</option><option>Corporate</option><option>Retail</option><option>Student</option></select></div>
<div class="grid3" id="dk"></div><p class="small muted">Profit margin = (Net sales - Units x Cost price) / Net sales. Cost price is shown in the Live data panel.</p><div class="grid2"><div id="d1"></div><div id="d2"></div></div><div id="d3"></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">With all filters on All, the dashboard shows 988 orders, net sales of ${RS(sum(NV))} and a profit margin of ${MARGIN.toFixed(1)} percent. Choose East in the region slicer. Every number and every chart changes at once: the margin becomes ${(100*sum(SALES.filter(x=>x.region==="East").map(x=>x.profit))/sum(SALES.filter(x=>x.region==="East").map(x=>x.net))).toFixed(1)} percent. You asked one question ("how is East doing?") and the whole page answered it. In Power BI the same effect comes from clicking a bar: the other charts filter to match, which is called ${g("crossfilter")}.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Build the dashboard for one decision and one audience. Write the decision at the top before you add any chart.</li><li>Use three to five KPIs and no more than four charts. If everything is shown, nothing stands out.</li><li>Define every KPI. A number that a reader cannot reproduce from visible data should not be on the page.</li><li>Put the most important number at the top left, where the eye starts.</li><li>Use the same colour for the same thing on every chart.</li></ul></div>
<div class="card"><h3>Order of work</h3><p class="small">Build a dashboard in this order: write the decision it supports, choose three to five KPIs, add the charts that explain those KPIs, add slicers for the groups the decision-maker cares about, and test every slicer combination. Some combinations return no rows. The dashboard should then say so clearly, as the demo does, and not show an empty chart.</p></div>
<div class="card"><h3>Do it in Excel</h3><p class="small muted">Data: sheet <b>Sales</b> of bmt-sales-clean-reference.xlsx (988 orders in rows 2 to 989; Region is column C, Units F, PaymentMode K, NetSales M, Month P).</p><ol class="small"><li>Insert a PivotTable and a PivotChart: Insert &gt; PivotChart.</li><li>Click the PivotChart and choose PivotChart Analyze &gt; Insert Slicer. Tick Region, Category and Segment.</li><li>For dates choose Insert &gt; Timeline and tick OrderDate.</li><li>To make one slicer control several charts, right-click the slicer, choose Report Connections and tick every PivotTable.</li><li>Place the KPI cells (<code>=SUM(M2:M989)</code> and <code>=COUNTA(A2:A989)</code>) and two or three charts on one sheet. That sheet is your dashboard.</li></ol></div>
<div class="card"><h3>Build it in Power BI Desktop</h3><ol class="small"><li>Download the CSV with the button in the right-hand panel.</li><li>Open Power BI Desktop, choose Get data, Text/CSV, pick the file and choose Load.</li><li>Drag <b>NetSales</b> onto a Card visual. Drag <b>OrderID</b> onto another card and set it to Count.</li><li>Add a line chart (Month on the axis, NetSales as the value) and a clustered bar chart (Category and NetSales).</li><li>Add two Slicer visuals, one for Region and one for Segment.</li><li>Click a bar in one chart and watch the others filter.</li></ol></div>
${task(["Build a one-page dashboard from the CSV in Excel or Power BI Desktop: three KPI cards (net sales, orders, profit margin), a monthly line, a category bar, and slicers for Region and Segment.","Calculate the profit margin with <code>=(SUM(M2:M989)-SUMPRODUCT(F2:F989,Q2:Q989))/SUM(M2:M989)</code>. It should match "+MARGIN.toFixed(1)+" percent. Filter to East and check that you get the East figure shown above.","Write the decision the dashboard supports in one line at the top."])}
${quizSet(10)}`,
mount(r){function d(){const R=$("#dr",r).value,C=$("#dc",r).value,S=$("#ds",r).value,rows=SALES.filter(x=>(!R||x.region===R)&&(!C||x.cat===C)&&(!S||x.seg===S));
    const n=sum(rows.map(x=>x.net)),p=sum(rows.map(x=>x.profit));
    $("#dk",r).innerHTML=[["Net sales (Rs)",rows.length?RS(n):"-"],["Orders",rows.length],["Profit margin",rows.length?(100*p/n).toFixed(1)+"%":"-"]].map(k=>`<div class="kpi"><span class="small muted">${k[0]}</span><b>${k[1]}</b></div>`).join("");
    if(!rows.length){$("#d1",r).innerHTML=$("#d2",r).innerHTML=$("#d3",r).innerHTML='<div class="callout">No rows for this combination.</div>';return}
    $("#d1",r).innerHTML=chartLine([{name:"Net sales",vals:monthly(rows)}],MLAB,{w:420,h:240,title:"By month (Rs)",maxLabels:6,min:0,cat:"Month"});
    const g=sumBy(rows,x=>x.cat);$("#d2",r).innerHTML=chartBar(CATS.map(c=>({label:c,value:Math.round(g[c]||0),color:"var(--c2)"})),{w:420,h:240,title:"By category (Rs)",cat:"Category",vlabel:"Net sales (Rs)"});
    const gp=sumBy(rows,x=>x.product),tp=Object.entries(gp).sort((a,b)=>b[1]-a[1]).slice(0,6);$("#d3",r).innerHTML=chartBar(tp.map(x=>({label:x[0],value:Math.round(x[1]),color:"var(--c3)"})),{w:640,h:240,title:"Top products (Rs)",cat:"Product",vlabel:"Net sales (Rs)"})}
  ["dr","dc","ds"].forEach(i=>$("#"+i,r).onchange=d);d();}
});
/* 11 Tools, export, ethics */
lesson({nav:"Tools, exporting and ethics",title:"Visualization tools, exporting and ethical visualization",syl:"Visualization tools (Excel, Power BI, Tableau, Python), exporting, ethics",
html:()=>`<p class="lead">The tools differ, but the principles in lessons 1 to 10 are the same in all of them. Choose a tool by the audience, the size of the data and the budget. After the chart is made, you still have to export it and present it honestly.</p>
<div class="card"><div class="tw sm"><table class="dt wrap"><thead><tr><th>Tool</th><th>Best for</th><th>Notes</th></tr></thead><tbody>
<tr><td><b>Excel</b></td><td>Quick charts, small to medium data</td><td>Paid (Microsoft Office). Pivot charts and slicers.</td></tr>
<tr><td><b>Google Sheets</b></td><td>Free, shareable, collaborative</td><td>Runs in a browser. Good for a classroom.</td></tr>
<tr><td><b>Power BI Desktop</b></td><td>Dashboards and large data</td><td>Free desktop app (Windows). Cross-filtering visuals.</td></tr>
<tr><td><b>Tableau</b></td><td>Polished interactive dashboards</td><td>Check the current licensing before you recommend it.</td></tr>
<tr><td><b>Python (matplotlib)</b></td><td>Repeatable, automated charts</td><td>Needs coding. A short example is given below.</td></tr></tbody></table></div></div>
<div class="card try"><h3>Ethics: the same data, two stories</h3><p class="small muted">Sales for East and Central. Which chart would you be proud to show?</p>
<div class="row">${seg("et",[["h","Honest"],["m","Misleading"]],"s")}</div><div id="ec"></div><div class="callout k small" id="en"></div></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Both charts use the same two numbers: Central ${RS(CEN)} and East ${RS(EAS)}. The honest chart starts at zero and shows a gap you can see is real but moderate. The misleading chart cuts the axis and shouts "Central DOUBLES East". Nothing in it is false arithmetic, and it is still a lie, because the reader leaves with a wrong picture. A chart is ethical when a reader who looks at it for five seconds takes away what the data says. If the honest chart is not exciting, change the message, not the axis.</p></div>
<div class="card sec"><h3>One gap, three true statements</h3><p class="small">The gap between Central and East is described in three places in this unit.</p>
<div class="tw sm"><table class="dt wrap"><thead><tr><th>Statement</th><th>Where</th><th>Base</th><th>Calculation</th></tr></thead><tbody>
<tr><td>The ratio is ${RATIO.toFixed(2)}</td><td>Lesson 3</td><td>East</td><td>${IN(CEN)} / ${IN(EAS)}</td></tr>
<tr><td>East trails Central by about ${Math.round(100*(1-1/RATIO))} percent</td><td>Lesson 7</td><td>Central</td><td>1 - ${IN(EAS)} / ${IN(CEN)}</td></tr>
<tr><td>Central is about ${Math.round(100*(RATIO-1))} percent larger than East</td><td>This lesson</td><td>East</td><td>${IN(CEN)} / ${IN(EAS)} - 1</td></tr></tbody></table></div>
<p class="small">All three are correct. They differ because each uses a different base. The gap in rupees is the same, ${RS(CEN-EAS)}. The choice of base is also a choice about how big the gap looks: 20 percent sounds smaller than 25 percent. Choose the base that matches your question ("how far behind is East?" uses Central as the base), say which base you used, and keep it the same across slides.</p></div>
<div class="card"><h3>Exporting checklist</h3><p class="small">Export as PNG for slides, PDF for reports, and keep the source file. Check: readable at slide size, title says the insight, source and date in a footnote, and colours readable in grayscale.</p></div>
<div class="card"><h3>A chart in Python</h3><p class="small muted">Optional. Save the CSV from the right-hand panel in the same folder as the script.</p><div class="code">import pandas as pd
import matplotlib.pyplot as plt

df = pd.read_csv("sunrise-retail-sales.csv")
by_region = df.groupby("Region")["NetSales"].sum().sort_values(ascending=False)
ax = by_region.plot(kind="bar", color="#9a9a9a")
ax.patches[0].set_facecolor("#1f3fb5")   # highlight the largest bar
ax.set_ylim(0)                           # honest axis
ax.set_title("Central leads net sales by Rs ${IN(CEN-EAS)} over East")
