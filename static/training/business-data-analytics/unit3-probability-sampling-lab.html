<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Probability and Sampling Lab - Unit III</title>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#EFEBE1; --fg:#12110E; --muted:#44403A; --line:#B9B2A2; --line2:#D9D3C4;
  --pri:#1F3FB5; --pri-soft:#DDE5FA; --sec:#9A4208; --sec-soft:#FBE3CC;
  --good:#0F6A31; --good-soft:#D5F0DD; --warn:#744500; --warn-soft:#F9E8B8; --bad:#A31D12; --bad-soft:#FADAD5;
  --code:#EFEBE1; --on:#FFFFFF; --grid:#CFC9BA; --shadow:0 1px 2px rgba(18,17,14,.08),0 6px 18px rgba(18,17,14,.06);
  --c1:#1F3FB5; --c2:#9A4208; --c3:#0F6A31; --c4:#7A2A9C; --c5:#8A6D00; --c6:#B0235C;
  --disp:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --zoom:1;
}
:root[data-theme="dark"]{
  --bg:#0C0C0A; --surface:#181714; --surface2:#242320; --fg:#F7F4EA; --muted:#CFCABD; --line:#5B574B; --line2:#35332C;
  --pri:#9DB1FF; --pri-soft:#1B2350; --sec:#FFAE6B; --sec-soft:#40240E;
  --good:#6FE09A; --good-soft:#0F3320; --warn:#F5C964; --warn-soft:#3B2E0A; --bad:#FF9A8C; --bad-soft:#451A15;
  --code:#1F1E1A; --on:#0C0C0A; --grid:#46433A; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  --c1:#9DB1FF; --c2:#FFAE6B; --c3:#6FE09A; --c4:#D9A0FF; --c5:#F0D060; --c6:#FF8FB8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);zoom:var(--zoom)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;min-height:calc(100vh / var(--zoom))}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.brand{font-family:var(--disp);font-size:20px;line-height:1.15;margin:0 4px 4px}
.brand small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:4px}
.nav ol{list-style:none;margin:16px 0 0;padding:0}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.nav li button:hover{background:var(--surface2)}
.nav li button[aria-current="true"]{background:var(--pri-soft);font-weight:600}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.nav li.done .n{background:var(--good);color:var(--on);border-color:var(--good)}
.nav .t{font-size:13.5px;line-height:1.3}
.nav .hero .n{border-color:var(--sec);color:var(--sec)}
.tools{margin:18px 4px 0;display:grid;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;text-align:left}
.tools button:hover{border-color:var(--fg)}
.tools .hint{font-size:12px;color:var(--muted)}
main{padding:26px 30px 70px;min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px}
h2{font-family:var(--disp);font-size:20px;margin:0 0 8px}
h3{font-size:13.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.syl{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card.try{border-left:5px solid var(--pri)}
.card.sec{border-left:5px solid var(--sec)}
.lead{font-size:16.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.tag.p{background:var(--pri-soft);color:var(--pri)} .tag.s{background:var(--sec-soft);color:var(--sec)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)} .btn.sec{background:var(--sec);color:var(--on);border-color:var(--sec)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.dt td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:340px}
.tw.sm{max-height:none}
.new{animation:pop .6s ease both}
@keyframes pop{from{background:var(--sec-soft);transform:translateY(-4px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;overflow:auto;white-space:pre-wrap;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface2);border:1px solid var(--line2)}
.callout.k{background:var(--sec-soft);border-color:transparent} .callout.i{background:var(--pri-soft);border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on)}
.seg.s button[aria-pressed="true"]{background:var(--sec)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px}
input[type=range]{accent-color:var(--pri);vertical-align:middle}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
.live{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.live .tw{max-height:none}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arrow{font-size:28px;color:var(--sec);text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--surface)}
td.ix{background:var(--bad-soft)} td.iy{background:var(--warn-soft)} td.iz{background:var(--pri-soft)} td.chg{background:var(--good-soft)}
.cardsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.nextrow{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
svg.chart{width:100%;height:auto;display:block;max-height:420px}
svg.chart text{fill:var(--fg);font:12px var(--body)}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .gr{stroke:var(--grid);stroke-width:1}
svg.chart .lbl{fill:var(--muted)}
.sheet{border-collapse:collapse;font-size:13.5px;font-family:var(--mono);width:100%}
.sheet th{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:600;color:var(--muted)}
.sheet td{border:1px solid var(--line);padding:0;min-width:80px}
.sheet td input{width:100%;border:0;background:transparent;padding:4px 7px;font:inherit;border-radius:0}
.sheet td.sel{outline:2px solid var(--pri);outline-offset:-2px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.live{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav ol{display:flex;overflow:auto;gap:4px}.nav li{flex:none}.nav .t{display:none}main{padding:18px 16px 60px}.grid2,.grid3,.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}

</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Lessons">
    <h2 class="brand">Probability Lab<small>Unit III, Probability and Sampling<br>BBA Sem I, Business Management Tools I</small></h2>
    <ol id="navlist"></ol>
    <div class="tools"><button id="themeBtn" type="button">Theme</button><button id="zoomBtn" type="button">Text size</button><span class="hint">Projector tip: if text is hard to see, switch theme (or press Alt+D) and raise the text size.</span></div>
  </nav>
  <main id="stage" tabindex="-1"></main>
  <aside class="live" aria-label="Live data"><h3>Live data: Sunrise Retail</h3><div id="livebox"></div></aside>
</div>
<script>
"use strict";
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v==="number"?(Number.isInteger(v)?v.toLocaleString("en-US"):v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})):v;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,l=Math.floor(p);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(p-l)};
const mode=a=>{const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx).join(", ")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const groupBy=(rows,f)=>{const g={};rows.forEach(r=>{const k=f(r);(g[k]=g[k]||[]).push(r)});return g};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return a/Math.sqrt(b*c)};
const linfit=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2});const m=a/b;return {m,b:my-m*mx,r:corr(x,y)}};
function table(rows,cols,opts={}){
  const head=cols.map(c=>`<th>${esc(c[1])}</th>`).join("");
  const body=rows.map((r,i)=>`<tr${opts.newFrom!=null&&i>=opts.newFrom?' class="new"':''}>`+cols.map(c=>{
    const v=r[c[0]],cls=(typeof v==="number"?"num":"")+((opts.cellClass&&opts.cellClass(r,c[0],i))||"");
    return `<td class="${cls.trim()}">${v===""||v==null?'<span class="muted">(blank)</span>':esc(typeof v==="number"?fmt(v,c[2]!=null?c[2]:(Number.isInteger(v)?0:2)):v)}</td>`}).join("")+"</tr>").join("");
  return `<div class="tw${opts.small?' sm':''}"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const QUIZ={};
function quiz(id,q,opts,ans,why){QUIZ[id]={ans,why};
  return `<div class="card"><h3>Quick check</h3><p style="margin:0 0 6px"><b>${q}</b></p>`+opts.map((o,i)=>`<button class="opt" type="button" data-q="${id}" data-i="${i}">${o}</button>`).join("")+`<div class="small muted" id="why-${id}" style="margin-top:6px"></div></div>`;}
function regQuiz(id,ans,why){QUIZ[id]={ans,why}}
function seg(id,items,cls=""){return `<div class="seg ${cls}" id="${id}" role="group">`+items.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${i===0}">${x[1]}</button>`).join("")+`</div>`}
function bindSeg(root,id,fn){const g=$("#"+id,root);$$("button",g).forEach(b=>b.onclick=()=>{$$("button",g).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return ()=>$$("[aria-pressed=true]",g)[0].dataset.v}
const IN=n=>n.toLocaleString("en-US",{maximumFractionDigits:0});

/* ===== SVG charts (colours come from CSS variables, so both themes work) ===== */
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const nice=(max)=>{const e=Math.pow(10,Math.floor(Math.log10(max||1))),f=max/e;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*e};
function ticks(lo,hi,n=5){const out=[],st=(hi-lo)/n;for(let i=0;i<=n;i++)out.push(lo+st*i);return out}
const short=v=>Math.abs(v)>=100000?(v/100000).toFixed(1).replace(/\.0$/,"")+"L":Math.abs(v)>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":(Math.round(v*100)/100)+"";
function chartBar(items,o={}){ // items:[{label,value,color}]
  const W=o.w||640,H=o.h||320,m={l:56,r:14,t:o.title?34:16,b:o.rotate?70:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...items.map(i=>i.value))*1.08),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih,bw=iw/items.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"bar chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*.15,w=bw*.7,y=sy(Math.max(it.value,mn));
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(mn)-y)}" fill="${it.color||o.color||"var(--c1)"}" rx="2"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    if(o.values!==false&&items.length<=14)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="font-size:11px">${short(it.value)}</text>`;
    const lx=x+w/2,ly=H-m.b+16;s+=o.rotate?`<text x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-35 ${lx} ${ly})">${esc(it.label)}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(it.label)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return s+"</svg>";}
function chartLine(series,labels,o={}){ // series:[{name,vals,color,dash}]
  const W=o.w||640,H=o.h||320,m={l:56,r:o.legendRight?110:16,t:o.title?34:16,b:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null)),mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...all)*1.08);
  const sx=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"line chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  const step=Math.ceil(labels.length/(o.maxLabels||12));labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="lbl" x="${sx(i)}" y="${H-m.b+16}" text-anchor="middle">${esc(l)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  series.forEach((se,k)=>{const c=se.color||PAL[k%6];let d="";se.vals.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+sx(i).toFixed(1)+" "+sy(v).toFixed(1)});
    if(o.area&&k===0)s+=`<path d="${d}L${sx(se.vals.length-1)} ${sy(mn)}L${sx(0)} ${sy(mn)}Z" fill="${c}" opacity=".18"/>`;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${se.w||2.5}" ${se.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
    if(o.dots!==false&&!se.dash)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${c}"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`});
    if(o.legendRight)s+=`<text x="${W-m.r+8}" y="${m.t+14+k*16}" style="fill:${c};font-weight:600">${esc(se.name)}</text>`;
    else if(series.length>1)s+=`<text x="${m.l+8+k*150}" y="${H-6}" style="fill:${c};font-weight:600">&#9632; ${esc(se.name)}</text>`});
  (o.marks||[]).forEach(mk=>{s+=`<text x="${sx(mk.i)}" y="${sy(mk.v)-10}" text-anchor="middle" style="font-weight:700;fill:${mk.color||"var(--sec)"}">${esc(mk.text)}</text>`});
  return s+"</svg>";}
function chartScatter(pts,o={}){ // pts:[{x,y,r,color,label}]
  const W=o.w||640,H=o.h||340,m={l:60,r:16,t:o.title?34:16,b:46},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=o.x0!=null?o.x0:Math.min(...xs),x1=o.x1!=null?o.x1:Math.max(...xs),y0=o.y0!=null?o.y0:0,y1=o.y1||nice(Math.max(...ys)*1.05);
  const sx=v=>m.l+(v-x0)/(x1-x0||1)*iw,sy=v=>m.t+ih-(v-y0)/(y1-y0)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"scatter chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(y0,y1).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  ticks(x0,x1).forEach(t=>s+=`<text class="lbl" x="${sx(t)}" y="${H-m.b+16}" text-anchor="middle">${short(t)}</text>`);

function chartPie(items,o={}){const W=o.w||420,H=o.h||300,cx=120,cy=H/2,R=100,tot=sum(items.map(i=>i.value));let a=-Math.PI/2,s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="pie chart">`;

function histBins(vals,n,lo,hi){const w=(hi-lo)/n,b=Array(n).fill(0);vals.forEach(v=>{let i=Math.floor((v-lo)/w);if(i>=n)i=n-1;if(i<0)i=0;b[i]++});return b.map((c,i)=>({label:short(lo+i*w),value:c,lo:lo+i*w,hi:lo+(i+1)*w}))}

const L=[];

let cur=0, done=new Set();
const UKEY="dalab_"+(document.title||"x");
try{JSON.parse(localStorage.getItem(UKEY)||"[]").forEach(x=>done.add(x))}catch(e){}
function go(i){
  cur=Math.max(0,Math.min(L.length-1,i));
  const l=L[cur],st=$("#stage");
  st.innerHTML=`<div class="crumb">Lesson ${cur+1} of ${L.length}</div><h1>${l.title}</h1><div class="syl">Syllabus: ${l.syl}</div>`+l.html()+
    `<div class="nextrow"><button class="btn" type="button" id="prevB" ${cur?"":"disabled"}>Previous</button><button class="btn pri" type="button" id="nextB" ${cur<L.length-1?"":"disabled"}>Next lesson</button></div>`;
  $("#prevB").onclick=()=>go(cur-1); $("#nextB").onclick=()=>go(cur+1);
  l.mount&&l.mount(st);
  $$("[data-q]",st).forEach(b=>b.onclick=()=>{
    const id=b.dataset.q,k=QUIZ[id],ok=+b.dataset.i===k.ans;
    $$(`[data-q="${id}"]`,st).forEach(x=>x.classList.remove("ok","no"));
    b.classList.add(ok?"ok":"no");
    $("#why-"+id,st).textContent=(ok?"Correct. ":"Not quite. ")+k.why;
    if(ok){done.add(cur);try{localStorage.setItem(UKEY,JSON.stringify([...done]))}catch(e){}drawNav()}
  });
  drawNav(); window.scrollTo(0,0); st.focus({preventScroll:true});
}
function drawNav(){
  $("#navlist").innerHTML=L.map((l,i)=>`<li class="${done.has(i)?"done":""}${l.hero?" hero":""}"><button type="button" data-go="${i}" ${i===cur?'aria-current="true"':""}><span class="n">${done.has(i)?"&#10003;":i+1}</span><span class="t">${l.nav}</span></button></li>`).join("");
  $$("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
}

const NETS=SALES.map(r=>r.net),MU=mean(NETS),SIG=Math.sqrt(NETS.reduce((a,v)=>a+(v-MU)**2,0)/NETS.length);
const erf=x=>{const s=Math.sign(x);x=Math.abs(x);const t=1/(1+.3275911*x),y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x);return s*y};
const ncdf=(x,m,s)=>.5*(1+erf((x-m)/(s*Math.SQRT2)));
const npdf=(x,m,s)=>Math.exp(-((x-m)**2)/(2*s*s))/(s*Math.sqrt(2*Math.PI));
const lgam=n=>{let s=0;for(let i=2;i<=n;i++)s+=Math.log(i);return s};
const binP=(n,k,p)=>p<=0?(k===0?1:0):p>=1?(k===n?1:0):Math.exp(lgam(n)-lgam(k)-lgam(n-k)+k*Math.log(p)+(n-k)*Math.log(1-p));

lesson({nav:"Probability basics",title:"Probability: chance as a number",syl:"Basic concepts of probability, experiments, outcomes, events",
html:()=>`<p class="lead"><b>Probability</b> = how likely an event is, from 0 (impossible) to 1 (certain). For equally likely outcomes: <code>P(event) = favourable outcomes / total outcomes</code>. A fair die: P(six) = 1/6 = 0.1667.</p>
<div class="grid3"><div class="cardsel"><b>Experiment</b><br><span class="small">A process: roll a die</span></div><div class="cardsel"><b>Outcome</b><br><span class="small">One result: 4</span></div><div class="cardsel"><b>Event</b><br><span class="small">A set of outcomes: "even"</span></div></div>
<div class="card try"><h3>Try it: the Law of Large Numbers</h3><p class="small muted">Roll a virtual die. Watch the share of sixes settle near 1/6 as the number of rolls grows. Few rolls: wild. Many rolls: steady.</p>
<div class="row">Rolls: <select id="dn"><option>10</option><option>50</option><option selected>500</option><option>5000</option></select> <button class="btn pri" id="droll" type="button">Roll the die</button></div>
<div id="dc"></div><div class="callout k small" id="dnote"></div></div>
<div class="card"><h3>Probability from real data</h3><p class="small">Of ${SALES.length} orders, ${SALES.filter(r=>r.pay==="UPI").length} were paid by UPI. So <code>P(UPI) = ${SALES.filter(r=>r.pay==="UPI").length}/${SALES.length} = ${(SALES.filter(r=>r.pay==="UPI").length/SALES.length).toFixed(4)}</code>. This is an <b>empirical</b> probability: relative frequency from data.</p><div class="code">In a sheet:  =COUNTIF(K2:K989,"UPI")/COUNT(F2:F989)\nSimulate a die:  =RANDBETWEEN(1,6)</div></div>
${quiz("u3q1","You flip a fair coin 10 times and get 7 heads. What should happen over 10,000 flips?",["More tails will 'make up' for it","The share of heads moves towards 0.5","Heads will keep winning"],1,"The Law of Large Numbers: the proportion settles near the true probability. Earlier flips are not 'repaid'.")}`,
mount(r){function roll(){const n=+$("#dn",r).value;let c=0,run=[],pts=[];for(let i=1;i<=n;i++){if(Math.floor(Math.random()*6)===5)c++;run.push(c/i)}
    const idx=run.map((_,i)=>i).filter(i=>i%Math.max(1,Math.floor(n/60))===0||i===n-1);
    $("#dc",r).innerHTML=chartLine([{name:"Share of sixes",vals:idx.map(i=>run[i]),color:"var(--c1)"},{name:"True 1/6",vals:idx.map(()=>1/6),color:"var(--c2)",dash:true}],idx.map(i=>String(i+1)),{w:640,h:280,min:0,max:Math.max(.5,Math.max(...run)*1.1),dots:false,maxLabels:8});
    $("#dnote",r).innerHTML=`After <b>${n}</b> rolls: ${c} sixes, share <b>${(c/n).toFixed(4)}</b> (true 0.1667).`}
  $("#droll",r).onclick=roll;roll();}
});

lesson({hero:true,nav:"Addition and multiplication rules",title:"Probability rules: AND, OR, given",syl:"Addition rule, multiplication rule, conditional probability, independence",
html:()=>`<p class="lead">Pick two events from the Sunrise orders. The page computes everything: <b>P(A)</b>, <b>P(B)</b>, <b>P(A and B)</b>, <b>P(A or B)</b> and <b>P(A given B)</b>.</p>
<div class="card try"><h3>Try it: choose events</h3>
<div class="row"><b>A:</b> <select id="ea1">${Object.entries(EVT).map(([k,v])=>`<option value="${k}" ${k==="pay"?"selected":""}>${v[0]}</option>`).join("")}</select> = <select id="ea2"></select>
&nbsp; <b>B:</b> <select id="eb1">${Object.entries(EVT).map(([k,v])=>`<option value="${k}" ${k==="region"?"selected":""}>${v[0]}</option>`).join("")}</select> = <select id="eb2"></select></div>
<div id="eout"></div></div>
<div class="grid2"><div class="card"><h3>Addition rule (OR)</h3><p class="small"><code>P(A or B) = P(A) + P(B) - P(A and B)</code>. Subtract the overlap, or it is counted twice. If A and B cannot both happen (mutually exclusive), P(A and B) = 0.</p></div>
<div class="card"><h3>Multiplication rule (AND)</h3><p class="small"><code>P(A and B) = P(A) x P(B given A)</code>. If A and B are <b>independent</b>, this is just <code>P(A) x P(B)</code>. Compare the two values on this page to test independence.</p></div></div>
${quiz("u3q2","P(A)=0.3, P(B)=0.4, P(A and B)=0.12. What is P(A or B)?",["0.70","0.58","0.12"],1,"0.3 + 0.4 - 0.12 = 0.58. Here P(A and B) equals P(A) x P(B), so A and B are independent.")}`,
mount(r){function fill(a,b){const k=$(a,r).value;$(b,r).innerHTML=EVT[k][1].map(x=>`<option>${x}</option>`).join("")}
  fill("#ea1","#ea2");fill("#eb1","#eb2");$("#ea2",r).value="UPI";$("#eb2",r).value="North";
  function d(){const ka=$("#ea1",r).value,va=$("#ea2",r).value,kb=$("#eb1",r).value,vb=$("#eb2",r).value,N=SALES.length;
    const A=SALES.filter(x=>x[ka]===va).length,B=SALES.filter(x=>x[kb]===vb).length,AB=SALES.filter(x=>x[ka]===va&&x[kb]===vb).length;
    const pa=A/N,pb=B/N,pab=AB/N,por=pa+pb-pab,pg=B?AB/B:0,indep=Math.abs(pab-pa*pb)<.01;
    $("#eout",r).innerHTML=`<table class="dt"><tbody><tr><td>P(A) = ${A}/${N}</td><td><b>${pa.toFixed(4)}</b></td></tr><tr><td>P(B) = ${B}/${N}</td><td><b>${pb.toFixed(4)}</b></td></tr><tr><td>P(A and B) = ${AB}/${N}</td><td><b>${pab.toFixed(4)}</b></td></tr><tr><td>P(A or B) = P(A)+P(B)-P(A and B)</td><td><b>${por.toFixed(4)}</b></td></tr><tr><td>P(A given B) = P(A and B)/P(B)</td><td><b>${pg.toFixed(4)}</b></td></tr><tr><td>P(A) x P(B) (if independent)</td><td><b>${(pa*pb).toFixed(4)}</b></td></tr></tbody></table>`+
    `<div class="callout ${ka===kb&&va!==vb?"k":"i"} small">${ka===kb&&va!==vb?"These cannot both happen on one order (mutually exclusive): P(A and B)=0.":indep?"P(A and B) is close to P(A) x P(B): the events look <b>independent</b>.":"P(A and B) differs from P(A) x P(B): the events look <b>dependent</b>."}</div>`+
    chartBar([{label:"P(A)",value:pa,color:"var(--c1)"},{label:"P(B)",value:pb,color:"var(--c2)"},{label:"A and B",value:pab,color:"var(--c3)"},{label:"A or B",value:por,color:"var(--c4)"}],{w:560,h:220,max:1,values:false})}
  ["ea2","eb2"].forEach(i=>$("#"+i,r).onchange=d);$("#ea1",r).onchange=()=>{fill("#ea1","#ea2");d()};$("#eb1",r).onchange=()=>{fill("#eb1","#eb2");d()};d();}
});
/* 3 discrete + binomial */
lesson({nav:"Discrete distributions, binomial",title:"Random variables and the binomial distribution",syl:"Random variables, discrete probability distributions, binomial distribution",
html:()=>`<p class="lead">A <b>random variable</b> is a number that depends on chance (units in an order). A <b>discrete distribution</b> lists every value and its probability. The <b>expected value</b> E(X) is the long-run average.</p>
<div class="card try"><h3>Real distribution: Units per order</h3><div id="ud"></div><div class="callout k small" id="un"></div></div>
<div class="card try"><h3>Binomial: n trials, success chance p</h3><p class="small muted">Use when there are a fixed number of independent yes/no trials. Example: out of 20 orders, how many are paid by UPI? (p = 0.24)</p>
<div class="row">n = <input type="range" id="bn" min="1" max="50" value="20"> <b id="bnv">20</b> &nbsp; p = <input type="range" id="bp" min="0.05" max="0.95" step="0.01" value="0.24"> <b id="bpv">0.24</b> &nbsp; P(X &gt;= <input type="number" id="bk" value="6" min="0" style="width:60px">)</div>
<div id="bc"></div><div class="callout k small" id="bnn"></div><div class="code">In a sheet:  =BINOM.DIST(k, n, p, FALSE)   exactly k\n             =BINOM.DIST(k, n, p, TRUE)    k or fewer\nMean = n x p      SD = SQRT(n x p x (1-p))</div></div>
${quiz("u3q3","Which situation is binomial?",["Height of students","Number of defective items in a box of 50 (each item defective with p=0.02)","Time to serve a customer"],1,"A fixed number of independent trials with two outcomes each, and a constant success probability.")}`,
mount(r){const U=SALES.map(x=>x.units),ks=[...new Set(U)].sort((a,b)=>a-b),pm=ks.map(k=>U.filter(u=>u===k).length/U.length),E=sum(ks.map((k,i)=>k*pm[i])),V=sum(ks.map((k,i)=>(k-E)**2*pm[i]));
  $("#ud",r).innerHTML=chartBar(ks.map((k,i)=>({label:String(k),value:pm[i]})),{w:560,h:240,title:"P(Units = k)",values:true});
  $("#un",r).innerHTML=`E(Units) = <b>${E.toFixed(3)}</b>, variance ${V.toFixed(3)}, SD ${Math.sqrt(V).toFixed(3)}. Most orders are for 1 or 2 units.`;
  function d(){const n=+$("#bn",r).value,p=+$("#bp",r).value,k=+$("#bk",r).value;$("#bnv",r).textContent=n;$("#bpv",r).textContent=p.toFixed(2);
    const it=Array.from({length:n+1},(_,i)=>({label:String(i),value:binP(n,i,p),color:i>=k?"var(--c2)":"var(--c1)"}));
    $("#bc",r).innerHTML=chartBar(it,{w:640,h:260,title:"Binomial("+n+", "+p.toFixed(2)+")",values:false});
    let tail=0;for(let i=k;i<=n;i++)tail+=binP(n,i,p);$("#bnn",r).innerHTML=`Mean = n x p = <b>${(n*p).toFixed(2)}</b>, SD = <b>${Math.sqrt(n*p*(1-p)).toFixed(2)}</b>. P(X &gt;= ${k}) = <b>${tail.toFixed(4)}</b> (orange bars).`}
  ["bn","bp","bk"].forEach(i=>$("#"+i,r).oninput=d);d();}
});
/* 4 normal */
lesson({nav:"Normal distribution",title:"The normal distribution and the empirical rule",syl:"Continuous distributions, normal distribution, z-scores",
html:()=>`<p class="lead">A <b>continuous</b> variable (height, time, weight) can take any value, so probability is an <b>area under a curve</b>. The <b>normal</b> curve is the bell shape defined by its mean and standard deviation. About <b>68%</b> of values fall within 1 SD, <b>95%</b> within 2, <b>99.7%</b> within 3.</p>
<div class="card try"><h3>Try it: shade a probability</h3>
<div class="row">Mean <input type="range" id="nm" min="40" max="160" value="100"> <b id="nmv">100</b> &nbsp; SD <input type="range" id="ns" min="5" max="40" value="15"> <b id="nsv">15</b></div>
<div class="row">P( <input type="number" id="na" value="85" style="width:70px"> &lt; X &lt; <input type="number" id="nb" value="115" style="width:70px"> )</div>
<div id="nc"></div><div class="callout k small" id="nn"></div><div class="code">In a sheet:  =NORM.DIST(b, mean, sd, TRUE) - NORM.DIST(a, mean, sd, TRUE)\n z-score:      =(x - mean)/sd</div></div>
<div class="card"><h3>Is order value normal? (Sunrise data)</h3><p class="small">Mean ${fmt(MU)}, SD ${fmt(SIG)}. A normal curve would put values below 0, which is impossible, so order value is <b>not</b> normal: it is right-skewed (lesson II.4). Yet the <b>averages</b> of many orders ARE close to normal. That is the Central Limit Theorem (lesson 7).</p></div>
${quiz("u3q4","In a normal distribution, about what share lies within 2 SD of the mean?",["68%","95%","99.7%"],1,"The empirical rule: 68, 95, 99.7 for 1, 2, 3 SD.")}`,
mount(r){function d(){const m=+$("#nm",r).value,s=+$("#ns",r).value,a=+$("#na",r).value,b=+$("#nb",r).value;$("#nmv",r).textContent=m;$("#nsv",r).textContent=s;
    const W=640,H=280,mg={l:40,r:16,t:16,b:36},lo=40,hi=160,sx=v=>mg.l+(v-lo)/(hi-lo)*(W-mg.l-mg.r),pk=npdf(m,m,s),sy=v=>H-mg.b-v/pk*(H-mg.t-mg.b-10);
    let line="",area="";for(let x=lo;x<=hi;x+=1){line+=(x===lo?"M":"L")+sx(x).toFixed(1)+" "+sy(npdf(x,m,s)).toFixed(1)}
    const A=Math.max(lo,Math.min(a,b)),B=Math.min(hi,Math.max(a,b));area="M"+sx(A)+" "+sy(0);for(let x=A;x<=B;x+=1)area+="L"+sx(x).toFixed(1)+" "+sy(npdf(x,m,s)).toFixed(1);area+="L"+sx(B)+" "+sy(0)+"Z";
    let t="";for(let x=lo;x<=hi;x+=20)t+=`<text class="lbl" x="${sx(x)}" y="${H-12}" text-anchor="middle">${x}</text>`;
    $("#nc",r).innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="normal curve"><line class="ax" x1="${mg.l}" x2="${W-mg.r}" y1="${sy(0)}" y2="${sy(0)}"/>${t}<path d="${area}" fill="var(--c2)" opacity=".45"/><path d="${line}" fill="none" stroke="var(--c1)" stroke-width="2.5"/><line x1="${sx(m)}" x2="${sx(m)}" y1="${sy(0)}" y2="${sy(pk)}" stroke="var(--muted)" stroke-dasharray="4 3"/></svg>`;
    const p=ncdf(Math.max(a,b),m,s)-ncdf(Math.min(a,b),m,s);$("#nn",r).innerHTML=`P(${Math.min(a,b)} &lt; X &lt; ${Math.max(a,b)}) = <b>${p.toFixed(4)}</b> (${(100*p).toFixed(1)}%). z-scores: ${((Math.min(a,b)-m)/s).toFixed(2)} and ${((Math.max(a,b)-m)/s).toFixed(2)}.`}
  ["nm","ns","na","nb"].forEach(i=>$("#"+i,r).oninput=d);d();}
});
/* 5 sampling techniques */
function drawSample(method,n){
  if(method==="srs")return sample(SALES,n);
  if(method==="sys"){const k=Math.floor(SALES.length/n),s=Math.floor(Math.random()*k),o=[];for(let i=s;i<SALES.length&&o.length<n;i+=k)o.push(SALES[i]);return o}
  if(method==="strat"){const g=groupBy(SALES,x=>x.region),o=[];Object.values(g).forEach(rs=>o.push(...sample(rs,Math.max(1,Math.round(n*rs.length/SALES.length)))));return o}
  const g=groupBy(SALES,x=>x.city),cs=Object.keys(g),o=[];const sh=sample(cs,cs.length);for(const c of sh){o.push(...g[c]);if(o.length>=n)break}return o.length>n?sample(o,n):o}
const SM={srs:["Simple random","Every order has an equal chance. Use RAND() and sort."],sys:["Systematic","Every k-th row after a random start. Easy in a sheet."],strat:["Stratified","Split into groups (regions), sample each in proportion. Reduces error when groups differ."],clus:["Cluster","Pick whole groups (cities) at random and take everything inside. Cheap, but groups may differ from the whole."]};
lesson({hero:true,nav:"Sampling techniques",title:"Sampling techniques: draw and compare",syl:"Population and sample, random, systematic, stratified, cluster sampling",
html:()=>`<p class="lead">A <b>population</b> is everything (all ${SALES.length} orders). A <b>sample</b> is the part you actually study. A good sample lets you estimate the population average (here <b>${fmt(MU)}</b>) without checking every row.</p>
<div class="card try"><h3>Try it: draw a sample</h3>
<div class="row">Method ${seg("smv",Object.entries(SM).map(([k,v])=>[k,v[0]]))} Sample size <select id="smn"><option>20</option><option selected>50</option><option>100</option></select> <button class="btn pri" id="smd" type="button">Draw one sample</button></div>
<p class="small muted" id="smd2"></p><div id="smo"></div></div>
<div class="card try"><h3>Repeat 300 times</h3><p class="small muted">One sample can be lucky or unlucky. Repeat it 300 times and see how the sample means <b>spread</b>. A good method centres on the true mean with small spread.</p>
<div class="row"><button class="btn sec" id="smr" type="button">Run 300 samples with this method</button></div><div id="smh"></div></div>
${quiz("u3q5","Why is stratified sampling often more accurate than simple random for the same sample size?",["It uses more data","It guarantees every group is represented in proportion","It needs no randomness"],1,"Each stratum (region) appears in the right proportion, so group differences cannot distort the sample.")}`,
mount(r){let m="srs";const gm=bindSeg(r,"smv",v=>{m=v;$("#smd2",r).textContent=SM[v][1];$("#smo",r).innerHTML="";$("#smh",r).innerHTML=""});$("#smd2",r).textContent=SM.srs[1];
  $("#smd",r).onclick=()=>{const n=+$("#smn",r).value,s=drawSample(m,n),v=s.map(x=>x.net),mm=mean(v);
    $("#smo",r).innerHTML=`<div class="grid3"><div class="kpi"><span class="small muted">Sample size</span><b>${s.length}</b></div><div class="kpi"><span class="small muted">Sample mean</span><b>${fmt(mm)}</b></div><div class="kpi"><span class="small muted">Error vs true ${fmt(MU)}</span><b>${(mm>=MU?"+":"")+fmt(mm-MU)}</b></div></div><div class="code">In a sheet: add a helper column =RAND(), sort by it, take the first ${n} rows, then =AVERAGE(...)</div>`};
  $("#smr",r).onclick=()=>{const n=+$("#smn",r).value,ms=[];for(let i=0;i<300;i++)ms.push(mean(drawSample(m,n).map(x=>x.net)));
    const b=histBins(ms,16,300,1400);$("#smh",r).innerHTML=chartBar(b,{w:640,h:260,title:SM[m][0]+": 300 sample means (n="+n+")",values:false})+`<div class="callout k small">Centre of the means: <b>${fmt(mean(ms))}</b> (true ${fmt(MU)}). Spread (SD of the means): <b>${fmt(sd(ms))}</b>. ${m==="clus"?"Cluster sampling usually shows a wider spread: whole cities differ from each other.":m==="strat"?"Stratified is usually the tightest here.":"Compare this spread with the other methods."}</div>`}}
});
/* 6 bias */
const BIAS=[["Only orders of 1 unit (e.g. 'quick checkouts')",x=>x.units===1],["Only Cash orders",x=>x.pay==="Cash"],["Only customers who left a rating",x=>x.rating!=null&&x.rating>=4],["Only North region",x=>x.region==="North"],["Only orders above Rs 1,500",x=>x.net>=1500]];
lesson({nav:"Sampling bias and errors",title:"Sampling bias and errors",syl:"Sampling errors, bias, sample size",
html:()=>`<p class="lead"><b>Sampling error</b> is the natural luck-of-the-draw difference, and it shrinks as the sample grows. <b>Bias</b> is a <b>systematic</b> distortion from how you chose the sample, and a bigger sample does <b>not</b> fix it.</p>
<div class="card try"><h3>Try it: biased shortcuts vs the truth</h3><p class="small muted">True mean order value: <b>${fmt(MU)}</b>. Pick a convenient (biased) sample.</p>
<div class="row"><select id="bs">${BIAS.map((b,i)=>`<option value="${i}">${b[0]}</option>`).join("")}</select></div><div id="bo"></div></div>
<div class="card"><h3>Types of bias to name in class</h3><span class="pill"><b>Selection</b>: some units can never be chosen</span><span class="pill"><b>Self-selection</b>: only people who care respond</span><span class="pill"><b>Survivorship</b>: only winners are seen</span><span class="pill"><b>Non-response</b>: those who skip differ from those who answer</span></div>
${quiz("u3q6","Surveying only the people who walk into the shop on a weekday morning to estimate all customers is...",["Random sampling","Convenience sampling with selection bias","Stratified sampling"],1,"It excludes people who shop at other times, so the sample is systematically different.")}`,
mount(r){function d(){const f=BIAS[+$("#bs",r).value][1],s=SALES.filter(f),v=s.map(x=>x.net),mm=mean(v);
    $("#bo",r).innerHTML=`<div class="grid3"><div class="kpi"><span class="small muted">Rows in this 'sample'</span><b>${s.length}</b></div><div class="kpi"><span class="small muted">Sample mean</span><b>${fmt(mm)}</b></div><div class="kpi"><span class="small muted">Off by</span><b>${(100*(mm/MU-1)).toFixed(0)}%</b></div></div>`+
    chartBar([{label:"True mean",value:MU,color:"var(--c1)"},{label:"Biased sample",value:mm,color:"var(--c2)"}],{w:420,h:220})+`<div class="callout k small">Even with ${s.length} rows (a big sample) the answer is wrong, because the way we picked rows is not random.</div>`}
  $("#bs",r).onchange=d;d();}
});
/* 7 CLT and CI */
lesson({hero:true,nav:"Central Limit Theorem and CI",title:"Central Limit Theorem and confidence intervals",syl:"Sampling distribution, Central Limit Theorem, confidence intervals",
html:()=>`<p class="lead"><b>Central Limit Theorem:</b> take many samples of size n and compute each sample's mean. Those means form a bell curve around the true mean with spread <code>SD / sqrt(n)</code>, <b>even if the data itself is skewed</b>. This lets us build a <b>confidence interval</b>: <code>mean +/- z x SD/sqrt(n)</code>.</p>
<div class="card try"><h3>Try it: watch the bell appear</h3>
<div class="row">Sample size n <input type="range" id="cn" min="2" max="200" value="5"> <b id="cnv">5</b> <button class="btn pri" id="cgo" type="button">Take 1000 samples</button></div>
<div id="cc"></div><div class="callout k small" id="cnn"></div></div>
<div class="card try"><h3>Confidence intervals: do they catch the truth?</h3><p class="small muted">Draw 50 samples of size 50. For each, build a 95% interval. About 95% of the lines should cross the true mean (the vertical line).</p>
<div class="row"><button class="btn sec" id="ci" type="button">Draw 50 intervals</button></div><div id="cio"></div></div>
${quiz("u3q7","If you quadruple the sample size, the standard error (SD/sqrt n) becomes...",["Half as big","A quarter as big","The same"],0,"sqrt(4)=2, so the standard error halves. Precision grows slowly with n.")}`,
mount(r){$("#cn",r).oninput=()=>$("#cnv",r).textContent=$("#cn",r).value;
  $("#cgo",r).onclick=()=>{const n=+$("#cn",r).value,ms=[];for(let i=0;i<1000;i++){let s=0;for(let j=0;j<n;j++)s+=NETS[Math.floor(Math.random()*NETS.length)];ms.push(s/n)}
    const b=histBins(ms,24,200,1500);$("#cc",r).innerHTML=chartBar(b,{w:640,h:260,title:"1000 sample means, n="+n,values:false});
    $("#cnn",r).innerHTML=`Mean of the means <b>${fmt(mean(ms))}</b> (true ${fmt(MU)}). Their SD <b>${fmt(sd(ms))}</b> vs theory SD/sqrt(n) = <b>${fmt(SIG/Math.sqrt(n))}</b>. ${n<10?"With small n the shape is still lopsided.":"Now it is close to a symmetric bell."}`};
  $("#ci",r).onclick=()=>{const n=50,W=640,H=300,rows=[];let hit=0;for(let i=0;i<50;i++){const s=sample(NETS,n),m=mean(s),se=sd(s)/Math.sqrt(n),lo=m-1.96*se,hi=m+1.96*se,ok=lo<=MU&&MU<=hi;if(ok)hit++;rows.push({lo,hi,m,ok})}
    const x0=450,x1=1100,sx=v=>40+(v-x0)/(x1-x0)*(W-60);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="confidence intervals">`;
    rows.forEach((q,i)=>{const y=12+i*5.6;s+=`<line x1="${sx(q.lo)}" x2="${sx(q.hi)}" y1="${y}" y2="${y}" stroke="${q.ok?"var(--c3)":"var(--bad)"}" stroke-width="2.5"/>`});
    s+=`<line x1="${sx(MU)}" x2="${sx(MU)}" y1="0" y2="${H-20}" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 3"/><text x="${sx(MU)+4}" y="${H-6}">true mean ${fmt(MU)}</text></svg>`;
    $("#cio",r).innerHTML=s+`<div class="callout k small"><b>${hit} of 50</b> intervals contain the true mean (${(100*hit/50).toFixed(0)}%). Red lines missed. Over many runs the hit rate is close to 95%.</div><div class="code">In a sheet:  =CONFIDENCE.NORM(0.05, STDEV(range), COUNT(range))   gives the +/- margin</div>`}}
});
