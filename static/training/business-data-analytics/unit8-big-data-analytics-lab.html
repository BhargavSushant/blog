<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Data Analytics Lab - Unit VIII</title>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#EFEBE1; --fg:#12110E; --muted:#44403A; --line:#B9B2A2; --line2:#D9D3C4;
  --pri:#1F3FB5; --pri-soft:#DDE5FA; --sec:#9A4208; --sec-soft:#FBE3CC;
  --good:#0F6A31; --good-soft:#D5F0DD; --warn:#744500; --warn-soft:#F9E8B8; --bad:#A31D12; --bad-soft:#FADAD5;
  --code:#EFEBE1; --on:#FFFFFF; --grid:#CFC9BA; --shadow:0 1px 2px rgba(18,17,14,.08),0 6px 18px rgba(18,17,14,.06);
  --c1:#1F3FB5; --c2:#9A4208; --c3:#0F6A31; --c4:#7A2A9C; --c5:#8A6D00; --c6:#B0235C;
  --disp:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --zoom:1;
}
:root[data-theme="dark"]{
  --bg:#0C0C0A; --surface:#181714; --surface2:#242320; --fg:#F7F4EA; --muted:#CFCABD; --line:#5B574B; --line2:#35332C;
  --pri:#9DB1FF; --pri-soft:#1B2350; --sec:#FFAE6B; --sec-soft:#40240E;
  --good:#6FE09A; --good-soft:#0F3320; --warn:#F5C964; --warn-soft:#3B2E0A; --bad:#FF9A8C; --bad-soft:#451A15;
  --code:#1F1E1A; --on:#0C0C0A; --grid:#46433A; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  --c1:#9DB1FF; --c2:#FFAE6B; --c3:#6FE09A; --c4:#D9A0FF; --c5:#F0D060; --c6:#FF8FB8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);zoom:var(--zoom)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;min-height:calc(100vh / var(--zoom))}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.brand{font-family:var(--disp);font-size:20px;line-height:1.15;margin:0 4px 4px}
.brand small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:4px}
.nav ol{list-style:none;margin:16px 0 0;padding:0}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.nav li button:hover{background:var(--surface2)}
.nav li button[aria-current="true"]{background:var(--pri-soft);font-weight:600}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.nav li.done .n{background:var(--good);color:var(--on);border-color:var(--good)}
.nav .t{font-size:13.5px;line-height:1.3}
.nav .hero .n{border-color:var(--sec);color:var(--sec)}
.tools{margin:18px 4px 0;display:grid;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;text-align:left}
.tools button:hover{border-color:var(--fg)}
.tools .hint{font-size:12px;color:var(--muted)}
main{padding:26px 30px 70px;min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px}
h2{font-family:var(--disp);font-size:20px;margin:0 0 8px}
h3{font-size:13.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.syl{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card.try{border-left:5px solid var(--pri)}
.card.sec{border-left:5px solid var(--sec)}
.lead{font-size:16.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.tag.p{background:var(--pri-soft);color:var(--pri)} .tag.s{background:var(--sec-soft);color:var(--sec)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)} .btn.sec{background:var(--sec);color:var(--on);border-color:var(--sec)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.dt td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:340px}
.tw.sm{max-height:none}
.new{animation:pop .6s ease both}
@keyframes pop{from{background:var(--sec-soft);transform:translateY(-4px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;overflow:auto;white-space:pre-wrap;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface2);border:1px solid var(--line2)}
.callout.k{background:var(--sec-soft);border-color:transparent} .callout.i{background:var(--pri-soft);border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on)}
.seg.s button[aria-pressed="true"]{background:var(--sec)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px}
input[type=range]{accent-color:var(--pri);vertical-align:middle}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
.live{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.live .tw{max-height:none}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arrow{font-size:28px;color:var(--sec);text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--surface)}
td.ix{background:var(--bad-soft)} td.iy{background:var(--warn-soft)} td.iz{background:var(--pri-soft)} td.chg{background:var(--good-soft)}
.cardsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.nextrow{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
svg.chart{width:100%;height:auto;display:block;max-height:420px}
svg.chart{font-size:calc(12px*var(--zoom))}
svg.chart text{fill:var(--fg);font-family:var(--body);font-size:1em}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .gr{stroke:var(--grid);stroke-width:1}
svg.chart .lbl{fill:var(--muted)}
.sheet{border-collapse:collapse;font-size:13.5px;font-family:var(--mono);width:100%}
.sheet th{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:600;color:var(--muted)}
.sheet td{border:1px solid var(--line);padding:0;min-width:80px}
.sheet td input{width:100%;border:0;background:transparent;padding:4px 7px;font:inherit;border-radius:0}
.sheet td.sel{outline:2px solid var(--pri);outline-offset:-2px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.live{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav ol{display:flex;overflow:auto;gap:4px}.nav li{flex:none}.nav .t{display:none}main{padding:18px 16px 60px}.grid2,.grid3,.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}

.dt.wrap td,.dt.wrap th{white-space:normal}
.card.task{border-left:5px solid var(--good)}
.numt{margin:4px 0 10px}.numt .tw{margin-top:8px}
a.g{color:inherit;text-decoration:none;border-bottom:1px dotted var(--muted)} a.g:hover{border-bottom-style:solid}
.gl.hl{outline:3px solid var(--pri)}
.qq+.qq{border-top:1px solid var(--line2);margin-top:8px}
.opt:disabled{cursor:default}
#prog{margin-top:6px;font-size:12.5px;line-height:1.5}
select{max-width:100%}
code{overflow-wrap:anywhere}
.code{overflow-x:auto;max-width:100%}
.grid3>*,.grid2>*,.flow>*{min-width:0}
.grid2 select,.grid2 input{max-width:100%;width:100%}
.dt td.hit{background:var(--sec-soft);font-weight:700}
.row>*{min-width:0;max-width:100%}.row label{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}.row select,.row input[type=text],.row textarea{max-width:100%;min-width:0;text-overflow:ellipsis}
textarea{max-width:100%;box-sizing:border-box}
.card li,.card p,.card td{overflow-wrap:anywhere}
</style>
<style id="nvbar-css">
.nvbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0;padding:8px 14px;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--surface,#f6f8fb);color:var(--fg,#1b2430);border-bottom:1px solid var(--line,#d7dee8);zoom:1}
.nvbar a{color:inherit;text-decoration:none}
.nvbar a:hover,.nvbar a:focus-visible{text-decoration:underline}
.nvbar .nvhome{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border:1px solid var(--line,#aab);border-radius:6px;font-weight:600;white-space:nowrap}
.nvbar .nvhome:hover{background:var(--fg,#1b2430);color:var(--bg,#fff);text-decoration:none}
.nvbar ol{display:flex;flex-wrap:wrap;align-items:center;gap:6px;list-style:none;margin:0;padding:0;min-width:0}
.nvbar li{display:flex;align-items:center;gap:6px;min-width:0}
.nvbar li+li:before{content:"\203A";opacity:.55}
.nvbar li[aria-current]{opacity:.75;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
@media print{.nvbar{display:none}}
</style>

<script>
"use strict";
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v==="number"?(Number.isInteger(v)?v.toLocaleString("en-IN"):v.toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d})):v;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,l=Math.floor(p);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(p-l)};
const mode=a=>{const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx).join(", ")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const groupBy=(rows,f)=>{const g={};rows.forEach(r=>{const k=f(r);(g[k]=g[k]||[]).push(r)});return g};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return a/Math.sqrt(b*c)};
const linfit=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2});const m=a/b;return {m,b:my-m*mx,r:corr(x,y)}};
function table(rows,cols,opts={}){
  const head=cols.map(c=>`<th>${esc(c[1])}</th>`).join("");
  const body=rows.map((r,i)=>`<tr${opts.newFrom!=null&&i>=opts.newFrom?' class="new"':''}>`+cols.map(c=>{
    const v=r[c[0]],cls=(typeof v==="number"?"num":"")+((opts.cellClass&&opts.cellClass(r,c[0],i))||"");
    return `<td class="${cls.trim()}">${v===""||v==null?'<span class="muted">(blank)</span>':esc(typeof v==="number"?fmt(v,c[2]!=null?c[2]:(Number.isInteger(v)?0:2)):v)}</td>`}).join("")+"</tr>").join("");
  return `<div class="tw${opts.small?' sm':''}"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const IN=n=>Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const num=v=>Number(v).toLocaleString("en-IN",{maximumFractionDigits:2});
const RS=v=>"Rs "+IN(v);
function seg(id,items,cls=""){return `<div class="seg ${cls}" id="${id}" role="group">`+items.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${i===0}">${x[1]}</button>`).join("")+`</div>`}
function bindSeg(root,id,fn){const g=$("#"+id,root);$$("button",g).forEach(b=>b.onclick=()=>{$$("button",g).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return ()=>$$("[aria-pressed=true]",g)[0].dataset.v}

/* ===== SVG charts: colours from CSS variables; text size follows the Text size control ===== */
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const lakh=v=>v===0?"0":String(+(v/100000).toFixed(2))+"L";
const fa=hi=>hi>=100000?lakh:num;                     /* one unit per axis: lakh or plain */
const short=v=>Math.abs(v)>=100000?lakh(v):num(v);
function niceStep(raw){const e=Math.pow(10,Math.floor(Math.log10(raw||1))),f=raw/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
function axisFor(maxv){const step=niceStep((maxv||1)/5),n=Math.max(1,Math.ceil(maxv/step-1e-9));return {hi:step*n,n}}
function ticks(lo,hi,n=5){const out=[],st=(hi-lo)/n;for(let i=0;i<=n;i++)out.push(+(lo+st*i).toFixed(6));return out}
function tk(lo,hi,intOnly){let st=niceStep((hi-lo)/5||1);if(intOnly)st=Math.max(1,Math.round(st));const out=[];for(let v=Math.ceil(lo/st-1e-9)*st;v<=hi+1e-9;v+=st)out.push(+v.toFixed(6));return out}
const TB=(h,rows,note)=>` data-tbl="${esc(JSON.stringify({h,rows,note:note||""}))}"`;
const TS="font-weight:700;font-size:1.17em";
function chartBar(items,o={}){
  const W=o.w||640,H=o.h||320,m={l:58,r:14,t:o.title?34:16,b:o.rotate?70:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mn=o.min!=null?o.min:0,vmax=Math.max(...items.map(i=>i.value));
  let mx,n=5;if(o.max){mx=o.max}else{const a=axisFor(vmax*1.04);mx=a.hi;n=a.n}
  const fm=fa(mx),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih,bw=iw/items.length,step=(items.length>14&&!o.rotate)?Math.ceil(items.length/10):1;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"bar chart")}"${TB([o.cat||"Item",o.vlabel||"Value"],items.map(i=>[i.label,i.value]))}>`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="${TS}">${esc(o.title)}</text>`;
  ticks(mn,mx,n).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${fm(t)}</text>`);
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*.15,w=bw*.7,y=sy(Math.max(it.value,mn));
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(mn)-y)}" fill="${it.color||o.color||"var(--c1)"}" rx="2"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    if(o.values!==false&&items.length<=14)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="font-size:.92em">${fm(it.value)}</text>`;
    if(i%step===0){const lx=x+w/2,ly=H-m.b+16;s+=o.rotate?`<text x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-35 ${lx} ${ly})">${esc(it.label)}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(it.label)}</text>`}});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return s+"</svg>";}
function chartLine(series,labels,o={}){
  const W=o.w||640,H=o.h||320,m={l:58,r:o.legendRight?110:26,t:o.title?34:16,b:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null)),mn=o.min!=null?o.min:0;
  let mx,n=5;if(o.max){mx=o.max}else{const a=axisFor(Math.max(...all)*1.08);mx=a.hi;n=a.n}
  const fm=fa(mx),sx=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"line chart")}"${TB([o.cat||"Period"].concat(series.map(x=>x.name)),labels.map((l,i)=>[l].concat(series.map(x=>x.vals[i]==null?"":Math.round(x.vals[i]*100)/100))))}>`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="${TS}">${esc(o.title)}</text>`;

/* ===== quiz set per lesson, score kept in localStorage ===== */
const QZ={},QBY={};let QS={};
try{QS=JSON.parse(localStorage.getItem("u8_q")||"{}")}catch(e){}
const saveQ=()=>{try{localStorage.setItem("u8_q",JSON.stringify(QS))}catch(e){}};
function shufQ(opts,ans,seed){const idx=opts.map((_,i)=>i);let h=(Math.imul(seed+1,2654435761)>>>0)^0x9e3779b9;const rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296};for(let k=0;k<8;k++)rnd();for(let i=idx.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}return {opts:idx.map(i=>opts[i]),ans:idx.indexOf(ans)}}
function defQ(n,list){QBY[n]=list.map((x,i)=>{const id="u8l"+n+"q"+(i+1);const sh=shufQ(x[1],x[2],n*97+i*31+7);QZ[id]={n,q:x[0],opts:sh.opts,ans:sh.ans,why:x[3]};return id})}
function quizSet(n){return `<div class="card"><h3>Quick check: ${QBY[n].length} questions</h3>`+QBY[n].map((id,k)=>{const z=QZ[id];return `<div class="qq"><p style="margin:12px 0 6px"><b>${k+1}. ${z.q}</b></p>`+z.opts.map((o,i)=>`<button class="opt" type="button" data-q="${id}" data-i="${i}">${o}</button>`).join("")+`<div class="small muted" id="why-${id}" aria-live="polite" style="margin-top:6px"></div></div>`}).join("")+`</div>`}
const lessonDone=n=>QBY[n]&&QBY[n].every(id=>QS[id]&&QS[id].c);
function showQ(id){const s=QS[id],z=QZ[id];if(!s||!s.c)return;$$(`[data-q="${id}"]`).forEach(b=>{b.disabled=true;if(+b.dataset.i===z.ans)b.classList.add("ok")});$("#why-"+id).textContent="Correct. "+z.why}
function answerQ(b){const id=b.dataset.q,z=QZ[id],s=QS[id]||(QS[id]={t:0,c:false,f:false});if(s.c)return;s.t++;const ok=+b.dataset.i===z.ans;
  $$(`[data-q="${id}"]`).forEach(x=>x.classList.remove("no"));
  if(ok){s.c=true;s.f=s.t===1;showQ(id)}else{b.classList.add("no");$("#why-"+id).textContent="Not quite. Read the lesson again and try another answer."}

function updateProg(){const ids=Object.keys(QZ),tot=ids.length,c=ids.filter(i=>QS[i]&&QS[i].c).length,f=ids.filter(i=>QS[i]&&QS[i].f).length,nl=Object.keys(QBY).length,ld=Object.keys(QBY).filter(n=>lessonDone(+n)).length,box=$("#prog");

const L=[];
function lesson(o){L.push(o)}
let cur=0;
function go(i){
  cur=Math.max(0,Math.min(L.length-1,i));
  const l=L[cur],st=$("#stage"),nl=L.filter(x=>!x.ref).length;
  st.innerHTML=`<div class="crumb">${l.ref?"Reference":"Lesson "+(cur+1)+" of "+nl}</div><h1>${l.title}</h1><div class="syl">Topic: ${l.syl}</div>`+l.html()+
    `<div class="nextrow"><button class="btn" type="button" id="prevB" ${cur?"":"disabled"}>Previous</button>${l.ref&&GLBACK.i!=null?`<button class="btn" type="button" id="backB">Back to lesson ${GLBACK.i+1}</button>`:""}<button class="btn pri" type="button" id="nextB" ${cur<L.length-1?"":"disabled"}>Next lesson</button></div>`;
  $("#prevB").onclick=()=>go(cur-1);$("#nextB").onclick=()=>go(cur+1);const bb=$("#backB");if(bb)bb.onclick=()=>go(GLBACK.i);

  if(!l.ref)QBY[cur+1].forEach(showQ);

  window.scrollTo(0,0);st.focus({preventScroll:true});
}

lesson({nav:"What is big data?",title:"What is big data? The five Vs",syl:"Big data analytics: concepts",
html:()=>`<p class="lead">${g("bigdata","Big data")} is data that is too large, too fast or too varied for ordinary tools such as a single spreadsheet. It is described by five Vs. Learning to name them helps you judge when a problem needs big data tools and when it does not.</p>
<div class="card try"><h3>Try it: name the V</h3><p class="small muted">Choose the V that each case shows best. One case is not big data at all.</p><div id="vs"></div></div>
<div class="card try"><h3>Try it: when does a sheet run out?</h3><div class="row"><label>Stores: <input type="range" id="gs" min="1" max="2000" value="50"> <b id="gsv"></b></label><label>Orders per store per day: <input type="range" id="go" min="10" max="2000" step="10" value="200"> <b id="gov"></b></label></div><div class="callout k small" id="gr"></div></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">${g("volume")} is how much data there is, in gigabytes, terabytes or petabytes. ${g("velocity")} is how fast it arrives and must be processed. ${g("variety")} is the number of forms it takes: tables, text, images, video and sensor logs. ${g("veracity")} is how far it can be trusted, because large data from many sources contains errors, duplicates and conflicts. ${g("value")} is the useful insight it gives. Data without a use has no value however large it is.</p><p class="small">Big data is also a matter of the tool. A Sunrise sales table of 988 rows is small, and a spreadsheet handles it well. A table that grows by millions of rows a day does not fit in one sheet, which holds at most 1,048,576 rows. For such data we use ${g("distributed","distributed storage")} and processing on many computers.</p></div>
<div class="card"><h3>What the demos show</h3><p class="small">The first demo gives each case a quick feedback. Most cases show one V strongly, though a real system usually shows several at once: a social media feed has volume, velocity and variety together. The last case is small data. The second demo estimates how long a sheet lasts. With 50 stores and 200 orders per store per day, a sheet reaches its row limit in about 100 days. With 2,000 stores and 2,000 orders per store per day, the limit is reached in less than a day. Move the sliders to see the point at which a sheet stops being the right tool.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Describe a data problem with the five Vs before you choose a tool.</li><li>Use a spreadsheet when the data fits comfortably in one, and big data tools when it does not.</li><li>Check the veracity of data from many sources before you analyse it.</li><li>Ask what decision the data will support. Without one it has no value.</li></ul></div>
${EXC[1]}
${task(["Write one example of your own for each of the five Vs.","In the second demo, find the number of stores at which a sheet lasts less than one month with 200 orders per store per day.","Write two reasons why 988 rows is not big data."])}${quizSet(1)}`,
mount(r){const box=$("#vs",r);box.innerHTML=SCEN.map((s,i)=>`<div class="qq"><p class="small" style="margin:8px 0 4px"><b>${i+1}.</b> ${s[0]}</p><span class="seg" data-i="${i}">`+Object.keys(VN).map(k=>`<button type="button" data-v="${k}" aria-pressed="false">${VN[k]}</button>`).join("")+`</span> <span class="small" id="vf${i}"></span></div>`).join("");
  $$(".seg",box).forEach(sg=>$$("button",sg).forEach(b=>b.onclick=()=>{const i=+sg.dataset.i,ok=b.dataset.v===SCEN[i][1];$$("button",sg).forEach(x=>x.setAttribute("aria-pressed",x===b));$("#vf"+i,r).textContent=ok?"Correct.":"Not quite. Think about what is most striking: the size, the speed, the forms, the trust or the use."}));
  function f(){const s=+$("#gs",r).value,o=+$("#go",r).value;$("#gsv",r).textContent=s;$("#gov",r).textContent=o;const rows=s*o,days=1048576/rows,bytes=rows*365*500;
    const fmtB=b=>b>=1e12?(b/1e12).toFixed(1)+" TB":b>=1e9?(b/1e9).toFixed(1)+" GB":(b/1e6).toFixed(0)+" MB";
    $("#gr",r).innerHTML=`New rows per day: <b>${IN(rows)}</b>. A sheet of 1,048,576 rows is full in <b>${days>=2?Math.round(days)+" days":days.toFixed(2)+" days"}</b>. At about 500 bytes a row, one year of data is about <b>${fmtB(bytes)}</b>.`}
  ["gs","go"].forEach(i=>$("#"+i,r).oninput=f);f();}

lesson({nav:"Storage and processing",title:"Storing and processing big data: MapReduce",syl:"Big data technologies",
html:()=>`<p class="lead">When data is too large for one computer, it is kept on many computers and processed in parallel. The main idea behind most big data tools is ${g("mapreduce","MapReduce")}. You can run a small version of it here and see each step.</p>
<div class="card try"><h3>Try it: count words with MapReduce</h3><p class="small muted">Each line is one record, as if stored on a different computer. Edit the lines if you like, then press the steps in order.</p><textarea id="mt" rows="4" style="width:100%;font:inherit">good phone good price
bad battery good camera
good price bad battery</textarea>
<div class="row"><button class="btn pri" id="m1" type="button">1. Map</button><button class="btn" id="m2" type="button">2. Shuffle</button><button class="btn" id="m3" type="button">3. Reduce</button><button class="btn" id="m0" type="button">Reset</button></div><div id="mo"></div></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">In the map step each computer reads its own records and turns each into key and value pairs. For word counting, each word becomes the pair (word, 1). The map steps are independent, so they can run at the same time on many computers. In the shuffle step the system brings together all pairs that have the same key, so each word has all its ones in one place. In the reduce step each key is reduced to one result, here by adding the ones to get the count of the word.</p><p class="small">Several tools support this work. ${g("distributed","Distributed storage")} such as HDFS keeps the data in blocks across computers. ${g("spark","Spark")} runs the processing in memory, which is faster. ${g("nosql","NoSQL databases")} keep data that does not fit fixed tables. Cloud warehouses give the same abilities as a service.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">Press Map and each word of each line becomes a pair with the count 1. Press Shuffle and the pairs are grouped, so that every occurrence of "good" is in one list. Press Reduce and each list is added: good appears four times for the lines shown. The result is the same as a pivot table of word counts, but the method works when the text is far too large for one machine, because every step can be split across computers. The only step that needs the computers to exchange data is the shuffle. This is the costly step, and good designs try to reduce the amount of data that is shuffled.</p></div>
<div class="card"><h3>The main tools</h3>${table(TOOLS.map(t=>({a:t[0],b:t[1],c:t[2]})),[["a","Tool"],["b","Kind"],["c","What it does"]],{small:true})}</div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Break a big problem into independent pieces that can run in parallel.</li><li>Reduce the data as early as possible, before it is moved between computers.</li><li>Use a pivot table or SQL when the data fits on one computer.</li><li>Choose the tool from the size, the speed and the form of the data.</li></ul></div>
${EXC[2]}
${task(["Run the three steps on the lines in the demo and write the count of each word.","Change the text to your own three lines and write the word that appears most often.","Explain in two sentences why the map step can run on many computers at the same time."])}${quizSet(2)}`,
mount(r){let st=0,pairs=[],grp={};function show(){let h="";if(st>=1)h+=`<p class="small"><b>Map output</b> (${pairs.length} pairs)</p><p class="small">`+pairs.map(p=>`<code>(${esc(p[0])}, 1)</code>`).join(" ")+`</p>`;
    if(st>=2)h+=`<p class="small"><b>After the shuffle</b></p>`+table(Object.keys(grp).sort().map(k=>({k,v:grp[k].map(()=>1).join(", ")})),[["k","Key"],["v","Values"]],{small:true});
    if(st>=3)h+=`<p class="small"><b>Reduce output</b></p>`+table(Object.keys(grp).sort((a,b)=>grp[b].length-grp[a].length||(a<b?-1:1)).map(k=>({k,n:grp[k].length})),[["k","Word"],["n","Count"]],{small:true});
    $("#mo",r).innerHTML=h||'<p class="small muted">Press 1. Map to start.</p>'}
  $("#m1",r).onclick=()=>{pairs=[];$("#mt",r).value.split("\n").forEach(l=>l.toLowerCase().split(/[^a-z0-9']+/).filter(Boolean).forEach(w=>pairs.push([w])));st=1;grp={};show()};
  $("#m2",r).onclick=()=>{if(st<1)return;grp={};pairs.forEach(p=>(grp[p[0]]=grp[p[0]]||[]).push(1));st=2;show()};
  $("#m3",r).onclick=()=>{if(st<2)return;st=3;show()};$("#m0",r).onclick=()=>{st=0;pairs=[];grp={};show()};show();}
});

/* L3 text analytics */
const REV=`The phone is good and the camera is excellent
Battery is bad and the screen cracked in a week
Good price, fast delivery, very happy
Terrible support, nobody answered my calls
Excellent sound, the earphones are great value
The bag is cheap and the zip is poor
Delivery was late but the product is good
Love the lamp, bright and sturdy
Worst purchase, the mouse stopped working and the refund was slow
Nice notebook, good paper and a fair price`;
const POS=new Set("good excellent great happy love nice fast bright sturdy fair happy value".split(" ")),NEG=new Set("bad terrible poor cheap worst slow late cracked stopped cracked".split(" "));
lesson({nav:"Text analytics",title:"Text analytics: counting words and scoring sentiment",syl:"Text analytics",
html:()=>`<p class="lead">Much business data is text: reviews, emails, complaints, comments. ${g("textanalytics","Text analytics")} turns text into numbers, so that it can be counted, compared and charted like any other column.</p>
<div class="card try"><h3>Try it: analyse ten reviews</h3><p class="small muted">The reviews are invented. Edit them or paste your own, one review per line.</p><textarea id="rv" rows="6" style="width:100%;font:inherit">${REV}</textarea>
<div class="row"><label><input type="checkbox" id="rs" checked> remove stop words</label></div><div id="rc"></div><div id="rs2"></div></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">The first step is to split each text into ${g("token","tokens")}, usually words, and to change them to lower case so that "Good" and "good" count together. Next, ${g("stopword","stop words")} such as the, is and and are removed, because they are the most frequent words in every text and say little. Then the words are counted, and the most frequent ones are shown in a chart.</p><p class="small">${g("sentiment","Sentiment analysis")} scores the text as positive or negative. The simplest way is to count the words that appear in a list of positive words and in a list of negative words, and to subtract. A score above zero is positive, below zero is negative and zero is neutral. The method is approximate. It misses negation ("not good"), sarcasm and new words, so its results must be checked against some reviews that you read yourself.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The chart shows the ten most frequent words. With stop words included, the top words are the, is and and, which tell you nothing. With them removed, words such as good, price and delivery appear, which tell you what customers talk about. The table scores each review. A review such as "Delivery was late but the product is good" has one positive and one negative word, so it scores zero. The summary at the end counts positive, negative and neutral reviews. Find a review that the scoring gets wrong, and explain why.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Clean the text first: lower case, remove punctuation and stop words.</li><li>Look at the most frequent words before you decide on any score.</li><li>Read a sample of reviews to check the sentiment scores.</li><li>Report the method and its limits together with the result.</li></ul></div>
${EXC[3]}
${task(["Run the analysis with stop words included and then removed. Write the top three words in each case.","Add three reviews of your own and write their scores.","Find one review that the score misreads and explain what the method misses."])}${quizSet(3)}`,
mount(r){function f(){const lines=$("#rv",r).value.split("\n").map(x=>x.trim()).filter(Boolean),rs=$("#rs",r).checked,cnt={};
  lines.forEach(l=>l.toLowerCase().split(/[^a-z0-9']+/).filter(Boolean).forEach(w=>{if(rs&&STOP.has(w))return;cnt[w]=(cnt[w]||0)+1}));
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||(a<b?-1:1)).slice(0,10);
  $("#rc",r).innerHTML=chartBar(top.map(w=>({label:w,value:cnt[w]})),{title:"Ten most frequent words",cat:"Word",vlabel:"Times used",h:260,max:Math.max(2,...top.map(w=>cnt[w]))+1});
  let p=0,n=0,z=0;const rows=lines.map(l=>{const w=l.toLowerCase().split(/[^a-z0-9']+/).filter(Boolean);const s=w.filter(x=>POS.has(x)).length-w.filter(x=>NEG.has(x)).length;s>0?p++:s<0?n++:z++;return {t:l,s,lab:s>0?"Positive":s<0?"Negative":"Neutral"}});
  $("#rs2",r).innerHTML=`<p class="small">Reviews: <b>${lines.length}</b>. Positive <b>${p}</b>, negative <b>${n}</b>, neutral <b>${z}</b>.</p>`+table(rows,[["t","Review"],["s","Score"],["lab","Label"]],{small:true})}
  $("#rv",r).oninput=f;$("#rs",r).onchange=f;f();}
});

/* L4 SNA */
const NN=["A","B","C","D","E","F","G","H"];
const NODEPOS=NN.map((_,i)=>[250+170*Math.cos(2*Math.PI*i/8-Math.PI/2),190+140*Math.sin(2*Math.PI*i/8-Math.PI/2)]);
lesson({nav:"Social network analysis",title:"Social network analysis: nodes, edges and centrality",syl:"Social network analysis",
html:()=>`<p class="lead">${g("sna","Social network analysis")} studies the relationships between people or things. It asks who is connected to whom, who is the most connected, and how tightly the whole group holds together. Businesses use it to find influencers, to see how a message spreads, and to understand which customers buy the same things.</p>
<div class="card try"><h3>Try it: build a network</h3><p class="small muted">Eight customers are shown as nodes. Click one node and then another to add a link between them, or to remove it if it exists.</p><div id="nw"></div><div class="callout k small" id="nn"></div><div class="row"><button class="btn" id="nr" type="button">Reset the network</button></div><div id="nt"></div></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">A network is made of ${g("node","nodes")} and edges. A node is a person or an item. An edge is a link between two nodes, such as a friendship or the fact that two customers bought the same product. The ${g("degree","degree")} of a node is the number of edges it has. The most connected node has the highest degree. ${g("centrality","Degree centrality")} is the degree divided by the largest possible degree, which is the number of other nodes, n - 1. It runs from 0 to 1.</p><p class="small">The ${g("density")} of the network is the number of edges divided by the number of possible edges, which is n times (n - 1) divided by 2. A dense network has many links, so information spreads quickly. A sparse network is spread thin. A network can also break into separate groups that have no edge between them. These groups are called components, or, when they are tightly linked inside, communities.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">The table lists the degree and the degree centrality of each node, and the note gives the number of edges, the density and the number of separate groups. Add edges to a node and its centrality rises. Add edges between all eight nodes and the density reaches 1. Remove the edges of one node and it becomes isolated: its degree is zero and it forms a group on its own. In a business setting, the node with the highest degree is the person through whom a message reaches most people, so an offer sent to that person can spread widely.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Define clearly what a node and an edge mean before you draw anything.</li><li>Report the degree and the density together with the picture.</li><li>Check for isolated nodes and separate groups.</li><li>Remember that a connection in the data is not proof of influence.</li></ul></div>
${EXC[4]}
${task(["Reset the network and write the node with the highest degree, its degree and its centrality.","Add edges until the density is above 0.5 and write how many edges that took.","Remove all edges of one node and write what happens to the number of groups."])}${quizSet(4)}`,
mount(r){const E0=[[0,1],[0,2],[1,2],[2,3],[3,4],[4,5],[4,6],[5,6],[6,7]];let E=E0.map(x=>x.slice()),pick=null;
  function key(a,b){return a<b?a+"-"+b:b+"-"+a}
  function draw(){const deg=NN.map((_,i)=>E.filter(e=>e[0]===i||e[1]===i).length),mx=Math.max(...deg);
    let s=`<svg class="chart" viewBox="0 0 500 380" role="img" aria-label="Network of eight customers">`;
    E.forEach(e=>s+=`<line x1="${NODEPOS[e[0]][0]}" y1="${NODEPOS[e[0]][1]}" x2="${NODEPOS[e[1]][0]}" y2="${NODEPOS[e[1]][1]}" stroke="var(--muted)" stroke-width="2"/>`);
    NN.forEach((n,i)=>{const hi=deg[i]===mx&&mx>0;s+=`<g class="nd" data-i="${i}" style="cursor:pointer"><circle cx="${NODEPOS[i][0]}" cy="${NODEPOS[i][1]}" r="22" fill="${pick===i?"var(--c3)":hi?"var(--c2)":"var(--c1)"}" stroke="var(--surface)" stroke-width="2"/><text x="${NODEPOS[i][0]}" y="${NODEPOS[i][1]+5}" text-anchor="middle" style="fill:#fff;font-weight:700">${n}</text></g>`});
    s+="</svg>";$("#nw",r).innerHTML=s;fitChartText(r);
    const n=8,m=E.length,dens=m/(n*(n-1)/2);const seen=new Set();let comps=0;NN.forEach((_,i)=>{if(seen.has(i))return;comps++;const st=[i];while(st.length){const x=st.pop();if(seen.has(x))continue;seen.add(x);E.forEach(e=>{if(e[0]===x)st.push(e[1]);if(e[1]===x)st.push(e[0])})}});
    $("#nn",r).innerHTML=`Edges: <b>${m}</b>. Density: <b>${dens.toFixed(2)}</b>. Separate groups: <b>${comps}</b>. `+(pick!=null?`Selected ${NN[pick]}: click another node to link or unlink.`:"Highlighted in orange: the node with the highest degree.");
    $("#nt",r).innerHTML=table(NN.map((x,i)=>({n:x,d:deg[i],c:(deg[i]/(n-1)).toFixed(2)})),[["n","Node"],["d","Degree"],["c","Degree centrality"]],{small:true});
    $$(".nd",r).forEach(g=>g.onclick=()=>{const i=+g.dataset.i;if(pick==null){pick=i}else if(pick===i){pick=null}else{const k=key(pick,i),at=E.findIndex(e=>key(e[0],e[1])===k);if(at>=0)E.splice(at,1);else E.push([pick,i]);pick=null}draw()})}
  $("#nr",r).onclick=()=>{E=E0.map(x=>x.slice());pick=null;draw()};draw();}
});

/* L5 k-means */
const CUST=(()=>{const g=groupBy(SALES,o=>o.cust);return Object.keys(g).sort().map(c=>({c,x:g[c].length,y:sum(g[c].map(o=>o.net))}))})();
function kmeans(pts,k,maxit,init){const zx=pts.map(p=>p.x),zy=pts.map(p=>p.y),mx=mean(zx),my=mean(zy),sx=sd(zx),sy=sd(zy),Z=pts.map(p=>[(p.x-mx)/sx,(p.y-my)/sy]);
  const order=Z.map((_,i)=>i).sort((a,b)=>Z[a][0]+Z[a][1]-(Z[b][0]+Z[b][1]));let C=Array.from({length:k},(_,j)=>Z[order[Math.floor((j+.5)*Z.length/k)]].slice());let asg=Array(Z.length).fill(-1),it=0;
  for(;it<maxit;it++){const na=Z.map(z=>{let b=0,bd=1e9;C.forEach((c,j)=>{const d=(z[0]-c[0])**2+(z[1]-c[1])**2;if(d<bd){bd=d;b=j}});return b});const ch=na.some((a,i)=>a!==asg[i]);asg=na;C=C.map((c,j)=>{const m=Z.filter((_,i)=>asg[i]===j);return m.length?[mean(m.map(z=>z[0])),mean(m.map(z=>z[1]))]:c});if(!ch){it++;break}}
  const w=Z.reduce((s,z,i)=>s+(z[0]-C[asg[i]][0])**2+(z[1]-C[asg[i]][1])**2,0);
  return {asg,C:C.map(c=>[c[0]*sx+mx,c[1]*sy+my]),w,it}}
lesson({nav:"Cluster analysis",title:"Cluster analysis: grouping customers with k-means",syl:"Cluster analysis",
html:()=>`<p class="lead">${g("cluster","Cluster analysis")} groups items so that those in one group are alike and those in different groups are not. Nobody tells the method what the groups are. It finds them from the data, which makes it useful for customer segments.</p>
<div class="card try"><h3>Try it: cluster the 120 customers</h3><p class="small muted">Each dot is a customer. It is placed by the number of orders and the total net sales. Choose the number of groups k.</p><div class="row"><label>k: <input type="range" id="kk" min="1" max="6" value="3"> <b id="kkv"></b></label></div><div id="kc"></div><div id="kt"></div><div id="ke"></div></div>
<div class="card sec"><h3>What the terms mean</h3><p class="small">${g("kmeans","k-means")} is the most used clustering method. It works in four steps. Choose k starting centres. Assign every item to its nearest centre. Move each centre to the mean of the items assigned to it. This mean is the ${g("centroid","centroid")} of the group. Repeat the assign and move steps until no item changes group. Distance is measured on the variables together, so the variables must be on a similar scale. Otherwise the variable with the larger numbers decides everything. The page standardises both before the distance is calculated.</p><p class="small">The method needs k in advance. The ${g("elbow","elbow method")} helps to choose it: calculate the total distance of the items from their centres for k = 1, 2, 3 and so on. The total always falls as k grows, but it falls quickly at first and then slowly. The k at which the curve bends is a sensible choice.</p></div>
<div class="card"><h3>What the demo shows</h3><p class="small">With k = 3 the customers separate into groups of few orders with low sales, a middle group, and the group of many orders with high sales. The table gives the size of each group and its average orders and net sales, which is what a manager reads. The elbow chart shows the total distance for each k. The curve falls steeply from k = 1 to k = 3 and more slowly after that, so k = 3 is a sensible choice, although the bend is not sharp. Because orders and net sales are closely related, the groups follow the same direction, so the clusters here are mainly about the size of the customer. A richer segmentation would add more variables, such as the recency of the last order.</p></div>
<div class="card sec"><h3>Rules to follow</h3><ul class="small"><li>Put the variables on a similar scale before you cluster.</li><li>Try several values of k and use the elbow chart, but also ask whether each group makes business sense.</li><li>Describe each cluster by its average values and give it a name.</li><li>Link each cluster to an action.</li></ul></div>
${EXC[5]}
${task(["Set k = 3 and write the size and averages of each group.","Compare k = 2 and k = 5. Write which gives groups that you can describe more easily.","Name each group of the k = 3 result and write one action for each."])}${quizSet(5)}`,
mount(r){function f(){const k=+$("#kk",r).value;$("#kkv",r).textContent=k;const res=kmeans(CUST,k,50),cols=[PAL[0],PAL[1],PAL[2],PAL[3],PAL[4],PAL[5]];
  $("#kc",r).innerHTML=chartScatter(CUST.map((p,i)=>({x:p.x,y:p.y,color:cols[res.asg[i]],r:4})).concat(res.C.map((c,j)=>({x:c[0],y:c[1],color:"var(--fg)",r:9}))),{title:"Customers by orders and net sales (Rs), centres in black",xlabel:"Orders",ylabel:"Net sales (Rs)",h:340,alpha:.7});
  const rows=res.C.map((c,j)=>{const m=CUST.filter((_,i)=>res.asg[i]===j);return {g:"Cluster "+(j+1),n:m.length,o:m.length?mean(m.map(x=>x.x)):0,s:m.length?mean(m.map(x=>x.y)):0}}).sort((a,b)=>a.s-b.s);
  $("#kt",r).innerHTML=table(rows.map(x=>({g:x.g,n:x.n,o:+x.o.toFixed(1),s:Math.round(x.s)})),[["g","Cluster"],["n","Customers"],["o","Average orders",1],["s","Average net sales (Rs)"]],{small:true});
  const el=[1,2,3,4,5,6].map(kk=>kmeans(CUST,kk,50).w);$("#ke",r).innerHTML=chartLine([{name:"Total distance",vals:el,color:"var(--c1)"}],["1","2","3","4","5","6"],{title:"Elbow chart: total distance by k",cat:"k",vlabel:"Total distance",h:240,min:0})}
  $("#kk",r).oninput=f;f();}
});
