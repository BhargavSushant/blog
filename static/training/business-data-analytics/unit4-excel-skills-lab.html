<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel Skills Lab - Unit IV</title>
<style>
:root{
  --bg:#FAF8F3; --surface:#FFFFFF; --surface2:#EFEBE1; --fg:#12110E; --muted:#44403A; --line:#B9B2A2; --line2:#D9D3C4;
  --pri:#1F3FB5; --pri-soft:#DDE5FA; --sec:#9A4208; --sec-soft:#FBE3CC;
  --good:#0F6A31; --good-soft:#D5F0DD; --warn:#744500; --warn-soft:#F9E8B8; --bad:#A31D12; --bad-soft:#FADAD5;
  --code:#EFEBE1; --on:#FFFFFF; --grid:#CFC9BA; --shadow:0 1px 2px rgba(18,17,14,.08),0 6px 18px rgba(18,17,14,.06);
  --c1:#1F3FB5; --c2:#9A4208; --c3:#0F6A31; --c4:#7A2A9C; --c5:#8A6D00; --c6:#B0235C;
  --disp:Georgia,'Iowan Old Style','Times New Roman',serif;
  --body:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
  --zoom:1;
}
:root[data-theme="dark"]{
  --bg:#0C0C0A; --surface:#181714; --surface2:#242320; --fg:#F7F4EA; --muted:#CFCABD; --line:#5B574B; --line2:#35332C;
  --pri:#9DB1FF; --pri-soft:#1B2350; --sec:#FFAE6B; --sec-soft:#40240E;
  --good:#6FE09A; --good-soft:#0F3320; --warn:#F5C964; --warn-soft:#3B2E0A; --bad:#FF9A8C; --bad-soft:#451A15;
  --code:#1F1E1A; --on:#0C0C0A; --grid:#46433A; --shadow:0 1px 2px rgba(0,0,0,.5),0 6px 18px rgba(0,0,0,.3);
  --c1:#9DB1FF; --c2:#FFAE6B; --c3:#6FE09A; --c4:#D9A0FF; --c5:#F0D060; --c6:#FF8FB8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);zoom:var(--zoom)}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr) 310px;min-height:calc(100vh / var(--zoom))}
.nav{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.brand{font-family:var(--disp);font-size:20px;line-height:1.15;margin:0 4px 4px}
.brand small{display:block;font:12.5px var(--body);color:var(--muted);margin-top:4px}
.nav ol{list-style:none;margin:16px 0 0;padding:0}
.nav li button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;color:var(--fg)}
.nav li button:hover{background:var(--surface2)}
.nav li button[aria-current="true"]{background:var(--pri-soft);font-weight:600}
.nav .n{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--muted);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.nav li.done .n{background:var(--good);color:var(--on);border-color:var(--good)}
.nav .t{font-size:13.5px;line-height:1.3}
.nav .hero .n{border-color:var(--sec);color:var(--sec)}
.tools{margin:18px 4px 0;display:grid;gap:8px}
.tools button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;text-align:left}
.tools button:hover{border-color:var(--fg)}
.tools .hint{font-size:12px;color:var(--muted)}
main{padding:26px 30px 70px;min-width:0}
.crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.15;margin:4px 0 6px}
h2{font-family:var(--disp);font-size:20px;margin:0 0 8px}
h3{font-size:13.5px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.syl{display:inline-block;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:12.5px;color:var(--muted);margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:16px 0;box-shadow:var(--shadow)}
.card.try{border-left:5px solid var(--pri)}
.card.sec{border-left:5px solid var(--sec)}
.lead{font-size:16.5px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 7px}
.tag.p{background:var(--pri-soft);color:var(--pri)} .tag.s{background:var(--sec-soft);color:var(--sec)}
.tag.g{background:var(--good-soft);color:var(--good)} .tag.w{background:var(--warn-soft);color:var(--warn)} .tag.b{background:var(--bad-soft);color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--pri);color:var(--on);border-color:var(--pri)} .btn.sec{background:var(--sec);color:var(--on);border-color:var(--sec)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
table.dt{border-collapse:collapse;width:100%;font-size:13.5px}
table.dt th{background:var(--surface2);text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.dt td{padding:5px 9px;border-bottom:1px solid var(--line2);white-space:nowrap}
table.dt td.num{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;max-height:340px}
.tw.sm{max-height:none}
.new{animation:pop .6s ease both}
@keyframes pop{from{background:var(--sec-soft);transform:translateY(-4px);opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.new{animation:none}}
.code{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;overflow:auto;white-space:pre-wrap;color:var(--fg)}
code{font-family:var(--mono);font-size:.92em;background:var(--code);padding:1px 5px;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:13px}
.callout{border-radius:8px;padding:10px 14px;margin:10px 0;background:var(--surface2);border:1px solid var(--line2)}
.callout.k{background:var(--sec-soft);border-color:transparent} .callout.i{background:var(--pri-soft);border-color:transparent}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 13px;cursor:pointer;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--pri);color:var(--on)}
.seg.s button[aria-pressed="true"]{background:var(--sec)}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px}
input[type=range]{accent-color:var(--pri);vertical-align:middle}
label.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer;margin-right:12px}
.live{background:var(--surface);border-left:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:calc(100vh / var(--zoom));overflow:auto}
.live .tw{max-height:none}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--fg)} .opt.ok{background:var(--good-soft);border-color:var(--good)} .opt.no{background:var(--bad-soft);border-color:var(--bad)}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.bar i{display:block;height:100%;background:var(--sec);transition:width .4s}
.flow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.arrow{font-size:28px;color:var(--sec);text-align:center}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px;margin:2px 4px 2px 0;background:var(--surface)}
td.ix{background:var(--bad-soft)} td.iy{background:var(--warn-soft)} td.iz{background:var(--pri-soft)} td.chg{background:var(--good-soft)}
.cardsel{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.kpi b{font-size:22px;display:block;font-variant-numeric:tabular-nums}
.nextrow{display:flex;justify-content:space-between;margin-top:26px;gap:10px}
svg.chart{width:100%;height:auto;display:block;max-height:420px}
svg.chart text{fill:var(--fg);font:12px var(--body)}
svg.chart .ax{stroke:var(--muted);stroke-width:1}
svg.chart .gr{stroke:var(--grid);stroke-width:1}
svg.chart .lbl{fill:var(--muted)}
.sheet{border-collapse:collapse;font-size:13.5px;font-family:var(--mono);width:100%}
.sheet th{background:var(--surface2);border:1px solid var(--line);padding:3px 8px;text-align:center;font-weight:600;color:var(--muted)}
.sheet td{border:1px solid var(--line);padding:0;min-width:80px}
.sheet td input{width:100%;border:0;background:transparent;padding:4px 7px;font:inherit;border-radius:0}
.sheet td.sel{outline:2px solid var(--pri);outline-offset:-2px}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
@media (max-width:1180px){.app{grid-template-columns:220px minmax(0,1fr)}.live{grid-column:1/-1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:760px){.app{grid-template-columns:1fr}.nav{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.nav ol{display:flex;overflow:auto;gap:4px}.nav li{flex:none}.nav .t{display:none}main{padding:18px 16px 60px}.grid2,.grid3,.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}

</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Lessons">
    <h2 class="brand">Excel Skills Lab<small>Unit IV, Excel Shortcuts and Advanced Functions<br>BBA Sem I, Business Management Tools I</small></h2>
    <ol id="navlist"></ol>
    <div class="tools"><button id="themeBtn" type="button">Theme</button><button id="zoomBtn" type="button">Text size</button><span class="hint">Projector tip: if text is hard to see, switch theme (or press Alt+D) and raise the text size.</span></div>
  </nav>
  <main id="stage" tabindex="-1"></main>
  <aside class="live" aria-label="Live data"><h3>Live data: Sunrise Retail</h3><div id="livebox"></div></aside>
</div>
<script>
"use strict";
/* ===== helpers ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,d=2)=>typeof v==="number"?(Number.isInteger(v)?v.toLocaleString("en-US"):v.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d})):v;
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
const quant=(a,q)=>{const s=[...a].sort((x,y)=>x-y),p=(s.length-1)*q,l=Math.floor(p);return s[l]+(s[Math.min(l+1,s.length-1)]-s[l])*(p-l)};
const mode=a=>{const c={};a.forEach(v=>c[v]=(c[v]||0)+1);const mx=Math.max(...Object.values(c));return Object.keys(c).filter(k=>c[k]===mx).join(", ")};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const groupBy=(rows,f)=>{const g={};rows.forEach(r=>{const k=f(r);(g[k]=g[k]||[]).push(r)});return g};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2;c+=(y[i]-my)**2});return a/Math.sqrt(b*c)};
const linfit=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0;x.forEach((v,i)=>{a+=(v-mx)*(y[i]-my);b+=(v-mx)**2});const m=a/b;return {m,b:my-m*mx,r:corr(x,y)}};
function table(rows,cols,opts={}){
  const head=cols.map(c=>`<th>${esc(c[1])}</th>`).join("");
  const body=rows.map((r,i)=>`<tr${opts.newFrom!=null&&i>=opts.newFrom?' class="new"':''}>`+cols.map(c=>{
    const v=r[c[0]],cls=(typeof v==="number"?"num":"")+((opts.cellClass&&opts.cellClass(r,c[0],i))||"");
    return `<td class="${cls.trim()}">${v===""||v==null?'<span class="muted">(blank)</span>':esc(typeof v==="number"?fmt(v,c[2]!=null?c[2]:(Number.isInteger(v)?0:2)):v)}</td>`}).join("")+"</tr>").join("");
  return `<div class="tw${opts.small?' sm':''}"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
const QUIZ={};
function quiz(id,q,opts,ans,why){QUIZ[id]={ans,why};
  return `<div class="card"><h3>Quick check</h3><p style="margin:0 0 6px"><b>${q}</b></p>`+opts.map((o,i)=>`<button class="opt" type="button" data-q="${id}" data-i="${i}">${o}</button>`).join("")+`<div class="small muted" id="why-${id}" style="margin-top:6px"></div></div>`;}
function regQuiz(id,ans,why){QUIZ[id]={ans,why}}
function seg(id,items,cls=""){return `<div class="seg ${cls}" id="${id}" role="group">`+items.map((x,i)=>`<button type="button" data-v="${x[0]}" aria-pressed="${i===0}">${x[1]}</button>`).join("")+`</div>`}
function bindSeg(root,id,fn){const g=$("#"+id,root);$$("button",g).forEach(b=>b.onclick=()=>{$$("button",g).forEach(x=>x.setAttribute("aria-pressed",x===b));fn(b.dataset.v)});return ()=>$$("[aria-pressed=true]",g)[0].dataset.v}
const IN=n=>n.toLocaleString("en-US",{maximumFractionDigits:0});

/* ===== SVG charts (colours come from CSS variables, so both themes work) ===== */
const PAL=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
const nice=(max)=>{const e=Math.pow(10,Math.floor(Math.log10(max||1))),f=max/e;const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*e};
function ticks(lo,hi,n=5){const out=[],st=(hi-lo)/n;for(let i=0;i<=n;i++)out.push(lo+st*i);return out}
const short=v=>Math.abs(v)>=100000?(v/100000).toFixed(1).replace(/\.0$/,"")+"L":Math.abs(v)>=1000?(v/1000).toFixed(1).replace(/\.0$/,"")+"k":(Math.round(v*100)/100)+"";
function chartBar(items,o={}){ // items:[{label,value,color}]
  const W=o.w||640,H=o.h||320,m={l:56,r:14,t:o.title?34:16,b:o.rotate?70:42},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...items.map(i=>i.value))*1.08),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih,bw=iw/items.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"bar chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  items.forEach((it,i)=>{const x=m.l+i*bw+bw*.15,w=bw*.7,y=sy(Math.max(it.value,mn));
    s+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0,sy(mn)-y)}" fill="${it.color||o.color||"var(--c1)"}" rx="2"><title>${esc(it.label)}: ${fmt(it.value)}</title></rect>`;
    if(o.values!==false&&items.length<=14)s+=`<text x="${x+w/2}" y="${y-4}" text-anchor="middle" style="font-size:11px">${short(it.value)}</text>`;
    const lx=x+w/2,ly=H-m.b+16;s+=o.rotate?`<text x="${lx}" y="${ly}" text-anchor="end" transform="rotate(-35 ${lx} ${ly})">${esc(it.label)}</text>`:`<text x="${lx}" y="${ly}" text-anchor="middle">${esc(it.label)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  if(o.ylabel)s+=`<text class="lbl" x="12" y="${m.t+ih/2}" transform="rotate(-90 12 ${m.t+ih/2})" text-anchor="middle">${esc(o.ylabel)}</text>`;
  return s+"</svg>";}
function chartLine(series,labels,o={}){ // series:[{name,vals,color,dash}]
  const W=o.w||640,H=o.h||320,m={l:56,r:o.legendRight?110:16,t:o.title?34:16,b:44},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const all=series.flatMap(s=>s.vals.filter(v=>v!=null)),mn=o.min!=null?o.min:0,mx=o.max||nice(Math.max(...all)*1.08);
  const sx=i=>m.l+(labels.length===1?iw/2:i*iw/(labels.length-1)),sy=v=>m.t+ih-(v-mn)/(mx-mn)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"line chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(mn,mx).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  const step=Math.ceil(labels.length/(o.maxLabels||12));labels.forEach((l,i)=>{if(i%step===0)s+=`<text class="lbl" x="${sx(i)}" y="${H-m.b+16}" text-anchor="middle">${esc(l)}</text>`});
  s+=`<line class="ax" x1="${m.l}" x2="${W-m.r}" y1="${sy(mn)}" y2="${sy(mn)}"/>`;
  series.forEach((se,k)=>{const c=se.color||PAL[k%6];let d="";se.vals.forEach((v,i)=>{if(v!=null)d+=(d?"L":"M")+sx(i).toFixed(1)+" "+sy(v).toFixed(1)});
    if(o.area&&k===0)s+=`<path d="${d}L${sx(se.vals.length-1)} ${sy(mn)}L${sx(0)} ${sy(mn)}Z" fill="${c}" opacity=".18"/>`;
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${se.w||2.5}" ${se.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round"/>`;
    if(o.dots!==false&&!se.dash)se.vals.forEach((v,i)=>{if(v!=null)s+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="3.5" fill="${c}"><title>${esc(labels[i])}: ${fmt(v)}</title></circle>`});
    if(o.legendRight)s+=`<text x="${W-m.r+8}" y="${m.t+14+k*16}" style="fill:${c};font-weight:600">${esc(se.name)}</text>`;
    else if(series.length>1)s+=`<text x="${m.l+8+k*150}" y="${H-6}" style="fill:${c};font-weight:600">&#9632; ${esc(se.name)}</text>`});
  (o.marks||[]).forEach(mk=>{s+=`<text x="${sx(mk.i)}" y="${sy(mk.v)-10}" text-anchor="middle" style="font-weight:700;fill:${mk.color||"var(--sec)"}">${esc(mk.text)}</text>`});
  return s+"</svg>";}
function chartScatter(pts,o={}){ // pts:[{x,y,r,color,label}]
  const W=o.w||640,H=o.h||340,m={l:60,r:16,t:o.title?34:16,b:46},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=o.x0!=null?o.x0:Math.min(...xs),x1=o.x1!=null?o.x1:Math.max(...xs),y0=o.y0!=null?o.y0:0,y1=o.y1||nice(Math.max(...ys)*1.05);
  const sx=v=>m.l+(v-x0)/(x1-x0||1)*iw,sy=v=>m.t+ih-(v-y0)/(y1-y0)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"scatter chart")}">`;
  if(o.title)s+=`<text x="${m.l}" y="18" style="font-weight:700;font-size:14px">${esc(o.title)}</text>`;
  ticks(y0,y1).forEach(t=>s+=`<line class="gr" x1="${m.l}" x2="${W-m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text class="lbl" x="${m.l-6}" y="${sy(t)+4}" text-anchor="end">${short(t)}</text>`);
  ticks(x0,x1).forEach(t=>s+=`<text class="lbl" x="${sx(t)}" y="${H-m.b+16}" text-anchor="middle">${short(t)}</text>`);

function chartPie(items,o={}){const W=o.w||420,H=o.h||300,cx=120,cy=H/2,R=100,tot=sum(items.map(i=>i.value));let a=-Math.PI/2,s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="pie chart">`;

function histBins(vals,n,lo,hi){const w=(hi-lo)/n,b=Array(n).fill(0);vals.forEach(v=>{let i=Math.floor((v-lo)/w);if(i>=n)i=n-1;if(i<0)i=0;b[i]++});return b.map((c,i)=>({label:short(lo+i*w),value:c,lo:lo+i*w,hi:lo+(i+1)*w}))}

const L=[];

let cur=0, done=new Set();
const UKEY="dalab_"+(document.title||"x");
try{JSON.parse(localStorage.getItem(UKEY)||"[]").forEach(x=>done.add(x))}catch(e){}
function go(i){
  cur=Math.max(0,Math.min(L.length-1,i));
  const l=L[cur],st=$("#stage");
  st.innerHTML=`<div class="crumb">Lesson ${cur+1} of ${L.length}</div><h1>${l.title}</h1><div class="syl">Syllabus: ${l.syl}</div>`+l.html()+
    `<div class="nextrow"><button class="btn" type="button" id="prevB" ${cur?"":"disabled"}>Previous</button><button class="btn pri" type="button" id="nextB" ${cur<L.length-1?"":"disabled"}>Next lesson</button></div>`;
  $("#prevB").onclick=()=>go(cur-1); $("#nextB").onclick=()=>go(cur+1);
  l.mount&&l.mount(st);
  $$("[data-q]",st).forEach(b=>b.onclick=()=>{
    const id=b.dataset.q,k=QUIZ[id],ok=+b.dataset.i===k.ans;
    $$(`[data-q="${id}"]`,st).forEach(x=>x.classList.remove("ok","no"));
    b.classList.add(ok?"ok":"no");
    $("#why-"+id,st).textContent=(ok?"Correct. ":"Not quite. ")+k.why;
    if(ok){done.add(cur);try{localStorage.setItem(UKEY,JSON.stringify([...done]))}catch(e){}drawNav()}
  });
  drawNav(); window.scrollTo(0,0); st.focus({preventScroll:true});
}
function drawNav(){
  $("#navlist").innerHTML=L.map((l,i)=>`<li class="${done.has(i)?"done":""}${l.hero?" hero":""}"><button type="button" data-go="${i}" ${i===cur?'aria-current="true"':""}><span class="n">${done.has(i)?"&#10003;":i+1}</span><span class="t">${l.nav}</span></button></li>`).join("");
  $$("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));
}

function shiftF(f,dr,dc){const strs=[];let s=f.replace(/"([^"]*)"/g,(m,a)=>{strs.push(a);return `\u0001${strs.length-1}\u0001`});

function sheetHTML(){return `<div class="row" style="margin:4px 0"><input type="text" id="nb" value="A1" style="width:110px;font-family:var(--mono)" aria-label="Name box"><span class="muted small">Name Box</span><input type="text" id="fb" style="flex:1;min-width:200px;font-family:var(--mono)" aria-label="Formula bar" placeholder="formula bar"><span class="muted small">fx</span></div>

function mountSheet(r,top0=1,sel0){
  let top=top0,showF=false;const PAGE=20;

    let h=`<table class="sheet"><thead><tr><th></th>`+Array.from({length:NCOLS},(_,c)=>`<th>${colName(c)}</th>`).join("")+`</tr></thead><tbody>`;
    rows.forEach(rn=>{h+=`<tr><th>${rn}</th>`;for(let c=0;c<NCOLS;c++){const a=colName(c)+rn,raw=CELLS[a];h+=`<td${a===SEL?' class="sel"':''}><input data-a="${a}" value="${esc(showF&&typeof raw==="string"&&raw[0]==="="?raw:show(ev(a)))}" ${typeof raw==="number"||(typeof raw==="string"&&raw[0]!=="=")?'':''}></td>`}h+="</tr>"});
    $("#shw",r).innerHTML=h+"</tbody></table>";$("#pgi",r).textContent=`Rows ${top} to ${Math.min(top+PAGE-1,NROWS)} of ${NROWS}`;
    $$("#shw input",r).forEach(i=>{const a=i.dataset.a;
      i.onfocus=()=>{SEL=a;$("#nb",r).value=a;const raw=CELLS[a];i.value=raw==null?"":String(raw);$("#fb",r).value=i.value;$$("#shw td.sel",r).forEach(x=>x.classList.remove("sel"));i.parentElement.classList.add("sel");i.select()};
      i.oninput=()=>$("#fb",r).value=i.value;
      i.onblur=()=>{const raw=CELLS[a],cur=raw==null?"":String(raw);if(i.value!==cur&&!(showF&&i.value===(typeof raw==="string"?raw:show(ev(a))))&&i.value!==show(ev(a))){setCell(a,i.value)}else i.value=showF&&typeof raw==="string"&&raw[0]==="="?raw:show(ev(a))};
      i.onkeydown=e=>{if(e.key==="Enter"){i.blur();const m=a.match(/([A-Z]+)(\d+)/),n=m[1]+(+m[2]+1);const nx=$(`[data-a="${n}"]`,r);if(nx)nx.focus()}}});}
  const refresh=()=>{const act=document.activeElement;draw();};

  $("#nb",r).onkeydown=e=>{if(e.key!=="Enter")return;const v=$("#nb",r).value.toUpperCase().replace(/\$/g,"");const m=v.match(/^([A-Z]{1,2})(\d+)(?::([A-Z]{1,2})(\d+))?$/);if(!m)return;
    const a=m[1]+m[2];if(+m[2]<top||+m[2]>=top+PAGE)top=Math.max(1,Math.min(NROWS-PAGE+1,+m[2]));SEL=a;if(m[3]){const vals=ev0(`${m[1]}${m[2]}`,`${m[3]}${m[4]}`);const n=vals.filter(x=>typeof x==="number");lastStat={rng:v,sum:sum(n),avg:n.length?mean(n):0,n:n.length}}draw();stat();$("#fb",r).value=CELLS[a]==null?"":String(CELLS[a]);sheetTouch()};
  function ev0(a,b){const m1=a.match(/([A-Z]+)(\d+)/),m2=b.match(/([A-Z]+)(\d+)/),out=[];for(let rr=+m1[2];rr<=+m2[2];rr++)for(let c=colIdx(m1[1]);c<=colIdx(m2[1]);c++)out.push(ev(colName(c)+rr));return out}
  $("#pgU",r).onclick=()=>{top=Math.max(1,top-PAGE);draw()};$("#pgD",r).onclick=()=>{top=Math.min(NROWS-PAGE+1,top+PAGE);draw()};
  $("#fdb",r).onclick=()=>{fillDown(SEL,+$("#fdn",r).value)};$("#shf",r).onclick=()=>{showF=!showF;$("#shf",r).textContent=showF?"Show values":"Show formulas";draw()};

function tasksHTML(ts){return `<div id="tasks">`+ts.map((t,i)=>`<div class="row" style="margin:4px 0"><span class="tag w" id="tk${i}">To do</span><span class="small">${t[0]}</span></div>`).join("")+`</div>`}

lesson({nav:"Interface, data entry, formatting",title:"Excel basics: interface, data entry, workbooks, formatting",syl:"Introduction to MS Excel, Navigating Excel Interface, Mastering Data Entry and Manipulation, Workbook and Spreadsheet Management, Formatting for Clarity and Readability",
html:()=>`<p class="lead">This page contains a <b>working spreadsheet</b> loaded with the Sunrise data: columns A to P (same layout as your Notion pages), and the Products table at X1:AA13. Type formulas in it just as in Excel or Google Sheets. Nothing is saved to any file.</p>
<div class="grid2"><div class="card"><h3>Parts of the screen</h3><p class="small"><b>Cell</b> = one box (M2). <b>Range</b> = a block (M2:M989). <b>Worksheet</b> = one tab; <b>workbook</b> = the whole file. <b>Name Box</b> (left) shows or jumps to a cell. <b>Formula bar</b> (right) shows what is truly inside the cell. <b>Status bar</b> (bottom) shows Sum, Average, Count of the selection.</p></div>
<div class="card"><h3>Data entry and formatting</h3><p class="small">Text aligns left, numbers right. Drag the fill handle to continue 1, 2, 3 or Jan, Feb. Format cells for readability (currency, % and 2 decimals, bold header, frozen header row). Formatting changes how a value looks, <b>never what it is</b>. Practise these in Excel or Sheets with your Notion steps; this page practises formulas.</p></div></div>
<div class="card try"><h3>Try it: three tasks</h3><div id="tkw"></div>${"" }<div id="shl"></div></div>
${quiz("u4q1","What does the Name Box do?",["Names the workbook","Shows the selected cell and lets you jump to any cell or range","Formats numbers"],1,"Type an address like M2:M989 and press Enter to jump there and select it.")}`,
mount(r){$("#shl",r).innerHTML=sheetHTML();mountSheet(r);
  const ts=[["Click the <b>Name Box</b>, type <code>M2:M989</code>, press Enter. The status bar shows Sum <b>752,219.75</b>.",()=>lastStat&&lastStat.rng==="M2:M989"&&near(lastStat.sum,752219.75)],
   ["In cell <b>S1</b> type <code>=SUM(M2:M989)</code> and press Enter.",()=>near(val("S1"),752219.75)],
   ["In cell <b>S2</b> type <code>=AVERAGE(M2:M989)</code>. Expect <b>761.36</b>.",()=>near(val("S2"),761.36)]];
  $("#tkw",r).innerHTML=tasksHTML(ts);withTasks(r,ts);
  $("#fdn",r).value=6;$("#nb",r).value="S1";}
});
lesson({nav:"Formulas, references and charts",title:"Essential formulas: relative vs absolute references",syl:"Essential Formulas and Functions, Charts and Visual Representations",
html:()=>`<p class="lead">Every formula starts with <code>=</code>. The most common student error: copying a formula down and getting wrong answers because of <b>references</b>.</p>
<div class="grid3"><div class="cardsel"><b>Relative</b> <code>M2</code><br><span class="small">changes when copied</span></div><div class="cardsel"><b>Absolute</b> <code>$M$2</code><br><span class="small">never changes (F4)</span></div><div class="cardsel"><b>Mixed</b> <code>$M2</code> or <code>M$2</code><br><span class="small">one part fixed</span></div></div>
<div class="card try"><h3>Reference trainer: what happens when I fill down?</h3>
<div class="row"><input type="text" id="rf" value="=SUMIFS($M$2:$M$989,$C$2:$C$989,W2)" style="width:100%;max-width:420px;font-family:var(--mono)"></div>
<div class="row">Fill down by <input type="range" id="rk" min="1" max="4" value="1"> <b id="rkv">1</b> row(s)</div><div id="rfo"></div></div>
<div class="card try"><h3>Do it in the sheet</h3><p class="small muted">Type the five regions in W2:W6 (or press the button), then build the formulas below and fill down to row 6.</p><div class="row"><button class="btn sm" id="regs" type="button">Fill W2:W6 with the regions</button></div><div id="tkw"></div><div id="shl"></div></div>
${quiz("u4q2","You fill =SUMIFS(M2:M989,C2:C989,W2) down 4 rows. What does row 6 look like?",["Unchanged","=SUMIFS(M6:M993,C6:C993,W6)","=SUMIFS($M$2:$M$989,$C$2:$C$989,W6)"],1,"Without dollar signs both ranges slide down, so you sum the wrong rows (and run past the data).")}`,
mount(r){function t(){const k=+$("#rk",r).value;$("#rkv",r).textContent=k;const f=$("#rf",r).value;$("#rfo",r).innerHTML=`<div class="code">Row 2:  ${esc(f)}\nRow ${2+k}:  ${esc(shiftF(f,k,0))}</div><p class="small">${shiftF(f,k,0)===f?'<span class="tag g">Locked</span> nothing slid.':"Parts without a $ slid down."}</p>`}
  $("#rf",r).oninput=t;$("#rk",r).oninput=t;t();
  $("#shl",r).innerHTML=sheetHTML();mountSheet(r,1);$("#fdn",r).value=6;$("#nb",r).value="X2";
  $("#regs",r).onclick=()=>{REGIONS.forEach((g,i)=>CELLS["W"+(i+2)]=g);sheetChanged()};
  const ts=[["In <b>X2</b> type <code>=SUMIFS($M$2:$M$989,$C$2:$C$989,W2)</code>, select X2, press <b>Fill down</b> (to row 6). X2:X6 should be Central 164,469.20 ... West 152,940.85.",()=>REGIONS.every((g,i)=>near(val("X"+(i+2)),SUMIFR[i][1],.05))],
   ["Share of total: in <b>Y2</b> type <code>=X2/SUM($X$2:$X$6)</code> and fill down to row 6. The five shares should add up to 1 (100 percent). Central is about 0.22.",()=>near(val("Y2"),0.2186,.001)&&near(sum([2,3,4,5,6].map(i=>val("Y"+i)||0)),1,.001)],
   ["Break it on purpose: in <b>Z2</b> type <code>=X2/SUM(X2:X6)</code> (no $) and fill down. Row 6 shows 1 because it divides by itself.",()=>typeof CELLS.Z2==="string"&&CELLS.Z2.indexOf("$")<0&&typeof CELLS.Z6==="string"&&near(val("Z6"),1,.001)]];
  $("#tkw",r).innerHTML=tasksHTML(ts);withTasks(r,ts);}
});
/* pivot builder */
const PF={region:"Region",cat:"Category",seg:"Segment",pay:"Payment mode",sp:"Salesperson",product:"Product",month:"Month",city:"City"};
const PV={net:"Net sales",units:"Units",profit:"Profit",order:"Orders"};
lesson({hero:true,nav:"Pivot tables",title:"Data analysis with pivot tables",syl:"Data Analysis with Pivot Tables",
html:()=>`<p class="lead">A <b>pivot table</b> summarises thousands of rows by dragging fields: <b>Rows</b> and <b>Columns</b> become headings, <b>Values</b> are what gets calculated, and <b>Filters</b> limit the data. No formulas needed.</p>
<div class="card try"><h3>Try it: build a pivot</h3>
<div class="row">Rows <select id="pr"></select> Columns <select id="pc"></select> Values <select id="pv"></select> as <select id="pa"><option value="sum">Sum</option><option value="count">Count</option><option value="avg">Average</option></select></div>
<div class="row">Filter <select id="pf"><option value="">(none)</option></select> = <select id="pfv"></select> <label class="chk"><input type="checkbox" id="ppc"> Show as % of grand total</label></div>
<div id="po"></div><div class="callout k small" id="pn"></div></div>
<div class="card"><h3>Try these (check against your Notion answer key)</h3><p class="small">1. Rows = Region, Columns = Category, Values = Net sales (sum): Central/Accessories <b>59,263.05</b>, grand total <b>752,219.75</b>.<br>2. Rows = Salesperson, Values = Orders: Vikas Joshi <b>107</b>, Aman Verma <b>90</b>.<br>3. Filter Segment = Retail, rows Region: Central <b>74,844.30</b>.<br>In Google Sheets: Insert, Pivot table. In Excel: Insert, PivotTable.</p></div>
${quiz("u4q3","In a pivot table, where does the number you want to add up go?",["Rows","Columns","Values"],2,"Rows and Columns are headings; Values hold the calculation (sum, count, average).")}`,
mount(r){const opt=(o,none)=>(none?'<option value="">(none)</option>':"")+Object.entries(o).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  $("#pr",r).innerHTML=opt(PF);$("#pc",r).innerHTML=opt(PF,true);$("#pv",r).innerHTML=opt(PV);$("#pf",r).innerHTML=opt(PF,true);$("#pc",r).value="cat";
  function fv(){const f=$("#pf",r).value;$("#pfv",r).innerHTML=f?[...new Set(SALES.map(x=>x[f]))].sort().map(x=>`<option>${x}</option>`).join(""):""}
  function d(){const R=$("#pr",r).value,C=$("#pc",r).value,V=$("#pv",r).value,A=$("#pa",r).value,fl=$("#pf",r).value,fval=$("#pfv",r).value,pc=$("#ppc",r).checked;
    const rows=SALES.filter(x=>!fl||x[fl]===fval),vf=x=>V==="order"?1:x[V];
    const agg=rs=>{if(!rs.length)return null;const v=rs.map(vf);return A==="sum"?sum(v):A==="count"?v.length:mean(v)};
    const rk=[...new Set(rows.map(x=>x[R]))].sort(),ck=C?[...new Set(rows.map(x=>x[C]))].sort():[],tot=agg(rows);
    const f=v=>v==null?"":pc?(100*v/tot).toFixed(1)+"%":fmt(v,A==="count"||V==="order"&&A==="sum"?0:2);
    let h=`<div class="tw sm"><table class="dt"><thead><tr><th>${PF[R]}</th>${ck.map(c=>`<th>${c}</th>`).join("")}<th>Grand total</th></tr></thead><tbody>`;
    rk.forEach(a=>{const rs=rows.filter(x=>x[R]===a);h+=`<tr><td><b>${a}</b></td>`+ck.map(c=>`<td class="num">${f(agg(rs.filter(x=>x[C]===c)))}</td>`).join("")+`<td class="num"><b>${f(agg(rs))}</b></td></tr>`});
    h+=`<tr><td><b>Grand total</b></td>`+ck.map(c=>`<td class="num"><b>${f(agg(rows.filter(x=>x[C]===c)))}</b></td>`).join("")+`<td class="num"><b>${f(tot)}</b></td></tr></tbody></table></div>`;
    $("#po",r).innerHTML=h;$("#pn",r).innerHTML=`${rows.length} of ${SALES.length} orders included. Same result with a formula: <code>=SUMIFS(NetSales, Region, "Central", Category, "Accessories")</code>, one cell at a time. The pivot does the whole grid in one go.`}
  ["pr","pc","pv","pa","ppc","pfv"].forEach(i=>$("#"+i,r).onchange=d);$("#pf",r).onchange=()=>{fv();d()};fv();d();}
});
/* shortcuts */
const SC=[["Jump to the last row of data","Ctrl+Down","Ctrl+ArrowDown"],["Go to the first cell (A1)","Ctrl+Home","Ctrl+Home"],["Go to the last used cell","Ctrl+End","Ctrl+End"],["Select the whole column","Ctrl+Space","Ctrl+Space"],["Select the whole row","Shift+Space","Shift+Space"],["Turn filters on or off","Ctrl+Shift+L","Ctrl+Shift+KeyL"],["Edit the active cell","F2","F2"],["Cycle $ reference types","F4","F4"],["Fill down","Ctrl+D","Ctrl+KeyD"],["Insert today's date","Ctrl+;","Ctrl+Semicolon"],["Show formulas","Ctrl+`","Ctrl+Backquote"],["Format cells","Ctrl+1","Ctrl+Digit1"],["Select everything","Ctrl+A","Ctrl+KeyA"],["Undo","Ctrl+Z","Ctrl+KeyZ"],["Select to the edge of data (down)","Ctrl+Shift+Down","Ctrl+Shift+ArrowDown"]];
const SCX=[["AutoSum","Alt+="],["Paste values only","Ctrl+Shift+V (Excel 365) or Ctrl+Alt+V, V"],["Insert a table","Ctrl+T"],["Insert pivot table","Alt, N, V"],["Find / Replace","Ctrl+F / Ctrl+H"],["Next sheet / previous sheet","Ctrl+PageDown / PageUp"]];
lesson({nav:"Shortcuts and productivity",title:"Excel shortcuts and time-saving techniques",syl:"Essential Excel shortcuts, time-saving techniques, applying shortcuts to common business management tasks",
html:()=>`<p class="lead">Shortcuts keep your hands on the keyboard, which is much faster than reaching for the mouse. Learn <b>five at a time</b>. Most work the same in Google Sheets.</p>
<div class="card try"><h3>Drill: press the keys</h3><p class="small muted">The prompt asks for an action. Press the shortcut on your keyboard (the page captures it). 5 questions, timed.</p>
<div class="row"><button class="btn pri" id="sgo" type="button">Start drill</button><span id="stime" class="small"></span></div><div id="sq" class="callout i" style="font-size:18px">Press Start.</div><div id="ssc" class="small"></div></div>
<div class="card"><h3>Cheat sheet</h3><div class="row"><input type="text" id="sfind" placeholder="Search an action..." style="min-width:240px"></div><div id="stab"></div></div>
<div class="card"><h3>Business task: the weekly sales check (keyboard only)</h3><p class="small">1. Ctrl+Down in M2 to reach the last order. 2. Ctrl+Home, then Ctrl+Shift+Down to select NetSales (status bar: <b>752,219.75</b>). 3. Ctrl+Shift+L, filter Region = West. 4. <code>=SUBTOTAL(109,M2:M989)</code> gives <b>152,940.85</b>; <code>=SUBTOTAL(103,A2:A989)</code> gives <b>191</b> orders. 5. Ctrl+; to stamp the date. Time yourself with the mouse first, then keyboard only.</p></div>
${quiz("u4q4","Which shortcut turns the filter dropdowns on or off?",["Ctrl+Shift+L","Ctrl+F","Alt+="],0,"Ctrl+Shift+L toggles filters. Ctrl+F is Find; Alt+= is AutoSum.")}`,
mount(r){function tab(q){const all=SC.map(s=>[s[0],s[1]]).concat(SCX);$("#stab",r).innerHTML=table(all.filter(a=>!q||(a[0]+a[1]).toLowerCase().includes(q.toLowerCase())).map(a=>({a:a[0],k:a[1]})),[["a","Action"],["k","Keys"]],{small:true})}
  tab("");$("#sfind",r).oninput=e=>tab(e.target.value);
  let qs=[],i=0,score=0,t0=0,on=false;
  const sig=e=>{let p=[];if(e.ctrlKey||e.metaKey)p.push("Ctrl");if(e.altKey)p.push("Alt");if(e.shiftKey)p.push("Shift");const k=e.code;if(!["ControlLeft","ControlRight","ShiftLeft","ShiftRight","AltLeft","AltRight","MetaLeft","MetaRight"].includes(k))p.push(k);return p.join("+")};
  function nxt(){if(i>=5){on=false;$("#sq",r).textContent="Done!";$("#ssc",r).innerHTML=`Score <b>${score} of 5</b> in <b>${((Date.now()-t0)/1000).toFixed(1)} s</b>. Run it again and beat your time.`;return}
    $("#sq",r).innerHTML=`${i+1}/5: <b>${qs[i][0]}</b>`;}
  $("#sgo",r).onclick=()=>{qs=sample(SC,5);i=0;score=0;t0=Date.now();on=true;$("#ssc",r).textContent="";nxt();$("#sgo",r).blur()};
  const kd=e=>{if(!on)return;if(["ControlLeft","ControlRight","ShiftLeft","ShiftRight","AltLeft","AltRight"].includes(e.code))return;e.preventDefault();const ok=sig(e)===qs[i][2];if(ok)score++;
    $("#ssc",r).innerHTML=ok?'<span class="tag g">Correct</span>':`<span class="tag b">It was ${qs[i][1]}</span>`;i++;nxt()};
  document.addEventListener("keydown",kd);const obs=new MutationObserver(()=>{if(!document.body.contains(r.querySelector("#sgo"))){document.removeEventListener("keydown",kd);obs.disconnect()}});obs.observe(r,{childList:true});}
});
/* sort and filter */
const FC={region:"Region",product:"Product",cat:"Category",seg:"Segment",pay:"Payment mode",net:"Net sales",units:"Units",disc:"Discount %",month:"Month"};
lesson({nav:"Sorting and filtering",title:"Data sorting and filtering",syl:"Introduction to Data Sorting and Filtering, Mastering Data Sorting, Exploring Data Filtering",
html:()=>`<p class="lead"><b>Sorting</b> reorders rows. Always sort the <b>whole table</b>, never one column alone, or rows get scrambled. <b>Multi-level sorting</b> sorts by one column, then breaks ties with another. <b>Filtering</b> hides rows that do not match; nothing is deleted.</p>
<div class="card try"><h3>Try it: filter, then sort the Sunrise orders</h3>
<div class="row">Filter: <select id="fc"></select> <select id="fo"><option value="=">equals</option><option value="c">contains</option><option value=">=">is at least</option><option value="<=">is at most</option></select> <input type="text" id="fvv" value="West" style="width:130px"></div>
<div class="row">Sort by <select id="s1"></select> <select id="d1"><option value="1">A to Z / low to high</option><option value="-1" selected>Z to A / high to low</option></select> then by <select id="s2"><option value="">(none)</option></select></div>
<div id="fo2"></div><div id="ft"></div></div>
<div class="card"><h3>Check your skills</h3><p class="small">Net sales &gt;= 1500: <b>144</b> orders. Product contains "Lamp": <b>74</b> orders (113,028.30). Month = 2026-03: <b>114</b> orders (101,721.60). Top order sorted by Net sales: <b>ORD1262, 5,592.00</b>.<br>Spreadsheet: Data, Sort range or Data, Create a filter. Formula version: <code>=FILTER(A2:O989, C2:C989="North", M2:M989&gt;=1500)</code> and <code>=SUBTOTAL(109, M2:M989)</code> to total the visible rows.</p></div>
${quiz("u4q5","You sort only column M (NetSales) and leave the other columns. What happens?",["Nothing","Net sales no longer match their orders","Excel fixes it automatically"],1,"Each net sales value is separated from its own order row. Always sort the full table.")}`,
mount(r){const o=Object.entries(FC).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");$("#fc",r).innerHTML=o;$("#s1",r).innerHTML=o;$("#s2",r).innerHTML='<option value="">(none)</option>'+o;$("#s1",r).value="net";
  function d(){const c=$("#fc",r).value,op=$("#fo",r).value,vv=$("#fvv",r).value,numc=["net","units","disc"].includes(c);let rows=SALES.filter(x=>{const a=x[c];if(op==="=")return String(a).toLowerCase()===vv.toLowerCase();if(op==="c")return String(a).toLowerCase().includes(vv.toLowerCase());if(op===">=")return +a>=+vv;return +a<=+vv});
    const k1=$("#s1",r).value,k2=$("#s2",r).value,dir=+$("#d1",r).value,cmp=(a,b)=>a<b?-1:a>b?1:0;rows=rows.slice().sort((x,y)=>cmp(x[k1],y[k1])*dir||(k2?cmp(x[k2],y[k2])*dir:0));
    $("#fo2",r).innerHTML=`<div class="grid3"><div class="kpi"><span class="small muted">Rows shown</span><b>${rows.length}</b></div><div class="kpi"><span class="small muted">SUBTOTAL(109, net sales)</span><b>${fmt(sum(rows.map(x=>x.net)))}</b></div><div class="kpi"><span class="small muted">Average order</span><b>${rows.length?fmt(mean(rows.map(x=>x.net))):"-"}</b></div></div>`;
    $("#ft",r).innerHTML=table(rows.slice(0,40),[["order","Order"],["month","Month"],["region","Region"],["product","Product"],["units","Units"],["disc","Disc %"],["net","Net sales"]],{})+(rows.length>40?`<p class="small muted">Showing the first 40 of ${rows.length}.</p>`:"")}
  $$("#fc,#fo,#fvv,#s1,#d1,#s2",r).forEach(e=>e.oninput=d);d();}
});
/* functions lab */
const FLAB=[
 ["Math and stats","=LARGE(M2:M989,2)","Second largest order",5490],["Math and stats","=PERCENTILE(M2:M989,0.9)","90 percent of orders are below this",1745],["Math and stats","=MODE(F2:F989)","Most common order size",1],["Math and stats","=AVERAGEIFS(M2:M989,C2:C989,\"North\")","Average order in the North",808.27],["Math and stats","=COUNTIFS(K2:K989,\"UPI\",C2:C989,\"North\")","UPI orders in the North",53],
 ["Text","=LEFT(A2,3)","First 3 characters",null],["Text","=VALUE(MID(A2,4,4))","Order number as a real number",1001],["Text","=PROPER(TRIM(\"  aman   VERMA \"))","Clean a messy name",null],["Text","=E2&\" - \"&C2","Join two columns",null],
 ["Information","=COUNT(J2:J989)","Numeric ratings",982],["Information","=COUNTA(J2:J989)","All non-empty ratings cells",988],["Information","=ISNUMBER(J2)","Is the first rating a number?",null],
 ["Logical","=IF(M2>=1500,\"High\",\"Normal\")","One IF",null],["Logical","=COUNTIF(M2:M989,\">=1500\")","How many orders are High",144],["Logical","=IFERROR(VLOOKUP(\"Tablet\",X2:AA13,2,FALSE),\"Not found\")","A lookup that fails, handled",null],["Logical","=VLOOKUP(\"Backpack\",X2:AA13,3,FALSE)","Cost price of a Backpack",350]];
lesson({hero:true,nav:"Functions lab",title:"Math, text, information and logical functions",syl:"Math and Stats Functions, Text and Information Functions, Logical Functions",
html:()=>`<p class="lead">A function is a ready-made calculation: <code>NAME(inputs)</code>. Four families: <b>Math and stats</b> (SUMIFS, AVERAGEIFS, LARGE, PERCENTILE), <b>Text</b> (LEFT, MID, PROPER, TRIM, &amp;), <b>Information</b> (ISNUMBER, COUNT vs COUNTA), <b>Logical</b> (IF, IFS, AND, OR, IFERROR).</p>
<div class="card try"><h3>Function cards: run each against the real data</h3><div id="fcards"></div></div>
<div class="card try"><h3>Your own formula</h3><div class="row"><input type="text" id="fx" style="flex:1;min-width:260px;font-family:var(--mono)" value="=SUMIFS(M2:M989,C2:C989,&quot;West&quot;,L2:L989,&quot;Electronics&quot;)"><button class="btn pri" id="fxb" type="button">Evaluate</button></div><div id="fxo" class="callout i">Expected for the default: 62,137.20 (West Electronics).</div></div>
<div class="card try"><h3>Build the logic columns (Notion lecture 6)</h3><p class="small muted">Write each formula in row 2 of the column, then Fill down to row 989.</p><div id="tkw"></div><div id="shl"></div></div>
${quiz("u4q6","What does =IF(AND(C2=\"North\",M2>=1500),\"North big\",\"-\") do?",["Marks orders that are in the North AND at least 1500","Marks North OR big orders","Sums North orders"],0,"AND needs both conditions true. Use OR if either is enough.")}`,
mount(r){let h="",grp="";FLAB.forEach((f,i)=>{if(f[0]!==grp){grp=f[0];h+=`<h3 style="margin-top:12px">${grp}</h3>`}h+=`<div class="row" style="margin:4px 0"><code style="min-width:280px">${esc(f[1])}</code><span class="small" style="flex:1">${f[2]}</span><button class="btn sm" data-f="${i}" type="button">Run</button><b id="fr${i}" style="min-width:90px"></b></div>`});
  $("#fcards",r).innerHTML=h;$$("[data-f]",r).forEach(b=>b.onclick=()=>{const f=FLAB[+b.dataset.f],v=evalExpr(f[1]),el=$("#fr"+b.dataset.f,r);el.textContent=show(v);el.style.color=f[3]==null?"var(--fg)":near(v,f[3],.02)?"var(--good)":"var(--bad)"});
  $("#fxb",r).onclick=()=>{const v=evalExpr($("#fx",r).value);$("#fxo",r).innerHTML="Result: <b>"+esc(show(v))+"</b>"};
  $("#shl",r).innerHTML=sheetHTML();mountSheet(r,1);$("#fdn",r).value=989;$("#nb",r).value="Q2";
  const cnt=(c,v)=>{let n=0;for(let i=2;i<=989;i++)if(val(c+i)===v)n++;return n};
  const ts=[["<b>Q2</b>: <code>=IF(M2&gt;=1500,\"High\",\"Normal\")</code> filled to row 989 gives <b>144</b> High.",()=>cnt("Q","High")===144],
   ["<b>R2</b>: <code>=IFS(M2&gt;=1500,\"High\",M2&gt;=500,\"Medium\",TRUE,\"Low\")</code> filled down gives <b>502</b> Low, <b>342</b> Medium.",()=>cnt("R","Low")===502&&cnt("R","Medium")===342],
   ["<b>T2</b>: <code>=IF(OR(C2=\"North\",M2&gt;=1500),0.05,0.02)*M2</code> filled down. Then in <b>U1</b> type <code>=SUM(T2:T989)</code>: expect <b>27,364.35</b>.",()=>near(val("U1"),27364.35,.05)]];
  $("#tkw",r).innerHTML=tasksHTML(ts);withTasks(r,ts);}
});
