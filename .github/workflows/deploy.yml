name: Deploy Hugo site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token: read the repo, write Pages, mint an OIDC token for deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Do NOT cancel in-progress runs — a cancelled deploy
# can leave Pages serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      HUGO_ENVIRONMENT: production
      TZ: Asia/Kolkata
    steps:
      - name: Install Hugo
        run: |
          set -euo pipefail
          curl -fsSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # required: the theme is a submodule
          fetch-depth: 0          # required: Hugo .Lastmod uses git history

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          hugo --minify \
               --gc \
               --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
