baseURL = 'https://sushantbhargav.com/'
locale = 'en-in'
title = 'Sushant Bhargav'
theme = 'PaperMod'

enableRobotsTXT = true
enableGitInfo = true
buildDrafts = false
buildFuture = false
pygmentsUseClasses = true
# Obsidian's note templates live in content/_templates; they are not pages.
ignoreFiles = ['[\\/]_templates[\\/]']

# "Updated" dates come from git. A lastmod in front matter wins, for when a commit
# touched a file without really changing it.
[frontmatter]
  lastmod = ['lastmod', ':git', ':default']

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = 'production'
  description = 'Linux, infrastructure, and the gap between a spec and a system that survives production.'
  author = 'Sushant Bhargav'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  disableScrollToTop = false
  hidemeta = false
  comments = false
  mainSections = ['posts']
  # Used by the notebook shortcode to build Open in Colab links.
  notebookRepo = 'BhargavSushant/blog'
  notebookBranch = 'main'

  [params.homeInfoParams]
    Title = "Sushant Bhargav"
    Content = """
Infrastructure engineer. Eight years of Linux, mostly the parts that only show up at 3am.

I write about hardening, automation, and why plausible-looking configuration silently does nothing.
"""

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/BhargavSushant'

  [[params.socialIcons]]
    name = 'linkedin'
    url = 'https://www.linkedin.com/in/sushantbhargav/'

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

  [params.assets]
    disableHLJS = true
    favicon = '/favicon.ico'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'notes'
    name = 'Notes'
    url = '/notes/'
    weight = 15
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 20
  [[menu.main]]
    identifier = 'training'
    name = 'Training'
    url = '/training/'
    weight = 25
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    identifier = 'search'
    name = 'Search'
    url = '/search/'
    weight = 40

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'github-dark'
  [markup.goldmark.renderer]
    unsafe = true
  # Math: hands $...$, $$...$$, \(...\) and \[...\] to layouts/_markup/render-passthrough.html
  # ==text== highlights, as in Obsidian
  [markup.goldmark.extensions.extras.mark]
    enable = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]

[outputs]
  home = ['HTML', 'RSS', 'JSON']
